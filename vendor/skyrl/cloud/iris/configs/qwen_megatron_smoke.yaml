# Qwen3-0.6B on one colocated H100 node. This is the smallest Iris smoke that
# exercises Hugging Face mirroring, direct S3 Megatron/vLLM reads, one optimizer
# step, weight synchronization, and a direct S3 distributed checkpoint write.
entrypoint: standard

context_budget:
  request_window_tokens: 2048
  max_new_tokens_per_turn: 512
  max_turns: 1

environment:
  env_class: aime

trainer:
  strategy: megatron
  flash_attn: false
  use_sample_packing: false
  gradient_checkpointing: true
  algorithm:
    advantage_estimator: grpo
    use_kl_loss: false
  epochs: 1
  max_steps: 1
  update_epochs_per_batch: 1
  train_batch_size: 8
  policy_mini_batch_size: 8
  eval_batch_size: 8
  micro_forward_batch_size_per_gpu: 1
  micro_train_batch_size_per_gpu: 1
  eval_before_train: false
  eval_interval: -1
  ckpt_interval: 1
  resume_mode: none
  logger: console
  policy:
    optimizer_config:
      lr: 1.0e-6
      max_grad_norm: 1.0
    megatron_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      expert_model_parallel_size: 1
      expert_tensor_parallel_size: 1
      optimizer_checkpoint_sharding_type: dp_reshardable
  placement:
    colocate_all: true
    policy_num_nodes: 1
    policy_num_gpus_per_node: 8

generator:
  backend: vllm
  model_dtype: bfloat16
  vllm_attention_backend: FLASH_ATTN
  inference_engine_tensor_parallel_size: 1
  inference_engine_data_parallel_size: 1
  inference_engine_expert_parallel_size: 1
  num_inference_engines: 8
  n_samples_per_prompt: 2
  gpu_memory_utilization: 0.7
  enforce_eager: false
  run_engines_locally: true
  weight_sync_backend: nccl
  sampling_params:
    temperature: 1.0
    top_p: 1.0

data:
  kind: parquet
  train_data: []
  val_data: []

extra_env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
