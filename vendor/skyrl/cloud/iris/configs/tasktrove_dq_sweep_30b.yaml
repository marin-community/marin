entrypoint: terminal_bench

config_groups:
  terminal_bench_config: terminal_bench

context_budget:
  request_window_tokens: 131072
  max_new_tokens_per_turn: 16384
  max_turns: 90

terminal_bench:

  harbor:
    override_timeout_sec: 1800

    override_cpus: 1
    override_memory_mb: 2048
    override_storage_mb: 2048

    verifier_override_timeout_sec: 300

    max_retries: 3
    min_wait_sec: 60.0
    max_wait_sec: 600.0
    wait_multiplier: 2.0

    exclude_exceptions:
      - VerifierTimeoutError
      - RewardFileNotFoundError
      - RewardFileEmptyError
      - VerifierOutputParseError
      - VerifierRuntimeError

    n_concurrent_trials: 96

    enable_reward_shaping: true
    reward_shaper: identity_aware_pass_ratio
    reward_parser: null
    reward_shaping_fallback: true
    truncation_penalty: 0.25

    enable_error_classification: true
    mask_exceptions:
      - VerifierTimeoutError
      - DaytonaError
      - EnvironmentStartTimeoutError
      - NetworkError
      - ConnectionError
      - RewardFileNotFoundError
      - RewardFileEmptyError
    default_error_treatment: zero
    passthrough_exceptions:
      - AgentTimeoutError
      - ContextLengthExceededError

trainer:
  strategy: megatron
  attn_backend: sdpa
  flash_attn: false
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: true
  algorithm:
    advantage_estimator: rloo_n
    group_advantage_min_size: 4
    use_kl_loss: false
    kl_loss_coef: 0.0
    eps_clip_low: 0.2
    eps_clip_high: 0.05
    loss_reduction: sequence_mean
    policy_loss_type: behavior_clip

  epochs: 2
  max_steps: 80
  update_epochs_per_batch: 1

  train_batch_size: 64
  policy_mini_batch_size: 64
  eval_batch_size: 64

  micro_forward_batch_size_per_gpu: 1
  micro_train_batch_size_per_gpu: 1

  use_sample_packing: true

  eval_interval: 999999
  eval_before_train: false

  preflight_gate:
    enabled: true
    min_reward: 0.25
    max_reward: 0.75
    num_trials: 256
    on_failure: "warn"

  resume_mode: latest
  hf_hub_repo_id: null
  hf_hub_private: false
  hf_hub_revision: main

  enable_db_registration: true

  project_name: OpenThoughts-Agent
  log_level: INFO
  tracker_commit_each_step: true
  logger: wandb

  run_name: null
  ckpt_path: null
  export_path: null

  policy:
    optimizer_config:
      lr: 8e-6
      weight_decay: 0.0
      adam_betas: [0.9, 0.999]
      max_grad_norm: 0.9
      optimizer_kwargs:
        foreach: false
    megatron_config:
      moe_router_replay: true
      tensor_model_parallel_size: 4
      pipeline_model_parallel_size: 2
      context_parallel_size: 1
      expert_model_parallel_size: 4
      expert_tensor_parallel_size: 1
      transformer_config_kwargs:
        gradient_accumulation_fusion: false
  ref:
    model:
      path: Qwen/Qwen3-Coder-30B-A3B-Instruct
    megatron_config:
      moe_router_replay: true
      tensor_model_parallel_size: 4
      pipeline_model_parallel_size: 2
      context_parallel_size: 1
      expert_model_parallel_size: 4
      expert_tensor_parallel_size: 1
      transformer_config_kwargs:
        gradient_accumulation_fusion: false
  placement:
    colocate_all: false
    policy_num_nodes: 2
    ref_num_nodes: 2
    policy_num_gpus_per_node: 8
    ref_num_gpus_per_node: 8
    policy_strict_spread_pg: true
    policy_per_gpu_bundles: true
    policy_force_cvd_mask: true

  rollout_buffer:
    max_staleness_steps: 16
    max_in_flight: 128

generator:
  vllm_attention_backend: FLASH_ATTN
  backend: vllm
  timeout_multiplier: 1.0
  model_dtype: bfloat16

  enforce_eager: false

  inference_engine_tensor_parallel_size: 4
  num_inference_engines: 4
  inference_engine_expert_parallel_size: 4
  inference_engine_decode_context_parallel_size: 1
  inference_engine_mp_backend: false

  n_samples_per_prompt: 8
  eval_n_samples_per_prompt: 8

  gpu_memory_utilization: 0.80

  max_num_seqs: 24
  max_num_batched_tokens: 16384

  enable_prefix_caching: true
  enable_chunked_prefill: true

  run_engines_locally: true
  weight_sync_backend: nccl
  inference_stats_interval: 1

  sampling_params:
    temperature: 1.2
    top_p: 1.0
    top_k: -1

  engine_init_kwargs:
    disable_custom_all_reduce: true
    enable_return_routed_experts: true
    async_scheduling: false
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_coder

data:
  train_data: []
  val_data: []

trajectory_runner:
  rollout_workers:
    num_workers: 4
    cpus_per_worker: 8

extra_env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  NCCL_DEBUG: WARN
  VLLM_ALLOW_ROUTED_EXPERTS_DCP: "1"
  VLLM_MQ_MAX_CHUNK_BYTES_MB: "160"
  VLLM_ROUTED_EXPERTS_SIDE_TIMEOUT_SECONDS: "1200"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "900"
  TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "1800"
  TORCH_NCCL_ENABLE_MONITORING: "1"
  TORCH_NCCL_DUMP_ON_TIMEOUT: "1"
  TORCH_FR_BUFFER_SIZE: "2000"
  TORCH_NCCL_TRACE_CPP_STACK: "1"
  TORCH_NCCL_DEBUG_INFO_TEMP_FILE: /tmp/nccl_fr_rank
