# Snowball Ultra-style RLVR phase 1 with learner and rollout sharing 64 H100s.
entrypoint: standard

config_groups:
  terminal_bench_config: terminal_bench

context_budget:
  request_window_tokens: 65536
  max_new_tokens_per_turn: 6528
  max_turns: 999999
  generated_budget_fraction: 1.0

terminal_bench:
  harbor:
    override_timeout_sec: 1800
    verifier_override_timeout_sec: 300
    override_cpus: 1
    override_memory_mb: 4096
    override_storage_mb: 4096
    env_network_policy:
      mode: unrestricted
    max_retries: 3
    n_concurrent_trials: 256
    enable_reward_shaping: false
    enable_error_classification: true
    default_error_treatment: zero
trainer:
  strategy: megatron
  flash_attn: true
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: false
  algorithm:
    advantage_estimator: rloo_n
    group_advantage_min_size: 4
    advantage_batch_normalize: false
    eps_clip_low: 0.2
    eps_clip_high: 0.2
    use_entropy_loss: false
    use_kl_loss: false
    use_kl_in_reward: false
    loss_reduction: token_mean
  epochs: 1
  max_steps: 128
  update_epochs_per_batch: 1
  train_batch_size: 512
  policy_mini_batch_size: 512
  eval_batch_size: 100
  micro_forward_batch_size_per_gpu: 1
  micro_train_batch_size_per_gpu: 1
  use_sample_packing: true
  eval_before_train: true
  eval_interval: 16
  ckpt_interval: 8
  resume_mode: none
  logger: wandb
  project_name: snowball-ultra-rlvr
  policy:
    optimizer_config:
      optimizer: AdamW
      lr: 4.0e-6
      weight_decay: 0.0
      max_grad_norm: 0.5
    megatron_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 8
      expert_model_parallel_size: 8
      expert_tensor_parallel_size: 1
      optimizer_checkpoint_sharding_type: dp_reshardable
      ddp_config:
        overlap_grad_reduce: true
        overlap_param_gather: true
        grad_reduce_in_fp32: false
  ref:
    megatron_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 8
      expert_model_parallel_size: 8
      expert_tensor_parallel_size: 1
  placement:
    colocate_all: true
    colocate_policy_ref: true
    policy_num_nodes: 8
    policy_num_gpus_per_node: 8
    ref_num_nodes: 8
    ref_num_gpus_per_node: 8

generator:
  backend: vllm
  model_dtype: bfloat16
  vllm_attention_backend: FLASH_ATTN
  inference_engine_tensor_parallel_size: 1
  inference_engine_data_parallel_size: 8
  inference_engine_expert_parallel_size: 8
  num_inference_engines: 8
  n_samples_per_prompt: 16
  eval_n_samples_per_prompt: 1
  gpu_memory_utilization: 0.7
  max_num_seqs: 16
  max_num_batched_tokens: 16384
  enable_prefix_caching: true
  enable_chunked_prefill: true
  enforce_eager: false
  run_engines_locally: true
  weight_sync_backend: nccl
  sampling_params:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
  engine_init_kwargs:
    enable_auto_tool_choice: true
    tool_call_parser: hermes

environment:
  task_sessions:
    nemotron_ultra:
      judges:
        general:
          base_url: https://api.together.xyz/v1
          model: openai/gpt-oss-120b
          api_key_env: TOGETHER_API_KEY
          reasoning_effort: low
          timeout_seconds: 600.0
        safety:
          base_url: https://api.together.xyz/v1
          model: openai/gpt-oss-120b
          api_key_env: TOGETHER_API_KEY
          reasoning_effort: low
          timeout_seconds: 600.0
      genrm:
        judge:
          base_url: https://api.together.xyz/v1
          model: openai/gpt-oss-120b
          api_key_env: TOGETHER_API_KEY
          response_transport: chat_completions
          reasoning_effort: low
          timeout_seconds: 600.0
        max_output_tokens: 512
        temperature: 0.0
        top_p: 1.0

data:
  kind: parquet
  train_data:
    - s3://marin-us-east-02a/marin/users/benfeuer/datasets/snowball-ultra-rlvr/20260912-79f8eda15ea12e1adf7bb14dcb338a29d391b80e/tasktrove-v1/rlvr1/train.parquet
  val_data:
    - s3://marin-us-east-02a/marin/users/benfeuer/datasets/snowball-ultra-rlvr/20260912-79f8eda15ea12e1adf7bb14dcb338a29d391b80e/tasktrove-v1/rlvr1/validation.parquet
  terminal_bench_data:
    - s3://marin-us-east-02a/marin/users/benfeuer/datasets/snowball-ultra-rlvr/20260912-79f8eda15ea12e1adf7bb14dcb338a29d391b80e/tasktrove-swe-v1/tasks.parquet
  shuffle: false

extra_env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
