# @package trainer.algorithm
# MOPD section 3.2.1 and appendix A: https://arxiv.org/abs/2606.30406
advantage_estimator: uniform
policy_loss_type: importance_sampling
loss_reduction: sequence_mean
advantage_batch_normalize: false
use_kl_in_reward: false
use_kl_loss: false
dynamic_sampling:
  type: null
distillation:
  objective: sampled_reverse_kl
  reward_mode: replace
  advantage_clip: 5.0
