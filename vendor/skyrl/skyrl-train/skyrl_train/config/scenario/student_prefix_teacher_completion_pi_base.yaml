# @package _global_
# One expert-labeled action at every visited state; student controls a sampled
# prefix, then the teacher controls the rest of this physical Pi trial.
scenario:
  preset: student_prefix_teacher_completion_pi_base
trainer:
  step_wise_training: false
  algorithm:
    policy_loss_type: sft
    advantage_estimator: uniform
    dynamic_sampling:
      type: null
generator:
  n_samples_per_prompt: 1
  sampling_params:
    logprobs: 0
terminal_bench_config:
  harbor:
    verifier_disable: false
  installed_agent:
    agent:
      name: pi
      pi:
        mode: literal
    prefix_schedule:
      distribution: uniform_int
      min: 0
      max:
        scheduler: linear
        start: 0
        end: 4
        duration_iterations: 4
