# @package _global_
# One student attempt, private teacher critique, then one sampled student revision.
scenario:
  preset: critique_revision_pi_base
trainer:
  step_wise_training: false
  algorithm:
    policy_loss_type: sft
    advantage_estimator: uniform
    dynamic_sampling:
      type: null
generator:
  n_samples_per_prompt: 1
  sampling_params:
    logprobs: 0
terminal_bench_config:
  harbor:
    verifier_disable: false
  installed_agent:
    agent:
      name: pi
      pi:
        mode: literal
    critique_principle: "Give actionable feedback on the completed attempt without revealing the answer."
