[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marinskyrl-recipe"
version = "0.1.0"
description = "Typed authored SkyRL recipes"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12.2,<3"]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"../../marinskyrl/recipe_schema" = "marinskyrl/recipe_schema"
