# finelog server component: the store/query/server library plus the
# `finelog-server` binary. A member of the top-level rust/ workspace; the PyO3
# extension lives in the sibling `finelog-pyext` crate, and the shared profiles
# live in the workspace root Cargo.toml.
[package]
name = "finelog"
version = "0.1.0"
edition = "2021"

# Native finelog server. Unlike `dupekit` (a PyO3 cdylib), finelog is a
# standalone binary that speaks the finelog Connect/RPC protocol over HTTP —
# the RPC socket is the boundary with the Python client, so no PyO3.
[[bin]]
name = "finelog-server"
path = "src/main.rs"

[lib]
name = "finelog"
path = "src/lib.rs"

[dependencies]
connectrpc = { version = "0.6", features = ["axum", "gzip", "zstd"] }
buffa = { version = "0.6", features = ["json"] }
buffa-types = { version = "0.6", features = ["json"] }
serde.workspace = true
serde_json = "1"
# EdDSA (Ed25519) JWT verification for the authenticated ingress front. The
# delegation tokens are asymmetric: a relaying controller signs with its private
# key and finelog verifies against that cluster's inline public key. jsonwebtoken
# 10 dropped the `ring` backend and forces an explicit crypto provider; we pick
# the pure-Rust `rust_crypto` (ed25519-dalek + hmac/sha2) over `aws_lc_rs` to
# avoid pulling the aws-lc C/asm build toolchain, and we do not hand-roll JWS.
# `use_pem` (the only default feature) keeps the PEM key loaders (`from_ed_pem`).
# `ring` still reaches the tree via the TLS/object_store stack, so this choice
# does not add it — nor, now, remove it. The version/features are the workspace pin
# (shared with iris-proxy, which verifies the same EdDSA tokens).
jsonwebtoken.workspace = true
axum.workspace = true
# HTTPS transport for the forwarder's outbound client. connectrpc's generated
# `LogServiceClient` is generic over `ClientTransport`, and `ServiceTransport`
# adapts any tower service -- including hyper-util's pooled client -- so we supply
# our own connector instead of enabling connectrpc's `client-tls` feature. That
# feature depends on `rustls` with DEFAULT features, which selects the `aws_lc_rs`
# provider and its C/cmake build; every crate below is pinned to `ring` so the
# tree keeps exactly one rustls provider and the Dockerfile needs no new toolchain.
# `webpki-roots` ships the trust anchors in the binary, so the container's CA
# bundle is not a deploy-time dependency.
http = "1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = [
    "client",
    "client-legacy",
    "http1",
    "http2",
    "tokio",
] }
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "http2",
    "tls12",
    "ring",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
webpki-roots = "1"
# ServeDir static-file service for the Vue SPA `/static` mount. The `fs` feature is
# the only one needed; tower-http 0.6 is compatible with the crate's axum 0.7
# tower::Service contract. `tower` (already in the lock via axum/tower-http)
# supplies the `Service` trait bound for the SPA catch-all's method-fallback to the
# connect service.
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
http-body = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# ColumnType<->Arrow DataType map, Arrow IPC decode, and the parquet L0
# writer/footer reader. The parquet `async`/`object_store` features back remote
# footer reads. arrow/parquet track datafusion below (datafusion 53 -> arrow 58),
# and this is the version the whole workspace pins to: dupekit's kernels ride the
# same arrow 58, and arrow-pyarrow 58 fixes the shared pyo3 at 0.28. When a
# datafusion release ships arrow 59, arrow and pyo3 move up together.
arrow = "58"
parquet = { version = "58", features = ["async", "object_store"] }
bytes = "1"
futures = "0.3"
# The DataFusion read engine. DataFusion 53 re-exports arrow/parquet 58 (matching
# the pins above), so the finelog binary keeps EXACTLY ONE arrow version.
# `object_store` is the same version datafusion uses internally; the `gcp` feature
# is for remote reads. `async-trait` is required to impl datafusion's
# `#[async_trait] TableProvider`; `url` is for register_object_store.
datafusion = "53"
# Internal DataFusion crates, reached directly only for the trigram row-group
# prune: `PartitionedFile`/`ParquetAccessPlan` (the "advanced parquet index"
# seam) are not re-exported by the `datafusion` umbrella. Same major as
# `datafusion` so cargo unifies them to its pinned 53.x — keeping EXACTLY ONE
# copy of these types (a mismatched version would make the opener's
# `downcast_ref::<ParquetAccessPlan>()` silently miss).
datafusion-datasource = "53"
datafusion-datasource-parquet = "53"
object_store = { version = "0.13", features = ["gcp", "aws"] }
async-trait = "0.1"
url = "2"
# Rust-owned catalog sidecar; `bundled` keeps the build hermetic (no system
# sqlite). Distinct file from Python's DuckDB registry — never aliased.
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"

# Process allocator (see the `#[global_allocator]` in `main.rs`). The default
# glibc malloc retains freed query-buffer pages in its per-CPU arenas instead of
# returning them to the OS, so RSS pins at the high-water mark of the largest
# query (measured ~3.5x higher, drifting, vs jemalloc for repeated heavy scans).
# jemalloc's background thread purges dirty pages on a decay schedule, so RSS
# tracks real usage. Unix-only; the deploy target is Linux.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }

[build-dependencies]
connectrpc-build = "0.6"
# Vendors a pinned protoc so the build needs no system protoc. connectrpc-build
# shells out to protoc to parse the .proto files, and our protos use
# `edition = "2023"`, which requires protoc >= 27.
protoc-bin-vendored = "3"
