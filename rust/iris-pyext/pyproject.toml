[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "marin-iris-native"
version = "0.1.2"
description = "Native runtime components for Iris."
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/marin-community/marin"
Issues = "https://github.com/marin-community/marin/issues"

[tool.maturin]
# This crate (iris-pyext) IS the cdylib: a thin PyO3 shim over the sibling
# `iris-proxy` dataplane lib in the top-level rust/ workspace. The module is
# top-level `iris_native`.
manifest-path = "Cargo.toml"
module-name = "iris_native"
features = ["pyo3/extension-module"]

[tool.uv]
# Rebuild the extension when the Rust sources change, not just pyproject.toml.
# Because this pyext depends on the sibling `iris-proxy` crate, the keys reach
# across the workspace: an edit under ../iris-proxy must invalidate this wheel or
# dev mode serves a stale build. If a uv version does not honor these
# parent-relative globs, force a rebuild with
# `uv sync --reinstall-package marin-iris-native`.
cache-keys = [
    "pyproject.toml",
    "Cargo.toml",
    "src/**/*.rs",
    "iris_native.pyi",
    "../Cargo.toml",
    "../Cargo.lock",
    "../iris-proxy/Cargo.toml",
    "../iris-proxy/src/**/*.rs",
]
