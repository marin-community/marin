name: "Ops - Nightshift Doc Drift"

on:
  schedule:
    - cron: '0 11 * * 0'
  workflow_dispatch:

concurrency:
  group: nightshift-doc-drift
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  doc-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted workflow action
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/actions/launch-loom-run
          sparse-checkout-cone-mode: false
      - name: Launch documentation audit
        uses: ./.github/actions/launch-loom-run
        with:
          profile: ${{ vars.LOOM_GITHUB_AUTOMATION_PROFILE }}
          idempotency-key: nightshift-doc-drift:${{ github.run_id }}:${{ github.run_attempt }}
          title: "Nightshift docs audit ${{ github.run_id }}"
          goal: >-
            Audit documentation drift in ${{ github.repository }} using the
            scope and candidate policy in infra/cron/nightshift_doc_drift.py.
            Verify discrepancies against current code, then follow the commit
            and PR workflow for supported corrections. Do not invoke the legacy
            Claude runner. Publish a typed result.
          base: ${{ github.sha }}
