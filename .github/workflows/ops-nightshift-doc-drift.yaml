name: "Ops - Nightshift Doc Drift"

on:
  schedule:
    - cron: '0 11 * * 0'
  workflow_dispatch:

concurrency:
  group: nightshift-doc-drift
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  doc-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted workflow action
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/actions/launch-loom-run
          sparse-checkout-cone-mode: false
      - name: Launch documentation audit
        uses: ./.github/actions/launch-loom-run
        with:
          profile: ${{ vars.LOOM_GITHUB_AUTOMATION_PROFILE }}
          idempotency-key: nightshift-doc-drift:${{ github.run_id }}:${{ github.run_attempt }}
          title: "Nightshift docs audit ${{ github.run_id }}"
          goal: >-
            Audit one subfolder of docs/ in ${{ github.repository }}. If it has
            fewer than three Markdown files, include its parent folder. Check
            code references, examples, internal links, and configuration
            options against current code. Fix meaningful drift under AGENTS.md
            and the update-docs and commit skills. Open a PR with agent-generated
            and nightshift labels for a supported correction; file an issue
            for larger documented gaps. Publish a typed result, including what
            was checked if no change was warranted.
          base: ${{ github.sha }}
