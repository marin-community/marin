name: "Ops - GCP IAM drift"

# Weekly scan for live GCP IAM that diverges from infra/pulumi's iam_data.py. Every grant there
# is non-authoritative, so `pulumi preview` only sees drift on bindings already in state; this
# re-enumerates the live surface and files findings on a sticky GitHub issue. Reads live IAM as
# the same read-only pulumi-ci account the preview workflow uses (Workload Identity Federation).

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch: {}

concurrency:
  group: ops-iam-drift
  cancel-in-progress: false

permissions:
  contents: read

env:
  PULUMI_CI_SERVICE_ACCOUNT: pulumi-ci@hai-gcp-models.iam.gserviceaccount.com
  PULUMI_CI_PROJECT: hai-gcp-models

jobs:
  iam-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PULUMI_CI_PROJECT }}
          workload_identity_provider: projects/748532799086/locations/global/workloadIdentityPools/github-pool/providers/github-oidc
          service_account: ${{ env.PULUMI_CI_SERVICE_ACCOUNT }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync the iac venv
        run: uv sync --package marin-iac --extra deploy --frozen

      - name: Ensure the iam-drift label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create iam-drift --color B60205 --description "GCP IAM drift outside Pulumi" --force

      - name: Scan for IAM drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --package marin-iac --extra deploy --frozen python infra/pulumi/iam_drift.py \
            --project "$PULUMI_CI_PROJECT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
