name: "Ops - External Dependency Update"

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: ops-external-dependencies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: external-runtime-updater
    permissions:
      contents: read
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEPENDENCY_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATER_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Prepare update branch
        id: prepare
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python -m scripts.ci.dependency_update prepare \
            --kind external-runtime \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve external dependency heads
        id: update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BODY: ${{ runner.temp }}/external-dependencies.md
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: |
          set -euo pipefail
          uv run config/update-external.py --summary-file "$PR_BODY"
          cat "$PR_BODY" >> "$GITHUB_STEP_SUMMARY"

          changed=$(python -m scripts.ci.dependency_update changed-files --kind external-runtime)

          if [[ -z "$changed" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All external dependency pins already match their configured heads."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        id: pull-request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BODY: ${{ runner.temp }}/external-dependencies.md
        run: |
          python -m scripts.ci.dependency_update publish \
            --kind external-runtime \
            --repository "$GITHUB_REPOSITORY" \
            --body-file "$PR_BODY" \
            --expected-remote-sha "${{ steps.prepare.outputs.expected_remote_sha }}" \
            --pull-request-url "${{ steps.prepare.outputs.pr_url }}" \
            --push-mode "${{ steps.prepare.outputs.push_mode }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Merge green runtime update
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python -m scripts.ci.dependency_update merge \
            --kind external-runtime \
            --pr "${{ steps.pull-request.outputs.pr_url }}" \
            --repository "$GITHUB_REPOSITORY" \
            --app-slug "${{ vars.DEPENDENCY_UPDATER_APP_SLUG }}" \
            --expected-head-sha "${{ steps.pull-request.outputs.head_sha }}" \
            --timeout 3600
