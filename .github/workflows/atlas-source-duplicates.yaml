name: Atlas source overlap

on:
  pull_request:
    paths:
      - 'experiments/post_training/task_curation/**'
      - 'lib/taskcompendium/src/taskcompendium/convert/**'
      - '.github/workflows/atlas-source-duplicates.yaml'
  workflow_dispatch:
    inputs:
      base_ref:
        description: Source declaration baseline
        required: true
        default: origin/main

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-source-overlap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  overlap:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CW_KEY_ID: ${{ secrets.CW_ACCESS_KEY_ID }}
      CW_KEY_SECRET: ${{ secrets.CW_SECRET_ACCESS_KEY }}
      HF_TOKEN: ${{ secrets.ATLAS_REGISTRY_HF_TOKEN }}
      BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --extra cpu --no-default-groups
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/748532799086/locations/global/workloadIdentityPools/github-pool/providers/github-oidc
          service_account: github-iris@hai-gcp-models.iam.gserviceaccount.com
      - name: Require fingerprints for changed sources
        id: prepare
        run: |
          mkdir -p atlas-overlap-inputs
          uv run --no-sync python -m experiments.post_training.task_curation.source_duplicate_ci \
            --base-ref "$BASE_REF" \
            --index experiments/post_training/task_curation/source_fingerprint_index.json \
            --output atlas-overlap-inputs/fingerprints.json --changed-output atlas-overlap-inputs/changed.json
          echo "changed=$(python -c 'import json; print("true" if json.load(open("atlas-overlap-inputs/changed.json")) else "false")')" >> "$GITHUB_OUTPUT"
      - name: Stage generated overlap inputs outside the workspace bundle
        if: steps.prepare.outputs.changed == 'true'
        run: |
          sha256sum atlas-overlap-inputs/fingerprints.json atlas-overlap-inputs/changed.json > atlas-overlap-inputs/sha256.txt
          uv run --no-sync fsutil cp -n atlas-overlap-inputs/fingerprints.json atlas-overlap-inputs/changed.json \
            s3://marin-us-east-02a/marin/rl-data/atlas/source-identity/ci/${{ github.run_id }}-${{ github.run_attempt }}/
      - name: Measure shortlisted pairs against complete source populations
        if: steps.prepare.outputs.changed == 'true'
        run: |
          # github-iris is admitted by auth.allowed_submitters in lib/iris/config/cw-us-east-08a.yaml.
          uv run --no-sync iris --config lib/iris/config/marin.yaml job run \
            --target-cluster cw-us-east-08a --job-name atlas-overlap-${{ github.run_id }}-${{ github.run_attempt }} \
            --cpu 16 --memory 64G --disk 64G --enable-extra-resources --extra cpu \
            --timeout 259200 --no-cancel-on-exit --max-retries 0 --priority production \
            --exclude '^atlas-overlap-inputs/.*[.]json$' --include 'atlas-overlap-inputs/sha256.txt' \
            -- bash -lc 'set -e
              mkdir -p atlas-overlap-inputs
              uv run --no-sync fsutil cp \
                s3://marin-us-east-02a/marin/rl-data/atlas/source-identity/ci/${{ github.run_id }}-${{ github.run_attempt }}/fingerprints.json \
                s3://marin-us-east-02a/marin/rl-data/atlas/source-identity/ci/${{ github.run_id }}-${{ github.run_attempt }}/changed.json \
                atlas-overlap-inputs/
              sha256sum --check atlas-overlap-inputs/sha256.txt
              uv run --no-sync python -m experiments.post_training.task_curation.source_duplicates scan \
              --fingerprints atlas-overlap-inputs/fingerprints.json --changed-sources atlas-overlap-inputs/changed.json \
              --top-k 3 \
              --acknowledgements experiments/post_training/task_curation/source_duplicate_acknowledgements.json \
              --require-acknowledged --output "$IRIS_OUTPUT_DIR/review.json"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-source-overlap
          path: atlas-overlap-inputs/
