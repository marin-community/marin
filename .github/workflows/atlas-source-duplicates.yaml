name: Atlas source overlap

on:
  pull_request:
    paths:
      - 'experiments/post_training/task_curation/**'
      - 'lib/taskcompendium/src/taskcompendium/convert/**'
      - '.github/workflows/atlas-source-duplicates.yaml'
  workflow_dispatch:
    inputs:
      base_ref:
        description: Source declaration baseline
        required: true
        default: origin/main
      route:
        description: JudgeEndpoint route
        type: choice
        options: [local, hosted]
        default: local

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-source-overlap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  overlap:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CW_KEY_ID: ${{ secrets.CW_ACCESS_KEY_ID }}
      CW_KEY_SECRET: ${{ secrets.CW_SECRET_ACCESS_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ATLAS_DUPLICATE_JUDGE_API_KEY: ${{ secrets.ATLAS_DUPLICATE_JUDGE_API_KEY }}
      ATLAS_DUPLICATE_JUDGE_BASE_URL: ${{ vars.ATLAS_DUPLICATE_JUDGE_BASE_URL }}
      ROUTE: ${{ inputs.route || vars.ATLAS_DUPLICATE_JUDGE_ROUTE || 'local' }}
      BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --extra cpu --extra dedup --no-default-groups
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/748532799086/locations/global/workloadIdentityPools/github-pool/providers/github-oidc
          service_account: github-iris@hai-gcp-models.iam.gserviceaccount.com
      - name: Require fingerprints for changed sources
        id: prepare
        run: |
          mkdir -p atlas-overlap-inputs
          uv run --no-sync python -m experiments.post_training.task_curation.source_duplicate_ci \
            --base-ref "$BASE_REF" \
            --index experiments/post_training/task_curation/source_fingerprint_index.json \
            --output atlas-overlap-inputs/fingerprints.json --changed-output atlas-overlap-inputs/changed.json
          echo "changed=$(python -c 'import json; print("true" if json.load(open("atlas-overlap-inputs/changed.json")) else "false")')" >> "$GITHUB_OUTPUT"
      - name: Review shortlisted pairs on hosted endpoint
        if: steps.prepare.outputs.changed == 'true' && env.ROUTE == 'hosted'
        run: |
          uv run --no-sync python -m experiments.post_training.task_curation.source_duplicates scan \
            --fingerprints atlas-overlap-inputs/fingerprints.json --changed-sources atlas-overlap-inputs/changed.json \
            --top-k 3 --route hosted --base-url "$ATLAS_DUPLICATE_JUDGE_BASE_URL" \
            --api-key-env ATLAS_DUPLICATE_JUDGE_API_KEY \
            --acknowledgements experiments/post_training/task_curation/source_duplicate_acknowledgements.json \
            --require-acknowledged --output atlas-overlap-inputs/review.json
      - name: Review shortlisted pairs in an owned local-model lease
        if: steps.prepare.outputs.changed == 'true' && env.ROUTE == 'local'
        run: |
          uv run --no-sync iris --config lib/iris/config/marin.yaml job run \
            --target-cluster cw-rno2a --job-name atlas-overlap-${{ github.run_id }}-${{ github.run_attempt }} \
            --cpu 2 --memory 8G --disk 16G --enable-extra-resources --extra cpu \
            --timeout 3600 --max-retries 0 --priority production \
            --include 'atlas-overlap-inputs/*.json' \
            -- bash -lc 'uv run --no-sync python -m experiments.post_training.task_curation.source_duplicates scan \
              --fingerprints atlas-overlap-inputs/fingerprints.json --changed-sources atlas-overlap-inputs/changed.json \
              --top-k 3 --route local \
              --acknowledgements experiments/post_training/task_curation/source_duplicate_acknowledgements.json \
              --require-acknowledged --output "$IRIS_OUTPUT_DIR/review.json"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-source-overlap
          path: atlas-overlap-inputs/
