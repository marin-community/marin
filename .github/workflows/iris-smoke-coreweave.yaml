name: "Iris - Smoke - CoreWeave"

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "lib/iris/**"
      - ".github/workflows/iris-smoke-coreweave.yaml"
      - "scripts/ci/iris_monitor.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  statuses: write       # post commit status from workflow_dispatch trigger

# Shared concurrency group with marin-canary-ferry-coreweave.yaml — both rebuild/roll
# the shared iris-ci controller and submit against the shared H100 in
# US-WEST-04A. Only one run cluster-wide at a time. cancel-in-progress=false
# so a mid-flight canary is not killed by a PR firing.
concurrency:
  group: iris-coreweave-ci-shared
  cancel-in-progress: false

jobs:
  cw-ci-test:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IRIS_NAMESPACE: iris-ci
      # Must match Labels(label_prefix).iris_managed from the cluster config
      IRIS_MANAGED_LABEL: iris-iris-ci-managed
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set commit status to pending
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/"$sha" \
            -f state=pending \
            -f context="Iris CoreWeave CI" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "lib/iris/pyproject.toml"

      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.CW_KUBECONFIG }}" > ~/.kube/coreweave-iris
          chmod 600 ~/.kube/coreweave-iris

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cw-us-west-04a.yaml's auth.signing_key falls through to a gcp-secret:// reference
      # (no IRIS_SIGNING_KEY is exported here) — `cluster start` resolves it via Secret
      # Manager in this shell before mounting it through the controller-only Secret.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.IRIS_CI_GCP_SA_KEY }}

      # Delete stale worker pods so the autoscaler recreates them with fresh images.
      # Nodepools (and their underlying nodes) survive — this is the "warm start".
      - name: Reset worker pods
        run: |
          export KUBECONFIG=~/.kube/coreweave-iris
          kubectl delete pods -n "$IRIS_NAMESPACE" -l "$IRIS_MANAGED_LABEL=true" --grace-period=0 --ignore-not-found || true

      # CI rolls controller images without applying Pulumi. Reconcile the shared
      # secret-delivery manifests in iris-ci before the controller's RBAC preflight.
      - name: Prepare CI secret delivery permissions
        run: |
          cd lib/iris && uv run --group dev --extra controller python - <<'PY'
          import os
          from pathlib import Path

          from iris.cluster.config import load_config
          from iris.cluster.platforms.k8s.rbac_manifests import (
              task_secret_role_manifest,
              task_secret_binding_manifest,
          )
          from iris.cluster.platforms.k8s.service import CloudK8sService

          config = load_config("config/cw-us-west-04a.yaml")
          namespace = os.environ["IRIS_NAMESPACE"]
          assert namespace == config.kubernetes_provider.namespace == "iris-ci"
          assert config.platform.coreweave is not None
          kubectl = CloudK8sService(
              namespace=namespace,
              kubeconfig_path=str(Path.home() / ".kube/coreweave-iris"),
              context=config.platform.coreweave.kube_context,
          )
          for manifest in (
              task_secret_role_manifest(namespace),
              task_secret_binding_manifest(namespace, "iris-controller"),
          ):
              kubectl.apply_json(manifest)
          PY

      # Rebuild images and roll the controller. Infrastructure and base RBAC
      # remain managed by Pulumi.
      #
      # --extra controller: resolving the gcp-secret:// signing key above needs
      # marin-rigging[secrets] (Secret Manager client), which only the `controller`
      # extra pulls in — `--group dev` alone does not.
      - name: Start controller
        env:
          CW_KEY_ID: ${{ secrets.CW_ACCESS_KEY_ID }}
          CW_KEY_SECRET: ${{ secrets.CW_SECRET_ACCESS_KEY }}
        run: |
          cd lib/iris && uv run --group dev --extra controller iris -v \
            --config=config/cw-us-west-04a.yaml \
            cluster start --fresh --image-platform linux/amd64

      - name: Connect to iris-ci controller
        run: |
          uv run python scripts/ci/iris_monitor.py coreweave-controller \
            --namespace "$IRIS_NAMESPACE" \
            --kubeconfig "$HOME/.kube/coreweave-iris" \
            --log-path "$RUNNER_TEMP/iris-cw-port-forward.log"

      - name: Run Marin integration pipeline
        env:
          WANDB_MODE: disabled
          WANDB_API_KEY: ""
          JAX_TRACEBACK_FILTERING: off
          MARIN_CI_S3_PREFIX: s3://marin-us-east-08a/tmp/ttl=3d/ci
          CW_KEY_ID: ${{ secrets.CW_ACCESS_KEY_ID }}
          CW_KEY_SECRET: ${{ secrets.CW_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CW_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CW_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://cwobject.com
          FSSPEC_S3: '{"endpoint_url": "https://cwobject.com", "client_kwargs": {"region_name": "auto"}, "config_kwargs": {"s3": {"addressing_style": "virtual"}}}'
        run: |
          timeout 1800 uv run pytest tests/test_integration_test.py \
            -m integration -o "addopts=" --timeout=900 -v -s

      - name: Capture failure diagnostics
        if: failure()
        continue-on-error: true
        env:
          LOG_DIR: ${{ github.workspace }}/iris-cw-logs
        run: |
          mkdir -p "$LOG_DIR"
          if [ -n "${PF_LOG:-}" ] && [ -f "$PF_LOG" ]; then
            cp "$PF_LOG" "$LOG_DIR/port-forward.log"
          fi
          uv run python scripts/ci/iris_monitor.py collect \
            --job-id "ci-smoke" \
            --controller-url "$IRIS_CONTROLLER_URL" \
            --provider coreweave \
            --output-dir "$LOG_DIR" \
            --namespace "$IRIS_NAMESPACE" \
            --managed-label "$IRIS_MANAGED_LABEL" \
            --kubeconfig "$HOME/.kube/coreweave-iris"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iris-cw-ci-logs
          path: iris-cw-logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop port-forward
        if: always()
        run: |
          if [ -n "${PF_PID:-}" ]; then
            kill "$PF_PID" 2>/dev/null || true
          fi
          pkill -f "kubectl.*$IRIS_NAMESPACE.*port-forward.*pod/iris-controller" 2>/dev/null || true
          pkill -f "kubectl.*port-forward.*$IRIS_NAMESPACE.*pod/iris-controller" 2>/dev/null || true

      - name: Set commit status to result
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          if [ "${{ job.status }}" = "success" ]; then
            state=success
          else
            state=failure
          fi
          gh api repos/${{ github.repository }}/statuses/"$sha" \
            -f state="$state" \
            -f context="Iris CoreWeave CI" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
