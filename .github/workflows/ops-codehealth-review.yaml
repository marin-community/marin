name: "Ops - Code-health Review Data"

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  group: codehealth-review-data
  cancel-in-progress: false

env:
  LOOM_URL: ${{ vars.LOOM_URL || 'https://loom.oa.dev' }}

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/launch-loom-run
          sparse-checkout-cone-mode: false

      - name: Launch Weaver aggregation
        uses: ./.github/actions/launch-loom-run
        with:
          loom-url: ${{ env.LOOM_URL }}
          profile: ${{ vars.LOOM_CODEHEALTH_PROFILE }}
          idempotency-key: codehealth:${{ github.run_id }}:${{ github.run_attempt }}
          title: Aggregate code-health review data
          goal: >-
            From the repository root, run 'uv run python -m
            infra.codehealth.review aggregate --days 7' and require every
            GitHub fetch, Codex classification batch, and Finelog flush to
            succeed.
