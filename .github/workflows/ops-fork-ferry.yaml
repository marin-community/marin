name: "Ops - Fork Ferry"

# Ask Weaver to refresh each supported fork unit weekly. The refresh-fork skill owns the migration;
# this workflow only names the forks to update.

on:
  schedule:
    - cron: "0 8 * * 1"  # Mondays 08:00 UTC
  workflow_dispatch:
    inputs:
      unit:
        description: "single unit to refresh; empty runs all"
        required: false
        default: ""

concurrency:
  group: fork-ferry
  cancel-in-progress: false

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - unit: tpu-vllm
            forks: tpu-inference and vllm together
          - unit: evalchemy
            forks: evalchemy
          - unit: harbor
            forks: harbor
    permissions: {}
    steps:
      - name: Request refresh of ${{ matrix.unit }}
        if: ${{ github.event.inputs.unit == '' || github.event.inputs.unit == matrix.unit }}
        env:
          # This PAT must belong to a Loom-approved CI account. Loom ignores weaverbot's own comments.
          GH_TOKEN: ${{ secrets.WEAVERBOT_GH_TOKEN }}
          FORKS: ${{ matrix.forks }}
          UNIT: ${{ matrix.unit }}
        run: |
          trigger_actor=$(gh api user --jq .login)
          if [[ "$trigger_actor" == "weaverbot" ]]; then
            echo "::error::WEAVERBOT_GH_TOKEN authenticates as weaverbot, whose comments Loom ignores."
            exit 1
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "[fork-ferry] Refresh $UNIT (run $GITHUB_RUN_ID)" \
            --label agent-generated \
            --body "@weaverbot Use the refresh-fork skill to update $FORKS."
