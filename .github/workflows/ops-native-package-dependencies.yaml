name: "Ops - Native Package Dependency Update"

on:
  workflow_run:
    workflows: ["Marin - Release Packages"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: ops-native-package-dependencies
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: external-runtime-updater
    env:
      BRANCH: automation/native-package-versions
      TITLE: "[dependencies] Advance native package versions"
    steps:
      - name: Generate repository app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EXTERNAL_RUNTIME_UPDATER_APP_ID }}
          private-key: ${{ secrets.EXTERNAL_RUNTIME_UPDATER_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: astral-sh/setup-uv@v7

      - name: Prepare shared update branch
        id: prepare
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          pr_url=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json url \
            --jq '.[0].url // ""')

          set +e
          git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null
          branch_status=$?
          set -e
          if [[ "$branch_status" == "0" ]]; then
            git fetch origin "$BRANCH"
            echo "force_push=true" >> "$GITHUB_OUTPUT"
          elif [[ "$branch_status" == "2" ]]; then
            echo "force_push=false" >> "$GITHUB_OUTPUT"
          else
            echo "Could not inspect origin/$BRANCH"
            exit "$branch_status"
          fi

          git switch -C "$BRANCH" origin/main
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Resolve published native packages
        id: releases
        run: |
          python scripts/ci/package_release.py latest-native-releases \
            --github-output "$GITHUB_OUTPUT"

      - name: Advance compatibility floors and lock
        id: bump
        env:
          VERSIONS: ${{ steps.releases.outputs.versions }}
        run: |
          python scripts/ci/package_release.py bump-releases \
            --versions "$VERSIONS" \
            --github-output "$GITHUB_OUTPUT"

      - name: Open or update pull request
        id: pull-request
        if: steps.bump.outputs.changed == 'true'
        env:
          BODY_FILE: .github/native-package-version-pr.md
          FORCE_PUSH: ${{ steps.prepare.outputs.force_push }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.prepare.outputs.pr_url }}
          REQUIREMENT_PATHS: ${{ steps.bump.outputs.requirement_paths }}
        run: |
          set -euo pipefail
          read -ra requirement_paths <<< "$REQUIREMENT_PATHS"
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' "${requirement_paths[@]}" uv.lock | sort)
          if [[ "$changed" != "$expected" ]]; then
            echo "Unexpected changed files:"
            echo "$changed"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${requirement_paths[@]}" uv.lock
          git commit -m "$TITLE"
          if [[ "$FORCE_PUSH" == "true" ]]; then
            git push --force-with-lease origin "HEAD:$BRANCH"
          else
            git push origin "HEAD:$BRANCH"
          fi

          pr_url="$PR_URL"
          if [[ -z "$pr_url" ]]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file "$BODY_FILE" \
              --label agent-generated \
              --label dependencies >/dev/null
            pr_url=$(gh pr view "$BRANCH" --json url --jq .url)
          else
            gh pr edit "$pr_url" \
              --title "$TITLE" \
              --body-file "$BODY_FILE" \
              --add-label agent-generated \
              --add-label dependencies >/dev/null
          fi
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Updated $pr_url"

      - name: Merge green native package update
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python scripts/ci/dependency_update.py merge \
            --kind native-package \
            --pr "${{ steps.pull-request.outputs.pr_url }}" \
            --repository "$GITHUB_REPOSITORY" \
            --app-slug "${{ vars.EXTERNAL_RUNTIME_UPDATER_APP_SLUG }}" \
            --expected-head-sha "${{ steps.pull-request.outputs.head_sha }}" \
            --timeout 3600
