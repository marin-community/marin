name: "Belay - #9514 intake"

# Push each new or edited comment on the Marin Belay intake issue (#9514) to the Belay app the moment it is posted,
# so a trusted submitter's idea is approved within seconds instead of at the next Belay watch pass. The job signs in
# as belay-intake@ through GitHub's OIDC federation (main branch only) and calls the app through Marina's IAP; the
# app accepts this identity on POST /intake/comments only. The comment travels as data from the event file, never
# through a shell interpolation.

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  id-token: write

concurrency:
  group: belay-intake-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  push:
    if: github.event.issue.number == 9514 && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate as belay-intake
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: hai-gcp-models
          workload_identity_provider: projects/748532799086/locations/global/workloadIdentityPools/github-pool/providers/github-oidc
          service_account: belay-intake@hai-gcp-models.iam.gserviceaccount.com
          token_format: id_token
          # Marina's IAP accepts service-account tokens for the Marin desktop OAuth client (rigging.auth).
          id_token_audience: 748532799086-qf8m6mvovtdmd71npm07gk1ohijsr3q5.apps.googleusercontent.com
          id_token_include_email: true
      - name: Push the comment to the Belay app
        env:
          BELAY_INTAKE_URL: https://applets.marina.oa.dev/a/33801d46-e280-46f9-b994-2c78603cdf15/api/intake/comments
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          jq '{comment_id: (.comment.id | tostring), author: .comment.user.login, body: .comment.body,
               url: .comment.html_url, posted_at: .comment.created_at}' "$GITHUB_EVENT_PATH" |
            curl --fail-with-body --silent --show-error -X POST "$BELAY_INTAKE_URL" \
              -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' --data-binary @-
