name: Verify cache retention access
on:
  workflow_dispatch:
permissions:
  packages: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [iris-cache, finelog-cache]
    env:
      PACKAGE: ${{ matrix.package }}
      GH_TOKEN: ${{ github.token }}
      TAG: retention-01a10d2b-${{ github.run_id }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish one owned marker cache version
        run: |
          mkdir -p fixture
          printf '%s\n' "$GITHUB_RUN_ID/$PACKAGE" > fixture/marker
          printf '%s\n' 'FROM scratch' 'COPY marker /marker' > fixture/Dockerfile
          docker buildx build --output type=cacheonly \
            --cache-to type=registry,ref="ghcr.io/$GITHUB_REPOSITORY_OWNER/$PACKAGE:$TAG",mode=max,oci-mediatypes=true,image-manifest=true \
            fixture
      - name: Select only the owned marker version
        id: marker
        run: |
          PACKAGE_PATH=$(jq -rn --arg name "$PACKAGE" '$name | @uri')
          ID=$(gh api "orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$PACKAGE_PATH/versions?per_page=100" |
            jq -r --arg tag "$TAG" '[.[] | select(.metadata.container.tags == [$tag])] | first | .id // empty')
          test -n "$ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          package-version-ids: ${{ steps.marker.outputs.id }}
      - name: Verify the marker version was removed
        env:
          VERSION_ID: ${{ steps.marker.outputs.id }}
          PACKAGE_PATH: ${{ steps.marker.outputs.path }}
        run: |
          if gh api "orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$PACKAGE_PATH/versions/$VERSION_ID" > readback.json; then exit 1; fi
          jq -e '.status | tostring == "404"' readback.json
