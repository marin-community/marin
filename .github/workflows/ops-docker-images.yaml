name: Cache metadata inventory
on:
  workflow_dispatch:
permissions:
  packages: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python 3.12
      - name: Inspect cache metadata with the owning repository token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location https://raw.githubusercontent.com/marin-community/vllm/aab6b8382/infra/release/cache_inventory.py --output "$RUNNER_TEMP/cache_inventory.py"
          .venv/bin/python "$RUNNER_TEMP/cache_inventory.py"
      - uses: actions/upload-artifact@v7
        with:
          name: cache-inventory-marin
          path: artifacts/cache-inventory.json
          retention-days: 14
