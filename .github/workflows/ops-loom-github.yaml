name: "Ops - Loom GitHub Tasks"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  id-token: write

jobs:
  mentioned:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' &&
       (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted workflow actions
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .github/actions/launch-loom-run
            .github/actions/check-write-access
          sparse-checkout-cone-mode: false
      - name: Check author write access
        id: author
        uses: ./.github/actions/check-write-access
        with:
          login: ${{ github.event.comment.user.login || github.event.review.user.login || github.event.issue.user.login }}
      - name: Launch mentioned task
        if: steps.author.outputs.allowed == 'true'
        uses: ./.github/actions/launch-loom-run
        with:
          profile: ${{ vars.LOOM_GITHUB_AUTOMATION_PROFILE }}
          idempotency-key: github-mention:${{ github.event.comment.id || github.event.review.id || github.event.issue.id }}
          title: "GitHub mention in #${{ github.event.issue.number || github.event.pull_request.number }}"
          goal: >-
            Respond to the trusted author mention in
            ${{ github.repository }} #${{ github.event.issue.number || github.event.pull_request.number }}.
            Read the exact comment or review from event
            ${{ github.event.comment.id || github.event.review.id || github.event.issue.id }}
            and the surrounding thread. Carry out the request under AGENTS.md
            and applicable skills. Publish a typed result.
          base: main
          github-issue: ${{ github.event.issue.number || github.event.pull_request.number }}

  triage:
    if: >-
      github.event_name == 'issues' && github.event.action == 'opened' &&
      !contains(github.event.issue.body, '@claude') &&
      !contains(github.event.issue.title, '@claude') &&
      !contains(github.event.issue.body, '@weaverbot') &&
      !contains(github.event.issue.title, '@weaverbot')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted workflow actions
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .github/actions/launch-loom-run
            .github/actions/check-write-access
          sparse-checkout-cone-mode: false
      - name: Check author write access
        id: author
        uses: ./.github/actions/check-write-access
        with:
          login: ${{ github.event.issue.user.login }}
      - name: Launch issue triage
        if: steps.author.outputs.allowed == 'true'
        uses: ./.github/actions/launch-loom-run
        with:
          profile: ${{ vars.LOOM_GITHUB_AUTOMATION_PROFILE }}
          idempotency-key: issue-triage:${{ github.event.issue.id }}
          title: "Triage issue #${{ github.event.issue.number }}"
          goal: >-
            Triage ${{ github.repository }} issue #${{ github.event.issue.number }}.
            Read the issue and use manage-pr with its issue-fixes reference if actionable.
            For a simple question, answer on the issue. For a concrete small fix,
            follow the manage-pr workflow. For larger work, report a
            concrete plan on the issue. Publish a typed result.
          base: main
          github-issue: ${{ github.event.issue.number }}

  autofix:
    if: >-
      github.event_name == 'pull_request_review' &&
      contains(github.event.review.body, 'autofix') &&
      !contains(github.event.review.body, '@claude') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted workflow actions
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .github/actions/launch-loom-run
            .github/actions/check-write-access
          sparse-checkout-cone-mode: false
      - name: Check author write access
        id: author
        uses: ./.github/actions/check-write-access
        with:
          login: ${{ github.event.review.user.login }}
      - name: Launch requested autofix
        if: steps.author.outputs.allowed == 'true'
        uses: ./.github/actions/launch-loom-run
        with:
          profile: ${{ vars.LOOM_GITHUB_AUTOMATION_PROFILE }}
          idempotency-key: review-autofix:${{ github.event.review.id }}
          title: "Autofix PR #${{ github.event.pull_request.number }}"
          goal: >-
            Address all actionable comments in review
            ${{ github.event.review.id }} of ${{ github.repository }} PR
            #${{ github.event.pull_request.number }}. Follow AGENTS.md and the
            manage-pr skill, run relevant checks, push fixes to the existing branch,
            and post one concise 🤖 reply with the result. Publish a typed result.
          base: ${{ github.event.pull_request.head.sha }}
          github-issue: ${{ github.event.pull_request.number }}

  deslop:
    # A posted holistic review packet on an agent-generated pull request, or a
    # maintainer review containing "deslop", launches one session that applies
    # the packet's mechanical items and the simplify-code skill as a single commit.
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'loom-oa-dev[bot]' &&
       contains(github.event.comment.body, '<!-- marin-holistic-review:') &&
       contains(github.event.issue.labels.*.name, 'agent-generated')) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, 'deslop') &&
       !contains(github.event.review.body, '@claude') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted workflow actions
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .github/actions/launch-loom-run
            .github/actions/check-write-access
          sparse-checkout-cone-mode: false
      - name: Check author write access
        id: author
        uses: ./.github/actions/check-write-access
        with:
          login: ${{ github.event.comment.user.login || github.event.review.user.login }}
          allowed-bots: loom-oa-dev[bot]
      - name: Launch deslop
        if: steps.author.outputs.allowed == 'true'
        uses: ./.github/actions/launch-loom-run
        with:
          profile: ${{ vars.LOOM_GITHUB_AUTOMATION_PROFILE }}
          idempotency-key: deslop:${{ github.event.issue.number || github.event.pull_request.number }}
          title: "Deslop PR #${{ github.event.issue.number || github.event.pull_request.number }}"
          goal: >-
            Deslop ${{ github.repository }} PR
            #${{ github.event.issue.number || github.event.pull_request.number }}
            following the "Deslop follow-through" section of the
            review-pr skill in holistic mode. Read the holistic review packet or
            review ${{ github.event.comment.id || github.event.review.id }},
            apply only its mechanical items, run the simplify-code skill, run the
            checks the skill names, push one commit whose subject starts with
            Deslop, and post one concise 🤖 reply ending with the deslop
            marker. Publish a typed result.
          base: main
          github-issue: ${{ github.event.issue.number || github.event.pull_request.number }}
