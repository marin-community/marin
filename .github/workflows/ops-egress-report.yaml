name: "Ops - Egress Report"

# Cross-region egress digest over the trailing 24h, on demand only. The daily
# schedule was switched off 2026-09-29 after a month of posting "No offenders
# today." from no data (finelog had moved the log table to its object catalog;
# scripts/ops/cross_region.py now reads that). Before re-adding the schedule,
# point it at a dedicated channel (egress_report.py --channel,
# scripts/ops/discord.py CHANNELS) rather than #internal-discuss.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ops-egress-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.IRIS_CI_GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Sync uv environment
        run: uv sync

      - name: Run egress report
        env:
          DISCORD_WEBHOOK_INTERNAL_DISCUSS: ${{ secrets.DISCORD_WEBHOOK_INTERNAL_DISCUSS }}
          GH_TOKEN: ${{ secrets.GIST_PAT }}
        run: uv run python scripts/ops/egress_report.py
