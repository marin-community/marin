name: "Ops - Loom Holistic Review"

# This workflow runs from the trusted default branch and never checks out or
# executes pull-request code. It launches one whole-change review session for
# a large pull request or one that adds a new abstraction, plus at most one
# follow-up after a substantial commit. The gates use the GitHub API.
on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request to retry after repairing a failed review"
        required: true
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HOLISTIC_REVIEW_MIN_CHANGED_LINES: "250"
  HOLISTIC_REVIEW_MIN_PARENT_CHANGED_LINES: "100"

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Checkout trusted workflow actions
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .github/actions/launch-loom-run
            .github/actions/check-write-access
          sparse-checkout-cone-mode: false

      - name: Resolve pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          else
            pr=$(jq -c '.pull_request' "$GITHUB_EVENT_PATH")
          fi
          jq -r --arg repo "$GITHUB_REPOSITORY" '
            "eligible=\(.state == "open" and .draft == false and .head.repo.full_name == $repo)",
            "number=\(.number)", "author=\(.user.login)", "head=\(.head.sha)",
            "additions=\(.additions)", "deletions=\(.deletions)"
          ' <<< "$pr" >> "$GITHUB_OUTPUT"

      - name: Check author write access
        id: author
        if: steps.pr.outputs.eligible == 'true'
        uses: ./.github/actions/check-write-access
        with:
          login: ${{ steps.pr.outputs.author }}
          allowed-bots: |
            marin-ops-agent[bot]
            loom-oa-dev[bot]

      - name: Gate on size or a new abstraction
        id: gate
        if: steps.author.outputs.allowed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          ADDITIONS: ${{ steps.pr.outputs.additions }}
          DELETIONS: ${{ steps.pr.outputs.deletions }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_ACTION" == "synchronize" ]]; then
            parent_changed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '.stats.total')
            if (( parent_changed <= HOLISTIC_REVIEW_MIN_PARENT_CHANGED_LINES )); then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "gate: $parent_changed changed lines against parent; skipping"
              exit 0
            fi
          fi
          changed=$((ADDITIONS + DELETIONS))
          if (( changed >= HOLISTIC_REVIEW_MIN_CHANGED_LINES )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "gate: $changed changed lines"
            exit 0
          fi
          # A smaller PR still qualifies when it adds a class, dataclass, or
          # Protocol under a library source tree or the experiments tree. The
          # API call runs on its own line so a failure stops the job instead
          # of reading as a skipped PR.
          patches="$RUNNER_TEMP/holistic-review-patches.txt"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | select(.filename | test("^(lib/[^/]+/src/|experiments/)")) | .patch // ""' \
            > "$patches"
          if grep -Eq '^\+\s*(class |@dataclass)' "$patches"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "gate: new abstraction in $changed changed lines"
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "gate: $changed changed lines, no new abstraction; skipping"

      - name: Launch Loom holistic review
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/launch-loom-run
        with:
          profile: ${{ vars.LOOM_PR_HOLISTIC_REVIEW_PROFILE }}
          channel: pr-holistic:${{ steps.pr.outputs.number }}
          idempotency-key: pr-holistic:${{ steps.pr.outputs.number }}:${{ github.event_name == 'workflow_dispatch' && format('manual:{0}:{1}', github.run_id, github.run_attempt) || (github.event.action == 'synchronize' && 'followup' || 'initial') }}
          title: "Holistic review for #${{ steps.pr.outputs.number }}"
          goal: >-
            Review pull request #${{ steps.pr.outputs.number }} at head
            ${{ steps.pr.outputs.head }} as a whole change. If the
            session worktree is at a different commit, fetch this exact SHA from
            origin and check it out detached before reviewing. Remain
            read-only except for creating or replacing the original holistic
            overview comment and optionally creating one new top-level
            comment with new or materially changed actionable findings. Run
            review-pr-holistic with --comment and publish a typed result.
          base: ${{ steps.pr.outputs.head }}
          github-issue: ${{ steps.pr.outputs.number }}
