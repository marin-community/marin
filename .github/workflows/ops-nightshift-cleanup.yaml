name: "Ops - Nightshift Cleanup"

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: nightshift-cleanup
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted workflow action
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/actions/launch-loom-run
          sparse-checkout-cone-mode: false
      - name: Launch nightshift cleanup
        uses: ./.github/actions/launch-loom-run
        with:
          profile: ${{ vars.LOOM_GITHUB_AUTOMATION_PROFILE }}
          idempotency-key: nightshift-cleanup:${{ github.run_id }}:${{ github.run_attempt }}
          title: "Nightshift cleanup ${{ github.run_id }}"
          goal: >-
            Run the nightshift cleanup for ${{ github.repository }}. Inspect the
            policy and candidate-selection logic in infra/cron/nightshift_cleanup.py,
            select a bounded useful cleanup, and carry it through the commit and
            PR workflow. Do not invoke the legacy Claude runner. Publish a typed
            result with the PR URL or the reason no change was warranted.
          base: ${{ github.sha }}
