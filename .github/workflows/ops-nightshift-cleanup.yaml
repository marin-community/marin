name: "Ops - Nightshift Cleanup"

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: nightshift-cleanup
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted workflow action
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/actions/launch-loom-run
          sparse-checkout-cone-mode: false
      - name: Launch nightshift area review
        uses: ./.github/actions/launch-loom-run
        with:
          profile: ${{ vars.LOOM_GITHUB_AUTOMATION_PROFILE }}
          idempotency-key: nightshift-cleanup:${{ github.run_id }}:${{ github.run_attempt }}
          title: "Nightshift area review ${{ github.run_id }}"
          goal: >-
            Follow the Nightshift area reviews procedure in
            .github/workflows/README.md in
            ${{ github.repository }}. Choose one project area, review its
            design and behavior holistically, and compare supported candidates
            before implementing the highest-value eligible improvement. Follow
            AGENTS.md and the commit skill. Open a PR with agent-generated and
            nightshift labels only for a justified change. Publish a typed
            result with the review, candidate ranking, validation evidence,
            and PR URL or the reason no change was warranted.
          base: ${{ github.sha }}
