name: "Ops - Nightshift Cleanup"

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: nightshift-cleanup
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted workflow action
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/actions/launch-loom-run
          sparse-checkout-cone-mode: false
      - name: Launch nightshift cleanup
        uses: ./.github/actions/launch-loom-run
        with:
          profile: ${{ vars.LOOM_GITHUB_AUTOMATION_PROFILE }}
          idempotency-key: nightshift-cleanup:${{ github.run_id }}:${{ github.run_attempt }}
          title: "Nightshift cleanup ${{ github.run_id }}"
          goal: >-
            Run a bounded cleanup in ${{ github.repository }}. Inspect
            lib/marin/src/marin, lib/iris/src/iris, lib/zephyr/src/zephyr, and
            lib/levanter/src/levanter for a concrete bug, unused code,
            duplicated nontrivial policy, or unnecessary runtime work. Choose
            one coherent improvement whose value is clear from the diff. Avoid
            style-only refactors and trivial helper extraction. Follow AGENTS.md
            and the commit skill; open a PR with agent-generated and nightshift
            labels only if the change is justified. Publish a typed result with
            the PR URL or what was checked when no change was warranted.
          base: ${{ github.sha }}
