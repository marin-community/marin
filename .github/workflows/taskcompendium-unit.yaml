name: "TaskCompendium - Unit"

on:
  pull_request:
    paths:
      - 'lib/taskcompendium/**'
      - '.github/workflows/taskcompendium-unit.yaml'
  push:
    branches: [main]
    paths:
      - 'lib/taskcompendium/**'
      - '.github/workflows/taskcompendium-unit.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskcompendium-unit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: lib/taskcompendium/shellsim-bridge
      - name: Test the pinned ShellSim bridge
        run: cargo test --locked --manifest-path lib/taskcompendium/shellsim-bridge/Cargo.toml
      - name: Test the isolated Python package and Harbor adapters
        run: uv run --project lib/taskcompendium --frozen --extra harbor --group test pytest lib/taskcompendium/tests
