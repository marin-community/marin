name: Hero checkpoint completions

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hero-checkpoint-completions
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'marin-community/marin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CW_KEY_ID: ${{ secrets.CW_ACCESS_KEY_ID }}
      CW_KEY_SECRET: ${{ secrets.CW_SECRET_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}
      WANDB_MODE: disabled
      JAX_PLATFORMS: cpu
    steps:
      - name: Check storage credentials
        run: |
          : "${CW_KEY_ID:?CW_ACCESS_KEY_ID repository secret is required}"
          : "${CW_KEY_SECRET:?CW_SECRET_ACCESS_KEY repository secret is required}"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Retry requests from their original source commit.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install controller dependencies
        # The shared hero recipe imports tokenization, which currently requires the dedup extra.
        run: uv sync --locked --package marin-core --extra cpu --extra dedup --no-default-groups
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.IRIS_CI_GCP_SA_KEY }}
      - name: Reconcile every permanent checkpoint
        run: uv run --no-sync python -m scripts.ops.hero_completions reconcile
      - name: Publish the daily history report
        if: always() && steps.auth.outcome == 'success'
        run: uv run --no-sync python -m scripts.ops.hero_completions report
