name: "Ops - Nightshift CI Tests"

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

concurrency:
  group: nightshift-ci-tests
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ci-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted workflow action
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/actions/launch-loom-run
          sparse-checkout-cone-mode: false
      - name: Launch CI test audit
        uses: ./.github/actions/launch-loom-run
        with:
          profile: ${{ vars.LOOM_GITHUB_AUTOMATION_PROFILE }}
          idempotency-key: nightshift-ci-tests:${{ github.run_id }}:${{ github.run_attempt }}
          title: "Nightshift CI audit ${{ github.run_id }}"
          goal: >-
            Audit recent CI tests in ${{ github.repository }}. Use the selection
            policy in infra/cron/nightshift_ci_tests.py and current GitHub runs
            to identify a concrete flaky or broken test. Make a bounded fix and
            follow the commit and PR workflow if the evidence supports one.
            Do not invoke the legacy Claude runner. Publish a typed result.
          base: ${{ github.sha }}
