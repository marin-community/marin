name: "Ops - Nightshift CI Tests"

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

concurrency:
  group: nightshift-ci-tests
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ci-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted workflow action
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/actions/launch-loom-run
          sparse-checkout-cone-mode: false
      - name: Launch CI test audit
        uses: ./.github/actions/launch-loom-run
        with:
          profile: ${{ vars.LOOM_GITHUB_AUTOMATION_PROFILE }}
          idempotency-key: nightshift-ci-tests:${{ github.run_id }}:${{ github.run_attempt }}
          title: "Nightshift CI audit ${{ github.run_id }}"
          goal: >-
            Audit the last five completed main-branch runs of Marin - Unit and
            Marin - Integration in ${{ github.repository }}. Use test logs to
            find tests failing in at least two runs or taking at least 60
            seconds in at least two runs. Treat instability as a hypothesis;
            verify the test's purpose and failure cause before changing it.
            Choose one high-value test or a coherent pair. Preserve useful
            coverage and assertions. Follow AGENTS.md, TESTING.md, and the
            commit skill; open a PR with agent-generated and nightshift labels
            only for a supported fix. Publish a typed result either way.
          base: ${{ github.sha }}
