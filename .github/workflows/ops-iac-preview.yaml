name: "Ops - IaC preview"

# Runs `pulumi preview` for each infra/pulumi (marin-iac) stack in parallel and
# posts one aggregated PR comment. workflow_dispatch can take an optional PR
# number to preview that PR's head and comment there; omit it for a drift check
# against the selected ref with no comment. Merged PRs are checked against their
# merge commit after 30 minutes, then retried after 60 and 120 minutes while
# changes remain.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "config/**"
      - "infra/pulumi/**"
      - "lib/iris/config/**"
      - ".github/workflows/ops-iac-preview.yaml"
      - ".github/actions/pulumi-preview/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to preview and comment on (leave empty for drift check only)"
        required: false
        type: string
      deployment_check_attempt:
        description: "Internal: post-merge deployment check attempt"
        required: false
        type: number

permissions:
  contents: read

env:
  PULUMI_CI_SERVICE_ACCOUNT: pulumi-ci@hai-gcp-models.iam.gserviceaccount.com
  PULUMI_CI_PROJECT: hai-gcp-models
  CHECK_DELAYS_MINUTES: "[30,60,120]"
  PREVIEW_MATRIX: >-
    {"include":[
      {"stack":"cw-rno2a","coreweave":true},
      {"stack":"cw-us-east-02a","coreweave":true},
      {"stack":"cw-us-east-08a","coreweave":true},
      {"stack":"cw-us-west-04a","coreweave":true},
      {"stack":"marin","coreweave":false}
    ]}

jobs:
  prepare:
    # Fork PRs cannot reach the preview credentials. Retry dispatches and manual
    # previews are limited to repository collaborators by GitHub.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (github.event.action != 'closed' || github.event.pull_request.merged == true))
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      pull-requests: read
    outputs:
      attempt: ${{ steps.context.outputs.attempt }}
      deployment_check: ${{ steps.context.outputs.deployment_check }}
      merger: ${{ steps.context.outputs.merger }}
      preview_matrix: ${{ steps.context.outputs.preview_matrix }}
      pr_number: ${{ steps.context.outputs.pr_number }}
      ref: ${{ steps.context.outputs.ref }}
    steps:
      - name: Resolve preview context
        id: context
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          INPUT_ATTEMPT: ${{ inputs.deployment_check_attempt }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_MERGER: ${{ github.event.pull_request.merged_by.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deployment_check=false
          attempt=0
          merger=""

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            pr_number="$PR_NUMBER"
            ref="$PR_HEAD_SHA"
            if [[ "$EVENT_ACTION" == "closed" ]]; then
              deployment_check=true
              attempt=1
              merger="$PR_MERGER"
              ref="$PR_MERGE_SHA"
            fi
          elif [[ -n "$INPUT_ATTEMPT" && "$INPUT_ATTEMPT" != "0" ]]; then
            deployment_check=true
            attempt="$INPUT_ATTEMPT"
            pr_number="$INPUT_PR_NUMBER"
          else
            pr_number="$INPUT_PR_NUMBER"
            if [[ -n "$pr_number" ]]; then
              ref="refs/pull/$pr_number/head"
            else
              ref="$RUN_SHA"
            fi
          fi

          if [[ "$deployment_check" == "true" ]]; then
            [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              pull_request=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")
              ref=$(jq -er --arg branch "$DEFAULT_BRANCH" \
                'select(.merged_at != null and .base.ref == $branch) | .merge_commit_sha' \
                <<<"$pull_request")
              merger=$(jq -er '.merged_by.login' <<<"$pull_request")
            fi
            [[ "$merger" =~ ^[A-Za-z0-9-]+$ ]]
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          fi

          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "deployment_check=$deployment_check" >> "$GITHUB_OUTPUT"
          echo "merger=$merger" >> "$GITHUB_OUTPUT"
          {
            echo "preview_matrix<<EOF"
            echo "$PREVIEW_MATRIX"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Wait before deployment check
        if: steps.context.outputs.deployment_check == 'true'
        env:
          ATTEMPT: ${{ steps.context.outputs.attempt }}
          CHECK_DELAYS_MINUTES: ${{ env.CHECK_DELAYS_MINUTES }}
        run: |
          delay_minutes=$(jq -er --argjson attempt "$ATTEMPT" '.[$attempt - 1] // empty' \
            <<<"$CHECK_DELAYS_MINUTES")
          sleep "${delay_minutes}m"

  preview:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      # Job concurrency cannot use the env context.
      group: iac-preview-${{ matrix.stack }}-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.preview_matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Write kubeconfig
        if: matrix.coreweave
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.CW_KUBECONFIG }}" > ~/.kube/coreweave-iris
          chmod 600 ~/.kube/coreweave-iris
          echo "KUBECONFIG=$HOME/.kube/coreweave-iris" >> "$GITHUB_ENV"

      # Required for TraefikAddon's Traefik/cert-manager Releases to resolve their charts
      # during `pulumi preview` — see infra/pulumi/README.md's Prerequisites.
      - name: Set up Helm
        if: matrix.coreweave
        uses: azure/setup-helm@v4

      - name: Add CoreWeave Helm repo
        if: matrix.coreweave
        run: |
          helm repo add coreweave https://charts.core-services.ingress.coreweave.com
          helm repo update coreweave

      - name: Preview ${{ matrix.stack }}
        uses: ./.github/actions/pulumi-preview
        with:
          stack: ${{ matrix.stack }}
          work-dir: infra/pulumi
          service-account: ${{ env.PULUMI_CI_SERVICE_ACCOUNT }}
          gcp-project-id: ${{ env.PULUMI_CI_PROJECT }}

  comment:
    if: >-
      always()
      && needs.prepare.result == 'success'
      && needs.prepare.outputs.pr_number != ''
    needs: [prepare, preview]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs_retry: ${{ steps.deployment.outputs.needs_retry }}
      next_attempt: ${{ steps.deployment.outputs.next_attempt }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download preview artifacts
        uses: actions/download-artifact@v8
        continue-on-error: ${{ needs.prepare.outputs.deployment_check == 'true' }}
        with:
          pattern: iac-preview-*
          path: iac-previews
          merge-multiple: false

      - name: Assemble comment body
        if: needs.prepare.outputs.deployment_check != 'true'
        run: |
          python3 .github/actions/pulumi-preview/assemble_comment.py \
            --previews-dir iac-previews \
            --out iac-comment.md \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Summarize deployment check
        if: needs.prepare.outputs.deployment_check == 'true'
        id: deployment
        env:
          ATTEMPT: ${{ needs.prepare.outputs.attempt }}
          CHECK_DELAYS_MINUTES: ${{ env.CHECK_DELAYS_MINUTES }}
          MERGER: ${{ needs.prepare.outputs.merger }}
          PREVIEW_MATRIX: ${{ needs.prepare.outputs.preview_matrix }}
        run: |
          python3 .github/actions/pulumi-preview/summarize_deployment.py \
            --previews-dir iac-previews \
            --preview-matrix "$PREVIEW_MATRIX" \
            --check-delays-minutes "$CHECK_DELAYS_MINUTES" \
            --attempt "$ATTEMPT" \
            --merger "$MERGER" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out iac-comment.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Upsert sticky PR comment
        if: >-
          needs.prepare.outputs.deployment_check != 'true'
          || steps.deployment.outputs.should_comment == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('iac-comment.md', 'utf8');
            const marker = body.split('\n', 1)[0];
            if (!marker.startsWith('<!--')) {
              throw new Error(`comment body must start with an HTML marker; got: ${marker}`);
            }
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              throw new Error(`Invalid PR_NUMBER: ${process.env.PR_NUMBER}`);
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  retry-deployment-check:
    if: >-
      always()
      && needs.comment.outputs.needs_retry == 'true'
      && needs.comment.outputs.next_attempt != ''
    needs: [prepare, comment]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Schedule next deployment check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          NEXT_ATTEMPT: ${{ needs.comment.outputs.next_attempt }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'ops-iac-preview.yaml',
              ref: context.payload.repository.default_branch,
              inputs: {
                deployment_check_attempt: process.env.NEXT_ATTEMPT,
                pr_number: process.env.PR_NUMBER,
              },
            });
