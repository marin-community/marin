name: "Ops - IaC preview"

# Runs `pulumi preview` for each infra/pulumi (marin-iac) stack in parallel and
# posts one aggregated PR comment. After a matching PR merges, the workflow
# checks whether every affected stack has had a successful update.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "config/**"
      - "infra/pulumi/**"
      - "lib/iris/config/**"
      - ".github/workflows/ops-iac-preview.yaml"
      - ".github/actions/pulumi-preview/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to preview and comment on (leave empty for drift check only)"
        required: false
        type: string

permissions:
  contents: read

env:
  PULUMI_CI_SERVICE_ACCOUNT: pulumi-ci@hai-gcp-models.iam.gserviceaccount.com
  PULUMI_CI_PROJECT: hai-gcp-models

jobs:
  preview-coreweave:
    # Fork PRs cannot reach repo secrets. Closed PRs are handled by deployment-check.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action != 'closed'
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      # Job concurrency cannot use the env context.
      group: iac-preview-${{ matrix.stack }}-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        stack: [cw-rno2a, cw-us-east-02a, cw-us-east-08a, cw-us-west-04a]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || (inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number)) || github.sha }}

      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.CW_KUBECONFIG }}" > ~/.kube/coreweave-iris
          chmod 600 ~/.kube/coreweave-iris
          echo "KUBECONFIG=$HOME/.kube/coreweave-iris" >> "$GITHUB_ENV"

      # Required for TraefikAddon's Traefik/cert-manager Releases to resolve their charts
      # during `pulumi preview` — see infra/pulumi/README.md's Prerequisites.
      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add CoreWeave Helm repo
        run: |
          helm repo add coreweave https://charts.core-services.ingress.coreweave.com
          helm repo update coreweave

      - name: Preview ${{ matrix.stack }}
        uses: ./.github/actions/pulumi-preview
        with:
          stack: ${{ matrix.stack }}
          work-dir: infra/pulumi
          service-account: ${{ env.PULUMI_CI_SERVICE_ACCOUNT }}
          gcp-project-id: ${{ env.PULUMI_CI_PROJECT }}

  preview-gcp:
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action != 'closed'
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: iac-preview-marin-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || (inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number)) || github.sha }}

      - name: Preview marin
        uses: ./.github/actions/pulumi-preview
        with:
          stack: marin
          work-dir: infra/pulumi
          service-account: ${{ env.PULUMI_CI_SERVICE_ACCOUNT }}
          gcp-project-id: ${{ env.PULUMI_CI_PROJECT }}

  preview-comment:
    if: >-
      always()
      && (github.event_name == 'workflow_dispatch' || github.event.action != 'closed')
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name == 'pull_request' || inputs.pr_number != '')
    needs: [preview-coreweave, preview-gcp]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr_number) }}

      - name: Download preview artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: iac-preview-*
          path: iac-previews
          merge-multiple: false

      - name: Assemble comment body
        env:
          WORKFLOW_OK: >-
            ${{ needs.preview-coreweave.result == 'success'
                && needs.preview-gcp.result == 'success' }}
        run: |
          python3 .github/actions/pulumi-preview/assemble_comment.py \
            --previews-dir iac-previews \
            --head-sha "$(git rev-parse HEAD)" \
            --workflow-ok "$WORKFLOW_OK" \
            --out iac-preview-comment.md \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upsert sticky PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('iac-preview-comment.md', 'utf8');
            const marker = body.split('\n', 1)[0];
            if (!marker.startsWith('<!--')) {
              throw new Error(`comment body must start with an HTML marker; got: ${marker}`);
            }
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              throw new Error(`Invalid PR_NUMBER: ${process.env.PR_NUMBER}`);
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  deployment-check-1:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      needs_retry: ${{ steps.check.outputs.needs_retry }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout automation code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check deployment
        id: check
        uses: ./.github/actions/pulumi-deployment-check
        with:
          attempt: 1
          delay-minutes: 30
          head-sha: ${{ github.event.pull_request.head.sha }}
          merged-at: ${{ github.event.pull_request.merged_at }}
          merger: ${{ github.event.pull_request.merged_by.login }}
          pr-number: ${{ github.event.pull_request.number }}
          service-account: ${{ env.PULUMI_CI_SERVICE_ACCOUNT }}
          gcp-project-id: ${{ env.PULUMI_CI_PROJECT }}

  deployment-check-2:
    if: needs.deployment-check-1.outputs.needs_retry == 'true'
    needs: deployment-check-1
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      needs_retry: ${{ steps.check.outputs.needs_retry }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout automation code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check deployment
        id: check
        uses: ./.github/actions/pulumi-deployment-check
        with:
          attempt: 2
          delay-minutes: 60
          head-sha: ${{ github.event.pull_request.head.sha }}
          merged-at: ${{ github.event.pull_request.merged_at }}
          merger: ${{ github.event.pull_request.merged_by.login }}
          pr-number: ${{ github.event.pull_request.number }}
          service-account: ${{ env.PULUMI_CI_SERVICE_ACCOUNT }}
          gcp-project-id: ${{ env.PULUMI_CI_PROJECT }}

  deployment-check-3:
    if: needs.deployment-check-2.outputs.needs_retry == 'true'
    needs: deployment-check-2
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout automation code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check deployment
        uses: ./.github/actions/pulumi-deployment-check
        with:
          attempt: 3
          delay-minutes: 120
          head-sha: ${{ github.event.pull_request.head.sha }}
          merged-at: ${{ github.event.pull_request.merged_at }}
          merger: ${{ github.event.pull_request.merged_by.login }}
          pr-number: ${{ github.event.pull_request.number }}
          service-account: ${{ env.PULUMI_CI_SERVICE_ACCOUNT }}
          gcp-project-id: ${{ env.PULUMI_CI_PROJECT }}
