name: "Marin - Release Packages"

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package family or all"
        default: all
        type: string
      mode:
        description: "Build mode"
        type: choice
        options: [development, stable, manual]
        default: manual
      version:
        description: "Version; required for a stable single-package release"
        type: string
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    tags:
      - "dupekit-v*"
      - "finelog-v*"
      - "iris-native-v*"
      - "marin-libs-v*"
    # GitHub requires static path filters. Keep this list aligned with
    # package-owned source_patterns; orchestration-only changes do not publish.
    paths:
      - "lib/dupekit/src/**"
      - "lib/dupekit/rust/**"
      - "lib/finelog/config/**"
      - "lib/finelog/src/**"
      - "lib/finelog/rust/**"
      - "lib/iris/rust/**"
      - "rust/**"
      - "scripts/python_libs_package.py"
  pull_request:
    # Pull requests also smoke shared release code, which selects every family.
    paths:
      - "lib/dupekit/src/**"
      - "lib/dupekit/rust/**"
      - "lib/finelog/config/**"
      - "lib/finelog/src/**"
      - "lib/finelog/rust/**"
      - "lib/iris/rust/**"
      - "rust/**"
      - "scripts/ci/package_release.py"
      - "scripts/python_libs_package.py"
      - ".github/workflows/marin-release-libs-wheels.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      bump: ${{ steps.plan.outputs.bump }}
      packages: ${{ steps.plan.outputs.packages }}
      publish: ${{ steps.plan.outputs.publish }}
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find changed source files
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$PR_BASE" "$GITHUB_SHA" > "$RUNNER_TEMP/package-changes"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/package-changes"
          else
            touch "$RUNNER_TEMP/package-changes"
          fi

      - name: Resolve release plan
        id: plan
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python scripts/ci/package_release.py plan \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --mode "${INPUT_MODE:-manual}" \
            --package "${INPUT_PACKAGE:-all}" \
            --version "${INPUT_VERSION:-}" \
            --revision "$GITHUB_SHA" \
            --serial "$GITHUB_RUN_ID" \
            --changed-files "$RUNNER_TEMP/package-changes" \
            --github-output "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: matrix.operation != 'python'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: astral-sh/setup-uv@v7

      - name: Build wheels
        env:
          VERSION: ${{ fromJSON(needs.plan.outputs.versions)[matrix.package].version }}
        run: |
          python scripts/ci/package_release.py build \
            --package "${{ matrix.package }}" \
            --version "$VERSION" \
            --operation "${{ matrix.operation }}"

      - name: Validate compatible native wheel
        if: matrix.operation == 'linux' || matrix.operation == 'macos'
        env:
          VERSION: ${{ fromJSON(needs.plan.outputs.versions)[matrix.package].version }}
        run: |
          python scripts/ci/package_release.py validate-wheel \
            --package "${{ matrix.package }}" \
            --version "$VERSION" \
            --dist-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.package }}-${{ matrix.operation }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: >-
      github.repository == 'marin-community/marin' &&
      needs.plan.outputs.publish == 'true' &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: package-${{ matrix.package }}-*
          path: dist
          merge-multiple: true

      - name: Validate release artifacts
        env:
          VERSION: ${{ fromJSON(needs.plan.outputs.versions)[matrix.package].version }}
        run: |
          python scripts/ci/package_release.py verify-release \
            --package "${{ matrix.package }}" \
            --version "$VERSION" \
            --dist-dir dist

      # v1.14.2 bundles twine 7, which accepts core metadata 2.5. Hatchling now
      # stamps Metadata-Version: 2.5, and v1.14.0's older twine rejected it
      # ("'2.5' is not a valid metadata version"), failing every publish.
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
