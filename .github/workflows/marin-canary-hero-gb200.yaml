name: "Marin - Canary - Hero GB200"

# See "Daily hero canary" in experiments/grug/moe_hero_ep/README.md.
on:
  schedule:
    - cron: '0 11 * * *'  # 3 AM PST / 6 AM EST (4 AM PDT / 7 AM EDT in summer)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Google WIF and Loom federation OIDC

jobs:
  hero-canary:
    runs-on: ubuntu-latest
    # GitHub's limit for a hosted runner: the queue wait, the run and diagnostics fit inside it.
    timeout-minutes: 360
    outputs:
      resource_exhausted: ${{ steps.wait.outputs.resource_exhausted }}
      regression: ${{ steps.report.outputs.regression }}
      regression_detail: ${{ steps.report.outputs.regression_detail }}
    concurrency:
      group: canary-hero-gb200
      cancel-in-progress: false
    env:
      # Only scheduled runs (hero-canary-<run>-<attempt>) enter the report's baseline
      # and the MFU tracker; manual dispatches are hero-canary-manual-.
      RUN_ID: ${{ github.event_name == 'schedule' && 'hero-canary' || 'hero-canary-manual' }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Re-pin only when the hero's checkpoint layout or context length changes;
      # the report compares runs from the same checkpoint only.
      HERO_CANARY_CHECKPOINT: s3://marin-us-east-02a/marin/grug/hero-ctx65k-step372k/2026.08.19.2/checkpoints/step-390251
      HERO_CANARY_START_STEP: "390251"
      # 35 updates: ~4 warmup steps, then ~30 steady steps for a ±0.5% step-time median.
      HERO_CANARY_STEPS: "35"
      # The production hero's schedule length, so the run keeps the hero's schedule.
      HERO_SCHEDULE_STEPS: "390251"
      # Unique per concurrent gang; the hero itself uses 32614.
      IRIS_PORT_JAX: "32650"
      # Loose loss ceilings, like the H100 canary's: one-rack runs from a nearby checkpoint
      # ended at train loss 0.83 and dropless eval macro loss 1.79.
      HERO_CANARY_MAX_TRAIN_LOSS: "1.5"
      HERO_CANARY_MAX_EVAL_LOSS: "2.5"
      # Five hours for the training job to start before the day is skipped.
      QUEUE_WAIT_TIMEOUT: "18000"
      # Backstop if this workflow dies: queue wait plus run, from coordinator start.
      CANARY_TIMEOUT: "21600"
      TARGET_CLUSTER: cw-us-east-08a
      WANDB_ENTITY: marin-community
      WANDB_PROJECT: marin_moe
      IRIS_CONFIG: lib/iris/config/marin.yaml

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --extra=cpu --no-default-groups

      # github-iris is on cw-us-east-08a's allowed_submitters list.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hai-gcp-models
          workload_identity_provider: projects/748532799086/locations/global/workloadIdentityPools/github-pool/providers/github-oidc
          service_account: github-iris@hai-gcp-models.iam.gserviceaccount.com

      - name: Submit hero canary
        id: submit
        run: |
          set -euo pipefail
          end_step=$((HERO_CANARY_START_STEP + HERO_CANARY_STEPS))
          # --num-steps is the absolute end step. --eval-every equal to it runs
          # exactly one dropless eval, after the last update.
          JOB_ID=$(.venv/bin/iris --config="$IRIS_CONFIG" \
            job run --no-wait --enable-extra-resources \
            --target-cluster "$TARGET_CLUSTER" \
            --priority batch \
            --timeout "$CANARY_TIMEOUT" \
            --cpu 2 --memory 8GB --disk 32GB \
            --job-name "${RUN_ID}-coord" \
            -e WANDB_API_KEY "$WANDB_API_KEY" \
            -e WANDB_PROJECT "$WANDB_PROJECT" \
            -e IRIS_PORT_JAX "$IRIS_PORT_JAX" \
            -- python -m experiments.grug.moe_hero_ep.launch_diagnostics \
              --run-id "$RUN_ID" \
              --seed 0 \
              --restore-from "$HERO_CANARY_CHECKPOINT" \
              --num-steps "$end_step" \
              --schedule-steps "$HERO_SCHEDULE_STEPS" \
              --long-context-start-step "$HERO_CANARY_START_STEP" \
              --gc-interval 100 \
              --eval-every "$end_step" \
              --version dev \
              --run)
          if [ -z "$JOB_ID" ]; then
            echo "iris job run produced no job id" >&2
            exit 1
          fi
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "Submitted job: $JOB_ID"
        env:
          # CoreWeave peers reject a handoff unless the submitter supplies its
          # own object-storage credentials.
          CW_KEY_ID: ${{ secrets.CW_ACCESS_KEY_ID }}
          CW_KEY_SECRET: ${{ secrets.CW_SECRET_ACCESS_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}

      # A training job that has not started within QUEUE_WAIT_TIMEOUT is
      # cancelled and reported as resource exhaustion. Once it starts, this
      # step timeout is the wall clock.
      - name: Wait for hero canary
        id: wait
        timeout-minutes: 340
        run: |
          uv run python scripts/ci/iris_monitor.py wait \
            --job-id "${{ steps.submit.outputs.job_id }}" \
            --iris-config "$IRIS_CONFIG" \
            --poll-interval 60 \
            --child-wait-timeout "$QUEUE_WAIT_TIMEOUT" \
            --child-wait-timeout-policy shutdown \
            --resource-exhaustion-policy shutdown \
            --github-output

      - name: Report hero canary metrics
        id: report
        if: steps.wait.outputs.resource_exhausted != 'true'
        run: |
          .venv/bin/python scripts/ci/hero_canary_report.py \
            --run-id "$RUN_ID" \
            --entity "$WANDB_ENTITY" \
            --project "$WANDB_PROJECT" \
            --start-step "$HERO_CANARY_START_STEP" \
            --steps "$HERO_CANARY_STEPS" \
            --checkpoint "$HERO_CANARY_CHECKPOINT" \
            --max-train-loss "$HERO_CANARY_MAX_TRAIN_LOSS" \
            --max-eval-loss "$HERO_CANARY_MAX_EVAL_LOSS" \
            --github-output
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}

      - name: Note a skipped day
        if: steps.wait.outputs.resource_exhausted == 'true'
        run: |
          echo "::notice title=Hero canary skipped::No GB200 rack was free within $((QUEUE_WAIT_TIMEOUT / 3600)) hours."
          echo "Skipped: no GB200 rack was free within $((QUEUE_WAIT_TIMEOUT / 3600)) hours." >> "$GITHUB_STEP_SUMMARY"

      - name: Capture failure diagnostics
        if: failure() || cancelled()
        continue-on-error: true
        env:
          JOB_ID: ${{ steps.submit.outputs.job_id }}
          DIAG_DIR: ${{ github.workspace }}/hero-canary-diagnostics
        run: |
          mkdir -p "$DIAG_DIR"
          .venv/bin/iris --config="$IRIS_CONFIG" job list --prefix "$JOB_ID" > "$DIAG_DIR/jobs.txt" 2>&1 || true
          .venv/bin/iris --config="$IRIS_CONFIG" job logs "$JOB_ID" --tail --max-lines 2000 > "$DIAG_DIR/coordinator.log" 2>&1 || true
          .venv/bin/iris --config="$IRIS_CONFIG" job logs "$JOB_ID/grug-train-$RUN_ID" --tail --max-lines 5000 > "$DIAG_DIR/train.log" 2>&1 || true

      - name: Upload diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: hero-canary-diagnostics-${{ github.run_id }}
          path: hero-canary-diagnostics/
          retention-days: 14
          if-no-files-found: ignore

      - name: Launch Loom triage
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        uses: ./.github/actions/loom-canary-triage
        timeout-minutes: 5
        with:
          profile: ${{ vars.LOOM_GITHUB_AUTOMATION_PROFILE }}
          lane: hero-gb200
          job-id: ${{ steps.submit.outputs.job_id }}
          run-id: ${{ env.RUN_ID }}
          iris-config: ${{ env.IRIS_CONFIG }}
          wandb-entity: ${{ env.WANDB_ENTITY }}
          wandb-project: ${{ env.WANDB_PROJECT }}
          gha-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Separate job so Slack always fires, even if the main job is force-killed.
  notify-slack:
    needs: hero-canary
    if: always() && (needs.hero-canary.result == 'failure' || needs.hero-canary.result == 'cancelled') && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Notify Slack
        uses: marin-community/marin-style/actions/notify-slack@4b2fc2b0ec0bb9ad1304ef76936eb68e97f893cb  # main 2026-08-24
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          fallback-text: ":red_circle: *Hero GB200 canary failed*\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # A step-time regression leaves the run green, so it gets its own message.
  notify-regression:
    needs: hero-canary
    if: always() && needs.hero-canary.outputs.regression == 'true' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Notify Slack
        uses: marin-community/marin-style/actions/notify-slack@4b2fc2b0ec0bb9ad1304ef76936eb68e97f893cb  # main 2026-08-24
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          fallback-text: ":large_orange_circle: *Hero GB200 canary step time changed* ${{ needs.hero-canary.outputs.regression_detail }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # A day skipped for lack of capacity finishes green, so it gets its own, non-failure message.
  notify-skipped:
    needs: hero-canary
    if: always() && needs.hero-canary.outputs.resource_exhausted == 'true' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Notify Slack
        uses: marin-community/marin-style/actions/notify-slack@4b2fc2b0ec0bb9ad1304ef76936eb68e97f893cb  # main 2026-08-24
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          fallback-text: ":white_circle: *Hero GB200 canary skipped*: no capacity, so it did not run. This is not a failure.\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
