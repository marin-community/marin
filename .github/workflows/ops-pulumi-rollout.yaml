name: "Ops - Pulumi Rollout"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      service:
        description: "Registered service to deploy"
        required: true
        type: string
      deploy_generation:
        description: "Optional forced-redeploy generation for services that support it"
        required: false
        type: string

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.rollouts.outputs.deploy }}
      test: ${{ steps.rollouts.outputs.test }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Selection compares paths, so historical file contents can stay remote.
          filter: blob:none

      - name: Select rollouts
        id: rollouts
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SERVICE: ${{ inputs.service }}
          DEPLOY_GENERATION: ${{ inputs.deploy_generation }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            payload="$(python3 scripts/ci/pulumi_rollouts.py \
              --service "$SERVICE" --deploy-generation "$DEPLOY_GENERATION")"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            payload="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | python3 scripts/ci/pulumi_rollouts.py)"
          else
            payload="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" | python3 scripts/ci/pulumi_rollouts.py)"
          fi
          echo "deploy=$(jq -c .deploy <<<"$payload")" >> "$GITHUB_OUTPUT"
          echo "test=$(jq -c .test <<<"$payload")" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    if: github.event_name == 'pull_request' && needs.discover.outputs.test != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.test) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Configure Docker Hub mirror
        # Cache hits avoid Hub pull limits; misses fall back to Docker Hub.
        run: |
          config=/etc/docker/daemon.json
          if [[ -f "$config" ]]; then
            sudo cat "$config" > "$RUNNER_TEMP/docker-daemon.json"
          else
            echo '{}' > "$RUNNER_TEMP/docker-daemon.json"
          fi
          jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' \
            "$RUNNER_TEMP/docker-daemon.json" | sudo tee "$config" > /dev/null
          sudo systemctl restart docker

      - name: Test the service
        working-directory: ${{ matrix.test_path }}
        run: uv run pytest

  deploy:
    needs: discover
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.discover.outputs.deploy != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.deploy) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pulumi-rollout-${{ matrix.name }}
      cancel-in-progress: false
    env:
      DUCKY_GCS_HMAC_KEY_ID: ${{ matrix.name == 'ducky' && secrets.DUCKY_GCS_HMAC_KEY_ID || '' }}
      DUCKY_GCS_HMAC_SECRET: ${{ matrix.name == 'ducky' && secrets.DUCKY_GCS_HMAC_SECRET || '' }}
      R2_KEY_ID: ${{ matrix.name == 'ducky' && secrets.R2_ACCESS_KEY_ID || '' }}
      R2_KEY_SECRET: ${{ matrix.name == 'ducky' && secrets.R2_SECRET_ACCESS_KEY || '' }}
      DUCKY_CW_SECRET_KEY: ${{ matrix.name == 'ducky' && secrets.DUCKY_CW_SECRET_KEY || '' }}
      CW_KEY_ID: ${{ matrix.name == 'xprof' && secrets.CW_ACCESS_KEY_ID || '' }}
      CW_KEY_SECRET: ${{ matrix.name == 'xprof' && secrets.CW_SECRET_ACCESS_KEY || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # A queued or rerun Marina rollout must build current production source.
          ref: ${{ matrix.name == 'marina' && 'main' || github.sha }}

      - name: Apply Pulumi stack
        uses: ./.github/actions/pulumi-deploy
        with:
          service: ${{ matrix.name }}
          service-account: ${{ matrix.service_account }}
          gcp-project-id: hai-gcp-models
          config: ${{ matrix.config }}

  discover-apps:
    if: github.repository == 'marin-community/marin' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Select changed Marina apps
        id: apps
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          apps="$(python3 scripts/ci/marina_app_releases.py select --before "$BEFORE_SHA" --after "$HEAD_SHA")"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  release-app:
    needs: [discover-apps, deploy]
    if: >-
      always() &&
      github.repository == 'marin-community/marin' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.discover-apps.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') &&
      needs.discover-apps.outputs.apps != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-apps.outputs.apps) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: marina-app-release-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Marina and test dependencies
        run: uv sync --locked --package marin-marina --group test --no-default-groups
      - name: Authenticate the main-only deployment identity
        uses: google-github-actions/auth@v3
        with:
          project_id: hai-gcp-models
          workload_identity_provider: projects/748532799086/locations/global/workloadIdentityPools/github-pool/providers/github-oidc
          service_account: marin-cd-cloud-run-deploy@hai-gcp-models.iam.gserviceaccount.com
      - name: Test and release changed source
        run: |
          uv run --no-sync python scripts/ci/marina_app_releases.py release \
            "${{ matrix.name }}" --record "$RUNNER_TEMP/marina-app-release.json"
      - name: Summarize the release record
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/marina-app-release.json" ]]; then
            {
              echo "### Marina app: ${{ matrix.name }}"
              echo '```json'
              cat "$RUNNER_TEMP/marina-app-release.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain the release record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marina-app-release-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/marina-app-release.json
          if-no-files-found: ignore
