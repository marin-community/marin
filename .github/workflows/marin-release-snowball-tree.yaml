name: "Marin - Release Snowball Tree"

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Inspect and validate without publishing"
        type: boolean
        default: false
      bootstrap_unrecorded:
        description: "Replace a reviewed legacy release lacking Git provenance"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: snowball-family-tree-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'marin-community/marin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Marina
        run: uv sync --locked --package marin-marina --no-default-groups
      - name: Authenticate the main-only deployment identity
        uses: google-github-actions/auth@v3
        with:
          project_id: hai-gcp-models
          workload_identity_provider: projects/748532799086/locations/global/workloadIdentityPools/github-pool/providers/github-oidc
          service_account: marin-cd-cloud-run-deploy@hai-gcp-models.iam.gserviceaccount.com
      - name: Release changed source
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          BOOTSTRAP_UNRECORDED: ${{ inputs.bootstrap_unrecorded || false }}
        run: |
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ "$BOOTSTRAP_UNRECORDED" == "true" ]]; then args+=(--bootstrap-unrecorded); fi
          uv run --no-sync python scripts/ci/snowball_release.py "${args[@]}" > "$RUNNER_TEMP/snowball-release.json"
          cat "$RUNNER_TEMP/snowball-release.json"
          {
            echo '### Snowball family-tree release'
            echo '```json'
            cat "$RUNNER_TEMP/snowball-release.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the release record
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: snowball-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snowball-release.json
          if-no-files-found: error
