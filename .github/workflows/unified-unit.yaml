name: Marin - AgentX CPU preparation validation

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [both, h100, gb200]
        default: both
      vllm_release:
        description: Published release manifest to resolve once; preparation installs no vLLM
        type: string
        default: marin-vllm-gpu-20261012-3a054c458ca8

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    if: github.repository == 'marin-community/marin'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CW_KEY_ID: ${{ secrets.CW_ACCESS_KEY_ID }}
      CW_KEY_SECRET: ${{ secrets.CW_SECRET_ACCESS_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PROFILE: ${{ inputs.profile }}
      VLLM_RELEASE: ${{ inputs.vllm_release }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v3
        with:
          project_id: hai-gcp-models
          workload_identity_provider: projects/748532799086/locations/global/workloadIdentityPools/github-pool/providers/github-oidc
          service_account: github-iris@hai-gcp-models.iam.gserviceaccount.com
      - run: uv sync --frozen --package marin-core --extra cpu --no-default-groups
      - name: Prepare fixed workloads on Iris CPU and prove regional cache restore
        run: |
          uv run --no-sync python -m experiments.evaluation.agentx.validate_preparation \
            --profile "$PROFILE" --vllm-release "$VLLM_RELEASE" \
            --root "s3://marin-rno2a/marin/users/romain/agentx-runner-01a1aa6b/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/agentx-preparation"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agentx-cpu-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agentx-preparation
          if-no-files-found: ignore
