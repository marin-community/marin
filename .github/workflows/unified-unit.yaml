name: AgentX temporary acceptance
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [submit, collect, cancel]
        default: submit
      source_run:
        type: string
        default: ''
      profile:
        type: choice
        options: [h100, gb200]
        default: h100
      point:
        type: choice
        options: ['8', '32', all]
        default: '8'
      priority:
        type: choice
        options: [interactive, batch]
        default: interactive
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  submit:
    if: inputs.mode == 'submit'
    uses: ./.github/workflows/agentx-performance.yaml
    secrets: inherit
    with:
      state_root: s3://marin-rno2a/marin/experiments/agentx-performance/v0/acceptance-01a16b9a
      profile: ${{ inputs.profile }}
      concurrency: ${{ inputs.point }}
      priority: ${{ inputs.priority }}
  collect:
    if: inputs.mode != 'submit'
    uses: ./.github/workflows/agentx-collect.yaml
    secrets: inherit
    with:
      state_root: s3://marin-rno2a/marin/experiments/agentx-performance/v0/acceptance-01a16b9a
      run_id: ${{ inputs.source_run }}
      operation: ${{ inputs.mode == 'cancel' && 'cancel' || 'advance' }}
