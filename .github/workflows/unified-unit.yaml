name: AgentX temporary cache acceptance
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [submit, collect]
        default: submit
      result_uri:
        type: string
        default: ''
permissions:
  contents: read
  id-token: write
jobs:
  submit:
    if: inputs.mode == 'submit'
    uses: ./.github/workflows/agentx-performance.yaml
    secrets: inherit
    with:
      state_root: s3://marin-rno2a/marin/experiments/agentx-performance/v1/runner-cache-01a16f74/acceptance
      profile: h100
      concurrency: '8'
      target_cluster: cw-rno2a
      priority: interactive
  collect:
    if: inputs.mode == 'collect'
    uses: ./.github/workflows/agentx-collect.yaml
    secrets: inherit
    with:
      state_root: s3://marin-rno2a/marin/experiments/agentx-performance/v1/runner-cache-01a16f74/acceptance
      result_uri: ${{ inputs.result_uri }}
