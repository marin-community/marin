name: AgentX private calibration validation

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [submit, collect]
        default: submit
      profile:
        type: choice
        options: [h100, gb200]
        default: h100
      concurrency:
        type: string
        default: '8'
      priority:
        type: choice
        options: [interactive, batch]
        default: interactive
      result_uri:
        type: string
        default: ''
      placement_uri:
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  submit:
    if: inputs.operation == 'submit'
    uses: ./.github/workflows/agentx-performance.yaml
    with:
      state_root: s3://marin-rno2a/marin/users/romain/agentx-calibration-01a17a59
      profile: ${{ inputs.profile }}
      concurrency: ${{ inputs.concurrency }}
      target_cluster: cw-rno2a
      priority: ${{ inputs.priority }}
      placement_uri: ${{ inputs.placement_uri }}
    secrets: inherit
  collect:
    if: inputs.operation == 'collect'
    uses: ./.github/workflows/agentx-collect.yaml
    with:
      state_root: s3://marin-rno2a/marin/users/romain/agentx-calibration-01a17a59
      result_uri: ${{ inputs.result_uri }}
    secrets: inherit
