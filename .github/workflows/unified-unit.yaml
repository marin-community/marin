name: AgentX private calibration validation

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [submit, collect, admission]
        default: submit
      profile:
        type: choice
        options: [h100, gb200]
        default: h100
      concurrency:
        type: string
        default: '8'
      priority:
        type: choice
        options: [interactive, batch]
        default: interactive
      target_cluster:
        type: choice
        options: [cw-rno2a, cw-us-east-02a]
        default: cw-rno2a
      result_uri:
        type: string
        default: ''
      placement_uri:
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  admission:
    if: inputs.operation == 'admission'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CW_KEY_ID: ${{ secrets.CW_ACCESS_KEY_ID }}
      CW_KEY_SECRET: ${{ secrets.CW_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v3
        with:
          project_id: hai-gcp-models
          workload_identity_provider: projects/748532799086/locations/global/workloadIdentityPools/github-pool/providers/github-oidc
          service_account: github-iris@hai-gcp-models.iam.gserviceaccount.com
      - name: Install CPU control tools
        run: uv sync --frozen --package marin-core --extra cpu --no-default-groups
      - name: Check GitHub admission to the Hero peer without GPUs
        run: uv run --no-sync python -m experiments.evaluation.agentx.validation_admission --work "$RUNNER_TEMP/agentx-admission"
      - name: Cancel the owned CPU probe on explicit workflow cancellation
        if: cancelled()
        run: uv run --no-sync python -m experiments.evaluation.agentx.validation_admission --work "$RUNNER_TEMP/agentx-admission" --cancel
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agentx-cpu-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agentx-admission
          if-no-files-found: ignore
          retention-days: 90
  submit:
    if: inputs.operation == 'submit'
    uses: ./.github/workflows/agentx-performance.yaml
    with:
      state_root: s3://marin-rno2a/marin/users/romain/agentx-calibration-01a17a59
      profile: ${{ inputs.profile }}
      concurrency: ${{ inputs.concurrency }}
      target_cluster: ${{ inputs.target_cluster }}
      priority: ${{ inputs.priority }}
      placement_uri: ${{ inputs.placement_uri }}
    secrets: inherit
  collect:
    if: inputs.operation == 'collect'
    uses: ./.github/workflows/agentx-collect.yaml
    with:
      state_root: s3://marin-rno2a/marin/users/romain/agentx-calibration-01a17a59
      result_uri: ${{ inputs.result_uri }}
    secrets: inherit
