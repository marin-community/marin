name: Marin - AgentX candidate validation

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [collect, submit]
        default: collect
      state_root:
        description: Explicit result prefix for this validation campaign
        type: string
        required: true
      profile:
        type: choice
        options: [both, h100, gb200]
        default: h100
      concurrency:
        description: Concurrent AgentX users, or all fixed loads
        type: string
        default: all
      target_cluster:
        type: choice
        options: [cw-rno2a, cw-us-east-02a]
        default: cw-rno2a
      priority:
        type: choice
        options: [interactive, batch]
        default: interactive
      placement_uri:
        description: Current verified GB200 spare-node receipt
        type: string
        default: ''
      vllm_release:
        description: Published release tag; omit to follow Marin selection
        type: string
        default: ''
      result_uri:
        description: Completed descriptor; omit for the next undelivered result
        type: string
        default: ''
      ingest_image:
        description: Deployed importer image digest for explicit validation
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  submit:
    if: github.repository == 'marin-community/marin' && inputs.operation == 'submit'
    uses: ./.github/workflows/agentx-performance.yaml
    with:
      state_root: ${{ inputs.state_root }}
      profile: ${{ inputs.profile }}
      concurrency: ${{ inputs.concurrency }}
      target_cluster: ${{ inputs.target_cluster }}
      priority: ${{ inputs.priority }}
      placement_uri: ${{ inputs.placement_uri }}
      vllm_release: ${{ inputs.vllm_release }}
    secrets: inherit

  collect:
    if: github.repository == 'marin-community/marin' && inputs.operation == 'collect'
    uses: ./.github/workflows/agentx-collect.yaml
    with:
      state_root: ${{ inputs.state_root }}
      result_uri: ${{ inputs.result_uri }}
      ingest_image: ${{ inputs.ingest_image }}
    secrets: inherit
