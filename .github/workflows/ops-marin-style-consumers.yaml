name: "Ops - Marin Style Consumer Update"

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.9.26"

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Reachable marin-style commit; empty selects main"
        required: false
        type: string
      consumer:
        description: "Installed consumer repository; empty selects all"
        required: false
        type: string
      manifest_mode:
        description: "Manifest handling mode"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - bootstrap
      merge_mode:
        description: "Publication mode; bootstrap requires publish"
        required: true
        default: "publish"
        type: choice
        options:
          - publish
          - merge

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: external-runtime-updater
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      revision: ${{ steps.config.outputs.revision }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: discovery-token
        with:
          client-id: ${{ vars.DEPENDENCY_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATER_PRIVATE_KEY }}
          owner: marin-community
          permission-contents: read
      - uses: actions/checkout@v5
        with:
          path: marin
      - uses: actions/checkout@v5
        with:
          repository: marin-community/marin-style
          ref: ${{ inputs.revision || 'main' }}
          fetch-depth: 0
          path: marin-style
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - id: config
        env:
          GH_TOKEN: ${{ steps.discovery-token.outputs.token }}
          SELECTED_CONSUMER: ${{ inputs.consumer }}
        run: |
          revision=$(git -C marin-style rev-parse HEAD)
          git -C marin-style fetch origin main:refs/remotes/origin/main
          git -C marin-style merge-base --is-ancestor "$revision" origin/main
          matrix=$(PYTHONPATH=marin uv run --no-project python \
            -m scripts.ci.marin_style_update matrix --consumer "$SELECTED_CONSUMER")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  update:
    needs: [discover]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: external-runtime-updater
    concurrency:
      group: marin-style-update-${{ matrix.name }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: checkout-token
        with:
          client-id: ${{ vars.DEPENDENCY_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATER_PRIVATE_KEY }}
          owner: marin-community
          repositories: ${{ matrix.repository_name }}
          permission-contents: read
      - uses: actions/checkout@v5
        with:
          path: marin
      - uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.base_branch }}
          fetch-depth: 0
          token: ${{ steps.checkout-token.outputs.token }}
          path: consumer
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/create-github-app-token@v3
        id: update-token
        with:
          client-id: ${{ vars.DEPENDENCY_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATER_PRIVATE_KEY }}
          owner: marin-community
          repositories: ${{ matrix.repository_name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Prepare consumer update
        env:
          APP_SLUG: ${{ vars.DEPENDENCY_UPDATER_APP_SLUG }}
          BASE_BRANCH: ${{ matrix.base_branch }}
          GH_TOKEN: ${{ steps.update-token.outputs.token }}
          MANIFEST_MODE: ${{ inputs.manifest_mode }}
          MERGE_MODE: ${{ inputs.merge_mode }}
          REPOSITORY: ${{ matrix.repository }}
          REVISION: ${{ needs.discover.outputs.revision }}
        run: |
          cd consumer
          if git config --local --get-all http.https://github.com/.extraheader >/dev/null; then
            git config --local --unset-all http.https://github.com/.extraheader
          fi
          auth_header=$(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth_header"
          PYTHONPATH="$GITHUB_WORKSPACE/marin" uv run --no-project python \
            -m scripts.ci.marin_style_update run \
            --repository "$REPOSITORY" \
            --base-branch "$BASE_BRANCH" \
            --revision "$REVISION" \
            --app-slug "$APP_SLUG" \
            --manifest-mode "$MANIFEST_MODE" \
            --merge-mode "$MERGE_MODE"
