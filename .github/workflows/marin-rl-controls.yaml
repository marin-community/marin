name: "Marin - Plan RL control refreshes"

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: "Model table to inspect"
        required: true
        type: choice
        options:
          - snowball
          - mochi
      preset:
        description: "Gated preset to inspect"
        type: string

permissions:
  contents: read

concurrency:
  group: marin-rl-controls
  queue: max

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUESTED_MODEL: ${{ inputs.model }}
      REQUESTED_PRESET: ${{ inputs.preset }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Plan refresh from main
        env:
          CW_KEY_ID: ${{ secrets.CW_ACCESS_KEY_ID }}
          CW_KEY_SECRET: ${{ secrets.CW_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          options=()
          if [[ -n "$REQUESTED_MODEL" ]]; then
            options+=(--model "$REQUESTED_MODEL")
          fi
          if [[ -n "$REQUESTED_PRESET" ]]; then
            options+=(--preset "$REQUESTED_PRESET")
          fi
          uv run --frozen --all-packages --extra cpu --no-default-groups \
            python -m experiments.post_training.rl_control_refresh "${options[@]}"
