name: "Marin - Refresh RL controls"

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
    inputs:
      preset:
        description: "Gated Snowball preset to inspect"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: marin-rl-controls
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUESTED_PRESET: ${{ inputs.preset }}
      RL_CONTROLS_CODE_CHANGES: ${{ vars.RL_CONTROLS_CODE_CHANGES }}
      RL_CONTROLS_PIN_MERGE_POLICY: ${{ vars.RL_CONTROLS_PIN_MERGE_POLICY }}
      RL_CONTROLS_BOT_LOGIN: ${{ vars.RL_CONTROLS_BOT_LOGIN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - uses: google-github-actions/auth@v3
        with:
          project_id: hai-gcp-models
          workload_identity_provider: projects/748532799086/locations/global/workloadIdentityPools/github-pool/providers/github-oidc
          service_account: github-iris@hai-gcp-models.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: hai-gcp-models

      - name: Plan refresh from main
        env:
          CW_KEY_ID: ${{ secrets.CW_ACCESS_KEY_ID }}
          CW_KEY_SECRET: ${{ secrets.CW_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          options=(--dry-run)
          if [[ -n "$REQUESTED_PRESET" ]]; then
            options+=(--preset "$REQUESTED_PRESET")
          fi
          uv run --frozen --all-packages --extra cpu --no-default-groups \
            python -m experiments.post_training.rl_control_refresh "${options[@]}"
