name: "Marin - App Release Drift"

on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    if: github.repository == 'marin-community/marin'
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: List maintained apps
        id: apps
        run: echo "apps=$(python3 scripts/ci/marina_app_releases.py all)" >> "$GITHUB_OUTPUT"

  drift:
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.apps) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Marina
        run: uv sync --locked --package marin-marina --no-default-groups
      - name: Authenticate the main-only deployment identity
        uses: google-github-actions/auth@v3
        with:
          project_id: hai-gcp-models
          workload_identity_provider: projects/748532799086/locations/global/workloadIdentityPools/github-pool/providers/github-oidc
          service_account: marin-cd-cloud-run-deploy@hai-gcp-models.iam.gserviceaccount.com
      - name: Report unreleased commits
        run: uv run --no-sync python scripts/ci/marina_app_releases.py drift "${{ matrix.name }}"
