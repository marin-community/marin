name: "Pulumi deploy"
description: "Roll a service through the shared deploy CLI."

inputs:
  service:
    description: "Service registered with the deploy CLI."
    required: true
  service-account:
    description: "GCP service account impersonated through Workload Identity Federation."
    required: true
  workload-identity-provider:
    description: "GCP workload identity provider resource name."
    default: "projects/748532799086/locations/global/workloadIdentityPools/github-pool/providers/github-oidc"
  gcp-project-id:
    description: "GCP project id."
    required: true
  config:
    description: "Optional Pulumi KEY=VALUE configuration override."
    default: ""
runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ inputs.gcp-project-id }}
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ inputs.gcp-project-id }}

    - name: Configure registry auth
      shell: bash
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Set up uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Set up Pulumi CLI
      uses: pulumi/setup-pulumi@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Roll the service
      shell: bash
      env:
        PULUMI_SERVICE: ${{ inputs.service }}
        PULUMI_CONFIG_OVERRIDE: ${{ inputs.config }}
      run: |
        set -euo pipefail
        config_args=()
        if [[ -n "$PULUMI_CONFIG_OVERRIDE" ]]; then
          config_args=(--config "$PULUMI_CONFIG_OVERRIDE")
        fi
        uv run --all-packages --extra deploy --frozen marin-deploy \
          "$PULUMI_SERVICE" rollout --yes "${config_args[@]}"
