name: Claude Canary Triage
description: Run the triage-canary skill against a failed Iris job. Centralizes the claude-code-action SHA, prompt, and tool allowlist.

inputs:
  oauth-token:
    description: Claude Code OAuth token (CLAUDE_CODE_OAUTH_TOKEN or CLAUDE_MAX_OAUTH_TOKEN).
    required: true
  lane:
    description: 'Canary lane identifier (e.g. tpu, gpu, datakit-smoke). Surfaced to the skill via $CANARY_LANE.'
    required: true
  job-id:
    description: Iris job ID under triage.
    required: true
  run-id:
    description: Workflow run identifier (RUN_ID env in the workflow).
    required: true
  iris-config:
    description: Iris config path used to talk to the controller.
    required: true
  gha-run-url:
    description: Public URL of the GitHub Actions run.
    required: true
  wandb-entity:
    description: WANDB entity for the run.
    required: true
  wandb-project:
    description: WANDB project for the run.
    required: true
  wandb-api-key:
    description: WANDB API key for read access.
    required: true
  iris-namespace:
    description: 'Kubernetes namespace (CoreWeave only). Empty for GCP lanes.'
    required: false
    default: ''
  allowed-tools:
    description: |
      Base --allowedTools list with the reporting tools needed to create an issue and slack_message.md.
    required: false
    default: 'Bash(gh:*),Bash(.venv/bin/iris:*),Bash(.venv/bin/python:*),Bash(cat:*),Bash(jq:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(date:*),Bash(mktemp:*),Bash(rm:*),Write,Read'
  extra-allowed-tools:
    description: 'Comma-separated lane-specific tools appended to allowed-tools.'
    required: false
    default: ''
  max-turns:
    description: Maximum agent turns.
    required: false
    default: '500'
runs:
  using: composite
  steps:
    - name: Run claude-code-action
      id: claude
      uses: marin-community/marin-style/actions/consult-agent@4b2fc2b0ec0bb9ad1304ef76936eb68e97f893cb  # main 2026-08-24
      with:
        claude_code_oauth_token: ${{ inputs.oauth-token }}
        prompt: |
          Read .agents/skills/triage-canary/SKILL.md and follow it.

          The CI invocation context is:
          - CANARY_LANE: ${{ inputs.lane }}
          - CANARY_JOB_ID: ${{ inputs.job-id }}
          - CANARY_RUN_ID: ${{ inputs.run-id }}
          - IRIS_CONFIG: ${{ inputs.iris-config }}
          - IRIS_NAMESPACE: ${{ inputs.iris-namespace }}
          - WANDB_ENTITY: ${{ inputs.wandb-entity }}
          - WANDB_PROJECT: ${{ inputs.wandb-project }}
          - GHA_RUN_URL: ${{ inputs.gha-run-url }}

          Use these values directly. Do not inspect the process environment to
          rediscover them. The matching environment variables remain available
          to commands invoked during triage.
        claude_args: |
          --model claude-opus-4-8
          --max-turns ${{ inputs.max-turns }}
          --allowedTools "${{ inputs.allowed-tools }}${{ inputs.extra-allowed-tools != '' && format(',{0}', inputs.extra-allowed-tools) || '' }}"
      env:
        CANARY_LANE: ${{ inputs.lane }}
        CANARY_JOB_ID: ${{ inputs.job-id }}
        CANARY_RUN_ID: ${{ inputs.run-id }}
        IRIS_CONFIG: ${{ inputs.iris-config }}
        IRIS_NAMESPACE: ${{ inputs.iris-namespace }}
        WANDB_ENTITY: ${{ inputs.wandb-entity }}
        WANDB_PROJECT: ${{ inputs.wandb-project }}
        WANDB_API_KEY: ${{ inputs.wandb-api-key }}
        GHA_RUN_URL: ${{ inputs.gha-run-url }}

    # claude-code-action hides the transcript from the step log. Preserve it so
    # incomplete triage can be diagnosed after the runner is gone.
    - name: Upload Claude triage log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: claude-triage-log-${{ github.run_id }}
        path: ${{ runner.temp }}/claude-execution-output.json
        retention-days: 30
        if-no-files-found: warn

    - name: Require Slack summary
      if: always() && steps.claude.outputs.rate_limited != 'true'
      shell: bash
      run: .venv/bin/python scripts/ci/validate_canary_triage_output.py slack_message.md
