<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>datakit dataviz</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--border:#dcdfe4;--text:#1c2024;--muted:#687078;--accent:#2563eb;--heat0:#eef2f7;--heat:#2563eb}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
header h1{margin:0;font-size:16px;display:inline-block}
header .path{color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:12px;margin-left:10px}
.tabs{display:flex;gap:4px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--border)}
.tab{padding:8px 14px;cursor:pointer;border:1px solid transparent;border-bottom:none;font-size:13px;color:var(--muted)}
.tab.active{color:var(--text);background:var(--bg);border-color:var(--border);border-radius:6px 6px 0 0;font-weight:600}
main{padding:16px 20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
select,input{padding:5px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px}
input[type=search]{width:220px}
button{padding:6px 12px;border:1px solid var(--border);border-radius:5px;background:#fff;cursor:pointer;font-size:13px}
button:hover{background:#f0f4fb}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:20px}
.stat b{display:block;font-size:17px}.stat span{color:var(--muted);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600}
pre{white-space:pre-wrap;word-wrap:break-word;margin:0;font:12px/1.45 ui-monospace,Menlo,monospace;max-height:240px;overflow:auto}
.bar{height:16px;background:var(--accent);border-radius:2px;display:inline-block;vertical-align:middle}
.barrow{display:flex;gap:8px;align-items:center;font-size:12px;margin:1px 0}
.barrow .lbl{width:150px;color:var(--muted);text-align:right;font-family:ui-monospace,monospace}
.barrow .cnt{color:var(--muted)}
.hidden{display:none!important}
.muted{color:var(--muted)}.spin{color:var(--accent)}
.heat{border-collapse:collapse}.heat td,.heat th{text-align:center;padding:1px;font-size:11px}
.cell{width:64px;height:34px;border:1px solid var(--border);border-radius:3px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;line-height:1.05}
.cell.empty{cursor:default;background:#fafbfc;color:#c4c8cc}.cell.sel{outline:3px solid var(--accent);outline-offset:-1px}
.rowhdr{color:var(--muted);font-family:ui-monospace,monospace;padding-right:6px!important;text-align:right}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:#eef2f7;color:var(--muted);margin-left:6px}
</style>
</head>
<body>
<header><h1>datakit dataviz</h1><span class="path" id="path">loading…</span><span class="pill" id="verified"></span></header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>

<script>
const fmt=n=>(n==null?'—':Number(n).toLocaleString());
function cnum(n){if(n==null)return '—';n=+n;const a=Math.abs(n);
  if(a>=1e9)return (n/1e9).toFixed(a>=1e10?0:1)+'B';
  if(a>=1e6)return (n/1e6).toFixed(a>=1e7?0:1)+'M';
  if(a>=1e3)return (n/1e3).toFixed(a>=1e4?0:1)+'K';
  return String(n);}
let OV=null;   // overview payload
let TAB='overview';

async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.statusText);return r.json();}
async function runQuery(view,params){
  const {query_id}=await (await fetch('api/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({view,params})})).json();
  for(;;){
    const d=await getJSON('api/result/'+query_id);
    if(d.status==='done')return d.result;
    if(d.status==='error')throw new Error(d.error);
    await new Promise(r=>setTimeout(r,700));
  }
}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
function bars(rows,labelFn,countFn){
  const max=Math.max(1,...rows.map(countFn));
  return rows.map(r=>`<div class="barrow"><span class="lbl">${esc(labelFn(r))}</span><span class="bar" style="width:${Math.round(260*countFn(r)/max)}px"></span><span class="cnt">${fmt(countFn(r))}</span></div>`).join('');
}
function sourceInput(id,sources){
  const dl=id+'-dl';
  return `<input list="${dl}" id="${id}" placeholder="type to filter source…" autocomplete="off" spellcheck="false" style="width:280px">`+
    `<datalist id="${dl}">${sources.map(s=>`<option value="${esc(s)}"></option>`).join('')}</datalist>`;
}
function sampleTable(rows,cols){
  if(!rows||!rows.length)return '<p class="muted">no rows</p>';
  const head=cols.map(c=>`<th>${esc(c)}</th>`).join('');
  const body=rows.map(r=>'<tr>'+cols.map(c=>c==='text'?`<td><pre>${esc(r[c])}</pre></td>`:`<td>${esc(r[c])}</td>`).join('')+'</tr>').join('');
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}
function loading(node){node.innerHTML='<p class="spin">running query…</p>';}
function fail(node,e){node.innerHTML=`<p style="color:#b00">error: ${esc(e.message)}</p>`;}

const TABS=[['overview','Overview'],['sources','Sources'],['normalized','Normalized'],['decontam','Decontamination'],['dedup','Deduplication'],['quality','Classifier'],['store','Store']];
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<div class="tab ${k===TAB?'active':''}" data-k="${k}">${l}</div>`).join('');
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{TAB=t.dataset.k;renderTabs();render();});
}

function render(){
  const m=document.getElementById('main');
  if(TAB==='overview')return renderOverview(m);
  if(TAB==='sources')return renderSources(m);
  if(TAB==='normalized')return renderStageSource(m,'normalized');
  if(TAB==='decontam')return renderStageSource(m,'decontam');
  if(TAB==='quality')return renderStageSource(m,'quality');
  if(TAB==='dedup')return renderDedup(m);
  if(TAB==='store')return renderStore(m);
}

function renderOverview(m){
  const c=OV.counters||{};
  const cov=k=>`${(OV.resolved[k]||[]).length}/${OV.sources.length}`;
  m.innerHTML=`<div class="card"><div class="stats">
    <div class="stat"><b>${fmt(OV.sources.length)}</b><span>sources</span></div>
    <div class="stat"><b>${fmt(OV.buckets.length)}</b><span>buckets (k=${OV.cluster_view})</span></div>
    <div class="stat"><b>${fmt(c['datakit_store/records_in'])}</b><span>records in</span></div>
    <div class="stat"><b>${fmt(c['datakit_store/records_out'])}</b><span>records out (stored)</span></div>
    <div class="stat"><b>${fmt(c['datakit_store/contaminated_dropped'])}</b><span>decontam dropped</span></div>
    <div class="stat"><b>${fmt(c['datakit_store/dedup_noncanonical_dropped'])}</b><span>dedup dropped</span></div>
  </div></div>
  <div class="card"><h3>Stage coverage (resolved via lineage)</h3>
    <p class="muted">data prefix <code>${esc(OV.data_prefix)}</code> · tokenizer <code>${esc(OV.tokenizer)}</code></p>
    <table><tbody>
     <tr><td>normalize</td><td>${cov('normalize')}</td></tr>
     <tr><td>decontam</td><td>${cov('decontam')}</td></tr>
     <tr><td>cluster_assign</td><td>${cov('cluster_assign')}</td></tr>
     <tr><td>quality</td><td>${cov('quality')} ${OV.resolved.quality.length?'':'<span class="muted">(ambiguous — set DATAVIZ_QUALITY_MODEL + DATAVIZ_DOMAIN_CENTROIDS)</span>'}</td></tr>
     <tr><td>dedup</td><td>${OV.dedup?esc(OV.dedup):'<span class="muted">unresolved</span>'}</td></tr>
    </tbody></table></div>`;
}

let SORT={key:'drop_rate',dir:-1};
function renderSources(m){
  const rows=OV.source_summary||[];
  if(!rows.length){m.innerHTML='<div class="card"><p class="muted">no source summary baked in (set DATAVIZ_SOURCE_SUMMARY)</p></div>';return;}
  const cols=[['source','source'],['docs_est','docs'],['q_avg','quality avg'],['q_sd','q sd'],['q_zero','frac score≈0'],['drop_rate','dedup drop'],['dup_largest','largest dup'],['decon_pct','contam %']];
  rows.sort((a,b)=>{const k=SORT.key,x=a[k],y=b[k];if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*SORT.dir;});
  const warn=(k,v)=>{if(v==null)return '';
    if(k==='drop_rate'&&v>0.5)return 'background:#fdecea';
    if(k==='q_avg'&&v<0.05)return 'background:#fdecea';
    if(k==='q_zero'&&v>0.3)return 'background:#fff4e5';
    if(k==='q_sd'&&v<0.05)return 'background:#fff4e5';
    if(k==='decon_pct'&&v>1)return 'background:#fdecea';return '';};
  const head=cols.map(([k,l])=>`<th style="cursor:pointer" data-k="${k}">${l}${SORT.key===k?(SORT.dir>0?' ▲':' ▼'):''}</th>`).join('');
  const body=rows.map(r=>'<tr>'+cols.map(([k])=>{
    let v=r[k];const disp=(k==='docs_est')?fmt(v):(v==null?'—':v);
    return `<td style="${warn(k,v)}">${esc(disp)}</td>`;}).join('')+'</tr>').join('');
  m.innerHTML=`<div class="card"><h3>Per-source pipeline summary <span class="muted">(sampled; click a header to sort)</span></h3>
    <p class="muted">red = dedup drop &gt;50% or quality avg &lt;0.05 or contamination &gt;1%; orange = frac≈0 &gt;0.3 or quality sd &lt;0.05 (no discrimination)</p>
    <table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  m.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;SORT=(SORT.key===k)?{key:k,dir:-SORT.dir}:{key:k,dir:(k==='source'?1:-1)};render();});
}

function renderStageSource(m,stage){
  const resolved=new Set(OV.resolved[stage==='normalized'?'normalize':stage]||[]);
  m.innerHTML=`<div class="card"><div class="controls">
    <label>source ${sourceInput('src',OV.sources)}</label>
    ${stage==='normalized'?'<input type="search" id="q" placeholder="search text…">':''}
    <button class="primary" id="go">load</button></div>
    <div id="out"><p class="muted">type a source name and load</p></div></div>`;
  const out=document.getElementById('out');
  document.getElementById('go').onclick=async()=>{
    const src=document.getElementById('src').value.trim();
    if(!src){out.innerHTML='<p class="muted">type a source name</p>';return;}
    if(!resolved.has(src)){out.innerHTML=`<p class="muted">${stage} not resolved for ${esc(src)} (unknown or unresolved source)</p>`;return;}
    loading(out);
    try{
      if(stage==='normalized')await loadNormalized(out,src);
      else if(stage==='decontam')await loadDecontam(out,src);
      else if(stage==='quality')await loadQuality(out,src);
    }catch(e){fail(out,e);}
  };
}
async function loadNormalized(out,src){
  const [st,hist,samp]=await Promise.all([
    runQuery('normalized_stats',{source:src}),
    runQuery('normalized_hist',{source:src}),
    runQuery('normalized_samples',{source:src,n:20,search:document.getElementById('q').value}),
  ]);
  out.innerHTML=`<div class="stats">
     <div class="stat"><b>${fmt(st.docs)}</b><span>docs</span></div>
     <div class="stat"><b>${fmt(st.avg_chars)}</b><span>avg chars</span></div>
     <div class="stat"><b>${fmt(st.median_chars)}</b><span>median chars</span></div>
     <div class="stat"><b>${fmt(st.max_chars)}</b><span>max chars</span></div></div>
   <h4>char-length distribution (log buckets)</h4>${bars(hist,r=>`${fmt(r.lo)}–${fmt(r.hi)}`,r=>r.docs)}
   <h4>samples</h4>${sampleTable(samp,['id','chars','text'])}`;
}
async function loadDecontam(out,src){
  const [st,samp]=await Promise.all([runQuery('decontam_stats',{source:src}),runQuery('decontam_samples',{source:src,n:20})]);
  out.innerHTML=`<div class="stats">
     <div class="stat"><b>${fmt(st.docs)}</b><span>docs</span></div>
     <div class="stat"><b>${fmt(st.contaminated)}</b><span>contaminated</span></div>
     <div class="stat"><b>${st.contaminated_pct}%</b><span>contaminated</span></div>
     <div class="stat"><b>${st.max_overlap}</b><span>max overlap</span></div></div>
   <h4>most-contaminated samples</h4>${sampleTable(samp,['id','max_overlap','text'])}`;
}
async function loadQuality(out,src){
  const hist=await runQuery('quality_hist',{source:src});
  const max=Math.max(1,...hist.map(r=>r.docs));
  let html='<h4>quality score distribution <span class="muted">(click a bar to sample that score range)</span></h4>';
  for(const r of hist)
    html+=`<div class="barrow qb" style="cursor:pointer" data-lo="${r.lo}" data-hi="${r.hi}"><span class="lbl">${r.lo}–${r.hi}</span><span class="bar" style="width:${Math.round(260*r.docs/max)}px"></span><span class="cnt">${fmt(r.docs)}</span></div>`;
  html+='<div id="qs"><p class="muted">click a score range above to load samples</p></div>';
  out.innerHTML=html;
  out.querySelectorAll('.qb').forEach(el=>el.onclick=async()=>{
    out.querySelectorAll('.qb').forEach(x=>x.style.fontWeight='');el.style.fontWeight='700';
    const lo=+el.dataset.lo, hi=+el.dataset.hi, qs=document.getElementById('qs');loading(qs);
    try{const s=await runQuery('quality_samples',{source:src,lo:lo,hi:hi+0.0001,n:20});
      qs.innerHTML=`<h4>samples with score in ${lo}–${hi}</h4>${sampleTable(s,['score','text'])}`;
    }catch(e){fail(qs,e);}
  });
}

function renderDedup(m){
  const c=OV.counters||{};
  const ds=(OV.source_summary||[]).filter(r=>r.drop_rate!=null).map(r=>r.source).sort();
  m.innerHTML=`<div class="card"><h3>Deduplication (store-wide)</h3>
   <div class="stats">
     <div class="stat"><b>${fmt(c['datakit_store/records_in'])}</b><span>records in</span></div>
     <div class="stat"><b>${fmt(c['datakit_store/dedup_noncanonical_dropped'])}</b><span>dropped as non-canonical</span></div>
     <div class="stat"><b>${fmt(c['datakit_store/records_out'])}</b><span>kept (canonical/singleton)</span></div>
   </div>
   <p class="muted">fuzzy-dup dataset: <code>${OV.dedup?esc(OV.dedup):'unresolved'}</code></p></div>
   <div class="card"><div class="controls"><label>source ${sourceInput('ds',ds)}</label>
     <button class="primary" id="dgo">load duplicate clusters</button></div>
     <div id="dout"><p class="muted">type a source to inspect its duplicate clusters (canonical kept vs dropped)</p></div></div>`;
  const out=document.getElementById('dout');
  document.getElementById('dgo').onclick=()=>{const s=document.getElementById('ds').value.trim();if(s)loadDedup(out,s);};
}
async function loadDedup(out,src){
  const s=(OV.source_summary||[]).find(r=>r.source===src)||{};
  const pct=v=>v==null?'—':(100*v).toFixed(1)+'%';
  loading(out);
  try{
    const cl=await runQuery('dedup_examples',{source:src,n_clusters:6});
    let html=`<div class="stats">
      <div class="stat"><b>${pct(s.drop_rate)}</b><span>docs dropped as dup</span></div>
      <div class="stat"><b>${pct(s.dup_prevalence)}</b><span>in a dup cluster</span></div>
      <div class="stat"><b>${fmt(s.dup_largest)}</b><span>largest cluster (sampled)</span></div>
      <div class="stat"><b>${s.dup_avg_size??'—'}</b><span>avg cluster size</span></div>
      <div class="stat"><b>${fmt(s.docs_est)}</b><span>docs (est)</span></div></div>
      <h4>example duplicate clusters <span class="muted">(densest clusters in a sampled window; KEPT = canonical)</span></h4>`;
    if(!cl.length) html+='<p class="muted">no multi-member clusters found in the sampled window</p>';
    for(const c of cl){
      html+=`<div class="sample"><div class="shdr"><span>cluster ${esc(String(c.cluster_id).slice(0,14))}…</span><span>~${fmt(c.sampled_size)} members</span></div>`;
      for(const mem of c.members)
        html+=`<div style="padding:6px 10px;border-top:1px solid var(--border)"><span style="font-size:11px;padding:1px 7px;border-radius:10px;${mem.canonical?'background:#e7f5ee;color:#1b5e20':'background:#fff7e6;color:#7a4a00'}">${mem.canonical?'KEPT':'dropped'}</span><pre style="margin-top:4px">${esc(mem.text)}</pre></div>`;
      html+='</div>';
    }
    out.innerHTML=html;
  }catch(e){fail(out,e);}
}

let STORESORT={key:'docs',dir:-1};
function renderStore(m){
  const nq=OV.n_quality_buckets;
  const qr=q=>{const b=OV.buckets.find(x=>x.quality_bucket===q);return b?b.quality_range:('q'+q);};
  const cl={};
  OV.buckets.forEach(b=>{const r=cl[b.cluster_id]||(cl[b.cluster_id]={cluster:b.cluster_id,docs:0,tokens:0,q:{}});
    r.docs+=b.total_elements;r.tokens+=b.total_tokens;r.q[b.quality_bucket]=(r.q[b.quality_bucket]||0)+b.total_elements;});
  let rows=Object.values(cl);
  const tot={docs:0,tokens:0,q:{}};rows.forEach(r=>{tot.docs+=r.docs;tot.tokens+=r.tokens;for(let q=0;q<nq;q++)tot.q[q]=(tot.q[q]||0)+(r.q[q]||0);});
  const k=STORESORT.key;
  rows.sort((a,b)=>{let x,y;if(k==='cluster'){x=a.cluster;y=b.cluster;}else if(k==='docs'||k==='tokens'){x=a[k];y=b[k];}else{x=a.q[+k]||0;y=b.q[+k]||0;}return (x>y?1:x<y?-1:0)*STORESORT.dir;});
  // per-cluster quality mix: stacked share q0..q4 (light->dark = low->high quality)
  const qmix=r=>{let s='';for(let q=0;q<nq;q++){const f=r.docs?(r.q[q]||0)/r.docs:0;
    s+=`<span title="q${q} ${esc(qr(q))}: ${(100*f).toFixed(0)}%" style="height:11px;width:${(100*f).toFixed(1)}%;background:rgba(37,99,235,${(0.2+0.8*q/(nq-1)).toFixed(2)})"></span>`;}
    return `<span style="display:inline-flex;width:80px;border-radius:2px;overflow:hidden;vertical-align:middle">${s}</span>`;};
  const th=(kk,l,al)=>`<th data-k="${kk}" style="cursor:pointer;text-align:${al||'right'}">${l}${STORESORT.key===kk?(STORESORT.dir>0?' ▲':' ▼'):''}</th>`;
  let head=th('cluster','cluster','left');for(let q=0;q<nq;q++)head+=th(String(q),'q'+q);head+=th('docs','docs')+'<th>quality mix</th>'+th('tokens','tokens');
  const rowHtml=r=>{let t=`<td style="text-align:left">c${r.cluster}</td>`;
    for(let q=0;q<nq;q++)t+=`<td class="qcell" data-c="${r.cluster}" data-q="${q}" title="sample cluster ${r.cluster} × q${q}" style="text-align:right;cursor:pointer">${cnum(r.q[q]||0)}</td>`;
    return `<tr>${t}<td style="text-align:right"><b>${cnum(r.docs)}</b></td><td>${qmix(r)}</td><td style="text-align:right">${cnum(r.tokens)}</td></tr>`;};
  let totrow=`<tr style="font-weight:600;border-top:2px solid var(--border)"><td style="text-align:left">all</td>`;
  for(let q=0;q<nq;q++)totrow+=`<td style="text-align:right">${cnum(tot.q[q]||0)}</td>`;
  totrow+=`<td style="text-align:right">${cnum(tot.docs)}</td><td></td><td style="text-align:right">${cnum(tot.tokens)}</td></tr>`;
  m.innerHTML=`<div class="card"><div class="stats">
     <div class="stat"><b>${cnum(tot.docs)}</b><span>documents</span></div>
     <div class="stat"><b>${cnum(tot.tokens)}</b><span>tokens</span></div>
     <div class="stat"><b>${rows.length}</b><span>clusters (k=${OV.cluster_view})</span></div>
     <div class="stat"><b>${OV.buckets.length}</b><span>buckets</span></div></div>
   <p class="muted">q0..q${nq-1} = quality score ranges ${[...Array(nq).keys()].map(q=>esc(qr(q))).join(' · ')}; click a header to sort</p>
   <table><thead><tr>${head}</tr></thead><tbody>${rows.map(rowHtml).join('')}${totrow}</tbody></table></div>
   <div class="card"><div class="controls">
     <label>cluster <select id="sc">${rows.map(r=>`<option value="${r.cluster}">c${r.cluster} · ${cnum(r.docs)} docs</option>`).join('')}</select></label>
     <label>quality <select id="sq"><option value="">any</option>${[...Array(nq).keys()].map(q=>`<option value="${q}">q${q} ${esc(qr(q))}</option>`).join('')}</select></label>
     <input type="number" id="sn" value="12" min="1" max="50" style="width:64px"><button class="primary" id="sgo">sample</button></div>
     <div id="ss"><p class="muted">pick a cluster + quality (or click a cell in the table above) to sample its documents</p></div></div>`;
  m.querySelectorAll('th[data-k]').forEach(t=>t.onclick=()=>{const kk=t.dataset.k;STORESORT=(STORESORT.key===kk)?{key:kk,dir:-STORESORT.dir}:{key:kk,dir:(kk==='cluster'?1:-1)};render();});
  const go=()=>sampleBucket(+document.getElementById('sc').value,document.getElementById('sq').value,+document.getElementById('sn').value);
  document.getElementById('sgo').onclick=go;
  m.querySelectorAll('.qcell').forEach(c=>c.onclick=()=>{document.getElementById('sc').value=c.dataset.c;document.getElementById('sq').value=c.dataset.q;
    sampleBucket(+c.dataset.c,c.dataset.q,+document.getElementById('sn').value);});
}
async function sampleBucket(cluster,q,n){
  const ss=document.getElementById('ss');loading(ss);
  try{
    let rows,cols,label;
    if(q===''||q==null){rows=await runQuery('store_samples',{cluster,n:n||12});cols=['source','text'];label=`cluster ${cluster} · any quality`;}
    else{rows=await runQuery('store_bucket_samples',{cluster,quality_bucket:+q,n:n||12});cols=['source','score','text'];label=`cluster ${cluster} · q${q}`;}
    ss.innerHTML=`<h4>${label} — ${rows.length} sample documents (exact text)</h4>${rows.length?sampleTable(rows,cols):'<p class="muted">no documents matched in the sampled sources</p>'}`;
  }catch(e){fail(ss,e);}
}

(async()=>{
  try{
    OV=await getJSON('api/overview');
    document.getElementById('path').textContent=OV.store_path;
    const v=document.getElementById('verified');
    v.textContent=OV.verified?'lineage verified':'lineage best-effort';
    v.style.background=OV.verified?'#e7f5ee':'#fff7e6';
    renderTabs();render();
  }catch(e){document.getElementById('main').innerHTML=`<p style="color:#b00">failed to load overview: ${esc(e.message)}</p>`;}
})();
</script>
