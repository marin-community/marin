[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-evals"
version = "0.1.0"
description = "Standalone agentic evaluation package — Harbor-based evals on Iris TPU/GPU clusters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
    "harbor>=0.7.0",
]

[project.optional-dependencies]
# Full local runner (Ray + vLLM GPU serve)
serve = [
    "vllm>=0.7.0",
    "ray[default]>=2.10",
]
# HuggingFace trace upload
hf = [
    "huggingface_hub>=0.24",
]
# Iris TPU/GPU cluster backend
iris = [
    "iris-client",
    "rigging",
]
# TPU serving (vLLM-TPU)
tpu = [
    "vllm-tpu>=0.20.0",
    "jax[tpu]",
]
# Everything for local development
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
agentic-eval-launch = "agentic_evals.launch:main"
agentic-eval-run = "agentic_evals.run_eval:main"

[tool.hatch.build.targets.wheel]
packages = ["agentic_evals"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
