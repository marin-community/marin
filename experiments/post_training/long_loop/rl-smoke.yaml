# Long-loop-owned recipe, copied from the quick-loop composition at Marin 1cf5c009d3.
# Historical base recipe; the current launcher reads explicit stage configs from a run spec.
entrypoint: taskcompendium
context_budget:
  request_window_tokens: 24576
  max_new_tokens_per_turn: 8192
  max_turns: 1
environment:
  task_sessions:
    local: {}
    daytona:
      api_key_env: DAYTONA_RL_API_KEY
      ttl_minutes: 60
    remote_judge:
      base_url: https://api.together.xyz/v1
      api_key_env: TOGETHER_API_KEY
trainer:
  strategy: megatron
  flash_attn: false
  use_sample_packing: false
  gradient_checkpointing: true
  offload_optimizer_during_rollouts: false
  epochs: 50
  max_steps: 3
  update_epochs_per_batch: 1
  micro_forward_batch_size_per_gpu: 1
  eval_batch_size: 256
  eval_interval: 0
  resume_mode: none
  max_ckpts_to_keep: 2
  seed: 20261020
  logger: wandb
  project_name: marin-long-loop
  tracker_commit_each_step: true
  training_metrics: true
  rollout_spans: true
  policy_train_spans: true
  algorithm:
    advantage_estimator: rloo_n
    policy_loss_type: regular
    loss_reduction: token_mean
    use_kl_loss: false
    use_kl_in_reward: false
    kl_estimator_type: k3_unbiased_gradient
    off_policy_correction: none
    eps_clip_low: 0.2
    eps_clip_high: 0.2
    group_advantage_min_size: 2
    advantage_batch_normalize: false
    rloo_n_filter_zero_reward_groups: true
    use_entropy_loss: false
  policy:
    optimizer_config:
      optimizer: AdamW
      lr: 1.0e-06
      weight_decay: 0.0
      max_grad_norm: 0.5
      adam_betas:
      - 0.9
      - 0.999
      scheduler: constant_with_warmup
      num_warmup_steps: 0
    megatron_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 2
      context_parallel_size: 1
      expert_model_parallel_size: 8
      expert_tensor_parallel_size: 1
  ref:
    megatron_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 2
      context_parallel_size: 1
      expert_model_parallel_size: 8
      expert_tensor_parallel_size: 1
  placement: {}
  rollout_buffer:
    max_staleness_steps: 2
    batch_policy: full_batch
    max_in_flight: null
    object_store_root: null
  eval_before_train: false
  ckpt_interval: 3
  eval_num_prompts: null
  dump_eval_results: true
  step_wise_training: true
  dump_data_batch: true
generator:
  backend: vllm
  model_dtype: bfloat16
  vllm_attention_backend: FLASH_ATTN
  run_engines_locally: true
  weight_sync_backend: nccl
  weight_sync_pause:
    mode: keep
    clear_cache: true
  weight_sync_transport: expert_block
  expert_block_sync:
    timeout_seconds: 600
    verify: false
  gpu_memory_utilization: 0.75
  max_num_seqs: 1024
  max_num_batched_tokens: 8192
  enable_prefix_caching: true
  enable_chunked_prefill: true
  enforce_eager: false
  enable_http_endpoint: false
  chat_template: null
  engine_init_kwargs:
    moe_backend: triton
  sampling_params:
    temperature: 1.0
    top_p: 1.0
    logprobs: 0
    stop_token_ids:
    - 128001
    - 128009
    skip_special_tokens: false
  trajectory_reward_shaping:
    enabled: true
    overlong:
      penalty_scale: 0.0
    reasoning_span:
      penalty: 0.1
      target: marker
  chat_template_kwargs:
    enable_thinking: true
  eval_sampling_params:
    stop_token_ids:
    - 128001
    - 128009
    skip_special_tokens: false
data:
  kind: parquet
  shuffle: true
extra_env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  VERIFYIT_JUDGE_MODEL: openai/gpt-oss-120b
  NCCL_NET: Socket
  NCCL_IB_DISABLE: '1'
  NCCL_SOCKET_FAMILY: AF_INET
