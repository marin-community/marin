name: long-loop/micro-full
config:
  entrypoint: generate
  config_groups:
    terminal_bench_config: terminal_bench
  context_budget:
    request_window_tokens: 65536
    max_new_tokens_per_turn: 16384
    max_turns: 1024
  environment:
    task_sessions:
      local: {}
      remote_judge:
        api_key_env: JUDGE_API_KEY
  trainer:
    strategy: megatron
    evaluation_runner: task
    eval_interval: 1
    eval_batch_size: 32
    resume_mode: none
    algorithm:
      use_kl_loss: false
    policy:
      megatron_config:
        tensor_model_parallel_size: 1
        pipeline_model_parallel_size: 1
        context_parallel_size: 1
        expert_model_parallel_size: 8
        expert_tensor_parallel_size: 1
    ref:
      megatron_config:
        tensor_model_parallel_size: 1
        pipeline_model_parallel_size: 1
        context_parallel_size: 1
        expert_model_parallel_size: 8
        expert_tensor_parallel_size: 1
    logger: console
    placement:
      colocate_all: true
      colocate_policy_ref: true
      policy_num_nodes: 16
      policy_num_gpus_per_node: 8
      ref_num_nodes: 16
      ref_num_gpus_per_node: 8
    train_batch_size: 1
    policy_mini_batch_size: 1
    micro_train_batch_size_per_gpu: 1
    distributed:
      placement_group_timeout_seconds: 259200
      worker_collective_timeout_seconds: 259200
  generator:
    backend: vllm
    model_dtype: bfloat16
    max_num_seqs: 8
    engine_init_kwargs:
      enable_auto_tool_choice: true
      tool_call_parser: hermes
      hf_overrides:
        max_position_embeddings: 262144
        max_seq_len: 262144
    run_engines_locally: true
    enable_http_endpoint: false
    gpu_memory_utilization: 0.85
    enforce_eager: false
    chat_template:
      source: name
      name_or_path: null
    chat_template_kwargs:
      enable_thinking: true
    sampling_params:
      temperature: 0.7
      top_p: 0.95
      logprobs: 0
      skip_special_tokens: false
      stop_token_ids:
      - 128001
      - 128009
    eval_sampling_params:
      temperature: 0.7
      top_p: 0.95
      skip_special_tokens: false
      stop_token_ids:
      - 128001
      - 128009
    eval_n_samples_per_prompt: 1
    num_inference_engines: 16
    inference_engine_tensor_parallel_size: 1
    inference_engine_pipeline_parallel_size: 1
    inference_engine_data_parallel_size: 8
    inference_engine_expert_parallel_size: 8
    n_samples_per_prompt: 1
    trajectory_retention:
      enabled: true
      run_id: 2026.11.09
      phases:
      - eval
      sample_fraction: 1.0
      eval_sample_fraction: 1.0
      sample_count_per_step: 0
      always_retain_failures: false
      always_retain_non_terminating: false
      always_retain_loops: false
      reward_below: null
      reward_above: null
      max_bytes_per_step: null
      max_bytes_per_run: null
      required: true
      publish_timeout_seconds: 259200
      shutdown_timeout_seconds: 259200
    engine_init_timeout_seconds: 259200
    expert_block_sync:
      timeout_seconds: 259200
    weight_sync_pause_timeout_seconds: 259200
  terminal_bench:
    harbor:
      environment_type: daytona
      daytona_image_build: declarative
      eval_daytona_image_build: declarative
      daytona_api_key_env: DAYTONA_EVAL_API_KEY
      eval_daytona_api_key_env: DAYTONA_EVAL_API_KEY
      verifier_override_timeout_sec: null
      override_timeout_sec: 1800
      eval_timeout_override_sec: 1800
      trial_attempt_timeout_sec: 10800
      n_concurrent_trials: 8
      max_retries: 0
    installed_agent:
      agent:
        name: pi
        override_setup_timeout_sec: 360
        kwargs:
          version: 0.87.0
          mcp_adapter_version: 7.0.0
          thinking: high
          thinking_format: chat-template
          model_info:
            max_input_tokens: 65536
            max_output_tokens: 16384
          compaction_reserve_tokens: 16384
      setup_timeout: 360
      run_timeout: 1800
      cleanup_timeout: 60
      service_startup_timeout: 60
      service_shutdown_timeout: 60
      trial_reward_key: reward
  trajectory_runner:
    max_concurrent_tasks: 128
  data:
    kind: parquet
    shuffle: false
    train_data: []
    val_data: []
  extra_env:
    OPENAI_BASE_URL: https://api.together.xyz/v1
    TAU2_USER_MODEL: openai/openai/gpt-oss-120b
    TAU2_NL_ASSERTIONS_MODEL: openai/openai/gpt-oss-120b
    TAU2_USER_REASONING_EFFORT: low
    TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: '259200'
seed: 20261030
gpu_variant: H100
data_relative_path: rollouts.parquet
role_plan:
  colocate_all: true
  policy_num_nodes: 16
  policy_num_gpus_per_node: 8
  num_inference_engines: 16
  inference_engine_tensor_parallel_size: 1
  inference_engine_pipeline_parallel_size: 1
  inference_engine_data_parallel_size: 8
  inference_engine_expert_parallel_size: 8
  train_batch_size: 1
  policy_mini_batch_size: 1
  micro_train_batch_size_per_gpu: 1
  n_samples_per_prompt: 1
  reference_num_nodes: null
