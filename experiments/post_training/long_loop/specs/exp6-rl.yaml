# Exp6 RL stage patch. Bind this file by FilePin from the round's recipe_patch.
# Total response and per-turn output budgets are distinct; data/model/SFT pins are supplied by the round.
context_budget:
  request_window_tokens: 131072
  max_new_tokens_per_trajectory: 98304
  max_new_tokens_per_turn: 24576
  max_turns: 128
  generated_budget_fraction: 0.75
  overlong_cache_fraction: 0.16666666666666666
trainer:
  train_batch_size: 64
  policy_mini_batch_size: 64
  rollout_buffer:
    max_staleness_steps: 3
  policy:
    optimizer_config:
      optimizer: MuonH
      lr: 1.0e-5
      adam_betas: [0.9, 0.95]
      weight_decay: 0.0
      max_grad_norm: 0.5
      num_warmup_steps: 0
      scheduler: constant_with_warmup
      optimizer_kwargs:
        adam_lr: 2.307692307692308e-6
        momentum: 0.95
        nesterov: true
        backend_steps: 5
        epsilon: 1.0e-8
        muon_epsilon: 1.0e-8
        offload_momentum: true
        expert_normalization: all_experts
    megatron_config:
      output_projection_chunk_size: 1024
      transformer_config_kwargs:
        cp_comm_type: all_gather
      memory_profile:
        enabled: true
        max_sequence_length: 131072
        valid_token_counts: [85557]
        minimum_headroom_fraction: 0.1
      optimizer_config_kwargs:
        optimizer_cpu_offload: false
        optimizer_offload_fraction: 0.0
        overlap_cpu_optimizer_d2h_h2d: false
  ref:
    megatron_config:
      transformer_config_kwargs:
        cp_comm_type: all_gather
generator:
  n_samples_per_prompt: 8
terminal_bench:
  installed_agent:
    agent:
      kwargs:
        model_info:
          max_input_tokens: 131072
          max_output_tokens: 24576
        compaction_reserve_tokens: 24576
