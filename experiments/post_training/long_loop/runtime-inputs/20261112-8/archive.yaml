runtime_evidence_requirements:
- Resolve exact SFT and RL W&B run identities from producer metadata or hash-pinned
  run-reference receipts; strict exporter runs only against these identities.
- Missing strict W&B history or required evidence seals a partial archive and blocks
  all native checkpoint cleanup.
