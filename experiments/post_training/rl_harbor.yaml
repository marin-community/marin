# Each Harbor cohort is a pinned sample of one benchmark, stratified by subcategory.
# BFCL tag; SWE repository; TBLite category (casefold, underscore to hyphen).
# Selection salt: rl-harbor-subcategories-20261117-v1.
timeout: 10800
minimum_coverage: 0.9
job:
  agents:
  - kwargs:
      max_turns: 32
      model_info:
        max_output_tokens: 8192
      temperature: 1.0
    name: terminus-2
    override_setup_timeout_sec: 360
    override_timeout_sec: 600
  environment:
    delete: true
    type: daytona
  n_attempts: 1
  n_concurrent_trials: 30
  retry:
    include_exceptions:
    - PhaseCancellationError
    - TimeoutError
    - ConnectionError
    - MachineUnavailable
    - DaytonaCapacityExhausted
    - TmuxExecTimeoutError
    - DaytonaOutputUnavailable
    - MachineTerminated
    max_retries: 1
  trial_attempt_timeout_sec: 1800
  verifier:
    override_timeout_sec: 300
