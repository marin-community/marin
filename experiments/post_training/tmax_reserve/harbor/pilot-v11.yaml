# The k=8 pilot policy below on the TMax v1.1 verifiers: tasks/pilot-v11-x1, written by
# `python -m experiments.post_training.tmax_reserve.v11` from tasks/pilot-200-shared minus exclusions/tmax-v11-exclusions-v1.json,
# the tasks v1.1 dropped and the tasks whose v1.1 image was rebuilt (136 tasks; see tasks/pilot-v11-x1.manifest.json).
# TMax-15K reserve pilot: the TBLite scoring policy (eval-campaign-09-25-unlabeled/harbor-configs/
# ot-tblite-recovery.yaml) with four changes: the local 200-task shared-image dataset (written by
# `python -m experiments.post_training.tmax_reserve.shared_image`), k=8 attempts, 64 concurrent trials, and
# a whole-sandbox Daytona network policy that allows only iris.oa.dev once task setup is done. Terminus-2 calls
# the model from the Harbor process, and the TMax verifier runs pytest only, so the agent needs no other egress.
n_concurrent_trials: 64
n_attempts: 8
release_trial_payloads_in_memory: true
retry:
  max_retries: 10
  include_exceptions:
  - InternalServerError
  - APIConnectionError
  - APITimeoutError
  - ArtifactUploadTimeoutError
  - ArtifactWriterBacklogError
  - CancelledError
  - ContextManagementInfrastructureError
  - LLMRequestTimeoutError
  - SandboxBuildFailedError
  - ContainerRegistryThrottledError
  - AgentSetupTimeoutError
  - DaytonaSandboxStopError
  - DaytonaProcessError
  - TrialTimeoutError
  - ArtifactWriteTimeoutError
  - Tau3RuntimeInfrastructureError
  - Tau3TargetInfrastructureError
  - VerifierTimeoutError
  - VerifierRuntimeError
  wait_multiplier: 2.0
  min_wait_sec: 1.0
  max_wait_sec: 60.0
  exclude_exceptions: []
environment:
  type: daytona
  kwargs:
    network_policy:
      mode: domain_allow_list
      value: iris.oa.dev
    # Task setup (post_install.sh) runs with network, as the image build did; then the allow-list applies and
    # pypi.org must be unreachable before the agent starts.
    setup_network_policy:
      mode: unrestricted
    lockdown_probe: pypi.org:443
agents:
- name: terminus-2
  override_setup_timeout_sec: 360
  override_timeout_sec: 1800
  kwargs:
    model_info:
      max_input_tokens: 32768
datasets:
- path: ../tasks/pilot-v11-x1
verifier:
  override_timeout_sec: 300
