    delete: true
    type: daytona
  n_attempts: 1
  n_concurrent_trials: 30
  retry:
    include_exceptions:
    - APIConnectionError
    - APITimeoutError
    - SandboxBuildFailedError
    - ContainerRegistryThrottledError
    - DaytonaProcessError
    max_retries: 1
  trial_attempt_timeout_sec: 1800
  verifier:
    override_timeout_sec: 300
