minimum_coverage: 0.9
job:
  agents:
  - kwargs:
      max_turns: 32
      model_info:
        max_input_tokens: 32768
        max_output_tokens: 8192
      temperature: 1.0
    name: terminus-2
    override_setup_timeout_sec: 360
    override_timeout_sec: 600
