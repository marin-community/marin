# Extracted from Mochi 108c2888c7aa66e771c802ba3a89ce374a1f331c.
# Role geometry and artifact paths are supplied by launch.py.
entrypoint: taskcompendium
context_budget:
  request_window_tokens: 65536
  max_new_tokens_per_turn: 8192
  max_turns: 4
environment:
  task_sessions:
    local: {}
    daytona:
      api_key_env: DAYTONA_RL_API_KEY
      ttl_minutes: 60
      eval_api_key_env: DAYTONA_EVAL_API_KEY
    task_spec:
      harness_by_dataset:
        long-loop-smartie-calibforge: harbor_trial
      session:
        max_turns: 4
        attempt_timeout: 900
        total_turn_timeout: 600
        model_turn_timeout: 600
        verifier_timeout: 180
trainer:
  strategy: megatron
  flash_attn: true
  use_sample_packing: true
  gradient_checkpointing: true
  offload_optimizer_during_rollouts: false
  update_epochs_per_batch: 1
  eval_batch_size: 256
  eval_interval: -1
  resume_mode: latest
  logger: wandb
  project_name: mochi-rl
  tracker_commit_each_step: true
  training_metrics: true
  rollout_spans: true
  policy_train_spans: true
  algorithm:
    advantage_estimator: rloo_n
    policy_loss_type: regular
    loss_reduction: token_mean
    use_kl_loss: false
    use_kl_in_reward: false
    kl_estimator_type: k3_unbiased_gradient
    off_policy_correction: none
    eps_clip_low: 0.2
    eps_clip_high: 0.2
    group_advantage_min_size: 2
    advantage_batch_normalize: false
    rloo_n_filter_zero_reward_groups: false
    use_entropy_loss: false
  policy:
    optimizer_config:
      optimizer: MuonH
      lr: 1.0e-05
      weight_decay: 0.0
      max_grad_norm: 0.0
      adam_betas:
      - 0.9
      - 0.95
      optimizer_kwargs:
        adam_lr: 2.307692307692308e-06
        momentum: 0.95
        nesterov: true
        backend_steps: 5
        epsilon: 1.0e-08
        muon_epsilon: 1.0e-08
        offload_momentum: true
        expert_normalization: all_experts
      scheduler: constant_with_warmup
      num_warmup_steps: 0
    megatron_config:
      optimizer_config_kwargs: {}
      optimizer_checkpoint_sharding_type: dp_reshardable
  rollout_buffer:
    max_staleness_steps: 0
    batch_policy: full_batch
    max_in_flight: 2
    object_store_root: null
  eval_before_train: false
  ckpt_interval: 5
  eval_num_prompts: null
  dump_eval_results: true
  step_wise_training: false
  dump_data_batch: true
  callbacks:
  - type: checkpoint
    save_steps: 5
    save_on_train_end: true
  restore_dataloader_state: true
  reset_global_step_on_resume: false
generator:
  backend: vllm
  model_dtype: bfloat16
  vllm_attention_backend: FLASH_ATTN
  run_engines_locally: true
  weight_sync_backend: nccl
  weight_sync_pause:
    mode: keep
    clear_cache: true
  weight_sync_transport: expert_block
  expert_block_sync:
    timeout_seconds: 600
    verify: false
  gpu_memory_utilization: 0.75
  max_num_seqs: 16
  max_num_batched_tokens: 8192
  enable_prefix_caching: true
  enable_chunked_prefill: true
  enforce_eager: false
  enable_http_endpoint: false
  chat_template: null
  engine_init_kwargs:
    moe_backend: triton
    enable_auto_tool_choice: true
    tool_call_parser: hermes
    model_loader_extra_config:
      distributed: false
      concurrency: 4
      memory_limit: 8589934592
    compilation_config:
      mode: 3
      cudagraph_mode: PIECEWISE
      splitting_ops:
      - vllm::unified_attention_with_output
      - vllm::unified_kv_cache_update
      - vllm::grug_moe_short_conv
  sampling_params:
    temperature: 1.0
    top_p: 1.0
    logprobs: 0
    stop_token_ids:
    - 128001
    - 128009
    skip_special_tokens: false
  trajectory_reward_shaping:
    enabled: true
    overlong:
      penalty_scale: 0.0
    reasoning_span:
      penalty: 0.1
      target: marker
  chat_template_kwargs:
    enable_thinking: true
  eval_sampling_params:
    stop_token_ids:
    - 128001
    - 128009
    skip_special_tokens: false
  trajectory_retention:
    enabled: true
    sample_fraction: 1.0
    sample_count_per_step: 2
    max_bytes_per_step: 67108864
    max_bytes_per_run: 536870912
    required: true
  error_handling:
    enable_error_classification: true
    default_error_treatment: mask
    preserve_logprobs_on_timeout: true
data:
  kind: parquet
  shuffle: true
trajectory_runner:
  rollout_workers:
    num_workers: 2
extra_env:
  DAYTONA_TARGET: us
  OT_AGENT_RAY_OBJECT_STORE_CAP_GIB: '32'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  NCCL_NET: Socket
  NCCL_IB_DISABLE: '1'
  NCCL_SOCKET_FAMILY: AF_INET
terminal_bench:
  harbor:
    environment_type: daytona
    daytona_api_key_env: DAYTONA_RL_API_KEY
    eval_daytona_api_key_env: DAYTONA_EVAL_API_KEY
    override_timeout_sec: 300
    trial_attempt_timeout_sec: 900
    n_concurrent_trials: 16
    max_retries: 0
    enable_reward_shaping: false
  installed_agent:
    agent:
      name: mini-swe-agent
      override_setup_timeout_sec: 300
      kwargs:
        version: 2.1.0
        max_turns: 4
        temperature: 1.0
    setup_timeout: 300
    run_timeout: 300
    cleanup_timeout: 60
    service_startup_timeout: 60
    service_shutdown_timeout: 60
    trial_reward_key: reward
