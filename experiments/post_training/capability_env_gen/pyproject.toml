[project]
name = "capability-env-gen"
version = "0.1.0"
description = "Evidence-led GLM-5.3 capability task generation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
capability-pipeline = "capability_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capability_pipeline"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
