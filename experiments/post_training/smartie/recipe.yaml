# Recipe fragment, not a launch document. Artifact inputs, role geometry, and
# runtime pins must be bound by the campaign artifact entrypoint before launch.
entrypoint: taskcompendium
environment:
  task_sessions:
    daytona:
      api_key_env: DAYTONA_RL_API_KEY
      ttl_minutes: 60
data:
  sampling:
    kind: domain-weighted
    seed: 42
    domain_weights:
      calendar: 0.5
      competitive_code: 0.5
      reasoning_gym: 0.5
      stem_mcqa: 0.5
      structural: 1.0
context_budget:
  request_window_tokens: 65536
  max_new_tokens_per_turn: 32768
  max_turns: 999999
  generated_budget_fraction: 0.5
  overlong_cache_fraction: 0.5
trainer:
  strategy: megatron
  seed: 42
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: false
  use_sample_packing: false
  epochs: 2
  max_steps: 128
  update_epochs_per_batch: 1
  micro_forward_batch_size_per_gpu: 1
  eval_batch_size: 100
  eval_before_train: true
  eval_interval: 2
  ckpt_interval: 2
  hf_save_interval: -1
  logger: wandb
  project_name: snowball-smartie-rl
  algorithm:
    advantage_estimator: rloo_n
    advantage_batch_normalize: false
    group_advantage_min_size: 4
    rloo_n_filter_zero_reward_groups: true
    policy_loss_type: regular
    loss_reduction: token_mean
    think_token_weight: 1.0
    eps_clip_low: 0.2
    eps_clip_high: 0.2
    use_entropy_loss: false
    use_kl_loss: false
    use_kl_in_reward: false
    off_policy_correction: none
    enable_token_reward_channel: false
    dynamic_sampling:
      type: null
    ftpo:
      boundary: mixed
      auxiliary_weight: 0.02
      repair_sft_weight: 1.0
      margin: 2.0
      lambda_mse: 0.4
      lambda_mse_target: 0.05
      tau_mse_target: 0.5
      min_p: 0.01
      max_chosen_tokens: 20
      min_decoded_chars: 1
      require_alnum: false
      rejected_balance_strength: 0.3
      chosen_balance_strength: 0.5
      early_stopping_chosen_win: null
  policy:
    optimizer_config:
      optimizer: AdamW
      lr: 1.5e-06
      weight_decay: 0.0
      max_grad_norm: 0.5
  rollout_buffer:
    max_staleness_steps: 0
    batch_policy: full_batch
    max_in_flight: 64
generator:
  backend: vllm
  model_loading: stage_local
  model_dtype: bfloat16
  run_engines_locally: true
  eval_n_samples_per_prompt: 1
  gpu_memory_utilization: 0.8
  max_num_seqs: 16
  max_num_batched_tokens: 16384
  enable_prefix_caching: true
  enable_chunked_prefill: true
  enforce_eager: false
  sampling_params:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    logprobs: 32
  engine_init_kwargs:
    enable_auto_tools: true
    tool_parser: hermes
    logprobs_mode: raw_logprobs
    enable_return_routed_experts: false
