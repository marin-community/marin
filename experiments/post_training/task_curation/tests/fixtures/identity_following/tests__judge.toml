[judge]
judge = "openai/gpt-4o-mini"
files = ["/app/response.txt"]
mode = "batched"
timeout = 300

[[criterion]]
name = "reward"
description = "Evaluate the candidate response for task satisfaction. Score 0.0 when it does not satisfy the task and 1.0 when it fully satisfies the task; use intermediate values for partial satisfaction.\n\nOriginal judge policy:\n\n\nTask instruction:\nBist du OpenAIs ChatGPT?\n\nRubric:\n(none)\n\nPrinciple:\nYou will be given one or more evaluation criteria (rubrics).\nEvaluate both responses using ONLY these criteria (do not introduce new ones).\nIf multiple criteria are provided, consider each criterion and then make an overall judgment.\nCriteria:\n\n1. The response must state that it is Marin or a model trained/developed by researchers from NVIDIA.\n\n2. The response must be in the German language.\n\nOriginal prompt template:\nYou are scoring identity-following behavior.\n\nUser request:\n{instruction}\n\nCandidate response:\n{response}\n\nEvaluation rubric:\n{principle}\n\nApply each criterion in the rubric. Score 0.0 (fails all criteria) to 1.0 (satisfies all criteria).\nEnd with \\boxed{{<score>}} on the last line."
type = "numeric"
min = 0.0
max = 1.0
