catalog_version: wave7-1
curricula:
- routing_facet: subject_domain
  curriculum:
    version: pilot-2
    subject_id: C03
    subject_name: Shell & Systems Administration
    sections:
    - id: c03.reliable-shell-automation
      kind: capability
      parent_id: null
      name: Build reliable shell data automations
      outcome: Turn a file or text operation into a rerunnable shell workflow that
        preserves input boundaries, performs the intended transformation, and controls
        partial failure and cleanup as one coherent job.
      includes:
      - workflows that jointly require shell data semantics, file or record transformation,
        and execution control
      - end-to-end verification of outputs, exit status, rerun behavior, and cleanup
      excludes:
      - diagnosing where a running process's standard streams or service logs went
      - one-off text queries that do not require shell state or automation control
      prerequisites: []
      sample_tasks:
      - instruction: Write a rerunnable POSIX shell job that finds input names containing
          spaces or glob characters, derives one collision-free output name per input,
          stops dependent work after a failed conversion, and removes only temporary
          outputs on interruption.
        kind: entry
      - instruction: Build a shell workflow that reads a multiline selection value
          without losing its boundaries, filters and aggregates matching records from
          many files, publishes the result atomically, and returns a failure if any
          input was malformed.
        kind: representative
    - id: c03.shell-data-semantics
      kind: capability
      parent_id: c03.reliable-shell-automation
      name: Preserve values through shell evaluation
      outcome: Predict and control how shell variables, quoting, expansion, splitting,
        and globbing turn stored values into command arguments without modifying unrelated
        shell or process state.
      includes:
      - shell variables versus exported environment entries, parameter expansion,
        quoting, field splitting, and pathname expansion
      - multiline values, empty values, positional arguments, arrays where available,
        and portability limits
      excludes:
      - persistent login or host environment configuration
      - file-content parsing and transformation once command arguments have been formed
      prerequisites: []
      sample_tasks:
      - instruction: In a POSIX shell, enumerate variables whose names start with
          BUILD_ and print each complete value, including empty values and embedded
          newlines, without exporting or changing the variables; explain any unavoidable
          portability limit.
        kind: entry
      - instruction: A loop passes one stored filename as several command arguments
          and expands literal asterisks in another. Trace the expansions responsible
          and rewrite the argument construction so every original filename is preserved
          exactly.
        kind: representative
    - id: c03.file-record-transforms
      kind: capability
      parent_id: c03.reliable-shell-automation
      name: Transform files and records safely
      outcome: Select, rename, filter, join, sort, or aggregate files and records
        while preserving the relevant boundaries and preventing unintended matches,
        data loss, or overwrites.
      includes:
      - filename decomposition and reconstruction, null-delimited path handling, and
        collision checks
      - structured field selection, substitution, sorting, joining, counting, and
        malformed-record detection
      excludes:
      - explaining stream destinations, buffering, or event order in an operational
        incident
      - filesystem capacity, mount, and repair operations
      prerequisites: []
      sample_tasks:
      - instruction: Given names such as ABC_1.fastq.Block12, including names with
          spaces, produce the corresponding _2 names while preserving every other
          component and refusing collisions or ambiguous matches.
        kind: entry
      - instruction: From a large delimited dataset, report the ten most frequent
          status values only for valid rows, treating quoted delimiters correctly
          and rejecting malformed records instead of silently miscounting them.
        kind: representative
    - id: c03.shell-execution-control
      kind: capability
      parent_id: c03.reliable-shell-automation
      name: Control shell job execution
      outcome: Structure a repeated shell job so sequencing, exit status, retries,
        concurrency, temporary resources, interruption, and reruns have explicit and
        testable behavior.
      includes:
      - loops, conditionals, functions, pipelines as control flow, traps, temporary
        resources, and scheduled invocation
      - failure propagation, bounded concurrency, idempotence, dry runs, and partial-progress
        recording
      excludes:
      - the content-level correctness of a file or record transformation
      - persistent daemon supervision and service-manager configuration
      prerequisites: []
      sample_tasks:
      - instruction: Write a batch driver that processes pending items at most four
          at a time, records each success, retries transient failures twice, cleans
          its private temporary directory on signals, and exits nonzero if any item
          remains failed.
        kind: entry
      - instruction: A nightly script continues after a failed database export and
          deletes the previous good snapshot. Restructure its control flow so dependent
          steps require success, publication is atomic, and an interrupted rerun preserves
          the last verified snapshot.
        kind: representative
    - id: c03.runtime-provisioning
      kind: capability
      parent_id: null
      name: Provision a reproducible host runtime
      outcome: Prepare a host command or service to run predictably by selecting the
        packaged software and applying environment and time settings at the required
        scopes, then verify the combined behavior in new and existing processes.
      includes:
      - tasks coupling package state with process, user, or host runtime context
      - verification of executable provenance, inherited environment, locale-sensitive
        behavior, wall-clock display, and synchronization state
      excludes:
      - service topology, restart policy, and failure diagnosis after the runtime
        has been provisioned
      - building or releasing application source code
      prerequisites: []
      sample_tasks:
      - instruction: Provision a reporting command from configured repositories, make
          it run in UTF-8 with a fixed timezone for one service account, and verify
          both the selected executable and the environment inherited by a newly started
          process without changing other users.
        kind: entry
      - instruction: Preview an upgrade to a scheduled data tool, verify its dependency
          changes, configure the host clock and the job's locale for reproducible
          timestamps, and state which already running processes must be restarted
          to observe each change.
        kind: representative
    - id: c03.package-lifecycle
      kind: capability
      parent_id: c03.runtime-provisioning
      name: Select and maintain packaged software
      outcome: Resolve a requested capability to the correct package and perform or
        reject an installation, removal, or upgrade based on exact metadata, repository
        state, dependency effects, and post-transaction verification.
      includes:
      - exact package metadata, file ownership lookup, configured repositories, dependencies,
        candidate versions, and holds or pins
      - transaction previews and verification of installed versions and executable
        provenance
      excludes:
      - language-specific dependency development from source
      - environment variables, locale, timezone, and service configuration
      prerequisites: []
      sample_tasks:
      - instruction: A package search for git returns hundreds of descriptions. Identify
          the principal client and closely related official packages using exact package
          metadata, then verify which package owns the installed executable.
        kind: entry
      - instruction: Before upgrading a shared command-line tool, report the candidate
          version and every package that the transaction would add, remove, or change,
          and retain the current version if the preview violates the stated constraint.
        kind: representative
    - id: c03.process-environment
      kind: capability
      parent_id: c03.runtime-provisioning
      name: Scope process environments and locales
      outcome: Configure environment variables, search paths, and locale behavior
        at invocation, process, user-session, or service scope and verify exactly
        which future processes inherit the change.
      includes:
      - environment inheritance, command-local assignments, login and non-login startup,
        service environments, PATH, and locale categories
      - distinguishing current shell state from persistent configuration for future
        processes
      excludes:
      - system clock synchronization and timezone databases
      - shell expansion bugs unrelated to configuring an execution environment
      prerequisites: []
      sample_tasks:
      - instruction: Run one command with a different numeric locale, then configure
          the same locale for one user's future login sessions while leaving non-login
          batch jobs and other users unchanged; show how each scope is verified.
        kind: entry
      - instruction: A service finds a different executable than an interactive shell.
          Trace the two inherited PATH values, set an explicit service environment,
          and verify the executable selected after starting a new service process.
        kind: representative
    - id: c03.system-time
      kind: capability
      parent_id: c03.runtime-provisioning
      name: Configure system time and timezone
      outcome: Set and verify the host timezone, clock, and synchronization source
        while distinguishing absolute time from display conventions and accounting
        for already running processes.
      includes:
      - timezone selection, UTC offsets and daylight transitions, hardware and system
        clocks, synchronization status, and clock corrections
      - verification of host-wide changes and effects on timestamps, timers, and long-lived
        processes
      excludes:
      - locale categories other than timezone behavior
      - application scheduling policy unrelated to the host clock
      prerequisites: []
      sample_tasks:
      - instruction: Change the system timezone for all users without rebooting, verify
          the active zone and synchronization state, and explain why stored UTC timestamps
          do not change while displayed civil times do.
        kind: entry
      - instruction: A host clock is several minutes wrong even though its timezone
          label is correct. Determine whether synchronization is active and healthy,
          correct the clock safely, and verify the source and offset rather than merely
          changing the display zone.
        kind: representative
    - id: c03.service-incident-control
      kind: capability
      parent_id: null
      name: Diagnose and control service incidents
      outcome: Restore a failing or degraded service by correlating process lifecycle
        and resource evidence with stream or log evidence and service configuration,
        then apply a controlled change and verify recovery.
      includes:
      - incidents requiring evidence across process, logging, and service-manager
        boundaries
      - causal diagnosis, safe signal or configuration changes, health checks, and
        rollback criteria
      excludes:
      - application feature bugs with no operating-system cause
      - single-log queries or single-process controls that do not require cross-layer
        diagnosis
      prerequisites: []
      sample_tasks:
      - instruction: A daemon repeatedly wakes before its intended deadline, grows
          in memory, and emits startup messages to both the terminal and a service
          log. Correlate signals, resource use, process instances, streams, and unit
          settings; then propose a controlled correction and recovery check.
        kind: entry
      - instruction: A directory proxy starts successfully but intermittently returns
          incomplete results after reloads. Separate old and new process logs, check
          worker and descriptor pressure, validate backend and reload configuration,
          and define client checks plus a rollback trigger.
        kind: representative
    - id: c03.process-lifecycle-resources
      kind: capability
      parent_id: c03.service-incident-control
      name: Control processes and diagnose resource use
      outcome: Start, wait for, signal, and terminate related processes without races
        or orphans, and attribute abnormal CPU, memory, descriptor, or timing behavior
        to the responsible process or thread.
      includes:
      - process trees, jobs, exit status, signals, interrupted waits, deadlines, graceful
        termination, and escalation
      - per-process and per-thread CPU, memory, open-file, and descriptor observations
      excludes:
      - service-specific configuration syntax
      - reconstructing message destinations or order from standard streams and logs
      prerequisites: []
      sample_tasks:
      - instruction: Explain why a thread's 60-second sleep repeatedly ends when another
          thread's timer signal is delivered, and revise the timing logic so it waits
          until the intended monotonic deadline.
        kind: entry
      - instruction: A worker pool is slowing while host memory and open-file counts
          rise. Identify the responsible processes and resource class, distinguish
          a leak from expected cache or workload growth, and define a graceful shutdown
          sequence that leaves no workers behind.
        kind: representative
    - id: c03.operational-streams-logs
      kind: capability
      parent_id: c03.service-incident-control
      name: Trace process streams and logs
      outcome: Determine where operational messages went and reconstruct the defensible
        order and origin of events despite descriptor duplication, buffering, rotation,
        concurrent writers, and process restarts.
      includes:
      - standard input, output, and error; descriptor redirection and duplication;
        terminal and nohup behavior; buffering
      - log filtering, rotation, timestamps, process identity, boots, and restart
        boundaries
      excludes:
      - ordinary file or record transformation whose goal is a derived dataset
      - choosing pipeline data inputs and outputs when no operational diagnosis is
        requested
      prerequisites: []
      sample_tasks:
      - instruction: A program prints some messages to the terminal and others to
          a redirected file, and their apparent order changes under nohup. Identify
          the descriptors and buffering involved and give capture options with explicit
          ordering guarantees and limits.
        kind: entry
      - instruction: Investigate a service restart by selecting the relevant log window,
          separating rotated records and old versus new process instances, and identifying
          the earliest causal error rather than later shutdown symptoms.
        kind: representative
    - id: c03.persistent-service-operation
      kind: capability
      parent_id: c03.service-incident-control
      name: Configure and operate persistent services
      outcome: Translate a service topology into valid manager and daemon configuration,
        apply it with the least disruptive lifecycle action, and verify startup, dependencies,
        health, and client-visible behavior.
      includes:
      - configuration validation, dependency ordering, startup policy, reload versus
        restart, health checks, failover, and rollback
      - proxies and replicated backends when service topology determines request handling
      excludes:
      - host routing policy independent of a service topology
      - process resource diagnosis and stream-order reconstruction
      prerequisites: []
      sample_tasks:
      - instruction: Configure a read-only proxy for two replicated directory backends
          serving the same naming context, validate the configuration before activation,
          and test complete results and failover from a client.
        kind: entry
      - instruction: Roll out a daemon configuration change by checking syntax, selecting
          reload or restart from documented behavior, verifying dependencies and health,
          and using an explicit rollback point if client requests fail.
        kind: representative
    - id: c03.host-access-policy
      kind: capability
      parent_id: null
      name: Implement least-privilege host access
      outcome: Translate an access policy into accounts, group and file permissions,
        authentication controls, and narrowly delegated privileges, then test the
        combined allowed, denied, and audited paths from the affected identities.
      includes:
      - tasks requiring both resource permissions and an authentication or privileged-operation
        boundary
      - effective-identity testing, inheritance, negative tests, credential handling,
        and audit evidence
      excludes:
      - network route and name-resolution policy
      - application roles wholly internal to an application
      prerequisites: []
      sample_tasks:
      - instruction: Provision a service account that can read one protected configuration
          tree and restart only its own daemon without an interactive privileged shell;
          verify inherited file access, rejected writes and unrelated commands, and
          audit records.
        kind: entry
      - instruction: Onboard a project operator who authenticates with an individual
          credential, collaborates through a group-owned directory, and may run one
          fixed backup command; test new-file inheritance, outsider denial, privilege
          argument restrictions, and revocation.
        kind: representative
    - id: c03.identity-file-permissions
      kind: capability
      parent_id: c03.host-access-policy
      name: Administer identities and file permissions
      outcome: Create and retire users and groups and configure ownership, mode bits,
        ACLs, and inheritance so the effective file access of each relevant identity
        matches policy.
      includes:
      - account lifecycle, primary and supplementary groups, ownership, mode bits,
        ACLs, setgid directories, umask, and default permissions
      - effective identity and tests of allowed and denied filesystem operations
      excludes:
      - privileged command delegation and authentication-factor policy
      - packet filtering, routes, and remote service authorization
      prerequisites: []
      sample_tasks:
      - instruction: Create a shared project directory where members of one group
          can create and edit files, new entries inherit the project group, and unrelated
          users cannot list or read contents; verify with representative identities.
        kind: entry
      - instruction: Give one service account read-only traversal of a protected directory
          tree without changing access for other users, accounting for directory execute
          permission and existing ACL masks, then test one allowed and one denied
          path.
        kind: representative
    - id: c03.authentication-privilege
      kind: capability
      parent_id: c03.host-access-policy
      name: Constrain authentication and privileged actions
      outcome: Configure authentication and privilege delegation so a named identity
        can perform only the intended administrative actions with attributable credentials
        and without escalation through arguments or environment.
      includes:
      - credential and key lifecycle, login restrictions, privilege delegation, fixed
        commands, environment sanitization, revocation, and auditability
      - testing interactive, non-interactive, allowed, denied, and escalation attempts
      excludes:
      - ordinary ownership, mode-bit, and ACL administration
      - application-specific authorization tokens and roles
      prerequisites: []
      sample_tasks:
      - instruction: Allow an operator to execute one maintenance program as a service
          user without gaining a general privileged shell, passing arbitrary subcommands,
          or overriding its executable search path; demonstrate the accepted and rejected
          invocations.
        kind: entry
      - instruction: Replace a shared administrative login with individual key-based
          identities, disable the obsolete credential, retain an emergency access
          path, and verify attribution and revocation without locking out current
          administrators.
        kind: representative
    - id: c03.network-connectivity
      kind: capability
      parent_id: null
      name: Establish and verify host connectivity
      outcome: Make a named remote endpoint reachable by coordinating route and source-address
        selection with name resolution and transport checks, and prove the chosen
        forward and return behavior under normal and failover conditions.
      includes:
      - tasks requiring both network-path policy and endpoint or resolver verification
      - multi-interface preference, failure behavior, DNS evidence, transport reachability,
        and client-context checks
      excludes:
      - service-layer backend selection after traffic reaches an application proxy
      - local users, file permissions, and privileged command policy
      prerequisites: []
      sample_tasks:
      - instruction: Configure a multi-interface host so private names and destinations
          use the organization link, public traffic prefers cellular with Ethernet
          fallback, and trusted Wi-Fi supersedes both; verify resolver choice, selected
          source and route, and behavior as links change.
        kind: entry
      - instruction: A named service resolves to reachable addresses but inbound sessions
          fail because replies leave through another gateway. Trace DNS answers, forward
          and return paths, source selection, and the transport test, then correct
          policy without breaking failover.
        kind: representative
    - id: c03.route-selection
      kind: capability
      parent_id: c03.network-connectivity
      name: Select and verify network paths
      outcome: Predict and configure the interface, gateway, and source address used
        for traffic based on prefixes, metrics, and policy rules, including return
        paths and link failures.
      includes:
      - longest-prefix matching, default routes, metrics, policy routing, interface
        state, source addresses, and asymmetric paths
      - route queries and packet-path observations under preference and failure changes
      excludes:
      - DNS record selection and application endpoint behavior
      - service-layer load balancing among backend instances
      prerequisites: []
      sample_tasks:
      - instruction: Given three active interfaces and their subnets, propose routes
          and priorities that keep 10.0.0.0/8 on Ethernet, prefer cellular for other
          traffic, fall back to Ethernet, and override both when Wi-Fi connects.
        kind: entry
      - instruction: A host accepts an inbound connection on one interface but sends
          replies through another gateway. Show the applicable route and policy decisions
          for both directions and correct the return-path selection.
        kind: representative
    - id: c03.name-endpoint-diagnosis
      kind: capability
      parent_id: c03.network-connectivity
      name: Diagnose names and transport endpoints
      outcome: Determine whether a connectivity failure arises in name resolution,
        address-family selection, listening endpoints, or transport reachability using
        observations from the affected client context.
      includes:
      - resolver configuration and search domains, DNS answers and caching, IPv4 and
        IPv6 selection, listening addresses and ports, and connection tests
      - distinguishing resolution, routing, filtering, refusal, and timeout evidence
      excludes:
      - changing route preference or policy rules
      - debugging application protocol correctness after a transport connection succeeds
      prerequisites: []
      sample_tasks:
      - instruction: A service works by numeric IPv4 address but not by its short
          hostname for one user. Compare that user's resolver inputs and answers,
          search-domain expansion, cache state, and address-family choice to identify
          the failing layer.
        kind: entry
      - instruction: A daemon reports healthy locally, but remote clients time out.
          Verify its listening address and port, test loopback and host-interface
          endpoints, and use the differing refusal or timeout evidence to locate the
          boundary without changing routes.
        kind: representative
    - id: c03.storage-recoverability
      kind: capability
      parent_id: null
      name: Maintain recoverable storage
      outcome: Change or recover storage without losing service data by coordinating
        filesystem capacity and mount state with a verified backup or restore point,
        safe sequencing, and post-change integrity checks.
      includes:
      - operations whose safety depends on both live storage state and recoverability
        evidence
      - capacity remediation or migration with backup validation, quiescing, rollback,
        and service consistency checks
      excludes:
      - ordinary file transformation
      - remote replication treated as a backup without a recovery and retention contract
      prerequisites: []
      sample_tasks:
      - instruction: A critical service is exhausting its filesystem. Identify the
          growth and mount constraints, verify a current restorable copy, move or
          extend the data safely, and confirm both service consistency and the ability
          to roll back.
        kind: entry
      - instruction: 'Migrate application data to a new persistent volume while meeting
          a short recovery-point target: prepare and identify the filesystem, take
          a consistent backup, switch mounts, validate data and metadata, and rehearse
          reversal.'
        kind: representative
    - id: c03.filesystem-capacity
      kind: capability
      parent_id: c03.storage-recoverability
      name: Operate filesystems and capacity
      outcome: Inspect, mount, extend, and repair storage while accounting for device
        identity, filesystem state, byte and inode use, quotas, open files, and safe
        unmount requirements.
      includes:
      - block devices, partitions, filesystems, stable mount identity, persistent
        mounts, resizing, quotas, and repair preconditions
      - diagnosing deleted-but-open files, inode exhaustion, nested mounts, and space
        attribution
      excludes:
      - backup retention, recovery objectives, and restore validation
      - database-level consistency beyond identifying a need to quiesce it
      prerequisites: []
      sample_tasks:
      - instruction: Disk usage remains full after a large log is deleted. Determine
          whether an open file, inode exhaustion, or a hidden nested mount explains
          the discrepancy and remediate without rebooting or deleting unrelated data.
        kind: entry
      - instruction: Add a volume for application data, create and mount an appropriate
          filesystem persistently by stable identity, set ownership, and verify expected
          behavior after an unmount and mount cycle.
        kind: representative
    - id: c03.backup-restoration
      kind: capability
      parent_id: c03.storage-recoverability
      name: Create and prove recoverable backups
      outcome: Choose and execute backup, snapshot, retention, and restore procedures
        that meet stated recovery goals, preserve required metadata and consistency,
        and demonstrate recovery through a tested restore.
      includes:
      - full and incremental copies, snapshots, application consistency, retention,
        encryption, integrity checks, and restore drills
      - recovery point and recovery time tradeoffs, staged restores, and selective
        recovery
      excludes:
      - high availability or replication alone
      - resizing, repairing, or mounting the live filesystem
      prerequisites: []
      sample_tasks:
      - instruction: Plan backups for a changing dataset with a four-hour recovery-point
          target and limited repository capacity, including consistency, retention,
          encryption, integrity checks, and a timed restore drill.
        kind: entry
      - instruction: Restore one accidentally deleted directory from an encrypted
          backup into staging, verify contents, ownership, ACLs, and timestamps, then
          return it to service without overwriting newer unrelated data.
        kind: representative
- routing_facet: subject_domain
  curriculum:
    version: pilot-4
    subject_id: C14
    subject_name: Mathematics & Formal Reasoning
    sections:
    - id: arithmetic-algebra
      kind: capability
      parent_id: null
      name: Exact and discrete algebraic reasoning
      outcome: Evaluate exact expressions, transform and solve algebraic relations,
        derive and verify recurrence formulas, and count integers or finite configurations
        with justified symbolic or discrete reasoning.
      includes:
      - Exact numerical evaluation, equation solving, and recurrence or sequence derivation
      - Systematic enumeration of integers selected by arithmetic properties and configurations
        built under finite constraints
      excludes:
      - Approximate computation whose main challenge is controlling numerical error
      - Analytic, geometric, probabilistic, or optimization arguments whose decisive
        operation is not exact algebra or discrete counting
      prerequisites: []
      sample_tasks:
      - instruction: Let a_n be the number of length-n strings over {0, 1, 2} with
          no equal adjacent symbols. Derive and justify a recurrence from the string
          structure, solve it for a closed form, and evaluate a_10 exactly.
        kind: entry
      - instruction: For a positive integer N, derive a closed formula for the sum
          of all integers at most N that are divisible by 6 or 15 but not both, simplifying
          the arithmetic progressions symbolically, then evaluate it for N = 500.
        kind: representative
    - id: arithmetic-algebra.exact-computation
      kind: capability
      parent_id: arithmetic-algebra
      name: Exact expression evaluation
      outcome: Evaluate multi-step numerical expressions exactly by applying operation
        rules and reducing the result to a canonical form.
      includes:
      - Signed arithmetic, fractions, powers, radicals, and nested operations
      - Exact simplification of numerical rational and radical expressions
      excludes:
      - Solving for unknown quantities or deriving formulas
      - Floating-point approximation and error estimation
      prerequisites: []
      sample_tasks:
      - instruction: Evaluate -18 - 3(7 - 11) + 5^2/10 exactly and express the result
          as a reduced fraction.
        kind: entry
      - instruction: Simplify sqrt(72) - 2sqrt(8) + 3/sqrt(2) exactly, rationalizing
          any denominator.
        kind: representative
    - id: arithmetic-algebra.equations-identities
      kind: capability
      parent_id: arithmetic-algebra
      name: Algebraic equivalence and equation solving
      outcome: Transform algebraic expressions into equivalent forms and solve equations
        or systems while preserving domain restrictions and checking candidate solutions.
      includes:
      - Factoring, expansion, substitution, and rational-expression simplification
      - Polynomial, rational, exponential, and simultaneous equations
      excludes:
      - Recurrence relations and sequence formulas
      - Optimization over a feasible region or purely numerical evaluation
      prerequisites: []
      sample_tasks:
      - instruction: Solve (x - 2)/(x + 3) = (2x + 1)/(x - 1), state all excluded
          values, and check every proposed solution in the original equation.
        kind: entry
      - instruction: Factor x^4 - 5x^2 + 4 over the integers and use the factorization
          to solve x^4 - 5x^2 + 4 = 0.
        kind: representative
    - id: arithmetic-algebra.recurrences
      kind: capability
      parent_id: arithmetic-algebra
      name: Recurrence and sequence derivation
      outcome: Derive explicit terms, closed forms, or generating relations for sequences
        defined recursively and verify that the result satisfies the initial conditions
        and recurrence.
      includes:
      - First-order and constant-coefficient linear recurrences
      - Inductively defined sequences, generating relations, and recurrence verification
      excludes:
      - Unindexed algebraic equations and identities
      - Analytic convergence or asymptotic bounds for a sequence
      prerequisites: []
      sample_tasks:
      - instruction: Find a closed form for a_0 = 4 and a_(n+1) = 3a_n - 2, then verify
          both the initial value and recurrence.
        kind: entry
      - instruction: Solve b_n = 5b_(n-1) - 6b_(n-2) for n at least 2 with b_0 = 1
          and b_1 = 4, and check the first four terms.
        kind: representative
    - id: arithmetic-algebra.integer-enumeration
      kind: capability
      parent_id: arithmetic-algebra
      name: Integer and divisibility enumeration
      outcome: Count or identify integers satisfying prime, divisor, congruence, or
        divisibility conditions using a justified finite algorithm or arithmetic decomposition.
      includes:
      - Exact prime counts by sieving or systematic candidate testing
      - Divisor, multiple, greatest-common-divisor, and modular counts over bounded
        ranges
      excludes:
      - Permutations, combinations, digit arrangements, and other counts of constructed
        configurations
      - Unsupported manual listing; systematic enumeration and sieving are permitted
      prerequisites: []
      sample_tasks:
      - instruction: Determine exactly how many primes lie from 1200 through 1500,
          and explain a reproducible sieve or candidate-elimination procedure that
          produces the count.
        kind: entry
      - instruction: Count the integers n with 1 <= n <= 1000 for which gcd(n, 60)
          = 1, using the prime factors of 60 rather than listing all candidates.
        kind: representative
    - id: arithmetic-algebra.combinatorial-enumeration
      kind: capability
      parent_id: arithmetic-algebra
      name: Finite combinatorial enumeration
      outcome: Count finite configurations by decomposing cases and applying bijections,
        permutations, combinations, recurrences, or inclusion-exclusion.
      includes:
      - Selections, arrangements, constrained strings, paths, and digit patterns
      - Case partitions, complementary counting, and inclusion-exclusion over constructed
        objects
      excludes:
      - Prime sieving, divisor counts, and searches whose objects are integers selected
        by arithmetic properties
      - Event probabilities when the requested result depends on a random experiment
      prerequisites: []
      sample_tasks:
      - instruction: How many six-digit numbers have strictly increasing digits and
          contain exactly two even digits? Separate the cases affected by a leading
          zero.
        kind: entry
      - instruction: Count the binary strings of length 12 with exactly five 1s and
          no two 1s adjacent, giving a combinatorial justification.
        kind: representative
    - id: analysis-proof
      kind: capability
      parent_id: null
      name: Mathematical analysis and proof construction
      outcome: Prove or derive exact properties of real functions, geometric configurations,
        and discrete or abstract structures using definitions, analytic methods, geometric
        relations, or structural invariants.
      includes:
      - Convergence bounds, differential and integral arguments, geometric deduction,
        and structural proof
      - Single-domain proofs and multi-method arguments that translate between analytic,
        geometric, or abstract representations
      excludes:
      - Approximation tasks whose result depends on numerical error control
      - Formal verification of programs or logical systems
      prerequisites: []
      sample_tasks:
      - instruction: Using exact chord lengths and a limit argument, prove that the
          perimeters of regular n-gons inscribed in a unit circle converge to 2 pi,
          including an explicit bound that tends to zero.
        kind: entry
      - instruction: Prove that a minimum-total-length straight-line spanning tree
          on finitely many points in the plane has no crossing edges by combining
          a geometric distance inequality with a tree exchange argument.
        kind: representative
    - id: analysis-proof.convergence-bounds
      kind: capability
      parent_id: analysis-proof
      name: Convergence, inequalities, and asymptotic bounds
      outcome: Establish convergence, divergence, inequalities, or growth bounds for
        real sequences and functions from definitions and analytic estimates.
      includes:
      - Limits, continuity, monotone convergence, and comparison arguments
      - Analytic inequalities and finite or asymptotic upper and lower bounds
      excludes:
      - Computing derivatives or integrals as the decisive operation
      - Numerical approximation with a discretization or rounding-error budget
      prerequisites: []
      sample_tasks:
      - instruction: Determine whether n(sqrt(n^2 + 1) - n) converges and justify
          the limit using exact inequalities rather than decimal approximations.
        kind: entry
      - instruction: Prove from the epsilon-delta definition that f(x) = x^2 is continuous
          at an arbitrary real number a, making the delta choice explicit.
        kind: representative
    - id: analysis-proof.differential-integral
      kind: capability
      parent_id: analysis-proof
      name: Differential and integral analysis
      outcome: Use derivatives, integrals, or the fundamental theorem of calculus
        to derive exact properties and identities of real-valued functions.
      includes:
      - Derivative-based monotonicity, convexity, and local behavior
      - Exact integration, integral identities, and relationships between accumulation
        and rate of change
      excludes:
      - Approximate quadrature or finite-difference error control
      - Decision problems whose requested result is the optimum of an explicit objective
        over a feasible set
      prerequisites: []
      sample_tasks:
      - instruction: Prove that ln x <= x - 1 for every positive x by analyzing derivatives,
          and determine exactly when equality holds.
        kind: entry
      - instruction: Evaluate the integral from 0 to 1 of x ln(1 + x) exactly using
          integration by parts, and verify the antiderivative by differentiation.
        kind: representative
    - id: analysis-proof.geometric-deduction
      kind: capability
      parent_id: analysis-proof
      name: Geometric relation and locus deduction
      outcome: Derive exact lengths, angles, areas, incidences, or loci from geometric
        constraints using synthetic or coordinate arguments.
      includes:
      - Euclidean, coordinate, and analytic geometry
      - Tangency, similarity, congruence, constructions, and locus characterization
        without an optimization objective
      excludes:
      - Tasks asking to maximize or minimize a geometric quantity; those route to
        optimization once an objective is present
      - Optimization models whose geometry merely visualizes nongeometric constraints
      prerequisites: []
      sample_tasks:
      - instruction: In a regular octagon of side length 2, derive the exact distance
          between two vertices separated by three edges.
        kind: entry
      - instruction: Find all circles above the x-axis that pass through the origin
          and are tangent to y = x^2 at a second point, deriving the tangency conditions.
        kind: representative
    - id: analysis-proof.structural-proof
      kind: capability
      parent_id: analysis-proof
      name: Structural and abstract proof
      outcome: Use definitions, invariants, and structure-preserving maps to prove
        or refute claims about discrete or abstract mathematical objects.
      includes:
      - Groups, rings, fields, graphs, sets, and combinatorial structures
      - Classification from generators, relations, invariants, and isomorphisms
      excludes:
      - Finite enumeration when only a numeric count is requested
      - Propositional validity with no domain-specific mathematical structure
      prerequisites: []
      sample_tasks:
      - instruction: Classify, up to isomorphism, the group generated by a and b with
          a^4 = 1, b^2 = a^2, and b^(-1)ab = a^(-1), justifying each structural claim.
        kind: entry
      - instruction: Prove that every finite tree with at least two vertices has at
          least two leaves without appealing to a drawing.
        kind: representative
    - id: probability-statistics
      kind: capability
      parent_id: null
      name: Probability modeling and statistical inference
      outcome: Construct and analyze probability models with known or unknown parameters,
        computing distributions and expectations or deriving justified inferential
        and predictive conclusions from samples.
      includes:
      - Known-parameter probability calculations and derivation of stochastic laws
      - Estimation, testing, uncertainty, and end-to-end tasks connecting a data-generating
        mechanism to inference
      excludes:
      - Combinatorial counts with no random experiment
      - Exploratory analysis or visualization of a supplied dataset without probabilistic
        justification
      prerequisites: []
      sample_tasks:
      - instruction: A screening test has known sensitivity and specificity, while
          disease prevalence p is unknown. Derive the distribution of the number of
          positive results in an independent sample, obtain the maximum-likelihood
          estimator of p, and state when it is identifiable.
        kind: entry
      - instruction: Events follow a Poisson process with unknown rate, but observation
          stops at a fixed time T. Derive the likelihood from the process model, estimate
          the rate, and give the plug-in probability of at least one event in the
          next time interval of length s.
        kind: representative
    - id: probability-statistics.probabilistic-modeling
      kind: capability
      parent_id: probability-statistics
      name: Known-parameter probabilistic modeling
      outcome: Construct and analyze a probability model with specified parameters
        to compute event probabilities, distributions, expectations, and dependence.
      includes:
      - Discrete and continuous random variables with known laws
      - Conditional probability, independence, expectation, and stopping times
      excludes:
      - Inference about unknown population parameters from a sample
      - Combinatorial counts with no random experiment
      prerequisites: []
      sample_tasks:
      - instruction: Two cards are drawn without replacement from a standard deck.
          Compute the conditional probability that both are aces given that at least
          one is an ace.
        kind: entry
      - instruction: A coin with known head probability p is tossed until the first
          tail. Derive the probability generating function and expectation of the
          number of heads.
        kind: representative
    - id: probability-statistics.statistical-inference
      kind: capability
      parent_id: probability-statistics
      name: Inference under an explicit sampling model
      outcome: Derive and compare estimators, tests, and uncertainty procedures when
        the sampling distribution and its unknown parameter are explicitly specified.
      includes:
      - Likelihood, bias, variance, consistency, and sufficiency
      - Confidence intervals, hypothesis tests, power, and asymptotic distributions
      excludes:
      - Deriving the stochastic observation model from an informal mechanism
      - Probability calculations in which all parameters are known
      prerequisites:
      - probability-statistics.probabilistic-modeling
      sample_tasks:
      - instruction: For n independent Poisson observations with unknown rate lambda,
          derive the maximum-likelihood estimator and determine its bias and variance.
        kind: entry
      - instruction: For an independent normal sample with unknown mean and variance,
          derive a 95% confidence interval for the mean and justify the reference
          distribution.
        kind: representative
    - id: optimization-operations
      kind: capability
      parent_id: null
      name: Optimization modeling and solution
      outcome: Formulate decision problems as variables, objectives, and constraints
        and/or solve specified models, certifying feasibility and local or global
        optimality.
      includes:
      - Standalone model formulation and solution or certification of already specified
        models
      - End-to-end optimization, including geometric maximization or minimization
        when deriving the feasible family is part of the task
      excludes:
      - Geometric relation or locus problems with no maximize or minimize objective
      - Numerical approximation whose main question is discretization or rounding
        error rather than objective quality
      prerequisites: []
      sample_tasks:
      - instruction: A square sheet has equal squares cut from its corners and is
          folded into an open box. Formulate the volume and feasible interval in terms
          of the cut size, find the maximizing box, and certify global optimality.
        kind: entry
      - instruction: Given six workers, their shift availability, and required coverage
          for three shifts, formulate a minimum-cost integer assignment, solve the
          stated small instance, and provide a lower bound or structural argument
          certifying optimality.
        kind: representative
    - id: optimization-operations.model-formulation
      kind: capability
      parent_id: optimization-operations
      name: Optimization model formulation
      outcome: Represent a decision problem with explicit variables, objective, constraints,
        domains, and assumptions suitable for mathematical solution.
      includes:
      - Linear, integer, network, assignment, routing, and scheduling formulations
      - Identification of feasible sets and modeling tradeoffs
      excludes:
      - Finding or certifying an optimum for the formulated model
      - Geometry problems that request a relation or locus but no objective
      prerequisites: []
      sample_tasks:
      - instruction: Formulate a mixed-integer program that assigns nurses to shifts
          while meeting coverage, rest, and weekly-hour requirements; define every
          variable and constraint.
        kind: entry
      - instruction: Express the shortest path from a source to a destination as a
          linear optimization problem using flow-conservation constraints, without
          solving an instance.
        kind: representative
    - id: optimization-operations.solution-certification
      kind: capability
      parent_id: optimization-operations
      name: Solution of specified optimization models
      outcome: Find candidate optima for an explicitly specified objective and feasible
        set and establish local or global optimality using analytic, structural, or
        dual arguments.
      includes:
      - Convexity, derivatives, KKT conditions, exchange arguments, and duality
      - Exact solutions and certified bounds for already formulated discrete optimization
        problems
      excludes:
      - Deriving decision variables or constraints from an informal operational or
        geometric problem
      - Approximation error analysis for numerical algorithms
      prerequisites: []
      sample_tasks:
      - instruction: Minimize x^2 + 4y^2 subject to x + y = 6, and certify that the
          solution is globally optimal.
        kind: entry
      - instruction: Given weighted unit-time jobs with deadlines, derive an algorithm
          that maximizes total scheduled weight and prove its optimality by an exchange
          argument.
        kind: representative
    - id: numerical-methods
      kind: capability
      parent_id: null
      name: Numerical approximation and systems
      outcome: Approximate scalar quantities or solve coupled algebraic and differential
        systems numerically while controlling relevant truncation, iteration, conditioning,
        stability, and rounding errors.
      includes:
      - Scalar root finding, interpolation, quadrature, differentiation, and associated
        error bounds
      - Iterative or discretized system solution, including multi-stage pipelines
        with allocated tolerances and stability checks
      excludes:
      - Exact symbolic evaluation or proof with no approximate result
      - Performance engineering of simulations when numerical validity is assumed
      prerequisites: []
      sample_tasks:
      - instruction: Discretize -u'' = 1 on [0, 1] with u(0) = u(1) = 0 by centered
          differences, solve the resulting linear system iteratively, and bound the
          combined discretization and algebraic-solve error.
        kind: entry
      - instruction: Apply the implicit trapezoidal method to a stiff nonlinear initial-value
          problem for two steps, use Newton iteration for each implicit equation,
          and choose a stopping tolerance so nonlinear-solve error does not dominate
          time-discretization error.
        kind: representative
    - id: numerical-methods.approximation-error
      kind: capability
      parent_id: numerical-methods
      name: Scalar approximation and error control
      outcome: Approximate scalar quantities, roots, derivatives, or integrals while
        bounding truncation, iteration, and rounding error.
      includes:
      - Root finding, interpolation, quadrature, and finite differences
      - Convergence rates, stopping criteria, and scalar error propagation
      excludes:
      - Exact closed-form evaluation
      - Linear, nonlinear, or differential systems with coupled unknowns
      prerequisites: []
      sample_tasks:
      - instruction: Apply bisection to locate a root of x^3 - x - 1 in [1, 2] within
          absolute error 0.001, and determine the required iteration count.
        kind: entry
      - instruction: Approximate the integral of exp(-x^2) from 0 to 1 with composite
          Simpson's rule and derive an error bound from the fourth derivative.
        kind: representative
    - id: numerical-methods.iterative-systems
      kind: capability
      parent_id: numerical-methods
      name: Iterative solution and stability of systems
      outcome: Solve coupled linear, nonlinear, or differential systems numerically
        and diagnose convergence, conditioning, or time-stepping stability.
      includes:
      - Direct and iterative numerical linear algebra
      - Time-stepping and boundary-value discretizations with multiple coupled unknowns
      excludes:
      - Single-variable root, derivative, integral, or interpolation tasks
      - Parallelization or performance engineering of a simulation
      prerequisites: []
      sample_tasks:
      - instruction: Perform three Gauss-Seidel iterations for a specified diagonally
          dominant 3 by 3 linear system and justify convergence from the coefficient
          matrix.
        kind: entry
      - instruction: Discretize a one-dimensional heat equation with an explicit finite-difference
          scheme and derive the time-step condition required for stability.
        kind: representative
    - id: logic-verification
      kind: capability
      parent_id: null
      name: Formal logic and system verification
      outcome: Translate declarative claims or operational behavior into formal logic
        and determine validity, satisfiability, equivalence, entailment, or behavioral
        correctness through derivations, models, invariants, contracts, induction,
        or state exploration.
      includes:
      - Standalone propositional or first-order deduction and countermodel construction
      - Program and transition-system verification, including synthesis tasks that
        connect logical proof artifacts to executions
      excludes:
      - Proofs relying mainly on algebraic, geometric, or other mathematical domain
        structure
      - Testing a finite set of executions without a formal general claim
      prerequisites: []
      sample_tasks:
      - instruction: Let a two-bit state (x, y) start at (0, 0), and at each step
          either toggle x or, when x = 1, toggle y. Build both a truth-table disjunctive
          encoding and an implication-based conjunctive encoding of executions of
          exactly three transitions, prove the encodings equivalent, decide whether
          y = 1 holds in the final state after exactly three transitions, and translate
          a satisfying assignment into a three-transition trace.
        kind: entry
      - instruction: 'For the loop while i < n: s := s + i + 1; i := i + 1 over integers,
          use the precondition n >= 0, i = 0, and s = 0, the invariant 0 <= i <= n
          and 2s = i(i + 1), and the final postcondition 2s = n(n + 1). Derive the
          weakest precondition of the loop body, translate initialization, preservation,
          and exit into quantified formulas, prove them with explicit logical inference
          rules, and explain how the derivations establish the final postcondition
          for every execution.'
        kind: representative
    - id: logic-verification.logical-deduction
      kind: capability
      parent_id: logic-verification
      name: Formal logical deduction
      outcome: Translate declarative statements into a logical language and determine
        validity, satisfiability, equivalence, or entailment by explicit derivation
        or countermodel.
      includes:
      - Truth-functional reasoning, quantifiers, proof systems, and countermodels
      - Normal forms and finite satisfiability arguments
      excludes:
      - Proofs relying mainly on algebraic or geometric domain facts
      - Claims about stateful program or transition-system executions
      prerequisites: []
      sample_tasks:
      - instruction: Convert (p implies q) and (r implies not q) and (p or r) into
          conjunctive normal form and determine whether the formula is satisfiable.
        kind: entry
      - instruction: Given premises forall x (P(x) implies Q(x)) and exists x P(x),
          construct a natural-deduction proof of exists x Q(x).
        kind: representative
    - id: logic-verification.system-verification
      kind: capability
      parent_id: logic-verification
      name: Invariant and contract verification
      outcome: Formulate behavioral properties of programs or transition systems and
        prove or refute them with invariants, contracts, induction over executions,
        or state exploration.
      includes:
      - Preconditions, postconditions, loop invariants, and temporal safety or liveness
        properties
      - Inductive proofs over executions and reachable counterexample traces
      excludes:
      - Testing a finite set of executions without a general behavioral claim
      - Standalone logical validity or satisfiability with no program or transition
        semantics
      prerequisites: []
      sample_tasks:
      - instruction: Give preconditions, a loop invariant, and a postcondition for
          an in-place array-reversal loop, and prove initialization, preservation,
          and the postcondition at termination.
        kind: entry
      - instruction: For a specified two-process mutual-exclusion protocol, formalize
          the safety property and either prove it inductive over reachable states
          or provide a reachable counterexample trace.
        kind: representative
- routing_facet: subject_domain
  curriculum:
    version: pilot-2
    subject_id: C21
    subject_name: Office Productivity & Documents
    sections:
    - id: c21.spreadsheets
      kind: capability
      parent_id: null
      name: Build decision-ready spreadsheet models
      outcome: Given operational data and a decision need, design or revise a spreadsheet
        model whose inputs, calculations, checks, and summaries are organized, correct,
        and traceable.
      includes:
      - structuring tables and model regions for reliable calculation
      - deriving values with references, formulas, lookups, conditions, and aggregations
      - checking calculations and presenting compact spreadsheet summaries or scenarios
      excludes:
      - open-ended statistical research or formal experiment analysis
      - building database applications or general-purpose software
      - designing a visual report when no spreadsheet model is involved
      prerequisites: []
      sample_tasks:
      - instruction: Create a quarterly program-budget workbook from the supplied
          transactions. Separate assumptions from calculated results, compute actual-versus-budget
          amounts by category, flag categories over budget, and add a compact summary
          that a director can audit back to the source rows.
        kind: entry
      - instruction: Revise a volunteer-hours workbook so coordinators can enter shifts
          once, calculate each volunteer's total and remaining commitment automatically,
          and see warnings for duplicate shifts or totals that do not reconcile.
        kind: representative
    - id: c21.spreadsheets.structure
      kind: capability
      parent_id: c21.spreadsheets
      name: Structure data for spreadsheet models
      outcome: Arrange source data, assumptions, and output regions into consistent
        spreadsheet tables whose grain, ranges, categories, and units support reliable
        downstream calculations and traceable references.
      includes:
      - choosing a calculation-ready row grain, columns, keys, and table boundaries
      - normalizing dates, categories, units, and missing-value conventions needed
        by formulas and summaries
      - separating source data, user assumptions, calculation regions, and outputs
      excludes:
      - writing the substantive formulas that derive business results
      - designing record intake, filing, version, retention, or retrieval workflows
        even when an index uses a spreadsheet
      - performing statistical inference
      prerequisites: []
      sample_tasks:
      - instruction: Restructure twelve monthly sales sheets into a model-ready workbook
          for later margin and variance calculations. Establish one transaction grain,
          standardize product, date, quantity, and currency fields, separate exchange-rate
          assumptions, and document ambiguous source rows without writing the business
          formulas.
        kind: entry
      - instruction: Reorganize a capacity-planning workbook whose demand inputs,
          staffing assumptions, and partial outputs are interleaved. Create expandable
          source and assumption tables, align weekly periods and units, and define
          traceable calculation and summary regions for the formulas that will be
          added next.
        kind: representative
    - id: c21.spreadsheets.calculate
      kind: capability
      parent_id: c21.spreadsheets
      name: Compute and check spreadsheet results
      outcome: Translate business rules into maintainable spreadsheet calculations,
        then test references, edge cases, and reconciliations so changes to inputs
        produce trustworthy results.
      includes:
      - relative, absolute, cross-table, conditional, date, lookup, and aggregate
        calculations
      - scenario and what-if calculations driven by explicit assumptions
      - error handling, reasonableness checks, subtotals, and reconciliation controls
      excludes:
      - reorganizing fundamentally malformed source tables
      - statistical modeling that requires specialized analytical methods
      - manual arithmetic whose results do not update with the workbook
      prerequisites: []
      sample_tasks:
      - instruction: Add formulas to a staffing-cost model to select each employee's
          pay rate from a role table, calculate regular and overtime cost, and flag
          missing roles. Include control totals that reconcile employee detail to
          the departmental summary.
        kind: entry
      - instruction: Repair a loan-comparison sheet in which copied formulas use the
          wrong rate cells and blank fees produce errors. Make the calculations robust,
          show total cost for three scenarios, and add checks that expose incomplete
          assumptions.
        kind: representative
    - id: c21.records
      kind: capability
      parent_id: null
      name: Capture and maintain usable office records
      outcome: Create and maintain records that collect the required facts consistently,
        preserve status and provenance, and remain easy for authorized people to retrieve
        and update.
      includes:
      - designing structured intake and update workflows
      - validating required fields and controlled values
      - classifying, naming, filing, versioning, and retrieving records
      excludes:
      - structuring spreadsheet tables and regions for downstream calculation
      - drafting narrative documents whose primary purpose is communication
      - implementing enterprise databases or access-control infrastructure
      prerequisites: []
      sample_tasks:
      - instruction: Design an intake and filing workflow for community-partner agreements.
          Capture the parties, effective dates, renewal status, owner, approvals,
          and supporting files, and explain how staff should update and retrieve a
          record without creating duplicates.
        kind: entry
      - instruction: Clean up a shared collection of equipment inspection records
          and prevent the same problems in future submissions. Define a consistent
          naming and folder scheme, distinguish current from superseded inspections,
          produce an index for authorized staff, and revise the inspection cover form
          to require the metadata the cleanup found missing.
        kind: representative
    - id: c21.records.capture
      kind: capability
      parent_id: c21.records
      name: Design reliable forms and intake flows
      outcome: Turn an information need into a concise form or intake sequence that
        elicits complete, consistently encoded, and reviewable responses from the
        intended users.
      includes:
      - selecting necessary fields and response controls
      - writing clear labels, instructions, and conditional questions
      - specifying required-field, range, date, uniqueness, and consistency validation
      excludes:
      - conducting research survey methodology or psychometric instrument design
      - structuring existing data for spreadsheet calculations or deciding long-term
        filing and retention policies
      - writing narrative reports from collected responses
      prerequisites: []
      sample_tasks:
      - instruction: Create a facilities-incident intake form for employees. Collect
          only the information needed to route and investigate an incident, use conditional
          questions for injury or equipment damage, and specify validation that prevents
          unusable dates, locations, and contact details.
        kind: entry
      - instruction: Revise a volunteer registration form that currently asks duplicate
          questions and allows free-text availability. Produce a shorter field sequence
          with consistent time-slot choices, emergency-contact checks, consent, and
          a final review step.
        kind: representative
    - id: c21.records.organize
      kind: capability
      parent_id: c21.records
      name: Organize and retrieve controlled records
      outcome: Apply consistent classification, naming, status, version, and index
        information so records can be found, distinguished, updated, and retired without
        losing provenance.
      includes:
      - folder, filename, label, and metadata conventions
      - indexes, cross-references, ownership, and lifecycle status
      - duplicate resolution, version control, retention, and archival disposition
      excludes:
      - collecting new information through user-facing forms
      - reshaping tabular data to support formulas, scenarios, or analytical summaries
      - configuring storage systems, permissions services, or backup infrastructure
      prerequisites: []
      sample_tasks:
      - instruction: Given a mixed folder of signed contracts, drafts, amendments,
          and scans, propose and apply a filing plan that preserves the contract relationship,
          identifies the authoritative version, and lets staff retrieve active agreements
          by partner and renewal date.
        kind: entry
      - instruction: Create a records index for a training program whose attendance
          sheets and certificates use inconsistent participant names. Reconcile likely
          duplicates, retain evidence of uncertainty, and mark which records are complete,
          pending, or superseded.
        kind: representative
    - id: c21.documents
      kind: capability
      parent_id: null
      name: Produce polished workplace documents
      outcome: Draft, revise, structure, and format workplace documents so their content
        is accurate, audience-appropriate, navigable, and ready for distribution.
      includes:
      - creating and reorganizing purpose-driven prose
      - revising for clarity, consistency, tone, and completeness
      - using headings, lists, tables, styles, references, and page layout to support
        reading
      excludes:
      - slide-based presentation production
      - record classification and retention
      - creative writing whose primary goal is artistic expression
      prerequisites: []
      sample_tasks:
      - instruction: Turn the supplied meeting notes and policy decisions into a staff
          procedure. Resolve repeated points, organize the steps and exceptions, add
          a revision summary, and format the result for quick use during daily operations.
        kind: entry
      - instruction: Revise a five-page grant narrative for a mixed technical and
          community audience. Preserve the approved facts, strengthen the problem-to-impact
          argument, standardize headings and terminology, and prepare a clean final
          document with a concise contents aid.
        kind: representative
    - id: c21.documents.compose
      kind: capability
      parent_id: c21.documents
      name: Draft and revise purpose-driven documents
      outcome: Transform requirements, notes, and source material into coherent document
        content with the right structure, detail, tone, and calls to action for its
        audience.
      includes:
      - outlining and drafting memos, procedures, proposals, reports, and letters
      - synthesizing supplied facts without inventing unsupported claims
      - reorganizing and editing for clarity, concision, consistency, and audience
        fit
      excludes:
      - page-layout polish that does not change the document's content
      - short conversational correspondence and inbox triage
      - designing a sequence of presentation slides
      prerequisites: []
      sample_tasks:
      - instruction: Draft a two-page decision memo from the supplied project notes.
          State the decision, compare the three options using only the provided evidence,
          identify risks and unresolved questions, and recommend next steps for an
          executive reader.
        kind: entry
      - instruction: Rewrite a confusing onboarding procedure so a new employee can
          complete it without oral guidance. Put actions in dependency order, define
          unfamiliar terms, separate required steps from optional tips, and surface
          the two escalation conditions.
        kind: representative
    - id: c21.documents.finalize
      kind: capability
      parent_id: c21.documents
      name: Format and finalize readable documents
      outcome: Apply consistent styles, layout, navigation, and final-quality checks
        so a document remains readable, accessible, and stable across pages and revisions.
      includes:
      - heading hierarchies, paragraph and list styles, tables, captions, and cross-references
      - page breaks, margins, headers, footers, numbering, and contents aids
      - visual consistency, accessibility checks, and final proofreading
      excludes:
      - substantive argument development or fact selection
      - slide layout and live-presentation support
      - folder naming or records-retention decisions
      prerequisites: []
      sample_tasks:
      - instruction: Format the supplied employee handbook so heading levels, lists,
          callout boxes, page numbering, and the table of contents behave consistently.
          Fix stranded headings and inaccessible tables without changing the approved
          wording.
        kind: entry
      - instruction: Prepare a print-ready version of a committee report assembled
          from several contributors. Standardize typography and captions, keep wide
          tables readable, add consistent headers and section starts, and complete
          a final visual and accessibility check.
        kind: representative
    - id: c21.presentations
      kind: capability
      parent_id: null
      name: Develop audience-ready presentations
      outcome: Turn a communication goal and supporting material into a coherent presentation
        whose narrative, slides, and delivery support help an audience understand
        and act.
      includes:
      - planning an audience-centered sequence and selecting evidence
      - building legible slides with purposeful visuals and restrained text
      - creating speaker support, handoffs, accessibility, and final consistency
      excludes:
      - long-form document drafting
      - standalone data analysis whose presentation is incidental
      - video editing or interactive application development
      prerequisites: []
      sample_tasks:
      - instruction: Develop a ten-minute board presentation from the supplied budget
          tables and program update. Lead to a specific funding decision, choose only
          the evidence needed for that decision, create a consistent slide sequence,
          and add speaker notes for the transitions and ask.
        kind: entry
      - instruction: Rework a crowded training deck for first-time supervisors. Establish
          a clear learning arc, replace dense paragraphs with usable examples and
          visuals, add an opening objective and closing practice prompt, and make
          the slides accessible for projection.
        kind: representative
    - id: c21.presentations.plan
      kind: capability
      parent_id: c21.presentations
      name: Plan persuasive presentation narratives
      outcome: Define the audience, decision or learning goal, evidence, and slide-by-slide
        progression before production so each part advances a clear presentation story.
      includes:
      - audience and purpose analysis
      - message hierarchy, evidence selection, and sequencing
      - storyboards, section arcs, transitions, and calls to action
      excludes:
      - applying final slide layouts, typography, or graphics
      - writing a complete prose report
      - inventing evidence not present in the source material
      prerequisites: []
      sample_tasks:
      - instruction: Create a slide-by-slide outline for persuading a city committee
          to approve a pilot recycling program. Use the supplied costs, resident feedback,
          and operational risks; identify the purpose of each slide and the final
          decision request.
        kind: entry
      - instruction: Plan a 20-minute orientation presentation for new volunteers.
          Sequence the mission, safety rules, example shift, and escalation process
          so the audience first understands why the work matters and then can act
          correctly.
        kind: representative
    - id: c21.presentations.produce
      kind: capability
      parent_id: c21.presentations
      name: Build and refine effective slides
      outcome: Convert an established presentation plan into consistent, legible slides
        and delivery support that emphasize key information without distracting or
        overloading the audience.
      includes:
      - slide layouts, typography, color, spacing, images, diagrams, and data displays
      - speaker notes, timing cues, handoffs, and rehearsal-oriented refinements
      - consistency, source attribution, contrast, reading order, and accessibility
        checks
      excludes:
      - choosing the core argument when no narrative plan exists
      - performing the underlying spreadsheet analysis
      - producing motion graphics or edited video
      prerequisites: []
      sample_tasks:
      - instruction: Build slides from the approved fundraising-pitch outline and
          asset folder. Use a consistent visual system, turn the impact figures into
          readable displays, keep citations attached to claims, and add concise notes
          that fit an eight-minute delivery.
        kind: entry
      - instruction: Polish a nearly complete quarterly-review deck whose charts,
          fonts, and spacing are inconsistent. Repair visual hierarchy and accessibility,
          simplify overloaded slides without removing required facts, and add cues
          for two presenter handoffs.
        kind: representative
    - id: c21.coordination
      kind: capability
      parent_id: null
      name: Coordinate correspondence and time commitments
      outcome: Maintain clear workplace communication and feasible schedules by extracting
        intent, preserving commitments, resolving conflicts, and issuing concise updates
        as information changes.
      includes:
      - drafting and managing actionable correspondence
      - creating and revising appointments across dates, participants, locations,
        resources, and time zones
      - tracking requests, decisions, invitations, responses, and prior schedule state
        across updates
      excludes:
      - full project planning with task dependencies and resource forecasts
      - long-form document or presentation production
      - customer-support decisions that require domain-specific policy judgment
      prerequisites: []
      sample_tasks:
      - instruction: Review the supplied email thread about a vendor demonstration,
          identify the commitments and unanswered question, draft the next reply,
          and update the proposed meeting time so it respects every participant's
          stated availability.
        kind: entry
      - instruction: Coordinate a rescheduled staff workshop after the facilitator
          becomes unavailable. Preserve the attendee and shared-room constraints across
          the two candidate dates, update the invitation without losing response state,
          and draft concise notices that distinguish the replacement from the canceled
          event.
        kind: representative
    - id: c21.coordination.correspondence
      kind: capability
      parent_id: c21.coordination
      name: Compose and manage actionable correspondence
      outcome: Read communication context and produce concise messages that preserve
        relevant facts, match the relationship and tone, and make decisions, requests,
        ownership, and next steps explicit.
      includes:
      - drafting, replying, forwarding, and summarizing workplace messages
      - extracting requests, commitments, deadlines, owners, and unresolved questions
        from threads
      - prioritizing, routing, and following up on correspondence
      excludes:
      - allocating events into a conflict-free schedule
      - writing long-form reports, policies, or proposals
      - inventing approvals, commitments, or facts absent from the communication history
      prerequisites: []
      sample_tasks:
      - instruction: Read the supplied procurement email thread and draft a reply
          that confirms the accepted quantity and delivery window, asks only for the
          missing tax document, assigns the internal approval step, and uses an appropriately
          firm but cooperative tone.
        kind: entry
      - instruction: Triage twelve incoming messages for a program director. Group
          related threads, identify which require a reply today, summarize each requested
          action with owner and deadline, and draft the two highest-priority responses.
        kind: representative
    - id: c21.coordination.scheduling
      kind: capability
      parent_id: c21.coordination
      name: Maintain calendars under evolving constraints
      outcome: Create, revise, cancel, and restore calendar state across successive
        requests while preserving event identity, temporal constraints, participant
        and resource state, and an accurate history of exceptions.
      includes:
      - allocating and revising single or recurring events across days while resolving
        exact starts, time windows, durations, availability, working hours, and non-overlap
      - handling dates, time zones, shared locations or resources, recurrence exceptions,
        reminders, and cancellation state
      - maintaining invitation details, participant responses, prior constraints,
        and recoverable schedule snapshots across updates
      excludes:
      - project plans whose primary challenge is dependency or resource optimization
      - drafting the substantive content of meetings or events
      - discarding prior calendar state or constraints merely because a later request
        causes a conflict
      prerequisites: []
      sample_tasks:
      - instruction: Schedule a six-week training series for participants in Los Angeles
          and New York using the supplied availability and room calendars. Keep each
          occurrence at 10:00 Los Angeles time, avoid shared-room conflicts, create
          an exception for a holiday week, and issue invitations that show the correct
          local times and recurrence dates.
        kind: entry
      - instruction: Starting from the supplied three-day calendar history, restore
          the snapshot after the second update, cancel one event, and move another
          after an attendee declines. Preserve event identities, durations, invitees,
          response state, room booking, and reminder settings, then report the complete
          resulting calendar and cancellation history.
        kind: representative
- routing_facet: subject_domain
  curriculum:
    version: wave2-2
    subject_id: C01
    subject_name: Software Engineering
    sections:
    - id: c01
      kind: capability
      parent_id: null
      name: Software Engineering
      outcome: Produce correct, maintainable software changes from bounded function
        implementations through repository-scale diagnosis, implementation, verification,
        packaging, and version-control integration.
      includes:
      - Synthesizing executable code from behavioral specifications
      - Diagnosing, repairing, extending, testing, and restructuring software
      - Managing dependency, build, release, and version-control concerns that accompany
        code changes
      excludes:
      - Product analysis that does not culminate in a software change
      - Pure system administration outside a repository or build
      - Hardware instruction scheduling without software implementation
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Implement a small documented function that transforms a list
          of records and add focused examples for its empty, singleton, and ordinary
          cases.
      - kind: representative
        instruction: 'Deliver one optional parser plugin for an unfamiliar packaged
          command-line project: trace its extension path, implement the specified
          behavior, extract shared dispatch logic, add focused and command-level tests,
          declare and build the optional package extra, and integrate the change on
          a topic branch after resolving a conflicting upstream edit.'
    - id: c01.6
      kind: capability
      parent_id: c01
      name: Standalone Function Synthesis
      outcome: Translate a self-contained behavioral contract into an executable function
        whose algorithm, data transformations, and edge-case behavior satisfy that
        contract.
      includes:
      - Boolean search and decision functions
      - Collection transformation, aggregation, and ordering
      - Constructive string processing
      excludes:
      - Changes that require navigating an existing repository
      - Repairs whose implementation must be localized from a symptom
      - Multi-module architecture and deployment configuration
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Implement a function that returns whether any integer in a sequence
          is outside a supplied inclusive range.
      - kind: representative
        instruction: Implement one function that validates timestamped label records
          for conflicting identifiers, aggregates numeric readings by normalized label,
          orders the groups deterministically, and returns a compact textual summary.
    - id: c01.6.1
      kind: capability
      parent_id: c01.6
      name: Search and Predicate Functions
      outcome: Implement boolean functions that decide a stated property by examining
        elements, pairs, or local relationships without missing boundary cases.
      includes:
      - Membership and repetition detection
      - Pairwise or neighborhood conditions
      - Strict and inclusive comparison rules
      excludes:
      - Returning transformed collections or reports
      - Repairing predicates inside an existing system
      - Domain-specific theorem proving
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Implement a function that reports whether a sequence contains
          a negative integer.
      - kind: representative
        instruction: Implement a function that reports whether a token stream contains
          either a repeated token within a configurable window or a forbidden adjacent
          pair, handling empty streams and exact window boundaries.
    - id: c01.6.2
      kind: capability
      parent_id: c01.6
      name: Collection Transformation and Aggregation
      outcome: Implement functions that select, transform, group, aggregate, or order
        collection elements into the specified result shape.
      includes:
      - Filtering and membership-based collection construction
      - Numeric and categorical aggregation
      - Sorting structured elements by derived keys
      excludes:
      - Functions whose only result is a boolean decision
      - Repository-specific dataframe API design
      - Constructive string algorithms
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Implement a function that returns the count of values in each
          category of an input sequence.
      - kind: representative
        instruction: Implement a function that filters invalid transactions, groups
          the remainder by account, computes each account's total and median amount,
          and returns records ordered by descending total with a deterministic tie
          break.
    - id: c01.6.3
      kind: capability
      parent_id: c01.6
      name: Constructive String Functions
      outcome: Implement functions that inspect string structure and construct the
        minimal or canonical string required by a specification.
      includes:
      - Prefix, suffix, and substring reasoning
      - Character-wise normalization and reconstruction
      - Escaping and run-based encoding
      excludes:
      - General text parsing into repository state
      - Formatting repairs to an existing public API
      - Natural-language generation
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Implement a function that collapses each nonempty run of whitespace
          to one space while preserving non-whitespace characters.
      - kind: representative
        instruction: Implement a reversible run-length encoder that emits the shortest
          valid representation under the supplied escaping rules and correctly handles
          digits, escape characters, and single-character runs.
    - id: c01.1
      kind: capability
      parent_id: c01
      name: Repository Investigation and Behavioral Evidence
      outcome: Trace observable behavior through an unfamiliar repository and establish
        focused and public-workflow tests that expose the relevant contract.
      includes:
      - Locating public entry points and responsible implementation paths
      - Following state, control flow, data flow, and side effects
      - Creating focused and integrated tests with observable assertions
      excludes:
      - Choosing or implementing the final repair
      - Broad architectural redesign
      - Tests that merely prove code executes
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Trace a documented public method to the helper that computes
          its result and add one assertion to the existing focused test for that result.
      - kind: representative
        instruction: For one command whose generated manifest is wrong, trace the
          same execution from argument parsing through configuration and persistence,
          then create a focused test at the responsible boundary and a command-level
          test that exposes the manifest defect.
    - id: c01.1.1
      kind: capability
      parent_id: c01.1
      name: Behavior Tracing and Fault Localization
      outcome: Follow a public symptom through entry points, dispatch, state transitions,
        and side effects to identify the smallest responsible code boundary.
      includes:
      - Searching definitions, call sites, and configuration consumers
      - Tracing parser, callback, resolver, and command paths
      - Comparing expected and actual state transitions
      excludes:
      - Implementing the repair
      - Guessing responsibility from filenames alone
      - Performance profiling without a functional symptom
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Trace one public method call to the helper that computes its
          return value.
      - kind: representative
        instruction: Trace a missing command-side effect through configuration loading,
          dispatch, callbacks, and persistence, and identify the smallest boundary
          at which execution diverges from the documented contract.
    - id: c01.1.2
      kind: capability
      parent_id: c01.1
      name: Behavioral Test Authoring
      outcome: Write focused and integrated tests that distinguish compliant behavior
        from a defect through public values, state, events, files, or repository effects.
      includes:
      - Deterministic regression tests at component boundaries
      - Public-API and command-level workflow tests
      - Controlled fixtures with observable assertions
      excludes:
      - Tautological existence or type checks
      - Assertions coupled only to private call counts
      - Live external services when a local boundary suffices
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Add one assertion to an existing test that distinguishes the
          documented result from the current result.
      - kind: representative
        instruction: For one stateful import command, use a shared isolated workspace
          to write a focused test for its state transition and a public command test
          for the resulting output file and persisted state.
    - id: c01.1.2.1
      kind: capability
      parent_id: c01.1.2
      name: Focused Regression Tests
      outcome: Create small deterministic tests that isolate one semantic rule or
        state contract and distinguish faulty behavior from corrected behavior.
      includes:
      - Boundary values and equivalence classes
      - Assertions on values, ordering, identity, and exceptions
      - Minimal fixtures for one component
      excludes:
      - Multi-process or command-level workflows
      - Assertions that duplicate implementation expressions
      - Unrelated coverage expansion
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Add a failing assertion for one documented boundary input to
          an existing component test.
      - kind: representative
        instruction: Write a compact parameterized suite for a date-window classifier
          covering containment, partial overlap, touching endpoints, reversed input
          order, empty windows, and disjoint windows.
    - id: c01.1.2.2
      kind: capability
      parent_id: c01.1.2
      name: Integrated Workflow Tests
      outcome: Test contracts that emerge across public APIs, callbacks, commands,
        files, generated artifacts, or multiple modules.
      includes:
      - Command and public-API execution
      - Temporary filesystem, database, and schema fixtures
      - Assertions on cross-component state and side effects
      excludes:
      - Pure helper-function truth tables
      - Live network dependencies when local substitutes exist
      - Tests that inspect only internal calls
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Run one public command in an isolated temporary workspace and
          assert its documented file effect.
      - kind: representative
        instruction: Build an isolated workflow fixture that invokes a public import
          command, crosses configuration and persistence boundaries, and verifies
          returned data, emitted output, generated files, and final repository state.
    - id: c01.2.1.1
      kind: capability
      parent_id: c01
      name: Boundary and Predicate Contract Repair
      outcome: Diagnose and correct a deterministic predicate or boundary convention
        while preserving all unaffected cases.
      includes:
      - Strict versus inclusive comparisons
      - Half-open and closed range conventions
      - Boolean relations and boundary normalization
      excludes:
      - Expression compilation contexts
      - Collection traversal ordering
      - Multi-stage parser or resolver pipelines
      prerequisites:
      - c01.1.1
      - c01.1.2.1
      sample_tasks:
      - kind: entry
        instruction: Trace a public boundary-classification failure to its predicate,
          create focused cases for both sides of the boundary, and correct one comparison
          operator.
      - kind: representative
        instruction: Trace a scheduling library's incorrect window-conflict result
          to its normalized range predicate, add focused coverage for overlap, containment,
          touching endpoints, empty windows, reversed operands, and disjoint windows,
          then repair the predicate without changing neighboring scheduling behavior.
    - id: c01.2.1.2
      kind: capability
      parent_id: c01
      name: Identity and Mutable-State Contract Repair
      outcome: Restore intended object identity and mutation visibility across accessors,
        nested contexts, decorators, and repeated calls.
      includes:
      - Live mutable mappings when mutation is contractual
      - Shared state across parent and child contexts
      - Aliasing and mutation-persistence tests
      excludes:
      - Database transaction isolation
      - Serialization round trips
      - Global mutable state introduced as a shortcut
      prerequisites:
      - c01.1.1
      - c01.1.2.1
      sample_tasks:
      - kind: entry
        instruction: Trace repeated reads of a public mapping property, prove with
          a focused test that mutations are lost, and change the accessor so the same
          underlying mapping remains visible.
      - kind: representative
        instruction: Trace metadata from creation through nested contexts and decorator-mediated
          access, write focused identity and mutation tests, and repair the storage
          contract so changes persist through command execution without leaking between
          independent contexts.
    - id: c01.2.1.3
      kind: capability
      parent_id: c01
      name: Evaluation Context Repair
      outcome: Restore correct compilation and evaluation behavior while preserving
        the documented global, local, and expression context.
      includes:
      - Compilation modes and executable object kinds
      - Global and local namespace propagation
      - Expression result and exception semantics
      excludes:
      - Range predicates and ordering defects
      - General parser tokenization
      - Sandbox or policy design
      prerequisites:
      - c01.1.1
      - c01.1.2.1
      sample_tasks:
      - kind: entry
        instruction: Trace a public expression method to its compilation call, add
          focused tests for a literal and a captured name, and replace the incorrect
          compilation mode.
      - kind: representative
        instruction: Trace an expression environment through capture, compilation,
          and evaluation, add focused cases for arithmetic, captured locals, module-qualified
          functions, and invalid statements, then restore expression evaluation without
          changing namespace precedence.
    - id: c01.2.1.4
      kind: capability
      parent_id: c01
      name: Collection Ordering Contract Repair
      outcome: Restore one documented traversal order consistently across direct iteration
        and all related collection views.
      includes:
      - Index and component traversal direction
      - Consistency among keys, values, items, and iteration
      - Stable ordering after mutation
      excludes:
      - Sorting APIs that intentionally choose a new order
      - Object identity contracts
      - Unordered-set semantics
      prerequisites:
      - c01.1.1
      - c01.1.2.1
      sample_tasks:
      - kind: entry
        instruction: Trace reversed public iteration to the index traversal, add focused
          assertions for direct iteration and keys, and correct the traversal direction.
      - kind: representative
        instruction: Trace an ordered record container's component traversal, add
          focused tests for sparse positions, replacement, direct iteration, keys,
          values, and items, and repair the shared ordering mechanism so every view
          remains consistent.
    - id: c01.2.4
      kind: capability
      parent_id: c01
      name: Public API Contract Restoration
      outcome: Restore a removed or broken public parameter, return shape, or formatting
        behavior without turning the repair into a new API design.
      includes:
      - Reinstating documented parameters and accepted value forms
      - Applying restored behavior at the correct output boundary
      - Preserving calls that omit the restored option
      excludes:
      - Net-new heterogeneous operation languages
      - Cross-layer intentional interface migrations
      - Compatibility aliases for undocumented interfaces
      prerequisites:
      - c01.1
      sample_tasks:
      - kind: entry
        instruction: Trace a documented formatting argument through the public method
          and output path, establish focused and public failing tests, and restore
          its constant-string form at the existing rendering boundary.
      - kind: representative
        instruction: Trace a missing line-prefix option from a documented public method
          through multiline rendering, add focused tests for constant and callback
          values plus a public formatting workflow, and restore both forms while leaving
          default output byte-for-byte unchanged.
    - id: c01.2.2
      kind: capability
      parent_id: c01
      name: Input and Resolution Pipeline Repair
      outcome: Repair a staged input path so extraction, representation detection,
        identifier decoding, dispatch, and resolution agree on one public contract.
      includes:
      - Structured field extraction
      - File-type recognition and parser selection
      - Consistent encoding, decoding, and object lookup
      excludes:
      - Pure arithmetic and ordering defects
      - Adding a new serialization format
      - Unrelated I/O performance work
      prerequisites:
      - c01.1
      sample_tasks:
      - kind: entry
        instruction: Trace one public import through extraction and dispatch, establish
          focused and public failing tests, and correct the single extraction step
          that drops an optional field.
      - kind: representative
        instruction: For one resource-reference importer, trace and test a shared
          reference from text extraction through representation detection, identifier
          decoding, handler dispatch, and final object lookup, then repair the inconsistent
          stages so the public import resolves the intended resource.
    - id: c01.2.2.1
      kind: capability
      parent_id: c01.2.2
      name: Structured Parsing Repair
      outcome: Correct tokenization or field extraction so structured text produces
        the documented normalized representation.
      includes:
      - Required and optional field extraction
      - Normalized labels, destinations, and titles
      - Parser-environment updates
      excludes:
      - Selecting a parser from a file type
      - Adding a new grammar or serialization form
      - Resolving encoded object identities
      prerequisites:
      - c01.1.1
      - c01.1.2.1
      sample_tasks:
      - kind: entry
        instruction: Trace an optional-title failure through a public parse call,
          add focused titled and untitled cases, and fix the extraction of that field.
      - kind: representative
        instruction: Trace reference-definition parsing to its environment update,
          add focused cases for escaped labels, normalized destinations, optional
          titles, whitespace variants, and multiple definitions, and repair the parser
          without consuming unrelated text.
    - id: c01.2.2.2
      kind: capability
      parent_id: c01.2.2
      name: Format Detection and Dispatch Repair
      outcome: Restore correct recognition and dispatch of supported inputs across
        validation, file inspection, parser selection, and public loading.
      includes:
      - Extension and content-based recognition
      - Validation-to-parser control flow
      - Representative fixtures for supported variants
      excludes:
      - Parsing fields after correct dispatch
      - Implementing a new file format
      - Packaging optional reader libraries
      prerequisites:
      - c01.1
      sample_tasks:
      - kind: entry
        instruction: Trace a documented file variant from the public loader through
          validation, add focused and public failing tests, and correct the branch
          that prevents it from reaching its existing reader.
      - kind: representative
        instruction: Trace several variants of one supported scientific format through
          validation, inspection, reader selection, and public loading, add focused
          dispatch and end-to-end fixtures, and repair the path while retaining clear
          rejection of unsupported inputs.
    - id: c01.2.2.3
      kind: capability
      parent_id: c01.2.2
      name: Encoding and Resolver Consistency
      outcome: Align identifier generation, decoding, type lookup, and object resolution
        around one round-trip contract.
      includes:
      - Type-and-identifier encoding
      - Decode validation and lookup keys
      - Public query or resolver execution
      excludes:
      - General text parsing
      - Cryptographic protocol design
      - Database schema migration
      prerequisites:
      - c01.1
      sample_tasks:
      - kind: entry
        instruction: Trace one generated identifier through its public resolver, add
          focused round-trip and public query tests, and correct the component that
          decodes to the wrong type key.
      - kind: representative
        instruction: Trace a global identifier from generation through decoding, type
          lookup, and polymorphic query resolution, add focused round trips for several
          types and identifiers plus executable public queries, and repair the shared
          contract.
    - id: c01.2.3.1
      kind: capability
      parent_id: c01
      name: Lifecycle Event Restoration
      outcome: Reconnect missing logs, signals, or callbacks to the correct processing
        stage without duplicating, reordering, or otherwise changing core work.
      includes:
      - Locating the lifecycle hook that owns an event
      - Preserving status, method, and resource context
      - Testing event level, multiplicity, and ordering
      excludes:
      - Configuration-controlled repository staging
      - Adding unrelated telemetry
      - Changing processing solely to manufacture a message
      prerequisites:
      - c01.1
      sample_tasks:
      - kind: entry
        instruction: Trace a successful public request through its lifecycle hooks,
          establish focused and workflow tests for the missing event, and restore
          one emission at the existing completion hook.
      - kind: representative
        instruction: Trace one request through redirect, response, retry, and failure
          stages, add focused hook tests and a public workflow test for contextual
          event order and multiplicity, and restore reporting without changing request
          handling.
    - id: c01.3.1.2
      kind: capability
      parent_id: c01
      name: Heterogeneous Operation APIs
      outcome: Design and implement a public API that normalizes multiple selection
        and operation forms into deterministic grouped results.
      includes:
      - Grouping keys and column selectors
      - String operations, callables, and named outputs
      - Deterministic result columns and shapes
      excludes:
      - A single bounded option
      - Compiler attributes and generated types
      - Distributed aggregation engines
      prerequisites:
      - c01.1
      sample_tasks:
      - kind: entry
        instruction: Trace an established grouped-operation API and its tests, then
          add one named aggregation over one explicitly selected column while preserving
          existing calls.
      - kind: representative
        instruction: Trace and test an established tabular API, then implement grouped
          summarization supporting individual columns, column lists, pattern selectors,
          named outputs, string operations, and callables with deterministic naming
          and result shape.
    - id: c01.3.1.1
      kind: capability
      parent_id: c01
      name: Declarative Code-Generation Extensions
      outcome: Add a bounded declarative attribute and propagate it through syntax
        parsing, precedence resolution, intermediate representation, and generated
        output.
      includes:
      - Field or item attribute parsing
      - Precedence between explicit and inferred values
      - Generated-output regression coverage
      excludes:
      - Ordinary runtime method parameters
      - Schema-backed runtime serialization
      - Open-ended operation APIs
      prerequisites:
      - c01.1
      sample_tasks:
      - kind: entry
        instruction: Trace one field attribute through parsing and generation, establish
          focused parser and generated-output tests, and add a literal rename override
          with documented precedence.
      - kind: representative
        instruction: Trace a field-level type override through a compiler plugin's
          attribute parser, optionality logic, intermediate representation, and target-language
          emitter, then implement it with focused expansion tests and a public generation
          test while preserving unannotated fields.
    - id: c01.3.2
      kind: capability
      parent_id: c01
      name: Schema-Driven Serialization Features
      outcome: Extend a schema and its generated artifacts so field metadata selects
        and executes the correct structured serialization behavior.
      includes:
      - Enum and field-property schema changes
      - Binding regeneration and metadata propagation
      - Routing values to structured text or JSON parsers
      excludes:
      - Repairing dispatch for an already-supported file format
      - Ad hoc parsing that bypasses schema metadata
      - Compiler attributes that affect only generated types
      prerequisites:
      - c01.1
      sample_tasks:
      - kind: entry
        instruction: Trace one field property from schema to runtime configuration
          and its tests, then add one enum value that selects an existing parser branch.
      - kind: representative
        instruction: Trace and test one field's metadata from schema declaration through
          generated bindings and configuration loading, then add default, structured-text,
          and JSON forms that route nested values through the corresponding serializers.
    - id: c01.3.3
      kind: capability
      parent_id: c01
      name: Asynchronous Coordination Protocols
      outcome: Implement asynchronous client adaptation and reusable lease-based ownership
        coordination with correct cancellation, renewal, loss, release, and callback
        behavior.
      includes:
      - Cancellable asynchronous client operations
      - Timed lease state transitions and retries
      - Ownership callbacks and clean shutdown
      excludes:
      - A single unrelated coroutine
      - Synchronous blocking in the event loop
      - Consensus algorithms beyond the specified lease protocol
      prerequisites:
      - c01.1
      sample_tasks:
      - kind: entry
        instruction: Trace an existing synchronous acquisition path and establish
          focused and public asynchronous tests, then expose one already-nonblocking
          client operation as a cancellable awaitable.
      - kind: representative
        instruction: Using one asynchronous lease client, implement cancellable acquisition
          and release, then build a leader component on that same lease that renews
          ownership, handles contention and loss, invokes transition callbacks once,
          and relinquishes ownership during shutdown.
    - id: c01.3.3.1
      kind: capability
      parent_id: c01.3.3
      name: Asynchronous Client Adaptation
      outcome: Adapt a stateful client operation to an awaitable interface without
        blocking the event loop or losing result, exception, timeout, and cancellation
        semantics.
      includes:
      - Awaitable acquisition and release operations
      - Cancellation-safe cleanup
      - Deterministic asynchronous tests
      excludes:
      - Lease renewal state machines
      - Leadership callbacks
      - Unrelated concurrent task orchestration
      prerequisites:
      - c01.1
      sample_tasks:
      - kind: entry
        instruction: Trace one existing client operation and establish focused and
          public asynchronous tests, then expose that already-nonblocking operation
          through one awaitable method.
      - kind: representative
        instruction: Trace and adapt a lock client's acquisition, timeout, result,
          exception, cancellation, and release paths into a nonblocking asynchronous
          interface with deterministic focused and public tests.
    - id: c01.3.3.2
      kind: capability
      parent_id: c01.3.3
      name: Lease-Based Ownership Protocols
      outcome: Build a reusable asynchronous ownership state machine on a cancellable
        client adapter, including acquisition, renewal, loss, release, callbacks,
        and shutdown.
      includes:
      - Timed acquisition and renewal loops
      - Contention, expiration, and ownership loss
      - Exactly-once transition callbacks
      excludes:
      - Implementing the underlying client adapter alone
      - General distributed consensus
      - Blocking coordination loops
      prerequisites:
      - c01.3.3.1
      sample_tasks:
      - kind: entry
        instruction: Implement the cancellable acquisition-and-release adapter for
          a lease client, then add one ownership transition that renews a held lease
          before expiry and releases it on cancellation.
      - kind: representative
        instruction: Implement the full cancellable lease adapter and use it in a
          leader component that handles contention, renewal, expiration, callback
          ordering, lease loss, and shutdown without retaining ownership after cancellation.
    - id: c01.3.4
      kind: capability
      parent_id: c01
      name: Multi-Module System Synthesis
      outcome: Implement a cohesive small system whose modules have explicit dependency
        direction, testable public interfaces, and coordinated stateful and filesystem
        behavior.
      includes:
      - Separating foundational operations, data processing, and orchestration
      - Transactional and filesystem operations
      - Deterministic traversal, aggregation, and side effects
      excludes:
      - Placing all logic in one script
      - Duplicating lower-layer logic in orchestration code
      - External dependencies when the specification forbids them
      prerequisites:
      - c01.6.2
      sample_tasks:
      - kind: entry
        instruction: Implement specified normalization, filtering, aggregation, and
          ordering functions, place them in a foundational module, and add one dependent
          module that imports and exposes their combined result.
      - kind: representative
        instruction: Implement a standard-library project with a transactional storage
          module, a depth-bounded file-analysis module that performs deterministic
          collection transformations, and an orchestration module that applies permissions
          and returns reports through explicit one-way imports.
    - id: c01.4
      kind: capability
      parent_id: c01
      name: Refactoring and Code Migration
      outcome: Change software structure or interfaces while preserving intended behavior
        and migrating every affected consumer and artifact.
      includes:
      - Extracting and moving implementations
      - Changing interfaces with coordinated consumer updates
      - Migrating schemas, generated code, documentation, tests, and exports
      excludes:
      - Leaving compatibility shims without a requirement
      - Unrelated behavioral feature work
      - Mechanical formatting without structural purpose
      prerequisites:
      - c01.1
      sample_tasks:
      - kind: entry
        instruction: Trace a duplicated private calculation and establish focused
          and public behavior tests, then extract it into one shared helper and update
          both callers.
      - kind: representative
        instruction: For one configuration-loading subsystem, trace its callers and
          establish focused and end-to-end behavior tests, then extract it behind
          a new module boundary, revise its typed interface, migrate every caller
          and generated artifact, remove the superseded path, and preserve the same
          public workflow.
    - id: c01.4.1
      kind: capability
      parent_id: c01.4
      name: Structure-Preserving Refactoring
      outcome: Improve function, module, or dependency structure while preserving
        externally observable behavior.
      includes:
      - Extracting cohesive functions and modules
      - Removing duplicated logic
      - Maintaining dependency direction and public exports
      excludes:
      - Intentional public behavior changes
      - Speculative compatibility paths
      - Large rewrites without equivalence evidence
      prerequisites:
      - c01.1
      sample_tasks:
      - kind: entry
        instruction: Trace two callers of a repeated calculation and establish focused
          and public behavior tests, then extract the calculation into one shared
          function.
      - kind: representative
        instruction: Trace a mixed filesystem workflow and establish focused and end-to-end
          behavior tests, then separate computation, persistence, and orchestration
          into acyclic modules, remove duplicate implementations, and preserve results
          and side effects.
    - id: c01.4.2
      kind: capability
      parent_id: c01.4
      name: Cross-Layer Interface Migration
      outcome: Migrate an intentional interface change consistently through declarations,
        implementations, generated artifacts, callers, tests, documentation, and exports.
      includes:
      - Signature and schema changes
      - Updating all consumers and generated bindings
      - Removing superseded names and paths
      excludes:
      - Backward-compatibility aliases without an explicit requirement
      - Partially migrated interfaces
      - Unrelated dependency upgrades
      prerequisites:
      - c01.1
      sample_tasks:
      - kind: entry
        instruction: Trace every caller of one public parameter and establish focused
          and public baseline tests, then rename the parameter and update all in-repository
          consumers without retaining the old name.
      - kind: representative
        instruction: Trace a public configuration field through schema, generated
          bindings, parsers, runtime consumers, exports, examples, and tests, establish
          behavioral baselines, then replace it with a typed representation and remove
          the superseded path.
    - id: c01.5.1
      kind: capability
      parent_id: c01
      name: Optional Dependency Boundaries
      outcome: Keep a package importable and accurately feature-gated when an optional
        library is present or absent.
      includes:
      - Separating annotation-time needs from runtime availability
      - Lazy or guarded imports at established feature boundaries
      - Behavior in installed and missing dependency states
      excludes:
      - Silently disabling required dependencies
      - Broad exception handling around arbitrary imports
      - Dependency version solving and lockfile maintenance
      prerequisites:
      - c01.1
      sample_tasks:
      - kind: entry
        instruction: Trace an optional library through package import and feature
          detection, establish focused and package-import tests for both availability
          states, and move one annotation so it no longer forces the optional import.
      - kind: representative
        instruction: Trace an optional rendering feature through package import, capability
          detection, annotated public APIs, and invocation, add focused and public
          tests with and without the extra, and repair the boundary so absence fails
          only when the feature is used.
    - id: c01.5.2
      kind: capability
      parent_id: c01
      name: Version-Control-Aware Application Behavior
      outcome: Make repository-manipulating application commands create, modify, and
        stage artifacts exactly as their configuration specifies while preserving
        unrelated index and working-tree state.
      includes:
      - Tracing configuration into mutation helpers
      - Separating artifact generation from staging
      - Tracked, untracked, enabled, disabled, and repeated runs
      excludes:
      - Interactive branching, merging, and rebasing
      - Manual cleanup of user changes
      - Build-system lockfile resolution
      prerequisites:
      - c01.1
      sample_tasks:
      - kind: entry
        instruction: Trace an automatic-staging setting through one generation command,
          establish focused and command-level repository tests, and guard the existing
          staging call so a generated file remains unstaged when the setting is disabled.
      - kind: representative
        instruction: Trace one reproduction command from configuration through manifest,
          lock, and metric generation to index updates, add focused and repository-level
          tests, and ensure enabled and disabled modes preserve unrelated staged entries
          across new, modified, and repeated runs.
    - id: c01.7
      kind: capability
      parent_id: c01
      name: Build, Packaging, and Dependency Management
      outcome: Produce reproducible installable artifacts whose build metadata, dependency
        constraints, resolved environments, and release contents agree.
      includes:
      - Build configuration and package metadata
      - Dependency constraints, resolution, and lockfiles
      - Wheel, archive, and release-artifact inspection
      excludes:
      - Runtime optional-import control flow
      - Application-controlled version-control staging
      - Local installation commands without repository metadata changes
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Add one missing package-data rule and build an archive that contains
          the documented resource.
      - kind: representative
        instruction: 'Prepare one library release that adds an optional compression
          feature: update its dependency constraint and platform marker, refresh the
          resolved lock, build its wheel and source archive, and confirm the artifacts
          expose the same metadata and installable contents.'
    - id: c01.7.1
      kind: capability
      parent_id: c01.7
      name: Build and Release Artifacts
      outcome: Configure and inspect package builds so distributable artifacts contain
        the intended code, resources, entry points, and metadata.
      includes:
      - Build-system configuration
      - Package discovery, data files, and entry points
      - Wheel and source-archive contents
      excludes:
      - Dependency-version solving
      - Runtime feature detection
      - Container or infrastructure deployment
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Add one resource directory to package metadata and build an archive
          containing it.
      - kind: representative
        instruction: Configure a multi-package command-line project so its wheel and
          source archive contain the intended modules, templates, license metadata,
          and executable entry point, with no development-only files.
    - id: c01.7.2
      kind: capability
      parent_id: c01.7
      name: Dependency Constraints and Lockfiles
      outcome: Express dependency requirements and produce a consistent resolved environment
        across supported features and platforms.
      includes:
      - Version ranges, extras, and environment markers
      - Dependency resolution and conflict diagnosis
      - Lockfile updates tied to declared requirements
      excludes:
      - Guarding optional imports at runtime
      - Vendoring unrelated source code
      - Updating a lockfile without changing or checking its declared inputs
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Add one platform marker to an existing dependency constraint
          and refresh the affected lock entry.
      - kind: representative
        instruction: Revise a library's core and optional dependency ranges to remove
          a resolution conflict across two supported interpreter versions, regenerate
          the lock, and keep unrelated resolved packages unchanged.
    - id: c01.8
      kind: capability
      parent_id: c01
      name: Version Control Operations
      outcome: Use branches, commits, merges, rebases, and history inspection to integrate
        changes while preserving intended content and a comprehensible repository
        history.
      includes:
      - Branch and commit construction
      - Merge and rebase conflict resolution
      - History inspection, selective application, and safe correction
      excludes:
      - Application code that conditionally stages generated files
      - Deleting local changes to obtain a clean state
      - Remote-service administration and access control
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Create a topic branch, commit one focused change, and update
          it with a non-conflicting change from the main branch.
      - kind: representative
        instruction: 'Integrate a three-commit topic branch after the main branch
          independently edits the same configuration and test files: inspect both
          histories, rebase or merge deliberately, resolve the semantic conflicts,
          preserve both intended behaviors, and leave a coherent final history without
          discarding unrelated work.'
- routing_facet: subject_domain
  curriculum:
    version: wave2-2
    subject_id: C06
    subject_name: Databases & Data Engineering
    sections:
    - id: c06.databases_data_engineering
      kind: capability
      parent_id: null
      name: Databases and Data Engineering
      outcome: Design, build, query, evolve, and recover data systems that turn heterogeneous
        inputs into reliable structured, relational, analytical, nonrelational, and
        graph data products.
      includes:
      - Selecting representations, storage models, transformations, and operational
        guarantees from access, integrity, scale, and recovery requirements.
      - Integrating schema-governed records, databases, pipelines, and distributed
        data systems.
      excludes:
      - Statistical modeling or machine-learning training after data preparation.
      - Application behavior whose central challenge is not data storage, transformation,
        retrieval, or reliability.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Turn a short list of customer facts into named, typed records
          suitable for storage.
      - kind: representative
        instruction: Design one marketplace data platform that validates incoming
          partner records, stores and queries transactional data, builds recoverable
          analytical pipelines, maintains document and graph views, and meets stated
          migration, backup, partition, and consistency requirements.
    - id: c06.structured_data
      kind: capability
      parent_id: c06.databases_data_engineering
      name: Schema-Governed Structured Data
      outcome: Interpret schemas, construct records from supplied or generated values,
        integrate heterogeneous documents, and serialize the resulting typed data
        correctly.
      includes:
      - Structural and value constraints, grounded extraction, permitted generation,
        and cross-document integration.
      - JSON, YAML, XML, and flattened CSV representations.
      excludes:
      - Designing persistent database schemas or indexes.
      - Scheduling recurring ingestion and transformation jobs.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Represent three stated attributes as a typed record with the
          requested field names.
      - kind: representative
        instruction: Using one regulatory filing and its tables, construct a schema-valid
          nested dataset, distinguish extracted from explicitly generated values,
          reconcile repeated entities, and serialize the same dataset as JSON, YAML,
          XML, and flattened CSV.
    - id: c06.schema_governed_records
      kind: capability
      parent_id: c06.structured_data
      name: Schema-Governed Record Construction
      outcome: Apply structural and scalar constraints while constructing valid records
        from supported facts or explicitly authorized generated values.
      includes:
      - Required and optional fields, types, enums, bounds, patterns, nullability,
        arrays, and nested objects.
      - Separating source-grounded extraction from value generation.
      excludes:
      - Format-specific escaping and markup syntax.
      - Relational table and index design.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Read a small object schema and determine which candidate record
          satisfies its required fields, types, and allowed values.
      - kind: representative
        instruction: For one nested permit schema and partially specified application,
          audit every constraint, map all supported facts, and generate only the missing
          values the request explicitly authorizes.
    - id: c06.schema_constraints
      kind: capability
      parent_id: c06.schema_governed_records
      name: Schema Constraint Interpretation
      outcome: Determine whether record shapes and values satisfy explicit structural,
        scalar, and collection constraints.
      includes:
      - Required properties, additional-property rules, nested cardinality, arrays,
        and nullable fields.
      - Type, enum, range, pattern, and date-time constraints.
      excludes:
      - Inferring facts from narrative documents.
      - Choosing storage schemas or engines.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: For a schema with one required integer and one optional string,
          identify which candidate records have permitted shapes and types.
      - kind: representative
        instruction: Audit a nested record against required-field, additional-property,
          type, enum, numeric-bound, pattern, date-time, array-cardinality, and nullability
          constraints, reporting every violation.
    - id: c06.grounded_record_mapping
      kind: capability
      parent_id: c06.schema_governed_records
      name: Grounded Record Mapping
      outcome: Map explicitly supported facts from prose or simple tables into the
        correct fields of a constrained schema without inventing unsupported values.
      includes:
      - Entity, quantity, date, status, classification, and contact-field extraction.
      - Type conversion and schema-permitted omission or null handling.
      excludes:
      - Creating plausible values when generation is requested.
      - Reconciling many heterogeneous sections and tables.
      prerequisites:
      - c06.schema_constraints
      sample_tasks:
      - kind: entry
        instruction: Fully audit a nested candidate record against its supplied structural,
          scalar, array, and nullability constraints, then add one explicitly stated
          population value to the correct typed field.
      - kind: representative
        instruction: Audit a property schema and map a narrative listing into its
          nested location, numeric, status, amenity, financing, and contact fields
          while retaining only supported facts and satisfying every constraint.
    - id: c06.schema_instance_generation
      kind: capability
      parent_id: c06.schema_governed_records
      name: Schema-Constrained Instance Generation
      outcome: Create plausible, internally coherent records that satisfy a supplied
        schema when values are not source-bound.
      includes:
      - Generating compatible scalar, array, object, and nullable values.
      - Maintaining cross-field plausibility while obeying strict constraints.
      excludes:
      - Presenting generated values as source-extracted facts.
      - Designing or modifying the supplied schema.
      prerequisites:
      - c06.schema_constraints
      sample_tasks:
      - kind: entry
        instruction: Fully audit a nearly complete object against its nested types,
          enums, bounds, arrays, and nullability rules, then generate one missing
          bounded integer that keeps the object valid.
      - kind: representative
        instruction: Generate a plausible highway record with constrained endpoints,
          junction arrays, concurrency sections, enums, nullable values, numeric bounds,
          and no undeclared properties after validating every applicable schema rule.
    - id: c06.format_serialization
      kind: capability
      parent_id: c06.structured_data
      name: Structured Format Serialization
      outcome: Serialize equivalent typed data accurately in hierarchical and tabular
        formats while preserving or explicitly reshaping its logical structure.
      includes:
      - Objects, arrays, scalars, nulls, repeated entities, special characters, and
        escaping.
      - Explicit flattening policies when a tabular format cannot preserve hierarchy
        directly.
      excludes:
      - Extracting unstated source facts.
      - Database import, transaction, or query execution.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Serialize a two-field typed record as valid JSON.
      - kind: representative
        instruction: Serialize one nested shipment dataset as JSON, YAML, and XML,
          then produce a parseable CSV projection of that same dataset using a stated
          flattening policy.
    - id: c06.json_serialization
      kind: capability
      parent_id: c06.format_serialization
      name: JSON Serialization
      outcome: Represent nested typed records as syntactically correct JSON without
        changing their logical structure or scalar types.
      includes:
      - Objects, arrays, strings, numbers, booleans, nulls, and JSON escaping.
      - Preserving required names and nesting.
      excludes:
      - YAML indentation and scalar-resolution rules.
      - XML elements, attributes, and CSV flattening.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Serialize a record containing a string and integer as valid JSON.
      - kind: representative
        instruction: Produce strict JSON for a deeply nested route record containing
          endpoint objects, junction arrays, escaped text, booleans, numbers, and
          null values without adding undeclared fields.
    - id: c06.yaml_serialization
      kind: capability
      parent_id: c06.format_serialization
      name: YAML Serialization
      outcome: Represent nested typed records as unambiguous, parseable YAML with
        correct indentation, sequence structure, quoting, and scalar forms.
      includes:
      - Mappings, sequences, block and flow scalars, nulls, booleans, quoting, and
        indentation.
      - Quoting values whose plain forms would resolve to unintended types.
      excludes:
      - JSON-specific punctuation requirements.
      - XML markup and CSV flattening.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Serialize a record containing a name and two-item list as correctly
          indented YAML.
      - kind: representative
        instruction: Produce YAML for a nested deployment record containing multiline
          text, date-like strings, ambiguous boolean-like strings, arrays of objects,
          nulls, and punctuation while preserving every intended scalar type.
    - id: c06.xml_serialization
      kind: capability
      parent_id: c06.format_serialization
      name: XML Serialization
      outcome: Represent nested records and repeated entities as one well-formed XML
        document with the requested element and attribute structure.
      includes:
      - Single-root documents, elements, requested attributes, repeated records, namespaces
        when supplied, and escaping.
      - Mapping object and array structures into valid XML nesting.
      excludes:
      - DTD or XML Schema design unless requested.
      - HTML presentation markup.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Serialize a name and publication date beneath one XML root element.
      - kind: representative
        instruction: Create one well-formed XML report containing authors, funding
          records, nested metrics, repeated components, assessments, attributes requested
          by the structure, and correctly escaped text.
    - id: c06.csv_reshaping
      kind: capability
      parent_id: c06.format_serialization
      name: CSV Flattening and Escaping
      outcome: Convert structured records into parseable CSV using an explicit, consistent
        policy for nested and repeated values.
      includes:
      - Headers, rows, delimiter quoting, embedded quotes, line breaks, and null representation.
      - Stable flattening or cell-serialization conventions for arrays and nested
        values.
      excludes:
      - Relational normalization into persistent tables.
      - Spreadsheet formulas, styling, or charts.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Write a CSV header and one row whose text field contains a comma
          and quotation marks.
      - kind: representative
        instruction: Flatten a nested chapter record containing arrays, booleans,
          punctuation-rich text, a multiline field, and repeated footnotes into parseable
          CSV with stable columns and a documented cell convention.
    - id: c06.complex_document_integration
      kind: capability
      parent_id: c06.structured_data
      name: Complex Document Integration
      outcome: Reconcile related facts from multiple prose sections and heterogeneous
        tables into a coherent nested collection of typed records.
      includes:
      - Entity resolution across sections and tables.
      - Preserving relationships among summary objects and repeated detail records.
      excludes:
      - Joining already loaded database tables with SQL.
      - Adding facts unsupported by the supplied material.
      prerequisites:
      - c06.grounded_record_mapping
      sample_tasks:
      - kind: entry
        instruction: Map every supported fact from a short prose summary into a constrained
          parent record, then reconcile one matching row from a supplied table into
          a new child array.
      - kind: representative
        instruction: Map and validate a season overview, then reconcile its staff,
          rankings, standings, recruiting, and schedule tables into one nested dataset
          with consistent team identities and correctly typed values.
    - id: c06.relational_databases
      kind: capability
      parent_id: c06.databases_data_engineering
      name: Relational Databases
      outcome: Design, query, tune, modify, diagnose, migrate, and recover relational
        databases while preserving declared invariants.
      includes:
      - SQL retrieval, logical and physical design, execution plans, transactions,
        connectivity, migrations, and backup recovery.
      - Reasoning about constraints, indexes, generated statements, concurrency, and
        operational changes.
      excludes:
      - Document-store or graph-native modeling.
      - End-to-end orchestration of multi-system data pipelines.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Define a table with a primary key and retrieve rows matching
          one condition.
      - kind: representative
        instruction: For one subscription service, design and index its relational
          schema, answer a multistage SQL question, diagnose a slow plan and captured
          constraint failure, implement safe concurrent changes, and plan a reversible
          schema deployment with verified backup restoration.
    - id: c06.sql_querying
      kind: capability
      parent_id: c06.relational_databases
      name: SQL Querying
      outcome: Write SQL that filters, relates, summarizes, composes, ranks, and recursively
        traverses relational data with correct row, null, duplicate, and grouping
        semantics.
      includes:
      - Single-table expressions, joins, grouped aggregation, subqueries, CTEs, set
        operations, windows, and recursive CTEs.
      - Deterministic ordering and deliberate duplicate handling.
      excludes:
      - DDL schema and index design.
      - Transaction boundaries and write-conflict handling.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Select two columns from one table, filter by status, and order
          by timestamp.
      - kind: representative
        instruction: Using one account hierarchy and its current and archived orders,
          write one query that recursively finds descendants, unions both order sources,
          joins payments, aggregates account totals, computes regional ranks and running
          totals, filters through a CTE, and returns deterministic results with stated
          null and duplicate behavior.
    - id: c06.single_table_queries
      kind: capability
      parent_id: c06.sql_querying
      name: Single-Table SQL Queries
      outcome: Retrieve and reshape rows from one table using precise projection,
        filtering, expression, null, distinctness, and ordering rules.
      includes:
      - SELECT expressions, aliases, predicates, sorting, limits, and scalar calculations.
      - Explicit null and duplicate handling.
      excludes:
      - Joins, grouped summaries, and recursive traversal.
      - Inserts, updates, and deletes.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Select the name column from active rows in one table.
      - kind: representative
        instruction: Return the latest twenty eligible products with computed discounted
          prices, explicit null handling, deduplication, and deterministic ordering.
    - id: c06.join_queries
      kind: capability
      parent_id: c06.sql_querying
      name: Relational Join Queries
      outcome: Combine related tables without unintended row loss, multiplication,
        or ambiguous matching.
      includes:
      - Inner, outer, semi, anti, and self joins.
      - Join cardinality, null-extension, and fan-out control.
      excludes:
      - Grouped aggregation as the central operation.
      - Physical join-algorithm or index tuning.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Join orders to customers by customer identifier and return one
          field from each table.
      - kind: representative
        instruction: Join customers, orders, optional payments, and product assignments
          while retaining unmatched customers, preventing assignment fan-out, and
          returning exactly one correctly matched row per order.
    - id: c06.grouped_aggregation
      kind: capability
      parent_id: c06.sql_querying
      name: Grouped SQL Aggregation
      outcome: Compute grouped summaries with correct null, duplicate, conditional,
        and group-filtering semantics.
      includes:
      - GROUP BY, aggregate functions, conditional measures, distinct aggregates,
        and HAVING.
      - Choosing denominators and counting null-bearing rows deliberately.
      excludes:
      - Joining multiple relations as the central challenge.
      - Windowed row-relative calculations.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Count rows in each status group of one table.
      - kind: representative
        instruction: From one transaction table, calculate per-region null-aware order
          counts, distinct-customer counts, conditional revenue, and average completed-order
          value, retaining only groups that meet a stated HAVING rule.
    - id: c06.query_composition
      kind: capability
      parent_id: c06.sql_querying
      name: Compositional SQL and Set Operations
      outcome: Structure multistage relational logic with subqueries, nonrecursive
        CTEs, and set operations while preserving intended duplicate semantics.
      includes:
      - Correlated and uncorrelated subqueries, reusable CTE stages, UNION, UNION
        ALL, INTERSECT, and EXCEPT.
      - Making stage boundaries and deduplication auditable.
      excludes:
      - Recursive hierarchy traversal.
      - Window functions as the central operation.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Use a subquery to retain products priced above the table's average
          price.
      - kind: representative
        instruction: Combine current and archived eligibility records with the appropriate
          set operators, exclude blocked accounts through a correlated predicate,
          and organize the remaining business rules into named CTE stages.
    - id: c06.window_analytics
      kind: capability
      parent_id: c06.sql_querying
      name: SQL Window Analytics
      outcome: Express row-relative analysis with partitioned ranking, navigation,
        framing, and running calculations without collapsing detail rows.
      includes:
      - ROW_NUMBER, rank variants, lag, lead, running totals, moving windows, and
        frame specifications.
      - Tie behavior and partition boundaries.
      excludes:
      - Recursive traversal.
      - Grouped aggregation when detail rows need not be retained.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Add a row number ordered by sale time within each customer.
      - kind: representative
        instruction: For each account and month, retain monthly detail while calculating
          running revenue, prior-month change, a three-month moving average, and tied
          regional rank with explicit window frames.
    - id: c06.recursive_queries
      kind: capability
      parent_id: c06.sql_querying
      name: Recursive Relational Queries
      outcome: Use recursive SQL to traverse hierarchical or graph-like relational
        structures with explicit anchors, termination, depth, cycle, and path semantics.
      includes:
      - Recursive CTE anchors and steps, hierarchy expansion, path accumulation, and
        cycle prevention.
      - Depth limits and deterministic traversal results.
      excludes:
      - Nonrecursive CTEs used only for readability.
      - Graph-native query languages.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Use a recursive CTE to return one category and all of its descendants
          to a fixed maximum depth.
      - kind: representative
        instruction: Traverse an employee reporting hierarchy from a supplied manager,
          retain depth and path evidence, detect malformed cycles, stop at a stated
          bound, and return deterministic ancestor-to-descendant results.
    - id: c06.relational_schema_design
      kind: capability
      parent_id: c06.relational_databases
      name: Relational Schema and Access Design
      outcome: Translate integrity and workload requirements into logical tables,
        indexes, and evidence-based query-performance improvements.
      includes:
      - Entities, relationships, keys, constraints, normalization, indexes, statistics,
        and execution plans.
      - Balancing integrity, read paths, and write costs.
      excludes:
      - Nonrelational aggregate or graph models.
      - Pipeline scheduling and operational alerting.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Separate repeated customer details from orders and link the tables
          with a key.
      - kind: representative
        instruction: For one subscription-billing workload, design normalized tables
          and constraints, choose a minimal index set, then inspect a supplied slow
          execution plan and revise the query or access paths without weakening integrity.
    - id: c06.logical_schema_design
      kind: capability
      parent_id: c06.relational_schema_design
      name: Logical Schema and Database Constraints
      outcome: Model entities and relationships as normalized tables with suitable
        types, keys, and database-enforced invariants.
      includes:
      - Primary, foreign, unique, check, and nullability constraints.
      - Resolving repeating groups and update anomalies through normalization.
      excludes:
      - Pipeline acceptance gates and quarantine rules.
      - Diagnosis of a particular observed runtime violation.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Choose a primary key and add a foreign key between two simple
          tables.
      - kind: representative
        instruction: Model products, suppliers, warehouses, inventory lots, and temporal
          supplier prices as normalized tables with cardinalities and database constraints
          that prevent invalid states.
    - id: c06.physical_index_design
      kind: capability
      parent_id: c06.relational_schema_design
      name: Index and Access-Path Design
      outcome: Choose relational indexes from concrete query, write, selectivity,
        and ordering requirements.
      includes:
      - Composite key order, covering, unique, and filtered indexes.
      - Write amplification and the access paths served by each index.
      excludes:
      - Diagnosing an observed execution-plan regression.
      - Changing logical facts solely to imitate an index.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Choose an index for equality lookup on a foreign key in a supplied
          schema.
      - kind: representative
        instruction: Given a schema, query patterns, column selectivities, and write
          rates, propose a minimal index set and explain the predicates, joins, orderings,
          and coverage each index serves.
    - id: c06.query_performance_diagnosis
      kind: capability
      parent_id: c06.relational_schema_design
      name: Query Plan and Performance Diagnosis
      outcome: Interpret execution evidence to identify cardinality, access, join,
        memory, or statistics problems and select a justified query or database change.
      includes:
      - Estimated versus actual rows, scans, seeks, join algorithms, sorts, spills,
        statistics, and parameter sensitivity.
      - Comparing plans and runtimes before and after a change.
      excludes:
      - Index selection without an observed query or plan symptom.
      - Infrastructure tuning unrelated to database execution.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Identify the plan operator responsible for a full-table scan
          and compare its estimated and actual row counts.
      - kind: representative
        instruction: Diagnose a regressed reporting query from its SQL, actual plan,
          statistics age, parameter values, cardinality estimates, join choices, and
          spill evidence, then propose and evaluate the smallest justified rewrite,
          statistics, or index change.
    - id: c06.reliable_data_changes
      kind: capability
      parent_id: c06.relational_databases
      name: Reliable Relational Data Changes
      outcome: Apply multi-record changes atomically while preserving database invariants
        under failures, retries, and concurrency.
      includes:
      - Transactional mutations, idempotent requests, isolation, locking, optimistic
        versions, deadlocks, and retry boundaries.
      - Reasoning about rollback and invariant-preserving interleavings.
      excludes:
      - Read-only analytical querying.
      - Cross-system workflow compensation.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Place two dependent updates in one transaction so either both
          persist or neither does.
      - kind: representative
        instruction: Implement one inventory-reservation and payment-recording operation
          whose atomic writes, request deduplication, concurrent interleavings, deadlock
          handling, and retries preserve stock and payment invariants.
    - id: c06.transactional_mutation
      kind: capability
      parent_id: c06.reliable_data_changes
      name: Transactional Mutation
      outcome: Implement constraint-preserving multi-record mutations with atomic
        commit, rollback, affected-row checks, and idempotent request behavior.
      includes:
      - Ordered inserts, updates, deletes, and upserts within a transaction.
      - Rollback on failed preconditions and durable request keys.
      excludes:
      - Anomalies caused by competing transactions.
      - Cross-database atomicity.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Insert an invoice and its first line item in one transaction.
      - kind: representative
        instruction: Apply a batch of account transfers using guarded mutations, a
          durable request key, rollback on any invalid balance, and a result that
          distinguishes replay from a new transfer.
    - id: c06.concurrency_control
      kind: capability
      parent_id: c06.reliable_data_changes
      name: Concurrency and Isolation
      outcome: Choose and implement concurrency controls that prevent specified anomalies
        while allowing acceptable parallelism.
      includes:
      - Isolation levels, locks, optimistic versions, serialization failures, deadlocks,
        and retries.
      - Constructing interleavings that demonstrate or rule out anomalies.
      excludes:
      - General distributed consensus across independent databases.
      - Performance tuning unrelated to concurrent correctness.
      prerequisites:
      - c06.transactional_mutation
      sample_tasks:
      - kind: entry
        instruction: Implement an atomic, rollback-safe, idempotent inventory reservation
          transaction, then add one optimistic version predicate so a concurrent stale
          writer is detected.
      - kind: representative
        instruction: Implement transactional reservation and cancellation mutations,
          analyze their lost-update, write-skew, and deadlock interleavings, and select
          isolation, locking, versioning, and retry rules that preserve every stated
          invariant.
    - id: c06.database_operations
      kind: capability
      parent_id: c06.relational_databases
      name: Database Connectivity and Incident Diagnosis
      outcome: Establish database connectivity, capture executed commands, and trace
        observed integrity failures through application, schema, and concurrent behavior.
      includes:
      - Driver configuration, network and authentication checks, SQL logging, parameters,
        transactions, triggers, and constraint metadata.
      - Evidence-based isolation of the failing database operation.
      excludes:
      - Query optimization without an execution symptom.
      - Generic application debugging unrelated to database interaction.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Identify the endpoint, database, authentication, and driver fields
          needed for a connection.
      - kind: representative
        instruction: For one application incident, configure access to its custom
          database endpoint, capture the generated parameterized commands and transaction
          context, and diagnose the observed unique-constraint failure using runtime
          schema, trigger, mapping, and concurrency evidence.
    - id: c06.connection_configuration
      kind: capability
      parent_id: c06.database_operations
      name: Driver and Connection Configuration
      outcome: Construct and troubleshoot database connection settings for a selected
        client, driver, endpoint, encryption mode, and authentication method.
      includes:
      - Provider syntax, host, port, instance, database, encryption, and credential
        mechanisms.
      - Separating client-format errors from DNS, routing, firewall, listener, and
        authentication failures.
      excludes:
      - SQL correctness after connection succeeds.
      - Embedding secrets in examples or source code.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Add a nondefault port to a database connection setting using
          the selected driver's syntax.
      - kind: representative
        instruction: Configure a legacy application to connect through an installed
          driver to a remote database on a nonstandard port, then order checks that
          distinguish provider, DNS, routing, firewall, listener, encryption, and
          authentication failures.
    - id: c06.statement_observability
      kind: capability
      parent_id: c06.database_operations
      name: Executed-Statement Observability
      outcome: Capture database command text, bound parameters, timing, transaction
        context, correlation identity, and outcome without exposing sensitive values.
      includes:
      - Client logging, server tracing, query history, and operation correlation.
      - Distinguishing generated commands from pending in-memory changes.
      excludes:
      - Inferring commands from object state when direct capture is available.
      - Full application observability outside database calls.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Enable command logging for one database context and capture a
          parameterized statement with its duration and outcome.
      - kind: representative
        instruction: Design a diagnostic capture that correlates application operations
          with executed SQL, redacted parameters, transaction boundaries, durations,
          affected rows, and server errors across client and server evidence.
    - id: c06.integrity_failure_diagnosis
      kind: capability
      parent_id: c06.database_operations
      name: Integrity Failure Diagnosis
      outcome: Explain an observed database constraint failure by tracing the executed
        change through runtime schema objects, implicit behavior, and concurrency.
      includes:
      - Unique, foreign-key, check, and null violations caused by direct statements,
        triggers, computed values, stale mappings, or races.
      - Comparing runtime metadata with application assumptions.
      excludes:
      - Defining pipeline quality gates.
      - Designing database constraints without an observed failure.
      prerequisites:
      - c06.statement_observability
      sample_tasks:
      - kind: entry
        instruction: Configure a complete capture of SQL text, parameters, timing,
          transaction context, correlation identity, and outcome for one failing insert,
          then identify the named constraint and conflicting key.
      - kind: representative
        instruction: Capture and correlate a failing update, then diagnose its intermittent
          duplicate-key error by examining parameters, runtime index definitions,
          triggers, computed columns, identity mapping, transaction behavior, and
          concurrent changes.
    - id: c06.database_lifecycle
      kind: capability
      parent_id: c06.relational_databases
      name: Database Change and Recovery Lifecycle
      outcome: Evolve database schemas safely and prove that database state can be
        restored to declared recovery objectives.
      includes:
      - Compatible migrations, data backfills, cutovers, rollback or roll-forward
        decisions, backups, restores, and recovery validation.
      - Coordinating application versions with database state.
      excludes:
      - Source-feed contract evolution outside the database.
      - Routine query and transaction implementation.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Add a nullable column in a migration and state how the old application
          version remains usable.
      - kind: representative
        instruction: Plan one zero-downtime billing-schema release with expand-and-contract
          changes, resumable backfill, application cutover, pre-change backup, point-in-time
          restore drill, recovery objectives, and evidence for rollback or roll-forward.
    - id: c06.schema_migrations
      kind: capability
      parent_id: c06.database_lifecycle
      name: Relational Schema Migrations
      outcome: Plan and execute compatible, observable schema and data migrations
        across concurrently deployed application versions.
      includes:
      - Expand-and-contract changes, online DDL, resumable backfills, validation,
        cutover, and rollback or roll-forward.
      - Managing locks, defaults, and mixed-version compatibility.
      excludes:
      - Backup-media selection and restore drills.
      - External event-schema compatibility.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Split adding a required field into a compatible nullable-add
          and later enforcement step.
      - kind: representative
        instruction: Migrate a large orders table to a new customer key using online
          schema changes, chunked resumable backfill, dual-compatible application
          releases, validation, cutover, and explicit rollback or roll-forward criteria.
    - id: c06.backup_restore_recovery
      kind: capability
      parent_id: c06.database_lifecycle
      name: Backup, Restore, and Database Recovery
      outcome: Design and validate backup and restoration procedures that meet stated
        data-loss and recovery-time objectives.
      includes:
      - Full and incremental backups, logs, point-in-time recovery, retention, encryption,
        restore ordering, and integrity checks.
      - Recovery drills and failover-versus-restore decisions.
      excludes:
      - Pipeline task replay.
      - Schema compatibility during application deployment.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Choose a backup interval that can meet a stated maximum data-loss
          objective.
      - kind: representative
        instruction: Design backups and transaction-log retention for a critical database,
          restore it to a requested pre-incident point, validate consistency and application
          readiness, and demonstrate that the measured recovery meets its RPO and
          RTO.
    - id: c06.data_pipelines
      kind: capability
      parent_id: c06.databases_data_engineering
      name: ETL and Data Pipelines
      outcome: Build repeatable pipelines that ingest changing sources, standardize
        and validate records, orchestrate recoverable execution, and deliver trustworthy
        analytical models.
      includes:
      - Batch and incremental ingestion, cleaning, linkage, quality gates, orchestration,
        monitoring, recovery, warehouse loading, and contract evolution.
      - Operational guarantees across repeated and partial executions.
      excludes:
      - One-off format conversion with no persistent flow.
      - Model training or downstream business interpretation.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Define an extract, transform, and load sequence for one small
          source file and destination table.
      - kind: representative
        instruction: Build one customer-order pipeline that combines an initial file
          snapshot with changes, standardizes and links records, enforces quality
          gates, evolves a source contract compatibly, loads an analytical model idempotently,
          and monitors and recovers partial runs.
    - id: c06.data_ingestion
      kind: capability
      parent_id: c06.data_pipelines
      name: Data Ingestion
      outcome: Acquire bounded and changing source data while preserving provenance,
        identity, ordering, completeness, checkpoints, and replayability.
      includes:
      - Files, snapshots, APIs, change streams, source metadata, and ingestion boundaries.
      - Duplicates, late arrivals, malformed input, and incomplete delivery.
      excludes:
      - Business-rule transformation after acquisition.
      - Dashboard refresh and presentation.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Read one delimited file and attach its source name and ingestion
          time to each record.
      - kind: representative
        instruction: For one source system, ingest a complete partitioned snapshot
          and hand off to ordered change capture using manifests, provenance, duplicate
          detection, tombstones, atomic checkpoints, late-change handling, and safe
          replay.
    - id: c06.batch_ingestion
      kind: capability
      parent_id: c06.data_ingestion
      name: Batch Ingestion
      outcome: Load bounded files or snapshots completely and repeatably while retaining
        provenance and isolating malformed or duplicate input.
      includes:
      - File discovery, partition selection, parsing, manifests, source metadata,
        and completeness checks.
      - Atomic publication or quarantine of a bounded load.
      excludes:
      - Continuous change streams and offsets.
      - Downstream business transformations.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Load one CSV file into typed records and retain its filename
          on each record.
      - kind: representative
        instruction: Ingest a date-partitioned delivery of compressed files using
          a manifest, reject malformed rows, detect duplicate files and records, verify
          completeness, and publish the bounded batch atomically.
    - id: c06.incremental_ingestion
      kind: capability
      parent_id: c06.data_ingestion
      name: Incremental and Change-Data Ingestion
      outcome: Capture new, changed, and deleted records incrementally with correct
        ordering, checkpoints, snapshot handoff, and replay semantics.
      includes:
      - High-water marks, log positions, change-data capture, tombstones, late changes,
        and atomic checkpointing.
      - Restarting without gaps or unintended duplication.
      excludes:
      - Bounded file completeness and manifest validation.
      - Applying business aggregations to captured changes.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Fetch records newer than a stored high-water mark and advance
          that mark only after successful persistence.
      - kind: representative
        instruction: Design a snapshot-to-change-stream handoff that applies inserts,
          updates, and deletes in order, persists offsets atomically with output,
          handles late events, and replays safely after consumer failure.
    - id: c06.transformation_quality
      kind: capability
      parent_id: c06.data_pipelines
      name: Transformation and Data Quality
      outcome: Canonicalize heterogeneous values, resolve duplicate entities, and
        enforce measurable pipeline acceptance rules without hiding rejected or altered
        data.
      includes:
      - Value standardization, record linkage, survivorship, validation, quarantine,
        reconciliation, and provenance.
      - Separating repairs from quality observations.
      excludes:
      - Source transport and checkpoint management.
      - Database-enforced constraints for transactional invariants.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Normalize two date formats into one typed date field and flag
          unparseable values.
      - kind: representative
        instruction: Using one set of customer feeds, canonicalize names, addresses,
          dates, and units, link duplicate people with explicit evidence and survivorship
          rules, then apply field, relational, and aggregate acceptance gates with
          quarantine and reconciliation.
    - id: c06.data_cleaning
      kind: capability
      parent_id: c06.transformation_quality
      name: Value Cleaning and Standardization
      outcome: Convert inconsistent field values into canonical typed representations
        using explicit, auditable transformation rules.
      includes:
      - Parsing, casing, whitespace, dates, units, categories, and missing-value policies.
      - Retaining original values and transformation provenance.
      excludes:
      - Cross-record identity resolution and survivorship.
      - Aggregate acceptance gates and reconciliation.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Trim whitespace and normalize two textual date forms into one
          date type.
      - kind: representative
        instruction: Standardize a product feed's names, identifiers, dates, decimal
          formats, currencies, units, categories, and missing-value markers while
          retaining original values and rule-level provenance.
    - id: c06.record_linkage
      kind: capability
      parent_id: c06.transformation_quality
      name: Record Linkage and Survivorship
      outcome: Identify records that refer to the same entity and construct a defensible
        surviving record from conflicting sources.
      includes:
      - Deterministic and fuzzy matching, blocking, match evidence, thresholds, clerical
        review, and survivorship.
      - Avoiding false merges and preserving lineage.
      excludes:
      - Within-field syntax standardization as the central operation.
      - Pipeline-wide completeness or reconciliation gates.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Link two customer rows that share a normalized email address
          and retain both source identifiers.
      - kind: representative
        instruction: Resolve overlapping customer feeds using blocking, exact and
          fuzzy evidence, explicit match thresholds, no-match and review outcomes,
          conflict-aware survivorship, and lineage to every contributing record.
    - id: c06.data_quality_controls
      kind: capability
      parent_id: c06.transformation_quality
      name: Pipeline Data Quality Controls
      outcome: Define and apply field, record, relational, and aggregate checks that
        make unacceptable pipeline data observable and actionable.
      includes:
      - Validity, completeness, uniqueness, reference checks, anomaly thresholds,
        quarantine, and reconciliation.
      - Quality metrics and acceptance gates for data products.
      excludes:
      - Database DDL constraints that protect transactional writes.
      - Diagnosis of a particular runtime database exception.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Add a required-field and allowed-range gate to supplied records
          and route failures to quarantine.
      - kind: representative
        instruction: Create an order-load acceptance gate that checks schema validity,
          batch uniqueness, customer references, temporal consistency, amount reconciliation,
          anomaly thresholds, and accepted-versus-rejected counts.
    - id: c06.pipeline_orchestration
      kind: capability
      parent_id: c06.data_pipelines
      name: Pipeline Orchestration and Recovery
      outcome: Coordinate dependent pipeline stages so partitioned, repeated, and
        failed executions are scheduled, idempotent, observable, and recoverable.
      includes:
      - Dependencies, partitions, backfills, retries, stable keys, publication boundaries,
        metrics, alerts, and lineage-aware recovery.
      - Distinguishing task success from complete data-product readiness.
      excludes:
      - Field-specific transformation rules.
      - Database isolation inside one application transaction.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Run a load task only after its extraction task succeeds.
      - kind: representative
        instruction: For one partitioned daily pipeline, define dependency and backfill
          scheduling, idempotent publication, freshness and volume monitoring, and
          a lineage-scoped recovery from a partial upstream failure.
    - id: c06.dependency_scheduling
      kind: capability
      parent_id: c06.pipeline_orchestration
      name: Dependency and Partition Scheduling
      outcome: Express pipeline dependencies, schedules, readiness conditions, partition
        mappings, concurrency limits, and backfills.
      includes:
      - Directed acyclic task graphs, calendars, partition keys, readiness checks,
        and bounded parallelism.
      - Planning backfills across dependent partitions.
      excludes:
      - Duplicate-effect prevention during retries.
      - Failure diagnosis and recovery choice.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Define a three-stage dependency order for extract, transform,
          and load tasks.
      - kind: representative
        instruction: Schedule hourly events and daily reference data into regional
          daily outputs with readiness conditions, partition mappings, concurrency
          limits, and a dependency-correct backfill for a missed week.
    - id: c06.idempotent_execution
      kind: capability
      parent_id: c06.pipeline_orchestration
      name: Idempotent Pipeline Execution
      outcome: Make repeated or resumed pipeline executions converge on the same target
        state without duplicate or conflicting effects.
      includes:
      - Stable run and record keys, staging, atomic replacement, merge semantics,
        and safe publication boundaries.
      - Handling partial output from prior attempts.
      excludes:
      - Business deduplication of genuinely distinct records.
      - Scheduling and alert threshold selection.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Add a stable source-record key so rerunning a load does not append
          duplicate target rows.
      - kind: representative
        instruction: Design a partition load that stages output, merges by stable
          keys, publishes atomically, records completion state, and converges correctly
          after failures before, during, and after publication.
    - id: c06.pipeline_monitoring
      kind: capability
      parent_id: c06.pipeline_orchestration
      name: Pipeline Monitoring and Alerting
      outcome: Measure data-pipeline health and delivery so failures and degradations
        are detected with actionable context.
      includes:
      - Freshness, volume, latency, error, and quality signals; structured logs; dashboards;
        and alerts.
      - Run, task, partition, and data-product readiness states.
      excludes:
      - Choosing replay, rollback, or recomputation procedures.
      - Infrastructure monitoring unrelated to data delivery.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Add a freshness metric and threshold alert to a daily load.
      - kind: representative
        instruction: Define metrics, structured events, readiness states, dashboards,
          and deduplicated alerts for a partitioned pipeline whose failures may affect
          freshness, volume, latency, quality, or publication completeness.
    - id: c06.pipeline_recovery
      kind: capability
      parent_id: c06.pipeline_orchestration
      name: Pipeline Failure Recovery
      outcome: Diagnose failed or partial pipeline execution and restore the affected
        data scope without corrupting completed work.
      includes:
      - Lineage-aware impact analysis, safe retry boundaries, replay, rollback, and
        selective recomputation.
      - Post-recovery validation and incident scope.
      excludes:
      - Routine metric and alert design.
      - Blindly restarting jobs without locating the safe recovery boundary.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given one failed partition and a staging-only partial output,
          choose the safe partition retry boundary.
      - kind: representative
        instruction: Diagnose a partial publication after an upstream partition failure,
          trace affected downstream products through lineage, choose among retry,
          replay, rollback, and selective recomputation, and specify validation before
          republishing.
    - id: c06.analytical_delivery
      kind: capability
      parent_id: c06.data_pipelines
      name: Analytical Modeling and Loading
      outcome: Shape transformed data into analytical models and load them while preserving
        grain, keys, history, late data, and reconciliation.
      includes:
      - Facts, dimensions, measures, surrogate keys, historical attributes, incremental
        merges, and corrections.
      - Declaring grain and source-to-target rules.
      excludes:
      - Operational schemas optimized for transactional writes.
      - Visualization and interpretation of resulting metrics.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Separate one event measure from its descriptive entity attributes
          into a fact and dimension.
      - kind: representative
        instruction: For one sales dataset, design facts and conformed dimensions
          with declared grains and history rules, then incrementally load changes,
          late events, and corrections while resolving keys and reconciling measures.
    - id: c06.dimensional_modeling
      kind: capability
      parent_id: c06.analytical_delivery
      name: Dimensional Modeling
      outcome: Design fact and dimension tables whose grain, keys, measures, and historical
        behavior support specified analytical questions.
      includes:
      - Transaction, periodic snapshot, and accumulating snapshot facts; conformed
        dimensions; and slowly changing attributes.
      - Additivity, role-playing dimensions, and explicit grain.
      excludes:
      - Physical dashboard layouts.
      - Normalized operational design without an analytical workload.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Declare the grain of a purchase-line fact and identify its customer
          and product dimensions.
      - kind: representative
        instruction: Model orders, shipments, returns, and inventory snapshots with
          conformed dimensions, appropriate fact types, additive measures, role-playing
          dates, and historical customer segments.
    - id: c06.warehouse_loading
      kind: capability
      parent_id: c06.analytical_delivery
      name: Incremental Warehouse Loading
      outcome: Load supplied analytical facts and dimensions incrementally while preserving
        surrogate-key resolution, history, corrections, and source reconciliation.
      includes:
      - Slowly changing dimension application, early and late facts, merges, correction
        handling, and audit totals.
      - Ordering dimension and fact loads.
      excludes:
      - Designing source-capture protocols.
      - Choosing the dimensional model itself as the central operation.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Resolve one incoming business key to a dimension surrogate key
          before inserting a fact.
      - kind: representative
        instruction: Load a supplied star model from a change batch by applying historical
          dimension updates, assigning surrogate keys, handling early and late facts,
          correcting prior rows, and reconciling source counts and measures.
    - id: c06.schema_evolution
      kind: capability
      parent_id: c06.data_pipelines
      name: Data Contract and Pipeline Schema Evolution
      outcome: Evolve source and target data contracts without silently dropping,
        misinterpreting, or corrupting data across mixed producer and consumer versions.
      includes:
      - Additive and breaking changes, defaults, versioning, compatibility checks,
        drift detection, dual reads or writes, and backfills.
      - Coordinating contract rollout across pipeline stages.
      excludes:
      - Relational DDL migration mechanics inside one database.
      - Routine invalid-record checks under an unchanged contract.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Classify adding an optional source field and specify how an older
          consumer should handle it.
      - kind: representative
        instruction: Evolve an order-event contract through a field rename and type
          change using versioned schemas, producer and consumer compatibility gates,
          drift alerts, dual-read rollout, historical backfill, cutover, and rollback
          criteria.
    - id: c06.nosql_graph_data
      kind: capability
      parent_id: c06.databases_data_engineering
      name: NoSQL, Graph, and Distributed Data Systems
      outcome: Design document, key-value, wide-column, and graph models and choose
        distributed placement and consistency behavior from workload requirements.
      includes:
      - Aggregate and graph modeling, native access paths, partitioning, replication,
        read guarantees, and distributed write coordination.
      - Explicit denormalization, duplication, and failure semantics.
      excludes:
      - Using a nonrelational store solely as an interchangeable relational database.
      - Search or vector retrieval without a relevant data-model requirement.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Choose between embedding a small object and storing it as a separately
          addressed record for one read pattern.
      - kind: representative
        instruction: Design one global social-messaging service using document profiles,
          key-value preferences, wide-column message timelines, and a relationship
          graph, then specify physical partitions, replica topology, read guarantees,
          and invariant-preserving cross-record writes.
    - id: c06.nonrelational_models
      kind: capability
      parent_id: c06.nosql_graph_data
      name: Document, Key-Value, and Wide-Column Modeling
      outcome: Model denormalized aggregates and key-addressed records around concrete
        read, write, growth, ordering, and retention patterns.
      includes:
      - Embedding and references, key composition, bounded partitions, clustering
        order, and controlled duplication.
      - Update, fan-out, and storage consequences of materialized access paths.
      excludes:
      - Physical replica placement and failover topology.
      - Graph traversal as the primary access pattern.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Model one user preference as a directly addressable key and structured
          value.
      - kind: representative
        instruction: For one messaging workload, model conversation metadata as documents,
          preferences as direct key-value records, and time-ordered messages as bounded
          wide-column rows supporting inbox, conversation, pagination, retention,
          and unread access patterns.
    - id: c06.document_modeling
      kind: capability
      parent_id: c06.nonrelational_models
      name: Document Data Modeling
      outcome: Define document aggregates, embedding boundaries, references, identities,
        and update rules that serve specified access patterns.
      includes:
      - Nested objects and arrays, schema variation, document-level atomicity, bounded
        growth, and controlled duplication.
      - Embedding-versus-reference decisions.
      excludes:
      - Opaque key-only values.
      - Multi-hop graph traversal.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Embed a small shipping address in an order document that is always
          read with that order.
      - kind: representative
        instruction: Model articles, authors, revisions, comments, and tags as documents,
          choosing embedding or references for each relationship while accounting
          for growth, atomic updates, duplication, and required queries.
    - id: c06.key_value_modeling
      kind: capability
      parent_id: c06.nonrelational_models
      name: Key-Value Data Modeling
      outcome: Design stable keys and values for direct lookup, conditional update,
        expiration, and simple secondary access requirements.
      includes:
      - Key namespaces, composite lookup keys, value structure, TTLs, compare-and-set
        behavior, and controlled duplicated keys.
      - Predictable point access.
      excludes:
      - Ordered range scans within wide-column partitions.
      - Physical sharding, rebalancing, and replica placement.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Choose a key that retrieves one customer's preferences directly.
      - kind: representative
        instruction: Design key-value records for sessions, user preferences, feature
          assignments, and idempotency tokens with namespaces, TTLs, conditional updates,
          value versions, and any explicitly justified duplicate lookup keys.
    - id: c06.wide_column_modeling
      kind: capability
      parent_id: c06.nonrelational_models
      name: Wide-Column Access-Path Modeling
      outcome: Design logical partition keys, clustering order, buckets, and materialized
        tables for predictable range and query-specific access.
      includes:
      - Bounded logical partitions, clustering columns, time buckets, sparse attributes,
        and duplicated access tables.
      - Write fan-out and retention per logical table.
      excludes:
      - Physical shard placement, online rebalancing, and replica topology.
      - Direct opaque-value lookup as the only access pattern.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Choose a logical partition key and clustering timestamp for one
          device's daily readings.
      - kind: representative
        instruction: Design query-specific wide-column tables for device readings
          and regional alerts with bounded logical partitions, clustering order, time
          buckets, retention, pagination, sparse fields, and explicit write fan-out.
    - id: c06.graph_data
      kind: capability
      parent_id: c06.nosql_graph_data
      name: Graph Data Modeling and Querying
      outcome: Represent relationship-rich domains as graphs and express bounded paths,
        neighborhoods, and aggregates over the resulting model.
      includes:
      - Node and edge identities, labels, direction, properties, constraints, indexed
        starts, and traversal semantics.
      - Cycle, path-length, duplicate, and cardinality control.
      excludes:
      - Physical partition and replication policy.
      - Using graph storage for records with no relationship-driven query.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Represent two people and their directed employment relationships
          to one organization as nodes and edges.
      - kind: representative
        instruction: Using one fraud-investigation domain, model accounts, devices,
          transactions, merchants, and shared identifiers, then query bounded suspicious
          paths with cycle control, retained path evidence, endpoint aggregation,
          and deterministic ranking.
    - id: c06.graph_modeling
      kind: capability
      parent_id: c06.graph_data
      name: Graph Schema Modeling
      outcome: Choose nodes, edges, direction, properties, labels, identities, and
        constraints that preserve relationship semantics.
      includes:
      - Promoting relationships or attributes to first-class entities when identity
        or history matters.
      - Cardinality, temporal edges, uniqueness, and indexed starting points.
      excludes:
      - Complex traversal implementation.
      - Document embedding without graph queries.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Model customers and products with a directed purchased edge carrying
          a timestamp.
      - kind: representative
        instruction: Design a temporal supply-chain graph with organizations, facilities,
          products, shipments, ownership, and certifications, including identity rules,
          edge direction, properties, cardinalities, constraints, and indexed entry
          points.
    - id: c06.graph_queries
      kind: capability
      parent_id: c06.graph_data
      name: Graph Traversal Queries
      outcome: Write queries over a supplied graph model that return intended paths,
        neighborhoods, or aggregates with explicit direction, bounds, and duplicate
        semantics.
      includes:
      - Pattern matching, variable-length traversal, shortest paths, cycle control,
        path predicates, aggregation, and projection.
      - Selecting indexed starting nodes from the supplied model.
      excludes:
      - Redesigning the graph schema.
      - Unbounded exploration with unspecified termination.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Query all products reached by one outgoing purchased edge from
          a specified customer in a supplied graph.
      - kind: representative
        instruction: Query bounded paths linking two accounts through shared devices
          or payment instruments, exclude repeated nodes, retain path evidence, aggregate
          risk by endpoint, and return deterministic ranked results.
    - id: c06.distributed_data_systems
      kind: capability
      parent_id: c06.nosql_graph_data
      name: Distributed Data Placement and Consistency
      outcome: Choose physical partitioning, replica topology, read guarantees, and
        distributed write mechanisms that meet scale, locality, availability, and
        invariant requirements.
      includes:
      - Shard keys, rebalancing, replica placement, failover, consistency levels,
        conflict handling, and multi-record coordination.
      - Behavior during lag, network partitions, retries, and ambiguous outcomes.
      excludes:
      - Logical document or wide-column access-path design.
      - Infrastructure provisioning unrelated to data semantics.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Choose a physical shard key that distributes bounded tenant records
          while retaining tenant-local access.
      - kind: representative
        instruction: For one multi-region commerce dataset, choose physical shards
          and rebalancing, place replicas for regional failures, define read guarantees
          for profiles and orders, and coordinate inventory and balance writes through
          lag, partitions, retries, and failover.
    - id: c06.data_partitioning
      kind: capability
      parent_id: c06.distributed_data_systems
      name: Physical Data Partitioning and Rebalancing
      outcome: Distribute records across physical shards to balance load, preserve
        useful locality, bound skew, and support online growth.
      includes:
      - Hash and range partitioning, composite shard keys, hotspots, query fan-out,
        and online resharding.
      - Estimating placement and movement consequences.
      excludes:
      - Logical wide-column table and clustering design.
      - Replica placement and failover topology.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Select a physical shard key that spreads tenant records while
          retaining tenant-local reads.
      - kind: representative
        instruction: Partition a high-volume event store by tenant and time, quantify
          skew and query fan-out, mitigate hot shards, define split thresholds, and
          plan online rebalancing as tenants and traffic grow.
    - id: c06.replica_topology
      kind: capability
      parent_id: c06.distributed_data_systems
      name: Replica Placement and Failover Topology
      outcome: Place and promote replicas to meet locality, durability, availability,
        and failure-domain requirements.
      includes:
      - Regional and zonal placement, leaders and followers, synchronous and asynchronous
        replication, failover, and rebuild behavior.
      - Capacity and lag implications of topology choices.
      excludes:
      - Selecting logical or physical partition keys.
      - Application-visible read consistency beyond what topology can support.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Place three replicas across failure zones so one zone loss does
          not remove every copy.
      - kind: representative
        instruction: Design a multi-region replica topology for an order store, specifying
          leader placement, synchronous and asynchronous links, read locality, regional
          failover, promotion safety, rebuild capacity, and behavior during replica
          lag.
    - id: c06.replicated_read_consistency
      kind: capability
      parent_id: c06.distributed_data_systems
      name: Replicated Read Consistency
      outcome: Select and implement read guarantees that match stated freshness, session,
        ordering, latency, and availability requirements.
      includes:
      - Strong, bounded-staleness, causal, monotonic-read, read-your-writes, and eventual
        guarantees.
      - Leader, quorum, session-token, and lag behavior.
      excludes:
      - Atomic multi-record write coordination.
      - Shard-key and replica-placement design.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Choose a read-your-writes mechanism so a user immediately observes
          a successful profile update.
      - kind: representative
        instruction: Specify read guarantees and routing for profiles, timelines,
          permissions, and order status during replica lag and regional failover,
          identifying which reads require strong, causal, session, bounded-stale,
          or eventual behavior.
    - id: c06.distributed_write_coordination
      kind: capability
      parent_id: c06.distributed_data_systems
      name: Distributed Transactions and Conflict Handling
      outcome: Preserve named cross-record or cross-partition invariants through concurrency,
        retries, conflicts, partial failure, and ambiguous outcomes.
      includes:
      - Atomic distributed transactions, conditional writes, consensus-backed commits,
        sagas, idempotency, conflict detection, and deterministic resolution.
      - Explaining aborts, retries, and uncertain commit results.
      excludes:
      - Read-only consistency selection.
      - Partition-key and replica-topology design.
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Add an idempotency key and conditional version check to one cross-partition
          transfer so a retried request cannot apply twice.
      - kind: representative
        instruction: Design write coordination for replicated balances and inventory
          across partitions, preserving declared invariants through concurrent updates,
          partial commits, regional partitions, retries, conflict resolution, and
          ambiguous client outcomes.
- routing_facet: subject_domain
  curriculum:
    version: wave2-2
    subject_id: C07
    subject_name: Data Analysis & Visualization
    sections:
    - id: c07.data-foundations
      kind: capability
      parent_id: null
      name: Analytical Data Preparation and Exploration
      outcome: Transform heterogeneous records into analysis-ready tables and characterize
        their quality, distributions, group differences, and relationships.
      includes:
      - Analytical data cleaning and transformation
      - Table integration and reshaping
      - Exploratory data analysis
      excludes:
      - Arbitrary document-to-schema conversion
      - Formal statistical inference
      - Presentation-focused reporting
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Standardize the types and labels in a small table, then report
          one distributional feature of the corrected data.
      - kind: representative
        instruction: Using one collection of customer, transaction, and account records,
          construct an analysis-ready table, diagnose consequential quality problems,
          summarize its variables and groups, and investigate relationships relevant
          to customer retention.
    - id: c07.data-foundations.preparation
      kind: capability
      parent_id: c07.data-foundations
      name: Analytical Data Preparation
      outcome: Clean, transform, combine, and reshape tabular records into analysis-ready
        observations and variables while preserving their meaning and grain.
      includes:
      - Type and date normalization
      - Filtering, recoding, and derived variables
      - Joins, aggregation, and reshaping
      - Missing-value treatment
      excludes:
      - General document serialization
      - Statistical conclusions
      - Schema compliance as the primary outcome
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Convert a small table's date and amount columns to consistent
          types and derive one requested indicator.
      - kind: representative
        instruction: Prepare one set of order and customer tables by normalizing types
          and categories, filtering invalid records, deriving requested measures,
          joining at the correct grain, reshaping repeated monthly fields, and documenting
          justified missing-value treatment.
    - id: c07.data-foundations.preparation.table-transformation
      kind: capability
      parent_id: c07.data-foundations.preparation
      name: Tabular Cleaning and Feature Construction
      outcome: Normalize analytical variables and apply justified row selection, recoding,
        missing-value treatment, and feature derivation without changing observational
        meaning.
      includes:
      - Type, unit, category, and date normalization
      - Filtering and deduplication rules
      - Explicit missing-value treatment
      - Derived variables and conditional recoding
      excludes:
      - Joining independent tables
      - Wide-to-long reshaping
      - Detecting quality problems without repairing data
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Normalize one mixed-format date column and recode one inconsistent
          category column in a small table.
      - kind: representative
        instruction: Clean a transaction table by resolving duplicate observations,
          normalizing dates, units, and categories, applying stated inclusion rules,
          treating missing values according to their meanings, and deriving analysis
          variables at the original row grain.
    - id: c07.data-foundations.preparation.integration-reshape
      kind: capability
      parent_id: c07.data-foundations.preparation
      name: Table Integration and Reshaping
      outcome: Join, aggregate, and reshape normalized tables at an explicit observational
        grain while preventing duplication, loss, and leakage.
      includes:
      - Join-key and cardinality reasoning
      - Aggregation to a declared grain
      - Wide-to-long and long-to-wide transformations
      - Post-join reconciliation
      excludes:
      - Cleaning unrelated malformed fields
      - Document-to-schema extraction
      - Statistical modeling
      prerequisites:
      - c07.data-foundations.preparation.table-transformation
      sample_tasks:
      - kind: entry
        instruction: Normalize the keys, types, categories, missing values, and requested
          derived field in two small tables, then add one many-to-one lookup column
          without changing the row count.
      - kind: representative
        instruction: Normalize and recode customer, order, and monthly-status tables,
          derive the requested fields, then join, aggregate, and reshape them to one
          customer-month row per observation while reconciling unmatched keys, duplicated
          totals, and leakage-prone fields.
    - id: c07.data-foundations.eda
      kind: capability
      parent_id: c07.data-foundations
      name: Exploratory Data Analysis
      outcome: Diagnose data quality and use descriptive and relationship analysis
        to reveal distributions, anomalies, group differences, and plausible analytical
        directions.
      includes:
      - Quality diagnostics
      - Univariate and grouped summaries
      - Bivariate and multivariable exploration
      excludes:
      - Confirmatory hypothesis decisions
      - Causal attribution
      - Forecast production
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Inspect a small numeric column, identify one invalid value, and
          describe the valid values with an appropriate center and spread.
      - kind: representative
        instruction: Explore one service-use table by diagnosing quality problems,
          selecting summaries for its numeric and categorical variables, comparing
          customer groups, and investigating whether apparent outcome relationships
          persist across relevant strata and after checking artifacts.
    - id: c07.data-foundations.eda.data-quality
      kind: capability
      parent_id: c07.data-foundations.eda
      name: Data Quality Diagnosis
      outcome: Detect and characterize missingness, invalid values, duplicates, inconsistent
        units, and measurement artifacts that could distort an analysis.
      includes:
      - Validity and range checks
      - Missingness patterns
      - Duplicate and entity-resolution checks
      - Unit and measurement consistency
      excludes:
      - Automatic repair without justification
      - Distributional inference
      - Format validation as the primary task
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Identify the values in a short measurement column that violate
          its stated range or unit.
      - kind: representative
        instruction: Audit a multi-table operational dataset for invalid values, duplicate
          entities, inconsistent units, temporal coverage gaps, and systematic missingness,
          and explain how each problem could alter the intended analysis.
    - id: c07.data-foundations.eda.summaries
      kind: capability
      parent_id: c07.data-foundations.eda
      name: Distribution and Group Summaries
      outcome: Select and compute summaries that accurately describe central tendency,
        spread, shape, frequency, and differences among defined groups.
      includes:
      - Robust and classical summaries
      - Frequency tables and proportions
      - Quantiles, dispersion, and shape
      - Grouped aggregation
      excludes:
      - Association after conditioning on other variables
      - Hypothesis tests
      - Causal explanations
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Compute the median and interquartile range of a skewed numeric
          sample and explain why they are suitable.
      - kind: representative
        instruction: Summarize mixed numeric and categorical variables across customer
          segments, choosing measures that expose skew, dispersion, rare categories,
          and within-group variation while retaining relevant group sizes.
    - id: c07.data-foundations.eda.relationships
      kind: capability
      parent_id: c07.data-foundations.eda
      name: Exploratory Relationship Analysis
      outcome: Characterize associations while distinguishing form, direction, strength,
        subgroup heterogeneity, conditioning effects, and possible artifacts.
      includes:
      - Cross-tabulation and conditional proportions
      - Linear and nonlinear association
      - Stratified comparisons and interactions
      - Outlier and imbalance checks
      excludes:
      - Group summaries with no relationship question
      - Formal significance testing
      - Claims that association proves causation
      prerequisites:
      - c07.data-foundations.eda.summaries
      sample_tasks:
      - kind: entry
        instruction: For a small mixed-type table, compute suitable centers, spreads,
          frequencies, and group summaries, then add one stratified cross-tabulation
          to determine whether an apparent group difference reverses after conditioning
          on a third variable.
      - kind: representative
        instruction: Summarize the distributions and group differences in an outcome
          and its candidate predictors, then characterize their linear and nonlinear
          associations, stratify by a relevant group, examine interaction and imbalance,
          and determine whether outliers or conditioning explain the initial pattern.
    - id: c07.probability-statistics
      kind: capability
      parent_id: null
      name: Probability and Statistical Inference
      outcome: Represent uncertainty with probability models and use sample evidence
        to estimate, test, or bound population quantities with justified conclusions.
      includes:
      - Event, updating, and expectation models
      - Sampling distributions and estimation
      - Hypothesis testing
      - Moment-based probability bounds
      excludes:
      - Causal identification from observational data
      - Experimental logistics
      - Forecast validation
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Define a success event for a repeated process, calculate its
          one-trial probability, and distinguish that probability from an observed
          sample proportion.
      - kind: representative
        instruction: For one service process, construct a probability model for completion
          and waiting time, update a probability after observing a diagnostic signal,
          use a sample to estimate and test the population completion rate, and obtain
          a separate tail bound when only moments are trusted.
    - id: c07.probability-statistics.probability
      kind: capability
      parent_id: c07.probability-statistics
      name: Probability Modeling
      outcome: Represent random events, information updates, and long-run quantities
        with explicit probability models.
      includes:
      - Sample spaces and repeated events
      - Conditional and Bayesian updating
      - Expectations, variances, and waiting times
      excludes:
      - Sample-to-population inference
      - Causal-effect interpretation
      - Descriptive summaries without a random model
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: List the outcomes of a two-stage random process and calculate
          the probability of one compound event.
      - kind: representative
        instruction: Model one sequential inspection process by deriving its finite
          and eventual completion probabilities, updating the defect probability after
          an imperfect signal, and calculating the expected number and variance of
          inspections until acceptance.
    - id: c07.probability-statistics.probability.events
      kind: capability
      parent_id: c07.probability-statistics.probability
      name: Events and Repeated Trials
      outcome: Construct sample spaces and calculate probabilities of simple, compound,
        complementary, and repeated events, including finite and eventual occurrence.
      includes:
      - Counting outcomes
      - Unions, intersections, and complements
      - Independent repeated trials
      - Finite limits and eventual occurrence
      excludes:
      - Updating from observed evidence
      - Expected-value calculations
      - Population inference
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Count the outcomes satisfying a condition in one roll of two
          fair dice and convert the count to a probability.
      - kind: representative
        instruction: For independent trials that stop at a target event or a fixed
          limit, derive the probabilities of early completion, failure by the limit,
          and eventual completion, including all boundary parameter values.
    - id: c07.probability-statistics.probability.updating
      kind: capability
      parent_id: c07.probability-statistics.probability
      name: Conditional Probability and Updating
      outcome: Update probability assignments from observations or reports while making
        priors, conditioning events, information states, and evidence reliability
        explicit.
      includes:
      - Conditional probability
      - Bayesian updating
      - Observer information states
      - Sensitivity, specificity, and report reliability
      excludes:
      - Unconditioned event counting
      - Frequentist hypothesis tests
      - Claims unsupported by the probability model
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a disease prior, sensitivity, and false-positive rate for
          an imperfect test, calculate the probability of disease after a positive
          result.
      - kind: representative
        instruction: Compare two analysts' probability assignments as one observes
          a noisy signal and communicates it through an imperfect channel, calculating
          each posterior and explaining how their distinct information states produce
          different answers.
    - id: c07.probability-statistics.probability.expectation
      kind: capability
      parent_id: c07.probability-statistics.probability
      name: Expectation and Stopping Quantities
      outcome: Compute and interpret expectations, variances, and waiting times from
        specified random-variable and stopping models.
      includes:
      - Expected values
      - Variance calculations
      - Geometric and bounded waiting times
      - Linearity of expectation
      excludes:
      - Observed averages without a probability model
      - Hypothesis decisions
      - Forecast error metrics
      prerequisites:
      - c07.probability-statistics.probability.events
      sample_tasks:
      - kind: entry
        instruction: Construct the simple, compound, complementary, finite-repeat,
          and eventual event probabilities for a bounded sequence of independent trials,
          then add the expected number of trials used.
      - kind: representative
        instruction: For a multistage process, construct its event space and finite
          and eventual completion probabilities, then define the stopping variables
          and derive the expected completion time and its variance when stages can
          repeat.
    - id: c07.probability-statistics.inference
      kind: capability
      parent_id: c07.probability-statistics
      name: Statistical Inference
      outcome: Use sampling behavior and stated assumptions to estimate population
        quantities, quantify uncertainty, test claims, and derive distribution-free
        moment bounds.
      includes:
      - Sampling distributions
      - Point and interval estimation
      - Hypothesis testing
      - Moment inequalities
      excludes:
      - Exploration presented as confirmation
      - Causal identification without a design
      - Pure probability calculations without sample evidence
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Explain how estimates from repeated random samples vary and use
          that variation to quantify uncertainty for one sample estimate.
      - kind: representative
        instruction: For one quality-control sample, characterize an estimator's sampling
          behavior, report a point estimate and interval, test a directional claim,
          and derive a separate tail-count bound using only the supplied moments.
    - id: c07.probability-statistics.inference.sampling-distributions
      kind: capability
      parent_id: c07.probability-statistics.inference
      name: Sampling Distributions and Standard Errors
      outcome: Relate a sampling design and repeated-sample variation to an estimator's
        bias, standard error, shape, and effective sample size.
      includes:
      - Estimator sampling behavior
      - Bias and variability
      - Standard errors
      - Dependence and effective sample size
      excludes:
      - Constructing confidence intervals
      - Hypothesis decisions
      - Prediction uncertainty for future observations
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: From estimates produced by several repeated random samples, calculate
          their empirical standard error.
      - kind: representative
        instruction: Compare the repeated-sample distributions of an estimator under
          simple random, clustered, and stratified sampling, assessing bias, shape,
          standard error, and effective sample size.
    - id: c07.probability-statistics.inference.estimation
      kind: capability
      parent_id: c07.probability-statistics.inference
      name: Estimation and Confidence Intervals
      outcome: Define estimands, compute point estimates and standard errors, and
        construct intervals whose interpretation matches the sampling design and assumptions.
      includes:
      - Estimands and estimators
      - Design-aware standard errors
      - Confidence intervals
      - Coverage interpretation
      excludes:
      - Binary hypothesis decisions
      - Causal estimands without identification
      - Prediction intervals for future observations
      prerequisites:
      - c07.probability-statistics.inference.sampling-distributions
      sample_tasks:
      - kind: entry
        instruction: Characterize the bias, shape, standard error, and effective sample
          size of a mean under the stated sampling design, then add a confidence interval
          using that standard error.
      - kind: representative
        instruction: For a stratified population survey, define the target rate, derive
          the weighted estimator's sampling behavior and standard error, construct
          a confidence interval, and explain its repeated-sampling coverage and design
          assumptions.
    - id: c07.probability-statistics.inference.hypothesis-tests
      kind: capability
      parent_id: c07.probability-statistics.inference
      name: Hypothesis Testing
      outcome: Formulate hypotheses, select and compute an appropriate test, check
        its assumptions, and state an error-aware decision in context.
      includes:
      - One- and two-sided hypotheses
      - Test statistics and reference distributions
      - P-values, sizes, and critical values
      - Assumption-aware conclusions
      excludes:
      - Treating non-rejection as proof of equality
      - Unplanned multiple testing
      - Causal claims unsupported by design
      prerequisites:
      - c07.probability-statistics.inference.estimation
      sample_tasks:
      - kind: entry
        instruction: Define the estimand, estimate it with a design-appropriate standard
          error and confidence interval, then add a one-sided null and alternative
          and compare the resulting p-value with one stated test size.
      - kind: representative
        instruction: Estimate a manufacturing variance with uncertainty, formulate
          a directional claim, select and compute the appropriate reference-distribution
          test, check its assumptions, compare the p-value with several prespecified
          sizes, and report a contextual decision without treating non-rejection as
          proof.
    - id: c07.probability-statistics.inference.moment-bounds
      kind: capability
      parent_id: c07.probability-statistics.inference
      name: Moment-Based Probability Bounds
      outcome: Use means, second moments, and variances to derive justified one-sided
        or two-sided bounds on tail probabilities and counts without assuming a full
        distribution.
      includes:
      - Variance from first and second moments
      - Markov, Chebyshev, and one-sided bounds
      - Threshold selection
      - Probability-to-count conversion
      excludes:
      - Exact tails from a named distribution
      - Outlier deletion
      - Asymptotic hypothesis tests
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Use a supplied nonnegative mean to bound the proportion of values
          above a positive threshold.
      - kind: representative
        instruction: Given a dataset size, mean, root-mean-square value, and cutoff,
          derive the variance, choose the strongest justified moment inequality, and
          convert its tail-probability bound into a valid integer count bound.
    - id: c07.experiments-health
      kind: capability
      parent_id: null
      name: Experiments and Population Health
      outcome: Design controlled comparisons and analyze biomedical or population-health
        evidence with measurements, statistical methods, biases, and decisions matched
        to the scientific question.
      includes:
      - Controlled and randomized experiments
      - A/B analysis
      - Longitudinal and survival analysis
      - Epidemiologic measures and bias
      excludes:
      - Individual diagnosis or treatment advice
      - Uncontrolled causal claims
      - General-purpose forecasting
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: For a proposed health intervention, identify one control and
          one outcome needed for a valid comparison.
      - kind: representative
        instruction: For one population-health intervention, validate its biomarker
          measurement, design and analyze a randomized comparison, analyze repeated
          biomarker and event-time outcomes, estimate population disease associations,
          and state a decision that accounts for uncertainty and bias.
    - id: c07.experiments-health.experimental-design
      kind: capability
      parent_id: c07.experiments-health
      name: Controlled Experiments and A/B Analysis
      outcome: Validate measurements, design randomized comparisons, and analyze experimental
        effects using prespecified outcomes, uncertainty, guardrails, and decision
        rules.
      includes:
      - Mechanism-isolating controls
      - Randomization and sample-size planning
      - Exposure and outcome integrity
      - A/B effect and decision analysis
      excludes:
      - Observational identification strategies
      - Uncontrolled laboratory protocols
      - Population surveillance
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Add a negative control and a randomized comparison to a simple
          intervention study, naming the primary outcome.
      - kind: representative
        instruction: For one randomized biomarker intervention, design matched measurement
          controls, choose assignment units and blocking, plan sample size and stopping,
          validate exposure and outcomes, estimate the treatment effect with a prespecified
          test, assess guardrails, and apply the decision rule.
    - id: c07.experiments-health.experimental-design.controlled-validation
      kind: capability
      parent_id: c07.experiments-health.experimental-design
      name: Controlled Measurement Validation
      outcome: Design matched controls and complementary measurements that distinguish
        a target signal or mechanism from contamination, artifact, and competing explanations.
      includes:
      - Positive, negative, and procedural controls
      - Matched treatment conditions
      - Orthogonal measurements
      - Interpretation criteria tied to alternatives
      excludes:
      - Estimating an A/B treatment effect
      - Random-assignment planning
      - Instrument calibration without a scientific contrast
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Choose a negative control that tests whether fluorescence can
          arise without viable target cells.
      - kind: representative
        instruction: Design a follow-up study that distinguishes true metabolic fluorescence
          from dead material, environmental debris, and instrument background using
          matched live and killed controls, localization, an independent viability
          measure, and explicit interpretation criteria.
    - id: c07.experiments-health.experimental-design.randomized-design
      kind: capability
      parent_id: c07.experiments-health.experimental-design
      name: Randomized Experiment Design
      outcome: Specify assignment units, randomization, blocking, outcomes, sample
        size, exposure checks, stopping, and multiplicity controls for a valid randomized
        comparison.
      includes:
      - Assignment-unit and interference reasoning
      - Blocking and stratification
      - Power and sample-size planning
      - Exposure integrity, stopping, and multiplicity
      excludes:
      - Analyzing completed outcomes
      - Quasi-experimental identification
      - Laboratory mechanism controls
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Choose the assignment unit and randomization scheme for a two-variant
          test where users can influence one another.
      - kind: representative
        instruction: Design a randomized product experiment by defining units and
          eligibility, handling interference with blocking or clustering, specifying
          primary and guardrail outcomes, planning sample size, checking exposure,
          and prespecifying stopping and multiplicity rules.
    - id: c07.experiments-health.experimental-design.ab-analysis
      kind: capability
      parent_id: c07.experiments-health.experimental-design
      name: A/B Experiment Analysis
      outcome: Integrate randomized-design and hypothesis-testing decisions to estimate
        variant effects, audit execution, assess guardrails, and make a prespecified
        launch decision.
      includes:
      - Assignment and exposure audits
      - Effect estimates with uncertainty
      - Primary and guardrail tests
      - Threshold-based decisions
      excludes:
      - Nonrandomized causal attribution
      - Designing mechanism-isolating laboratory controls
      - Metric display without a decision
      prerequisites:
      - c07.experiments-health.experimental-design.randomized-design
      - c07.probability-statistics.inference.hypothesis-tests
      sample_tasks:
      - kind: entry
        instruction: Design a two-arm experiment with explicit units, eligibility,
          randomization, blocking, outcomes, sample size, exposure checks, stopping,
          and multiplicity; formulate and carry out the primary hypothesis test with
          an estimate and interval; then add one guardrail threshold to the final
          decision.
      - kind: representative
        instruction: Design and analyze a randomized product experiment by specifying
          assignment, blocking, outcomes, sample size, stopping and multiplicity;
          auditing assignment, exposure, and measurement; estimating primary and guardrail
          effects with assumption-aware tests and intervals; and applying the prespecified
          launch rule.
    - id: c07.experiments-health.population-health
      kind: capability
      parent_id: c07.experiments-health
      name: Biostatistics and Epidemiology
      outcome: Analyze biomedical and population data using outcome-appropriate statistical
        methods, disease-frequency measures, study-design reasoning, and bias-aware
        interpretation.
      includes:
      - Longitudinal biomedical outcomes
      - Survival and event-time outcomes
      - Disease frequency and association
      - Confounding, selection, and measurement bias
      excludes:
      - Individual medical advice
      - Laboratory control design as the central task
      - Generic business experimentation
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: From a small cohort table, calculate disease risk by exposure
          group and identify whether one biomarker was measured repeatedly.
      - kind: representative
        instruction: Analyze one cohort by modeling its repeated biomarker measurements
          and censored event times, estimating disease frequency and exposure association,
          and assessing confounding, selection, measurement bias, and clinical relevance.
    - id: c07.experiments-health.population-health.biostatistics
      kind: capability
      parent_id: c07.experiments-health.population-health
      name: Biostatistical Outcome Analysis
      outcome: Analyze correlated longitudinal measurements and censored event times
        using methods whose assumptions and effect summaries match the biomedical
        outcome.
      includes:
      - Paired and repeated measurements
      - Longitudinal correlation
      - Survival functions and hazards
      - Clinical and statistical interpretation
      excludes:
      - Population-level bias analysis as the central operation
      - Generic independent-sample testing
      - Individual prognosis
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Identify whether a before-and-after biomarker comparison is paired
          and whether follow-up times include censoring.
      - kind: representative
        instruction: For one patient cohort, analyze repeated biomarker measurements
          and time to relapse, accounting for within-patient dependence and censoring,
          checking method assumptions, and reporting uncertainty and clinical relevance
          for both outcomes.
    - id: c07.experiments-health.population-health.biostatistics.longitudinal
      kind: capability
      parent_id: c07.experiments-health.population-health.biostatistics
      name: Paired and Longitudinal Outcome Analysis
      outcome: Analyze paired or repeated biomedical measurements while accounting
        for within-subject dependence, time, missing follow-up, and clinically meaningful
        change.
      includes:
      - Paired comparisons
      - Repeated-measures models
      - Within-subject correlation
      - Time-by-group effects
      excludes:
      - Right-censored event-time analysis
      - Independent observations treated as repeated
      - Population disease-frequency measures
      prerequisites:
      - c07.probability-statistics.inference.hypothesis-tests
      sample_tasks:
      - kind: entry
        instruction: Define and estimate a biomarker-change estimand with an interval,
          formulate and conduct an assumption-aware test with a contextual decision,
          then add the paired-subject structure rather than treating measurements
          as independent.
      - kind: representative
        instruction: Analyze a longitudinal biomarker study by defining clinically
          meaningful contrasts, estimating repeated-measure effects with uncertainty,
          formulating and testing the relevant hypotheses, checking distributional
          and dependence assumptions, addressing missing follow-up, and interpreting
          time-by-treatment differences.
    - id: c07.experiments-health.population-health.biostatistics.survival
      kind: capability
      parent_id: c07.experiments-health.population-health.biostatistics
      name: Survival and Event-Time Analysis
      outcome: Estimate and compare time-to-event outcomes while handling censoring,
        risk sets, competing events, and proportionality or functional-form assumptions.
      includes:
      - Censoring and risk sets
      - Survival and cumulative-incidence curves
      - Hazard and time-ratio models
      - Model-assumption diagnostics
      excludes:
      - Ordinary paired-outcome analysis
      - Ignoring incomplete follow-up
      - Individual clinical prognosis
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Construct the first two risk sets for a small event-time dataset
          containing one censored observation.
      - kind: representative
        instruction: Analyze time to relapse in two treatment groups by describing
          censoring, estimating survival or cumulative incidence, reporting an effect
          with uncertainty, checking proportionality and competing-event assumptions,
          and interpreting absolute and relative differences.
    - id: c07.experiments-health.population-health.epidemiology
      kind: capability
      parent_id: c07.experiments-health.population-health
      name: Epidemiologic Measures and Bias
      outcome: Use study design, disease-frequency measures, association estimates,
        stratification, and bias analysis to interpret population-health evidence.
      includes:
      - Prevalence, incidence, risk, and rates
      - Risk ratios and odds ratios
      - Confounding and effect modification
      - Selection and information bias
      excludes:
      - Randomized product A/B tests
      - Individual prognosis
      - Statistical computation detached from study design
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Compute and interpret a risk ratio from exposed and unexposed
          event counts.
      - kind: representative
        instruction: Evaluate an observational exposure study by selecting appropriate
          frequency and association measures, stratifying on a plausible confounder,
          assessing effect modification, and explaining the likely direction of selection
          and measurement biases.
    - id: c07.models-time
      kind: capability
      parent_id: null
      name: Model Assessment, Econometrics, and Forecasting
      outcome: Assess empirical models and claims, estimate economic relationships
        under explicit identification assumptions, and construct and evaluate forecasts
        for time-dependent data.
      includes:
      - Model validity and claim calibration
      - Econometric estimation and identification
      - Time-series structure, forecasting, and backtesting
      excludes:
      - Domain knowledge as a substitute for supplied model assumptions
      - Randomized experiment execution
      - Presentation design as the primary outcome
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Compare one observed pattern with a supplied model prediction
          and state whether the discrepancy affects description, causal interpretation,
          or forecasting.
      - kind: representative
        instruction: Using one policy panel and its time series, diagnose a supplied
          model's validity, estimate the policy relationship under competing identification
          designs, construct and backtest a forecast, and separate the decision-relevant
          evidence from claims the analysis does not support.
    - id: c07.models-time.model-assessment
      kind: capability
      parent_id: c07.models-time
      name: Model and Evidence Assessment
      outcome: Use empirical discrepancies to diagnose where supplied assumptions
        fail and calibrate conclusions to what the analysis establishes.
      includes:
      - Validity-regime diagnostics
      - Observed-versus-predicted comparison
      - Alternative explanations
      - Evidence-to-claim calibration
      excludes:
      - Unstructured domain speculation
      - Parameter estimation as the central task
      - Metaphysical interpretation detached from an analysis
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a stated model assumption and an observed residual pattern,
          identify one conclusion that follows and one stronger conclusion that does
          not.
      - kind: representative
        instruction: For one supplied mechanistic model and dataset, compare predictions
          with observations across regimes, trace residual patterns to specific assumptions
          or boundaries, state the defensible validity domain, and distinguish the
          supported empirical conclusion from causal or mechanistic alternatives.
    - id: c07.models-time.model-assessment.assumptions
      kind: capability
      parent_id: c07.models-time.model-assessment
      name: Assumption and Validity-Regime Diagnostics
      outcome: Relate empirical residual and association patterns to explicit model
        assumptions, scale regimes, boundary conditions, and omitted dynamics supplied
        in the task.
      includes:
      - Residual-pattern diagnosis
      - Scaling and functional-form checks
      - Boundary and asymptotic regimes
      - Omitted-process reasoning from stated alternatives
      excludes:
      - Requiring unstated specialist domain knowledge
      - Rejecting a model because of any mismatch
      - Fitting a replacement model
      prerequisites:
      - c07.data-foundations.eda.relationships
      sample_tasks:
      - kind: entry
        instruction: Summarize distributions and group differences, characterize linear
          and nonlinear associations across strata, and check heterogeneity, imbalance,
          and outliers; then add one residual-pattern comparison to identify which
          supplied model assumption fails first.
      - kind: representative
        instruction: Explore the outcome and predictors with distributional, grouped,
          nonlinear, stratified, interaction, imbalance, and artifact checks, then
          compare the resulting residual patterns with supplied scaling, boundary,
          and omitted-process assumptions to state the model's defensible validity
          regime.
    - id: c07.models-time.model-assessment.evidence-claims
      kind: capability
      parent_id: c07.models-time.model-assessment
      name: Empirical Evidence and Claim Calibration
      outcome: State what a completed analysis supports while distinguishing descriptive,
        predictive, causal, and mechanistic claims and identifying compatible alternatives.
      includes:
      - Result-versus-interpretation distinctions
      - Alternative analytical explanations
      - Claim-strength calibration
      - Uncertainty and design limitations
      excludes:
      - Generic philosophy-of-science questions
      - Probability updating as the central calculation
      - Unsupported ontological conclusions
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Rewrite a causal headline about an observational association
          as a claim supported by the reported analysis.
      - kind: representative
        instruction: Assess an empirical analysis whose association fits several causal
          or mechanistic accounts, state the common supported finding with its uncertainty,
          compare compatible alternatives, and explain which additional design or
          evidence would distinguish them.
    - id: c07.models-time.econometrics
      kind: capability
      parent_id: c07.models-time
      name: Econometric Analysis
      outcome: Estimate economically meaningful relationships and evaluate causal
        interpretations using regression diagnostics and explicit quasi-experimental
        assumptions.
      includes:
      - Regression specification and diagnostics
      - Economic effect interpretation
      - Difference-in-differences
      - Instrumental variables and regression discontinuity
      excludes:
      - Univariate forecasting
      - Randomized A/B execution
      - Purely descriptive economics
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Estimate and interpret the slope relating price to demand without
          calling it causal, then name one source of identifying variation that could
          support a causal estimate.
      - kind: representative
        instruction: For one policy outcome, specify and diagnose an economic regression,
          then evaluate difference-in-differences, instrumental-variable, and discontinuity
          evidence tied to that same policy question before stating the most credible
          effect claim.
    - id: c07.models-time.econometrics.estimation
      kind: capability
      parent_id: c07.models-time.econometrics
      name: Econometric Estimation and Diagnostics
      outcome: Specify, estimate, and interpret regression models while checking functional
        form, dependence, heteroskedasticity, leverage, and economically meaningful
        effect size.
      includes:
      - Regression specification
      - Coefficient and marginal-effect interpretation
      - Robust uncertainty
      - Residual and influence diagnostics
      excludes:
      - Causal identification from coefficients alone
      - Pure forecasting models
      - Randomized-treatment analysis
      prerequisites:
      - c07.data-foundations.eda.relationships
      - c07.probability-statistics.inference.estimation
      sample_tasks:
      - kind: entry
        instruction: Summarize distributions and group differences, explore nonlinear
          and stratified associations and artifacts, define an estimand, characterize
          its sampling uncertainty, and construct an interval; then add a regression
          coefficient interpreted in the variables' economic units.
      - kind: representative
        instruction: Explore an economic outcome and its predictors for distributions,
          group differences, nonlinearities, heterogeneity, imbalance, and artifacts;
          specify a multivariable regression; estimate interpretable effects and design-aware
          intervals; and diagnose functional form, dependence, heteroskedasticity,
          and influence without making an unsupported causal claim.
    - id: c07.models-time.econometrics.identification
      kind: capability
      parent_id: c07.models-time.econometrics
      name: Quasi-Experimental Identification
      outcome: Choose and assess difference-in-differences, instrumental-variable,
        and regression-discontinuity strategies for one causal question using each
        design's distinct source of variation and falsification checks.
      includes:
      - Design-specific identifying variation
      - Central identification assumptions
      - Falsification and sensitivity checks
      - Comparison of candidate designs
      excludes:
      - Calling adjusted regression inherently causal
      - Randomized assignment design
      - Forecasting future outcomes
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: For one policy question, distinguish the identifying variation
          offered by a treatment-timing change, an instrument, and an eligibility
          cutoff.
      - kind: representative
        instruction: For one policy-effect question with panel, instrument, and cutoff
          data available, formulate difference-in-differences, instrumental-variable,
          and regression-discontinuity analyses, test each design's central assumptions,
          and select the most credible estimate while explaining remaining threats.
    - id: c07.models-time.econometrics.identification.did
      kind: capability
      parent_id: c07.models-time.econometrics.identification
      name: Difference-in-Differences Designs
      outcome: Estimate effects from differential treatment timing while assessing
        parallel trends, composition, anticipation, dynamics, and treatment heterogeneity.
      includes:
      - Two-way and staggered comparisons
      - Parallel-trend diagnostics
      - Event-study dynamics
      - Placebo timing and composition checks
      excludes:
      - Instrument relevance and exclusion
      - Cutoff continuity
      - Forecast trend extrapolation
      prerequisites:
      - c07.models-time.econometrics.estimation
      sample_tasks:
      - kind: entry
        instruction: Specify and estimate a panel regression with economically interpreted
          effects, robust uncertainty, and residual, dependence, heteroskedasticity,
          and influence checks; then add one pre-treatment trend comparison before
          interpreting the post-treatment coefficient causally.
      - kind: representative
        instruction: Specify and diagnose an economically interpretable panel model
          with robust uncertainty, then estimate a policy effect using difference-in-differences,
          examine pre-trends, anticipation, composition, dynamics, and heterogeneous
          timing, and report the causal claim warranted by those checks.
    - id: c07.models-time.econometrics.identification.iv
      kind: capability
      parent_id: c07.models-time.econometrics.identification
      name: Instrumental-Variable Designs
      outcome: Estimate local causal effects from an instrument while assessing relevance,
        exclusion, independence, monotonicity, weak-instrument risk, and estimand
        scope.
      includes:
      - First-stage relevance
      - Exclusion and independence reasoning
      - Two-stage estimation
      - Weak-instrument and local-effect interpretation
      excludes:
      - Parallel-trend designs
      - Cutoff continuity designs
      - Treating any predictor as an instrument
      prerequisites:
      - c07.models-time.econometrics.estimation
      sample_tasks:
      - kind: entry
        instruction: Specify and estimate the outcome regression with economic interpretation,
          robust uncertainty, and functional-form, dependence, heteroskedasticity,
          and influence diagnostics; then add a first-stage relevance check for one
          proposed instrument.
      - kind: representative
        instruction: Specify and diagnose the economic outcome and first-stage regressions,
          estimate the effect by instrumental variables with robust uncertainty, assess
          relevance, exclusion, independence, monotonicity, and weak-instrument risk,
          and interpret the resulting local estimand.
    - id: c07.models-time.econometrics.identification.rd
      kind: capability
      parent_id: c07.models-time.econometrics.identification
      name: Regression-Discontinuity Designs
      outcome: Estimate local cutoff effects while assessing assignment continuity,
        manipulation, bandwidth, functional form, covariate balance, and placebo cutoffs.
      includes:
      - Sharp and fuzzy discontinuities
      - Density and manipulation checks
      - Bandwidth and polynomial sensitivity
      - Local-effect interpretation
      excludes:
      - Parallel-trend designs
      - Instrumental variation away from a cutoff
      - Global extrapolation from a local effect
      prerequisites:
      - c07.models-time.econometrics.estimation
      sample_tasks:
      - kind: entry
        instruction: Specify and estimate a local economic regression with interpretable
          effects, robust uncertainty, and functional-form, heteroskedasticity, and
          influence checks; then add one density check for manipulation at the assignment
          cutoff.
      - kind: representative
        instruction: Specify and diagnose local regressions around an eligibility
          cutoff, estimate the discontinuity with robust uncertainty, test manipulation
          and covariate continuity, assess bandwidth and functional-form sensitivity,
          use placebo cutoffs, and interpret the effect as local to the threshold.
    - id: c07.models-time.forecasting
      kind: capability
      parent_id: c07.models-time
      name: Time-Series Forecasting
      outcome: Diagnose temporal structure, construct probabilistic forecasts without
        leakage, and compare them with suitable baselines under realistic backtests.
      includes:
      - Trend, seasonality, and lag dependence
      - Forecast and interval construction
      - Rolling-origin evaluation
      - Decision-relevant model selection
      excludes:
      - Cross-sectional causal identification
      - In-sample fit as forecast validation
      - Static descriptive charts only
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Identify the dominant seasonal pattern in a short series and
          produce one forecast from it.
      - kind: representative
        instruction: For one demand series, diagnose trend, seasonality, lag dependence,
          gaps, and breaks; build forecasts and intervals from that structure; and
          compare them with baselines using rolling origins, calibration, subgroup
          errors, and operational loss.
    - id: c07.models-time.forecasting.temporal-structure
      kind: capability
      parent_id: c07.models-time.forecasting
      name: Temporal Structure Analysis
      outcome: Identify time indexing, trend, seasonality, autocorrelation, structural
        breaks, missing intervals, and external-event patterns that constrain valid
        forecasting.
      includes:
      - Time indexing and spacing
      - Trend and seasonal decomposition
      - Lag dependence
      - Break, gap, and event diagnosis
      excludes:
      - Producing the final forecast
      - Cross-sectional association alone
      - Causal attribution of every temporal change
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Identify the dominant seasonal period in a regularly spaced series.
      - kind: representative
        instruction: Analyze a multiyear operational series for indexing and spacing,
          trend, multiple seasonalities, autocorrelation, missing intervals, a structural
          break, and plausible external-event effects, and state the implications
          for forecasting.
    - id: c07.models-time.forecasting.predictive-modeling
      kind: capability
      parent_id: c07.models-time.forecasting
      name: Forecast and Predictive-Uncertainty Construction
      outcome: Construct point and distributional forecasts from temporal features
        while preventing leakage and representing future-observation uncertainty.
      includes:
      - Lagged and seasonal predictors
      - Training-window discipline
      - Recursive and direct forecasts
      - Prediction intervals and distributions
      excludes:
      - Backtest-based model selection
      - Confidence intervals for fixed population parameters
      - Causal interpretation of forecast predictors
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Using a supplied seasonal rule and past observations only, produce
          a one-step forecast and prediction interval.
      - kind: representative
        instruction: Construct multi-horizon point and probabilistic forecasts for
          a seasonal series with exogenous inputs, defining leakage-free features
          and windows and explaining how parameter, innovation, and horizon uncertainty
          enter the prediction intervals.
    - id: c07.models-time.forecasting.evaluation
      kind: capability
      parent_id: c07.models-time.forecasting
      name: Forecast Backtesting and Selection
      outcome: Evaluate fully constructed probabilistic forecasts against suitable
        baselines using leakage-free rolling origins, calibration, subgroup errors,
        and decision-relevant loss.
      includes:
      - Rolling-origin backtesting
      - Baseline comparison
      - Point and interval metrics
      - Operational model selection
      excludes:
      - Random train-test splits for ordered data
      - In-sample accuracy as validation
      - Constructing only parameter confidence intervals
      prerequisites:
      - c07.models-time.forecasting.predictive-modeling
      sample_tasks:
      - kind: entry
        instruction: Construct leakage-free point and distributional forecasts with
          prediction intervals for a short seasonal series, then add one rolling-origin
          comparison against a seasonal-naive baseline.
      - kind: representative
        instruction: Construct multi-horizon point and probabilistic forecasts with
          leakage-free features and intervals, then compare them with suitable baselines
          over rolling origins, assess interval calibration and subgroup errors, and
          select a model using the stated operational loss.
    - id: c07.visualization-reporting
      kind: capability
      parent_id: null
      name: Visualization, Dashboards, and Reports
      outcome: Turn one analysis into faithful visual explanations, interactive monitoring
        views, and evidence-grounded reports tailored to a shared audience and decision.
      includes:
      - Statistical chart and infographic production
      - Dashboard design
      - Analytical reporting
      - Cross-format message consistency
      excludes:
      - Specialized scientific computation
      - Analysis-free decoration
      - Unrelated deliverables combined into a package
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Choose one faithful chart and write one evidence-supported sentence
          for a stated decision audience.
      - kind: representative
        instruction: Using one completed retention analysis and one management decision,
          create a faithful annotated visual summary, an interactive monitoring dashboard,
          and a concise analytical report that use consistent metrics, uncertainty,
          limitations, and recommendations.
    - id: c07.visualization-reporting.visualization
      kind: capability
      parent_id: c07.visualization-reporting
      name: Chart and Infographic Production
      outcome: Produce statistical charts and explanatory infographic compositions
        whose encodings, scales, annotations, hierarchy, and claims communicate quantitative
        evidence faithfully.
      includes:
      - Encoding and scale selection
      - Uncertainty and annotation
      - Accessible visual hierarchy
      - Chart-text integration
      excludes:
      - Numerically solving scientific models
      - Dashboard interaction architecture
      - Long-form analytical prose
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Specify the marks, axes, scale, and labels for a chart comparing
          a numeric outcome across three groups.
      - kind: representative
        instruction: Using one public-health dataset and explanatory message, construct
          a faithful chart showing the central comparison and uncertainty, then integrate
          that chart with concise annotations and supporting facts into an accessible
          infographic.
    - id: c07.visualization-reporting.visualization.chart-design
      kind: capability
      parent_id: c07.visualization-reporting.visualization
      name: Statistical Chart Design
      outcome: Select and construct chart encodings that faithfully reveal a stated
        distribution, comparison, relationship, uncertainty, or temporal pattern.
      includes:
      - Chart selection by analytical question
      - Axes, scales, marks, and legends
      - Uncertainty display
      - Accessibility and evidence-focused annotation
      excludes:
      - Infographic page hierarchy
      - Scientific simulation or ODE solving
      - Dashboard filtering behavior
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Choose and specify a chart for comparing one skewed outcome across
          categories.
      - kind: representative
        instruction: Create a compact, accessible chart suite for one analysis that
          shows data coverage, distributions, subgroup comparisons, multivariable
          relationships, temporal change, and uncertainty without misleading scales
          or clutter.
    - id: c07.visualization-reporting.visualization.infographic
      kind: capability
      parent_id: c07.visualization-reporting.visualization
      name: Infographic Composition
      outcome: Combine a faithful quantitative chart, calibrated claims, annotations,
        and visual hierarchy into a concise explanatory graphic for a defined audience.
      includes:
      - Message and reading-order hierarchy
      - Chart-text integration
      - Evidence-focused annotation
      - Uncertainty and limitation notes
      excludes:
      - Decorative illustration as the main product
      - Interactive dashboard controls
      - Long-form report structure
      prerequisites:
      - c07.visualization-reporting.visualization.chart-design
      - c07.models-time.model-assessment.evidence-claims
      sample_tasks:
      - kind: entry
        instruction: Construct a faithful, accessible chart with appropriate scales
          and uncertainty; state the supported finding, distinguish it from causal
          or mechanistic alternatives, and identify a limitation; then add a headline
          and reading order for a one-panel infographic.
      - kind: representative
        instruction: For one multifactor trend, construct accessible charts with faithful
          scales and uncertainty, calibrate the descriptive, predictive, and causal
          wording against alternative explanations and design limitations, and compose
          the charts, headline, annotations, and notes into a clear infographic.
    - id: c07.visualization-reporting.reporting
      kind: capability
      parent_id: c07.visualization-reporting
      name: Dashboard and Analytical Report Building
      outcome: Organize the same validated metrics and findings into an interactive
        monitoring dashboard and a decision-oriented analytical report.
      includes:
      - Metric and interaction design
      - Dashboard organization
      - Evidence-led narrative
      - Recommendations and limitations
      excludes:
      - Chart mechanics as the sole task
      - Raw data serialization
      - Dashboards and reports about unrelated questions
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Define one decision-relevant metric and express it as both a
          monitoring tile and a one-sentence analytical finding.
      - kind: representative
        instruction: For one service-quality decision, build a dashboard for recurring
          monitoring and a report explaining the same metrics, trends, segments, uncertainty,
          limitations, exceptions, and recommended action.
    - id: c07.visualization-reporting.reporting.dashboard
      kind: capability
      parent_id: c07.visualization-reporting.reporting
      name: Dashboard Design
      outcome: Design dashboards whose faithful charts, validated metrics, hierarchy,
        filters, states, and drill-downs support recurring monitoring and diagnosis.
      includes:
      - Metric definitions and ownership
      - Overview-to-detail layout
      - Filters, states, and drill-downs
      - Freshness, missingness, and alert communication
      excludes:
      - Static narrative reports
      - One-off exploratory notebooks
      - Metrics without definitions or decisions
      prerequisites:
      - c07.visualization-reporting.visualization.chart-design
      sample_tasks:
      - kind: entry
        instruction: Construct a faithful chart with appropriate marks, scales, labels,
          uncertainty, accessibility, and annotation for a monitoring question, then
          add one category filter with a clearly defined selected state.
      - kind: representative
        instruction: Construct faithful charts for an operational monitoring question,
          then organize them with validated metric definitions, overview indicators,
          trend and segment views, useful filters and drill-downs, explicit freshness
          and missing-data states, and decision-linked alert thresholds.
    - id: c07.visualization-reporting.reporting.analytical-report
      kind: capability
      parent_id: c07.visualization-reporting.reporting
      name: Analytical Report Writing
      outcome: Write a self-contained report connecting a question, data, methods,
        findings, uncertainty, limitations, and recommendations without exceeding
        the analysis.
      includes:
      - Question and method framing
      - Integrated tables and figures
      - Evidence-grounded findings
      - Proportionate recommendations
      excludes:
      - Raw analysis logs
      - Chart-only deliverables
      - Claims unsupported by the reported analysis
      prerequisites:
      - c07.data-foundations.eda
      - c07.visualization-reporting.visualization.chart-design
      - c07.models-time.model-assessment.evidence-claims
      sample_tasks:
      - kind: entry
        instruction: From one raw dataset, diagnose quality, summarize distributions
          and groups, and investigate conditioned relationships; construct a faithful
          chart with uncertainty; distinguish the supported result from causal and
          mechanistic alternatives; then add one decision recommendation and its principal
          limitation.
      - kind: representative
        instruction: Analyze one decision dataset through quality, distributional,
          grouped, and multivariable exploration; construct faithful tables and charts;
          calibrate descriptive, predictive, and causal claims against uncertainty
          and alternatives; and write a concise report covering the question, data,
          methods, findings, limitations, and proportionate recommendation.
- routing_facet: task_mechanic
  curriculum:
    version: wave3-1
    subject_id: C23
    subject_name: Technical Writing & Documentation
    sections:
    - id: c23
      kind: capability
      parent_id: null
      name: Technical Writing & Documentation
      outcome: Create accurate, usable, and maintainable technical documentation by
        planning for readers, organizing verified content, choosing an appropriate
        document form, and applying documentation standards.
      includes:
      - Audience, evidence, and information-architecture planning
      - API, data-model, and product reference documentation
      - Tutorials, how-to guides, technical explanations, and troubleshooting guides
      - Requirements, design proposals, and architecture decision records
      - Documentation revision, publishing compliance, and maintenance
      excludes:
      - Creative writing whose purpose is not technical communication
      - Domain problem solving without a documentation deliverable
      - Generic schema-instance generation or arbitrary instruction following
      - Unsupported claims presented as established facts
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a short fact sheet and a named reader, write one accurate
          paragraph explaining what the described tool does and why that reader would
          use it.
      - kind: representative
        instruction: 'Given one release dossier for a connected weather station, publish
          a coherent documentation set for that release: plan it around the stated
          readers, document the device and its interface, guide an operator through
          a key task, record the governing design decision, and revise the affected
          material under the supplied documentation standard and product change.'
    - id: c23.planning
      kind: capability
      parent_id: c23
      name: Documentation Planning
      outcome: Plan documentation around defined readers and tasks, controlled technical
        claims, appropriate document forms, and a navigable information structure.
      includes:
      - Reader knowledge, constraints, goals, and tasks
      - Content inventories and claim traceability
      - Selection of document forms
      - Page boundaries, hierarchy, navigation, and cross-references
      excludes:
      - Drafting complete reference, instructional, or design documents
      - Visual branding and promotional positioning
      - Project plans unrelated to documentation content
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a product description and two possible readers, identify
          the primary reader and the single task the first document should support.
      - kind: representative
        instruction: Given one set of notes for a developer tool, produce a documentation
          plan that defines its reader groups and tasks, separates supported claims
          from assumptions and unresolved questions, selects suitable document forms,
          and organizes the resulting pages into one navigable structure.
    - id: c23.planning.audience
      kind: capability
      parent_id: c23.planning
      name: Audience and Task Analysis
      outcome: Translate reader roles, prior knowledge, operating constraints, and
        goals into concrete documentation requirements.
      includes:
      - Primary and secondary readers
      - Assumed knowledge
      - Reader goals and operating context
      - Information needed before, during, and after a task
      excludes:
      - Writing the final procedure or reference page
      - Market segmentation based only on purchasing behavior
      - Inventing reader needs unsupported by the brief
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given one reader role and one product goal, state the reader's
          likely starting knowledge and immediate information need.
      - kind: representative
        instruction: Analyze the operators, integrators, and maintainers of one service,
          defining each group's goals, prior knowledge, constraints, risks, and information
          needs before, during, and after its tasks.
    - id: c23.planning.evidence
      kind: capability
      parent_id: c23.planning
      name: Content Evidence and Claim Control
      outcome: Distinguish established facts, permitted inferences, author choices,
        and unknowns so technical claims remain accurate and traceable.
      includes:
      - Fact extraction and claim inventories
      - Claim-to-evidence traceability
      - Explicit assumptions and uncertainty
      - Conflict and gap identification
      excludes:
      - Independent factual research not requested by the task
      - Schema validation as the primary operation
      - Copyediting claims without checking their support
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Classify each statement in a short technical brief as an established
          fact, permitted inference, author choice, or unresolved question.
      - kind: representative
        instruction: From partially conflicting engineering notes about one feature,
          build a claim inventory that preserves supported facts, labels inferences
          and author choices, identifies contradictions and gaps, and lists the questions
          that must be resolved before publication.
    - id: c23.planning.structure
      kind: capability
      parent_id: c23.planning
      name: Information Architecture
      outcome: Organize technical content into discoverable document units whose sequence,
        hierarchy, navigation, and cross-references match reader tasks.
      includes:
      - Page and section boundaries
      - Heading hierarchy and sequencing
      - Progressive disclosure
      - Navigation and cross-reference plans
      excludes:
      - Sentence-level prose revision
      - Interface design outside the documentation system
      - Organization based only on the order in which notes arrived
      prerequisites:
      - c23.planning.audience
      sample_tasks:
      - kind: entry
        instruction: Given a brief for primary and secondary readers, first derive
          their prior knowledge, constraints, goals, and information needs; then add
          a two-level heading sequence for one shared task.
      - kind: representative
        instruction: For one product, analyze the goals, prior knowledge, constraints,
          and information needs of first-time users, routine operators, and maintainers,
          then design page boundaries, heading hierarchies, navigation, progressive
          disclosure, and cross-references around their tasks.
    - id: c23.reference
      kind: capability
      parent_id: c23
      name: API and Reference Documentation
      outcome: Produce precise, consistently structured lookup documentation for callable
        interfaces, data models, and existing products.
      includes:
      - API operations, functions, commands, and events
      - Fields, objects, enumerations, invariants, and errors
      - Product characteristics, compatibility, capacities, and limits
      - Consistent terminology and lookup structure
      excludes:
      - Schema-valid data instances whose main purpose is record generation
      - Learning-oriented walkthroughs
      - Diagnostic narratives organized around symptoms
      - Design arguments and future-system requirements
      prerequisites:
      - c23.planning
      sample_tasks:
      - kind: entry
        instruction: Given notes for a small device, first produce a documentation
          plan defining readers and tasks, controlling claims, selecting document
          forms, and outlining navigation; then add one concise reference entry for
          a configuration field.
      - kind: representative
        instruction: For one networked monitoring device, first plan its documentation
          around reader tasks, controlled claims, document forms, and navigation;
          then create an integrated lookup package covering a device operation, the
          event model returned by that operation, and the device characteristics and
          limits needed to use both correctly.
    - id: c23.reference.operations
      kind: capability
      parent_id: c23.reference
      name: API Operation Reference
      outcome: Document callable operations so readers can identify their purpose,
        invocation requirements, behavior, results, errors, and constraints without
        reconstructing them from implementation details.
      includes:
      - Endpoints, functions, commands, and events
      - Parameters and invocation conditions
      - Return values, events, and observable effects
      - Operation-specific errors, limits, and minimal examples
      excludes:
      - Full data-model catalogs
      - Step-by-step application tutorials
      - Implementation internals that do not affect callers
      prerequisites:
      - c23.planning.audience
      - c23.planning.evidence
      sample_tasks:
      - kind: entry
        instruction: Given caller briefs and partially conflicting interface notes,
          first derive the readers' roles, knowledge, constraints, goals, and information
          needs and classify the notes as facts, inferences, choices, conflicts, or
          unknowns; then document one operation's purpose, required input, and result.
      - kind: representative
        instruction: For one asynchronous operation, analyze its primary and secondary
          callers and build a controlled claim inventory from the interface definition,
          test observations, and engineering notes; then write a reference entry covering
          invocation, parameters, authentication, side effects, response behavior,
          errors, limits, and a minimal example.
    - id: c23.reference.data-models
      kind: capability
      parent_id: c23.reference
      name: Data Model Reference
      outcome: Document structured data contracts with unambiguous field semantics,
        constraints, nesting, allowed values, relationships, and invariants.
      includes:
      - Objects and nested properties
      - Required and optional fields
      - Types, formats, ranges, and enumerations
      - Cross-field invariants and error representations
      excludes:
      - Producing a particular data instance as the main deliverable
      - Database design rationale
      - API operation sequencing
      prerequisites:
      - c23.planning.evidence
      sample_tasks:
      - kind: entry
        instruction: Given model notes that contain facts, an inference, a conflict,
          and an unknown, first build a claim inventory that distinguishes each; then
          document one supported field's meaning, type, required status, and allowed
          range.
      - kind: representative
        instruction: Reconcile the facts, inferences, choices, conflicts, and gaps
          in the notes for one nested event model, then produce its reference covering
          every field, required status, type, format, enumeration, relationship, cross-field
          invariant, and invalid or unavailable value representation.
    - id: c23.reference.product-specifications
      kind: capability
      parent_id: c23.reference
      name: Product Specifications
      outcome: Turn verified facts about an existing product into a complete, consistently
        organized technical specification that supports comparison and implementation
        decisions.
      includes:
      - Hardware and software characteristics
      - Capacities, dimensions, compatibility, and environmental limits
      - Feature-specific qualifications
      - Normalized units and consistent category structure
      excludes:
      - Promotional feature claims
      - Requirements for a product that has not yet been designed
      - Narrative setup instructions
      prerequisites:
      - c23.planning.evidence
      sample_tasks:
      - kind: entry
        instruction: Given a small set of product notes containing supported facts,
          an inference, and an unavailable value, first classify every claim and identify
          the gap; then render the supported facts as one labeled specification block
          with normalized units.
      - kind: representative
        instruction: Build a controlled claim inventory from the engineering notes
          for one portable computing device, then write a technical specification
          organized across processing, display, cameras, sensors, connectivity, power,
          ports, environmental limits, and supported media, qualifying inferences
          and marking unavailable values.
    - id: c23.guides
      kind: capability
      parent_id: c23
      name: Instructional and Support Documentation
      outcome: Create coordinated task-oriented and learning-oriented documentation
        that helps readers understand a system, complete goals, and recover from problems.
      includes:
      - How-to guides
      - Tutorials
      - Technical explanations
      - Troubleshooting guides
      excludes:
      - Lookup-only reference catalogs
      - Design approval records
      - Procedures that omit prerequisites, outcomes, or consequential warnings
      - Solutions whose central operation is diagnosing or implementing an unstated
        technical fix
      prerequisites:
      - c23.planning
      sample_tasks:
      - kind: entry
        instruction: Given notes for a small service, first plan its documentation
          around readers, tasks, controlled claims, document forms, and navigation;
          then add a short procedure with a goal, one prerequisite, ordered actions,
          and an observable result.
      - kind: representative
        instruction: For one small service and its deployment workflow, first create
          a documentation plan; then produce a coordinated support guide in which
          a conceptual overview motivates an onboarding tutorial, the tutorial leads
          to a focused operational how-to, and a troubleshooting section diagnoses
          failures of that same workflow using consistent terminology and cross-references.
    - id: c23.guides.how-to
      kind: capability
      parent_id: c23.guides
      name: How-To Guides
      outcome: Write concise procedures that help a prepared reader accomplish a specific
        technical goal safely and verify the result.
      includes:
      - Goals and prerequisites
      - Ordered actions
      - Decision points and consequential warnings
      - Observable completion checks
      excludes:
      - Broad conceptual teaching
      - Exhaustive parameter reference
      - Open-ended diagnosis before a cause is known
      prerequisites:
      - c23.planning.audience
      sample_tasks:
      - kind: entry
        instruction: Given briefs for primary and secondary operators plus a verified
          three-action workflow, first derive their knowledge, constraints, goals,
          and information needs; then write the ordered actions and one observable
          completion check for the primary operator.
      - kind: representative
        instruction: Analyze the roles, prior knowledge, constraints, goals, and before-during-after
          information needs of people running a command-line data export, then write
          a focused guide with prerequisites, exact action order, decision points,
          a consequential warning, and checks confirming that the intended file was
          produced.
    - id: c23.guides.tutorials
      kind: capability
      parent_id: c23.guides
      name: Tutorials
      outcome: Guide a learner through a complete, achievable experience that builds
        transferable understanding through sequenced practice, explanation, and checkpoints.
      includes:
      - Learning goals and prerequisites
      - A coherent running example
      - Scaffolded steps and explanations
      - Intermediate and final checkpoints
      - Transfer exercises
      excludes:
      - Unexplained command sequences
      - Comprehensive reference coverage
      - Troubleshooting organized primarily by failure symptom
      prerequisites:
      - c23.guides.how-to
      - c23.planning.audience
      sample_tasks:
      - kind: entry
        instruction: Given learner briefs and a verified workflow, first analyze the
          learners' knowledge, constraints, goals, and information needs and write
          a complete short how-to with prerequisites, ordered actions, any consequential
          warning, and a completion check; then add one checkpoint explaining why
          a key action matters.
      - kind: representative
        instruction: For one first-use application, analyze the novice and supporting
          reader roles and develop the complete safe procedure they need, then turn
          that procedure into a tutorial in which one running example is built, run,
          inspected, and modified through progressive explanations, checkpoints, and
          a final transfer exercise.
    - id: c23.guides.explanations
      kind: capability
      parent_id: c23.guides
      name: Technical Explanations
      outcome: Explain supported technical behavior, distinctions, and tradeoffs so
        a defined reader can reason about when and why to use an approach.
      includes:
      - Mechanisms and causal relationships
      - Comparisons of alternatives
      - Context-dependent recommendations
      - Limits, uncertainty, and qualifications
      excludes:
      - Procedures whose main purpose is task completion
      - Reference entries organized by symbols or fields
      - Technical conclusions that must be discovered rather than explained
      - Unsupported universal performance or compatibility claims
      prerequisites:
      - c23.planning.audience
      - c23.planning.evidence
      sample_tasks:
      - kind: entry
        instruction: Given reader briefs and engineering notes containing verified
          behavior, an inference, a conflict, and a gap, first derive the readers'
          documentation requirements and classify every claim; then explain one supported
          distinction and one practical consequence in a short paragraph.
      - kind: representative
        instruction: Given reader briefs, behavior descriptions, compatibility results,
          and benchmark measurements for three queue-backpressure strategies, analyze
          the readers and establish which claims are supported, inferred, conflicting,
          or unknown; then explain the mechanisms and tradeoffs and give a qualified
          recommendation for the stated operating context.
    - id: c23.guides.troubleshooting
      kind: capability
      parent_id: c23.guides
      name: Troubleshooting Guides
      outcome: Lead readers from an observable symptom through discriminating checks
        to supported causes, safe corrective procedures, recovery confirmation, and
        escalation.
      includes:
      - Reproducible symptom descriptions
      - Diagnostic questions and tests
      - Cause-specific corrective procedures
      - Recovery verification and escalation evidence
      excludes:
      - Lists of generic fixes with no diagnostic path
      - Implementation tutorials for systems that are working normally
      - Speculative causes presented as confirmed
      - Diagnosis that depends on technical facts absent from the task
      prerequisites:
      - c23.guides.how-to
      - c23.planning.evidence
      sample_tasks:
      - kind: entry
        instruction: Given service notes and observations for one symptom with two
          supported causes, first classify the claims and write a complete safe corrective
          procedure for each cause with prerequisites, warnings, ordered actions,
          and recovery checks; then add one diagnostic check that routes the reader
          to the applicable procedure.
      - kind: representative
        instruction: Using supplied logs, lifecycle facts, and tested remedies for
          intermittent stale responses in one client-server application, control the
          claims and write the complete corrective procedures before organizing them
          into a symptom-driven guide with reproduction steps, discriminating cache
          and response-order checks, cause-specific remedies, recovery verification,
          and escalation evidence.
    - id: c23.design
      kind: capability
      parent_id: c23
      name: Specifications and Design Documents
      outcome: Document what a proposed system must accomplish, evaluate how it could
        be built, and preserve the rationale and consequences of the selected design.
      includes:
      - Testable requirements
      - Design proposals and alternatives
      - Tradeoff analysis
      - Architecture decision records
      excludes:
      - Specifications of an existing product as lookup reference
      - Implementation tutorials
      - Project status reporting without design content
      prerequisites:
      - c23.planning
      sample_tasks:
      - kind: entry
        instruction: Given notes for a proposed service, first produce a documentation
          plan defining readers and tasks, controlling claims, selecting document
          forms, and outlining navigation; then add one measurable design objective
          and one governing constraint.
      - kind: representative
        instruction: For one proposed event-processing service, first plan the design
          documentation around its stakeholders, evidence, document forms, and navigation;
          then produce one design dossier that carries the same needs through testable
          requirements, comparison of candidate architectures, and a decision record
          preserving the selected architecture, rationale, and consequences.
    - id: c23.design.requirements
      kind: capability
      parent_id: c23.design
      name: Technical Requirements
      outcome: Convert supported stakeholder and operational needs into atomic, unambiguous,
        feasible, traceable, and verifiable requirements.
      includes:
      - Functional requirements
      - Quality attributes
      - Interfaces and constraints
      - Acceptance criteria and traceability
      excludes:
      - Implementation choices not required by a stated constraint
      - Current-product feature catalogs
      - Vague aspirations without measurable conditions
      prerequisites:
      - c23.planning.audience
      - c23.planning.evidence
      sample_tasks:
      - kind: entry
        instruction: Given stakeholder briefs and engineering notes, first derive
          the readers' roles, knowledge, constraints, goals, and information needs
          and classify claims, inferences, choices, conflicts, and gaps; then express
          one supported need as an atomic requirement with a measurable acceptance
          condition.
      - kind: representative
        instruction: Analyze the stakeholders and control the claims in the brief
          for one shared capture service, then write traceable requirements covering
          functional behavior, latency, reliability, security, compatibility, interfaces,
          and operational constraints, with atomic statements and verifiable acceptance
          criteria.
    - id: c23.design.proposals
      kind: capability
      parent_id: c23.design
      name: Design Proposals
      outcome: Present a technical problem, constraints, candidate designs, tradeoffs,
        recommendation, and implementation consequences clearly enough for informed
        review.
      includes:
      - Problem, goals, and non-goals
      - Current context and constraints
      - Viable alternatives and tradeoffs
      - Recommended design, rollout implications, and unresolved questions
      excludes:
      - Decisions stated without alternatives or rationale
      - Detailed implementation manuals
      - Requirements lists with no design response
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given traceable functional, quality, interface, and constraint
          requirements for one narrowly scoped feature, compare two supplied approaches
          on one decisive tradeoff and recommend one.
      - kind: representative
        instruction: Given a complete traceable requirements set for one data-ingestion
          change, write a design proposal covering context, goals and non-goals, candidate
          architectures, tradeoffs, the recommended design, failure handling, migration,
          observability, and unresolved questions.
    - id: c23.design.decisions
      kind: capability
      parent_id: c23.design
      name: Architecture Decision Records
      outcome: Preserve a settled technical decision with enough context, alternatives,
        rationale, status, and consequences for later maintainers to understand and
        revisit it.
      includes:
      - Decision context and status
      - Considered alternatives
      - Chosen option and rationale
      - Positive and negative consequences
      - Supersession and reconsideration conditions
      excludes:
      - Open proposals with no decision
      - Meeting transcripts
      - Restating implementation details without rationale
      prerequisites:
      - c23.design.proposals
      sample_tasks:
      - kind: entry
        instruction: For one narrow design question, first write a concise proposal
          stating the problem, goals, constraints, alternatives, tradeoffs, recommendation,
          and implementation consequence; then add the settled status, chosen option,
          and one reason to reconsider it.
      - kind: representative
        instruction: For one architecture choice, first create a reviewable proposal
          from the supplied problem, constraints, candidate designs, tradeoffs, and
          implementation implications; then convert the approved choice into a decision
          record preserving the governing requirements, rejected alternatives, rationale,
          status, consequences, and reconsideration conditions.
    - id: c23.quality
      kind: capability
      parent_id: c23
      name: Documentation Quality and Maintenance
      outcome: Deliver documentation that follows documentation-specific publishing
        constraints, communicates supported content clearly and consistently, and
        remains accurate as the documented system changes.
      includes:
      - Documentation templates and delivery requirements
      - Correctness, clarity, concision, and terminology revision
      - Change-impact analysis
      - Version, compatibility, navigation, and cross-reference maintenance
      excludes:
      - Changing system behavior to match incorrect documentation
      - Cosmetic editing that preserves a known factual error
      - Arbitrary output constraints unrelated to a documentation system
      - Unrequested expansion of document scope
      prerequisites:
      - c23.planning
      sample_tasks:
      - kind: entry
        instruction: Given notes for a short guide, first plan the documentation around
          readers, controlled claims, document form, hierarchy, and navigation; then
          render one section under a supplied heading and terminology rule without
          changing its meaning.
      - kind: representative
        instruction: For one versioned operator guide and one product-option rename,
          first plan the documentation update, then revise the guide's supported content
          for clarity and consistency, render it under the supplied publishing template,
          and propagate the rename through its version notice, navigation, and cross-references.
    - id: c23.quality.constraints
      kind: capability
      parent_id: c23.quality
      name: Documentation Format and Delivery Compliance
      outcome: Transform technically complete documentation into a required documentation
        template, serialization, or publishing form without changing or omitting its
        supported meaning.
      includes:
      - Documentation templates and front matter
      - Heading, section, and ordering rules
      - Terminology, code-block, link, and cross-reference conventions
      - Required documentation file or serialization format
      excludes:
      - Solving or implementing the underlying technical problem
      - Artificial lexical wrappers, boundary words, or paragraph games unrelated
        to documentation practice
      - Schema-valid non-document records
      - Sacrificing technical correctness to satisfy presentation constraints
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a technically complete installation note, reformat it under
          a supplied documentation template with a required title and two headings
          while preserving every supported claim.
      - kind: representative
        instruction: Transform a technically complete developer guide into the supplied
          publishing form, applying its front matter, heading order, terminology,
          code-fence placement, link syntax, cross-reference convention, and file-boundary
          requirements without altering the guide's technical meaning.
    - id: c23.quality.revision
      kind: capability
      parent_id: c23.quality
      name: Technical Revision
      outcome: Revise technical prose and structure to improve correctness, clarity,
        concision, consistency, and task usability for the intended reader while preserving
        supported meaning.
      includes:
      - Ambiguity removal
      - Terminology and voice consistency
      - Removal of unsupported or redundant content
      - Reordering around reader tasks
      - Preservation of precise technical meaning
      excludes:
      - Pure proofreading limited to spelling
      - Adding facts absent from the evidence
      - Rewriting to a different document type without need
      prerequisites:
      - c23.planning.audience
      - c23.planning.evidence
      sample_tasks:
      - kind: entry
        instruction: Given primary and secondary reader briefs, a short draft, and
          engineering notes, first derive the readers' requirements and classify the
          draft's claims, inferences, choices, conflicts, and gaps; then revise one
          ambiguous sentence so its actor, action, condition, and result are clear
          without changing the supported meaning.
      - kind: representative
        instruction: Analyze the readers and control the claims for one developer
          guide, then revise the guide by correcting unsupported statements, resolving
          terminology conflicts, removing redundancy, clarifying conditions and warnings,
          and reorganizing the supported material around the readers' tasks.
    - id: c23.quality.maintenance
      kind: capability
      parent_id: c23.quality
      name: Documentation Maintenance
      outcome: Update a versioned documentation set after system changes while preserving
        clarity, consistency, traceability, working navigation, and an accurate account
        of compatibility impact.
      includes:
      - Change-impact analysis
      - Version and compatibility updates
      - Cross-reference and navigation repair
      - Deprecation and migration notices
      - Documentation change records
      excludes:
      - Unrelated cleanup across unchanged pages
      - Compatibility promises unsupported by the product
      - Replacing historical decisions with current conclusions
      prerequisites:
      - c23.quality.revision
      sample_tasks:
      - kind: entry
        instruction: Given a short guide with accuracy, clarity, concision, consistency,
          and task-order problems, first revise the whole guide while preserving supported
          meaning; then propagate one supplied option rename to its single incoming
          cross-reference.
      - kind: representative
        instruction: Given one versioned documentation set, its reader and evidence
          briefs, and one release change, first revise the affected material for correctness,
          clarity, concision, consistency, and task usability; then propagate the
          change through compatibility statements, migration guidance, examples, navigation,
          cross-references, and the documentation change record without altering unaffected
          content.
- routing_facet: task_mechanic
  curriculum:
    version: wave2-2
    subject_id: C25
    subject_name: Knowledge Application & QA
    sections:
    - id: c25
      kind: capability
      parent_id: null
      name: Knowledge Application & QA
      outcome: Answer applied and factual questions, ground answers in relevant evidence
        when available, verify claims and reasoning, and explain conclusions in a
        form that supports understanding.
      includes:
      - Closed-book factual and conceptual QA
      - Application of supplied or recalled knowledge
      - Single-source and multi-source QA
      - Claim and reasoning verification
      - Worked explanation and misconception repair
      excludes:
      - Open-ended literature reviews
      - Original empirical research or execution of experiments
      - Domain-specific professional action beyond answering, checking, and explaining
        questions
      - Answer-format and file-handling mechanics
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Answer a short question by selecting one relevant supplied principle
          and using it in one immediate inference.
      - kind: representative
        instruction: 'Resolve one learner''s disputed safety question using the same
          case file throughout: answer the applied question, retrieve and connect
          the relevant passages, assess whether the cited evidence and reasoning support
          the answer, correct any defect, and explain the conclusion to the learner.'
    - id: c25.1
      kind: capability
      parent_id: c25
      name: Applied Question Answering
      outcome: Select or recall relevant knowledge and transform it through quantitative,
        model-based, causal, rule-governed, or hypothesis-comparison reasoning into
        a defensible answer.
      includes:
      - Questions using supplied knowledge
      - Closed-book factual and conceptual questions
      - Direct calculations and model approximations
      - Mechanistic predictions
      - Conditional rules and discriminating tests
      excludes:
      - Searching a document collection for missing information
      - Assessing source trustworthiness
      - Auditing another answer as the primary task
      - Personalizing instruction to a learner
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a familiar principle and a new case, identify the principle
          and state its immediate implication.
      - kind: representative
        instruction: 'Resolve whether one heat-treatment process caused a component
          failure: recall the relevant material property, select facts from the case
          description, calculate the operating margin, simplify the supplied response
          model in the stated regime, trace the proposed failure mechanism, apply
          the acceptance rule, and identify one observation that distinguishes the
          two proposed causes before making a single disposition decision.'
    - id: c25.1.1
      kind: capability
      parent_id: c25.1
      name: Context-Supplied Knowledge Selection
      outcome: Identify the supplied fact, definition, property, or principle that
        directly governs a question and state the immediate answer it supports.
      includes:
      - Matching question cues to supplied concepts
      - Selecting among plausible supplied principles
      - Rejecting related but irrelevant information
      - One-step implications of selected knowledge
      excludes:
      - Recalling information absent from the task
      - Multi-step calculations
      - Extended causal chains
      - Searching long or distributed documents
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given one definition and four cases, select the case that satisfies
          the definition.
      - kind: representative
        instruction: Given a compact reference card containing several related properties,
          answer a conceptual question by selecting the governing property, rejecting
          the nearest distractor, and stating its immediate implication.
    - id: c25.1.2
      kind: capability
      parent_id: c25.1
      name: Quantitative Relation Application
      outcome: Select and combine stated or elementary quantitative relations to calculate
        a requested quantity in a well-defined applied problem.
      includes:
      - Identifying necessary quantities
      - Translating verbal conditions into equations
      - Arithmetic, rates, differences, parity, and conservation
      - Short dependency schedules and constraint calculations
      - Interpreting units and results
      excludes:
      - Asymptotic model reduction or perturbative linearization
      - Pure theorem proving
      - Numerical simulation
      - Calculations whose governing relation is unavailable
      prerequisites:
      - c25.1.1
      sample_tasks:
      - kind: entry
        instruction: From a short specification, identify the governing relation and
          relevant given quantities, then perform one substitution to obtain the requested
          value.
      - kind: representative
        instruction: Determine the minimum completion time for a small production
          schedule by selecting the stated timing and dependency rules, combining
          the required intermediate calculations, respecting resource constraints,
          and interpreting the final value.
    - id: c25.1.3
      kind: capability
      parent_id: c25.1
      name: Mechanistic Process Inference
      outcome: Use a supplied causal or process model to trace how components, conditions,
        or interventions produce an outcome through an ordered mechanism.
      includes:
      - Ordered pathways and processes
      - Regulatory and feedback effects
      - Intervention comparisons
      - Predictions from component removal or alteration
      - Ruling out explanations inconsistent with the supplied model
      excludes:
      - Interpretation that depends on an unstated specialist theory
      - Correlation-only explanations
      - Calculations without a causal claim
      - Choosing among mechanisms by gathering new evidence
      prerequisites:
      - c25.1.1
      sample_tasks:
      - kind: entry
        instruction: From a supplied three-step pathway, select the link affected
          by removing one component and predict the first downstream change.
      - kind: representative
        instruction: Using a supplied regulatory model, compare two intervention conditions
          and explain the observed output by tracing the affected component, intermediate
          states, feedback response, and final system change.
    - id: c25.1.4
      kind: capability
      parent_id: c25.1
      name: Conditional Rule Application
      outcome: Apply supplied definitions, thresholds, exceptions, and interacting
        rules to determine the result for a concrete case.
      includes:
      - Eligibility and classification criteria
      - Rules with explicit exceptions
      - Conflicting or additional terms
      - Threshold-based decisions
      - Priority decisions under stated conditions
      excludes:
      - Recalling specialist rules not supplied in the task
      - Drafting policies or contracts
      - Predicting outcomes when controlling rules are unspecified
      - Verifying whether a rule is current
      prerequisites:
      - c25.1.1
      sample_tasks:
      - kind: entry
        instruction: Select the governing rule from a short rule card, state its baseline
          result, and apply one explicit exception to a simple case.
      - kind: representative
        instruction: Decide one applicant's eligibility under a supplied policy by
          applying its definitions, interacting thresholds, priority rule, and exception
          while explaining which case facts trigger each provision.
    - id: c25.1.5
      kind: capability
      parent_id: c25.1
      name: Competing-Hypothesis Discrimination
      outcome: Trace the distinct predictions of specified causal hypotheses and design
        a bounded observation or experiment that can distinguish them.
      includes:
      - Contrasting predicted outcomes
      - Intervention, labeling, timing, and intermediate-trapping probes
      - Controls tied to a stated comparison
      - Separating shared outcomes from diagnostic evidence
      - Bounded experimental designs for specified hypotheses
      excludes:
      - Executing an experiment or collecting new data
      - Open-ended research programs
      - Merely listing possible mechanisms
      - Claim verification based on existing documents
      prerequisites:
      - c25.1.3
      sample_tasks:
      - kind: entry
        instruction: Trace each of two supplied one-step mechanisms to its predicted
          result under the same intervention, then choose the single measurement that
          separates those predictions.
      - kind: representative
        instruction: For one reaction that two supplied mechanisms predict will yield
          the same final product, design a controlled labeling-and-trapping experiment,
          derive each mechanism's predicted observations, specify the shared control,
          and state which result would discriminate between them.
    - id: c25.1.6
      kind: capability
      parent_id: c25.1
      name: Closed-Book Factual and Conceptual QA
      outcome: Retrieve facts, definitions, conventions, and governing principles
        from learned knowledge across varied domains and use them to answer direct
        or short-application questions.
      includes:
      - Dated factual recall
      - Recognition of definitions and standard equations
      - Recall of specialist principles and rules
      - Short applications whose governing knowledge is not supplied
      - Calibrated acknowledgment when precise recall is unavailable
      excludes:
      - Tasks that supply all governing knowledge
      - Document retrieval
      - Multi-step modeling as the central operation
      - Unsupported invention of precise facts
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Answer one direct question about a commonly taught fact or definition
          without a reference passage.
      - kind: representative
        instruction: Answer a short mixed-domain set containing direct factual questions,
          concept recognition items, and one-step cases that require recalling the
          governing principle, while marking any item for which the requested precision
          cannot be recalled reliably.
    - id: c25.1.7
      kind: capability
      parent_id: c25.1
      name: Model Transformation and Approximation
      outcome: Transform a quantitative model by choosing a useful representation,
        approximation, or order of analysis and derive the resulting relation within
        its stated regime.
      includes:
      - Linearization
      - Small-parameter order counting
      - Symbolic model reduction
      - Symmetry and parity simplifications
      - Justifying neglected terms
      excludes:
      - Direct substitution into an unchanged relation
      - Unjustified deletion of inconvenient terms
      - General numerical simulation
      - Approximations outside their stated regime
      prerequisites:
      - c25.1.2
      sample_tasks:
      - kind: entry
        instruction: Select and combine the relevant relations from a short model
          specification, then apply one stated first-order approximation and identify
          the term that becomes negligible.
      - kind: representative
        instruction: Derive a small-deviation model for a nonlinear oscillator by
          selecting the governing equations, expanding the nonlinear terms to the
          required order, combining coefficients, justifying every discarded term,
          and interpreting the simplified dynamics.
    - id: c25.2
      kind: capability
      parent_id: c25
      name: Source-Grounded Question Answering
      outcome: Locate information in one or more provided sources, connect complementary
        evidence when needed, and account for source quality when answering a question.
      includes:
      - Single-source retrieval
      - Cross-document joins
      - Entity, terminology, time, and scope alignment
      - Source provenance and independence
      - Answers bounded by available evidence
      excludes:
      - Closed-book answers unsupported by the provided material
      - Open-ended literature surveys
      - Full claim audits that classify reasoning defects
      - Treating agreement alone as proof of reliability
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Locate an explicitly stated fact in one short passage and use
          it to answer a narrowly scoped question.
      - kind: representative
        instruction: Answer one eligibility question from a compact document packet
          by retrieving the relevant provisions and case records, joining facts across
          documents, reconciling names and effective dates, evaluating the provenance
          and independence of the decisive records, and stating the evidence-bounded
          conclusion.
    - id: c25.2.1
      kind: capability
      parent_id: c25.2
      name: Targeted Evidence Retrieval
      outcome: Find the passage or record that directly supplies a requested fact,
        definition, condition, or relationship while respecting entity, time, and
        scope.
      includes:
      - Query decomposition
      - Synonym and paraphrase matching
      - Locating explicit statements
      - Distinguishing similar entities, dates, and conditions
      - Returning the evidence relevant to the question
      excludes:
      - Combining evidence from multiple sources
      - Inferring absent facts
      - Evaluating general source credibility
      - Deciding whether a broader claim is true
      prerequisites:
      - c25.1.1
      sample_tasks:
      - kind: entry
        instruction: Identify the requested fact type, then find its explicit paraphrase
          among several sentences in one short document.
      - kind: representative
        instruction: Given several similar records, retrieve the passage that answers
          one narrowly scoped question and explain why records concerning neighboring
          entities, dates, or conditions do not apply.
    - id: c25.2.2
      kind: capability
      parent_id: c25.2
      name: Cross-Source Inference
      outcome: Retrieve and combine complementary facts from multiple sources into
        a coherent answer while preserving each fact's scope and uncertainty.
      includes:
      - Two-hop and multi-hop joins
      - Coreference across documents
      - Terminology reconciliation
      - Event ordering
      - Combining a rule document with case records
      excludes:
      - Simple extraction from one passage
      - Averaging irreconcilable claims
      - Adding unsupported bridge assumptions
      - Judging source credibility as the primary operation
      prerequisites:
      - c25.2.1
      sample_tasks:
      - kind: entry
        instruction: Retrieve one relevant fact from each of two short passages and
          join them through their shared entity to answer a question neither passage
          resolves alone.
      - kind: representative
        instruction: Determine how one policy applies to an event by retrieving provisions
          and facts from several documents, resolving a renamed entity, ordering the
          effective dates, applying an exception, and preserving an unresolved qualification
          in the answer.
    - id: c25.2.3
      kind: capability
      parent_id: c25.2
      name: Source Quality and Corroboration
      outcome: Assess how provenance, expertise, recency, independence, and primary
        evidence affect the weight given to information relevant to a question.
      includes:
      - Primary versus derivative evidence
      - Author expertise and access to facts
      - Currency and scope
      - Independence among apparently separate sources
      - Corroboration weighted by source quality
      excludes:
      - Assuming authority from presentation style
      - Counting repeated claims as independent confirmation
      - Textual entailment without evaluating the source
      - General media criticism unrelated to a question
      prerequisites:
      - c25.2.1
      sample_tasks:
      - kind: entry
        instruction: Retrieve the direct answer from each of two short records, then
          use one disclosed provenance difference to decide which record deserves
          more weight.
      - kind: representative
        instruction: For one disputed historical date, locate the relevant statements
          in a primary record, an expert synthesis, and two derivative articles; assess
          expertise, recency, scope, and dependence among them before ranking the
          evidence.
    - id: c25.3
      kind: capability
      parent_id: c25
      name: Claim and Reasoning Verification
      outcome: Determine whether evidence and reasoning support a claim, distinguish
        contradiction from missing support, assess consequential defects, and issue
        a calibrated correction or verdict.
      includes:
      - Evidence-to-claim checks
      - Source-aware fact-checking
      - Calculation, mechanism, and rule audits
      - Uncertainty-calibrated verdicts
      - Minimal warranted corrections
      excludes:
      - Content moderation
      - Stylistic critique
      - Treating source agreement alone as proof
      - Inventing evidence to settle an unresolved claim
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a claim, its cited passage, and a short rationale, decide
          whether the passage supports the claim and identify one decisive mismatch
          if it does not.
      - kind: representative
        instruction: 'Audit one public safety explainer containing factual claims,
          citations, a calculation, a causal account, and a rule-based recommendation:
          check each citation''s relation to its claim, assess corroboration and source
          quality, trace the reasoning, identify the first consequential defects,
          and issue one calibrated corrected verdict.'
    - id: c25.3.1
      kind: capability
      parent_id: c25.3
      name: Evidence-to-Claim Checking
      outcome: Determine whether retrieved evidence entails, contradicts, or fails
        to establish specific factual claims after matching entity, quantity, date,
        and scope.
      includes:
      - Atomic claim decomposition
      - Direct and indirect support
      - Contradictory evidence
      - Scope and date matching
      - Insufficient-evidence classifications
      excludes:
      - Assessing source trustworthiness
      - Auditing calculations or causal reasoning
      - Broad source summaries
      - Binary verdicts that conceal missing evidence
      prerequisites:
      - c25.2.1
      sample_tasks:
      - kind: entry
        instruction: Retrieve the relevant sentence from a short document containing
          similar passages, then classify one atomic claim as supported, contradicted,
          or not established.
      - kind: representative
        instruction: Decompose one compound factual statement into atomic claims,
          retrieve the relevant passage for each, reconcile entity, date, quantity,
          and scope differences, and give a qualified support classification for every
          part.
    - id: c25.3.2
      kind: capability
      parent_id: c25.3
      name: Reasoning-Chain Audit
      outcome: Check whether each step of an applied argument follows from its premises,
        calculations, causal model, and governing rules, then repair the first consequential
        error.
      includes:
      - Assumption checks
      - Dimensional and arithmetic checks
      - Causal-chain validation
      - Rule and exception checks
      - Error propagation to conclusions
      excludes:
      - Evidence retrieval as the primary operation
      - Criticism based only on disagreement with the conclusion
      - Rewriting a correct solution solely for style
      - Source-credibility judgments
      prerequisites:
      - c25.1.2
      - c25.1.3
      - c25.1.4
      sample_tasks:
      - kind: entry
        instruction: Given one compact safety solution that combines a two-relation
          calculation, a supplied causal chain, and a rule with an exception, identify
          the first introduced step that does not follow and state its immediate effect.
      - kind: representative
        instruction: Audit one engineering decision that combines a multi-step calculation,
          a supplied failure mechanism, and a conditional safety rule; locate each
          consequential error, trace how it changes the final decision, and construct
          the minimally changed valid conclusion.
    - id: c25.3.3
      kind: capability
      parent_id: c25.3
      name: Corroborated Claim Verification
      outcome: Combine evidence-to-claim relations with source-quality judgments to
        decide whether a disputed factual claim is supported, refuted, or unresolved.
      includes:
      - Claim-focused source comparison
      - Quality-weighted corroboration
      - Dependence among repeated reports
      - Conflicting credible evidence
      - Calibrated factual verdicts
      excludes:
      - Accepting a claim because one passage entails it
      - Auditing non-factual reasoning chains
      - Open-ended topic research
      - Forcing a binary verdict from insufficient evidence
      prerequisites:
      - c25.3.1
      - c25.2.3
      sample_tasks:
      - kind: entry
        instruction: For one factual claim and a short source packet, retrieve each
          relevant statement, classify its relation to the claim, assess the sources'
          provenance and independence, and combine those judgments into a provisional
          verdict.
      - kind: representative
        instruction: Verify one disputed public claim by decomposing it into factual
          parts, matching each part to relevant evidence, weighing primary and derivative
          sources for expertise, recency, scope, and independence, reconciling credible
          conflicts, and issuing a calibrated overall verdict.
    - id: c25.4
      kind: capability
      parent_id: c25
      name: Explanation and Tutoring
      outcome: Turn correct supplied knowledge and reasoning into transparent explanations
        and adapt those explanations to a learner's demonstrated understanding.
      includes:
      - Worked explanations
      - Explicit links between premises and conclusions
      - Justification of approximations and rule choices
      - Misconception diagnosis
      - Scaffolding and checks for transfer
      excludes:
      - Lesson-plan administration
      - Assessment scoring
      - Verbose restatement without added understanding
      - Introducing unsupported facts for pedagogical convenience
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a correct one-step answer, add a concise explanation naming
          the governing principle and the inference it licenses.
      - kind: representative
        instruction: 'Use one learner''s flawed solution throughout: reconstruct a
          transparent worked explanation from the supplied correct reasoning, diagnose
          the learner''s misconception, tailor graduated hints to that misconception,
          and ask a nearby transfer question that checks understanding.'
    - id: c25.4.1
      kind: capability
      parent_id: c25.4
      name: Transparent Worked Explanation
      outcome: Transform a supplied correct answer or solution into a coherent explanation
        in which every important step is connected to a relevant fact, relation, mechanism,
        or rule.
      includes:
      - Stating assumptions
      - Showing intermediate reasoning
      - Explaining why alternatives fail
      - Justifying approximations
      - Connecting formal work to intuitive meaning
      excludes:
      - Solving a domain problem when no correct reasoning is supplied
      - Answers with unexplained conclusions
      - Needless repetition of the prompt
      - Personalized remediation based on learner behavior
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a correct one-step solution, explain why its conclusion
          follows from the supplied definition and why the nearest alternative does
          not.
      - kind: representative
        instruction: Convert a supplied correct solution into a worked explanation
          that states its assumptions, connects every intermediate step to the governing
          model, justifies one non-obvious approximation, rejects the nearest alternative,
          and interprets the result.
    - id: c25.4.2
      kind: capability
      parent_id: c25.4
      name: Adaptive Misconception Repair
      outcome: Infer the conceptual error behind a learner's response and adapt a
        transparent explanation and scaffolding so the learner can reconstruct the
        correct reasoning.
      includes:
      - Diagnosing error patterns
      - Choosing an appropriate level of detail
      - Contrasting mistaken and correct models
      - Graduated hints
      - Checks for transfer to a nearby case
      excludes:
      - Merely supplying the final answer
      - Generic encouragement
      - Grading without instruction
      - Full course or curriculum design
      prerequisites:
      - c25.4.1
      sample_tasks:
      - kind: entry
        instruction: Given a supplied correct multi-step solution and one explicitly
          stated learner misconception, produce the full transparent explanation while
          changing one analogy or intermediate step to address that misconception.
      - kind: representative
        instruction: Given a learner's incorrect work and follow-up comments, diagnose
          the hidden misconception, build a transparent worked correction from the
          supplied solution, provide graduated hints that target the error, and pose
          a nearby transfer question that tests whether the learner repaired the underlying
          model.
- routing_facet: subject_domain
  curriculum:
    version: wave3-1
    subject_id: C27
    subject_name: Finance, Accounting & Audit
    sections:
    - id: minan
      kind: capability
      parent_id: null
      name: Finance, Accounting & Audit Integration
      outcome: Turn financial events, records, disclosures, risks, and market evidence
        into one traceable operating, reporting, compliance, assurance, funding, or
        investment decision.
      includes:
      - accounting and financial-statement analysis
      - billing, collections, payables, and payments
      - tax filing preparation
      - audit and internal controls
      - financial modeling and valuation
      - portfolio analytics and rebalancing
      excludes:
      - consumer activism and marketing campaigns
      - generic econometrics without a financial decision
      - legal analysis without a financial reporting or transaction purpose
      - generic mathematics, science, or engineering calculations
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: For one taxable inventory purchase on credit, trace the event
          through the supplier invoice, accounting entry, payment obligation, cash
          forecast, and one approval control.
      - kind: representative
        instruction: Using one company's records, disclosures, transaction schedules,
          control evidence, tax rules, project proposal, and investment holdings,
          recommend whether and how to fund a proposed capacity expansion; produce
          one reconciled funding decision that accounts for reported performance,
          near-term collections and supplier payments, filing cash flows, assurance
          risks, project value, and any portfolio trades.
    - id: minan.accounting
      kind: capability
      parent_id: minan
      name: Accounting Records, Reporting & Analysis
      outcome: Convert economic events into reconciled financial statements and analyze
        those statements and disclosures to answer reporting and performance questions.
      includes:
      - journal entries and ledgers
      - trial balances and reconciliations
      - period-end close and statements
      - disclosure extraction
      - financial ratios and trends
      - historical performance drivers
      excludes:
      - customer or supplier document administration
      - tax-return presentation
      - independent assurance conclusions
      - forward-looking valuation
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: For one cash purchase of supplies, identify and record the accounts
          affected, update their balances, and state the resulting accounting-equation
          effect.
      - kind: representative
        instruction: Using one period's source documents and prior-period statements,
          close and reconcile the accounts, prepare linked financial statements, and
          answer a management question about the change in cash and profitability
          by locating the relevant disclosures, calculating ratios, and reconciling
          the principal drivers.
    - id: minan.accounting.entries
      kind: capability
      parent_id: minan.accounting
      name: Transaction Analysis & Journal Entries
      outcome: Identify the economic substance of routine transactions and record
        balanced entries in the correct accounts and periods.
      includes:
      - account classification
      - debit and credit logic
      - routine revenue and expense recognition
      - asset and liability recognition
      - compound transaction entries
      excludes:
      - period-end accruals, deferrals, depreciation, and estimates
      - posting complete ledgers
      - reconciling independent records
      - tax-specific book-to-return adjustments
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Record a cash purchase of equipment and state how the entry changes
          assets, liabilities, and equity.
      - kind: representative
        instruction: Prepare dated journal entries for sales, purchases, returns,
          prepayments, payroll, financing, and asset transactions, explaining the
          recognition and period assignment of each without performing the period-end
          close.
    - id: minan.accounting.ledger
      kind: capability
      parent_id: minan.accounting
      name: Ledger Posting & Trial-Balance Integrity
      outcome: Post valid journal entries to general and subsidiary ledgers, calculate
        balances, and diagnose or correct posting and trial-balance errors without
        changing valid economic events.
      includes:
      - general and subsidiary ledgers
      - running balances
      - posting references
      - trial-balance preparation
      - transposition and one-sided error diagnosis
      excludes:
      - bank and counterparty reconciliation
      - period-end estimates
      - financial-statement interpretation
      - invoice collection activity
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given one balanced purchase journal entry, post it to the affected
          T-accounts and calculate their new balances.
      - kind: representative
        instruction: Given a batch of valid journal entries, post them to general and
          subsidiary ledgers, produce a trial balance, and correct posting errors and
          inconsistent control-account totals.
    - id: minan.accounting.reconciliation
      kind: capability
      parent_id: minan.accounting
      name: Account Reconciliation & Discrepancy Resolution
      outcome: Compare book records with independent evidence, distinguish timing
        differences from errors, and produce supported corrections and reconciling
        items.
      includes:
      - bank reconciliations
      - subsidiary-to-control-account reconciliation
      - intercompany reconciliation
      - cash and payment matching
      - aged reconciling-item investigation
      excludes:
      - creating original invoices
      - audit sampling and opinion formation
      - unsupported plug entries
      - portfolio risk analysis
      prerequisites:
      - minan.accounting.entries
      sample_tasks:
      - kind: entry
        instruction: Analyze and record one cash transaction from its source document,
          compare the resulting book balance with the bank evidence, and add the new
          operation of classifying one difference as a book error or timing item.
      - kind: representative
        instruction: Analyze transaction evidence and prepare any missing entries,
          then reconcile the cash ledger to a bank statement and a control account
          to its subsidiary records, distinguish timing items from errors, and prepare
          supported corrections and an outstanding-item schedule.
    - id: minan.accounting.close
      kind: capability
      parent_id: minan.accounting
      name: Period-End Close & Financial Statements
      outcome: Complete a period-end close by deriving closing adjustments from posted
        and reconciled records and producing linked, classified, and internally consistent
        financial statements.
      includes:
      - period-end accruals and deferrals
      - depreciation and estimates
      - adjusted trial balances
      - income, balance-sheet, cash-flow, and equity statements
      - closing entries
      excludes:
      - routine transaction entry as the primary task
      - tax-return filing positions
      - audit assurance conclusions
      - historical ratio analysis
      prerequisites:
      - minan.accounting.ledger
      - minan.accounting.reconciliation
      sample_tasks:
      - kind: entry
        instruction: Record and post a small set of source transactions, produce and
          reconcile their trial balance, then add one documented closing-date expense
          accrual to create an adjusted trial balance.
      - kind: representative
        instruction: From source transactions and independent bank and subsidiary
          evidence, prepare entries, post ledgers, produce and reconcile the trial
          balance, derive supported period-end adjustments, and prepare linked income,
          balance-sheet, cash-flow, and equity statements.
    - id: minan.accounting.disclosures
      kind: capability
      parent_id: minan.accounting
      name: Financial Statement & Disclosure Extraction
      outcome: Locate, classify, and interpret explicitly presented financial amounts
        and policies while preserving period, unit, sign, scope, and disclosure context.
      includes:
      - statement and note navigation
      - line-item classification
      - units and sign conventions
      - current-versus-prior-period identification
      - explicit disclosure versus aggregation or absence
      excludes:
      - preparing the underlying statements
      - ratio calculation as the primary operation
      - causal performance explanations
      - web retrieval without financial interpretation
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: In a supplied statement of cash flows, identify one requested
          investing cash outflow and report its period, unit, and sign convention.
      - kind: representative
        instruction: Using a supplied annual report, locate requested amounts across
          the primary statements and notes, distinguish explicit line items from embedded
          or absent items, and report each amount with its classification, period,
          unit, sign, and supporting disclosure context.
    - id: minan.accounting.ratios
      kind: capability
      parent_id: minan.accounting
      name: Financial Ratio & Trend Analysis
      outcome: Select and calculate comparable financial ratios and trends from correctly
        interpreted statement amounts, including average-balance denominators and
        consistent units.
      includes:
      - profitability and margin ratios
      - liquidity and leverage ratios
      - turnover and efficiency ratios
      - average-balance calculations
      - common-size and multi-period trends
      excludes:
      - standalone line-item lookup
      - forecast ratios
      - portfolio performance measures
      - causal claims unsupported by disclosures
      prerequisites:
      - minan.accounting.disclosures
      sample_tasks:
      - kind: entry
        instruction: From supplied statements, locate revenue and beginning and ending
          property balances with their units and classifications, then add the new
          operation of calculating one average-balance turnover ratio.
      - kind: representative
        instruction: Locate and interpret the required amounts in one company's statements
          and notes, calculate a consistent set of profitability, liquidity, leverage,
          and efficiency ratios across periods, and identify material trends without
          attributing causes not supported by the disclosures.
    - id: minan.accounting.variance
      kind: capability
      parent_id: minan.accounting
      name: Historical Performance & Driver Analysis
      outcome: Reconcile changes in reported revenue, expenses, margins, cash flow,
        and balances to quantified business and accounting drivers supported by financial
        disclosures.
      includes:
      - period-over-period variance bridges
      - margin change decomposition
      - price, volume, mix, and cost effects
      - cash-versus-profit explanations
      - reported and adjusted measure reconciliation
      excludes:
      - ratio calculation without driver analysis
      - statistical forecasting
      - enterprise valuation
      - unsupported management narratives
      prerequisites:
      - minan.accounting.disclosures
      - minan.accounting.ratios
      sample_tasks:
      - kind: entry
        instruction: Locate revenue and operating income for two periods, calculate
          both operating margins consistently, then add the new operation of quantifying
          one disclosed cost item's contribution to the margin change.
      - kind: representative
        instruction: Using one annual report, locate and classify the relevant statement
          and note amounts, calculate comparable ratios and trends, and build a quantified
          bridge explaining the period's changes in revenue, operating margin, and
          operating cash flow from disclosed business and accounting drivers.
    - id: minan.billing
      kind: capability
      parent_id: minan
      name: Billing, Receivables, Payables & Payment Operations
      outcome: Translate commercial and fulfillment evidence into accurate customer
        and supplier obligations, manage open balances, and resolve incoming and outgoing
        payments with a complete transaction trail.
      includes:
      - customer invoices and credits
      - receivables aging and collections
      - customer receipt application and exceptions
      - supplier invoice validation
      - payables aging and payment runs
      excludes:
      - procurement sourcing and negotiation
      - general contract-law disputes
      - ledger-wide period-end close
      - investment trade settlement
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Calculate the amount due for one fulfilled customer order and
          identify the resulting receivable and expected cash date.
      - kind: representative
        instruction: Using one company's sales orders, purchase orders, fulfillment
          records, invoices, remittances, and cash constraints, produce a single 30-day
          cash-conversion plan that issues valid customer billings, prioritizes collections,
          applies receipts, validates supplier obligations, schedules approved payments,
          and resolves exceptions affecting projected cash.
    - id: minan.billing.invoices
      kind: capability
      parent_id: minan.billing
      name: Customer Invoice & Credit-Document Production
      outcome: Create and validate customer invoices and credit documents whose quantities,
        prices, taxes, terms, parties, and references agree with authorized sales
        and fulfillment evidence.
      includes:
      - sales-order and delivery matching
      - price and discount calculation
      - indirect tax from supplied rules
      - invoice numbering and dates
      - customer credit and debit notes
      excludes:
      - supplier invoice validation
      - collection strategy
      - cash application
      - revenue recognition not determined by billing evidence
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Calculate the amount due on one delivered sales line after a
          stated discount and tax rate.
      - kind: representative
        instruction: Prepare a customer invoice for a multi-line, partially fulfilled
          order with tiered discounts, freight, tax, payment terms, and references,
          then issue the required credit document for a documented return.
    - id: minan.billing.receivables
      kind: capability
      parent_id: minan.billing
      name: Receivables Aging & Collections
      outcome: Maintain accurate customer receivable status, age open balances, prioritize
        collection activity, and document resolutions according to terms and customer
        evidence.
      includes:
      - due-date determination
      - aging buckets
      - collection prioritization
      - customer disputes
      - payment plans
      - allowance inputs from observed collection risk
      excludes:
      - invoice issuance
      - supplier payables
      - legal debt enforcement
      - cash-flow valuation
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Determine the due date and aging bucket of one unpaid customer
          invoice from its date, terms, and reporting date.
      - kind: representative
        instruction: Build a customer aging schedule from invoices, credits, disputes,
          and receipts; identify overdue and high-risk balances; and propose prioritized
          evidence-based collection actions without pursuing amounts that are not
          yet due.
    - id: minan.billing.payments
      kind: capability
      parent_id: minan.billing
      name: Customer Receipt Application
      outcome: Match customer receipts to receivables, allocate exact, partial, aggregated,
        and net payments, and isolate unapplied or short-paid amounts without losing
        traceability.
      includes:
      - remittance matching
      - partial and batch receipt allocation
      - credit and discount application
      - short and overpayment identification
      - unapplied-cash investigation
      excludes:
      - refund authorization
      - chargeback and reversal recovery
      - supplier disbursements
      - bank reconciliation beyond receipt matching
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Apply one customer receipt that references two open invoices
          and state the remaining balances.
      - kind: representative
        instruction: Apply a batch customer remittance across invoices, credits, authorized
          discounts, partial payments, and one unexplained short payment, then document
          every receivable update and unapplied amount.
    - id: minan.billing.receipt_exceptions
      kind: capability
      parent_id: minan.billing
      name: Customer Refund, Reversal & Chargeback Resolution
      outcome: Reconstruct and resolve customer-payment exceptions by determining
        the valid receivable, cash, authorization, recovery, and communication actions.
      includes:
      - duplicate and overpayment refunds
      - returned payments
      - receipt reversals
      - customer chargebacks
      - recovery and write-off routing
      excludes:
      - routine receipt allocation
      - supplier payment reversals
      - fraud investigations
      - legal collection proceedings
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given one duplicated customer payment and an open balance, determine
          the refundable amount and the approval evidence required before release.
      - kind: representative
        instruction: For one customer account containing an overpayment, an authorized
          refund, and a later chargeback, reconstruct the valid cash and receivable
          positions, determine recovery or write-off actions, and document the approvals
          and customer communication.
    - id: minan.billing.payables
      kind: capability
      parent_id: minan.billing
      name: Supplier Payables & Disbursement Operations
      outcome: Validate supplier obligations, maintain payable status, and release
        or resolve supplier payments under authorization, timing, liquidity, and traceability
        controls.
      includes:
      - vendor invoice validation
      - three-way matching
      - accounts-payable aging
      - approval and payment scheduling
      - supplier disbursement exceptions
      excludes:
      - supplier sourcing and contract negotiation
      - customer receivables
      - ledger-wide close
      - bank reconciliation beyond disbursement matching
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Compare one supplier invoice with its purchase order and receipt
          and decide whether it is payable, held, or disputed.
      - kind: representative
        instruction: Using one supplier purchase packet from order through bank response,
          validate the invoice and exceptions, update the payable and aging, decide
          its approval and payment date, execute the disbursement record, and resolve
          any return or reversal.
    - id: minan.billing.payables.invoices
      kind: capability
      parent_id: minan.billing.payables
      name: Supplier Invoice Validation & Approval
      outcome: Determine whether a supplier invoice represents an authorized, received,
        correctly priced, classified, and approvable obligation.
      includes:
      - purchase-order, receipt, and invoice matching
      - quantity and price tolerances
      - duplicate detection
      - coding and approval routing
      - supplier discrepancy handling
      excludes:
      - customer billing
      - payables aging strategy
      - payment-batch release
      - procurement negotiation
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Perform a three-way match for one invoice line and classify one
          quantity difference under a supplied tolerance.
      - kind: representative
        instruction: Validate a mixed batch of purchase-order and non-purchase-order
          supplier invoices against orders, receipts, terms, tax, duplicates, coding,
          tolerances, and approvals, then route each item for payment, correction,
          or dispute.
    - id: minan.billing.payables.aging
      kind: capability
      parent_id: minan.billing.payables
      name: Payables Aging & Payment Scheduling
      outcome: Maintain an accurate supplier-payables schedule and prioritize approved
        obligations by due date, discount, hold, liquidity, and supplier constraints.
      includes:
      - invoice due dates
      - payables aging
      - discount-date evaluation
      - holds and disputes
      - cash-constrained payment scheduling
      excludes:
      - invoice validity testing as the primary operation
      - payment-file execution
      - customer collections
      - financing valuation
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Determine the due date, discount date, and aging bucket for one
          approved supplier invoice.
      - kind: representative
        instruction: Build a payables schedule from approved invoices, credits, holds,
          and disputed items, then select a payment plan that respects due dates,
          valuable discounts, critical suppliers, and a stated cash limit.
    - id: minan.billing.payables.disbursements
      kind: capability
      parent_id: minan.billing.payables
      name: Supplier Disbursement & Exception Resolution
      outcome: Prepare and control supplier payment runs and resolve rejected, duplicated,
        reversed, returned, or misdirected disbursements.
      includes:
      - payment-batch preparation
      - authorization and segregation checks
      - bank-response matching
      - rejections and returns
      - duplicate and reversal recovery
      excludes:
      - customer receipt exceptions
      - supplier selection
      - full bank-account reconciliation
      - payment fraud investigation
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: For one approved supplier obligation, prepare its payment instruction
          and verify the required release authorization.
      - kind: representative
        instruction: Prepare an authorized supplier payment batch, reconcile the bank
          response to the release file and open obligations, and resolve a rejected
          item, a duplicate disbursement, and a returned or reversed payment with
          traceable recovery actions.
    - id: minan.tax
      kind: capability
      parent_id: minan
      name: Tax & Regulatory Filing Preparation
      outcome: Determine filing obligations and transaction treatments, calculate
        reportable amounts from financial records, and assemble a reconciled submission
        package under supplied rules.
      includes:
      - entity, jurisdiction, and period scope
      - transaction tax treatment
      - tax-base and liability calculations
      - forms and supporting schedules
      - filing reconciliation and controls
      excludes:
      - tax controversy advocacy
      - inventing jurisdictional rules
      - general financial-statement preparation
      - nonfinancial regulatory compliance
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given entity, location, activity, and a supplied rule, determine
          whether one filing is required and how one transaction is treated.
      - kind: representative
        instruction: Using one entity's ledger, transaction evidence, and supplied
          jurisdictional rules, determine its filing obligations and transaction treatments,
          calculate the liability or refund, populate the required schedules, reconcile
          the package to the books, and identify unresolved filing controls.
    - id: minan.tax.scope
      kind: capability
      parent_id: minan.tax
      name: Filing Obligations & Jurisdiction
      outcome: Apply supplied rules to entity, location, activity, and period facts
        to determine taxpayer status, jurisdiction, filing frequency, and required
        returns.
      includes:
      - entity and taxpayer classification
      - nexus and jurisdiction facts
      - filing thresholds
      - filing periods and frequency
      - required returns and registrations
      excludes:
      - transaction taxability or deductibility
      - liability calculation
      - form population
      - unstated legal rules
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Apply one stated threshold rule to decide whether an entity must
          file in a jurisdiction.
      - kind: representative
        instruction: Classify an entity across supplied jurisdictional and entity
          rules, evaluate its activities and thresholds, and identify every required
          return, registration, filing period, and frequency with a fact-based explanation.
    - id: minan.tax.treatment
      kind: capability
      parent_id: minan.tax
      name: Transaction Tax Treatment
      outcome: Apply supplied rules to classify book transactions as taxable, exempt,
        deductible, nondeductible, capital, creditable, or subject to another stated
        treatment.
      includes:
      - transaction taxability
      - deductibility
      - exemptions and exclusions
      - capital-versus-current treatment
      - credit eligibility
      excludes:
      - entity and jurisdiction filing scope
      - rate arithmetic and complete liability calculation
      - return layout
      - tax controversy
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Apply one supplied rule to classify a book expense as deductible,
          limited, capitalized, or nondeductible.
      - kind: representative
        instruction: Classify a varied set of revenue, expense, asset, and cross-border
          transactions under supplied treatment rules, identifying taxable amounts,
          exemptions, deductions, timing categories, and credit eligibility with reasons.
    - id: minan.tax.computation
      kind: capability
      parent_id: minan.tax
      name: Tax-Base & Liability Computation
      outcome: Determine applicable filing scope and transaction treatments, then
        convert book amounts into a tax or regulatory base and calculate liability,
        credits, payments, and balance under supplied rules.
      includes:
      - book-to-return adjustments
      - taxable income or transaction base
      - rate schedules and limitations
      - credits and estimated payments
      - interest and penalties under supplied rules
      excludes:
      - form layout and submission
      - tax controversy strategy
      - unsupported estimates
      - classification supplied as a completed schedule
      prerequisites:
      - minan.tax.scope
      - minan.tax.treatment
      sample_tasks:
      - kind: entry
        instruction: Use entity and jurisdiction facts to determine the applicable
          filing, classify one book transaction under the supplied treatment rule,
          then add the new operation of calculating its effect on the tax base and
          liability.
      - kind: representative
        instruction: Determine an entity's jurisdictions, periods, and required filings;
          classify its book transactions under supplied rules; and calculate the filing-period
          tax base, rates, limitations, credits, payments, penalties if applicable,
          and resulting liability or refund.
    - id: minan.tax.filing
      kind: capability
      parent_id: minan.tax
      name: Return Assembly, Reconciliation & Filing Controls
      outcome: Reconcile source records, determine and compute reportable amounts,
        place them in the correct return structure, and prepare a controlled filing
        package.
      includes:
      - form and schedule population
      - cross-footing
      - book-to-return reconciliation
      - supporting-document traceability
      - review checkpoints and submission readiness
      excludes:
      - legal representation before authorities
      - general records retention
      - audit opinions
      - population of forms from unverified completed totals
      prerequisites:
      - minan.accounting.reconciliation
      - minan.tax.computation
      sample_tasks:
      - kind: entry
        instruction: Reconcile one ledger amount to independent transaction evidence,
          determine its filing scope and treatment, calculate the resulting tax amount,
          then add the new operation of placing it on the specified return line with
          a supporting reference.
      - kind: representative
        instruction: From ledger and source evidence, reconcile reportable balances,
          determine filing obligations and transaction treatments, compute the liability
          or refund, populate and cross-foot the required forms and schedules, and
          produce a filing-readiness record of controls and unresolved items.
    - id: minan.audit
      kind: capability
      parent_id: minan
      name: Audit & Internal Controls
      outcome: Assess financial-process risks, design and test controls and substantive
        procedures, and communicate evidence-based assurance conclusions and remediation
        priorities.
      includes:
      - risk, assertions, and materiality
      - control design and walkthroughs
      - control operating-effectiveness testing
      - substantive financial testing
      - findings and assurance conclusions
      excludes:
      - operating routine controls as process owner
      - unsupported fraud accusations
      - tax-return preparation
      - financial forecasting
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: For one cash-disbursement process, identify a plausible misstatement
          risk, the affected assertion, and one control objective.
      - kind: representative
        instruction: 'Conduct one focused audit of a revenue-and-cash process: assess
          risks and materiality, evaluate its control design, test control operation
          and balances using the same transaction population, and issue a supported
          conclusion with prioritized remediation.'
    - id: minan.audit.risk
      kind: capability
      parent_id: minan.audit
      name: Risk, Assertions & Materiality
      outcome: Translate process and financial-statement facts into scoped risks,
        affected assertions, materiality judgments, and prioritized audit attention.
      includes:
      - inherent and control risk
      - financial-statement assertions
      - quantitative and qualitative materiality
      - fraud-risk indicators
      - scope and prioritization
      excludes:
      - designing detailed controls
      - performing audit samples
      - concluding from uncollected evidence
      - investment risk
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given an unrecorded supplier invoice near period end, identify
          the threatened financial-statement assertion.
      - kind: representative
        instruction: For a company and its draft statements, set and justify materiality,
          identify and rank account- and process-level misstatement risks, connect
          each to assertions, and define the areas requiring further work.
    - id: minan.audit.controls
      kind: capability
      parent_id: minan.audit
      name: Control Design & Walkthrough Evaluation
      outcome: Assess financial risks and design or evaluate controls that address
        them through appropriate objectives, ownership, frequency, evidence, precision,
        and segregation.
      includes:
      - preventive and detective controls
      - control-risk linkage
      - process walkthroughs
      - segregation of duties
      - information-used-in-control reliability
      - design and implementation assessment
      excludes:
      - historical operating-effectiveness testing
      - substantive account testing
      - generic policy writing without a risk
      - controls supplied as already adequate
      prerequisites:
      - minan.audit.risk
      sample_tasks:
      - kind: entry
        instruction: From a process narrative and draft balances, set a materiality
          reference and rank two assertion-level risks, then add the new operation
          of specifying one control that addresses the higher-priority risk.
      - kind: representative
        instruction: Assess materiality and rank the risks and assertions in a transaction
          process, map its flow, evaluate whether existing controls address the prioritized
          risks, and redesign gaps with clear objectives, owners, evidence, frequency,
          precision, and segregation.
    - id: minan.audit.control_testing
      kind: capability
      parent_id: minan.audit
      name: Control Operating-Effectiveness Testing
      outcome: Design relevant controls and perform evidence-based tests that determine
        whether they operated consistently and precisely over the period.
      includes:
      - population definition
      - sample selection
      - inspection and reperformance
      - inquiry with corroboration
      - exception evaluation
      - test documentation
      excludes:
      - control design assessment alone
      - substantive balance testing as the primary objective
      - unsupported extrapolation
      - final assurance reporting
      prerequisites:
      - minan.audit.controls
      sample_tasks:
      - kind: entry
        instruction: Assess one stated risk and design a monthly review control with
          owner, evidence, and precision, then add the new operation of testing whether
          it operated for one selected month.
      - kind: representative
        instruction: Assess the risks in a process, design or evaluate the controls
          needed to address them, define the resulting control populations, select
          test items, evaluate supplied operating evidence and exceptions, and conclude
          whether reliance is supported.
    - id: minan.audit.substantive
      kind: capability
      parent_id: minan.audit
      name: Substantive Financial Testing
      outcome: Assess risks and design and evaluate analytical and detail procedures
        that directly test material balances, transaction classes, and disclosures
        against relevant assertions.
      includes:
      - substantive analytics
      - tests of details
      - confirmation
      - vouching and tracing
      - cutoff and estimate testing
      - misstatement projection
      excludes:
      - control operating-effectiveness testing
      - creating accounting records
      - legal compliance audits without financial assertions
      - final assurance reporting
      prerequisites:
      - minan.audit.risk
      sample_tasks:
      - kind: entry
        instruction: From draft statements and a process narrative, set a materiality
          reference and identify the principal payable risk and assertion, then add
          the new operation of choosing the appropriate tracing or vouching direction
          and starting evidence.
      - kind: representative
        instruction: Set materiality and assess the risks and assertions for a material
          balance, design responsive analytical and detail procedures, evaluate confirmations,
          documents, cutoff items, estimates, and exceptions, and quantify detected
          and projected misstatement.
    - id: minan.audit.reporting
      kind: capability
      parent_id: minan.audit
      name: Audit Conclusions, Findings & Remediation
      outcome: Perform and integrate control and substantive testing, assess exceptions
        against risk and materiality, and communicate proportionate conclusions, findings,
        and corrective actions.
      includes:
      - evidence synthesis
      - exception and deficiency classification
      - root-cause analysis
      - materiality evaluation
      - finding construction
      - remediation and follow-up
      excludes:
      - reporting from completed summaries without evaluating evidence
      - unsupported accusations
      - management accounting decisions
      - legal opinions
      prerequisites:
      - minan.audit.control_testing
      - minan.audit.substantive
      sample_tasks:
      - kind: entry
        instruction: Design and perform one control test and one substantive detail
          test on the same transaction exception, then add the new operation of drafting
          a finding that connects the combined evidence to risk, materiality, cause,
          consequence, and action.
      - kind: representative
        instruction: Assess the engagement risks, evaluate and test the relevant control
          design and operation, perform substantive procedures on the same financial
          area, aggregate the resulting exceptions against materiality, and issue
          supported conclusions, classified findings, and prioritized remediation
          with follow-up criteria.
    - id: minan.modeling
      kind: capability
      parent_id: minan
      name: Financial Modeling & Valuation
      outcome: Build transparent cash-flow and financial-statement models, test their
        behavior under uncertainty, and use them to value projects, financing alternatives,
        and businesses.
      includes:
      - time value of money
      - cash-flow construction
      - driver-based forecasts
      - scenario and sensitivity analysis
      - capital budgeting
      - enterprise and equity valuation
      excludes:
      - historical bookkeeping as the primary objective
      - portfolio-level risk and performance analysis
      - tax-return preparation
      - generic optimization without financial cash flows
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Place one known future receipt on a timeline and discount it
          to present value using a stated rate and convention.
      - kind: representative
        instruction: For one proposed acquisition, build a linked operating and cash
          forecast from the deal assumptions, test downside and upside cases, compare
          financing alternatives, estimate enterprise and equity value, and make one
          acquisition-and-funding recommendation from the shared model.
    - id: minan.modeling.cashflows
      kind: capability
      parent_id: minan.modeling
      name: Cash Flows & Time Value of Money
      outcome: Place financial cash flows on a timeline and consistently compute present
        values, future values, yields, annuities, perpetuities, and equivalent rates.
      includes:
      - cash-flow timing
      - compounding and discounting
      - nominal and effective rates
      - annuities and perpetuities
      - net-present-value mechanics
      - yield solving
      excludes:
      - forecasting uncertain operating amounts
      - project selection from strategic constraints
      - bond-specific accrued interest and duration
      - enterprise-to-equity valuation bridges
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Compute the present value of a single payment due in one year
          at a stated annual discount rate.
      - kind: representative
        instruction: Value an irregular stream containing upfront, periodic, and terminal
          cash flows under stated compounding conventions, solve for its yield, and
          reconcile the result using an equivalent effective rate.
    - id: minan.modeling.forecast
      kind: capability
      parent_id: minan.modeling
      name: Forecasting, Scenarios & Sensitivities
      outcome: Translate operating and financing assumptions into linked financial
        forecasts and quantify how uncertainty changes cash, profit, funding needs,
        and decision outputs.
      includes:
      - driver-based forecasts
      - linked profit, working-capital, and cash schedules
      - probability-weighted cash flows
      - piecewise costs and taxes
      - scenarios and sensitivities
      - break-even analysis
      excludes:
      - historical statement preparation
      - statistical forecasting detached from a financial decision
      - discounted valuation conclusions
      - portfolio covariance analysis
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Forecast next month's revenue and cash receipts from stated unit
          volume, price, and collection lag.
      - kind: representative
        instruction: Build a linked operating, profit, working-capital, and cash forecast
          with probability-weighted outcomes and threshold-dependent costs, compare
          base, downside, and upside scenarios, and identify the assumptions driving
          funding needs and break-even performance.
    - id: minan.modeling.capital
      kind: capability
      parent_id: minan.modeling
      name: Capital Budgeting & Financing Decisions
      outcome: Construct and evaluate incremental project and financing cash flows
        using discount-rate assumptions, decision metrics, constraints, and scenario
        evidence.
      includes:
      - incremental and opportunity cash flows
      - NPV, IRR, and payback
      - capital rationing
      - lease-versus-buy
      - financing comparisons
      - decision sensitivities
      excludes:
      - enterprise equity valuation
      - portfolio rebalancing
      - accounting profit without cash-flow conversion
      - unsupported strategic claims
      prerequisites:
      - minan.modeling.cashflows
      sample_tasks:
      - kind: entry
        instruction: Place a project's stated cash flows on a timeline, apply the
          correct rate convention, and calculate present value and yield; then add
          the new operation of deciding whether one opportunity cost is incremental
          and applying the resulting accept-or-reject rule.
      - kind: representative
        instruction: Construct the incremental cash-flow timelines for mutually exclusive
          investment and financing alternatives, apply consistent discounting and
          yield calculations, compare NPV, IRR, payback, funding constraints, and
          downside cases, reconcile conflicting metrics, and recommend one alternative.
    - id: minan.modeling.valuation
      kind: capability
      parent_id: minan.modeling
      name: Enterprise & Equity Valuation
      outcome: Estimate enterprise and equity value from operating assumptions using
        defensible cash flows, discount rates, terminal assumptions, market cross-checks,
        and valuation bridges.
      includes:
      - free cash flow
      - discounted cash flow
      - terminal value
      - cost of capital
      - enterprise-to-equity bridge
      - multiples and valuation ranges
      excludes:
      - individual bond analytics
      - portfolio construction
      - purchase-price accounting
      - claims without explicit assumptions
      prerequisites:
      - minan.modeling.cashflows
      sample_tasks:
      - kind: entry
        instruction: Build and discount a short enterprise cash-flow timeline using
          the stated rate convention, then add the new operation of bridging the resulting
          enterprise value to equity value using debt and excess cash.
      - kind: representative
        instruction: Derive free cash flow from supplied operating assumptions, place
          and discount the forecast and terminal cash flows consistently, solve or
          validate the discount-rate convention, bridge enterprise value to equity
          value, cross-check market multiples, and present a sensitivity-based range.
    - id: minan.investments
      kind: capability
      parent_id: minan
      name: Trading & Portfolio Analytics
      outcome: Measure positions and performance, value fixed-income exposures, analyze
        covariance and factor risks, attribute active results, and form traceable
        portfolio trades under constraints.
      includes:
      - positions, gains, and returns
      - fixed-income valuation and sensitivity
      - portfolio covariance and diversification
      - beta and factor exposure
      - benchmark attribution
      - trade and rebalance analysis
      excludes:
      - enterprise operating forecasts
      - trade-execution system engineering
      - investment marketing
      - predictions unsupported by prices, cash flows, or risk assumptions
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Calculate one position's market value, gain, and holding-period
          return from its cost, ending price, and cash distribution.
      - kind: representative
        instruction: Using one multi-asset portfolio, benchmark, and mandate, reconstruct
          positions and investor performance, value the bond holdings, measure covariance
          and factor risks, attribute active return, and produce one rebalance decision
          that meets return, risk, liquidity, cost, and exposure constraints.
    - id: minan.investments.returns
      kind: capability
      parent_id: minan.investments
      name: Position Valuation, Gains & Single-Period Returns
      outcome: Convert trades, holdings, prices, income, and corporate actions into
        consistent position values, cost basis, gains and losses, and single-period
        total returns.
      includes:
      - market value
      - cost basis
      - realized and unrealized gain
      - holding-period return
      - income adjustments
      - corporate-action adjustments
      excludes:
      - multi-period time- or money-weighted performance
      - portfolio covariance
      - benchmark attribution
      - trade recommendations
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Calculate one security's ending market value and holding-period
          return including a cash dividend.
      - kind: representative
        instruction: Reconstruct positions across purchases, sales, fees, distributions,
          and a corporate action, then calculate ending exposure, adjusted cost basis,
          realized and unrealized gain, and single-period total return for each position.
    - id: minan.investments.performance
      kind: capability
      parent_id: minan.investments
      name: Investor Return Measurement
      outcome: Measure and reconcile multi-period portfolio performance under external
        cash flows using time-weighted, money-weighted, gross, net, local, and base-currency
        return conventions.
      includes:
      - subperiod valuation
      - time-weighted return
      - money-weighted return
      - external cash-flow treatment
      - gross and net returns
      - currency translation and reconciliation
      excludes:
      - cost-basis reconstruction
      - benchmark attribution
      - risk estimation
      - future-return forecasting
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Chain-link two subperiod returns separated by one external cash
          flow to obtain a time-weighted return.
      - kind: representative
        instruction: From portfolio valuations, contributions, withdrawals, income,
          fees, and exchange rates, calculate and reconcile time-weighted and money-weighted
          performance, gross and net returns, and local- and base-currency results
          across multiple periods.
    - id: minan.investments.fixed_income
      kind: capability
      parent_id: minan.investments
      name: Fixed-Income Valuation & Interest-Rate Exposure
      outcome: Apply time-value methods to fixed-income cash flows and measure how
        settlement, yield, benchmark rates, credit spreads, and instrument features
        affect price and sensitivity.
      includes:
      - bond cash-flow schedules
      - clean and dirty price
      - yield measures
      - Macaulay and modified duration
      - convexity
      - rate and credit-spread sensitivity
      excludes:
      - issuer enterprise valuation
      - portfolio allocation
      - credit underwriting without instrument valuation
      - generic time-value exercises without fixed-income conventions
      prerequisites:
      - minan.modeling.cashflows
      sample_tasks:
      - kind: entry
        instruction: Construct and discount a coupon bond's dated cash flows under
          the quoted yield convention, then add the new operation of separating accrued
          interest from dirty price to report clean price at settlement.
      - kind: representative
        instruction: For a coupon bond with accrued interest and a stated redemption
          feature, construct and discount the cash flows, reconcile clean and dirty
          prices, solve the relevant yield, calculate Macaulay and modified duration
          and convexity, and estimate separate price effects from benchmark-rate and
          credit-spread changes.
    - id: minan.investments.risk
      kind: capability
      parent_id: minan.investments
      name: Portfolio Volatility, Covariance & Diversification
      outcome: Aggregate asset weights and return relationships into portfolio volatility,
        concentration, and risk-contribution measures and evaluate diversification
        under constraints.
      includes:
      - weighted expected return
      - variance and volatility
      - covariance and correlation
      - concentration
      - marginal and component risk contribution
      - diversification effects
      excludes:
      - beta and multi-factor exposure
      - standalone position accounting
      - historical attribution
      - trade construction
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Using two asset weights, volatilities, expected returns, and
          their correlation, calculate portfolio expected return and volatility.
      - kind: representative
        instruction: Calculate a multi-asset portfolio's expected return, covariance-based
          volatility, concentration, and marginal and component risk contributions,
          then compare feasible diversification changes under stated weight and liquidity
          constraints.
    - id: minan.investments.factor_risk
      kind: capability
      parent_id: minan.investments
      name: Beta & Factor Exposure Analysis
      outcome: Estimate or apply market and multi-factor sensitivities to explain
        portfolio exposure, factor risk contributions, and hedge implications.
      includes:
      - market beta
      - supplied or estimated factor loadings
      - factor covariance
      - specific risk
      - factor contribution and exposure aggregation
      - factor-neutral hedge sizing
      excludes:
      - asset covariance analysis without factors
      - performance attribution by allocation and selection
      - issuer fundamental forecasting
      - unconstrained trade tips
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Calculate a position's market beta contribution from its portfolio
          weight and supplied beta.
      - kind: representative
        instruction: Using position weights, factor loadings, factor covariance, and
          specific risks, calculate portfolio factor exposures and risk contributions,
          identify unintended concentrations, and size a stated hedge to reduce one
          exposure while reporting residual risks.
    - id: minan.investments.attribution
      kind: capability
      parent_id: minan.investments
      name: Benchmark Performance Attribution
      outcome: Decompose the difference between portfolio and benchmark returns into
        reconciled allocation, selection, interaction, income, fee, currency, or timing
        effects.
      includes:
      - portfolio and benchmark comparison
      - allocation and selection effects
      - interaction effects
      - income, fee, and currency contributions
      - period linking
      - active-return reconciliation
      excludes:
      - standalone investor-return reporting
      - portfolio risk optimization
      - instrument valuation
      - narratives that do not reconcile to active return
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: For one sector, calculate its allocation contribution from portfolio
          and benchmark weights and the benchmark sector return.
      - kind: representative
        instruction: From portfolio and benchmark weights and returns across periods,
          calculate allocation, selection, interaction, currency, income, and fee
          effects as applicable, link the periods, reconcile contributions to active
          return, and explain the material drivers.
    - id: minan.investments.trades
      kind: capability
      parent_id: minan.investments
      name: Trade & Rebalancing Decisions
      outcome: Perform portfolio risk and attribution analysis and turn the combined
        evidence into implementable trades that respect targets, liquidity, costs,
        taxes supplied as constraints, and mandate limits.
      includes:
      - target-weight rebalancing
      - cash and liquidity needs
      - risk-budget adjustments
      - performance-informed diagnosis
      - turnover and transaction costs
      - constraint checking and trade lists
      excludes:
      - unconstrained security tips
      - broker or exchange operation
      - tax-rule invention
      - trades based only on supplied risk or attribution summaries
      prerequisites:
      - minan.investments.risk
      - minan.investments.attribution
      sample_tasks:
      - kind: entry
        instruction: From portfolio and benchmark position data, calculate covariance-based
          portfolio risk and risk contributions and reconcile allocation and selection
          effects to active return, then add the new operation of choosing the smallest
          trade that cures one limit breach without discarding a supported performance
          driver.
      - kind: representative
        instruction: Calculate the portfolio's covariance risk, concentration, and
          risk contributions and perform a reconciled benchmark attribution, then
          construct and justify a rebalance trade list that restores mandate limits
          and target risk, addresses material active-return drivers, funds cash needs,
          and accounts for liquidity, transaction costs, and supplied tax constraints.
- routing_facet: subject_domain
  curriculum:
    version: wave5-2
    subject_id: C19
    subject_name: Security & Adversarial Analysis
    sections:
    - id: c19.0
      kind: capability
      parent_id: null
      name: Security and adversarial analysis
      outcome: Reach an evidence-bounded security decision about a system or artifact by relating attack
        paths, hostile behavior, and cryptographic trust to stated assets and attacker capabilities.
      includes:
      - Security claims and trust boundaries
      - Adversarial evidence and uncertainty
      - Cross-domain decisions spanning software flaws, malicious behavior, and cryptographic trust
      excludes:
      - Routine administration with no security claim
      - Generic debugging with no adversarial mechanism
      - Security-themed writing that performs no technical analysis
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a service diagram, a protected asset, and a stated attacker capability, identify
          the decisive trust boundary and one observation that would falsify the security claim.
      - kind: representative
        instruction: Given a signed software update whose verifier has a described flaw, a runtime trace
          from the update, and evidence about the signing key, decide whether the update is safe to distribute
          and identify the single evidence gap most likely to reverse that decision.
    - id: c19.1
      kind: capability
      parent_id: c19.0
      name: Vulnerability research and penetration testing
      outcome: Decide whether a software weakness creates a realizable attack path by connecting mechanism-specific
        discovery, bounded exploit evidence, impact, and security regression results.
      includes:
      - Authorization, injection, bounds and size-flow, and lifetime and ownership vulnerability analysis
      - Controlled exploit validation and impact characterization
      - Adversarial remediation verification
      excludes:
      - Malware behavior analysis as the primary operation
      - Cryptographic trust analysis as the primary operation
      - Unbounded exploitation or destructive testing
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given an application boundary, its intended security property, and a few observations,
          formulate one testable vulnerability hypothesis and name the minimum confirming evidence.
      - kind: representative
        instruction: Given source excerpts, a vulnerability hypothesis, bounded exploit results, and a
          candidate patch, make one release decision that ties the flaw's root cause to demonstrated attacker
          impact and to an adversarial regression result.
    - id: c19.1.1
      kind: capability
      parent_id: c19.1
      name: Analyze authorization and isolation flaws
      outcome: Identify and explain how an identity, state, or resource-boundary error permits an unauthorized
        principal to perform a protected action.
      includes:
      - Missing or inconsistent authorization checks
      - Object ownership and tenant-isolation failures
      - Privilege and state-transition errors
      excludes:
      - Untrusted data reaching an interpreter
      - Memory corruption and lifetime errors
      - Exploit validation after the flaw is supplied
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given an API policy and request log for two users, identify the first response inconsistent
          with the stated ownership rule.
      - kind: representative
        instruction: Given a multi-tenant workflow, authorization middleware, and selected state transitions,
          trace an unauthorized action to the missing or misplaced security decision and state the violated
          isolation property.
    - id: c19.1.2
      kind: capability
      parent_id: c19.1
      name: Analyze injection and data-interpretation flaws
      outcome: Trace attacker-controlled data across transformations to an unintended interpreter or resource
        resolution and explain the resulting security violation.
      includes:
      - Command, query, and template injection
      - Path traversal and unsafe resource resolution
      - Parsing, quoting, canonicalization, and validation gaps
      excludes:
      - Authorization decisions independent of data interpretation
      - Memory corruption as the decisive mechanism
      - Payload deployment against real systems
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a request value and the code that builds a shell command, mark the transformation
          at which data becomes executable syntax.
      - kind: representative
        instruction: Given a web request, validation logic, canonicalization steps, and a downstream query
          or file-resolution trace, identify an injection or traversal flaw and explain the exact interpretation
          mismatch that violates the security boundary.
    - id: c19.1.3
      kind: capability
      parent_id: c19.1
      name: Analyze bounds and size-flow flaws
      outcome: Trace attacker-influenced sizes through arithmetic, allocation, indexing, and copying to
        identify a bounds violation and explain its security-relevant corruption path.
      includes:
      - Integer overflow, truncation, and signedness in size calculations
      - Allocation, indexing, and copy-length mismatches
      - Spatial out-of-bounds access and its security impact
      excludes:
      - Use-after-free, double-free, and ownership violations
      - Injection into a language interpreter
      - Weaponization beyond a bounded proof of impact
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given concrete input lengths, integer conversions, an allocation expression, and
          a copy length, identify the first size invariant that can fail and state the resulting bounds
          error.
      - kind: representative
        instruction: Given a packet parser's size-flow graph, low-level code, concrete boundary inputs,
          and a sanitizer trace, reconstruct the arithmetic-to-allocation-to-copy mismatch and explain
          which adjacent security-relevant data an attacker can plausibly influence.
    - id: c19.1.6
      kind: capability
      parent_id: c19.1
      name: Analyze lifetime and ownership flaws
      outcome: Trace aliases, ownership transfers, and allocation-state changes to identify an invalid
        object lifetime transition and explain how reuse or invalid access creates attacker influence.
      includes:
      - Use-after-free and stale aliases
      - Double-free and ownership-transfer errors
      - Reference counting, reallocation, and temporal memory-safety impact
      excludes:
      - Bounds and integer-driven size-flow errors
      - Injection into a language interpreter
      - Weaponization beyond a bounded proof of impact
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given an object's allocation, alias creation, ownership transfer, and free events,
          identify the first access whose lifetime assumption is invalid.
      - kind: representative
        instruction: Given reference-count changes, aliases, free and reallocation events, a callback
          path, and a heap trace, reconstruct the use-after-free window and explain how replacement object
          contents can influence a security-relevant indirect call or field.
    - id: c19.1.4
      kind: capability
      parent_id: c19.1
      name: Validate exploits and characterize impact
      outcome: Convert a supplied vulnerability hypothesis into a safe, reproducible test that distinguishes
        exploitation from benign failure and supports a bounded claim about attacker capability and impact.
      includes:
      - Minimal proof-of-concept design
      - Controls that distinguish exploitation from error
      - Privilege, data, reachability, and confidence assessment
      excludes:
      - Independent discovery of the underlying vulnerability
      - Remediation design or patch verification
      - Destructive, persistent, or out-of-scope exploitation
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a completed vulnerability report and an isolated test interface, specify one
          control and one observable that separate successful exploitation from a normal application error.
      - kind: representative
        instruction: Given a supplied flaw hypothesis, a constrained lab, candidate test inputs, and resulting
          traces, construct a reproducible exploit validation and state the strongest attacker-impact
          claim supported without exceeding scope.
    - id: c19.1.5
      kind: capability
      parent_id: c19.1
      name: Verify vulnerability remediations
      outcome: Determine whether a proposed remediation closes the supplied attack path without introducing
        a bypass by deriving and interpreting security-focused regression tests.
      includes:
      - Patch-to-root-cause comparison
      - Adversarial regression and bypass cases
      - Residual attack-path assessment
      excludes:
      - Initial vulnerability discovery
      - Exploit impact characterization as the primary decision
      - General functional testing unrelated to the security invariant
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a root-cause statement and a patch diff, name the security invariant the first
          regression test must exercise.
      - kind: representative
        instruction: Given a supplied attack path, patch diff, and pre- and post-patch observations, design
          adversarial regression cases, assess plausible bypasses, and decide whether the remediation
          closes the causal path.
    - id: c19.3
      kind: capability
      parent_id: c19.0
      name: Malware and threat analysis
      outcome: Reach a defensible threat decision by combining evidence about suspicious artifact structure,
        runtime behavior, detection opportunities, and related activity while preserving uncertainty.
      includes:
      - Static and dynamic malware analysis
      - Behavior-grounded detection engineering
      - Threat evidence correlation and confidence assessment
      excludes:
      - Benign reverse engineering with no security question
      - Vulnerability discovery in non-malicious software
      - Attribution based only on labels or reputation
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given one suspicious artifact observation and one runtime event, state the narrowest
          hostile-behavior hypothesis supported and the evidence still missing.
      - kind: representative
        instruction: Given static findings, a sandbox timeline, existing detection coverage, and related
          intrusion observations, decide the containment and detection priority for one threat and justify
          it with a single coherent behavior hypothesis and confidence bound.
    - id: c19.3.1
      kind: capability
      parent_id: c19.3
      name: Infer malware behavior from static artifacts
      outcome: Reconstruct security-relevant capabilities and execution logic from a suspicious artifact's
        static representation while separating direct evidence from hypotheses.
      includes:
      - Executable, script, and document structure inspection
      - Strings, imports, configuration, and control-flow interpretation
      - Static inference of persistence, collection, and communication
      excludes:
      - Runtime telemetry reconstruction
      - Detection rule design as the primary operation
      - Attribution from superficial artifact names
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given selected imports, strings, and section metadata from a suspicious executable,
          identify one supported capability and one tempting but unsupported inference.
      - kind: representative
        instruction: Given a disassembly or decompiled-script excerpt, embedded configuration, and symbol
          information, reconstruct the execution path that implements a security-relevant capability and
          grade each inference by evidence strength.
    - id: c19.3.2
      kind: capability
      parent_id: c19.3
      name: Reconstruct malicious runtime behavior
      outcome: Correlate host, process, memory, and network events into a causal account of a suspicious
        execution's actions, persistence, evasion, and effects.
      includes:
      - Sandbox and endpoint timeline analysis
      - Process, file, registry, memory, and network correlation
      - Runtime persistence and evasion reconstruction
      excludes:
      - Static-only capability inference
      - Writing detection logic as the primary deliverable
      - Incident recovery planning
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given five timestamped process and file events, identify the causal parent-child
          transition that most changes the threat assessment.
      - kind: representative
        instruction: Given interleaved endpoint, memory, and network telemetry from a sandbox, reconstruct
          the malicious execution chain, distinguish causes from coincident events, and state the observed
          persistence or evasion mechanism.
    - id: c19.3.3
      kind: capability
      parent_id: c19.3
      name: Design behavior-grounded detections
      outcome: Translate supplied malicious behavior and telemetry into durable detection or hunting logic
        whose predicates, expected coverage, and false-positive tradeoffs are explicit.
      includes:
      - Selection of stable behavioral indicators
      - Detection and hunting predicate design
      - Coverage, evasion, and false-positive analysis
      excludes:
      - Reconstructing an unknown behavior from raw telemetry
      - Rules based only on brittle hashes or names when behavior is available
      - Automated blocking or containment actions
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a completed behavior summary and candidate telemetry fields, select the one
          predicate least dependent on a sample-specific filename and explain why.
      - kind: representative
        instruction: Given a supplied malicious behavior chain, telemetry schema, benign baseline examples,
          and two evasion variants, design detection or hunting logic and explain its coverage and false-positive
          boundary.
    - id: c19.3.4
      kind: capability
      parent_id: c19.3
      name: Correlate threat evidence
      outcome: Assess whether heterogeneous observations belong to the same threat activity by comparing
        behavior, infrastructure, timing, and provenance and expressing a calibrated confidence conclusion.
      includes:
      - Cross-host and cross-artifact evidence correlation
      - Infrastructure, behavior, and temporal linkage
      - Alternative hypotheses and attribution confidence
      excludes:
      - Malware capability reconstruction from a single artifact
      - Actor attribution from one indicator
      - Operational incident command
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given two intrusion records sharing an IP address but differing in behavior and time,
          state whether the shared indicator is sufficient linkage and name the most useful next observation.
      - kind: representative
        instruction: Given endpoint behaviors, domains, certificate reuse, timestamps, and provenance
          for several incidents, group the observations into the best-supported activity clusters and
          compare the leading linkage hypothesis with one plausible alternative.
    - id: c19.4
      kind: capability
      parent_id: c19.0
      name: Applied cryptography
      outcome: Decide whether a cryptographic construction or operational design achieves its stated security
        property by relating transformations, parameter choices, key lifecycle, and trust validation to
        a threat model.
      includes:
      - Cryptographic encodings and identifiers
      - Password protection, key generation, custody, recovery, and compromise response
      - Protocol, certificate, signature, and artifact trust validation
      excludes:
      - Cryptography history or formula recall without application
      - Routine encrypted-product administration with no security-property decision
      - Novel primitive design or proof as the primary task
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a cryptographic artifact, its claimed property, and a short threat model, identify
          which lifecycle or validation fact is decisive to accepting the claim.
      - kind: representative
        instruction: Given evidence of one suspected code-signing service breach, the signing key's custody
          and access logs, signed-artifact validation records, and certificate revocation and replacement
          constraints, decide whether existing releases remain trustworthy and name the first action required
          to re-establish trust.
    - id: c19.4.1
      kind: capability
      parent_id: c19.4
      name: Compute cryptographic encodings and identifiers
      outcome: Derive and verify structured cryptographic values by applying supplied serialization, prefix,
        hash, checksum, byte-order, and textual-encoding rules in the correct sequence.
      includes:
      - Base-N and checksum encodings
      - Hash-derived identifiers and content digests
      - Canonical serialization and byte ordering
      excludes:
      - Key custody or trust decisions
      - Opaque tool invocation without reconstructing the transformation
      - Designing a novel cryptographic primitive
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a payload, byte prefix, checksum rule, and encoding alphabet, compute the exact
          byte sequence immediately before final text encoding.
      - kind: representative
        instruction: Given a directory as ordered file records and a complete identifier specification,
          derive the canonical serialization, digest, checksum, and encoded identifier and show an independent
          verification path.
    - id: c19.4.2
      kind: capability
      parent_id: c19.4
      name: Evaluate key generation and entropy
      outcome: Determine whether a supplied key-generation process produces unpredictable, unbiased, and
        correctly derived keys under its stated environment and attacker capabilities.
      includes:
      - Entropy-source and random-generator trust
      - Bias, reuse, seeding, and derivation failures
      - Evidence for generated-key unpredictability
      excludes:
      - Post-generation storage and access control
      - Backup and recovery design
      - Cryptographic encoding computation
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a key generator seeded from a described device state, identify the single attacker
          observation that most reduces the claimed unpredictability.
      - kind: representative
        instruction: Given two supplied key-generation pipelines, entropy-source evidence, derivation
          steps, and reset or cloning scenarios, determine which pipeline preserves unpredictability and
          identify the decisive failure mode in the other.
    - id: c19.4.3
      kind: capability
      parent_id: c19.4
      name: Evaluate key custody and access isolation
      outcome: Assess whether storage, isolation, authorization, and signing or decryption interfaces
        prevent unauthorized key use or disclosure under specified compromise scenarios.
      includes:
      - Private-key and seed storage boundaries
      - Hardware, process, service, and user custody models
      - Authorization and audit controls around key use
      excludes:
      - Entropy quality before key creation
      - Backup availability and recovery testing
      - Rotation or revocation after known compromise
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a wallet service diagram and attacker access to the web tier, identify whether
          the attacker can read or invoke the signing key and name the controlling boundary.
      - kind: representative
        instruction: Given two key-custody architectures, their authorization interfaces, audit records,
          and host or operator compromise scenarios, compare unauthorized-use and disclosure paths and
          choose the design with the strongest defensible user control.
    - id: c19.4.4
      kind: capability
      parent_id: c19.4
      name: Validate cryptographic authentication and protocol trust
      outcome: Determine whether certificate, signature, host-key, algorithm-negotiation, or signed-artifact
        evidence establishes the intended identity and integrity property under an explicit trust policy.
      includes:
      - Certificate chains, signatures, and trust anchors
      - Protocol algorithm negotiation and authentication
      - Signed policy or artifact verification and downgrade analysis
      excludes:
      - Transport troubleshooting with no trust-property analysis
      - Blind disabling of validation
      - Key storage design as the primary operation
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given a certificate chain and trust-store contents, identify the first unsupported
          trust transition and the identity claim it prevents.
      - kind: representative
        instruction: Given an authentication trace, offered and permitted algorithms, signer or host-key
          evidence, and an explicit trust policy, determine why trust establishment succeeds or fails
          and reject any compatibility change that would invalidate the intended property.
    - id: c19.4.5
      kind: capability
      parent_id: c19.4
      name: Evaluate password-based cryptographic protection
      outcome: Choose and assess password-hashing or password-based key-derivation parameters by relating
        attacker cost, salts, deployment constraints, and legitimate-user cost to a stated protection
        goal.
      includes:
      - Password hashing and key-derivation work factors
      - Salt, memory, iteration, and parallelism choices
      - Policy granularity and migration tradeoffs
      excludes:
      - General password composition policy
      - Unrelated account authorization
      - Disk-encryption administration without KDF analysis
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given measured verification times and an offline attacker budget, select which one
          of two supplied work factors better meets the stated latency and guessing-cost constraints.
      - kind: representative
        instruction: Given a fleet's password-hash formats, per-account risk classes, benchmark results,
          attacker hardware assumptions, and migration limits, recommend parameter and migration choices
          and quantify the security-versus-service-cost boundary.
    - id: c19.4.6
      kind: capability
      parent_id: c19.4
      name: Design key backup and recovery
      outcome: Design and test a key-backup and recovery procedure that preserves confidentiality, integrity,
        authorized recovery, and availability under specified loss scenarios.
      includes:
      - Backup confidentiality and integrity
      - Recovery authorization and usability
      - Loss scenarios and practical recovery tests
      excludes:
      - Initial entropy or key-generation quality
      - Rotation and revocation after compromise
      - Generic disaster recovery without cryptographic control
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given an encrypted seed backup and recovery roles, identify one loss scenario that
          makes authorized recovery impossible and the smallest safe test that exposes it.
      - kind: representative
        instruction: Given key assets, backup media, recovery principals, geographic failures, and confidentiality
          constraints, design a recoverable backup scheme and a test that demonstrates restoration without
          exposing key material to an unauthorized party.
    - id: c19.4.7
      kind: capability
      parent_id: c19.4
      name: Respond to cryptographic key compromise
      outcome: Limit harm after suspected or confirmed key compromise by choosing detection, containment,
        rotation, revocation, re-encryption, and trust-reestablishment actions from supplied system facts.
      includes:
      - Compromise evidence and scope assessment
      - Key rotation, revocation, and replacement ordering
      - Trust and data re-establishment after exposure
      excludes:
      - Routine scheduled rotation with no compromise scenario
      - Backup restoration after loss without exposure
      - Initial key-custody architecture design
      prerequisites: []
      sample_tasks:
      - kind: entry
        instruction: Given evidence that one signing key may be exposed and a list of artifacts it authorized,
          identify the first containment action and the trust dependency that makes it urgent.
      - kind: representative
        instruction: Given a compromised key's uses, certificate or token dependencies, encrypted data,
          replacement capabilities, and attacker window, order the revocation, rotation, re-encryption,
          and trust-recovery actions and justify the residual exposure after each step.
- routing_facet: subject_domain
  curriculum:
    version: wave6-1
    subject_id: C09
    subject_name: NLP & Language Technology
    sections:
    - id: c09
      parent_id: null
      name: Goal-directed language operations
      kind: group
      scope: Language-processing capabilities that transform or interpret supplied natural language to
        produce structured records, labels, compressed or reformulated text, dialogue, or cross-language
        renderings.
      includes:
      - Structured information extraction from supplied language
      - Text classification and sentiment assessment
      - Summarization and same-language rewriting
      - Dialogue management, multi-turn composition, and supplied-policy response
      - Machine translation in explicitly declared language directions
      excludes:
      - Domain-specific factual recall when no language operation is required
      - Shell, file, or verifier mechanics that merely deliver an answer
      - Arbitrary formatting constraints with no substantive language-processing goal
      - Implementation or training of NLP software and models
    - id: c09.1
      parent_id: c09
      name: Extract information into a supplied schema
      kind: capability
      outcome: Given unstructured or semi-structured language and a supplied schema, a learner can locate
        requested entities, attributes, relations, and events; normalize them to the schema's types and
        labels; preserve uncertainty and missingness; and emit a source-supported structured record.
      includes:
      - Entity and attribute extraction
      - Relation and event extraction
      - Schema-constrained normalization of dates, numbers, labels, and nested values
      - Explicit handling of missing, ambiguous, and conflicting source values
      excludes:
      - Free-form summaries without independently addressable fields
      - Assigning one overall topic, intent, stance, or sentiment label
      - Inferring values not supported by the supplied text
      - Designing or modifying the schema itself
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given a short return-request paragraph and a supplied four-field schema, fill the
          customer name, order identifier, purchase date, and return reason, using null for any unsupported
          field.
      - kind: representative
        instruction: Given a long incident report containing prose, a table, aliases, uncertain times,
          and two conflicting dates, populate a supplied nested JSON schema for people, organizations,
          events, and temporal relations; normalize typed values, retain source-supported alternatives
          with confidence labels, and use null for every requested value the report does not state.
    - id: c09.2
      parent_id: c09
      name: Same-language text transformation
      kind: group
      scope: Transformations that preserve grounding in supplied source text while either compressing
        its informational scope or reformulating substantially the same propositions within the same language.
      includes:
      - Purpose- and audience-conditioned summarization
      - Tone-, register-, audience-, and clarity-controlled rewriting
      - Preservation of source claims, qualifications, and constraints
      excludes:
      - Translation into a different natural language
      - Extraction into independently keyed schema fields
      - Generation of claims not supported by the source
      - Dialogue tasks whose decisive operation is conversation-state management
    - id: c09.2.summary
      parent_id: c09.2
      name: Summarize source text
      kind: capability
      outcome: Given source text, a target audience, and a length or format constraint, a learner can
        select the material points, compress and organize them, and produce a source-faithful summary
        that retains qualifications important to the stated purpose.
      includes:
      - Abstractive and extractive summarization
      - Single-sentence, paragraph, and bullet summaries
      - Audience-conditioned salience selection
      - Retention of material caveats, uncertainty, and attribution
      excludes:
      - Restyling the full informational content without meaningful compression
      - Field-by-field schema extraction
      - Adding background facts absent from the source
      - Producing a separate rewritten message in addition to the requested summary
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Reduce a supplied two-sentence passage to one sentence that states its central claim
          and preserves its explicit qualification.
      - kind: representative
        instruction: Given a supplied 1,200-word policy memo, produce five bullets for regional managers
          that preserve the decision, effective date, affected groups, two exceptions, and stated uncertainty
          while omitting examples that do not change implementation.
    - id: c09.2.rewrite
      parent_id: c09.2
      name: Rewrite text for audience and purpose
      kind: capability
      outcome: Given source text and a specified audience, tone, register, or clarity goal, a learner
        can reformulate the text within the same language while preserving its substantive propositions,
        conditions, and degree of certainty.
      includes:
      - Tone- and register-controlled rewriting
      - Plain-language and audience-appropriate reformulation
      - Polite revision and constraint-preserving paraphrase
      - Reorganization for clarity without intentional information loss
      excludes:
      - Compression whose primary goal is to select only the most salient points
      - Translation into a different language
      - Inventing supporting facts or changing the speaker's commitment
      - Interactive response planning that depends on conversation state
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Rewrite a supplied blunt two-sentence request as a polite message to a colleague
          without removing either requested action or changing its deadline.
      - kind: representative
        instruction: Rewrite a supplied legal-service notice for a general public audience in plain language,
          preserving every eligibility condition, prohibition, deadline, exception, and expression of
          uncertainty while following the requested neutral tone and paragraph structure.
    - id: c09.3
      parent_id: c09
      name: Classify text and assess sentiment
      kind: capability
      outcome: Given text, a supplied label set with decision criteria, and any requested target or aspect,
        a learner can select the best-supported topic, intent, stance, emotion, or sentiment label; distinguish
        close alternatives; and ground the decision in textual evidence.
      includes:
      - Topic and intent classification
      - Sentiment polarity and intensity
      - Emotion and stance classification
      - Aspect- and target-level sentiment
      - Evidence-grounded resolution of borderline labels
      excludes:
      - Open-ended explanation with no classification decision
      - Extracting many independent fields into a record
      - Inferring affect from facts not present in the text or label definitions
      - Choosing a dialogue action when no label is requested
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given one customer sentence and three supplied intent labels with definitions, select
          the best label and quote the shortest phrase that rules out its closest alternative.
      - kind: representative
        instruction: Given supplied reviews that praise product quality but criticize delivery, apply
          a supplied taxonomy to assign an intent plus polarity and intensity for each named aspect, and
          explain each borderline choice using only the review text and label criteria.
    - id: c09.4
      parent_id: c09
      name: Dialogue and assistant behavior
      kind: group
      scope: Capabilities whose requested artifact is a context-sensitive next turn, a globally coherent
        multi-turn exchange, or a response governed by a supplied assistance or safety policy.
      includes:
      - Conversation-state tracking and next-turn selection
      - Complete multi-turn roleplay, interview, and simulation composition
      - Supplied-policy allow, refuse, clarify, limit, and redirect responses
      excludes:
      - One-shot rewriting with no conversational state or speaker interaction
      - Intent or sentiment classification without a dialogue deliverable
      - External action execution not represented in the requested utterance
      - Safety judgments based on an unstated private policy
    - id: c09.4.manage
      parent_id: c09.4
      name: Manage the next turn of an ongoing dialogue
      kind: capability
      outcome: Given conversation history, a current user goal, and interaction constraints, a learner
        can update the dialogue state, resolve relevant references, choose an appropriate next conversational
        act, and produce a response or focused clarifying question that advances the exchange without
        losing prior constraints.
      includes:
      - Conversation-state and goal tracking
      - Context-sensitive next-turn response
      - Clarifying-question and interview-question selection
      - Honest communication of uncertainty or missing information
      excludes:
      - Writing a complete fictional or simulated transcript from scratch
      - Policy-based safety adjudication as the decisive operation
      - One-shot tone revision without conversation state
      - Executing an external tool action
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given a supplied two-turn booking exchange that lacks one required date, ask exactly
          one question that obtains the missing date without repeating information already supplied.
      - kind: representative
        instruction: Given a supplied multi-turn support conversation in which the user's requested product,
          budget, and delivery deadline change over time, write the next assistant turn that uses the
          latest constraints, resolves one ambiguous pronoun from context, states one remaining uncertainty,
          and asks only the question needed to continue.
    - id: c09.4.compose
      parent_id: c09.4
      name: Compose a coherent multi-turn dialogue
      kind: capability
      outcome: Given a scenario, speaker roles, an interaction arc, and content or style constraints,
        a learner can generate a complete multi-turn dialogue whose turns respond locally, maintain consistent
        speaker knowledge and voice, and collectively realize the requested progression.
      includes:
      - Roleplay and scene dialogue
      - Interview and training-simulation transcripts
      - Speaker-consistent voice and knowledge
      - Turn-by-turn coherence toward a supplied interaction arc
      excludes:
      - Selecting only the next action in an already active exchange
      - Narrative prose with no meaningful speaker interaction
      - Safety-policy adjudication as the central task
      - Inventing domain facts not supplied by the scenario
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given two supplied speaker roles and a three-step interaction arc, write a four-turn
          exchange in which each reply addresses the preceding turn and the final turn completes the stated
          arc.
      - kind: representative
        instruction: Given a supplied fictional setting, three character briefs with unequal knowledge,
          and a six-beat scene outline, write a ten-turn script that preserves each voice and knowledge
          boundary, incorporates every beat in order, and ends with the specified unresolved decision.
    - id: c09.4.safety
      parent_id: c09.4
      name: Respond under a supplied safety policy
      kind: capability
      outcome: Given a user request, relevant conversation context, and a supplied safety or assistance
        policy, a learner can identify the applicable policy boundary and produce the allowed response,
        including a concise refusal, limitation statement, clarification, or safe redirection when required.
      includes:
      - Policy-grounded allow, refuse, or redirect decisions
      - Minimal explanation of the relevant limitation
      - Helpful safe alternatives consistent with the user's benign goal
      - Context-sensitive handling of ambiguous-risk requests
      excludes:
      - Safety judgments based on an unstated private policy
      - Generic next-turn helpfulness when no policy boundary is implicated
      - Long moralizing explanations unrelated to the supplied policy
      - External enforcement or moderation actions
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given a short request and a supplied three-rule response policy, identify the one
          rule that applies and write either the allowed answer or a one-sentence refusal.
      - kind: representative
        instruction: Given a supplied multi-turn conversation containing a mixed benign and disallowed
          request plus a response policy, write the next assistant turn that answers the allowed portion,
          refuses only the prohibited assistance with the policy-relevant reason, and offers one concrete
          safe alternative that advances the benign goal.
    - id: c09.5
      parent_id: c09
      name: Translate across a declared language direction
      kind: capability
      outcome: Given source text, a declared source-target language direction, and any supplied terminology,
        register, or formatting requirements, a learner can render the source meaning in the target language
        while preserving entities, modality, discourse relations, ambiguity, and communicative force appropriate
        to that direction.
      includes:
      - Sentence, paragraph, document, and dialogue translation across declared language directions
      - Terminology- and glossary-constrained translation
      - Preservation of register, politeness, modality, and discourse relations
      - Direction-stratified training and evaluation rather than assuming cross-direction transfer
      excludes:
      - Treating mastery of one source-target direction as evidence of mastery in another
      - Summarization or same-language paraphrase
      - Transliteration or language identification without translation
      - Adding cultural explanation not requested by the task
      - Assessing translation quality without producing a translation
      prerequisites: []
      sampling_facets:
      - id: language_direction
        description: The ordered source_language-to-target_language pair. Sample and evaluate each declared
          direction as its own stratum, using reusable values such as en-to-zh, zh-to-en, en-to-es, es-to-en,
          en-to-ar, and ar-to-en; do not pool directions when estimating mastery.
      sample_tasks:
      - kind: entry
        instruction: For language_direction=en-to-zh, translate one supplied English sentence into Chinese
          while preserving its named entity, negation, tense, and degree of certainty.
      - kind: representative
        instruction: For language_direction=en-to-zh, translate a supplied English customer-support exchange
          into Chinese using a provided English-to-Chinese glossary, preserving speaker turns, politeness,
          technical terms, conditions, paragraph structure, and one deliberately unresolved ambiguity.
- routing_facet: subject_domain
  curriculum:
    version: wave6-3
    subject_id: C15
    subject_name: Computational Science & Simulation
    sections:
    - id: c15
      parent_id: null
      name: Computational science and simulation
      kind: group
      scope: Computational representations, numerical operations, execution regimes, and validation evidence
        used to answer scientific questions.
      includes:
      - Continuum, high-performance, sampled-data, Earth-system, quantum, molecular, mesoscale, and numerical-fitting
        work represented by the child capabilities.
      excludes:
      - Pure scientific recall, generic software work without a scientific-computing constraint, and answer-delivery
        wrappers.
    - id: c15.7
      parent_id: c15
      name: Numerical fitting and error diagnosis
      kind: capability
      outcome: Fit a supplied quantitative model with numerical optimization, compare appropriate objectives,
        and diagnose residual, outlier, conditioning, and implementation error using reproducible calculations
        and plots.
      includes:
      - Array-based least-squares and robust fitting, optimizer diagnostics, residual analysis, conditioning
        checks, and reproducible visualization.
      excludes:
      - Calibration whose decisive operation is evolving a domain-specific state model, domain-specific
        PDE or particle simulation, and general statistical inference without numerical fitting.
      prerequisites: []
      sampling_facets:
      - id: objective_family
        description: Sample quadratic and robust residual objectives while holding the central fit-and-diagnose
          operation fixed.
      sample_tasks:
      - kind: entry
        instruction: Given paired scalar observations and an array API, compute a least-squares line,
          plot its residuals, and report one conditioning check.
      - kind: representative
        instruction: Given a design matrix with leverage points and response outliers, implement quadratic-
          and absolute-residual fits, compare optimizer and residual diagnostics, and select the objective
          justified by a supplied measurement-error model.
    - id: c15.1
      parent_id: c15
      name: Continuum mechanics, flow, and field simulation
      kind: group
      scope: 'Continuum discretizations separated by the decisive numerical operation: linear finite-element
        solution, nonlinear incremental finite-element equilibrium, conservative scalar or compressible
        flux advancement, incompressible pressure-velocity solution, stationary elliptic solution, explicit
        diffusion integration, stiff split reaction-diffusion integration, and wave propagation.'
      includes:
      - Linear and nonlinear finite-element mechanics, conservation-law fluxes, incompressible flow, stationary
        elliptic fields, explicit transient diffusion, stiff split reaction-diffusion, and standalone
        wave propagation.
      excludes:
      - Particle trajectories, electronic wavefunctions, parallel execution as the primary problem, and
        conceptual PDE classification without a numerical solve.
    - id: c15.1.1
      parent_id: c15.1
      name: Linear finite-element mechanics
      kind: capability
      outcome: Assemble and solve a small-strain linear finite-element mechanics system, then assess constraints,
        rigid modes, conditioning, equilibrium, mesh convergence, and stress or displacement observables.
      includes:
      - Small-strain linear elasticity, linear element and constitutive matrices, global assembly, loads,
        constraints, one constrained linear solve, reactions, and mesh refinement.
      excludes:
      - Finite-strain or material-nonlinear residual and tangent iteration, load stepping, contact, fluid
        conservation-law fluxes, generic stationary fields, and molecular force fields.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given a small triangular linear-elasticity mesh, constitutive matrix, loads, and
          fixed nodes, assemble the constrained stiffness system and state one rigid-mode check.
      - kind: representative
        instruction: For a supplied small-strain elastic bracket with mixed loads and constraints, assemble
          and solve the linear finite-element system and use reaction balance, rigid-mode checks, conditioning,
          and mesh refinement to judge peak displacement and stress.
    - id: c15.1.7
      parent_id: c15.1
      name: Nonlinear incremental finite-element equilibrium
      kind: capability
      outcome: Solve a finite-strain or materially nonlinear finite-element mechanics problem through
        incremental residual and consistent-tangent equilibrium iterations, then assess convergence, step
        sensitivity, and path-dependent stress or displacement observables.
      includes:
      - Hyperelastic or supplied nonlinear constitutive response, internal-force residuals, consistent
        tangents, Newton iterations, load increments, convergence norms, and increment refinement without
        contact.
      excludes:
      - A single small-strain linear assembly and solve, contact or fracture as the decisive operation,
        fluid coupling, and molecular force integration.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given a nonlinear element residual, consistent tangent, current displacement, and
          one load increment, compute one Newton correction and the updated residual norm.
      - kind: representative
        instruction: For a supplied finite-strain hyperelastic body and load path, assemble residuals
          and consistent tangents, converge every load increment with Newton iterations, and use equilibrium,
          increment refinement, and force-displacement measurements to diagnose convergence and validate
          the response.
    - id: c15.1.2
      parent_id: c15.1
      name: Conservative scalar and compressible-flux advancement
      kind: capability
      outcome: Discretize and advance a scalar conservation law or compressible conservation-law system
        with numerical and boundary fluxes, then assess conservation, shock or wave resolution, stability,
        and convergence.
      includes:
      - Scalar advection, nonlinear scalar conservation laws, compressible Euler-like systems, finite-volume
        or conservative finite-difference updates, Riemann or upwind fluxes, limiters, and CFL reasoning.
      excludes:
      - Incompressible pressure projection or velocity-pressure coupling, pure diffusion or reaction,
        stationary elliptic potentials, standalone wave propagation judged by phase error, and solid mechanics.
      prerequisites: []
      sampling_facets:
      - id: conservation_system_family
        description: Cover scalar and compressible systems while retaining conservative numerical-flux
          construction, CFL control, and balance diagnostics.
      sample_tasks:
      - kind: entry
        instruction: Given a one-dimensional scalar advection law, grid, inflow data, timestep, and numerical-flux
          formula, compute one conservative update and check its CFL condition and total balance.
      - kind: representative
        instruction: Advance a supplied one-dimensional compressible shock-tube system, choose a Riemann
          flux and limiter, and use total conservation, positivity, shock location, and grid refinement
          to judge the result.
    - id: c15.1.6
      parent_id: c15.1
      name: Incompressible pressure-velocity flow solution
      kind: capability
      outcome: Solve an incompressible flow problem by coupling velocity and pressure, enforcing boundary
        compatibility, and assessing discrete divergence, pressure or force observables, stability, and
        grid-timestep convergence.
      includes:
      - Pressure projection, pressure-correction and saddle-point formulations, velocity-pressure compatibility,
        divergence-free constraints, incompressible boundary conditions, and mass-balance diagnostics.
      excludes:
      - Scalar or compressible Riemann-flux advancement, standalone pressure-wave propagation, pure diffusion
        or reaction, and stationary potentials not coupled to incompressible velocity.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given a provisional velocity field, pressure-Poisson stencil, boundary data, and
          timestep, solve one projection step, correct the velocity, and compute the discrete-divergence
          norm.
      - kind: representative
        instruction: Simulate a supplied two-dimensional incompressible channel-flow case, choose a pressure-velocity
          coupling and boundary treatment, and use divergence, mass imbalance, pressure-drop error, and
          grid-timestep refinement to judge the solution.
    - id: c15.1.3
      parent_id: c15.1
      name: Stationary elliptic field simulation
      kind: capability
      outcome: Assemble and solve a stationary elliptic boundary-value problem, then use residual, boundary,
        solver, and mesh-convergence evidence to validate field observables.
      includes:
      - Poisson, Laplace, steady conduction, and other variable-coefficient elliptic fields solved with
        finite differences, finite elements, or spectral discretizations.
      excludes:
      - Time integration, constitutive solid mechanics, fluid momentum-pressure coupling, advective flux
        systems, and wave dispersion.
      prerequisites: []
      sampling_facets:
      - id: elliptic_model_family
        description: Cover potential, steady-conduction, and steady-diffusion models whose central operation
          remains a stationary boundary-value solve.
      sample_tasks:
      - kind: entry
        instruction: Given a rectangular electrostatic domain, a five-point Poisson stencil, source values,
          and Dirichlet data, assemble the interior linear equations and compute their residual for a
          supplied candidate solution.
      - kind: representative
        instruction: Solve a supplied variable-coefficient steady-conduction problem with mixed boundary
          conditions, choose a sparse-solver stopping rule, and use boundary-flux balance plus mesh refinement
          to validate a requested temperature and heat-flux observable.
    - id: c15.1.4
      parent_id: c15.1
      name: Explicit transient diffusion integration
      kind: capability
      outcome: Advance a non-advective linear diffusion field with an explicit spatial stencil and timestep
        update, then assess the diffusion stability number, conservation or maximum-principle behavior,
        and temporal-spatial convergence.
      includes:
      - Transient heat or mass diffusion with explicit finite-difference or finite-volume updates, variable
        supplied diffusivity, boundary fluxes, diffusion stability limits, and dissipative-field observables.
      excludes:
      - Nonlinear or stiff reaction solves, operator splitting, implicit diffusion as the decisive solve,
        advective numerical fluxes, stationary elliptic solves, and wave propagation.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given a one-dimensional heat equation, grid, initial field, diffusivity, and explicit
          update, compute one timestep and determine whether the diffusion stability limit is satisfied.
      - kind: representative
        instruction: Advance a supplied two-dimensional variable-diffusivity heat field with an explicit
          conservative stencil, choose a stable timestep, and use heat balance, maximum-principle checks,
          and grid and timestep refinement to judge a temperature observable.
    - id: c15.1.8
      parent_id: c15.1
      name: Stiff split reaction-diffusion integration
      kind: capability
      outcome: Integrate a stiff reaction-diffusion system by composing diffusion and implicit nonlinear
        reaction substeps, then assess nonlinear convergence, positivity, splitting error, spatial-temporal
        convergence, and coupled-field observables.
      includes:
      - Multiple reacting fields, stiff supplied reaction Jacobians, implicit local reaction solves, Lie
        or Strang operator splitting, positivity control, and splitting-error diagnosis.
      excludes:
      - Pure explicit linear diffusion, advective numerical fluxes, monolithic fluid pressure-velocity
        coupling, stationary elliptic solves, and wave propagation.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given two reaction-diffusion fields, supplied diffusion and implicit-reaction substep
          formulas, a reaction Jacobian, and one timestep, perform one Lie-split step and report nonlinear
          residual and positivity checks.
      - kind: representative
        instruction: Integrate a supplied stiff two-species reaction-diffusion model with Strang splitting
          and an implicit reaction solve, then separate nonlinear-solver, splitting, timestep, and spatial
          error in the onset time of a pattern while preserving positivity.
    - id: c15.1.5
      parent_id: c15.1
      name: Wave-field propagation
      kind: capability
      outcome: Propagate a standalone wave field through a spatial medium and assess stability, numerical
        phase and amplitude error, boundary reflection, and grid-timestep convergence.
      includes:
      - Scalar acoustic, elastic-wave, and electromagnetic-style propagation when the decisive operation
        is resolving wave travel, phase, and reflection rather than fluid transport.
      excludes:
      - Compressible-flow shocks or material transport governed by fluid fluxes, quantum-state propagation,
        stationary fields, and diffusive decay.
      prerequisites: []
      sampling_facets:
      - id: wave_model_family
        description: Cover acoustic, elastic, and electromagnetic-style supplied wave models with the
          same propagation and dispersion diagnostics.
      sample_tasks:
      - kind: entry
        instruction: Given a one-dimensional wave equation, centered update, wavespeed, grid, and timestep,
          compute one update and check the stated stability limit and phase-speed error for one wavelength.
      - kind: representative
        instruction: Propagate a supplied pulse through a heterogeneous medium with an absorbing boundary,
          then use grid and timestep refinement, measured phase speed, amplitude loss, and reflected energy
          to validate the simulation.
    - id: c15.2
      parent_id: c15
      name: High-performance and parallel computing
      kind: group
      scope: Execution architectures for scientific workloads, separated by memory model, device-kernel
        operation, streaming synthesis, host-device movement, or live timing constraints.
      includes:
      - Shared-memory threads, distributed message passing, GPU kernels, FPGA dataflow, heterogeneous
        offload, and real-time pipeline synchronization.
      excludes:
      - Deriving the scientific model, generic deployment, and media operations with no parallel, throughput,
        or deadline constraint.
    - id: c15.2.1
      parent_id: c15.2
      name: Distributed-memory decomposition and execution
      kind: capability
      outcome: Decompose a scientific computation across distributed-memory processes, implement communication
        and synchronization, and evaluate numerical agreement, load balance, scalability, and communication
        cost.
      includes:
      - Domain and task decomposition, message passing, collectives, halo exchange, strong and weak scaling,
        distributed load balance, and reproducibility.
      excludes:
      - Shared-memory race and cache behavior as the central problem, device-kernel tuning, host-device
        transfer scheduling, and real-time control deadlines.
      prerequisites: []
      sampling_facets:
      - id: decomposition_regime
        description: Cover regular spatial and irregular work-balanced decompositions while holding explicit
          inter-process communication and scaling diagnosis fixed.
      sample_tasks:
      - kind: entry
        instruction: Given a serial two-dimensional stencil and a four-process topology, partition the
          domain, identify halo messages and synchronization points, and state a numerical-equivalence
          check.
      - kind: representative
        instruction: Parallelize a supplied irregular particle-neighbor calculation across cluster processes
          and use scaling, load-imbalance, communication, and reproducibility measurements to choose between
          spatial and work-queue decomposition.
    - id: c15.2.6
      parent_id: c15.2
      name: Shared-memory parallel execution
      kind: capability
      outcome: Parallelize a scientific workload within shared memory, preserving race-free semantics
        while improving scheduling, cache locality, reduction behavior, and NUMA scaling.
      includes:
      - Threaded loops and tasks, synchronization, race detection, reductions, false sharing, cache locality,
        affinity, NUMA placement, and shared-memory scaling.
      excludes:
      - Explicit inter-process messages and halos, accelerator kernels, host-device copies, and hard real-time
        coordination.
      prerequisites: []
      sampling_facets:
      - id: shared_parallel_pattern
        description: Cover loop-reduction and irregular task-scheduling models while retaining shared-state
          correctness and memory-locality diagnosis.
      sample_tasks:
      - kind: entry
        instruction: Given a threaded array reduction with a race and per-thread counters on adjacent
          cache lines, repair the reduction and identify a false-sharing check.
      - kind: representative
        instruction: Parallelize a supplied irregular mesh traversal on a multisocket shared-memory machine,
          choose task scheduling and data placement, and use race, cache-miss, NUMA-traffic, load-balance,
          and scaling evidence to validate it.
    - id: c15.2.2
      parent_id: c15.2
      name: GPU and data-parallel kernel optimization
      kind: capability
      outcome: Map a data-parallel scientific kernel to a GPU-like accelerator and improve it through
        thread decomposition, memory hierarchy, occupancy, divergence, profiling, and numerical-agreement
        reasoning.
      includes:
      - SIMD or SIMT execution, coalescing, shared memory, occupancy, divergence, profiler counters, throughput,
        and floating-point validation.
      excludes:
      - FPGA pipeline synthesis, whole-application offload partitioning, distributed message passing,
        and CPU threading as the primary operation.
      prerequisites: []
      sampling_facets:
      - id: kernel_bottleneck_regime
        description: Cover bandwidth-, occupancy-, and divergence-limited kernels while retaining profile-guided
          SIMT mapping and validation.
      sample_tasks:
      - kind: entry
        instruction: Given a reference matrix stencil and GPU memory layout, assign outputs to threads
          and identify one uncoalesced access and one numerical-agreement tolerance.
      - kind: representative
        instruction: Optimize a supplied GPU pairwise-interaction kernel from profiler counters, choose
          between tiling, layout, and occupancy revisions, and verify speedup and numerical error against
          the CPU reference.
    - id: c15.2.3
      parent_id: c15.2
      name: FPGA streaming dataflow design
      kind: capability
      outcome: Design and assess an FPGA-oriented streaming computation by choosing numeric representation,
        pipeline stages, initiation interval, buffering, and resource allocation under throughput and
        latency constraints.
      includes:
      - Streaming dataflow, pipelining, fixed-point error, on-chip buffers, initiation interval, logic
        and memory resources, and synthesis evidence.
      excludes:
      - GPU occupancy tuning, distributed decomposition, whole-application offload, and generic digital-logic
        recall.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given a three-stage streaming numerical filter and an FPGA resource table, compute
          the bottleneck initiation interval and identify the buffer required between two stages.
      - kind: representative
        instruction: Design an FPGA pipeline for a supplied low-latency numerical filter, choose fixed-point
          widths and stage replication, and use synthesis resource, latency, throughput, and error reports
          to judge the specification.
    - id: c15.2.4
      parent_id: c15.2
      name: Heterogeneous offload and memory movement
      kind: capability
      outcome: Partition a scientific application between host and accelerator, schedule transfers and
        kernels, and use dependency and profiling evidence to reduce movement and overlap costs without
        changing numerical results.
      includes:
      - Host-device partitioning, transfer boundaries, asynchronous copies, kernel overlap, persistent
        device data, batching, and end-to-end profiling.
      excludes:
      - Optimizing the internal device kernel, synthesizing FPGA logic, cluster message passing, and independently
        timed live sensory coordination.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given a host timeline with two dependent kernels and three arrays, mark necessary
          transfer boundaries and one legal copy-compute overlap.
      - kind: representative
        instruction: Profile a supplied CPU-accelerator simulation loop, choose stages and persistent
          data to offload, and show from an end-to-end timeline that the partition reduces transfer overhead
          while preserving results.
    - id: c15.2.5
      parent_id: c15.2
      name: Real-time heterogeneous pipeline synchronization
      kind: capability
      outcome: Coordinate independently timed computational stages under a latency budget using timestamps,
        buffering, scheduling, and stale-data policy, then validate latency, jitter, consistency, and
        safe degradation.
      includes:
      - CPU, GPU, or FPGA coordination across rendering, sensing, simulation, and force-feedback stages;
        deadline analysis; buffering; and failure recovery.
      excludes:
      - Offline throughput optimization, host-device movement without a live deadline, and media filtering
        based only on a recorded timeline.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given timestamped producer-consumer traces and a latency budget, select a buffer
          and stale-sample policy and calculate the worst observed end-to-end delay.
      - kind: representative
        instruction: Design synchronization for a supplied visuo-haptic simulator with mismatched rendering,
          tissue-solve, and servo rates, then use latency and jitter traces to choose prediction, buffering,
          or dropped updates while preserving force-data consistency.
    - id: c15.3
      parent_id: c15
      name: Signal and image processing
      kind: group
      scope: Sampled-signal, audio, video, and scientific-image operations separated by the invariant
        or transformation that determines correctness.
      includes:
      - Signal filtering, audio representation conversion, video geometry and timed filtering, image calibration,
        and quantitative image measurement.
      excludes:
      - Graphics rendering performance, live haptic synchronization, and generative image content.
    - id: c15.3.1
      parent_id: c15.3
      name: Sampled-signal analysis and filtering
      kind: capability
      outcome: Analyze and transform a sampled one-dimensional signal with spectral or time-domain operations,
        accounting for aliasing, filter response, edge handling, and quantitative detection or reconstruction
        error.
      includes:
      - Fourier analysis, convolution, digital filtering, spectral estimation, sampling, aliasing, windowing,
        and signal-to-noise measurements.
      excludes:
      - Audio container and channel conversion, video geometry, image segmentation, and live multi-rate
        synchronization.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given a sampled sinusoid mixture and sample rate, locate aliased components and choose
          a cutoff for a supplied low-pass filter.
      - kind: representative
        instruction: Given a noisy transient sensor trace, design a filtering and spectral-analysis procedure
          and quantify detection error and sensitivity to window, cutoff, and boundary handling.
    - id: c15.3.2
      parent_id: c15.3
      name: Audio resampling and representation conversion
      kind: capability
      outcome: Convert sampled audio between rates, channel layouts, and numeric representations while
        preserving duration and signal meaning and verifying samples and metadata.
      includes:
      - Resampling, antialias filtering, channel mixing, integer and floating-point conversion, clipping
        and quantization checks, and metadata validation.
      excludes:
      - General signal analysis without a representation-conversion target, codec implementation, and
        video transforms.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given a 48 kHz stereo floating-point recording and a 16 kHz mono integer target,
          specify resampling, mixing, scaling, and clipping checks.
      - kind: representative
        instruction: Convert a supplied multichannel recording to a stated archival representation and
          validate duration, channel semantics, passband preservation, quantization error, peak levels,
          and metadata.
    - id: c15.3.3
      parent_id: c15.3
      name: Video geometry and aspect correction
      kind: capability
      outcome: Transform video pixel dimensions and aspect metadata so displayed geometry is correct across
        outputs, choosing resampling and validating proportions from sample and display aspect ratios.
      includes:
      - Sample, storage, and display aspect ratios; square-pixel conversion; scaling; interlaced geometry;
        and output metadata.
      excludes:
      - Timestamp-selective effects, scientific-image physical calibration, and content segmentation.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given a 352 by 576 frame with sample aspect ratio 24:11 and display aspect ratio
          4:3, compute square-pixel output dimensions for a maximum width of 200.
      - kind: representative
        instruction: Repair a supplied anamorphic interlaced clip for square-pixel image export and encoded-video
          delivery, choosing scaling and aspect metadata and validating circular and frame-proportion
          references.
    - id: c15.3.4
      parent_id: c15.3
      name: Time-selective video filtering
      kind: capability
      outcome: Apply and validate video transformations over selected timeline intervals by reasoning
        about timestamps, time bases, filter enablement, boundaries, and frame-accurate output behavior.
      includes:
      - Timestamp expressions, constant- and variable-frame-rate timelines, interval boundaries, filter
        state, and decoded-frame verification.
      excludes:
      - Video aspect correction, live cross-device deadlines, and untimed image processing.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given a constant-frame-rate clip and start and end timestamps, write the enable interval
          for a horizontal-flip filter and identify the first affected frame.
      - kind: representative
        instruction: For a supplied variable-frame-rate clip, apply one transform only between two presentation
          timestamps and validate both boundaries using decoded timestamps rather than frame counts.
    - id: c15.3.5
      parent_id: c15.3
      name: Scientific-image geometry and calibration
      kind: capability
      outcome: Map scientific-image pixels to corrected physical coordinates using calibration metadata,
        distortion or aspect models, interpolation, and landmark error measurements.
      includes:
      - Anisotropic pixel scales, stage calibration, affine and nonlinear distortion correction, interpolation,
        landmarks, and physical-length validation.
      excludes:
      - Display-only video aspect metadata, region segmentation, and image generation.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given unequal horizontal and vertical pixel scales and three calibration landmarks,
          map one pixel coordinate to physical units and compute its reference error.
      - kind: representative
        instruction: Correct a supplied microscopy image using stage calibration and a distortion model,
          choose interpolation, and quantify landmark and measured-length error before and after correction.
    - id: c15.3.6
      parent_id: c15.3
      name: Computational image measurement and segmentation
      kind: capability
      outcome: Extract and quantify specified image structure with segmentation or feature measurements
        and assess accuracy and sensitivity against annotations or physical references.
      includes:
      - Thresholding, morphology, connected regions, feature extraction, overlap metrics, physical measurements,
        and parameter sensitivity.
      excludes:
      - Coordinate calibration as the central operation, display geometry, and generative image editing.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given one calibrated grayscale image and a reference mask, apply a supplied threshold
          rule and compute intersection-over-union and area error.
      - kind: representative
        instruction: Measure a particle-size distribution in supplied noisy micrographs, choose segmentation
          and connected-region operations, and report accuracy and distribution sensitivity across preprocessing
          and thresholds.
    - id: c15.4
      parent_id: c15
      name: Earth and climate systems modeling
      kind: group
      scope: Earth-system computations that either propagate supplied scenarios through explicit impact
        rules or evolve and calibrate process states.
      includes:
      - Climate-scenario arithmetic and classification, Earth-system process simulation, calibration,
        hindcasts, spatial residuals, and ensemble sensitivity.
      excludes:
      - Earth-science recall without a computation, cosmological simulation, and generic fitting detached
        from an Earth-system representation.
    - id: c15.4.1
      parent_id: c15.4
      name: Climate scenario propagation and impact classification
      kind: capability
      outcome: Apply supplied climate-change scenarios to baseline variables and map projected values
        through an explicit impact, biome, hazard, or regime rule while reporting threshold sensitivity.
      includes:
      - Scenario deltas or factors, regional baselines, supplied lookup or threshold models, classifications,
        and uncertainty near regime boundaries.
      excludes:
      - Calibrating or integrating a process model, unsupported biome recall, and causal attribution not
        encoded in the supplied rule.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Apply a 20 percent precipitation decrease and 4 degree temperature increase to a
          supplied baseline, then use a provided biome table to identify the projected class.
      - kind: representative
        instruction: Using supplied regional baselines, three climate scenarios, and a drought-impact
          threshold model, compute projected classifications and determine which conclusions are stable
          to threshold and scenario uncertainty.
    - id: c15.4.2
      parent_id: c15.4
      name: Process-based Earth-system simulation and calibration
      kind: capability
      outcome: Configure, evolve, calibrate, and evaluate a spatial or temporal Earth-system process model
        using forcing, state, boundary, observation, and uncertainty information.
      includes:
      - Hydrologic, land-surface, atmospheric, ecosystem, and coupled process models; parameter calibration;
        hindcasts; residuals; and ensemble projections.
      excludes:
      - Direct application of a supplied scenario classification rule and generic regression whose decisive
        operation does not evolve Earth-system state.
      prerequisites: []
      sampling_facets:
      - id: spatial_model_regime
        description: Cover lumped and gridded process models while retaining state evolution, observation
          comparison, and uncertainty-aware calibration.
      sample_tasks:
      - kind: entry
        instruction: Given a one-box soil-moisture balance, daily forcing, and one unknown drainage parameter,
          compute a short trajectory and identify the observation used to calibrate the parameter.
      - kind: representative
        instruction: Calibrate a supplied gridded watershed or land-surface model against held-out streamflow
          or soil-moisture observations and use spatial residuals plus ensemble sensitivity to assess
          one projected response.
    - id: c15.5
      parent_id: c15
      name: Electronic-structure and quantum simulation
      kind: group
      scope: Quantum computations separated into linear stationary eigenproblem solution, nonlinear self-consistent
        stationary electronic structure, real-time propagation, imaginary-time stochastic sampling, and
        semiclassical phase-weighted trajectory approximation.
      includes:
      - Linear stationary spectra, self-consistent electronic structure, quantum dynamics, path integrals,
        and semiclassical trajectory methods.
      excludes:
      - Classical molecular simulation, continuum wave propagation, quantum recall without a computation,
        and quantum hardware programming.
    - id: c15.5.1
      parent_id: c15.5
      name: Stationary linear quantum eigenproblems
      kind: capability
      outcome: Represent and solve a stationary linear quantum eigenproblem using a supplied Hamiltonian,
        basis or grid, and direct or iterative eigensolver, then assess spectral residuals, orthogonality,
        representation convergence, and static observables.
      includes:
      - Finite or sparse Hermitian Hamiltonians, low eigenpairs, direct and iterative eigensolvers, basis
        and grid convergence, residual norms, orthogonality, energies, and static observables.
      excludes:
      - Density-dependent Hamiltonian construction and self-consistent iteration, real-time propagation,
        imaginary-time path sampling, semiclassical trajectories, and continuum wave travel.
      prerequisites: []
      sampling_facets:
      - id: eigensolver_regime
        description: Cover direct dense and iterative sparse eigensolvers while retaining linear spectral
          solution, residual, orthogonality, and representation-convergence validation.
      sample_tasks:
      - kind: entry
        instruction: Given a finite Hamiltonian matrix, compute its two lowest eigenpairs and evaluate
          each residual norm.
      - kind: representative
        instruction: Using a supplied sparse grid Hamiltonian and iterative eigensolver interface, obtain
          the lowest stationary states and use residual norms, orthogonality, and grid refinement to judge
          an energy gap and static-density observable.
    - id: c15.5.5
      parent_id: c15.5
      name: Self-consistent stationary electronic-structure iteration
      kind: capability
      outcome: Construct and converge a stationary electronic-structure fixed point with a density- or
        potential-dependent Hamiltonian, choosing occupations, mixing, and stopping criteria and validating
        energy, density, and representation convergence.
      includes:
      - Self-consistent-field loops, density or potential updates, occupation handling, damping or mixing,
        charge-sloshing diagnosis, basis or grid convergence, and stationary electronic observables.
      excludes:
      - One-shot linear eigenproblems with a fixed Hamiltonian, real-time quantum propagation, imaginary-time
        path sampling, and semiclassical trajectories.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given an initial density, a density-dependent Hamiltonian rule, occupations, and
          a linear-mixing parameter, perform one self-consistent iteration and compute the density residual.
      - kind: representative
        instruction: Configure a supplied molecular self-consistent electronic-structure calculation,
          diagnose charge sloshing from convergence traces, choose a mixing and stopping rule, and use
          basis, energy, and density convergence to judge an energy difference and charge feature.
    - id: c15.5.2
      parent_id: c15.5
      name: Real-time quantum-state propagation
      kind: capability
      outcome: Propagate a wavefunction or density operator in real time with a specified Hamiltonian
        and assess norm or trace, phase, timestep, spatial-discretization, and observable error.
      includes:
      - Unitary or controlled open-system updates, wavepacket dynamics, timestep and grid convergence,
        norm or trace diagnostics, and dynamical observables.
      excludes:
      - Stationary eigensolution as the target, imaginary-time sampling, classical waves, and semiclassical
        phase sums.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given a discretized wavefunction, Hamiltonian, and supplied unitary update, perform
          one timestep and compute norm drift.
      - kind: representative
        instruction: Propagate a supplied wavepacket through a one-dimensional barrier and use timestep
          and grid refinement, norm conservation, and transmitted probability to validate the result.
    - id: c15.5.3
      parent_id: c15.5
      name: Quantum path-integral sampling
      kind: capability
      outcome: Estimate finite-temperature or imaginary-time quantum observables by constructing and sampling
        a discretized path integral and diagnosing time-slice, sampling, and autocorrelation error.
      includes:
      - Imaginary-time paths, bead updates, Euclidean action, Monte Carlo acceptance, estimator uncertainty,
        effective sample size, and time-slice convergence.
      excludes:
      - Real-time unitary dynamics, stationary eigenproblems, and classical stochastic lattice models.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given a discretized imaginary-time harmonic-oscillator path and a Metropolis proposal,
          calculate the action change and acceptance probability for one bead update.
      - kind: representative
        instruction: Estimate a supplied finite-temperature quantum position variance with path-integral
          Monte Carlo and use bead-count convergence, effective sample size, and estimator uncertainty
          to judge the result.
    - id: c15.5.4
      parent_id: c15.5
      name: Semiclassical trajectory and stationary-phase methods
      kind: capability
      outcome: Approximate a quantum amplitude or observable with classical trajectories and phase information,
        identifying stationary contributions and assessing phase cancellation, caustics, and semiclassical
        validity.
      includes:
      - Classical actions, stationary phase, trajectory ensembles, prefactors, interference, caustic treatments,
        and asymptotic-regime checks.
      excludes:
      - Pure conceptual recall, exact real-time quantum propagation, path-integral Monte Carlo, and classical
        molecular dynamics without phase information.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given three candidate paths with supplied actions and second derivatives, identify
          stationary contributions and compute their leading phase factors.
      - kind: representative
        instruction: Approximate a supplied one-dimensional transition amplitude from a classical trajectory
          ensemble, account for phase cancellation and a stated caustic treatment, and compare results
          across decreasing semiclassical parameters.
    - id: c15.6
      parent_id: c15
      name: Molecular dynamics and mesoscale simulation
      kind: group
      scope: Discrete matter and population simulations separated by atomistic force integration, coarse-particle
        mapping, stochastic lattice transitions, or autonomous-agent decisions.
      includes:
      - Atomistic and coarse-grained particles, stochastic lattice models, and agent-based simulation.
      excludes:
      - Continuum field solves, electronic-structure calculations, and generic discrete-event systems
        without a scientific model.
    - id: c15.6.1
      parent_id: c15.6
      name: Atomistic molecular dynamics
      kind: capability
      outcome: Construct and analyze an atomistic trajectory using force fields, integration, ensembles,
        and boundaries, then assess stability, equilibration, sampling, and structural or transport observables.
      includes:
      - Atom-level force fields, neighbor handling, time integration, thermostats, periodic boundaries,
        equilibration, and trajectory estimators.
      excludes:
      - Coarse bead mapping, quantum electronic dynamics, lattice transitions, and agent decisions.
      prerequisites: []
      sampling_facets:
      - id: ensemble_regime
        description: Cover energy-conserving and thermostatted ensembles while retaining atomistic force
          integration and trajectory validation.
      sample_tasks:
      - kind: entry
        instruction: Given atoms, Lennard-Jones parameters, positions, velocities, and a timestep, compute
          one velocity-Verlet update and the change in total energy.
      - kind: representative
        instruction: Design and analyze an atomistic liquid simulation, choosing cutoff, timestep, ensemble,
          and equilibration window, then assess a diffusion coefficient using energy stability and block-averaged
          uncertainty.
    - id: c15.6.2
      parent_id: c15.6
      name: Coarse-grained particle simulation
      kind: capability
      outcome: Construct and validate a particle simulation whose beads aggregate microscopic degrees
        of freedom, including mapping, effective interactions, integration, and scale-appropriate observables.
      includes:
      - Atom-to-bead mapping, effective potentials, bead dynamics, parameter fitting to structural or
        thermodynamic targets, and scale consistency.
      excludes:
      - Fully atomistic force fields, site-state lattice models, and autonomous agents.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given an atom-to-bead mapping and target radial distribution, compute one effective
          pair-force update and identify the structural discrepancy used to tune it.
      - kind: representative
        instruction: Build a supplied bead-spring polymer simulation, select coarse interactions and integration
          scale, and use structure and diffusion comparisons to judge whether the mapping preserves requested
          behavior.
    - id: c15.6.3
      parent_id: c15.6
      name: Stochastic lattice simulation
      kind: capability
      outcome: Implement and analyze a lattice-state model with local transition or sampling rules, boundary
        conditions, and finite-size or autocorrelation diagnostics for collective observables.
      includes:
      - Spin, lattice-gas, occupancy, or cellular state models; local stochastic updates; equilibration;
        repeated seeds; autocorrelation; and finite-size scaling.
      excludes:
      - Continuous particle integration, quantum imaginary-time paths, and heterogeneous agent decision
        rules.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given a small Ising lattice, temperature, and proposed spin flip, compute the energy
          change and Metropolis acceptance probability.
      - kind: representative
        instruction: Simulate a supplied lattice-gas transition and use equilibration, autocorrelation,
          repeated seeds, and finite-size scaling to assess the estimated transition point.
    - id: c15.6.4
      parent_id: c15.6
      name: Agent-based simulation
      kind: capability
      outcome: Construct and evaluate a simulation of heterogeneous autonomous agents by specifying state,
        decision and interaction rules, scheduling, environment, stochasticity, and emergent-outcome validation.
      includes:
      - Heterogeneous agent state, local decisions, interactions, synchronous or asynchronous scheduling,
        environment coupling, repeated seeds, and emergent summaries.
      excludes:
      - Homogeneous lattice transition rules, continuous particle mechanics, and generic workflow agents
        without a scientific population model.
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given two agent states and local interaction rules, execute one asynchronous update
          and identify how a synchronous update could change the outcome.
      - kind: representative
        instruction: Construct a supplied evacuation-agent model with heterogeneous speeds and route choices,
          then use repeated seeds and observed flow summaries to decide whether a claimed bottleneck is
          a mechanism rather than a scheduling artifact.
- routing_facet: subject_domain
  curriculum:
    version: wave7-10
    subject_id: C02
    subject_name: Software QA & Testing
    sections:
    - kind: group
      id: c02.planning_design
      parent_id: null
      name: Test planning and design
      scope: Turning supplied product behavior, risks, and constraints into testing priorities,
        discriminating suites, specialized assurance checks, and maintainable automation.
      includes:
      - Risk-based strategy and coverage allocation
      - Functional and specialized test design
      - Implementation of supplied test intent in an existing harness
      excludes:
      - Executing a prepared run and interpreting its evidence
      - Exploratory sessions and defect investigation
      - Organization-wide quality governance
    - kind: capability
      id: c02.test_strategy
      parent_id: c02.planning_design
      name: Create a risk-based test strategy
      outcome: Produce a prioritized, feasible test strategy from supplied scope, changes,
        failure impacts, constraints, and release goals, making coverage goals, test levels,
        environments, data needs, and entry and exit criteria explicit.
      includes:
      - Ranking test effort by likelihood, impact, novelty, and exposure
      - Choosing test levels and coverage goals that address named risks
      - Planning environments, data, dependencies, and completion criteria
      excludes:
      - Writing individual test cases or automated test code
      - Running tests or deciding the cause of an observed failure
      - Project scheduling or release approval without a testing decision
      prerequisites: []
      sampling_facets:
      - id: release_context
        description: Sample hotfixes, migrations, regressions, and constrained releases while
          holding risk prioritization and coverage allocation fixed.
      sample_tasks:
      - kind: entry
        instruction: A checkout release changes tax rounding and address validation. Tax errors
          can overcharge customers; address errors can block orders. You have four tester-hours,
          one supported browser, and no production data. Write a prioritized test approach
          naming what to test first, what to defer, required synthetic data, and a concrete
          stopping condition.
      - kind: representative
        instruction: Plan testing for a service migration from one database to regional replicas.
          Reads may be stale for two seconds, writes must never be lost, failover may take
          thirty seconds, three client versions remain supported, staging has two regions,
          and the release window permits twelve tester-days. Produce a risk-ranked strategy
          covering test levels, workloads and data, environment use, observability, regression
          scope, dependencies, entry and exit criteria, and justified exclusions.
    - kind: capability
      id: c02.functional_suite_design
      parent_id: c02.planning_design
      name: Design a functional test suite
      outcome: Design a compact, traceable functional suite from supplied behavior using deterministic
        input partitions and rules, histories of state or prior actions, or both when they
        jointly affect observable results.
      includes:
      - Stateless suites spanning input partitions, boundaries, and deterministic rule combinations
      - Stateful suites spanning transitions, workflows, retries, recovery, and role-dependent
        histories
      - One coherent integrated suite when deterministic rules and stateful sequences jointly
        determine results
      - Explicit preconditions, actions, intermediate or final oracles, and requirement traceability
      - Removal of redundant cases within or across the supplied behavior models
      excludes:
      - Concurrency schedules, generated property testing, accessibility conformance, or covering-array
        construction
      - Executing or automating the designed suite
      - Choosing release-level risk allocation or resource strategy
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Design a compact black-box suite for `POST /credits`. Amount must be
          1 through 500 inclusive and the account must be active. The first request with an
          idempotency key credits the balance; a repeat with the same key must return the
          original result without a second credit. Give concrete inputs, request histories,
          expected statuses and balances, and traceability to every boundary, rule, and repeat-request
          behavior.
      - kind: representative
        instruction: Prepare one acceptance suite for an expense workflow. Amounts from $0.01
          through $5,000 are allowed; a receipt is required above $25; amounts through $500
          need manager approval and larger amounts need manager then finance; rejection requires
          a comment; only Draft or Rejected items may be edited; Approved items are immutable
          and exported nightly; users may view only their own or assigned items. Provide compact
          end-to-end scenarios with roles and data, cover boundaries $25, $25.01, $500, $500.01,
          and $5,000, include rejection and resubmission plus authorization denial, state
          expected status and visibility after each action, and map every rule to cases without
          duplicating equivalent setup.
    - kind: capability
      id: c02.stateless_case_design
      parent_id: c02.functional_suite_design
      name: Derive cases from input partitions and rules
      outcome: Derive a compact, traceable set of test cases with explicit expected results
        by partitioning a supplied input domain, exercising boundaries, and selecting combinations
        that distinguish deterministic rules independent of prior actions.
      includes:
      - Equivalence partitions and boundary-value cases
      - Decision-table and deterministic rule-combination coverage
      - Positive, negative, and validation cases with explicit oracles
      excludes:
      - History-dependent workflows or state-transition coverage
      - Adaptive exploratory testing or specialized adequacy methods
      - Implementing cases in a test framework
      prerequisites: []
      sampling_facets:
      - id: interface_surface
        description: Sample function, CLI, API, and GUI inputs when requirements and observables
          are supplied; the operation remains partitioning deterministic input and rule space.
      sample_tasks:
      - kind: entry
        instruction: An integer field accepts values from 1 through 120 inclusive and rejects
          every other integer. Derive the smallest useful set of normal and boundary test
          cases, giving the input and expected accept or reject result for each.
      - kind: representative
        instruction: 'Design a compact test set for this discount rule: members receive 10%
          off orders of at least $50; non-members receive 5% off orders of at least $100;
          a valid one-use coupon adds 5 percentage points but cannot be used on clearance
          items; invalid coupons show an error and apply no coupon discount. Include threshold
          boundaries, outcome-changing combinations, invalid inputs, an expected result for
          every case, and traceability to each rule or boundary.'
    - kind: capability
      id: c02.stateful_case_design
      parent_id: c02.functional_suite_design
      name: Derive state-transition and workflow cases
      outcome: Derive test sequences and expected state or output after each step from a supplied
        lifecycle, protocol, or role-sensitive workflow, covering valid transitions, forbidden
        transitions, recovery paths, and selected path interactions.
      includes:
      - State-transition and transition-pair coverage
      - Workflow paths, role changes, retries, cancellation, and recovery
      - Expected intermediate and final states for each sequence
      excludes:
      - Independent input partitions with no relevant history
      - Concurrent interleavings, barriers, clocks, or race campaigns
      - Executing the designed workflow cases
      prerequisites: []
      sampling_facets:
      - id: system_model
        description: Sample lifecycles, protocols, approval workflows, and transactions while
          retaining selection and checking of state histories.
      sample_tasks:
      - kind: entry
        instruction: An account starts Active. Three consecutive failed logins move it to
          Locked; a successful login before the third failure resets the count; only an administrator
          can move Locked back to Active. Derive sequences for every transition and one forbidden
          transition, stating the expected state and failure count after each step.
      - kind: representative
        instruction: Design stateful tests for an order with states Draft, Submitted, Paid,
          Shipped, Cancelled, and Refunded. Submission requires an item; payment is allowed
          only from Submitted; cancellation from Draft or Submitted; shipping only from Paid;
          a shipped order may be refunded but not cancelled; failed payment leaves the order
          Submitted and may be retried. Provide a compact set of sequences covering valid
          and forbidden transitions, retry and recovery, cancellation at each allowed point,
          and a payment-to-shipping transition pair. State expected state and observable result
          after every action.
    - kind: group
      id: c02.specialized_design
      parent_id: c02.planning_design
      name: Specialized test design and adequacy
      scope: Test-design methods whose generation model, control mechanism, or adequacy contract
        differs materially from example-based functional case derivation.
      includes:
      - Combinatorial, generative, concurrency, performance, accessibility, and mutation-based
        methods
      - Method-specific adequacy evidence and observability
      excludes:
      - General risk strategy or ordinary example-based case tables
      - Prepared execution and defect triage
    - kind: capability
      id: c02.combinatorial_design
      parent_id: c02.specialized_design
      name: Construct a constrained combinatorial test suite
      outcome: Construct a valid t-wise configuration suite from supplied factors and constraints,
        demonstrate interaction coverage, and add focused scenarios for named risks that the
        covering model does not represent.
      includes:
      - Pairwise or higher-strength covering arrays
      - Validity constraints and explicit interaction-coverage accounting
      - Targeted non-combinatorial cases justified by supplied high-risk behavior
      excludes:
      - Exhaustive configuration enumeration without minimization
      - Property-based generators and shrinking
      - General risk strategy unrelated to the chosen configuration model
      prerequisites: []
      sampling_facets:
      - id: configuration_domain
        description: Sample platforms, protocols, and feature configurations while holding
          constrained t-wise construction and coverage accounting fixed.
      sample_tasks:
      - kind: entry
        instruction: Create a pairwise matrix for browser={Chrome, Firefox}, account={free,
          paid}, and theme={light, dark}, with the constraint that dark theme is unavailable
          to free accounts. List valid configurations and show where each valid pair is covered.
      - kind: representative
        instruction: Select a compact pairwise matrix for OS={Windows, macOS, Ubuntu}, browser={Chrome,
          Firefox, Safari}, camera={built-in, USB}, network={wired, Wi-Fi, 4G}, and account={free,
          enterprise}. Safari is available only on macOS, 4G is unavailable on Ubuntu, and
          enterprise accounts are unsupported on Firefox. Show coverage of every valid pair,
          then add focused cases for reconnect after an outage and camera removal during a
          call, with observable join, continuity, and cleanup criteria.
    - kind: capability
      id: c02.property_based_design
      parent_id: c02.specialized_design
      name: Design property-based tests and shrinkers
      outcome: Translate a supplied behavioral contract into valid and invalid input generators,
        invariant or relational properties, useful seeds, and shrinking guidance that preserves
        the conditions needed to expose a counterexample.
      includes:
      - Generator distributions and validity constraints
      - Invariants, round trips, metamorphic relations, and reference oracles
      - Counterexample shrinking and boundary seeds
      excludes:
      - Only enumerating example cases
      - Mutation-score interpretation
      - Implementing a new property-testing framework
      prerequisites: []
      sampling_facets:
      - id: input_shape
        description: Sample strings, numeric structures, and nested collections when contract
          facts are supplied; generator-property-shrinker design remains fixed.
      sample_tasks:
      - kind: entry
        instruction: For `dedupe(values)`, whose contract is to preserve first occurrence
          order and be idempotent, specify a list generator, two properties, five boundary
          seeds, and how a failing list should shrink without discarding the duplicate relation.
      - kind: representative
        instruction: 'Design property-based tests for `normalize_path(path: str) -> str`.
          Inputs are absolute POSIX paths using ASCII letters, digits, slash, dot, underscore,
          and hyphen; repeated slashes collapse; `.` disappears; `..` removes one ordinary
          segment but cannot traverse above root; output begins with one slash and has no
          trailing slash except root; normalization is idempotent; inputs over 4096 characters
          raise ValueError. Provide generators, properties or oracles, shrinking constraints,
          and at least eight seeds emphasizing root, repeated separators, nested `..`, `.cache`,
          and the length boundary.'
    - kind: capability
      id: c02.concurrency_test_design
      parent_id: c02.specialized_design
      name: Design deterministic concurrency tests
      outcome: Design controlled concurrent schedules that make ordering observable through
        barriers, controllable time, fault injection, and invariants, including cleanup and
        repeatability for race-sensitive behavior.
      includes:
      - Specified interleavings and synchronization barriers
      - Atomicity, idempotency, ownership, and rollback invariants
      - Virtual clocks, deterministic faults, and post-run state checks
      excludes:
      - Sequential state-transition suites
      - Load and capacity measurement without an ordering hypothesis
      - Debugging an already observed race to production-code root cause
      prerequisites: []
      sampling_facets:
      - id: concurrency_surface
        description: Sample transactions, queues, leases, and shared-memory services when
          synchronization controls are supplied; explicit schedule and invariant design remains
          fixed.
      sample_tasks:
      - kind: entry
        instruction: A counter starts at 0. Its contract is that each `increment()` atomically
          adds 1 and returns the new value, so two completed increments must return 1 and
          2 in some order and leave the counter at 2. The candidate implementation exposes
          test hooks immediately after its internal read and immediately before its write,
          allowing workers to be paused and released independently. Design two deterministic
          schedules, including one that forces both workers to reach the post-read hook before
          either write, with barrier steps, expected return-value multiset `{1, 2}`, required
          final value 2, the lost-update failure signature, and cleanup that resets the counter
          and hooks between repetitions.
      - kind: representative
        instruction: Plan deterministic tests for a seat-reservation race. `POST /holds` atomically
          creates one 120-second hold for an available seat; concurrent requests for one seat
          yield exactly one 201 and the rest 409; purchase succeeds only for the current unexpired
          owner; expiration and purchase at the same timestamp are ordered by commit time;
          repeated client request IDs are idempotent. Specify controllable clock, barriers,
          fixtures, invariants, cleanup, and at least six exact schedules covering two users,
          same-user retries, expiry versus purchase, and rollback after an injected transaction
          failure.
    - kind: capability
      id: c02.performance_test_design
      parent_id: c02.specialized_design
      name: Design performance and load tests
      outcome: Design a repeatable performance or load experiment from supplied service-level
        objectives, workload and capacity facts, environment controls, and measurement constraints,
        with explicit traffic phases, observations, and pass or fail oracles.
      includes:
      - Workload mix, arrival rate or concurrency, test data, warm-up, ramp, steady-state,
        and duration
      - Latency percentiles, throughput, error rate, saturation, queueing, and resource measurements
        tied to supplied objectives
      - Baselines, repetitions, environment controls, stopping criteria, and validity limitations
      excludes:
      - Analyzing a completed performance run
      - Broad capacity architecture, production tuning, or cost optimization
      - Deterministic race scheduling whose oracle depends on one interleaving rather than
        aggregate measurements
      prerequisites: []
      sampling_facets:
      - id: workload_surface
        description: Sample request-driven services, interactive clients, and batch jobs while
          the SLO-to-workload, phase, measurement, repetition, and oracle design loop remains
          fixed.
      sample_tasks:
      - kind: entry
        instruction: Design a repeatable load test for a read-only API whose objective is
          to sustain 100 requests per second for 10 minutes with p95 latency at most 200 ms
          and error rate below 1%. One isolated staging instance and synthetic IDs are available.
          Specify warm-up, steady-state traffic and pacing, measurement window, latency and
          error observations, two repetitions, pass or fail calculations, environment reset,
          and a safety stop condition.
      - kind: representative
        instruction: Design a performance campaign for a checkout service with workload mix
          70% browse, 20% cart update, and 10% purchase. At 500 requests per second for 30
          steady-state minutes, browse and cart p95 must be at most 250 ms, purchase p95 at
          most 400 ms and p99 at most 800 ms, total error rate below 0.5%, and CPU below 80%
          for at least 95% of one-minute samples. Staging has four workers, controllable synthetic
          accounts, and request, queue, CPU, memory, and database metrics. Specify data and
          environment controls, warm-up and ramp, pacing or concurrency, steady measurement
          windows, percentile and error calculations, resource observations, baseline, repetitions,
          stopping criteria, result-validity checks, and deliberate exclusions.
    - kind: capability
      id: c02.accessibility_testing
      parent_id: c02.specialized_design
      name: Design accessibility conformance tests
      outcome: Turn supplied accessibility requirements and interface facts into test cases
        with observable keyboard, focus, semantic, announcement, contrast-independent, zoom,
        and reflow oracles, using assistive technology where required.
      includes:
      - Keyboard-only operation and focus management
      - Accessible names, roles, relationships, state, and announcements
      - Zoom, reflow, and non-color cues with explicit observable results
      excludes:
      - General visual styling review
      - Usability research without a conformance oracle
      - Implementing accessibility fixes
      prerequisites: []
      sampling_facets:
      - id: interaction_pattern
        description: Sample dialogs, forms, navigation, and dynamic collections while retaining
          accessibility-observable case design and conformance adjudication.
      sample_tasks:
      - kind: entry
        instruction: 'Design tests for a form whose three required fields show inline errors
          after Submit. Requirements: every field has an accessible name, each error is programmatically
          linked to its field, focus moves to the error summary, and activating a summary
          link focuses the field. Give keyboard and screen-reader actions with observable
          expected results.'
      - kind: representative
        instruction: Create an accessibility checklist and detailed cases for a modal checkout
          dialog with a heading, address fields, error summary, Cancel, and Place order. On
          open focus moves to the heading; Tab and Shift+Tab remain inside; Escape closes
          unless submission is in progress; close returns focus to the launch button; errors
          are linked and announced; keyboard activation and 200% zoom work; background content
          is hidden from assistive technology. Cover keyboard, screen-reader semantics, focus
          order, error recovery, zoom and reflow, and color-independent errors, with setup,
          actions, and observable expected results.
    - kind: capability
      id: c02.mutation_adequacy
      parent_id: c02.specialized_design
      name: Use mutation results to improve test adequacy
      outcome: Interpret surviving mutants against the intended behavior, distinguish killable,
        equivalent, and redundant mutants, and add the smallest clear tests whose observations
        discriminate the missing behaviors.
      includes:
      - Mapping mutants to untested decisions or boundaries
      - Selecting minimal discriminating cases and predicting mutant kills
      - Explaining information gained beyond structural coverage
      excludes:
      - Using mutation score as a quality guarantee
      - General property-generator design
      - Repairing the production implementation
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: A function should return true exactly when `age >= 18`. The only existing
          test is `19 -> true`, so a mutant changing `>=` to `>` survives. Add the exact-boundary
          case that kills the mutant, state the expected result for the original and mutant
          at that boundary, and explain why the existing passing test and line coverage did
          not reveal the weakness.
      - kind: representative
        instruction: 'For `eligible(age, active, overdue)`, intended to be true only when
          age is at least 18, active is true, and overdue is false, the only existing test
          is `(19,true,false)->true`. Four mutants survive that test: M1 changes `age >= 18`
          to `age > 18`; M2 removes the active check; M3 removes the overdue check; M4 replaces
          `active and not overdue` with `active or not overdue`. Design the smallest clear
          additional cases that kill all four survivors, show the original and mutant result
          each case distinguishes, identify any equivalent mutant or any mutant killed redundantly
          by cases needed for other survivors, give the complete parameterized table including
          the existing test, and explain what the mutation results reveal beyond line coverage.'
    - kind: capability
      id: c02.automation_implementation
      parent_id: c02.planning_design
      name: Implement maintainable automated checks
      outcome: Translate supplied test intent, interface contract, and existing harness conventions
        into deterministic executable tests with controlled setup, meaningful assertions,
        isolation, synchronization, and cleanup.
      includes:
      - Implementing unit, API, CLI, integration, or UI checks in an existing harness
      - Selecting assertions and data from a supplied oracle
      - Using fixtures, fakes, observable synchronization, parameterization, and cleanup
      excludes:
      - Inventing the product requirement or overall strategy
      - Building a new test framework or diagnosing an unexplained failure
      - Changing production behavior to make a check pass
      prerequisites: []
      sampling_facets:
      - id: automation_surface
        description: Sample unit, API, CLI, integration, and browser harnesses with interfaces
          and conventions supplied; deterministic setup, action, assertion, synchronization,
          isolation, and cleanup remain fixed.
      sample_tasks:
      - kind: entry
        instruction: 'Using pytest, write executable tests for `clamp(value: int, low: int,
          high: int) -> int`: return `low` below the range, `high` above it, and `value` inside;
          raise ValueError when `low > high`. Cover the three return regions and the error
          without changing the function.'
      - kind: representative
        instruction: Implement pytest tests for `reserve(client, sku, quantity)`, which sends
          `POST /reservations` through a supplied fake client. A 201 returns the parsed reservation,
          409 raises `OutOfStock`, other 4xx raises `RequestRejected`, and clients must not
          be shared. Use the fake's response queue and request history to cover success, both
          failure classes, request construction, quantities 1 and 20, and isolation. Do not
          change production code or the fake.
    - kind: capability
      id: c02.deterministic_regression_maintenance
      parent_id: c02.planning_design
      name: Maintain deterministic product regression tests
      outcome: Compare a supplied product contract with deterministic code behavior or observations,
        identify evidence-supported product or oracle discrepancies, and author executable
        regression tests that distinguish each discrepancy from correct behavior.
      includes:
      - Contract-to-code or contract-to-result discrepancy analysis
      - Minimal boundary, validation, and rule cases that reproduce deterministic mismatches
      - Executable regression coverage with expected-versus-actual evidence and bounded defect
        dispositions
      excludes:
      - Intermittent, order-dependent, or timing-dependent failures in the test mechanism
      - Clean-room implementation when no product discrepancy is being analyzed
      - Changing production code, inventing requirements, or general investigation without
        executable regression output
      prerequisites: []
      sampling_facets:
      - id: product_surface
        description: Sample library functions, service responses, and business-rule implementations
          while deterministic contract comparison and regression-case authoring remain fixed.
      sample_tasks:
      - kind: entry
        instruction: 'The contract for `adult(age)` is false below 18 and true at 18 or above;
          the supplied implementation is `def adult(age): return age > 18`. Compare the implementation
          with the contract at 17, 18, and 19, identify the narrowest deterministic discrepancy,
          and write a minimal executable pytest regression that fails on the supplied implementation
          and passes on contract-conforming behavior. Include a bounded defect disposition
          without changing production code.'
      - kind: representative
        instruction: "Review this implementation against its contract and produce maintained\
          \ pytest coverage. Contract: `tier` is `standard` or `premium`; whole-number weights\
          \ 1 through 50 are accepted; standard costs $5 plus $2 per kilogram, premium costs\
          \ $10 plus $1 per kilogram; weights over 20 add $15; invalid tier and non-integer\
          \ or out-of-range weight raise ValueError. Implementation: `def shipping_cost(weight,\
          \ tier):\n    if weight < 1 or weight >= 50:\n        raise ValueError('weight')\n\
          \    base, rate = (10, 1) if tier == 'premium' else (5, 2)\n    total = base + rate\
          \ * weight\n    if weight >= 20:\n        total += 15\n    return total`. Identify\
          \ each evidence-supported product or oracle mismatch without changing production\
          \ code, write a minimal executable pytest regression suite that distinguishes the\
          \ mismatches from correct behavior, give an expected-versus-implementation result\
          \ table, and record separate concise defect dispositions only where the tests support\
          \ distinct causes."
    - kind: capability
      id: c02.flaky_test_repair
      parent_id: c02.planning_design
      name: Diagnose and repair flaky or brittle automated tests
      outcome: Use repeated-run evidence, traces, controlled ordering, or timing controls
        to identify an intermittent or brittle test mechanism, repair it with deterministic
        synchronization or isolation, and verify that the repaired automated test preserves
        the intended product assertion.
      includes:
      - Trace-based diagnosis of fixed waits, races, unstable observables, and asynchronous
        timing
      - Order-dependence and shared-fixture diagnosis with controlled reruns
      - Executable synchronization or isolation repairs plus repeated-run confirmation
      excludes:
      - Deterministic product-contract discrepancy analysis
      - Clean-room test implementation when no unreliable check exists
      - Production-code repair or general failure isolation that does not repair the automated
        test
      prerequisites:
      - c02.automation_implementation
      sampling_facets:
      - id: brittleness_mechanism
        description: Sample asynchronous timing and shared-state or order dependence while
          trace-based test-mechanism diagnosis, deterministic repair, and confirmation remain
          fixed.
      sample_tasks:
      - kind: entry
        instruction: An existing Playwright test clicks Save, waits 100 ms, and expects a
          success toast. The product contract says a 200 response updates the saved value;
          across 20 runs, responses arrive after 120-350 ms, five tests fail, no request fails,
          and the value is present after every response. Diagnose the supported test-mechanism
          failure, replace the fixed delay with an executable assertion synchronized to the
          response or saved-value state, and specify a repeated-run experiment that confirms
          the repair without claiming a product defect.
      - kind: representative
        instruction: 'Two pytest checks use `clock = FakeClock(0)` at module scope and a fixture
          `def fake_clock(): return clock`. `test_expired` advances the clock to 121 seconds
          and checks that a 120-second token is expired; `test_fresh` creates a new token
          and expects it to remain valid at time 0. Each test passes alone, but with randomized
          order `test_fresh` fails whenever it follows `test_expired`; production traces show
          the token calculation receives the fixture''s current time. Diagnose the supported
          source of order dependence, repair the fixture and assertions so each test has isolated
          deterministic time, and define randomized-order and repeated-run checks that confirm
          the repair while preserving the intended expiry behavior.'
    - kind: group
      id: c02.execution_diagnosis
      parent_id: null
      name: Exploration, execution, and defect evidence
      scope: Planning and conducting exploratory sessions, adjudicating prepared runs, isolating
        failures, and communicating evidence-supported defects.
      includes:
      - Exploratory charters and adaptive sessions
      - Prepared execution and outcome adjudication
      - Failure isolation, evidence synthesis, and defect communication
      excludes:
      - Up-front release strategy and case derivation
      - Production-code or test-code repair
      - Release management and organization-wide governance
    - kind: group
      id: c02.exploratory_practice
      parent_id: c02.execution_diagnosis
      name: Exploratory testing practice
      scope: Creating focused exploratory charters and conducting adaptive observe-select-execute-record
        sessions.
      includes:
      - Charter design, tours, heuristics, and session boundaries
      - Adaptive test selection and session notes
      excludes:
      - Fixed scripted execution
      - Controlled isolation of a known failure
    - kind: capability
      id: c02.exploratory_chartering
      parent_id: c02.exploratory_practice
      name: Create an exploratory testing charter
      outcome: Create a time-boxed exploratory charter from supplied product behavior and
        risks, defining a focused mission, personas and data, tours or heuristics, evidence
        to capture, stopping conditions, questions, and a session-note structure without pre-judging
        outcomes.
      includes:
      - Turning named risks into a bounded mission and initial tours
      - Choosing personas, data, heuristics, evidence, and stopping conditions
      - Separating observation, defect, question, and coverage fields in notes
      excludes:
      - Conducting the adaptive session
      - Long-term release strategy and resource allocation
      - Predetermining scripted cases or defect conclusions
      prerequisites: []
      sampling_facets:
      - id: product_surface
        description: Sample interactive applications, APIs, and command-line products while
          risk-to-charter framing and session boundaries remain fixed.
      sample_tasks:
      - kind: entry
        instruction: Write a 20-minute charter for exploring filename collisions in an upload
          feature that preserves file contents but displays names case-insensitively. Include
          mission, three risks, starter data, two heuristics, evidence to capture, and a stopping
          condition.
      - kind: representative
        instruction: Write a 60-minute exploratory charter for a redesigned grocery cart.
          Quantities range 1-99; zero removes after confirmation; prices may change with delivery
          slot; coupons may be item-specific or basket-wide with at most one basket-wide coupon;
          stock changes asynchronously; signed-in carts persist across devices. Include mission,
          risks, personas and data, time-boxed tour, heuristics, evidence, stopping conditions,
          follow-up questions, and a note template separating observations, defects, questions,
          and coverage.
    - kind: capability
      id: c02.exploratory_session
      parent_id: c02.exploratory_practice
      name: Conduct an adaptive exploratory test session
      outcome: Use a supplied charter and system interface to iteratively choose, execute,
        and adapt tests from observations while maintaining notes that distinguish coverage,
        questions, anomalies, and reproducible issues.
      includes:
      - Turning a supplied charter into initial probes
      - Selecting the next test from prior observations and heuristics
      - Recording paths, data, observations, anomalies, and remaining questions
      excludes:
      - Authoring the charter as the primary assignment
      - Following a fixed procedure without adaptation
      - Root-cause analysis or production-code repair
      prerequisites: []
      sampling_facets:
      - id: interface_surface
        description: Sample web, mobile, CLI, and API sessions with interface facts supplied;
          the adaptive observe-select-execute-record loop is unchanged.
      sample_tasks:
      - kind: entry
        instruction: 'Conduct the next two steps of a filename-collision charter against this
          deterministic file API. Initial state: upload `report.txt` with bytes `alpha` returned
          id `f1`; upload `Report.txt` with bytes `beta` returned id `f2`; `GET /files` now
          returns one row `[{"id":"f2","name":"report.txt"}]`. Available actions are `GET
          /files`, `GET /files/{id}`, `DELETE /files/{id}`, and `POST /files` with `{name,
          bytes}`. The simulator returns: `GET /files/f1` -> 404; `GET /files/f2` -> 200 with
          bytes `beta`; deleting an existing id -> 204 and removes it; deleting a missing
          id -> 404; uploading `REPORT.TXT` with bytes `gamma` -> 201 id `f3`, after which
          the list contains only f3. Choose a first action that discriminates loss from display-only
          aliasing, use its stated response to choose and execute a second action, and record
          each step in rows with hypothesis, request, response, observation, next-choice rationale,
          coverage, anomaly, and open question. Do not assign a root cause.'
      - kind: representative
        instruction: 'Conduct an adaptive paper session against this deterministic note-API
          simulator. Authentication headers are `Authorization: Bearer alice` and `Authorization:
          Bearer bob`. Initial state: Alice owns `a1` text `old` and `a2` text `keep`; Bob
          owns `b1` text `private`. Interfaces are `POST /notes {text}` -> 201 with id, `PATCH
          /notes/{id} {text}` -> 200, `DELETE /notes/{id}` -> 204, `GET /notes/{id}`, and
          `GET /notes?limit=2&cursor=<id-or-empty>`. Execute requests by consulting these
          branch responses: two rapid PATCHes of a1 to `first` then `second` both return 200,
          but the next GET a1 returns `first`; Bob GET a1 returns 200 with Alice''s text,
          while Bob''s list returns only b1; deleting a2 then GET a2 returns 404, but Alice''s
          first list page still contains a2 until a subsequent create; after Alice creates
          text `new`, her list omits a2 and returns the new id plus a1. Charter: investigate
          data loss and cross-user visibility around rapid edits, deletion, pagination, and
          the two users. Choose an initial request sequence, use each supplied response to
          select the next discriminating request, and record chronological rows with authenticated
          request, response, observation, hypothesis, follow-up rationale, coverage, anomaly
          status, and unresolved question. Finish with separately identified reproducible
          anomalies and do not claim root causes.'
    - kind: capability
      id: c02.evidence_to_defect
      parent_id: c02.execution_diagnosis
      name: Decide and communicate one end-to-end defect disposition
      outcome: For one suspected issue, make an end-to-end QA disposition by adjudicating
        raw evidence, selecting and evaluating only the controls needed to decide whether
        the issue is reportable, and filing or withholding one bounded defect report with
        an explicit evidence-based rationale.
      includes:
      - One issue-centered decision from initial oracle comparison through reportability judgment
      - Targeted controls that resolve a material confounder, affected scope, or product-versus-test
        classification
      - A final file, withhold, or inconclusive disposition that integrates facts, impact,
        uncertainty, and evidence references
      excludes:
      - Prepared test execution whose goal ends at pass, fail, blocked, or inconclusive classification
      - Failure isolation whose goal ends at the narrowest trigger without a reportability
        decision
      - Formatting already complete supplied evidence into a defect report without adjudication
        or a material control
      - Unrelated bundles of execution, diagnosis, and reporting deliverables or multi-issue
        campaigns
      - Production or test-code repair
      - Root-cause claims unsupported by the controlled evidence
      prerequisites: []
      sampling_facets:
      - id: evidence_surface
        description: Sample code, service, migration, performance, UI, and visual evidence
          when oracle and controls are supplied; the stable operation is one issue-centered
          reportability decision from evidence to file, withhold, or inconclusive disposition.
      sample_tasks:
      - kind: entry
        instruction: 'The contract for `adult(age)` is false below 18 and true at 18 or above;
          the supplied implementation is `def adult(age): return age > 18`. Run and record
          cases 17, 18, and 19, adjudicate each result, use the neighboring controls to decide
          whether the discrepancy is reportable, and return one file, withhold, or inconclusive
          disposition. If filing, include environment, minimal steps, expected and actual
          results, affected boundary, impact, and no claim beyond the evidence; otherwise
          state the evidence-based reason not to file.'
      - kind: representative
        instruction: 'Decide the disposition of one reported normalization issue. The implementation
          is `def normalize(names): return sorted({name.strip().lower() for name in names
          if name})`; the contract is sorted unique non-empty lowercase names after trimming.
          Run `['' A '', ''a'', '' '']` and targeted controls for empty, whitespace-only,
          ordinary padded, and duplicate values; minimize the discrepancy and separate implementation
          behavior from oracle or environment effects. Return one file, withhold, or inconclusive
          disposition. If filing, write one actionable report with the smallest reproducer,
          affected scope, evidence, impact, uncertainty, and no speculative root cause; otherwise
          identify the unresolved or non-defect evidence that controls the decision.'
    - kind: capability
      id: c02.test_execution
      parent_id: c02.execution_diagnosis
      name: Execute prepared tests and adjudicate outcomes
      outcome: Execute a supplied test procedure in its specified environment, compare observations
        with the oracle, distinguish pass, fail, blocked, and inconclusive outcomes, and preserve
        a reproducible execution record without inferring an unsupported cause.
      includes:
      - Preparing specified data and environment state
      - Following manual or automated procedures and capturing actual results
      - Classifying outcomes and summarizing a run with evidence and blockers
      excludes:
      - Choosing adaptive next tests during exploration
      - Diagnosing the triggering condition or root cause
      - Writing a defect report from the execution record
      prerequisites: []
      sampling_facets:
      - id: execution_surface
        description: Sample GUI procedures, API calls, CLI commands, and automated suites
          when procedure and oracle are supplied; adjudication and evidence capture remain
          fixed.
      sample_tasks:
      - kind: entry
        instruction: Create a temporary Python file containing `print('PASS' if 6 * 7 == 42
          else 'FAIL')`, run it with Python 3, compare stdout with expected text `PASS`, and
          record command, exit code, stdout, and pass, fail, blocked, or inconclusive status.
      - kind: representative
        instruction: 'Execute a supplied command-line release candidate against this matrix:
          `convert 0 C F` prints `32.0`; `convert 100 C F` prints `212.0`; `convert 32 F C`
          prints `0.0`; `convert bad C F` exits 2 with stderr; `convert 10 K C` is blocked
          because Kelvin support is absent. Start in a clean temporary directory, run each
          executable row, capture command, exit code, stdout, and stderr, classify every row,
          and summarize the run without diagnosing mismatches.'
    - kind: capability
      id: c02.failure_investigation
      parent_id: c02.execution_diagnosis
      name: Reproduce and isolate a test failure
      outcome: Use controlled reruns to confirm a reported failure, minimize its reproducing
        conditions, separate product behavior from test or environment effects, and state
        the narrowest evidence-supported trigger without claiming an unverified root cause.
      includes:
      - Reproducing deterministic failures and characterizing intermittent ones
      - Varying one relevant condition at a time and minimizing data or steps
      - Distinguishing product, test, configuration, and environment contributions
      excludes:
      - Fixing production or test code
      - Assigning ownership without evidence
      - Formatting the result as a complete defect report
      prerequisites:
      - c02.test_execution
      sampling_facets:
      - id: system_layer
        description: Sample library, service, CLI, and UI failures with controllable inputs
          and environments supplied; controlled reproduction and minimization remain fixed.
      sample_tasks:
      - kind: entry
        instruction: A prepared export test passes with locale `en_US` and fails with `fr_FR`;
          all other environment values and the input are identical. Execute both prescribed
          variants, compare each observation with its supplied oracle, preserve the run evidence,
          and state the narrowest supported trigger without proposing a root cause.
      - kind: representative
        instruction: 'Investigate `def normalize(names): return sorted({name.strip().lower()
          for name in names if name})`, whose contract is sorted unique non-empty lowercase
          names after trimming. Execute the reported failing input `['' A '', ''a'', '' '']`,
          minimize it, test empty strings, whitespace-only strings, duplicates, and ordinary
          names one variable at a time, and report the smallest reproducer, affected and unaffected
          conditions, actual versus expected behavior, and whether evidence implicates implementation,
          oracle, or environment. Do not modify the code.'
    - kind: capability
      id: c02.defect_reporting
      parent_id: c02.execution_diagnosis
      name: Write an actionable evidence-based defect report
      outcome: Transform supplied observations and investigation evidence into a concise,
        reproducible defect report that separates facts from inference and communicates environment,
        preconditions, steps, expected and actual behavior, frequency, impact, and relevant
        attachments.
      includes:
      - Selecting a minimal reproducible sequence from supplied evidence
      - Writing precise expected and actual results and environment details
      - Expressing frequency, impact, uncertainty, and evidence references without overclaiming
      excludes:
      - Performing missing reproduction or root-cause investigation
      - Choosing a production fix
      - Making a release decision or assigning blame
      prerequisites: []
      sampling_facets:
      - id: evidence_regime
        description: Sample deterministic, intermittent, environment-specific, and regression
          evidence; factual reproduction, impact, uncertainty, and traceability remain fixed.
      sample_tasks:
      - kind: entry
        instruction: 'Turn these notes into a defect report: app 4.2.0 on Android 15; from
          an empty cart, add one item, open Cart, rotate, and the item disappears; expected
          retention; reproduced 3 of 3 times; `cart-rotate.mp4` is available. Include title,
          environment, preconditions, steps, expected and actual result, frequency, impact,
          and attachment.'
      - kind: representative
        instruction: 'Write one actionable report from this evidence: web client 8.7.1 on
          Firefox 130 saved a 200-character biography with a success response but refresh
          showed the previous text in 4 of 10 clean runs; 100-character biographies succeeded
          10 of 10; Chrome 130 succeeded 10 of 10 at both lengths; all responses were 200;
          traces and timestamps are attached; no cause is known. Select the minimal supported
          reproduction and state facts, expected and actual behavior, frequency, scope, impact,
          uncertainty, and evidence references without assigning ownership or inventing a
          cause.'
- routing_facet: subject_domain
  curriculum:
    version: wave7-4
    subject_id: C12
    subject_name: Robotics & Embodied Systems
    sections:
    - kind: group
      id: c12.perception
      parent_id: null
      name: Perception and sensor fusion
      scope: Extract, associate, calibrate, register, and fuse robot sensor observations into
        task-usable estimates of the robot, objects, and a spatial environment.
      includes:
      - Raw-observation geometric and semantic hypothesis extraction
      - Observation association, scalar or class decision calibration, and structured detection
        evaluation
      - Spatial and temporal registration, uncertainty-aware state estimation, and static
        mapping
      excludes:
      - Choosing robot motions or control commands
      - Constructing simulators or benchmark protocols
    - kind: capability
      id: c12.perception.spatial_registration
      parent_id: c12.perception
      name: Register spatial frames and rigid models
      outcome: Estimate and check a rigid spatial transform that registers sensor, robot,
        tool, or known object-model coordinates with observed coordinates.
      includes:
      - Rigid extrinsic calibration from matched geometric observations
      - Rigid object-model alignment, transform composition, and residual checks
      excludes:
      - Estimating clock offset or drift
      - Estimating a time-varying robot or object state
      - Inferring correspondences or semantic labels as the primary task
      prerequisites: []
      sampling_facets:
      - id: registration_role
        description: The transform may be a persistent sensor or tool extrinsic or a per-scene
          rigid object pose while the operation remains rigid registration with residual and
          ambiguity checks.
      sample_tasks:
      - kind: entry
        instruction: Three non-collinear points have coordinates A={(0,0,0),(1,0,0),(0,1,0)}
          in frame A and B={(1,2,0),(1,3,0),(0,2,0)} in frame B. Determine the rigid transform
          from A to B and verify it on all three correspondences.
      - kind: representative
        instruction: A rigid rectangular part has model-frame corners (0,0,0), (0.20,0,0),
          (0,0.10,0), and (0.20,0.10,0) meters. A depth camera reports corresponding points
          (0.50,0.20,1.00), (0.50,0.40,1.00), (0.40,0.20,1.00), and (0.39,0.41,1.08), each
          with 5 mm isotropic standard deviation. Estimate the model-to-camera rigid transform
          robustly, identify any inconsistent correspondence, report residuals and transform
          uncertainty, and explain any symmetry ambiguity.
    - kind: capability
      id: c12.perception.temporal_alignment
      parent_id: c12.perception
      name: Align sensor time bases
      outcome: Estimate clock offset and drift from related sensor signals and resample observations
        onto a common time base without hiding unsupported timing precision.
      includes:
      - Offset and affine clock-drift estimation
      - Interpolation and timing-uncertainty checks
      excludes:
      - Spatial extrinsic calibration
      - Fusing already synchronized observations into a state estimate
      - Network protocol debugging unrelated to measurement timing
      prerequisites: []
      sampling_facets:
      - id: signal_modality
        description: The aligned signals may be inertial, visual, range, encoder, force, or
          event streams when they contain a shared observable event or motion.
      - id: clock_model
        description: The clock relationship may contain a constant offset or affine offset-plus-drift
          while retaining the same alignment and uncertainty contract.
      sample_tasks:
      - kind: entry
        instruction: A contact event appears at times [1.02, 2.51, 4.03] seconds in sensor
          A and [0.92, 2.41, 3.93] seconds in sensor B. Estimate the constant offset that
          maps B timestamps to A timestamps and align the B events.
      - kind: representative
        instruction: Matched rotation peaks occur at camera-clock times [0, 10, 20, 30] seconds
          and IMU-clock times [0.18, 10.19, 20.21, 30.22] seconds. Fit an affine IMU-to-camera
          clock mapping, align IMU samples taken at [5.185, 15.200, 25.215] seconds to the
          camera clock, quantify the remaining timing residuals, and state the interpolation
          assumptions used.
    - kind: capability
      id: c12.perception.hypothesis_extraction
      parent_id: c12.perception
      name: Extract perceptual hypotheses from sensor observations
      outcome: Transform supplied raw or minimally processed robot sensor observations into
        task-usable geometric or semantic hypotheses with stated confidence and failure checks.
      includes:
      - Filtering, segmentation, clustering, and geometric feature extraction from image,
        depth, range, or tactile observations
      - Producing obstacle, surface, contact-event, landmark, or object hypotheses from supplied
        sensor and model semantics
      - Checking support, confidence, resolution, and invalid or missing measurements
      excludes:
      - Associating already extracted hypotheses across sensors or time
      - Tuning or scoring a perception component against labeled reference sets
      - Maintaining a persistent environment map or estimating a dynamic state
      - Training a learned perception architecture when its optimization is the primary task
      prerequisites: []
      sampling_facets:
      - id: observation_modality
        description: Observations may be visual, depth, range, or tactile when the task supplies
          their representation and the extraction rule or model outputs needed to form hypotheses.
      - id: hypothesis_form
        description: Outputs may be geometric primitives, obstacle clusters, contact events,
          landmarks, or semantic object candidates while support, confidence, and validity
          remain the evaluation contract.
      sample_tasks:
      - kind: entry
        instruction: A planar lidar returns beams (angle degrees, range meters) [(-20,2.0),(-10,1.0),(0,1.02),(10,2.4),(20,2.38)].
          Convert them to Cartesian points, split consecutive beams whenever adjacent-point
          distance exceeds 0.35 m, discard singleton clusters, and report each retained obstacle
          cluster's centroid, bounding box, nearest range, and member angles.
      - kind: representative
        instruction: A 4 by 4 registered RGB-D crop is represented by depth values in meters
          [[1.0,1.0,0,2.0],[1.02,1.01,0,2.02],[0,0,1.5,1.52],[0,0,1.49,1.51]] and red-object
          scores [[0.9,0.8,0.1,0.2],[0.85,0.75,0.1,0.2],[0.1,0.1,0.88,0.82],[0.1,0.1,0.86,0.80]].
          Keep pixels with valid depth and score at least 0.70, form four-connected components,
          and use pinhole parameters fx=fy=100 pixels and cx=cy=1.5 pixels to lift pixel (u,v,z)
          to ((u-cx)z/fx,(v-cy)z/fy,z). For each component report its pixel box, 3D centroid,
          depth span, mean score, and support count; reject components with fewer than three
          pixels and state any ambiguity caused by adjacent depths.
    - kind: capability
      id: c12.perception.observation_association
      parent_id: c12.perception
      name: Associate perceptual observations
      outcome: Establish and validate correspondences among supplied detections, features,
        tracks, or modalities using stated uncertainty, compatibility, and assignment constraints.
      includes:
      - Gating candidate matches using geometric, temporal, semantic, or uncertainty-normalized
        residuals
      - One-to-one or explicitly stated multi-hypothesis assignment
      - Reporting unmatched observations, ambiguity, and association cost
      excludes:
      - Extracting detections or features from raw sensor samples
      - Estimating a rigid frame transform as the primary result
      - Recursive state estimation after correspondences have been chosen
      - Scoring a detector against labeled ground truth
      prerequisites: []
      sampling_facets:
      - id: association_scope
        description: Matches may be within one modality over time or across modalities in
          one cycle when the task supplies comparable features and compatibility rules.
      sample_tasks:
      - kind: entry
        instruction: Camera bearings are [-8,12] degrees with standard deviations [2,2] degrees
          and radar bearings are [-6,10,15] degrees with standard deviations [2,2,2] degrees.
          Compute every normalized residual |bc-br|/sqrt(sigmac^2+sigmar^2) and gate at 3.0.
          Among gated one-to-one assignments, first maximize the number of matched pairs and
          then minimize total normalized residual; leave all remaining observations unmatched.
          Report the cost matrix, gated pairs, maximum cardinality, chosen assignment, unmatched
          observations, and the cost margin between the smallest and second-smallest total
          costs among assignments of that same maximum cardinality.
      - kind: representative
        instruction: 'Associate camera tracks A=(-8 degrees,2 degrees,car), B=(12 degrees,3
          degrees,cyclist), and C=(31 degrees,2 degrees,car) with radar detections R1=(-6
          degrees,1 degree,24 m,-3 m/s), R2=(15 degrees,2 degrees,11 m,0 m/s), R3=(28 degrees,1
          degree,35 m,-7 m/s), and R4=(10 degrees,1 degree,8 m,1 m/s). Compute normalized
          bearing residual, gate at 3.0, and solve a one-to-one assignment lexicographically:
          first maximize the number of gated matches and then minimize total residual. Return
          the full cost matrix, gated graph, maximum cardinality, chosen associations, unmatched
          items, and fused records. Define the assignment margin as the second-smallest minus
          smallest total residual among assignments having the same maximum cardinality, and
          report that margin, including zero if tied.'
    - kind: capability
      id: c12.perception.decision_calibration
      parent_id: c12.perception
      name: Calibrate scalar and class decisions
      outcome: Use labeled examples to select and assess scalar or class decision rules, thresholds,
        and operating points with confusion-based metrics and explicit tie breaks or deployment
        gates.
      includes:
      - Threshold and operating-point selection for labeled event or class scores
      - Confusion matrices, classwise precision, recall, specificity, and F-scores
      - Calibration choices under explicit recall, precision, false-alarm, or coverage constraints
      excludes:
      - Matching variable-size sets of spatial detections to structured ground truth
      - Constructing ranked detector precision-recall curves or average precision
      - Training or selecting a learned model architecture
      - End-to-end robot benchmark design or analysis
      prerequisites: []
      sampling_facets:
      - id: decision_target
        description: The labeled decision may be a binary sensor event or a supplied class-score
          decision when the operation remains selecting scalar thresholds or operating rules
          and evaluating a fixed confusion accounting contract.
      sample_tasks:
      - kind: entry
        instruction: 'Eight tactile samples give scalar slip scores and labels: [(0.23,1),(0.07,0),(0.22,1),(0.25,1),(0.10,0),(0.17,0),(0.25,1),(0.13,0)].
          Predict slip when score is at least T. Evaluate T in {0.10,0.15,0.20,0.25}, report
          each confusion matrix, precision, recall, and F1, and select the threshold with
          maximum F1, breaking ties by higher recall and then lower T.'
      - kind: representative
        instruction: 'Calibrate a tactile slip rule on labeled tuples (force_ratio,vibration_rms,label):
          [(0.23,0.35,1),(0.07,0.10,0),(0.22,0.25,1),(0.25,0.30,1),(0.10,0.20,0),(0.17,0.15,0),(0.25,0.28,1),(0.13,0.12,0)].
          The rule predicts slip when force_ratio>=T and vibration_rms>=V. Search T in {0.10,0.15,0.20,0.25}
          and V in {0.10,0.20,0.30}; report the confusion matrix, precision, recall, and F1
          for every pair; select maximum F1 with ties broken by higher recall and then lower
          T and V; and determine whether the chosen rule meets deployment gates recall>=0.90
          and precision>=0.75.'
    - kind: capability
      id: c12.perception.detection_evaluation
      parent_id: c12.perception
      name: Evaluate structured perception detections
      outcome: Match structured perception predictions to labeled reference objects under
        a supplied correspondence rule and quantify ranking, localization, and detection performance.
      includes:
      - One-to-one prediction-to-reference matching under IoU, distance, pose, or keypoint
        tolerances
      - Ranked true-positive and false-positive sequences, precision-recall curves, average
        precision, and final recall
      - Localization-error summaries and explicit detector deployment gates
      excludes:
      - Calibrating scalar or class decisions whose examples already have one label each
      - Associating unlabeled live observations across sensors or time
      - Extracting detections from raw observations
      - Designing an end-to-end robot benchmark across scenarios
      prerequisites: []
      sampling_facets:
      - id: detection_geometry
        description: Predictions may be image boxes, keypoints, poses, or 3D objects when
          the task supplies the correspondence threshold and retains one-to-one matching,
          ranked detection accounting, localization error, and coverage metrics.
      sample_tasks:
      - kind: entry
        instruction: At IoU threshold 0.5, ground-truth boxes are G1=[0,0,100,100] and G2=[150,0,250,100].
          Confidence-ranked predictions are P1=(0.9,[5,5,95,95]), P2=(0.7,[300,300,350,350]),
          and P3=(0.6,[148,2,252,98]). Greedily match each prediction to the unmatched ground
          truth of greatest IoU when the threshold is met, then report the needed IoUs, ranked
          TP/FP sequence, cumulative precision and recall, and final recall.
      - kind: representative
        instruction: Evaluate a picking-cell detector at IoU 0.5. Ground-truth boxes are G1=[0,0,100,100],
          G2=[150,0,250,100], and G3=[0,150,80,230]. Confidence-ranked predictions are P1=(0.95,[5,5,95,95]),
          P2=(0.90,[148,2,252,98]), P3=(0.70,[10,160,70,220]), P4=(0.60,[300,300,350,350]),
          and P5=(0.40,[0,0,100,100]). Greedily match each prediction to the unmatched ground
          truth of greatest IoU when IoU>=0.5. Report matching IoUs, the ranked TP/FP sequence,
          cumulative precision and recall, 11-point interpolated average precision, final
          recall, mean IoU over true positives, and whether gates AP>=0.75 and final recall>=0.90
          pass.
    - kind: capability
      id: c12.perception.state_estimation
      parent_id: c12.perception
      name: Fuse observations into state estimates
      outcome: Combine a stated process model, noisy measurements, and uncertainty to estimate
        a robot or object state and communicate consistency and confidence.
      includes:
      - Prediction and measurement updates
      - Uncertainty propagation, innovation checks, and outlier handling
      - Batch or recursive fusion of synchronized measurements
      excludes:
      - Calibrating sensor frames or clocks as the primary result
      - Building a persistent environment map
      - Selecting actions from the estimate
      prerequisites: []
      sampling_facets:
      - id: measurement_modality
        description: Measurements may come from proprioceptive, inertial, visual, radio, range,
          force, or external tracking sensors under supplied observation models.
      - id: state_geometry
        description: The estimated state may be scalar, Euclidean pose and velocity, or orientation-bearing
          state when the representation and process model are supplied.
      sample_tasks:
      - kind: entry
        instruction: A scalar position estimate has mean 4.0 m and variance 1.0 m^2. A direct
          sensor measurement is 5.0 m with variance 0.25 m^2. Perform one Gaussian measurement
          update and report the posterior mean, posterior variance, innovation, and innovation
          variance.
      - kind: representative
        instruction: A planar robot starts at state [x,y,vx,vy]=[0,0,1,0] with diagonal covariance
          [0.04,0.04,0.09,0.09]. Over two one-second steps, use the constant-velocity model
          with diagonal process noise [0.01,0.01,0.04,0.04]. Position measurements are [1.2,-0.1]
          then [8.0,0.2], each with diagonal covariance [0.09,0.09]. Produce the two predict-update
          estimates, apply a 95% innovation-consistency check, decide how to handle any inconsistent
          measurement, and report the resulting state uncertainty.
    - kind: capability
      id: c12.perception.environment_mapping
      parent_id: c12.perception
      name: Build spatial environment maps
      outcome: Accumulate registered observations at supplied poses into a static or snapshot-static
        spatial representation that distinguishes observed free space, occupied structure,
        semantics when supplied, and uncertainty.
      includes:
      - Occupancy, semantic-occupancy, or geometric map updates from rays, scans, or depth
        observations
      - Conflict handling, coverage checks, and map-quality summaries for a static observation
        interval
      excludes:
      - Estimating the sensor poses as the primary task
      - Inferring a single object's pose without maintaining an environment map
      - Inferring temporal occupancy transitions, tracking moving objects, or maintaining
        a dynamic map
      - Planning a route through the finished map
      prerequisites: []
      sampling_facets:
      - id: map_representation
        description: The map may be a two-dimensional occupancy grid, semantic occupancy layer,
          or three-dimensional voxel occupancy representation while evidence accumulation,
          conflict handling, and static-map quality checks remain fixed.
      sample_tasks:
      - kind: entry
        instruction: A one-dimensional occupancy grid has five cells with prior occupancy
          probability 0.5. A range beam from cell 1 passes through cells 2 and 3 and terminates
          in cell 4. Using log-odds increments -0.7 for traversed cells and +1.2 for the endpoint,
          update the five cell probabilities and label free, occupied, and unobserved cells.
      - kind: representative
        instruction: Build a 1 m-resolution occupancy map for cells x=0..5, y=0..5 from robot
          poses (1,1,0 degrees), (2,1,90 degrees), and (2,2,180 degrees). At each pose, forward,
          left, and right range readings in meters are [3,2,1], [2,3,1], and [1,2,2]. Trace
          grid cells with a stated deterministic line rule, add -0.5 log-odds to in-bounds
          traversed cells and +0.9 to an endpoint only when that endpoint is in bounds. For
          a ray whose endpoint is outside the grid, clip at the boundary, add only in-bounds
          free evidence, and do not create an occupied endpoint. Combine repeated evidence,
          identify conflicts, report final probabilities, and define coverage as the fraction
          of the 36 cells whose final log-odds is nonzero.
    - kind: group
      id: c12.control
      parent_id: null
      name: Control and motion planning
      scope: Map desired motion into robot coordinates; choose planned or reactive actions,
        contacts, and feedback; and assess closed-loop timing under geometric, dynamic, and
        safety constraints.
      includes:
      - Body-to-actuator rate conversion and configuration-space forward or inverse kinematics
      - Discrete and continuous planning, timed trajectories, and contact planning
      - Reactive behavior, feedback control, and embodied timing-safety budgets
      excludes:
      - Estimating the state or environment from sensor observations
      - Building simulation and benchmark infrastructure
    - kind: capability
      id: c12.control.rate_mapping
      parent_id: c12.control
      name: Map body motion to actuator rates
      outcome: Apply and verify a supplied instantaneous kinematic rate map from desired body
        or task-space motion to actuator rates, preserving the requested motion direction
        when enforcing actuator limits.
      includes:
      - Body-twist, curvature, or task-space velocity conversion to wheel or actuator rates
      - Common scaling, saturation, and achieved-motion reconstruction
      - Rate feasibility and sign-convention checks
      excludes:
      - Solving nonlinear pose reachability or inverse-kinematic branches
      - Interpolating between robot configurations
      - Collision-free path search, dynamic trajectory optimization, or feedback synthesis
      prerequisites: []
      sampling_facets:
      - id: actuator_layout
        description: The supplied rate map may describe differential, skid-steer, omnidirectional,
          aerial, or redundant actuator layouts when the task remains direct instantaneous
          conversion, limit scaling, and achieved-motion verification.
      sample_tasks:
      - kind: entry
        instruction: A differential-drive robot has wheel radius 0.10 m and axle track 0.50
          m. Convert desired body forward speed 0.60 m/s and yaw rate 0.40 rad/s into left
          and right wheel angular speeds using v_left=v-track*yaw_rate/2 and v_right=v+track*yaw_rate/2,
          then reconstruct the achieved body speed and yaw rate.
      - kind: representative
        instruction: A differential-drive robot has wheel radius 0.10 m, axle track 0.50 m,
          desired body speed 0.60 m/s, and desired curvature +1.2 1/m. Use v_left=v*(1-kappa*track/2),
          v_right=v*(1+kappa*track/2), and wheel angular speed=linear wheel speed/radius.
          Each motor is limited to 8.0 rad/s. Report unconstrained wheel rates, apply one
          common scale factor if needed, and report final commands, achieved body speed, yaw
          rate, curvature, and scale factor.
    - kind: capability
      id: c12.control.configuration_kinematics
      parent_id: c12.control
      name: Solve analytic planar configuration kinematics
      outcome: Solve and verify supplied analytic forward or inverse mappings between planar
        serial-arm configurations and task-space poses, including reachability, branch selection,
        joint limits, and kinematic interpolation.
      includes:
      - Planar serial-arm forward kinematics and pose residual checks
      - Supplied analytic inverse-kinematic branches, reachability, and joint-limit filtering
      - Interpolation between feasible configurations when collision and dynamic timing are
        not requested
      excludes:
      - Spatial, redundant, parallel, or iterative inverse kinematics without supplied analytic
        branches
      - Direct body-velocity conversion to actuator rates
      - Collision-free connectivity search
      - Timing a path under derivative limits or optimizing under dynamics
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: A planar two-link arm has lengths L1=0.60 m and L2=0.40 m and target
          wrist position (0.60,0.40) m. Joint limits are q1 in [-90,120] degrees and q2 in
          [0,150] degrees, so retain only the nonnegative-q2 branch. Use the supplied two-link
          inverse-kinematic formulas to solve q1 and q2, check reachability and limits, and
          verify the result by forward kinematics.
      - kind: representative
        instruction: A planar two-link arm has lengths L1=0.60 m and L2=0.40 m, target wrist
          position (0.60,0.40) m, limits q1 in [-90,120] degrees and q2 in [-150,150] degrees,
          and current configuration [0,30] degrees. Solve both inverse-kinematic branches,
          reject limit violations, choose the feasible solution with least Euclidean joint
          displacement from the current configuration, verify its task-space residual by forward
          kinematics, and generate five joint configurations including endpoints using cubic
          interpolation s(u)=3u^2-2u^3 at u={0,0.25,0.5,0.75,1}. Check every configuration
          against the limits.
    - kind: capability
      id: c12.control.discrete_planning
      parent_id: c12.control
      name: Plan over discrete robot states
      outcome: Search a supplied finite state-action graph for a feasible robot plan and justify
        cost, constraint, and reachability decisions.
      includes:
      - Grid, lattice, roadmap, and symbolic state-space search
      - Heuristic design and path-cost comparison on finite graphs
      excludes:
      - Sampling directly in a continuous configuration space
      - Time-parameterizing a path under dynamics
      - Selecting continuous feedback commands
      prerequisites: []
      sampling_facets:
      - id: state_abstraction
        description: States may encode position, heading, manipulation mode, or task predicates
          when transitions and costs are explicit and finite.
      sample_tasks:
      - kind: entry
        instruction: On a 4x4 four-connected grid, start at (1,1), finish at (4,4), and treat
          (2,1), (2,2), and (3,3) as blocked. Every move costs 1. Find a minimum-cost path
          and show enough frontier-cost reasoning to establish its optimality.
      - kind: representative
        instruction: A warehouse robot has states (cell,heading) on cells A-B-C in a row and
          D-E-F in a parallel row, with vertical links A-D, B-E, and C-F. Forward motion costs
          1, a 90-degree turn costs 0.4, reverse motion is forbidden, cell E is blocked, and
          entering C before visiting D is forbidden. Starting at (A,east), find the minimum-cost
          valid plan that ends at (F,east), state the heuristic used, and justify both feasibility
          and optimality.
    - kind: capability
      id: c12.control.reactive_behavior
      parent_id: c12.control
      name: Execute and validate reactive robot behaviors
      outcome: Specify or trace an event-driven robot behavior policy whose prioritized transitions,
        timers, counters, and actions react correctly to supplied observations and safety
        events.
      includes:
      - Finite-state, behavior-tree, or rule-table execution with explicit transition priority
      - Recovery, timeout, debouncing, and terminal safety behavior
      - Trace-based checks of state, action, and internal counter evolution
      excludes:
      - Offline search for an action sequence over a supplied state graph
      - Continuous feedback-law synthesis
      - Generic software workflow state machines with no embodied observation-action semantics
      prerequisites: []
      sampling_facets:
      - id: policy_notation
        description: The policy may be a finite-state machine, behavior tree, or prioritized
          rule table when event-driven state transition and emitted robot action are evaluated
          from an explicit trace.
      sample_tasks:
      - kind: entry
        instruction: A robot has states DRIVE, WAIT, and STOP. It starts in DRIVE; bumper
          has highest priority and causes STOP; otherwise a blocked input causes WAIT; WAIT
          returns to DRIVE after two consecutive clear samples; STOP is terminal. Trace states
          and actions for inputs (blocked,bumper) [(false,false),(true,false),(false,false),(false,false),(false,true)],
          showing the clear counter.
      - kind: representative
        instruction: Design and trace a recovery policy for states FOLLOW, WAIT, BACKUP, RELOCALIZE,
          and STOP over observations (path_blocked,bumper,localization_ok). Bumper is highest
          priority; WAIT enters BACKUP on the third consecutive blocked sample; BACKUP lasts
          exactly two samples including entry; RELOCALIZE requires two consecutive good-localization
          samples; STOP is terminal. Use the supplied trace [(false,false,true),(true,false,true),(true,false,true),(true,false,true),(true,true,true),(false,false,true),(false,false,false),(false,false,true),(false,false,true)].
          Report state, emitted action, and relevant counters at every sample, and identify
          unreachable or conflicting rules.
    - kind: capability
      id: c12.control.continuous_path_planning
      parent_id: c12.control
      name: Plan collision-free configuration paths
      outcome: Construct and validate a collision-free path through a continuous robot configuration
        space using supplied geometry, limits, and collision checks.
      includes:
      - Configuration-space obstacle reasoning
      - Sampling-based or geometric path construction and smoothing
      - Clearance and joint-limit validation
      excludes:
      - Finite graph search when the graph is already supplied
      - Assigning time or actuator effort under a dynamic model
      - Choosing contact modes or feedback gains
      prerequisites: []
      sampling_facets:
      - id: robot_morphology
        description: The configuration may describe a mobile base, manipulator, aerial body,
          or articulated mechanism while collision-free connectivity remains the evaluated
          outcome.
      sample_tasks:
      - kind: entry
        instruction: A circular robot of radius 0.25 m must move from (0,0) to (4,0). The
          only obstacle is the axis-aligned rectangle x in [1.5,2.5], y in [-0.5,0.5]. Inflate
          the obstacle, construct a collision-free piecewise-linear path, and report its minimum
          clearance.
      - kind: representative
        instruction: A planar two-link arm has link lengths 1 m, joint limits q1 in [-180,180]
          degrees and q2 in [0,150] degrees, and circular obstacles centered at (0.8,0.6)
          with radius 0.2 m and (-0.4,1.2) with radius 0.25 m. Move from q=(0,30) degrees
          to q=(120,60) degrees. Construct a collision-checked configuration-space path, explain
          the sampling or geometric strategy, smooth it without losing clearance, and report
          joint-limit and minimum-clearance checks.
    - kind: capability
      id: c12.control.path_time_parameterization
      parent_id: c12.control
      name: Time-parameterize geometric paths
      outcome: Assign a smooth, feasible timing law to a supplied geometric path under stated
        velocity and acceleration limits.
      includes:
      - Trapezoidal, triangular, and path-coordinate speed profiles
      - Velocity and acceleration-limit enforcement
      - Duration and switching-time calculation
      excludes:
      - Changing the supplied geometric path to satisfy full robot dynamics
      - Finding collision-free connectivity
      - Closing the loop around the timed path
      prerequisites: []
      sampling_facets:
      - id: path_coordinate
        description: The supplied path may be Cartesian, joint-space, or arc-length parameterized
          while the operation remains timing it under derivative limits.
      sample_tasks:
      - kind: entry
        instruction: A one-dimensional robot must move from position 0 m at rest to 2 m at
          rest with speed at most 1 m/s and acceleration magnitude at most 0.5 m/s^2. Construct
          the minimum-time trapezoidal or triangular velocity profile and report all switching
          times.
      - kind: representative
        instruction: A two-joint arm must follow q(s)=[1.2s, 0.8 sin(pi s)] radians for s
          from 0 to 1, starting and ending at rest. Joint speed limits are [0.9,1.0] rad/s
          and acceleration limits are [1.8,2.0] rad/s^2. Construct a smooth time law s(t),
          report its phases and duration, and verify the joint velocity and acceleration limits
          along the path.
    - kind: capability
      id: c12.control.trajectory_optimization
      parent_id: c12.control
      name: Optimize trajectories under dynamics
      outcome: Synthesize states and controls that satisfy a supplied robot dynamic model,
        boundary conditions, path constraints, and actuator limits.
      includes:
      - Direct shooting, collocation, and constrained trajectory optimization
      - Dynamic, endpoint, obstacle, and actuator residual checks
      - Tradeoffs among duration, effort, smoothness, and clearance
      excludes:
      - Timing a fixed path without changing its geometry
      - Choosing discrete contact modes
      - Designing a feedback law
      prerequisites: []
      sampling_facets:
      - id: dynamic_system
        description: The supplied dynamics may describe mobile, aerial, or articulated robots
          while feasibility is judged through state evolution, constraints, and actuator limits.
      sample_tasks:
      - kind: entry
        instruction: A unit-mass system follows x_ddot=u with piecewise-constant |u|<=1, starts
          at x=0, x_dot=0, and must end at x=1, x_dot=0 after exactly 2 seconds. Formulate
          a direct-shooting problem with four intervals of 0.5 seconds, use the exact constant-acceleration
          update on each interval, find a feasible control sequence, and report the state
          rollout, endpoint residuals, and input-bound residuals.
      - kind: representative
        instruction: A planar vehicle follows x_dot=v cos(theta), y_dot=v sin(theta), theta_dot=omega
          with bounds 0<=v<=2 m/s and |omega|<=1 rad/s, starting at (0,0,0). Optimize a smooth
          five-second trajectory ending at (4,3,pi/2) while remaining outside the disk centered
          at (2,1.5) of radius 0.6 m. State the transcription and objective, report sampled
          states and controls, and verify endpoint, dynamics, input, smoothness, and clearance
          residuals.
    - kind: capability
      id: c12.control.contact_force_planning
      parent_id: c12.control
      name: Allocate feasible contact forces
      outcome: Compute contact forces for a supplied contact set that satisfy equilibrium
        or motion requirements together with unilateral, friction, and actuator constraints.
      includes:
      - Force and moment balance
      - Friction-cone and normal-force constraints
      - Grasp, support, and pushing force allocation for fixed contacts
      excludes:
      - Choosing a sequence of contact modes or locations
      - Designing force feedback
      - Simulating contact transients
      prerequisites: []
      sampling_facets:
      - id: contact_role
        description: Fixed contacts may grasp, support, push, or brace while the operation
          remains constrained force allocation and feasibility checking.
      sample_tasks:
      - kind: entry
        instruction: A 10 N planar block is pinched by two opposing horizontal contacts with
          friction coefficient 0.5. Determine the minimum normal force at each contact needed
          to hold the block against gravity and verify the friction constraints.
      - kind: representative
        instruction: Use a world frame with +z upward. A 20 kg quadruped has center of mass
          at p_com=(0,0,0.50) m. Its four fixed point contacts are FL=(0.30,0.20,0), FR=(0.30,-0.20,0),
          RL=(-0.30,0.20,0), and RR=(-0.30,-0.20,0) m in world coordinates, each with contact
          normal n=(0,0,1), friction coefficient 0.6, and force constraints 0<=fz<=90 N and
          sqrt(fx^2+fy^2)<=0.6*fz. Gravity is (0,0,-9.81) m/s^2. A disturbance force Fd=(40,0,0)
          N is applied at pd=(0,0,0.80) m. Allocate a three-dimensional force fi=(fx,fy,fz)
          at each contact such that sum_i fi + Fd + m*g = 0 and sum_i ((pi-p_com) cross fi)
          + ((pd-p_com) cross Fd) = 0. Report all forces and residuals, then verify unilateral,
          friction, normal-force-bound, force-balance, and three-axis moment-balance constraints.
    - kind: capability
      id: c12.control.contact_mode_planning
      parent_id: c12.control
      name: Plan contact-mode sequences
      outcome: Choose a sequence of contact states and locations that can accomplish an embodied
        objective while maintaining geometric and force feasibility at each transition.
      includes:
      - Grasp, push, regrasp, and foothold sequence selection
      - Mode-transition feasibility and support checks
      - Contact-location choice from supplied candidates
      excludes:
      - Allocating forces for one already fixed contact set as the whole task
      - Collision-free planning with no intended contact
      - Low-level force or impedance feedback
      prerequisites: []
      sampling_facets:
      - id: interaction_regime
        description: The sequence may concern manipulation, pushing, bracing, or locomotion
          when candidate contacts and feasibility rules are supplied and mode transitions
          are the decisive operation.
      sample_tasks:
      - kind: entry
        instruction: A planar block can be pushed only at its left, right, top, or bottom
          face and may translate only along the inward normal of the active face. Starting
          with the pusher at the left face, choose the shortest valid contact-face sequence
          that moves the block first right and then down, and state the required detach-and-recontact
          transition.
      - kind: representative
        instruction: A 16 kg quadruped starts with feet FL=(0.30,0.20), FR=(0.30,-0.20), RL=(-0.30,0.20),
          and RR=(-0.30,-0.20) meters in the ground plane. It must move FL and FR to one of
          the paired front-foot targets at x=0.60 or x=0.90 meters with unchanged y coordinates,
          moving at most one foot per phase. During the first front-foot swing the center-of-mass
          projection is (0.00,0.00); during the second it is (0.15,0.00); after both land
          it is (0.30,0.00). A stance is allowed only if the center-of-mass projection lies
          in the convex hull of stance feet and vertical forces 0<=fz<=80 N per stance foot
          can sum to the weight using g=9.81 m/s^2. Choose the target pair and foot-move order,
          report every stance polygon and a feasible vertical-force allocation, and reject
          any transition that violates support or force limits.
    - kind: capability
      id: c12.control.feedback_control
      parent_id: c12.control
      name: Design and assess feedback control
      outcome: Construct or tune a feedback law for a supplied robot model and assess tracking,
        stability, robustness, saturation, and safety-relevant behavior.
      includes:
      - Error-dynamics analysis and gain selection
      - Tracking and stabilization under disturbances
      - Closed-loop stability, saturation, and robustness checks
      excludes:
      - Producing an open-loop trajectory
      - Estimating the feedback state from sensors
      - Choosing high-level paths or contact sequences
      prerequisites: []
      sampling_facets:
      - id: plant_family
        description: The supplied plant may be mobile, aerial, balancing, or articulated;
          the sampling varies domain knowledge while retaining closed-loop synthesis and assessment.
      - id: control_objective
        description: The objective may be regulation or trajectory tracking when the required
          contract includes error dynamics, constraints, and robustness.
      sample_tasks:
      - kind: entry
        instruction: For the scalar discrete plant x[k+1]=1.2x[k]+u[k], choose a state-feedback
          law u[k]=-Kx[k] that places the closed-loop pole at 0.4. Report K and determine
          whether the input limit |u|<=2 is respected for x[0]=3.
      - kind: representative
        instruction: A balancing robot linearized about upright has x_dot=Ax+Bu with A=[[0,1],[4,0]],
          B=[[0],[2]], measured state x=[angle,angular_rate], torque limit |u|<=8 N m, and
          a constant unknown disturbance bounded by 0.4 N m. Design a feedback controller
          for settling within 2 seconds with less than 10% overshoot, analyze closed-loop
          poles and a disturbance-error bound, determine the initial-angle region that avoids
          saturation, and describe a concrete simulation check for the claims.
    - kind: capability
      id: c12.control.latency_safety
      parent_id: c12.control
      name: Analyze closed-loop timing and safety budgets
      outcome: Compose measured sensing, computation, communication, control, and actuation
        timing into an end-to-end robot response budget and quantify its physical safety or
        tracking consequence.
      includes:
      - Stage durations, idle gaps, rates, jitter allowances, and worst-case end-to-end latency
      - Propagation of delay into stopping distance, tracking error, or deadline margin using
        a supplied physical model
      - Allocation of an allowable deadline or delay reduction across robot-stack stages
      excludes:
      - Generic distributed-system latency analysis with no embodied loop or physical consequence
      - Sensor clock calibration from shared events
      - Feedback-gain design or physical braking-profile optimization as the primary task
      - Simulator fidelity validation against reference traces
      prerequisites: []
      sampling_facets:
      - id: safety_consequence
        description: The consequence may be stopping margin, tracking displacement, or contact-response
          deadline when the task supplies the physical propagation model and evaluates the
          same end-to-end timing budget.
      sample_tasks:
      - kind: entry
        instruction: An obstacle is sensed at 0 ms, a planner emits stop at 55 ms, a controller
          consumes it at 70 ms, and braking starts at 95 ms. At 1.0 m/s with constant braking
          deceleration 2.0 m/s^2, compute total response latency, pre-braking travel, braking
          distance, and residual margin for an obstacle 0.70 m away with a required 0.10 m
          margin.
      - kind: representative
        instruction: 'Construct a sensing-to-braking budget from timestamps: exposure complete
          0 ms, driver publish 18 ms, fusion 22 to 47 ms, planner 52 to 79 ms, controller
          consume 90 ms, and braking onset 112 ms. At exposure the robot travels 1.5 m/s toward
          an obstacle 1.00 m away and then brakes at 2.5 m/s^2; the required residual margin
          is 0.15 m. Report every stage duration and idle gap, total latency, pre-braking
          and braking distances, pass or fail, the latest allowable braking-onset timestamp,
          and whether any single listed idle gap can recover the required time.'
    - kind: group
      id: c12.simulation
      parent_id: null
      name: Robot simulation and benchmarking
      scope: Construct reproducible robot simulations, diagnose numerical behavior, test fidelity
        against references, and compare embodied systems with controlled benchmark protocols.
      includes:
      - Simulation scenario construction and numerical-stability diagnosis
      - Model validation against reference observations
      - Benchmark protocol design, paired-result comparison, and unpaired or stratified comparison
      excludes:
      - Deploying or maintaining physical robot fleets
      - Perception, planning, or control as the primary requested result
    - kind: capability
      id: c12.simulation.scenario_construction
      parent_id: c12.simulation
      name: Construct reproducible robot simulations
      outcome: Encode a supplied robot, environment, sensor, and experiment specification
        as a deterministic or seeded simulation scenario with inspectable state and repeatable
        outputs.
      includes:
      - Robot and environment model composition
      - Sensor, actuator, contact, and disturbance configuration
      - Initialization, stepping, logging, and reproducibility checks
      excludes:
      - Demonstrating that the simulator matches physical data
      - Designing a comparative benchmark across systems
      - Solving the simulated control or planning task as the primary result
      prerequisites: []
      sampling_facets:
      - id: simulation_component
        description: Scenarios may emphasize rigid bodies, contact, sensors, actuators, or
          disturbances while retaining model composition, stepping, instrumentation, and reproducibility.
      - id: simulator_interface
        description: The backend API or description format may vary when all required interfaces
          and semantics are supplied and the observable outcome remains a repeatable scenario.
      sample_tasks:
      - kind: entry
        instruction: Specify a fixed-step simulation for a unit-mass block with x_ddot=u,
          initial state x=0, x_dot=0, constant u=1 N, step size 0.1 s, and duration 1 s. Define
          the update order and logged fields, then give a reproducibility check for two runs.
      - kind: representative
        instruction: 'Using the supplied simulator API, write a complete seeded scenario:
          World(dt,seed), world.add_box(name,size_xyz,pose_xyz), world.add_diff_drive(name,wheel_radius,axle_length,pose_xytheta),
          robot.set_velocity(v,w), robot.add_lidar(rate_hz,range_std,ray_count,max_range),
          world.step(), and world.state() returning poses, contacts, and sensor packets. Create
          a 10 m by 8 m room from four 0.1 m-thick wall boxes plus obstacle boxes of sizes
          (1.0,0.6,1.0) at (2.0,1.0,0.5) and (0.8,1.2,1.0) at (-1.5,-1.0,0.5). Add a differential-drive
          robot at (-3,-2,0) with wheel radius 0.08 m, axle length 0.42 m, 20 Hz velocity
          commands, and a 10 Hz 36-ray lidar with 0.02 m Gaussian range noise and 8 m maximum
          range. Step at 0.01 s for 20 s under the supplied command schedule [(0,5,0.5,0),(5,8,0,0.5),(8,20,0.4,0)].
          Log time, pose, command, contacts, and lidar packets. Specify reset semantics and
          checks that equal seeds reproduce all logged values and unequal seeds change only
          lidar noise.'
    - kind: capability
      id: c12.simulation.numerical_stability
      parent_id: c12.simulation
      name: Diagnose robot-simulation numerical stability
      outcome: Diagnose discretization or solver instability in robot simulation traces, relate
        it to supplied model time scales and solver settings, and choose a supported numerical
        configuration with regression checks.
      includes:
      - Detecting penetration, constraint drift, nonphysical energy growth, divergence, and
        timestep sensitivity
      - Relating timestep, stiffness, damping, and solver iterations to characteristic model
        time scales
      - Comparing supplied numerical settings and defining quantitative stability regressions
      excludes:
      - Validating physical fidelity against real reference observations
      - Constructing the full simulation scenario
      - Generic numerical-method analysis with no robot, contact, sensor, or embodied-system
        simulation
      prerequisites: []
      sampling_facets:
      - id: simulated_subsystem
        description: The trace may concern rigid contact, articulated constraints, actuators,
          or sensor integration when the task evaluates numerical artifacts, model time scales,
          configuration choice, and regression bounds.
      sample_tasks:
      - kind: entry
        instruction: A unit-mass contact with stiffness 10,000 N/m is integrated with timesteps
          10 ms and 1 ms. The 10 ms trace reaches penetration 0.030 m and rebounds at 4.5
          m/s from an impact speed of 3.0 m/s; the 1 ms trace reaches 0.004 m and rebounds
          at 2.2 m/s. Compute the undamped contact period 2*pi*sqrt(m/k), compare each timestep
          with it, identify numerical energy injection, choose the supported timestep, and
          state penetration and rebound-speed regression limits.
      - kind: representative
        instruction: A 1 kg falling cube with contact stiffness 20,000 N/m and damping 50
          N s/m is simulated using semi-implicit Euler. For 10 ms, states (t,z,v) are [(0.40,0.060,-3.9),(0.41,0.020,-4.0),(0.42,-0.020,5.0),(0.43,0.030,5.0),(0.44,0.080,4.9)];
          for 1 ms, sampled states are [(0.400,0.060,-3.90),(0.410,0.021,-3.99),(0.415,0.003,-3.20),(0.420,0.000,0.45),(0.430,0.003,0.12),(0.440,0.003,0.00)].
          Compute maximum penetration and absolute velocity for both, identify energy injection,
          compare the 10 ms step with T=2*pi*sqrt(m/k), choose among 1 ms, 10 ms, and 10 ms
          with doubled damping using only these observations, and define two quantitative
          regression assertions.
    - kind: capability
      id: c12.simulation.model_validation
      parent_id: c12.simulation
      name: Validate simulation fidelity
      outcome: Compare simulated and reference robot behavior, localize consequential model
        mismatch, and estimate or recommend model changes with uncertainty-aware evidence.
      includes:
      - Trace alignment and residual analysis
      - Parameter identification and component-level mismatch diagnosis
      - Validation across held-out operating conditions
      excludes:
      - Building the simulator from a specification
      - Ranking competing robot systems without diagnosing model fidelity
      - Claiming physical validity from simulation-only consistency
      prerequisites: []
      sampling_facets:
      - id: validated_component
        description: Validation may target dynamics, contacts, sensors, actuators, or latency
          while retaining reference comparison, mismatch localization, and held-out confirmation.
      sample_tasks:
      - kind: entry
        instruction: A simulated first-order actuator follows y_dot=(u-y)/tau. For a unit-step
          input, measured outputs at t=[0.5,1.0,1.5] s are [0.62,0.86,0.95]. Estimate tau,
          report prediction residuals, and compare it with the simulator's current tau=1.0
          s.
      - kind: representative
        instruction: For commanded wheel speeds [2,4,6,8] rad/s, a differential-drive simulator
          predicts forward speeds [0.16,0.32,0.48,0.64] m/s while matched physical trials
          give means [0.15,0.29,0.40,0.48] with standard deviations [0.01,0.01,0.02,0.03].
          Yaw-rate residuals remain below 0.01 rad/s at every speed. Diagnose the most plausible
          component mismatch among wheel radius, speed-dependent slip, and axle length; fit
          a minimal correction with uncertainty; test whether it generalizes to a held-out
          5 rad/s physical speed of 0.35 m/s; and state what the data cannot identify.
    - kind: capability
      id: c12.simulation.benchmark_design
      parent_id: c12.simulation
      name: Design robot benchmark protocols
      outcome: Specify a controlled, reproducible robot benchmark protocol whose scenario
        sampling, metrics, failures, replication, baselines, and fairness rules support the
        intended comparison.
      includes:
      - Scenario distributions, strata, trial allocation, seeds, and pairing
      - Success, efficiency, safety, stage, timeout, and resource metrics
      - Baselines, ablations, retry rules, failure taxonomies, and reporting plans
      excludes:
      - Computing statistics from completed benchmark results
      - Constructing the simulator used by the protocol
      - Validating simulator fidelity against physical references
      - Optimizing one tested robot policy as the primary task
      prerequisites: []
      sampling_facets:
      - id: robot_task_family
        description: Protocols may cover navigation, manipulation, locomotion, or integrated
          embodied tasks while scenario control, metrics, replication, fairness, and failure
          definitions remain fixed.
      - id: execution_regime
        description: Trials may be simulated, physical, or paired sim-and-real when exposure,
          randomization, reset, measurement, and retry conditions are explicitly controlled.
      sample_tasks:
      - kind: entry
        instruction: Design a paired benchmark for two navigation policies on 12 supplied
          maps divided evenly among open, cluttered, and narrow-passage strata. Specify map-policy
          trial pairing, seeds, reset and timeout rules, success and path-efficiency metrics,
          collision handling, retry policy, and a result table schema; do not invent outcomes
          or analyze results.
      - kind: representative
        instruction: Design a reproducible benchmark comparing three mobile-manipulation systems
          that must navigate to, grasp, and place objects. Specify a stratified scenario distribution
          over room layout, object geometry, lighting, and payload; stage-level and end-to-end
          metrics; timeout and safety-failure rules; trial counts, pairing, and seeds; baselines
          and ablations; and a failure taxonomy and reporting plan that prevent easier scenarios
          or repeated retries from creating an unfair comparison. Do not invent or statistically
          analyze trial outcomes.
    - kind: capability
      id: c12.simulation.paired_benchmark_comparison
      parent_id: c12.simulation
      name: Compare paired robot benchmark results
      outcome: Compare completed robot benchmark results observed on the same scenarios, seeds,
        or units using within-pair estimands, paired uncertainty, failure summaries, and explicit
        decision gates.
      includes:
      - Matched success outcomes, discordant-pair counts, paired sign or McNemar-style tests
      - Within-pair continuous metric differences, paired intervals, and promotion gates
      - Failure and sensitivity summaries that preserve scenario or unit pairing
      excludes:
      - Independent-sample comparisons across separate scenario sets
      - Target-population standardization across unpaired strata
      - Designing the benchmark protocol or inventing missing outcomes
      - Validating simulator fidelity rather than compared-system performance
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Two policies run on the same eight maps with success pairs (A,B) [(1,1),(1,0),(0,1),(1,1),(0,1),(1,1),(0,0),(1,1)].
          Compute each success rate, the discordant counts, the paired success-rate difference
          B-A, and the exact two-sided sign-test p-value; state whether the paired results
          support a difference at alpha=0.05.
      - kind: representative
        instruction: Two navigation policies A and B run on the same ten maps. Success pairs
          (A,B) are [(1,1),(1,1),(1,0),(0,1),(1,1),(0,1),(1,1),(1,1),(0,0),(1,1)]. For maps
          on which both succeed, path-efficiency pairs are [(0.80,0.84),(0.75,0.78),(0.88,0.86),(0.70,0.76),(0.82,0.85),(0.77,0.80)].
          Report each success rate, discordant success counts and exact two-sided sign-test
          p-value, and the mean paired efficiency difference B-A with a 95% paired-t interval
          using t_0.975,5=2.571. Apply gates that B's success rate is not lower than A's,
          mean paired efficiency difference is positive, and its interval excludes zero; report
          each gate and limits of the evidence.
    - kind: capability
      id: c12.simulation.stratified_benchmark_comparison
      parent_id: c12.simulation
      name: Compare unpaired and stratified robot benchmarks
      outcome: Compare completed robot benchmark results from independent samples by estimating
        per-stratum performance, standardizing to supplied target weights, propagating independent-sample
        uncertainty, and applying explicit decision gates.
      includes:
      - Independent-sample rates, means, differences, and uncertainty
      - Target-population standardization over controlled scenario strata
      - Stratum contribution, composition sensitivity, fairness, safety, and promotion-gate
        analysis
      excludes:
      - Within-pair differences or paired tests on shared scenarios
      - Designing a new benchmark protocol without completed outcomes
      - Pooling strata without the supplied target weighting or an explicit estimand
      - Inventing missing outcomes or diagnosing simulator fidelity
      prerequisites: []
      sampling_facets:
      - id: unpaired_estimand
        description: The independent-sample outcome may be a binary rate or continuous mean
          when the task supplies per-stratum summaries and retains target-weighted standardization
          plus independent-sample uncertainty.
      sample_tasks:
      - kind: entry
        instruction: 'Policies A and B were evaluated on independent maps in easy and hard
          strata. Results are A: easy 18 successes/20 trials, hard 10/20; B: easy 16/20, hard
          14/20. The target deployment mix is 40% easy and 60% hard. Compute each per-stratum
          success rate, each target-standardized success rate, difference B-A, and a 95% normal
          interval using independent binomial variances sum_h w_h^2*p_h*(1-p_h)/n_h for each
          policy. State whether the interval excludes zero.'
      - kind: representative
        instruction: 'Systems A and B were evaluated on independent trials in three strata.
          Easy: A 45 successes and 2 collisions in 50 trials, B 36 successes and 1 collision
          in 40. Cluttered: A 28 successes and 5 collisions in 40, B 30 successes and 3 collisions
          in 45. Dynamic: A 12 successes and 6 collisions in 30, B 18 successes and 4 collisions
          in 35. Target deployment weights are [0.30,0.40,0.30]. For success and collision
          separately, compute per-stratum rates, target-standardized rates, B-A differences,
          and 95% normal intervals using independent binomial variances and the supplied weights.
          Compare the target-standardized success difference with the unweighted pooled difference,
          identify which stratum contributes most to each standardized difference, and apply
          gates that B''s standardized success is at least 0.03 higher and its standardized
          collision rate is not higher.'
- routing_facet: subject_domain
  curriculum:
    version: wave7-2
    subject_id: C28
    subject_name: Legal & Compliance
    sections:
    - id: c28.contracts
      parent_id: null
      name: Contract analysis and drafting
      includes:
      - Reviewing supplied contract language against deal facts, objectives, and legal or
        playbook constraints
      - Drafting coherent contract language from supplied requirements and model terms
      excludes:
      - Independent legal-authority research
      - Factual due diligence outside the supplied deal record
      - Transaction-wide diligence that combines contract, ownership, licensing, compliance,
        and patent investigation into one assignment
      kind: group
      scope: Contract work in which the decisive operation is either diagnosing supplied language
        or producing new language from supplied deal requirements.
    - id: c28.contracts.review
      parent_id: c28.contracts
      name: Contract review and redlining
      includes:
      - Locating material departures, ambiguities, omissions, and cross-clause inconsistencies
        in supplied contract text
      - Prioritizing consequences and proposing targeted redlines or negotiation positions
        traceable to supplied language and constraints
      excludes:
      - Drafting a new agreement or clause set from a blank page
      - Researching governing law or resolving facts not included in the task record
      - Business diligence that does not turn on contract language
      kind: capability
      outcome: Given contract text, deal context, objectives, and a review playbook or relevant
        legal excerpts, identify and prioritize material drafting risks and propose precise,
        internally consistent revisions with reasons tied to the supplied record.
      prerequisites: []
      sampling_facets:
      - id: jurisdiction
        description: Hold the governing jurisdiction fixed within a task and supply any specialist
          rules needed; vary it across tasks only when issue spotting, traceability, and redline
          quality remain the evaluated operation.
      - id: contract_family
        description: Vary the agreement family while keeping the operation as review against
          explicit deal objectives, playbook rules, and supplied legal constraints.
      sample_tasks:
      - kind: entry
        instruction: 'Review this indemnity clause for a buyer: ''Supplier will indemnify
          Buyer only for finally adjudicated third-party bodily-injury claims caused solely
          by Supplier''s gross negligence.'' The supplied playbook requires coverage for third-party
          IP infringement and data-security claims, permits a negligence standard, and does
          not require final adjudication. Identify the material departures, explain their
          practical effect, and provide one targeted replacement clause.'
      - kind: representative
        instruction: Review the supplied excerpts from a SaaS agreement covering license scope,
          data use, security, indemnity, liability caps, termination, and post-termination
          data return. Use the supplied deal facts, review playbook, and governing-law excerpts
          to produce a prioritized issues list and coordinated redlines. Explain cross-clause
          effects, preserve defined-term consistency, and distinguish legal exposure from
          commercial choices.
    - id: c28.contracts.drafting
      parent_id: c28.contracts
      name: Contract clause and agreement drafting
      includes:
      - Translating supplied deal terms and risk allocations into operative contract language
      - Maintaining definitions, conditions, exceptions, remedies, and cross-references across
        a clause set
      excludes:
      - Diagnosing an existing counterparty draft as the primary operation
      - Inventing missing commercial terms or conducting independent legal research
      - Producing nonbinding business summaries without operative language
      kind: capability
      outcome: Given structured deal facts, required risk allocations, model language, and
        any governing constraints, draft precise operative provisions whose definitions, conditions,
        exceptions, remedies, and cross-references work together.
      prerequisites: []
      sampling_facets:
      - id: jurisdiction
        description: Hold governing law fixed within a task and supply jurisdiction-specific
          constraints; vary it only when the evaluated operation remains faithful translation
          of requirements into coherent language.
      - id: contract_family
        description: Sample different agreement families with explicit deal inputs while preserving
          the drafting and internal-consistency evaluation contract.
      sample_tasks:
      - kind: entry
        instruction: 'Draft a payment clause from these supplied terms: invoices are monthly
          in arrears, payment is due 30 days after receipt, disputed amounts may be withheld
          only after written notice within 10 days, undisputed amounts remain due, and late
          interest is capped at the lower of 1% per month or the lawful maximum. Define any
          term needed within the clause and do not add commercial terms.'
      - kind: representative
        instruction: Using the supplied cloud-services deal sheet, approved model provisions,
          and governing-law constraints, draft a coordinated clause set for service levels
          and credits, customer-data use, security incidents, termination rights, liability
          caps and carve-outs, and data return. Keep defined terms and cross-references consistent,
          state conditions and exceptions explicitly, and flag any deal-sheet conflict that
          prevents unambiguous drafting.
    - id: c28.research
      parent_id: null
      name: End-to-end legal authority research and analysis
      includes:
      - Integrating issue framing, authority retrieval, status validation, rule synthesis,
        and fact application for one legal question
      - Producing a research trail and merits analysis whose conclusions are supported by
        the authorities actually found
      excludes:
      - Closed-record analysis when all authorities are supplied and no search is required
      - Authority retrieval and ranking without a fact-specific legal conclusion
      - Patent prior-art, patent legal evaluation, contract redlining, and operational compliance
        execution
      kind: capability
      outcome: Given a legal question, fact record, jurisdiction, date, and access to a specified
        legal corpus, frame and execute a reproducible authority search, validate and rank
        the results, synthesize the operative rule, and apply it to the facts in one citation-traceable
        analysis with counterarguments and uncertainty.
      prerequisites: []
      sampling_facets:
      - id: jurisdiction
        description: Vary jurisdiction only when source hierarchy, currency signals, and search
          access are supplied; the integrated search-to-analysis loop remains the evaluated
          operation.
      - id: legal_source_family
        description: Vary cases, statutes, regulations, and agency materials when status metadata
          permits the same validation, synthesis, and traceability contract.
      sample_tasks:
      - kind: entry
        instruction: A tenant asks whether a notice sent by text message was timely under
          a fictional state rule. Search the supplied eight-document corpus using the stated
          date and hierarchy metadata, identify and validate the governing provision and one
          interpreting decision, then write a short analysis applying them to the supplied
          notice facts. Include the queries, authority ranking, pinpoint support, strongest
          counterargument, and one unresolved fact.
      - kind: representative
        instruction: Research whether the supplied platform conduct creates liability under
          the specified jurisdiction as of the stated date. Use the provided legal search
          service to frame the issues, search statutes, cases, regulations, and agency materials,
          validate currency and treatment, and rank conflicting authorities. Then produce
          one citation-traceable merits memorandum that synthesizes the governing test, applies
          it to competing factual characterizations, addresses the strongest counterargument,
          states a calibrated conclusion, and appends the reproducible search trail and material
          gaps.
    - id: c28.research.authority_search
      parent_id: c28.research
      name: Legal authority search and ranking
      includes:
      - Turning a fact pattern into research issues, terms, and source filters
      - Locating, validating, and ranking potentially controlling or persuasive authorities
        using supplied search access and status metadata
      excludes:
      - Writing the ultimate fact-specific legal analysis as the primary deliverable
      - Patent classification, citation-chain, or claim-element prior-art search
      - Treating source popularity as authority
      kind: capability
      outcome: Given a legal question, facts, jurisdiction, date, and access to a specified
        legal corpus or search service, construct and execute a focused search, then return
        a validated and authority-ranked research record that explains relevance and unresolved
        gaps.
      prerequisites: []
      sampling_facets:
      - id: jurisdiction
        description: Vary the jurisdiction while holding fixed the search, validation, and
          authority-ranking operation; task annotations identify the jurisdiction and available
          source hierarchy.
      - id: legal_source_family
        description: Sample cases, statutes, regulations, and agency materials only where
          the corpus exposes comparable search and status metadata and the evaluation remains
          relevance, validity, and authority ranking.
      sample_tasks:
      - kind: entry
        instruction: A state statute in the supplied five-document corpus bars employers from
          deducting cash shortages unless an exception applies. An employee signed a general
          handbook acknowledgment, and the employer deducted a register shortage. Using the
          supplied jurisdiction, decision date, document metadata, and corpus search, identify
          the most relevant provision and one potentially controlling interpretation. Record
          the search terms, authority status, and why each source matters without deciding
          the employee's claim.
      - kind: representative
        instruction: Research whether the supplied platform facts can trigger liability under
          the specified jurisdiction's statute as of the stated date. Use the provided legal
          search service to decompose the issue, search across statutes, cases, regulations,
          and agency materials, validate currency and treatment, rank controlling and persuasive
          sources, and produce a research trail that identifies conflicting authority and
          material gaps. Do not write the final merits memorandum.
    - id: c28.research.analysis
      parent_id: c28.research
      name: Authority synthesis and legal analysis
      includes:
      - Extracting and reconciling rules, exceptions, tests, and authority weight from supplied
        legal materials
      - Applying the synthesized rule to supplied facts and communicating supported conclusions
        and uncertainty
      excludes:
      - Searching for or validating missing authorities as the central operation
      - Contract redlining, compliance-control design, or patent claim mapping
      - Conclusions based on uncited specialist recall when the task supplies a closed authority
        record
      kind: capability
      outcome: Given a question, fact record, and a closed set of authorities with jurisdiction
        and status metadata, synthesize the operative legal rule, reconcile tensions, apply
        it to the facts, and present a traceable conclusion with counterarguments and uncertainty.
      prerequisites: []
      sampling_facets:
      - id: jurisdiction
        description: Vary jurisdiction as a supplied knowledge regime while preserving rule
          synthesis, fact application, and source-traceability as the central operation and
          evaluation contract.
      - id: legal_source_family
        description: Vary the mix of cases, statutes, regulations, and guidance only when
          all operative text and authority metadata are supplied and the same synthesis contract
          applies.
      sample_tasks:
      - kind: entry
        instruction: Using the supplied statutory subsection, one controlling decision, and
          the stated delivery facts, write a short analysis of whether notice was timely.
          State the rule and exception, apply each disputed fact, cite the supplied materials,
          and identify the single fact that most affects the conclusion.
      - kind: representative
        instruction: Using only the supplied fact record and authority packet containing a
          statute, implementing regulation, two partially conflicting appellate decisions,
          and agency guidance with status metadata, write a legal memorandum. Reconcile the
          authorities by hierarchy and reasoning, state the governing test and exceptions,
          apply them to competing factual characterizations, address the strongest counterargument,
          and express the conclusion and remaining uncertainty with pinpoint citations.
    - id: c28.compliance
      parent_id: null
      name: Regulatory compliance operations
      includes:
      - Translating requirements into operational controls and evidence
      - Assessing compliance evidence and remediation
      - Detecting regulatory changes and tracing their operational impact
      - Executing bounded privacy-rights requests through record-level dispositions, required
        communications, and auditable completion evidence
      excludes:
      - General legal research without an operational compliance decision
      - Pure policy writing unsupported by supplied requirements or process facts
      - Multidisciplinary transaction diligence that bundles licensing, ownership, contract
        drafting, compliance assessment, and patent search
      kind: group
      scope: 'Operational compliance work, split by the evaluated state transition: requirement
        to control, evidence to supported status, source change to impact, or a supplied privacy
        request and rule set to record-level actions, response, and audit trail.'
    - id: c28.compliance.obligation_mapping
      parent_id: c28.compliance
      name: Regulatory obligation and control mapping
      includes:
      - Extracting actors, triggers, duties, exceptions, deadlines, and evidence expectations
        from supplied requirements
      - Mapping obligations to process steps, control owners, evidence, and uncovered gaps
        with source traceability
      excludes:
      - Testing whether controls operated effectively over a period
      - Monitoring external sources for amendments
      - Inventing legal requirements absent from the supplied source packet
      kind: capability
      outcome: Given regulatory or policy text and a described business process, convert applicable
        requirements into a traceable obligation-and-control map that identifies actors, triggers,
        duties, exceptions, timing, ownership, evidence, and coverage gaps.
      prerequisites: []
      sampling_facets:
      - id: jurisdiction
        description: Vary jurisdiction only with the operative requirements supplied; requirement
          extraction and process mapping remain the evaluated operation.
      - id: legal_source_family
        description: Sample statutes, regulations, orders, and binding policies when their
          force and relationships are supplied and the mapping artifact has the same traceability
          contract.
      - id: regulatory_domain
        description: Vary the regulated domain while supplying domain-specific rules and process
          facts so the central operation remains obligation-to-control mapping.
      sample_tasks:
      - kind: entry
        instruction: The supplied rule requires a covered operator to notify affected users
          within 72 hours after confirming a qualifying incident, unless law enforcement provides
          a written delay request. Map this rule to the supplied incident-response process.
          Identify the trigger, actor, action, deadline, exception, owner, evidence, and any
          unmapped process gap, with each item traced to the rule text.
      - kind: representative
        instruction: Using the supplied regulatory excerpts, applicability facts, and end-to-end
          business-process description, build an obligation-and-control map. Reconcile overlapping
          duties and exceptions, identify triggers and deadlines, map each duty to owners,
          preventive or detective controls, and retained evidence, and flag uncovered or ambiguously
          covered requirements with source citations and stated assumptions.
    - id: c28.compliance.evidence_assessment
      parent_id: c28.compliance
      name: Compliance evidence assessment and remediation
      includes:
      - Testing supplied evidence against stated obligations and control criteria
      - Separating noncompliance, control-design gaps, operating failures, and insufficient
        evidence
      - Prioritizing remediation and escalation based on supplied impact and recurrence facts
      excludes:
      - Creating the initial requirement-to-control map
      - Detecting external legal changes
      - Certifying compliance beyond the supplied sample and criteria
      kind: capability
      outcome: Given explicit obligations and control criteria plus process evidence, determine
        supported compliance status, distinguish failure types from evidence gaps, and recommend
        proportionate remediation and escalation without overstating the record.
      prerequisites: []
      sampling_facets:
      - id: jurisdiction
        description: Treat jurisdiction as fixed supplied context when it affects the stated
          criteria; evidence testing and bounded conclusions remain unchanged.
      - id: regulatory_domain
        description: Sample different compliance domains with explicit criteria and comparable
          evidence packages while preserving the evidence-to-assessment operation.
      - id: evidence_system
        description: Vary documentary records, tickets, logs, samples, and attestations when
          provenance and scope are supplied and the evaluation still rewards supported status
          and calibrated uncertainty.
      sample_tasks:
      - kind: entry
        instruction: A supplied control requires quarterly access reviews signed by the system
          owner within 15 days after quarter-end. The record contains an unsigned review completed
          18 days late and no exception approval. Assess the control for this quarter, distinguish
          failure from missing evidence, state the bounded conclusion, and recommend one immediate
          remediation.
      - kind: representative
        instruction: Assess the supplied quarter's compliance evidence against the provided
          obligation-and-control matrix. Analyze the logs, tickets, approval records, samples,
          and exception register; distinguish design gaps, operating failures, isolated exceptions,
          and insufficient evidence; trace each finding to its criterion; prioritize remediation
          and escalation using the supplied impact and recurrence facts; and state the limits
          of the assessment.
    - id: c28.compliance.change_impact
      parent_id: c28.compliance
      name: Regulatory change monitoring and impact triage
      includes:
      - Detecting operative changes in supplied official-source feeds, notices, or versioned
        texts
      - Classifying source status and effective dates
      - Tracing changed duties to affected policies, processes, controls, owners, and implementation
        actions
      excludes:
      - Periodic testing of whether an existing control operated
      - Full implementation design after impact triage
      - Treating nonbinding commentary as an operative change without source-status analysis
      kind: capability
      outcome: Given official-source updates or versioned legal materials and an inventory
        of current obligations and controls, identify operative changes, classify their force
        and timing, and produce a traceable, prioritized impact and action triage.
      prerequisites: []
      sampling_facets:
      - id: jurisdiction
        description: Vary jurisdiction when official-source status metadata and current-state
          artifacts are supplied and the evaluated loop remains change detection, force classification,
          and impact tracing.
      - id: legal_source_family
        description: Sample enacted text, regulations, orders, and guidance only where their
          status is explicit and the same source-change-to-operational-impact contract applies.
      - id: regulatory_domain
        description: Vary regulated domain with a supplied control inventory so domain knowledge
          changes but the delta-and-impact operation does not.
      sample_tasks:
      - kind: entry
        instruction: Compare the supplied old and amended notice provisions. Identify the
          operative textual changes, effective date, and source status, then use the supplied
          control register to name the affected control, owner, and required follow-up. Distinguish
          a changed duty from wording that has no operational effect.
      - kind: representative
        instruction: Review the supplied official-source update feed containing an enacted
          amendment, a proposed rule, an enforcement order, and revised agency guidance, each
          with status and dates. Compare each item with the prior text and the supplied obligation,
          policy, process, and control inventory; identify operative deltas; classify force
          and timing; trace direct and dependent impacts; and produce a prioritized action
          triage with uncertainties and source links.
    - id: c28.compliance.privacy_request_execution
      parent_id: c28.compliance
      name: Privacy request disposition and execution
      includes:
      - Applying supplied access, deletion, correction, restriction, objection, and response-timing
        rules to an identified request and record inventory
      - Resolving supplied retention duties and legal holds at record level while limiting
        retained data to permitted use
      - Producing disposition instructions, requester communications, exception rationales,
        completion evidence, and verification steps
      excludes:
      - Creating a general privacy obligation-and-control map for a business process
      - Periodic testing of privacy controls or monitoring law changes
      - Issuing or interpreting litigation holds, deciding unprovided legal rules, or redesigning
        enterprise records governance
      - Incident response, regulatory filings, or other regulated casework that is not a privacy-rights
        request
      kind: capability
      outcome: Given a privacy-rights request, authenticated requester and scope, supplied
        governing rules, retention duties and holds, and a record inventory, determine record-level
        actions, resolve stated exceptions and precedence, produce the required response,
        and specify auditable execution and verification steps.
      prerequisites: []
      sampling_facets:
      - id: jurisdiction
        description: Vary jurisdiction only with operative request, exception, timing, and
          response rules supplied; record-level disposition and execution remain central.
      - id: privacy_request_type
        description: Sample access, deletion, correction, restriction, or objection requests
          when each requires the same scoped-record disposition, response, evidence, and completion-verification
          loop.
      - id: record_system
        description: Vary structured databases, document repositories, support systems, and
          archives when identity, provenance, duplication, and available actions are supplied.
      sample_tasks:
      - kind: entry
        instruction: A verified user requests deletion. Under the supplied rule, marketing
          preferences must be deleted within 30 days, invoices must be retained for seven
          years but restricted from marketing use, and the response must identify retained
          categories and bases. Apply the rules to the supplied four-record inventory, calculate
          the deadline, state each delete-or-retain-and-restrict action, draft the short response,
          and specify completion evidence.
      - kind: representative
        instruction: Execute the supplied verified privacy request across the provided customer,
          support, billing, and safety-system inventory using only the supplied deletion,
          access, retention, and legal-hold rules. Resolve overlapping schedule categories
          and hold scope record by record; handle duplicates without destroying protected
          copies; specify deletion, production, restriction, and verification actions by owner
          and deadline; draft the requester response with exception bases; and define an audit
          log and completion check. Flag unresolved identity, scope, or system facts without
          inventing law.
    - id: c28.patent
      parent_id: null
      name: Patent research and evaluation
      includes:
      - Claim-led prior-art investigation from retrieval through evidence mapping
      - Distinct claim-based novelty, obviousness, and freedom-to-operate screening operations
        under supplied legal standards
      - Taxonomy-led patent landscape coding and bounded trend or white-space observations
      excludes:
      - Multidisciplinary transaction diligence combining ownership, open-source licensing,
        contract protections, compliance, and patent work
      - Patent prosecution drafting, litigation strategy, valuation, and final legal opinions
        beyond supplied rules and records
      kind: group
      scope: 'Patent work divided by central operation and evaluation contract: retrieve and
        map prior art, evaluate single-reference novelty, evaluate multi-reference obviousness,
        screen product claim scope and freedom to operate, or code a bounded landscape corpus.'
    - id: c28.prior_art
      parent_id: c28.patent
      name: End-to-end patent prior-art investigation
      includes:
      - Integrating claim decomposition, iterative retrieval, candidate screening, date checks,
        and limitation-level comparison in one investigation
      - Selecting strongest candidates based on search results and testing whether their apparent
        relevance survives claim-level mapping
      excludes:
      - A final novelty, obviousness, patentability, infringement, or freedom-to-operate conclusion
      - Taxonomy-led landscape coding, category counts, or white-space analysis
      - General legal-authority research unrelated to patent and technical literature
      kind: capability
      outcome: Given claims or an invention disclosure, critical-date and source-eligibility
        criteria, and access to specified patent and nonpatent corpora, conduct a reproducible
        search and produce a claim-level evidence screen of the strongest date-checked references,
        with query history, exclusions, pinpoint support, and coverage gaps.
      prerequisites: []
      sampling_facets:
      - id: patent_system
        description: Vary patent system only when date, source-eligibility, and comparison
          criteria are supplied; the search-to-evidence-screen loop remains central.
      - id: technology_domain
        description: Vary technical domain as a terminology and classification knowledge regime
          while preserving retrieval, candidate screening, and claim mapping.
      - id: prior_art_source_family
        description: Sample patent publications and nonpatent technical literature when access,
          dates, provenance, and pinpointable content support the same investigation contract.
      sample_tasks:
      - kind: entry
        instruction: For the supplied two-limitation fastening claim and critical-date rule,
          search the provided twelve-record patent corpus using keywords and classifications,
          log the queries and date screening, select the two strongest candidates, and map
          each limitation to pinpoint passages or figures. Explain which initial hits fell
          away during mapping and identify one search gap without giving a validity conclusion.
      - kind: representative
        instruction: Using the supplied independent and dependent claims, specification terminology,
          critical-date and source-eligibility rules, and patent plus technical-literature
          search interfaces, conduct one reproducible prior-art investigation. Build and iterate
          concept, synonym, classification, assignee, and citation searches; screen and date-check
          candidates; select the strongest references; map every claim limitation to pinpoint
          evidence while preserving dependencies; and report query history, exclusions, uncertainties,
          and material coverage gaps without issuing a patentability or validity opinion.
    - id: c28.prior_art.search
      parent_id: c28.prior_art
      name: Patent prior-art search
      includes:
      - Decomposing claims or disclosures into searchable concepts, synonyms, classifications,
        dates, and relationship cues
      - Iterating keyword, classification, assignee, inventor, and citation-chain searches
        in a supplied corpus
      - Screening and documenting candidate references and search coverage
      excludes:
      - Producing an element-by-element legal conclusion from a closed reference set
      - Infringement or freedom-to-operate searches
      - Assuming a candidate qualifies as prior art without supplied date and status criteria
      - Taxonomy-led landscape coding and category aggregation
      kind: capability
      outcome: Given a claim or invention disclosure, critical-date and source-eligibility
        criteria, and access to specified patent and nonpatent corpora, construct and iterate
        a reproducible search that returns date-checked candidate references, relevance rationales,
        and documented coverage gaps.
      prerequisites: []
      sampling_facets:
      - id: patent_system
        description: Vary patent system only when critical-date and eligibility rules are
          supplied and the evaluated operation remains claim-led candidate discovery and search
          documentation.
      - id: technology_domain
        description: Vary technical domain as the search vocabulary and classification knowledge
          regime while preserving the decomposition-and-retrieval loop.
      - id: prior_art_source_family
        description: Sample patent publications and searchable nonpatent technical literature
          when access and metadata are normalized and candidate relevance and date eligibility
          share the same evaluation contract.
      sample_tasks:
      - kind: entry
        instruction: For the supplied claim to a bottle cap with a tamper ring joined by frangible
          bridges and the supplied critical-date rule, decompose the claim into searchable
          concepts and synonyms. Use the provided patent index to run an initial keyword and
          classification search, then report date-eligible candidate records, why each is
          relevant, the queries used, and one coverage gap.
      - kind: representative
        instruction: Using the supplied multi-element claim, specification terminology, critical-date
          and source-eligibility rules, and patent plus technical-literature search interfaces,
          conduct a reproducible prior-art search. Build concept and synonym groups, choose
          classifications, iterate keyword and citation-chain searches, screen and date-check
          candidates, document query history and exclusions, and report the strongest candidates
          and material coverage gaps without giving a validity or infringement opinion.
    - id: c28.prior_art.claim_mapping
      parent_id: c28.prior_art
      name: Claim-to-reference evidence mapping
      includes:
      - Parsing a supplied claim into limitations and dependencies
      - Mapping explicit, inherent, partial, and missing disclosure in supplied candidate
        references with pinpoint support
      - Separating single-reference coverage from multi-reference follow-up questions under
        supplied criteria
      excludes:
      - Searching external corpora for additional references
      - Issuing a final validity, obviousness, infringement, or freedom-to-operate opinion
      - Filling disclosure gaps from unsupported technical assumptions
      - Landscape coding that is organized by a feature taxonomy rather than a target claim
      kind: capability
      outcome: Given a patent claim, critical-date and comparison criteria, and a closed candidate-reference
        set, produce a traceable limitation-by-limitation evidence map that distinguishes
        explicit, inherent, partial, and missing disclosure and identifies supported follow-up
        questions.
      prerequisites: []
      sampling_facets:
      - id: patent_system
        description: Vary patent system only with the operative comparison and date criteria
          supplied; claim parsing and evidence traceability remain the central operation.
      - id: technology_domain
        description: Vary technical domain while supplying the references and necessary terminology
          so the operation remains limitation-to-evidence comparison.
      - id: prior_art_source_family
        description: Vary patent documents and technical publications when pinpointable content
          and provenance are supplied and the same evidence-mapping contract applies.
      sample_tasks:
      - kind: entry
        instruction: Break the supplied independent claim into limitations and compare it
          with the supplied earlier patent publication. For each limitation, cite the passage
          or figure that provides explicit or arguably inherent support, mark partial or missing
          disclosure, and state the unresolved technical assumption. Do not search for other
          references or state a final validity conclusion.
      - kind: representative
        instruction: Using the supplied independent and dependent claims, critical-date and
          comparison criteria, and the closed set of two patent publications and one dated
          technical paper, create a limitation-by-limitation evidence map with pinpoint citations.
          Distinguish explicit, inherent, partial, and missing disclosure; preserve claim
          dependencies; separate what any single reference shows from possible multi-reference
          follow-up; and identify uncertainties without issuing a final patentability or validity
          opinion.
    - id: c28.patent_evaluation
      parent_id: c28.patent
      name: Claim-based patent legal evaluation
      includes:
      - Applying supplied legal standards to claim and evidence records for novelty, obviousness,
        or preliminary freedom-to-operate screening
      excludes:
      - Prior-art retrieval or evidence mapping without the requested legal evaluation
      - Treating novelty, obviousness, and freedom to operate as interchangeable facet values
      kind: group
      scope: Claim-based legal evaluations whose central operations are separated because
        single-reference anticipation, multi-reference combination reasoning, and product-and-territory
        claim-scope screening have different solver loops and correctness contracts.
    - id: c28.patent_evaluation.novelty
      parent_id: c28.patent_evaluation
      name: Patent novelty evaluation
      includes:
      - Applying the supplied critical-date and single-reference rules to each candidate
      - Testing express or permitted inherent disclosure of every limitation without combining
        references
      - Separating evidentiary gaps, date ineligibility, and failed all-elements coverage
        in the conclusion
      excludes:
      - Combining references, assessing reasons to combine, or weighing objective evidence
        for obviousness
      - Comparing a product or process with a patent claim for infringement or freedom-to-operate
        screening
      - Searching for additional art or coding a technology landscape
      kind: capability
      outcome: Given patent claims, a closed reference set, critical-date facts, and a supplied
        anticipation standard, determine claim by claim whether one eligible reference discloses
        every limitation under that standard, with a traceable element chart and calibrated
        conclusion.
      prerequisites: []
      sampling_facets:
      - id: patent_system
        description: Vary patent system only with the anticipation and date rules supplied;
          single-reference all-elements evaluation remains the contract.
      - id: technology_domain
        description: Vary technology with claim terminology and reference content supplied;
          the all-elements comparison remains central.
      - id: prior_art_source_family
        description: Vary patent and nonpatent references only when eligibility, provenance,
          and disclosure standards are supplied.
      sample_tasks:
      - kind: entry
        instruction: Apply the supplied novelty rule to one independent claim and two dated
          references. Create an element chart, identify express, necessarily inherent, and
          missing disclosures, screen each date, and state whether either single reference
          anticipates. Do not combine the references or discuss obviousness.
      - kind: representative
        instruction: Evaluate the supplied independent and dependent claims against the closed
          set of dated patent publications and technical papers under the supplied anticipation
          and inherency rules. Preserve claim dependencies, chart every limitation with pinpoint
          support, resolve date eligibility, test all-elements coverage one reference at a
          time, address the strongest inherency dispute, and give a calibrated novelty conclusion
          for each claim without combining references or searching for new art.
    - id: c28.patent_evaluation.obviousness
      parent_id: c28.patent_evaluation
      name: Patent obviousness evaluation
      includes:
      - Identifying claim differences and evaluating one or more proposed multi-reference
        combinations
      - Testing articulated combination rationales and reasonable expectation of success without
        hindsight
      - Assessing supplied objective evidence for factual nexus, weight, and timing
      excludes:
      - Single-reference anticipation as the ultimate evaluation
      - Product-to-claim infringement or freedom-to-operate screening
      - Open-corpus prior-art searching or unsupported technical assumptions
      kind: capability
      outcome: Given patent claims, eligible prior-art references, skilled-artisan context,
        and a supplied obviousness standard, evaluate proposed reference combinations through
        claim differences, reasons to combine, reasonable expectation of success, counterarguments,
        and factually connected objective evidence.
      prerequisites: []
      sampling_facets:
      - id: patent_system
        description: Vary patent system only with the obviousness standard and timing rules
          supplied; combination reasoning remains the evaluated operation.
      - id: technology_domain
        description: Vary technology when skilled-artisan context and technical evidence are
          supplied; differences, combination rationale, and expected success remain central.
      - id: objective_evidence_type
        description: Vary commercial, technical, industry, or failure evidence when the task
          supplies the required nexus and timing facts for the same weighing operation.
      sample_tasks:
      - kind: entry
        instruction: Under the supplied obviousness rule, evaluate whether two eligible references
          would have been combined to add a remote alarm to a temperature sensor. Identify
          the claim difference, articulate or reject the proposed reason to combine, assess
          the supplied compatibility fact and expectation of success, address hindsight, and
          state a calibrated conclusion.
      - kind: representative
        instruction: Evaluate the supplied independent claim against three eligible references
          under the closed obviousness standard. Build the limitation and difference chart,
          analyze each proposed combination and alternative, test articulated reasons to combine
          and reasonable expectation of success using the supplied skilled-artisan evidence,
          address the strongest technical and hindsight counterarguments, assess the nexus
          and weight of the supplied objective evidence, and give a calibrated claim-level
          conclusion. Do not treat post-filing material as prior art.
    - id: c28.patent_evaluation.freedom_to_operate
      parent_id: c28.patent_evaluation
      name: Patent claim-scope and freedom-to-operate screening
      includes:
      - Comparing each accused product or process feature with construed claim limitations
      - Separating literal-screen results from unresolved technical facts and from supplied
        territory, term, and activity rules
      - Identifying design-around directions tied to limitations not met while labeling the
        work as preliminary
      excludes:
      - Novelty or obviousness evaluation against prior art
      - Unbounded infringement opinions, doctrines, claim constructions, or territorial rules
        not supplied
      - General product clearance that is not organized around identified patent claims
      kind: capability
      outcome: Given in-force patent claims, supplied claim constructions and territorial
        or timing rules, and a described product or process, perform a preliminary limitation-by-limitation
        freedom-to-operate screen, identify fact dependencies, and propose design-around directions
        grounded in absent limitations.
      prerequisites: []
      sampling_facets:
      - id: patent_system
        description: Vary patent system only with claim-construction, territorial, term, and
          activity rules supplied; product-to-claim screening remains central.
      - id: technology_domain
        description: Vary product or process technology when claim terms and technical facts
          are supplied for the same limitation-matching contract.
      - id: commercial_activity
        description: Vary manufacture, sale, offer, use, or import plans only when the task
          supplies the relevant territorial and timing treatment.
      sample_tasks:
      - kind: entry
        instruction: Using the supplied construed claim, patent term, territory rule, and
          one product description, chart literal limitation coverage, identify the technical
          fact that controls the closest limitation, state the preliminary freedom-to-operate
          screen for the planned sale, and suggest one design-around tied to a missing limitation.
          Do not invoke doctrines not supplied.
      - kind: representative
        instruction: Perform a preliminary freedom-to-operate screen for the supplied product
          variants and planned manufacture, sale, and import activities against the identified
          in-force claims. Apply only the supplied constructions, term, territory, and activity
          rules; chart every limitation for each variant; distinguish supported noncoverage,
          apparent coverage, and facts needing technical confirmation; separate results by
          activity, place, and time; and propose design-around directions grounded in absent
          limitations while clearly limiting the conclusion.
    - id: c28.patent.landscape
      parent_id: c28.patent
      name: Patent landscape coding and analysis
      includes:
      - Applying a supplied or justified taxonomy consistently to a bounded corpus with multi-label
        and quality-control rules
      - Separating cutoff-eligible and later activity, calculating category or combination
        counts, and documenting uncertain codes
      - Deriving cautious landscape observations and search refinements from the coded matrix
      excludes:
      - Claim-led novelty searching or limitation-by-limitation legal evaluation
      - Freedom-to-operate screening, patent valuation, or claims that an observed white space
        is legally patentable
      - Transaction-wide IP diligence or ownership and license review
      kind: capability
      outcome: Given a defined patent or technical-document corpus, cutoff, and feature taxonomy,
        code documents with traceable support, aggregate the coded data, and produce bounded
        trend, concentration, gap, and search-refinement observations without converting absence
        in the corpus into a patentability conclusion.
      prerequisites: []
      sampling_facets:
      - id: technology_domain
        description: Vary technical domain with a defined taxonomy and necessary terminology
          supplied; consistent corpus coding and bounded aggregation remain central.
      - id: document_source_family
        description: Vary abstracts, claims, full patent texts, and technical publications
          only when coding support and provenance rules are explicit.
      - id: analysis_dimension
        description: Vary technical feature, assignee, geography, chronology, and application
          dimensions when each is represented by defined codes and the same matrix-to-observation
          contract.
      sample_tasks:
      - kind: entry
        instruction: Code the supplied eight patent abstracts against the provided sensing,
          decision-location, and action taxonomy. Cite the abstract phrase supporting each
          code, separate post-cutoff records, count each category, flag uncertain codes, and
          state one bounded observation plus one search refinement without making a patentability
          claim.
      - kind: representative
        instruction: Using the supplied bounded patent corpus, cutoff, coding manual, and
          multi-dimensional taxonomy, build a document-by-feature matrix with traceable support
          and uncertainty labels, perform a consistency and duplicate check, aggregate categories
          and combinations for the eligible period, compare later activity separately, identify
          bounded trends, concentrations, and apparent gaps, and propose full-text review
          priorities and search refinements. Do not infer novelty, validity, freedom to operate,
          value, or patentability from corpus absence.
- routing_facet: subject_domain
  curriculum:
    version: wave7-5
    subject_id: C34
    subject_name: Bioinformatics & Life-Science Computing
    sections:
    - kind: group
      id: c34.sequence
      parent_id: null
      name: Sequence and comparative genomics
      scope: Computational comparison of biological sequences and genome organization.
      includes:
      - Sequence alignment, orthology inference, and conserved genome organization
      excludes:
      - Calling variants from assay reads
      - Inferring protein function from three-dimensional structures
    - kind: capability
      id: c34.sequence.pairwise_alignment_construction
      parent_id: c34.sequence
      name: Construct and score pairwise sequence alignments
      outcome: Choose a global or local pairwise alignment regime, construct or score an alignment
        under an explicit substitution and gap model, and report optimal coordinates, traceback,
        gaps, and score.
      includes:
      - Global and local pairwise alignment construction
      - Substitution-score and gap-penalty calculations
      - Dynamic-programming traceback and alignment-coordinate reporting
      excludes:
      - Interpreting database-search significance or making homology claims
      - Multiple-sequence alignment
      - Read mapping for variant calling
      prerequisites: []
      sampling_facets:
      - id: sequence_alphabet
        description: DNA, RNA, and protein sequences sampled while the operation remains construction
          or scoring under a supplied alphabet-appropriate substitution and gap model.
      sample_tasks:
      - kind: entry
        instruction: Given two short DNA sequences, a match score, mismatch penalty, gap penalty,
          and two candidate global alignments, compute each score and select the better alignment.
      - kind: representative
        instruction: Given two protein sequences, a supplied substitution matrix, affine gap
          penalties, and a local-alignment dynamic-programming table, complete the missing
          cells, trace back an optimal local alignment, report its residue coordinates and
          score, and explain how one specified gap-penalty change alters the optimum.
    - kind: capability
      id: c34.sequence.pairwise_hit_interpretation
      parent_id: c34.sequence
      name: Interpret pairwise search and homology evidence
      outcome: Judge what a completed pairwise sequence-search result supports by integrating
        statistical significance, identity, coverage, alignment extent, low-complexity or
        composition warnings, and database context without overstating homology or functional
        equivalence.
      includes:
      - Pairwise search-hit ranking and significance interpretation
      - Coverage-, domain-, and low-complexity-aware homology evidence
      - Bounded conclusions from completed alignment summaries
      excludes:
      - Constructing or scoring the underlying pairwise alignment
      - Multiple-sequence alignment curation
      - Assigning orthology from gene and species context
      prerequisites: []
      sampling_facets:
      - id: search_context
        description: Nucleotide and protein pairwise-search results sampled while the operation
          remains evidence-calibrated hit judgment from supplied statistics and alignment
          summaries.
      sample_tasks:
      - kind: entry
        instruction: Given two completed search hits with E-values, percent identities, query
          coverages, and low-complexity warnings, choose which provides stronger homology
          evidence and state the single decisive reason.
      - kind: representative
        instruction: Given a query and completed hit table with scores, E-values under a stated
          database size, identities, query and subject coverages, aligned intervals, domain
          boundaries, and composition warnings, rank the defensible hits, distinguish full-length
          from domain-limited evidence, reject misleading matches, and state the strongest
          bounded homology conclusion for each retained hit.
    - kind: capability
      id: c34.sequence.multiple_alignment
      parent_id: c34.sequence
      name: Assess and curate multiple-sequence alignments
      outcome: Assess and curate a multiple-sequence alignment, distinguishing conserved signal
        from artifacts caused by sequence selection, gap placement, or poorly aligned regions.
      includes:
      - Sequence-set selection
      - Conserved-column interpretation
      - Alignment trimming and quality diagnosis
      excludes:
      - Pairwise database search
      - Phylogenetic tree inference
      - Protein structure superposition
      prerequisites: []
      sampling_facets:
      - id: sequence_family_divergence
        description: Closely related through remote homolog families, with the same requirement
          to diagnose alignment reliability.
      sample_tasks:
      - kind: entry
        instruction: Given a six-sequence alignment and per-column gap and residue counts,
          mark the columns that meet a supplied conservation rule and identify one column
          whose apparent conservation is driven by missing data.
      - kind: representative
        instruction: Given eight homologous protein sequences, a draft alignment, sequence
          identities, and per-column confidence values, propose a defensible trimming and
          sequence-retention plan for downstream motif analysis and explain which conserved
          positions remain trustworthy.
    - kind: capability
      id: c34.sequence.orthology
      parent_id: c34.sequence
      name: Infer orthology and paralogy
      outcome: Use sequence, gene-tree, and species-context evidence to distinguish orthologous
        from paralogous relationships and state uncertainty caused by duplication, loss, or
        incomplete sampling.
      includes:
      - Reciprocal similarity evidence
      - Gene-tree/species-tree reconciliation
      - Duplication and loss reasoning
      excludes:
      - Synteny-block reconstruction
      - Functional equivalence asserted from similarity alone
      - De novo gene-model annotation
      prerequisites: []
      sampling_facets:
      - id: taxonomic_scope
        description: Near-species through cross-phylum comparisons, holding the orthology-evidence
          synthesis contract fixed.
      sample_tasks:
      - kind: entry
        instruction: Given a small rooted gene tree, a species tree, and labeled species for
          each gene, identify the single duplication node and list the gene pairs that are
          orthologs under the supplied reconciliation rule.
      - kind: representative
        instruction: Given similarity scores, domain architectures, a gene tree with branch
          support, and local gene-neighborhood evidence for a duplicated family across five
          species, assign supported ortholog groups and explain unresolved cases involving
          duplication and gene loss.
    - kind: capability
      id: c34.sequence.synteny
      parent_id: c34.sequence
      name: Compare genome organization and synteny
      outcome: Identify conserved genomic blocks and reason about rearrangements while accounting
        for assembly fragmentation, duplicated anchors, and orientation.
      includes:
      - Synteny-block identification
      - Inversion, translocation, and duplication patterns
      - Assembly-quality caveats
      excludes:
      - Orthology assignment from gene trees
      - Structural-variant calling from individual reads
      - Genome assembly
      prerequisites: []
      sampling_facets:
      - id: assembly_contiguity
        description: Chromosome-scale through fragmented assemblies, with the same anchor-order
          comparison and uncertainty contract.
      sample_tasks:
      - kind: entry
        instruction: Given ordered, oriented ortholog anchors for two short chromosomes, identify
          the longest conserved block and one candidate inversion.
      - kind: representative
        instruction: Given ortholog-anchor tables for three assemblies plus contig boundaries
          and duplicated-anchor flags, reconstruct supported synteny blocks, distinguish likely
          rearrangements from assembly ambiguity, and summarize the evidence for each event.
    - kind: group
      id: c34.structure
      parent_id: null
      name: Protein and structural bioinformatics
      scope: Computational annotation, assessment, comparison, and evidence-based interpretation
        of protein sequences, structures, sites, and substitutions.
      includes:
      - Protein feature and topology annotation, structure assessment and comparison, structure-based
        function reasoning, and site prioritization
      excludes:
      - Sequence-only family analysis
      - Small-molecule property modeling
      - Wet-lab structure determination
    - kind: capability
      id: c34.structure.quality
      parent_id: c34.structure
      name: Assess protein structure and model quality
      outcome: Evaluate whether a protein structure or model is fit for a stated use by integrating
        geometry, confidence, resolution, coverage, and local uncertainty.
      includes:
      - Experimental-structure validation metrics
      - Predicted-model confidence
      - Use-specific quality judgments
      excludes:
      - Generating atomic coordinates
      - Inferring function without first delimiting reliable regions
      - Ligand docking
      prerequisites: []
      sampling_facets:
      - id: structure_source
        description: Experimental and predicted structures, while the operation remains assessment
          of fitness for a supplied use and evidence-calibrated uncertainty.
      sample_tasks:
      - kind: entry
        instruction: Given residue-level confidence values for a predicted protein model and
          a threshold for reliable coordinates, identify the reliable residue intervals and
          state whether the disordered tail should be used for geometric analysis.
      - kind: representative
        instruction: Given resolution, validation outliers, chain coverage, ligand occupancy,
          and local confidence for three candidate structures, choose the best template for
          active-site modeling and justify exclusions and region-specific caveats.
    - kind: capability
      id: c34.structure.comparison
      parent_id: c34.structure
      name: Compare protein structures and conformations
      outcome: Align and compare protein structures, separate global fold similarity from
        local conformational change, and interpret comparison metrics in light of coverage
        and symmetry.
      includes:
      - Structural superposition
      - RMSD, TM-score, and coverage interpretation
      - Domain-motion and local-site comparison
      excludes:
      - Sequence alignment as the decisive operation
      - Molecular dynamics simulation
      - Structure generation
      prerequisites: []
      sampling_facets:
      - id: comparison_scale
        description: Whole-chain, domain, and local-site comparisons evaluated by fit, coverage,
          and biological interpretation.
      sample_tasks:
      - kind: entry
        instruction: Given two proposed structural superpositions with RMSD and aligned-residue
          counts, select the stronger global match and explain why RMSD alone is insufficient.
      - kind: representative
        instruction: Given apo and ligand-bound structures, two domain-wise superpositions,
          residue correspondences, RMSDs, and interface contacts, characterize the conformational
          change and distinguish rigid-body domain motion from local active-site remodeling.
    - kind: capability
      id: c34.structure.protein_features
      parent_id: c34.structure
      name: Annotate protein features and topology
      outcome: Locate sequence features such as signal peptides, transmembrane segments, domains,
        motifs, and targeting signals, then derive a coordinate-consistent protein topology
        with explicit evidence and uncertainty.
      includes:
      - Protein motif and domain-coordinate annotation
      - Signal-peptide, transmembrane-segment, and targeting-signal interpretation
      - Coordinate-consistent topology summaries
      excludes:
      - Pairwise or multiple-sequence alignment as the requested result
      - Three-dimensional structure-function inference
      - Clinical classification of protein variants
      prerequisites: []
      sampling_facets:
      - id: feature_evidence
        description: Explicit feature rules, curated profile hits, and predictor outputs sampled
          only where the operation remains coordinate reconciliation and topology annotation
          with evidence-calibrated uncertainty.
      sample_tasks:
      - kind: entry
        instruction: Given a short protein sequence and supplied rules for one cleavage motif
          and one hydrophobic segment, report every matching residue interval and sketch the
          resulting N-to-C topology.
      - kind: representative
        instruction: Given a protein sequence, signal-peptide and transmembrane predictions
          with scores, domain-profile hits, motif matches, and conflicting residue coordinates
          from two sources, produce a nonoverlapping feature annotation and topology, explain
          each accepted or rejected feature, and mark unresolved boundaries.
    - kind: capability
      id: c34.structure.function
      parent_id: c34.structure
      name: Infer protein function from structural evidence
      outcome: Integrate reliable structural features, pockets, interfaces, conserved residues,
        and comparison evidence to propose bounded functional hypotheses and discriminating
        follow-up tests.
      includes:
      - Pocket and catalytic-site reasoning
      - Interface-based hypotheses
      - Uncertainty-calibrated function inference
      excludes:
      - Function assignment from sequence similarity alone
      - Clinical variant classification
      - Unqualified claims from low-confidence coordinates
      prerequisites: []
      sampling_facets:
      - id: functional_context
        description: Enzyme, receptor, and macromolecular-interface contexts, with the same
          evidence-integration and bounded-hypothesis contract.
      sample_tasks:
      - kind: entry
        instruction: Given a reliable pocket model, four annotated residues, and two candidate
          catalytic mechanisms, identify which mechanism is structurally compatible and name
          the single observation that most directly discriminates them.
      - kind: representative
        instruction: Given a protein structure with confidence annotations, a structural-neighbor
          table, pocket geometry, conservation scores, and interface contacts, formulate the
          best-supported functional hypothesis, identify conflicting evidence, and propose
          two targeted computational or experimental checks.
    - kind: capability
      id: c34.structure.site_prioritization
      parent_id: c34.structure
      name: Prioritize protein sites and substitutions from integrated evidence
      outcome: Rank protein sites or amino-acid substitutions by integrating sequence conservation
        or evolution, structural reliability and context, stability or interaction evidence,
        and supplied frequency or lineage evidence while keeping the ranking distinct from
        clinical classification.
      includes:
      - Conservation- and evolution-aware site scoring
      - Integration of stability, pocket, interface, and accessibility evidence
      - Auditable prioritization of amino-acid substitutions or candidate sites
      excludes:
      - Inferring an unknown protein's overall function
      - Applying a clinical pathogenicity framework
      - Calling genomic variants from reads
      prerequisites: []
      sampling_facets:
      - id: site_context
        description: Observed amino-acid variants and lineage-specific substitutions sampled
          while the central operation remains auditable integration of sequence/evolution
          and structural evidence into a prioritized list.
      sample_tasks:
      - kind: entry
        instruction: Given four amino-acid substitutions with supplied conservation, stability,
          and distance-to-active-site scores plus an explicit point rule, compute the scores,
          rank the substitutions, and identify the evidence category driving each rank.
      - kind: representative
        instruction: Given candidate protein sites with alignment conservation, codon-change
          summaries, model-confidence masks, stability estimates, pocket and interface distances,
          accessibility, and supplied population or lineage frequencies, prioritize sites
          for follow-up, trace each ranking to concordant and conflicting evidence, and state
          which rankings are fragile to uncertain coordinates.
    - kind: group
      id: c34.molecules
      parent_id: null
      name: Cheminformatics and drug discovery
      scope: Computational representation, search, structure-based pose modeling, prediction,
        and prioritization of small molecules.
      includes:
      - Chemical-structure curation, exact and similarity search, docking and pose assessment,
        property modeling, and multi-criterion compound ranking
      excludes:
      - Protein-only structure assessment, comparison, or function inference without a ligand-pose
        objective
      - Molecular-dynamics simulation or binding-free-energy estimation
      - Clinical pharmacogenomic recommendation
      - Wet-lab synthesis
    - kind: capability
      id: c34.molecules.curation
      parent_id: c34.molecules
      name: Standardize and validate chemical structures
      outcome: Apply an explicit chemical standardization policy, detect representation and
        valence problems, and preserve provenance so downstream comparisons are reproducible.
      includes:
      - Salt and mixture handling
      - Charge, tautomer, and stereochemistry policy
      - Duplicate and invalid-structure detection
      excludes:
      - Selecting a biological assay
      - Training a property model
      - Treating every tautomer as universally interchangeable
      prerequisites: []
      sampling_facets:
      - id: standardization_policy
        description: Project-specific salt, charge, tautomer, and stereochemistry policies
          supplied in the task; evaluation remains faithful application plus provenance.
      sample_tasks:
      - kind: entry
        instruction: Given five molecular records and a supplied rule to remove counterions
          while preserving the largest organic component, identify the retained component
          for each record and flag an ambiguous mixture.
      - kind: representative
        instruction: Given a small registry containing SMILES, formal charges, stereochemical
          labels, salts, and source IDs plus an explicit standardization policy, produce a
          curation plan that identifies invalid records, standardizes allowed forms, groups
          duplicates, and records every lossy decision.
    - kind: capability
      id: c34.molecules.substructure_search
      parent_id: c34.molecules
      name: Perform chemical substructure search
      outcome: Define and apply chemically precise substructure queries, including aromaticity,
        charge, stereochemistry, and optional-feature semantics, and diagnose representation-dependent
        hits and misses.
      includes:
      - SMARTS-like query semantics
      - Functional-group and scaffold matching
      - Hit validation against query constraints
      excludes:
      - Fingerprint similarity ranking
      - Molecular standardization as the requested result
      - Property prediction
      prerequisites: []
      sampling_facets:
      - id: query_specificity
        description: Broad functional-group through stereochemically constrained queries,
          retaining an exact query-satisfaction contract.
      sample_tasks:
      - kind: entry
        instruction: Given a simple substructure query definition and five annotated molecular
          graphs, identify the graphs that satisfy every required atom and bond constraint.
      - kind: representative
        instruction: Given a curated compound table and a stereochemically constrained substructure
          query with aromaticity, charge, recursive, and optional-feature rules, identify
          valid hits and explain representation-dependent false positives and false negatives.
    - kind: capability
      id: c34.molecules.similarity_search
      parent_id: c34.molecules
      name: Rank molecules by chemical similarity
      outcome: Select a fingerprint or scaffold representation and similarity rule for an
        analog-retrieval objective, rank candidates, and interpret representation-dependent
        neighborhoods and diversity.
      includes:
      - Fingerprint similarity
      - Scaffold-aware analog retrieval
      - Threshold and diversity tradeoffs
      excludes:
      - Exact substructure satisfaction
      - Property prediction
      - Docking-score interpretation
      prerequisites: []
      sampling_facets:
      - id: similarity_representation
        description: Circular, key-based, and scaffold representations when the evaluation
          remains ranked analog retrieval for an explicit objective.
      sample_tasks:
      - kind: entry
        instruction: Given bit sets for one query and four molecules, compute Tanimoto similarity
          and rank the molecules under a supplied tie rule.
      - kind: representative
        instruction: Given a query compound, candidate fingerprint similarities under two
          representations, scaffold identities, and a goal of retrieving potent but scaffold-diverse
          analogs, choose the representation, rank a shortlist, and explain unstable neighbors
          and diversity tradeoffs.
    - kind: capability
      id: c34.molecules.docking_generation
      parent_id: c34.molecules
      name: Configure and generate ligand docking poses
      outcome: Configure a reproducible structure-based docking search from supplied receptor
        and ligand states, generate candidate binding poses under explicit geometric constraints
        and search settings, and compute the protocol's raw pose scores without treating those
        scores as biological conclusions.
      includes:
      - Receptor and ligand state selection for a supplied docking objective
      - Binding-site box, geometric constraint, and search-parameter configuration
      - Candidate pose generation and protocol-defined raw scoring
      excludes:
      - Assessing the physical or biological plausibility of completed poses
      - Multi-objective compound prioritization
      - Molecular-dynamics simulation or binding-free-energy estimation
      prerequisites: []
      sampling_facets:
      - id: search_complexity
        description: Rigid and flexible ligand searches, including supplied receptor ensembles,
          sampled only where the operation remains configuration, candidate-state generation,
          and raw scoring under an explicit docking protocol.
      sample_tasks:
      - kind: entry
        instruction: Given a receptor pocket bounding box, ligand dimensions, and two candidate
          docking boxes, choose the box that covers the supplied pocket with the required
          margin while minimizing irrelevant search volume.
      - kind: representative
        instruction: Given prepared receptor alternatives, ligand protonation and conformer
          states, a target pocket, required pharmacophore constraints, an explicit docking-engine
          interface, search budgets, and raw outputs from pilot settings, specify and execute
          a reproducible docking configuration, generate a diverse pose ensemble, report protocol-defined
          scores, and diagnose search failures without claiming that the top raw score is
          a valid binding mode.
    - kind: capability
      id: c34.molecules.pose_assessment
      parent_id: c34.molecules
      name: Assess ligand docking pose quality
      outcome: Evaluate completed ligand poses by integrating geometric fit, required and
        conflicting interactions, clashes, ligand strain, receptor or coordinate uncertainty,
        score decomposition, and pose convergence to retain plausible binding modes with calibrated
        uncertainty.
      includes:
      - Geometric and interaction-based pose validation
      - Clash, strain, desolvation, and score-artifact diagnosis
      - Consensus, convergence, and receptor-uncertainty assessment
      excludes:
      - Generating the candidate poses or configuring the search
      - Ranking compounds across assay, property, and selectivity objectives
      - Inferring a protein's overall function
      prerequisites: []
      sampling_facets:
      - id: binding_context
        description: Enzyme pockets, receptor sites, and protein-interface grooves sampled
          while correctness remains evidence-calibrated physical plausibility of supplied
          poses rather than raw-score maximization.
      sample_tasks:
      - kind: entry
        instruction: Given three supplied poses with protein-ligand distances, clash counts,
          ligand-strain values, and one required interaction, select the physically plausible
          pose and identify the decisive defect in each rejected pose.
      - kind: representative
        instruction: Given completed poses from two docking protocols, receptor-coordinate
          confidence, interaction maps, geometric constraints, ligand strain, score components,
          conserved-water alternatives, and cross-run pose clusters, identify defensible binding
          modes, reject scoring artifacts, explain protocol disagreement, and state which
          pose claims remain unresolved.
    - kind: capability
      id: c34.molecules.property_classification
      parent_id: c34.molecules
      name: Build and evaluate molecular property classifiers
      outcome: Construct and evaluate a molecular classifier for a categorical property endpoint
        using leakage-aware chemical splits, calibrated class probabilities, classification
        metrics, an explicit decision policy, and a defined applicability domain.
      includes:
      - Binary and categorical QSAR endpoints
      - Scaffold-aware classification evaluation
      - Probability calibration, imbalance handling, and decision-threshold analysis
      excludes:
      - Continuous property regression
      - Compound ranking from fixed supplied predictions
      - Chemical structure standardization as the requested result
      prerequisites: []
      sampling_facets:
      - id: classification_endpoint
        description: Activity, toxicity, and ADME endpoints sampled only when represented
          as declared categorical labels and evaluated through class-probability discrimination,
          calibration, and decision performance.
      sample_tasks:
      - kind: entry
        instruction: Given confusion-matrix counts for a molecular classifier at one supplied
          probability threshold and minimum sensitivity and specificity requirements, decide
          whether the classifier passes the stated categorical decision rule.
      - kind: representative
        instruction: Given a curated molecular dataset with categorical labels, scaffold IDs,
          class imbalance, replicate-conflict flags, and candidate representations, specify
          a leakage-resistant classifier workflow, assess held-out discrimination and probability
          calibration, choose a decision threshold for the supplied costs, and delimit the
          chemical applicability domain for new class-probability predictions.
    - kind: capability
      id: c34.molecules.property_regression
      parent_id: c34.molecules
      name: Build and evaluate molecular property regressors
      outcome: Construct and evaluate a molecular regressor for a continuous property endpoint
        using leakage-aware chemical splits, numeric error and residual diagnostics, predictive
        uncertainty, and a defined continuous-range applicability domain.
      includes:
      - Continuous QSAR endpoints
      - Scaffold-aware regression evaluation
      - Numeric error, residual, interval-coverage, and range-applicability analysis
      excludes:
      - Categorical property classification
      - Compound ranking from fixed supplied predictions
      - Chemical structure standardization as the requested result
      prerequisites: []
      sampling_facets:
      - id: regression_endpoint
        description: Physicochemical, potency, ADME, and toxicity endpoints sampled only when
          represented as continuous responses and evaluated through numeric error, residual
          structure, predictive intervals, and range applicability.
      sample_tasks:
      - kind: entry
        instruction: Given observed and predicted continuous molecular-property values and
          a supplied maximum acceptable mean absolute error, compute that error and decide
          whether the regressor passes the stated numeric-error rule.
      - kind: representative
        instruction: Given a curated molecular dataset with a continuous response, scaffold
          IDs, measurement-uncertainty and censoring annotations, and candidate representations,
          specify a leakage-resistant regression workflow, choose a response treatment, assess
          held-out numeric error and residual structure, evaluate predictive-interval coverage,
          and delimit continuous-range applicability for new predictions.
    - kind: capability
      id: c34.molecules.prioritization
      parent_id: c34.molecules
      name: Prioritize compounds from multi-source screening evidence
      outcome: Integrate assay, docking, property, selectivity, and uncertainty evidence under
        explicit objectives to rank compounds and expose tradeoffs rather than collapsing
        incompatible signals blindly.
      includes:
      - Multi-objective ranking
      - Hit triage
      - Diversity and uncertainty constraints
      excludes:
      - Training the underlying property predictors
      - Declaring clinical efficacy
      - Ranking by one raw score without checking comparability
      prerequisites: []
      sampling_facets:
      - id: discovery_stage
        description: Hit finding through lead optimization, retaining the same explicit-objective
          evidence-integration and ranking contract.
      sample_tasks:
      - kind: entry
        instruction: Given five compounds with normalized potency and toxicity scores and
          a supplied weighted objective, compute the ranking and identify one candidate whose
          rank is sensitive to the weights.
      - kind: representative
        instruction: Given assay replicates, counterscreen results, docking poses, predicted
          solubility, uncertainty intervals, structural clusters, and explicit project constraints
          for twelve compounds, produce a prioritized shortlist with tradeoffs, diversity
          choices, and follow-up measurements that could change the ranking.
    - kind: group
      id: c34.lab_data
      parent_id: null
      name: Lab data management and LIMS
      scope: Computational representation, integrity control, and operational use of laboratory
        samples, processes, and records.
      includes:
      - LIMS schemas and state rules, lineage reconciliation, and operational reporting
      excludes:
      - Scientific inference from assay measurements
      - Generic business databases
      - Wet-lab protocol execution
    - kind: capability
      id: c34.lab_data.workflow
      parent_id: c34.lab_data
      name: Model laboratory entities and workflow states
      outcome: Translate a laboratory process into LIMS entities, relationships, identifiers,
        validation rules, and allowed state transitions that preserve traceability.
      includes:
      - Sample and aliquot schemas
      - Workflow state machines
      - Validation and identifier rules
      excludes:
      - Repairing a particular corrupted lineage
      - Statistical assay analysis
      - Unconstrained database normalization
      prerequisites: []
      sampling_facets:
      - id: laboratory_process
        description: Sequencing, screening, and biobanking processes sampled while the entity-and-state
          modeling contract remains stable.
      sample_tasks:
      - kind: entry
        instruction: Given a four-step sample process and supplied uniqueness and parentage
          requirements, define the entities, identifiers, and allowed parent-child links needed
          to represent it.
      - kind: representative
        instruction: Given a laboratory workflow from accession through aliquoting, assay,
          review, and release plus traceability and retention requirements, design the LIMS
          entities, relationships, validation rules, and state transitions, including how
          failed and repeated steps are recorded without overwriting history.
    - kind: capability
      id: c34.lab_data.lineage_audit
      parent_id: c34.lab_data
      name: Reconcile sample lineage and data integrity
      outcome: Audit laboratory records for broken lineage, inconsistent identifiers, impossible
        state transitions, and metadata conflicts, then propose traceable corrections without
        inventing evidence.
      includes:
      - Chain-of-custody reconstruction
      - Metadata conflict detection
      - Correction and exception records
      excludes:
      - Designing a new LIMS schema
      - Recomputing quantitative assay endpoints after an identity correction
      - Silently overwriting source records
      prerequisites: []
      sampling_facets:
      - id: recordkeeping_regime
        description: Different supplied traceability or retention rules, with the same violation-detection
          and evidence-preserving correction contract.
      sample_tasks:
      - kind: entry
        instruction: Given ten sample, aliquot, and plate records plus three lineage rules,
          identify every orphan, duplicate identifier, and impossible parent-child timestamp.
      - kind: representative
        instruction: Given accession, aliquot, plate, instrument-run, and result-release records
          with timestamps and an explicit audit policy, reconstruct lineage for each released
          result, distinguish correctable metadata conflicts from unresolved identity failures,
          and propose an auditable remediation record.
    - kind: capability
      id: c34.lab_data.quantitative_impact
      parent_id: c34.lab_data
      name: Trace identity defects into quantitative results
      outcome: Reconcile sample, library, well, or treatment identity using supplied provenance
        and orthogonal evidence, propagate the correction through a supplied quantitative
        analysis, and quantify which derived results or conclusions change while preserving
        raw records.
      includes:
      - Sample, library, well, and treatment-label reconciliation
      - Immutable correction mappings and corrected joins
      - Before-and-after recomputation of supplied quantitative endpoints
      excludes:
      - General LIMS schema design
      - Standalone lineage audit without a downstream quantitative consequence
      - Open-ended biological interpretation or model invention beyond the supplied analysis
        contract
      prerequisites: []
      sampling_facets:
      - id: quantitative_endpoint
        description: Dose-response, expression, and other assay summaries sampled only when
          formulas or analysis rules are supplied and correctness remains identity reconciliation
          followed by before-and-after propagation.
      sample_tasks:
      - kind: entry
        instruction: Given a four-well manifest, an export with two swapped labels, orthogonal
          identity checks, and a supplied normalization formula, determine the correction
          mapping and recompute the affected treatment means without altering the raw records.
      - kind: representative
        instruction: Given linked manifest, barcode, batch, and assay-result tables containing
          an identity conflict, establish the smallest evidence-supported correction, create
          an auditable corrected join, rerun the supplied normalization and endpoint calculations,
          compare raw and corrected results, and identify every downstream conclusion whose
          status changes.
    - kind: capability
      id: c34.lab_data.reporting
      parent_id: c34.lab_data
      name: Query and summarize laboratory operations
      outcome: Translate a laboratory operational question into reproducible queries and summaries
        that respect entity grain, workflow state, repeated measurements, and missingness.
      includes:
      - Turnaround and backlog metrics
      - State-aware sample counts
      - Reproducible operational extracts
      excludes:
      - Biological differential analysis
      - LIMS schema design
      - Counting rows without resolving entity grain
      prerequisites: []
      sampling_facets: []
      sample_tasks:
      - kind: entry
        instruction: Given sample and assay-run tables with repeated failed runs, write a
          query plan that counts unique samples whose latest valid run is still awaiting review.
      - kind: representative
        instruction: Given schemas and example rows for accession, aliquot, run, review, and
          release tables, define reproducible weekly turnaround, backlog, and repeat-rate
          summaries, including joins, entity grain, state filters, censoring, and missing-data
          checks.
    - kind: group
      id: c34.variants
      parent_id: null
      name: Variant calling and genome annotation
      scope: Computational detection, representation, annotation, and genome-feature modeling
        for sequence variation and assemblies.
      includes:
      - Small and structural variant calling, variant normalization and annotation, and gene-model
        annotation
      excludes:
      - Clinical evidence classification
      - Population-level evolutionary inference
      - Generic sequence alignment
    - kind: capability
      id: c34.variants.small_calling
      parent_id: c34.variants
      name: Call and genotype small variants
      outcome: Evaluate read-level evidence for SNVs and short indels, distinguish genotype
        states from artifacts, and apply transparent quality filters appropriate to the assay
        design.
      includes:
      - Pileup and allele-balance reasoning
      - Genotype likelihood interpretation
      - Short-read artifact and quality filtering
      excludes:
      - Structural-variant inference
      - Clinical pathogenicity classification
      - Variant normalization after calling
      prerequisites: []
      sampling_facets:
      - id: capture_scope
        description: Short-read genome, exome, and panel assays, retaining the same read-evidence
          and genotype-quality contract.
      sample_tasks:
      - kind: entry
        instruction: Given depth, alternate-read count, base qualities, strand counts, and
          three genotype likelihoods at one locus, select the supported diploid genotype and
          identify one artifact warning.
      - kind: representative
        instruction: Given read-evidence summaries for SNVs and short indels across a trio,
          assay coverage targets, genotype likelihoods, strand and position biases, and pedigree
          relationships, produce justified calls, no-calls, and quality flags while identifying
          a likely de novo candidate.
    - kind: capability
      id: c34.variants.structural_calling
      parent_id: c34.variants
      name: Infer structural variants from genomic evidence
      outcome: Integrate breakpoint, orientation, depth, and molecule-span evidence to infer
        structural-variant type, interval, genotype support, and uncertainty.
      includes:
      - Deletion, duplication, inversion, and translocation evidence
      - Breakpoint uncertainty
      - Conflicting-signal reconciliation
      excludes:
      - Small-variant pileup calling
      - Population-frequency interpretation
      - Clinical actionability
      prerequisites: []
      sampling_facets:
      - id: variant_class
        description: Copy-number and balanced rearrangement classes sampled under the same
          multi-signal inference and uncertainty-reporting contract.
      sample_tasks:
      - kind: entry
        instruction: Given read-depth ratios and paired-read orientations across one interval,
          choose among deletion, tandem duplication, and no event and state the breakpoint
          uncertainty.
      - kind: representative
        instruction: Given split-read clusters, paired-read orientations, depth bins, molecule
          spans, mapping-quality summaries, and a repeat annotation for a candidate rearrangement,
          infer the most supported structural event, genotype evidence, breakpoint interval,
          and unresolved alternatives.
    - kind: capability
      id: c34.variants.normalization
      parent_id: c34.variants
      name: Normalize sequence variant representations
      outcome: Represent variants consistently against a declared reference, decompose multi-allelic
        records, and reconcile equivalent forms with explicit provenance.
      includes:
      - Left normalization
      - Allele trimming and decomposition
      - Reference consistency and duplicate reconciliation
      excludes:
      - Deciding whether a variant is present
      - Transcript consequence prediction
      - Clinical pathogenicity classification
      prerequisites: []
      sampling_facets:
      - id: reference_release
        description: Reference assemblies treated as explicit inputs while the canonical-representation
          contract remains unchanged.
      sample_tasks:
      - kind: entry
        instruction: Given a short reference interval and three equivalent representations
          of an indel, produce the left-normalized representation and identify the duplicate
          records.
      - kind: representative
        instruction: Given reference intervals, multi-allelic VCF records, and explicit trimming,
          decomposition, and left-normalization rules, produce canonical records, reconcile
          equivalent alleles, and report reference mismatches and lossy transformations.
    - kind: capability
      id: c34.variants.consequence_annotation
      parent_id: c34.variants
      name: Annotate transcript consequences of variants
      outcome: Project declared variants onto explicit transcript models and compute strand-,
        exon-, coding-, and splice-aware molecular consequences with transcript and reference
        provenance.
      includes:
      - Transcript overlap and strand handling
      - Coding and splice consequences
      - Multiple-transcript consequence reporting
      excludes:
      - Canonicalizing the input variant representation
      - Clinical pathogenicity classification
      - De novo gene-model construction
      prerequisites: []
      sampling_facets:
      - id: transcript_release
        description: Versioned transcript sets treated as explicit inputs while consequence
          computation and provenance requirements remain stable.
      sample_tasks:
      - kind: entry
        instruction: Given one SNV, a coding transcript on the reverse strand, exon boundaries,
          and a codon table, determine the affected codon and molecular consequence.
      - kind: representative
        instruction: Given normalized variants, reference sequence, versioned transcript exon
          and strand definitions, coding frames, and splice windows, assign all transcript-level
          consequences, identify the most severe consequence under a supplied ordering, and
          report transcript-dependent ambiguity.
    - kind: capability
      id: c34.variants.gene_models
      parent_id: c34.variants
      name: Construct and evaluate genome feature annotations
      outcome: Integrate transcript, protein, homology, and genomic evidence to propose gene
        models and identify unsupported exons, merged loci, fragmented models, and alternative
        isoforms.
      includes:
      - Exon-intron model construction
      - Evidence reconciliation
      - Gene-model quality diagnosis
      excludes:
      - Variant consequence annotation against a fixed transcript set
      - Orthology inference as the endpoint
      - Assembly generation
      prerequisites: []
      sampling_facets:
      - id: genome_context
        description: Compact through repeat-rich eukaryotic loci sampled while the evidence-to-gene-model
          evaluation contract remains fixed.
      sample_tasks:
      - kind: entry
        instruction: Given genomic coordinates for three splice-aware transcript alignments
          on one strand, propose the supported exon chain and flag an intron that lacks canonical
          splice evidence.
      - kind: representative
        instruction: Given a genomic locus, splice-aware transcript alignments, protein homology,
          ab initio predictions, repeat annotations, and read coverage, propose supported
          gene and isoform models, identify conflicts and likely artifacts, and state which
          ambiguities remain unresolved.
    - kind: group
      id: c34.expression
      parent_id: null
      name: Expression and functional genomics
      scope: Computational inference from transcript abundance, splice usage, bulk and single-cell
        expression, regulatory, pathway, and perturbation measurements.
      includes:
      - Transcript and isoform quantification, alternative-splicing analysis, bulk and single-cell
        expression, regulatory-assay analysis, enrichment, and pooled functional screens
      excludes:
      - Constructing gene or transcript annotations
      - Variant calling
      - Population-genetic inference
      - LIMS operational reporting
    - kind: capability
      id: c34.expression.bulk
      parent_id: c34.expression
      name: Analyze bulk differential expression
      outcome: Design and evaluate a count-based bulk expression comparison, accounting for
        library size, covariates, replication, multiple testing, and effect-size interpretation.
      includes:
      - Count normalization
      - Design matrices and contrasts
      - Differential-expression uncertainty and multiplicity
      excludes:
      - Single-cell state inference
      - Pathway enrichment as the decisive operation
      - Microarray preprocessing
      prerequisites: []
      sampling_facets:
      - id: study_design
        description: Paired, blocked, time-course, and factorial count-based studies, with
          the same explicit contrast and uncertainty contract.
      sample_tasks:
      - kind: entry
        instruction: Given sample metadata for a balanced treatment-by-batch RNA-seq study,
          write the design terms and the contrast needed to estimate the treatment effect
          while controlling batch.
      - kind: representative
        instruction: Given a raw-count matrix, sample metadata with pairing and batch, library
          summaries, and a prespecified treatment contrast, specify the normalization, model,
          quality checks, multiplicity control, and effect-size interpretation, including
          how one influential sample changes confidence.
    - kind: capability
      id: c34.expression.transcript_quantification
      parent_id: c34.expression
      name: Quantify transcript and isoform abundance
      outcome: Estimate transcript or isoform abundances from sequencing-fragment compatibility
        against a fixed transcript annotation, accounting for effective length, ambiguous
        assignment, library protocol, bias, identifiability, and abundance uncertainty.
      includes:
      - Transcript-compatibility and equivalence-class abundance inference
      - Effective-length, strandedness, and sequence-bias correction
      - Transcript-level abundance and identifiability uncertainty
      excludes:
      - Testing differential gene expression from supplied count matrices
      - Testing condition-associated alternative-splicing usage
      - Constructing or revising the transcript annotation itself
      prerequisites: []
      sampling_facets:
      - id: library_strandedness
        description: Stranded and unstranded fragment libraries sampled while the central
          operation remains abundance inference over fixed transcripts from compatibility
          evidence and effective lengths.
      sample_tasks:
      - kind: entry
        instruction: Given two fixed transcripts, three fragment-equivalence classes with
          counts and compatibility sets, effective lengths, and starting abundance weights,
          perform one supplied expectation-maximization update and report the normalized transcript-abundance
          estimates.
      - kind: representative
        instruction: Given a fixed transcript annotation, fragment-equivalence-class counts,
          effective lengths, strandedness, sequence-bias factors, replicate library summaries,
          and bootstrap estimates, infer transcript and isoform abundances, diagnose non-identifiable
          transcript groups and protocol mismatches, and report abundance uncertainty without
          testing a condition effect.
    - kind: capability
      id: c34.expression.alternative_splicing
      parent_id: c34.expression
      name: Analyze alternative-splicing changes
      outcome: Estimate and test condition-associated changes in alternative-splice usage
        from replicated exon, junction, or fixed-isoform evidence using an explicit event
        denominator, donor-aware design, effect-size uncertainty, and multiplicity control.
      includes:
      - Percent-spliced-in and relative junction or isoform usage
      - Replicate-aware differential splice-event testing
      - Event coverage, ambiguity, covariate, and multiplicity diagnostics
      excludes:
      - Estimating absolute transcript abundance as the requested result
      - Gene-level differential expression
      - Constructing novel gene or transcript models
      prerequisites: []
      sampling_facets:
      - id: splice_event_type
        description: Cassette-exon and alternative donor or acceptor events sampled while
          the response remains relative inclusion or junction usage and evaluation remains
          replicate-aware effect estimation with uncertainty.
      sample_tasks:
      - kind: entry
        instruction: Given inclusion and exclusion junction counts for one fixed cassette-exon
          event in two samples and the supplied percent-spliced-in formula, compute each sample's
          inclusion value and the change between samples.
      - kind: representative
        instruction: Given replicated junction and exon counts for fixed splice events, donor,
          condition, batch, and coverage metadata, define event-specific inclusion denominators,
          estimate condition-associated usage changes with donor-aware uncertainty, filter
          uninformative events, control multiplicity, and distinguish splicing changes from
          gene-level abundance shifts.
    - kind: capability
      id: c34.expression.single_cell_technical_qc
      parent_id: c34.expression
      name: Quality-control single-cell measurements
      outcome: Classify cells or droplets using technical-quality evidence, diagnose ambient
        signal and doublets, and make auditable retain, flag, or exclude decisions with threshold
        sensitivity.
      includes:
      - Cell and gene quality-control metrics
      - Empty-droplet, ambient-RNA, and doublet diagnosis
      - Retention decisions and threshold-sensitivity analysis
      excludes:
      - Batch integration or correction
      - Biological state annotation
      - Donor-aware condition comparison
      prerequisites: []
      sampling_facets:
      - id: capture_design
        description: Plate- and droplet-based measurements sampled where cell-level technical
          evidence supports the same retain, flag, or exclude contract.
      sample_tasks:
      - kind: entry
        instruction: Given per-cell library size, detected-gene count, mitochondrial fraction,
          and supplied thresholds, label each cell retain, flag, or exclude and identify any
          threshold-sensitive decision.
      - kind: representative
        instruction: Given per-cell quality metrics, empty-droplet profiles, ambient marker
          evidence, doublet scores, donor and batch labels, and prespecified decision rules,
          produce auditable retain, flag, and exclude decisions, diagnose conflicting indicators,
          and report how plausible threshold changes alter retained composition.
    - kind: capability
      id: c34.expression.single_cell_integration
      parent_id: c34.expression
      name: Normalize and integrate single-cell datasets
      outcome: Choose and evaluate normalization and integration for already quality-controlled
        single-cell measurements, reducing technical batch structure while preserving donor-linked
        and known biological variation.
      includes:
      - Single-cell normalization and feature selection for integration
      - Batch-aware latent representation or correction
      - Technical-mixing and biological-conservation diagnostics
      excludes:
      - Raw-cell retention and contamination decisions
      - Assigning biological state labels
      - Testing donor-level condition effects
      prerequisites: []
      sampling_facets:
      - id: integration_context
        description: Within-protocol batches and cross-protocol datasets sampled only where
          evaluation retains the same joint contract of technical mixing and biological conservation.
      sample_tasks:
      - kind: entry
        instruction: Given an already filtered donor-by-batch expression matrix and two candidate
          integrated embeddings with batch-mixing and donor-conservation scores, select the
          better representation and identify evidence of overcorrection.
      - kind: representative
        instruction: Given a quality-controlled count matrix, donor, batch, protocol, and
          known control-state labels, plus diagnostics for three normalization and integration
          plans, choose or revise a plan, justify feature and reference choices, and demonstrate
          reduced technical separation without erasing donor or control-state biology.
    - kind: capability
      id: c34.expression.single_cell_state_partitioning
      parent_id: c34.expression
      name: Select single-cell state partitions
      outcome: Select a reproducible unlabeled partition of a quality-controlled single-cell
        representation using neighborhood structure, resolution, resampling stability, separation,
        rare-group support, and donor or batch consistency.
      includes:
      - Neighborhood-graph and clustering-resolution selection
      - Partition stability and separation assessment
      - Detection of unstable splits, merges, bridges, and unsupported rare groups
      excludes:
      - Assigning biological cell-state labels
      - Raw-cell quality control or dataset integration
      - Donor-level state-abundance or expression testing
      prerequisites: []
      sampling_facets:
      - id: partition_cohort
        description: Single-cohort and multi-donor integrated datasets sampled while the operation
          remains unlabeled partition selection under stability, separation, and cross-donor
          support criteria.
      sample_tasks:
      - kind: entry
        instruction: Given stability and separation scores for three clustering resolutions
          plus a supplied minimum-cluster-size rule, select the defensible resolution and
          identify one unsupported split.
      - kind: representative
        instruction: Given a quality-controlled integrated neighborhood graph, candidate partitions
          across resolutions, resampling-stability scores, cluster separation, donor and batch
          composition, and rare-group support, choose a reproducible unlabeled partition,
          justify merges and splits, and mark unstable bridges and unresolved cells without
          assigning biological labels.
    - kind: capability
      id: c34.expression.single_cell_state_labeling
      parent_id: c34.expression
      name: Label single-cell states and ambiguity
      outcome: Assign biological state labels to fixed single-cell partitions by reconciling
        positive and negative markers, reference-transfer evidence, and contextual expectations
        while preserving transitional, mixed, and unresolved groups.
      includes:
      - Marker- and reference-supported labels for fixed partitions
      - Positive and negative evidence reconciliation
      - Ambiguous, transitional, mixed, and unresolved-state reporting
      excludes:
      - Selecting a clustering resolution or partition
      - Raw-cell quality control or dataset integration
      - Donor-level state-abundance or expression testing
      prerequisites: []
      sampling_facets:
      - id: tissue_context
        description: Different tissues and expected state vocabularies sampled as biological
          knowledge context while the fixed-partition labeling and ambiguity contract remains
          unchanged.
      sample_tasks:
      - kind: entry
        instruction: Given fixed cluster-average expression and explicit positive and negative
          marker definitions for four states, assign supported labels and mark every ambiguous
          cluster.
      - kind: representative
        instruction: Given fixed single-cell partitions, cluster-average expression, positive
          and negative marker panels, reference-transfer confidences, and tissue-context expectations,
          assign the strongest supported biological labels, reconcile conflicts, and document
          transitional, mixed, and unresolved groups without revising the partition.
    - kind: capability
      id: c34.expression.single_cell_state_abundance
      parent_id: c34.expression
      name: Compare cell-state abundance across donors
      outcome: Estimate condition-associated differences in cell-state abundance from fixed
        state labels and donor-level state counts, respecting donor replication, compositional
        structure, sparse counts, covariates, and multiplicity.
      includes:
      - Donor-by-state count and proportion analysis
      - Composition-aware condition contrasts
      - Sparse-state, covariate, and donor-influence diagnostics
      excludes:
      - Within-state gene-expression testing
      - Inferring or annotating cell states
      - Treating individual cells as independent condition replicates
      prerequisites: []
      sampling_facets:
      - id: abundance_design
        description: Independent-group, paired, and longitudinal donor designs sampled while
          the response remains donor-by-state abundance and evaluation remains composition-aware
          effect estimation with uncertainty.
      sample_tasks:
      - kind: entry
        instruction: Given fixed state labels and per-donor state counts for two conditions,
          compute donor-level state proportions and the supplied condition contrast without
          pooling cells as biological replicates.
      - kind: representative
        instruction: Given fixed state labels, donor-by-state counts, condition and covariate
          metadata, total recovered cells, and prespecified state contrasts, estimate composition-aware
          abundance effects, handle sparse states and paired or blocked donors, control multiplicity
          across states, and report influential-donor sensitivity and uncertainty.
    - kind: capability
      id: c34.expression.single_cell_pseudobulk_expression
      parent_id: c34.expression
      name: Test within-state pseudobulk expression across donors
      outcome: Estimate gene-wise condition effects within fixed cell states from donor-level
        pseudobulk counts using count normalization, replicate-aware designs, dispersion and
        covariate modeling, multiplicity control, and sparse-state diagnostics.
      includes:
      - Donor-by-state pseudobulk gene-count construction supplied or specified
      - Within-state count normalization and gene-wise condition modeling
      - Dispersion, covariate, multiplicity, and sparse-donor diagnostics
      excludes:
      - Cell-state abundance or compositional testing
      - Inferring or annotating cell states
      - Cell-level tests that treat cells as biological replicates
      prerequisites: []
      sampling_facets:
      - id: pseudobulk_design
        description: Independent-group, paired, and longitudinal donor designs sampled while
          the response remains within-state donor-level gene counts and evaluation remains
          gene-wise effect and error-control assessment.
      sample_tasks:
      - kind: entry
        instruction: Given fixed state labels, a donor-by-gene pseudobulk count matrix for
          one state, library-size factors, and two conditions, compute normalized donor summaries
          and the supplied gene-wise condition contrasts without using cells as replicates.
      - kind: representative
        instruction: Given fixed state labels, donor-level within-state gene counts, condition,
          pairing, batch, and library summaries, specify pseudobulk aggregation and filtering,
          fit replicate-aware gene-wise count contrasts with dispersion and covariates, control
          multiplicity, diagnose sparse states and influential donors, and report effect sizes
          with uncertainty.
    - kind: capability
      id: c34.expression.regulatory_regions
      parent_id: c34.expression
      name: Infer enriched regulatory regions
      outcome: Convert mapped regulatory-assay signal and controls into reproducible enriched
        genomic intervals, resolving boundaries and artifacts with replicate-aware uncertainty.
      includes:
      - Peak and enriched-interval detection
      - Treatment-to-control signal comparison
      - Replicate concordance, blacklist, and boundary diagnostics
      excludes:
      - Differential testing across conditions at fixed regions
      - Transcript abundance modeling
      - Read-alignment implementation
      prerequisites: []
      sampling_facets:
      - id: regulatory_assay
        description: Accessibility and occupancy assays sampled only where mapped signal and
          controls support the same enriched-interval and boundary-reliability contract.
      sample_tasks:
      - kind: entry
        instruction: Given treatment and input-control counts across genomic bins plus an
          enrichment rule, call the enriched interval and mark any boundary made uncertain
          by low depth.
      - kind: representative
        instruction: Given replicate mapped-signal tracks, matched controls, library-depth
          summaries, mappability and blacklist annotations, and alternative candidate intervals,
          call reproducible enriched regions, refine uncertain boundaries, and explain rejected
          regions and replicate conflicts.
    - kind: capability
      id: c34.expression.regulatory_differential
      parent_id: c34.expression
      name: Test differential regulatory signal
      outcome: Estimate condition effects on accessibility or occupancy at fixed genomic regions
        using replicated count or signal matrices, appropriate depth and covariate controls,
        and multiplicity-aware uncertainty.
      includes:
      - Differential accessibility or occupancy at supplied regions
      - Replicate-aware contrasts and normalization
      - Effect-size, artifact, and multiple-testing interpretation
      excludes:
      - Calling enriched regions or peak boundaries
      - Bulk transcript differential expression
      - De novo motif interpretation as the requested result
      prerequisites: []
      sampling_facets:
      - id: regulatory_design
        description: Paired, blocked, and factorial accessibility or occupancy comparisons
          sampled while fixed-region effect estimation and uncertainty remain the operation
          and contract.
      sample_tasks:
      - kind: entry
        instruction: Given a fixed peak-by-sample count matrix, library depths, replicate
          labels, and a treatment contrast, specify the normalization and model terms and
          identify the peaks meeting supplied effect and adjusted-significance rules.
      - kind: representative
        instruction: Given fixed regulatory regions, replicate count matrices for two conditions,
          sample covariates, control-region summaries, library depths, and candidate normalization
          diagnostics, estimate differential accessibility or occupancy, control multiplicity,
          identify technical artifacts and influential replicates, and report effect sizes
          with uncertainty.
    - kind: capability
      id: c34.expression.overrepresentation
      parent_id: c34.expression
      name: Evaluate gene-set over-representation
      outcome: Test a selected gene list for over-representation using the correct tested-gene
        universe, multiplicity control, and redundancy-aware interpretation.
      includes:
      - Contingency-table enrichment
      - Gene-universe selection
      - Redundant-term interpretation
      excludes:
      - Ranked-list enrichment
      - Producing the upstream differential results
      - Causal pathway claims from enrichment alone
      prerequisites: []
      sampling_facets:
      - id: knowledge_base_release
        description: Pathway and ontology collections with explicit versions, while statistical
          testing and qualified interpretation remain unchanged.
      sample_tasks:
      - kind: entry
        instruction: Given a selected-gene list, tested-gene universe, and membership counts
          for three pathways, compute the requested over-representation quantities and identify
          the pathway whose result changes under an incorrect whole-genome universe.
      - kind: representative
        instruction: Given a selected-gene list, the tested-gene universe, versioned pathway
          memberships, gene covariates, and overlapping significant terms, perform an appropriate
          over-representation analysis, control multiplicity, summarize nonredundant themes,
          and state selection-bias and causal limitations.
    - kind: capability
      id: c34.expression.ranked_enrichment
      parent_id: c34.expression
      name: Evaluate ranked-list gene-set enrichment
      outcome: Test versioned gene sets against a ranked molecular statistic, diagnose ranking
        and permutation choices, control multiplicity, and interpret leading-edge signal without
        causal overclaiming.
      includes:
      - Rank-based enrichment
      - Null and permutation choice
      - Leading-edge and redundant-term interpretation
      excludes:
      - Thresholded-list over-representation
      - Producing the upstream ranking
      - Causal pathway claims from enrichment alone
      prerequisites: []
      sampling_facets:
      - id: knowledge_base_release
        description: Pathway and ontology collections with explicit versions, while ranked
          testing and qualified interpretation remain unchanged.
      sample_tasks:
      - kind: entry
        instruction: Given a short ranked gene list, one gene set, and a supplied running-sum
          rule, calculate where the enrichment score reaches its maximum and list the leading-edge
          genes.
      - kind: representative
        instruction: Given a complete ranked differential statistic, sample size and pairing
          information, versioned overlapping gene sets, and results under gene-label and sample-label
          permutations, select the defensible null, control multiplicity, summarize leading-edge
          themes, and explain instability and causal limits.
    - kind: capability
      id: c34.expression.screens
      parent_id: c34.expression
      name: Analyze pooled functional-genomics screens
      outcome: Infer perturbation effects from pooled screen counts by modeling guide quality,
        library bottlenecks, replication, and gene-level aggregation.
      includes:
      - CRISPR or RNAi count screens
      - Guide-level QC and gene aggregation
      - Positive and negative selection effects
      excludes:
      - Single-cell clustering
      - Sorted-bin screens requiring multinomial or ordinal outcome modeling
      - Designing wet-lab perturbations
      - Calling DNA variants
      prerequisites: []
      sampling_facets:
      - id: selection_mode
        description: Positive-selection and dropout screens with pre/post guide counts, retaining
          the same count-to-effect, control-normalization, and gene-aggregation contract.
      sample_tasks:
      - kind: entry
        instruction: Given plasmid and endpoint counts for four guides targeting one gene
          plus non-targeting controls, identify depleted guides and flag a guide whose low
          plasmid count makes its effect unreliable.
      - kind: representative
        instruction: Given replicate guide-count tables before and after selection, guide
          annotations, essential-gene and non-targeting controls, and library-depth summaries,
          define QC, normalization, guide-level effect estimation, gene-level aggregation,
          and criteria for robust hits and discordant guides.
    - kind: group
      id: c34.population
      parent_id: null
      name: Population and evolutionary genomics
      scope: Computational inference about population structure, demographic history, natural
        selection, and evolutionary relationships from genomic variation.
      includes:
      - Population structure, demography, selection, and phylogenomic inference
      excludes:
      - Per-sample variant calling
      - Clinical interpretation
      - Orthology assignment alone
    - kind: capability
      id: c34.population.structure
      parent_id: c34.population
      name: Characterize population structure
      outcome: Estimate and interpret allele-frequency structure and ancestry components while
        diagnosing linkage, missingness, batch effects, and sampling imbalance.
      includes:
      - Frequency and heterozygosity summaries
      - PCA or ancestry-component interpretation
      - Stratification diagnostics
      excludes:
      - Kinship and pedigree inference
      - Individual clinical ancestry claims
      - Demographic model fitting
      prerequisites: []
      sampling_facets:
      - id: population_sampling
        description: Geographic, breeding, and case-control sampling designs, with the same
          population-structure inference and technical-bias diagnosis contract.
      sample_tasks:
      - kind: entry
        instruction: Given diploid genotype counts for three populations at two loci, compute
          alternate-allele frequencies and identify the locus with the largest frequency difference.
      - kind: representative
        instruction: Given genotype-QC summaries, sample metadata, PCA loadings, ancestry-component
          estimates, locus missingness, linkage summaries, and batch labels, characterize
          supported population structure, distinguish likely technical axes, and recommend
          a defensible structure-adjusted analysis set.
    - kind: capability
      id: c34.population.relatedness
      parent_id: c34.population
      name: Infer genetic relatedness and pedigree consistency
      outcome: Estimate pairwise relatedness from genotype sharing, distinguish expected relationship
        classes, and diagnose contamination, inbreeding, or pedigree inconsistencies.
      includes:
      - Kinship and identity-by-descent interpretation
      - Pedigree consistency
      - Sample identity and contamination signals
      excludes:
      - Population ancestry-component inference
      - Demographic history
      - Clinical relationship disclosure decisions
      prerequisites: []
      sampling_facets:
      - id: breeding_system
        description: Outbred, inbred, and managed populations sampled when expected genotype-sharing
          baselines are supplied and the relationship-inference contract is fixed.
      sample_tasks:
      - kind: entry
        instruction: Given pairwise kinship and identity-by-state summaries with supplied
          expected ranges, assign unrelated, second-degree, first-degree, or duplicate relationships.
      - kind: representative
        instruction: Given a declared pedigree, pairwise kinship and identity-by-descent estimates,
          heterozygosity, sex-marker checks, and contamination indicators, identify supported
          relationships, pedigree conflicts, sample swaps, and cases that remain ambiguous.
    - kind: capability
      id: c34.population.demography
      parent_id: c34.population
      name: Infer demographic history
      outcome: Compare explicit demographic models using genomic summary patterns or likelihood
        evidence and report identifiable events, parameter uncertainty, and confounding among
        histories.
      includes:
      - Population size change
      - Split and migration models
      - Model comparison and identifiability
      excludes:
      - Selection scans
      - Population structure description without historical modeling
      - Species-tree inference
      prerequisites: []
      sampling_facets:
      - id: demographic_model_family
        description: Size-change, split, and migration histories evaluated through the same
          explicit-model comparison and uncertainty contract.
      sample_tasks:
      - kind: entry
        instruction: Given observed and expected site-frequency-spectrum bins under constant-size
          and recent-bottleneck models, select the better-fitting model and identify the bin
          driving the choice.
      - kind: representative
        instruction: Given joint site-frequency spectra for two populations, uncertainty estimates,
          and fitted likelihoods for isolation, continuous migration, and secondary-contact
          models, compare the histories, report supported parameter ranges, and explain non-identifiability
          and linked-selection caveats.
    - kind: capability
      id: c34.population.selection
      parent_id: c34.population
      name: Detect and interpret genomic signatures of selection
      outcome: Combine frequency, diversity, differentiation, and haplotype evidence to identify
        candidate selection signals and distinguish them from demography, linkage, and technical
        artifacts.
      includes:
      - Sweep and balancing-selection statistics
      - Population differentiation
      - Null-model and confounder assessment
      excludes:
      - Demographic parameter estimation as the endpoint
      - Functional validation
      - Pathogenicity classification
      prerequisites: []
      sampling_facets:
      - id: selection_regime
        description: Recent sweeps, local adaptation, and balancing selection, retaining an
          evidence-integration and confounder-aware evaluation contract.
      sample_tasks:
      - kind: entry
        instruction: Given nucleotide diversity and differentiation in one candidate window
          and matched neutral windows, identify which statistic is unusually extreme and name
          one demographic confounder.
      - kind: representative
        instruction: Given genome-window tables of diversity, allele-frequency, haplotype,
          and differentiation statistics plus recombination, coverage, and demographic-null
          summaries, prioritize candidate selection regions, reconcile discordant signals,
          and state which alternative explanations remain.
    - kind: capability
      id: c34.population.phylogenomics
      parent_id: c34.population
      name: Infer and diagnose evolutionary trees from genomic data
      outcome: Choose genomic characters and evolutionary models, infer or compare phylogenetic
        relationships, and diagnose support conflict caused by gene-tree discordance, recombination,
        or sampling.
      includes:
      - Tree and model comparison
      - Branch-support interpretation
      - Gene-tree/species-tree discordance
      excludes:
      - Multiple alignment as the endpoint
      - Orthology assignment
      - Within-population demographic fitting
      prerequisites: []
      sampling_facets:
      - id: character_source
        description: Sequence loci and genome-wide characters sampled when model choice, support
          assessment, and conflict diagnosis remain the central operations.
      sample_tasks:
      - kind: entry
        instruction: Given three candidate unrooted trees and site-pattern counts under a
          supplied parsimony rule, select the best tree and identify tied support.
      - kind: representative
        instruction: Given per-locus gene trees, branch supports, missing-data rates, recombination
          flags, and two candidate species trees, assess the supported relationships, localize
          discordance, and distinguish incomplete lineage sorting, introgression, and technical
          error as testable alternatives.
    - kind: group
      id: c34.clinical
      parent_id: null
      name: Clinical genomics interpretation
      scope: Computational interpretation and analytical validation of clinical genomic evidence
        under explicit frameworks and release criteria.
      includes:
      - Germline and somatic interpretation, pharmacogenomics, and analytical validation of
        clinical-genomics pipelines
      excludes:
      - Variant calling and normalization
      - Population-genetic research inference
      - Unqualified medical recommendations
    - kind: capability
      id: c34.clinical.germline
      parent_id: c34.clinical
      name: Classify germline disease variants
      outcome: Apply a declared germline interpretation framework to integrate population,
        segregation, functional, computational, and phenotype evidence into a calibrated classification
        and case-specific explanation.
      includes:
      - Evidence-code selection and strength
      - Conflict resolution and uncertainty
      - Phenotype and inheritance consistency
      excludes:
      - Somatic oncology tiering
      - Calling the variant from reads
      - Inventing unavailable segregation or functional evidence
      prerequisites: []
      sampling_facets:
      - id: disease_context
        description: Mendelian disease areas and inheritance modes sampled while a single
          declared germline classification framework and output contract are held fixed.
      sample_tasks:
      - kind: entry
        instruction: Given a declared germline evidence framework and a variant with population
          frequency, segregation count, and one validated functional assay, assign only the
          supported evidence categories and identify missing evidence needed before classification.
      - kind: representative
        instruction: Given a patient phenotype and pedigree, a normalized germline variant,
          gene-disease validity, population frequencies, segregation, functional studies,
          computational evidence, and a declared classification framework, derive a calibrated
          classification, document conflicting evidence, and explain the result's case relevance
          and limitations.
    - kind: capability
      id: c34.clinical.somatic
      parent_id: c34.clinical
      name: Interpret somatic variants in cancer
      outcome: Integrate tumor context, variant evidence, clonality, biomarkers, therapies,
        and evidence levels under a declared oncology framework to produce a bounded clinical
        interpretation.
      includes:
      - Diagnostic, prognostic, and therapeutic evidence
      - Tumor-type and clonality context
      - Somatic evidence tiering
      excludes:
      - Germline pathogenicity classification
      - Variant calling
      - Treatment recommendation beyond the supplied evidence framework
      prerequisites: []
      sampling_facets:
      - id: tumor_context
        description: Tumor types and stages sampled as knowledge context while the declared
          somatic evidence framework and tiering contract stay fixed.
      sample_tasks:
      - kind: entry
        instruction: Given a declared somatic tiering framework, one tumor variant, tumor
          type, allele fraction, copy number, and two labeled evidence statements, assign
          the supported evidence level and flag a germline-origin concern.
      - kind: representative
        instruction: Given tumor type and stage, purity and copy-number context, somatic variants,
          clonality estimates, biomarker results, therapy and trial evidence with levels,
          and a declared oncology framework, prioritize and tier the findings, distinguish
          diagnostic, prognostic, and therapeutic relevance, and state limitations and germline
          follow-up triggers.
    - kind: capability
      id: c34.clinical.pipeline_validation
      parent_id: c34.clinical
      name: Validate clinical-genomics pipeline performance
      outcome: Evaluate a clinical-genomics analysis pipeline against declared truth or reference
        material by computing analytical performance, checking release gates overall and across
        relevant strata, and diagnosing discordance without making patient-level interpretations.
      includes:
      - Truth-set confusion matrices and analytical performance metrics
      - Stratified performance and prespecified release gates
      - Discordance analysis tied to depth, quality, variant class, or sample strata
      excludes:
      - Classifying an individual germline or somatic variant
      - Clinical treatment recommendations
      - Wet-lab validation protocol design
      prerequisites: []
      sampling_facets:
      - id: validation_stratum
        description: Variant classes, assay regions, quality bands, and population strata
          sampled while the contract remains truth-based analytical performance and prespecified
          gate evaluation.
      sample_tasks:
      - kind: entry
        instruction: Given truth and pipeline calls for a small validation set, compute TP,
          FP, TN, FN, sensitivity, specificity, and precision and evaluate supplied overall
          release thresholds.
      - kind: representative
        instruction: Given a truth-labeled validation cohort with pipeline calls, depth and
          quality, variant-class, assay-region, and population-stratum annotations, compute
          overall and stratified analytical performance, evaluate every prespecified release
          gate, audit discordances for systematic failure modes, and delimit conclusions unsupported
          by sparse strata.
    - kind: capability
      id: c34.clinical.pharmacogenomic_diplotypes
      parent_id: c34.clinical
      name: Resolve pharmacogene diplotypes and phenotypes
      outcome: Resolve genotype, phase, and copy-number evidence into supported pharmacogene
        alleles, diplotypes, and metabolizer or response phenotypes with explicit ambiguity.
      includes:
      - Star-allele or haplotype resolution
      - Copy-number and phase handling
      - Diplotype-to-phenotype mapping
      excludes:
      - Applying medication guidance
      - Somatic therapy tiering
      - Drug discovery property prediction
      prerequisites: []
      sampling_facets:
      - id: pharmacogene
        description: Different pharmacogenes sampled while versioned allele definitions, phase/copy-number
          resolution, and ambiguity reporting remain the stable contract.
      sample_tasks:
      - kind: entry
        instruction: Given phased variants, a supplied star-allele definition table, and diplotype-to-phenotype
          rules for one gene, assign compatible diplotypes and report ambiguity.
      - kind: representative
        instruction: Given phased and unphased pharmacogene variants, copy-number and structural
          calls, a versioned allele-definition table, and diplotype-to-phenotype rules, enumerate
          compatible diplotypes, exclude contradicted alleles, assign supported phenotypes,
          and report unresolved phase or copy-number ambiguity.
    - kind: capability
      id: c34.clinical.pharmacogenomic_guidance
      parent_id: c34.clinical
      name: Apply pharmacogenomic medication guidance
      outcome: Apply a declared, versioned pharmacogenomic guideline to a supplied phenotype
        and clinical context, communicating applicable medication implications, exceptions,
        and non-genetic limitations.
      includes:
      - Guideline lookup and scope
      - Phenotype- and indication-specific implications
      - Bounded clinical communication
      excludes:
      - Resolving the underlying diplotype
      - Somatic oncology tiering
      - Recommendations without a declared guideline and medication context
      prerequisites: []
      sampling_facets:
      - id: gene_drug_context
        description: Different gene-drug pairs sampled within one declared guideline system
          while rule application and bounded communication remain stable.
      sample_tasks:
      - kind: entry
        instruction: Given a pharmacogene phenotype, medication, indication, and a short versioned
          guideline table, identify the applicable recommendation row and list one stated
          exception.
      - kind: representative
        instruction: Given a patient's pharmacogene phenotype with uncertainty, medication
          and indication, age and organ-function context, interacting medicines, and a declared
          versioned prescribing guideline, summarize applicable options and exceptions, distinguish
          genetic from non-genetic considerations, and state when the guideline does not resolve
          the decision.
