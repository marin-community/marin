mochi-gb200-cw-us-east-08a:
  gpu_variant: GB200
  role_plan:
    colocate_all: false
    policy_num_nodes: 4
    policy_num_gpus_per_node: 4
    num_inference_engines: 1
    inference_engine_tensor_parallel_size: 1
    inference_engine_pipeline_parallel_size: 1
    inference_engine_data_parallel_size: 16
    inference_engine_expert_parallel_size: 16
    train_batch_size: 1
    policy_mini_batch_size: 1
    micro_train_batch_size_per_gpu: 1
    n_samples_per_prompt: 1
  execution:
    cluster: cw-us-east-08a
    cluster_config: lib/iris/config/cw-us-east-08a.yaml
    cpu: 120
    memory: 900GB
    disk: 2TB
    priority: production
    max_retries: 0
    target_cluster: cw-us-east-08a
    parent_cluster_config: lib/iris/config/marin.yaml
    coordinator_timeout_hours: 96
    job_timeout_seconds: 259200
    wandb_entity: marin-community
    required_env_vars:
    - DAYTONA_RL_API_KEY
    - DAYTONA_EVAL_API_KEY
    - DAYTONA_TARGET
    - MARIN_PREFIX
    - MARIN_TEMP_PREFIX
    container_profile: 4
  generator:
    vllm_attention_backend: FLASHINFER
    max_num_seqs: 128
    max_num_batched_tokens: 2048
    gpu_memory_utilization: 0.9
    enable_prefix_caching: false
    vllm_v1_disable_multiproc: false
  engine_init_kwargs:
    load_format: runai_streamer
    moe_backend: triton
    model_loader_extra_config:
      distributed: false
      concurrency: 4
      memory_limit: 8589934592
    compilation_config:
      mode: 3
      cudagraph_mode: PIECEWISE
      splitting_ops:
      - vllm::unified_attention_with_output
      - vllm::unified_kv_cache_update
      - vllm::grug_moe_short_conv
  cuda_allocator_config: expandable_segments:True
  nccl_env:
    NCCL_NET: IB
    NCCL_IB_DISABLE: '0'
    NCCL_IB_HCA: ibp
  nccl_buffer_size_bytes: 4194304
  model_manifest_filename: export-manifest.json
