# A trial eval policy for exercising the policy launcher: the closest approximation of the October 2026
# policy that main runs. Benchmarks own their prompts, thinking mode, repeats, output caps, metrics and any
# window they enforce; this file only chooses them and the settings each runs with. README.md lists the
# differences from October, and ../../README.md explains the format.
version: marin-2026-11-20-trial

# October served every candidate at this window.
default_context: 73728

# Model catalog keys, each with the largest context the model supports.
candidates:
  muse-glimmer-30b: {max_context: 131072}
  nvidia-nemotron-3.5-super-vl-120b-a12b-bf16: {max_context: 1048576}
  qwen3.6-35b-a3b: {max_context: 262144}

evaluations:
  # October's seed for the sampled benchmarks it seeded.
  - {benchmark: aime24, seed: &october_seed 42}
  - boolq
  - cruxeval
  # The Together GPT-OSS-120B judge; October's reported scores used a local MiniMax-M3 (see README.md).
  - {benchmark: financebench, judge: together}
  - gpqa-diamond
  # October ran the thinking-off chat variants of GSM8K and TriviaQA; pin them for every candidate.
  - {benchmark: gsm8k, label: gsm8k-0shot, num_fewshot: 0, prompt_format: chat}
  - humanevalplus
  - ifbench
  - math500
  - mbppplus
  - mmlu-pro
  - {benchmark: mrcr, protocol: 32k}
  - {benchmark: mrcr, protocol: 65k}
  - mrcr
  - {benchmark: nupa5k-loose, label: nupa}
  - {benchmark: olympiadbench, judge: together, seed: *october_seed}
  - piqa
  - {benchmark: triviaqa, label: triviaqa, prompt_format: chat}
  - truthfulqa
  - winogrande
  # Agent benchmarks, under the names and with the concurrency of October's Harbor runs. Daytona builds
  # TB2's, OT-TBLite's and SWE-bench's images without snapshots, which together would exceed the quota.
  - benchmark: terminal-bench-2.1
    label: tb2-recovery
    protocol: campaign-2026-09-25
    concurrency: 16
    task_machine: &declarative_builds {image_build: declarative}
  - benchmark: ot-tblite
    label: ot-tblite-recovery
    protocol: campaign-2026-09-25
    concurrency: 16
    task_machine: *declarative_builds
  - benchmark: swebench-verified
    label: swebench-verified
    protocol: mini-swe-agent
    concurrency: 16
    task_machine: *declarative_builds
  - {benchmark: ds-1000, label: ds-1000-local, protocol: terminus-2, concurrency: 32}
  - {benchmark: bfcl-parity, label: bfclparity-pi, protocol: pi, concurrency: 32}

# Not declared:
# - τ³-bench and SOTOPIA-hard: their Harbor agents were removed from main.
# - BixBench: its package grader asks a MiniMax-M3 judge served beside the candidate, which the policy
#   does not declare yet; it joins once the policy launcher can start a judge for one benchmark.
