# Granite 4.2 30B: dense model, 59 GB bf16, 128k native context. The template honors enable_thinking
# and defaults to thinking on. The model card names vLLM's built-in nemotron_v3 reasoning parser as
# compatible with its <think> format and qwen3_coder for tool calls.
name: granite-4.2-30b
location: ibm-granite/granite-4.2-30b
revision: 9e668ce1c538387ef24d3644e9b0606647762636
apply_chat_template: true
# Served TP4 on 4x H100: with every layer attending globally, TP2 left KV cache for about two sequences of the
# 131,072-token window, so agent episodes queued past their packages' wall-clock limits.
resource_hint:
  gpu:
    H100: 4
# Long reasoning at 131,072 tokens outlasts the default 30-minute request deadline on a loaded server; the reply cap,
# not the clock, should end a reply. Not part of the launch identity.
evaluation_request_timeout: 7200
serve:
  tensor_parallel_size: 4
  max_model_len: 131072
  reasoning_parser: nemotron_v3
  tool_call_parser: qwen3_coder
  vllm_extra_args:
  - --enable-prefix-caching
agent:
  agent_kwargs:
    thinking_format: chat-template
    extra_body: '{"chat_template_kwargs":{"enable_thinking":true}}'
