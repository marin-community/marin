name: qwen3-32b
location: Qwen/Qwen3-32B
apply_chat_template: true
serve:
  gpu_only: true
  fixed_gpu:
  - H100
  - 2
  tensor_parallel_size: 2
  max_model_len: 32768
  swap_space_gb: 32
  trust_remote_code: true
  tool_call_parser: hermes
  reasoning_parser: qwen3
  vllm_extra_args:
  - --enable-prefix-caching
  variants:
    gh200:
      tensor_parallel_size: 1
      max_model_len: 32768
      swap_space_gb: 32
      trust_remote_code: true
      vllm_extra_args:
      - --enable-prefix-caching
    gh200-65k:
      tensor_parallel_size: 1
      max_model_len: 32768
      swap_space_gb: 32
      trust_remote_code: true
      vllm_extra_args:
      - --enable-prefix-caching
agent:
  agent_kwargs:
    extra_body: '{"chat_template_kwargs":{"enable_thinking":true}}'
