# DeepSeek V4.1 Flash (1017): multimodal MoE with FP8 weights (510 GB) and engram n-gram memory,
# served text-only on the vLLM recipe's 8x H100 TP8 layout, which offloads the engram tables to host
# memory and bounds the prefill batch. The deepseek_v41 tokenizer mode renders DeepSeek's reference
# prompt encoding. The template honors enable_thinking and defaults to thinking at reasoning_effort high.
# Its 98.3 GB engram tensor defeats object-store streaming on H100: the streamer's per-rank host
# buffers exhaust host memory, and distributed loading stages the tensor on an 80 GB GPU. The weights
# are staged to local disk and loaded through the page cache, as in the vLLM recipe.
name: deepseek-v4.1-flash-1017
location: deepseek-ai/DeepSeek-V4.1-Flash-1017
revision: 08c8657f02291e11b6f6b63e0e16014f8e748518
apply_chat_template: true
resource_hint:
  gpu:
    H100: 8
  memory: 1600g
  disk: 700g
serve:
  tensor_parallel_size: 8
  max_model_len: 147456
  max_num_batched_tokens: 4096
  limit_mm_per_prompt: '{"image":0,"video":0}'
  object_store_load_mode: stage_local
  reasoning_parser: deepseek_v41
  tool_call_parser: deepseek_v41
  vllm_extra_args:
  - --enable-prefix-caching
  - --tokenizer-mode
  - deepseek_v41
  - --engram-config
  - '{"cpu_offload":true}'
agent:
  agent_kwargs:
    thinking_format: chat-template
    extra_body: '{"chat_template_kwargs":{"enable_thinking":true}}'
