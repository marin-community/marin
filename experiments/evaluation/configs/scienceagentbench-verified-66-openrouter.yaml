evaluations:
  scienceagentbench-verified-66-knowledge-off:
    benchmark: scienceagentbench-verified-66-knowledge-off
    protocol: pi
    run:
      concurrency: 1
      max_attempts_per_trial: 1
      limit: 1
      max_tokens: 16384
      task_machine:
        backend: daytona
        image_build: snapshot
        storage_mb: 10240
      judge:
        budget:
          max_calls: 3
          max_microdollars: 450000
          microdollars_per_call: 150000
        deployment: openrouter/deepinfra/fp8
        models:
          MiniMaxAI/MiniMax-M3-MXFP8: minimax/minimax-m3@deepinfra/fp8
        default_model: MiniMaxAI/MiniMax-M3-MXFP8
      judge_endpoint: https://openrouter.ai/api/v1
      judge_api_key:
        - env:OPENROUTER_API_KEY
