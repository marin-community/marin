# Harness ablation cell: deepswe x pi (eval-policy campaign, version harness-ablation-v1).
# Standard policy retry/error handling; dataset reference mirrors the policy suite.
n_concurrent_trials: 16
release_trial_payloads_in_memory: true
retry:
  max_retries: 10
  include_exceptions:
    - InternalServerError
    - APIConnectionError
    - APITimeoutError
    - ArtifactUploadTimeoutError
    - ArtifactWriterBacklogError
    - CancelledError
    - ContextManagementInfrastructureError
    - LLMRequestTimeoutError
    - SandboxBuildFailedError
    - TrialTimeoutError
  wait_multiplier: 2.0
  min_wait_sec: 1.0
  max_wait_sec: 60.0
environment:
  type: daytona
agents:
  - name: pi
datasets:
  - name: datacurve/deep-swe-1-1
    ref: v1.1
