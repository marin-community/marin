# Harness ablation cell for marin#9080: bfclparity x terminus2 (launched as harness-ablation-v1).
# Retry/error handling and dataset references match the suite configs in this directory.
n_concurrent_trials: 32
release_trial_payloads_in_memory: true
retry:
  max_retries: 10
  include_exceptions:
    - InternalServerError
    - APIConnectionError
    - APITimeoutError
    - ArtifactUploadTimeoutError
    - ArtifactWriterBacklogError
    - CancelledError
    - ContextManagementInfrastructureError
    - LLMRequestTimeoutError
    - SandboxBuildFailedError
    - TrialTimeoutError
    - AgentKilledBySignalError
    - VerifierTimeoutError
    - VerifierRuntimeError
  wait_multiplier: 2.0
  min_wait_sec: 1.0
  max_wait_sec: 60.0
environment:
  type: daytona
agents:
  - name: terminus-2
datasets:
  - name: bfcl_parity
    registry_url: https://raw.githubusercontent.com/marin-community/harbor/16ba28939eea7e7070bcd643be0de36f67b93806/registry.json
