# Harness ablation cell for marin#9080: deepswe x opencode (launched as harness-ablation-v1).
# Retry/error handling and dataset references match the suite configs in this directory.
n_concurrent_trials: 16
release_trial_payloads_in_memory: true
retry:
  max_retries: 10
  include_exceptions:
    - InternalServerError
    - APIConnectionError
    - APITimeoutError
    - ArtifactUploadTimeoutError
    - ArtifactWriterBacklogError
    - CancelledError
    - ContextManagementInfrastructureError
    - LLMRequestTimeoutError
    - SandboxBuildFailedError
    - TrialTimeoutError
    - AgentKilledBySignalError
    - VerifierTimeoutError
    - VerifierRuntimeError
  wait_multiplier: 2.0
  min_wait_sec: 1.0
  max_wait_sec: 60.0
environment:
  type: daytona
agents:
  - name: opencode
datasets:
  - name: datacurve/deep-swe-1-1
    ref: v1.1
