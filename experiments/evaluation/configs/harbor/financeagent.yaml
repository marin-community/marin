# STATUS: this policy does not run, and no suite selects it.
# Marin's Harbor trial driver rejects packages with a Compose file on Daytona, so every trial fails before
# the agent starts. The curated benchmark lowers all 50 packages, but its tools need SEC EDGAR and
# SerpAPI keys and it needs an OpenAI key for its judge; none is provisioned.
n_concurrent_trials: 16
retry:
  max_retries: 10
  include_categories: [infrastructure]
  include_exceptions:
    - InternalServerError
    - APIConnectionError
    - APITimeoutError
  exclude_exceptions: []
  wait_multiplier: 2.0
  min_wait_sec: 1.0
  max_wait_sec: 60.0
environment:
  type: daytona
agents:
  - name: terminus-2
datasets:
  - name: hf://DCAgent/financeagent_terminal
    ref: main
