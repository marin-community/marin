        storage_mb: 10240
      judge:
        budget:
          max_calls: 216
          max_microdollars: 6250000
          microdollars_per_call: 29000
        deployment: openrouter/venice/fp8
        models:
          qwen/qwen3-vl-235b-a22b-instruct: qwen/qwen3-vl-235b-a22b-instruct@venice/fp8
