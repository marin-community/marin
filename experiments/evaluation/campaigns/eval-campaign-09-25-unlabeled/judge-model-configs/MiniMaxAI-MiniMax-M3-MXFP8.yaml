name: minimax-m3-mxfp8-judge
location: MiniMaxAI/MiniMax-M3-MXFP8
revision: c5454eb03678d8710e54a4e0fc681b9f3b4a3dba
apply_chat_template: true
resource_hint:
  gpu:
    H100: 8
  cpu: 64
  memory: 512g
  disk: 600g
serve:
  tensor_parallel_size: 8
  max_model_len: 32768
  max_num_seqs: 16
  limit_mm_per_prompt: '{"image":0,"video":0}'
  reasoning_parser: minimax_m3
  # RunAI 0.16.1 does not retry a ranged GET after the AWS CRT low-throughput
  # monitor aborts it. MiniMax's 413 GiB load needs more than the 10s default.
  runai_streamer_s3_request_timeout_ms: 60000
  vllm_extra_args:
    - --block-size
    - '128'
    - --language-model-only
    - --enable-prefix-caching
    - --model-loader-extra-config
    - '{"distributed":true}'
