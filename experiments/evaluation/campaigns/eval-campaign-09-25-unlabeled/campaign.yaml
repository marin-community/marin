# Harbor adopts a model's native context window when it is below the benchmark
# limit. These values are policy inputs, not launcher defaults.
harbor_model_info:
  inclusionAI-Ling-lite-1.5:
    max_input_tokens: 32768
  open-athena-Snowball-67B-A2B-5.7T-Mixed-RLVR-Step38:
    max_input_tokens: 32768

# Reusable harness behavior. Benchmarks select a profile below; model-specific
# adjustments remain properties of the model within that harness.
harbor_harness_profiles:
  mini-swe-k2-tool-history:
    agent: mini-swe-agent
    model_kwargs:
      IFM-K2-Horizon-MoVA-36B-A4B:
        model_format: k2_horizon
  pi-65k-16k:
    agent: pi
    kwargs:
      compaction_reserve_tokens: 32768
    model_kwargs:
      inclusionAI-Ling-lite-1.5:
        compaction_reserve_tokens: 16384
      open-athena-Snowball-67B-A2B-5.7T-Mixed-RLVR-Step38:
        compaction_reserve_tokens: 16384
  tau3-pi-131k-32k:
    agent: acp
    model_kwargs:
      inclusionAI-Ling-lite-1.5:
        model_info:
          max_input_tokens: 32768
          max_output_tokens: 16384
      open-athena-Snowball-67B-A2B-5.7T-Mixed-RLVR-Step38:
        model_info:
          max_input_tokens: 32768
          max_output_tokens: 16384

harbor_eval_harness_profiles:
  bixbench-pi: pi-65k-16k
  tau3-pi: tau3-pi-131k-32k
  swebench-verified: mini-swe-k2-tool-history

