n_concurrent_trials: 16
n_attempts: 3
release_trial_payloads_in_memory: true
retry:
  max_retries: 10
  include_exceptions:
  - InternalServerError
  - APIConnectionError
  - APITimeoutError
  - ArtifactUploadTimeoutError
  - ArtifactWriterBacklogError
  - CancelledError
  - ContextManagementInfrastructureError
  - LLMRequestTimeoutError
  - SandboxBuildFailedError
  - ContainerRegistryThrottledError
  - AgentSetupTimeoutError
  - DaytonaSandboxStopError
  - DaytonaProcessError
  - TrialTimeoutError
  - ArtifactWriteTimeoutError
  - Tau3RuntimeInfrastructureError
  - Tau3TargetInfrastructureError
  - VerifierTimeoutError
  - VerifierRuntimeError
  - TmuxBatchProtocolError
  - TmuxSessionEndedError
  wait_multiplier: 2.0
  min_wait_sec: 1.0
  max_wait_sec: 60.0
  exclude_exceptions: []
environment:
  type: daytona
agents:
- name: terminus-2
  override_timeout_sec: 1800.0
  override_setup_timeout_sec: 360.0
  kwargs:
    thinking_format: chat-template
    model_info:
      max_input_tokens: 65536
      max_output_tokens: 16384
    llm_call_kwargs:
      max_tokens: 16384
    extra_body:
      chat_template_kwargs:
        enable_thinking: true
datasets:
- name: terminal-bench/terminal-bench-2-1
  ref: sha256:7d7bdc1cbedad549fc1140404bd4dc45e5fd0ea7c4186773687d177ad3a0699a
verifier:
  override_timeout_sec: 300
