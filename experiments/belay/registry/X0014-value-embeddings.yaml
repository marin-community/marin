id: X0014
slug: value-embeddings
name: Value embeddings on MLA layers
category: Embeddings and inputs
summary: Add a per-token embedding table to the MLA values, via a lambda or a sigmoid gate.
source: maintainer
status: done
first_batch: 1
tags:
- value-embeds
- mla
- embedding
- value embeddings
- lr
- value embeds
- kda
- gated
details:
- 'gated form: v = v + sigmoid(x W) * VE[token], one gate per head, W zero-init (gate 0.5 at init)'
- MLA layers only (KDA layers tested worse)
- tables on Adam at 1x Adam LR (0.3x did not carry to candidate 9)
- 'lambda form: v = l1*v + l2*VE[token], l1 init 1, l2 init 0'
knobs:
- value_embeds=gated
- value_embed_lr_mult
- kda_value_embeds=gated
- value_embeds=gated_lambda
