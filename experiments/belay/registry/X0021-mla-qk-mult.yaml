id: X0021
slug: mla-qk-mult
name: MLA logit scale (qk_mult)
category: Attention variants
summary: Multiply MLA attention logits by a fixed or learnable per-layer scalar.
source: maintainer
status: adopted
first_batch: 3
tags:
- mla
- qk-mult
- logit-scale
- learnable
- qk_mult
- logit scale
- temperature
details:
- learnable per-layer scalar on MLA logits, on Adam
- init 2.5 in the gate-2 recipe
- init 4 once q and k are RMS-normed (candidate 5)
- per-head scalar variant closed
knobs:
- qk_mult=2.5
- learnable_qk_mult=true
- qk_mult=4.0
