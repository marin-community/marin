id: X0009
slug: bigram-hash-table
name: Hashed bigram table as AttnRes source
category: Embeddings and inputs
summary: A hashed (prev, cur) token-pair embedding table read as an AttnRes source.
source: agent
status: removed
first_batch: 1
tags:
- bigram
- hash
- embedding
- attnres
- engram
- attnres source
- n-gram
- embed2
- memory
- attnres-source
- multi-head hashing
- table size
- hashed-embedding
- rule-a
details:
- 'key: hash of (previous, current) token pair'
- 'rows: 524,288 at d512 (rule A at scale: table params = 0.408 x other params)'
- 'width: full model width (512 at d512)'
- read as an extra AttnRes source, not added to the embedding
- 'table LR: 10x Adam LR'
- fp32 table backward kept (bf16 scatter was slower)
knobs:
- second_embed=true
- second_embed_bigram=true
- embed2_rows=524288
- embed2_lr_mult=10
- embed2_dim
- second_embed_mode
- embed2_ngram=3 (trigram keys)
- embed2_grad_fp32=false (bf16 backward)
- embed2_hash_heads
- --embed2-rows-frac 0.408
- --embed2-rows-frac
