id: X0173
slug: expert-specialization-study
name: Expert specialization study and seeding
category: MoE and routing
summary: Study models and router ties (to a token or class-centroid embedding) that characterize and seed what experts specialize
  in.
source: maintainer
status: done
first_batch: 110
tags:
- specialization
- routing-dump
- router-embed-tie
- top-1
- analysis
- router
- expert-tie
- centroid
- routing-dumps
- mutual-information
details:
- layer-0-only or every layer
- class centroid = mean embedding of the class
- optional release after 250 or 1000 steps
knobs:
- router_embed_tie=L:E:V
- router_bias_seed=L:E:V:b
- --routing-dump-steps
