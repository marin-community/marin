id: X0071
slug: weight-ema
name: Weight EMA over final steps with eval blend
category: Training dynamics and schedules
summary: Keep an EMA of weights over the last n steps and evaluate a blend of EMA and final weights.
source: maintainer
status: removed
first_batch: 30
tags:
- ema
- averaging
- blend
- eval-blend
- scale-aware
- eval
details:
- EMA beta 0.995 over the last 1000 steps (d512)
- eval blend a*EMA + (1-a)*final, a 0.5-0.75 (candidate 9)
- 'from 2026-10-01: one final eval on the pure EMA weights'
- 'scale rule tested: last 35% of steps, beta = 1 - 0.005*2817/steps'
knobs:
- --ema-beta 0.995
- --ema-last-steps 1000
- --ema-blend a
- --ema-beta
- --ema-last-steps
- --ema-blend 0.5
