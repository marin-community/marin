details:
- table + Adam state row-sharded over 8 GPUs
- psum becomes reduce-scatter
- 'row-sharded lookup: all-gather ids, local lookup, reduce-scatter rows; fp32 scatter-add backward'
- 'lookup opt-in: off at d512, on at d1024+'
