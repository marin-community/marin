id: X0002
slug: block-attnres
name: Block Attention Residuals (AttnRes)
category: Depth connections
summary: Every sublayer reads its input as a per-token softmax mix over the embedding and earlier block sums instead of a
  plain residual sum.
source: baseline
status: adopted
first_batch: 0
tags:
- attnres
- residual
- depth
- baseline
details:
- 'blocks: 8 (at d512/d768 every layer closes a block)'
- one learned pseudo-query per sublayer gate plus a final gate
- 'pseudo-query init: zeros (uniform mix at init)'
- 'keys: parameter-free (frozen) RMSNorm of each source'
- 'mix: softmax over sources, weighted sum of raw sources'
- 'query LR: 0.1x Adam LR (own Adam group attn_res_query)'
- block sums use raw sublayer outputs
