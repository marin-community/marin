id: X0020
slug: lr-schedule-shape
name: LR schedule shape
category: Training dynamics and schedules
summary: Change the LR decay shape (linear, cosine, WSD) or the final LR ratio.
source: maintainer
status: adopted
first_batch: 3
tags:
- schedule
- wsd
- cosine
- min-lr
- lr schedule
- min_lr_ratio
- decay
