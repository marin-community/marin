details:
- 'baseline: 1% warmup, linear decay to 0.05x peak'
- 'adopted (candidate 8): cosine decay for the Adam groups'
- MuonH keeps its own 1 - p^0.7 decay
- WSD and longer warmups lost
knobs:
- --opt-set min_lr_ratio
- min_lr_ratio
- lr_schedule=cosine
