summary: 'Try adding **spelling-normalised byte embeddings** to the input. Each token''s input embedding row gets a learned
  sum over the first 8 UTF-8 bytes of its surface string, one 256 x d table per byte position. Read the bytes after stripping
  leading spaces and lowercasing, so " The", "the" and "The" share every byte row. Add two small feature rows to keep what
  the normalisation removes: leading space…'
