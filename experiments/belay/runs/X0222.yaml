experiment: X0222
track: speedrun
runs:
  seed0:
    seed: 0
    variant: 'causal MoD: 80% of tokens routed at top-10, rest shared'
    flags:
    - --model-set
    - mod_routed_frac=0.8
  control:
    seed: 0
    variant: speedrun control
    control: true
launched:
  control: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --seed 0 --run-id
    belay-X0222-control --output-path tmp/ttl=30d/belay/runs/belay-X0222-control --submit --target-cluster cw-us-east-02a
    --priority batch
  seed0: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --model-set mod_routed_frac=0.8
    --seed 0 --run-id belay-X0222-seed0 --output-path tmp/ttl=30d/belay/runs/belay-X0222-seed0 --submit --target-cluster cw-us-east-02a
    --priority batch
