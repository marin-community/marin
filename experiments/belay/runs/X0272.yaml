experiment: X0272
track: speedrun
runs:
  seed0:
    seed: 0
    variant: X0250, row-AdamH token_embed at adam_lr / 3.65
    flags:
    - --opt-set
    - muonc_anneal_decay=0.2
    - --opt-set
    - muonc_anneal_adamc=12.5
    - --opt-set
    - adamc_adam_decay=0.3
    - --opt-set
    - muonc_anneal_embed_row_adamh=True
    - --opt-set
    - muonc_anneal_embed_row_adamh_lr_div=3.65
  control:
    seed: 0
    variant: speedrun control
    control: true
  seed0-t:
    seed: 0
    variant: X0250, row-AdamH token_embed at adam_lr / 3.65
    flags:
    - --opt-set
    - muonc_anneal_decay=0.2
    - --opt-set
    - muonc_anneal_adamc=12.5
    - --opt-set
    - adamc_adam_decay=0.3
    - --opt-set
    - muonc_anneal_embed_row_adamh=True
    - --opt-set
    - muonc_anneal_embed_row_adamh_lr_div=3.65
    - --num-steps
    - '3056'
    stage: time
launched:
  control: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --seed 0 --run-id
    belay-X0272-control --output-path tmp/ttl=30d/belay/runs/belay-X0272-control --submit --target-cluster cw-us-east-02a
    --priority interactive
  seed0: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --opt-set muonc_anneal_decay=0.2
    --opt-set muonc_anneal_adamc=12.5 --opt-set adamc_adam_decay=0.3 --opt-set muonc_anneal_embed_row_adamh=True --opt-set
    muonc_anneal_embed_row_adamh_lr_div=3.65 --seed 0 --run-id belay-X0272-seed0 --output-path tmp/ttl=30d/belay/runs/belay-X0272-seed0
    --submit --target-cluster cw-us-east-02a --priority interactive
  seed0-t: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --opt-set muonc_anneal_decay=0.2
    --opt-set muonc_anneal_adamc=12.5 --opt-set adamc_adam_decay=0.3 --opt-set muonc_anneal_embed_row_adamh=True --opt-set
    muonc_anneal_embed_row_adamh_lr_div=3.65 --num-steps 3056 --seed 0 --run-id belay-X0272-seed0-t --output-path tmp/ttl=30d/belay/runs/belay-X0272-seed0-t
    --submit --target-cluster cw-us-east-02a --priority interactive
