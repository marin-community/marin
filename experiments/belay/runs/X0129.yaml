experiment: X0129
track: speedrun
runs:
  seed0:
    seed: 0
    variant: num_experts_per_token=10
    flags:
    - --model-set
    - num_experts_per_token=10
  control:
    seed: 0
    variant: speedrun control
    control: true
    shared: belay-X0017-control
  probe:
    seed: 0
    variant: num_experts_per_token=10 (timing probe)
