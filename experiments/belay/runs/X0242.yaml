experiment: X0242
track: speedrun
runs:
  seed0:
    seed: 0
    variant: document n-gram count cache mixed into output
    flags:
    - --model-set
    - ngram_cache_mixture=true
  control:
    seed: 0
    variant: speedrun control
    control: true
launched:
  control: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --seed 0 --run-id
    belay-X0242-control --output-path tmp/ttl=30d/belay/runs/belay-X0242-control --submit --target-cluster cw-us-east-02a
    --priority batch
  seed0: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --model-set ngram_cache_mixture=true
    --seed 0 --run-id belay-X0242-seed0 --output-path tmp/ttl=30d/belay/runs/belay-X0242-seed0 --submit --target-cluster cw-us-east-02a
    --priority batch
