experiment: X0238
track: speedrun
runs:
  seed0:
    seed: 0
    variant: exact-match pointer mixture, 8 candidates
    flags:
    - --model-set
    - pointer_mixture=true
  control:
    seed: 0
    variant: speedrun control
    control: true
  probe:
    seed: 0
    variant: exact-match pointer mixture, 8 candidates (timing probe)
    flags:
    - --model-set
    - pointer_mixture=true
    - --num-steps
    - '150'
    stage: probe
  seed0-t:
    seed: 0
    variant: exact-match pointer mixture, 8 candidates
    flags:
    - --model-set
    - pointer_mixture=true
    - --num-steps
    - '2937'
    stage: time
launched:
  control: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --seed 0 --run-id
    belay-X0238-control --output-path tmp/ttl=30d/belay/runs/belay-X0238-control --submit --target-cluster cw-us-east-02a
    --priority batch
  seed0: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --model-set pointer_mixture=true
    --seed 0 --run-id belay-X0238-seed0 --output-path tmp/ttl=30d/belay/runs/belay-X0238-seed0 --submit --target-cluster cw-us-east-02a
    --priority batch
  probe: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --model-set pointer_mixture=true
    --num-steps 150 --seed 0 --run-id belay-X0238-probe --output-path tmp/ttl=30d/belay/runs/belay-X0238-probe --submit --target-cluster
    cw-us-east-02a --priority batch
