experiment: X0231
track: speedrun
runs:
  seed0:
    seed: 0
    variant: lm_head reads [h, g*rms_norm(hA*hB)], widened by d/4
    flags:
    - --model-set
    - lm_head_bilinear=true
  control:
    seed: 0
    variant: speedrun control
    control: true
launched:
  control: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --seed 0 --run-id
    belay-X0231-control --output-path tmp/ttl=30d/belay/runs/belay-X0231-control --submit --target-cluster cw-us-east-02a
    --priority batch
  seed0: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --model-set lm_head_bilinear=true
    --seed 0 --run-id belay-X0231-seed0 --output-path tmp/ttl=30d/belay/runs/belay-X0231-seed0 --submit --target-cluster cw-us-east-02a
    --priority batch
