experiment: X0260v1
track: speedrun
runs:
  seed0:
    seed: 0
    variant: 2+2 looped middle+2 layers, middle_loop=cross_x2
    flags:
    - --model-set
    - middle_loop=cross_x2
  control:
    seed: 0
    variant: speedrun control
    control: true
launched:
  control: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --seed 0 --run-id
    belay-X0260v1-control --output-path tmp/ttl=30d/belay/runs/belay-X0260v1-control --submit --target-cluster cw-us-east-02a
    --priority interactive
  seed0: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --model-set middle_loop=cross_x2
    --seed 0 --run-id belay-X0260v1-seed0 --output-path tmp/ttl=30d/belay/runs/belay-X0260v1-seed0 --submit --target-cluster
    cw-us-east-02a --priority interactive
