experiment: X0259
track: speedrun
runs:
  seed0:
    seed: 0
    variant: X0250 + matrix decay lambda((1-f)lr_m/lr_max+f), f=0.05
    flags:
    - --opt-set
    - muonc_anneal_decay=0.2
    - --opt-set
    - muonc_anneal_adamc=12.5
    - --opt-set
    - adamc_adam_decay=0.3
    - --opt-set
    - muonc_anneal_decay_floor_frac=0.05
  control:
    seed: 0
    variant: speedrun control
    control: true
launched:
  control: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --seed 0 --run-id
    belay-X0259-control --output-path tmp/ttl=30d/belay/runs/belay-X0259-control --submit --target-cluster cw-us-east-02a
    --priority interactive
  seed0: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --opt-set muonc_anneal_decay=0.2
    --opt-set muonc_anneal_adamc=12.5 --opt-set adamc_adam_decay=0.3 --opt-set muonc_anneal_decay_floor_frac=0.05 --seed 0
    --run-id belay-X0259-seed0 --output-path tmp/ttl=30d/belay/runs/belay-X0259-seed0 --submit --target-cluster cw-us-east-02a
    --priority interactive
