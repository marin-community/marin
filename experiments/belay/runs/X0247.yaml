experiment: X0247
track: speedrun
runs:
  seed0:
    seed: 0
    variant: MuonC lambda 0.2 + s(t)^2 head and late-matrix anneal
    flags:
    - --opt-set
    - muonc_anneal_decay=0.2
  control:
    seed: 0
    variant: speedrun control
    control: true
launched:
  control: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --seed 0 --run-id
    belay-X0247-control --output-path tmp/ttl=30d/belay/runs/belay-X0247-control --submit --target-cluster cw-us-east-02a
    --priority interactive
  seed0: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --opt-set muonc_anneal_decay=0.2
    --seed 0 --run-id belay-X0247-seed0 --output-path tmp/ttl=30d/belay/runs/belay-X0247-seed0 --submit --target-cluster cw-us-east-02a
    --priority interactive
