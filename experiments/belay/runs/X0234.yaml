experiment: X0234
track: speedrun
runs:
  seed0:
    seed: 0
    variant: 64-token softmax branch beside every KDA read
    flags:
    - --model-set
    - kda_local_attn_window=64
  control:
    seed: 0
    variant: speedrun control
    control: true
  probe:
    seed: 0
    variant: 64-token softmax branch beside every KDA read (timing probe)
    flags:
    - --model-set
    - kda_local_attn_window=64
    - --num-steps
    - '150'
    stage: probe
launched:
  control: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --seed 0 --run-id
    belay-X0234-control --output-path tmp/ttl=30d/belay/runs/belay-X0234-control --submit --target-cluster cw-us-east-02a
    --priority batch
  seed0: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --model-set kda_local_attn_window=64
    --seed 0 --run-id belay-X0234-seed0 --output-path tmp/ttl=30d/belay/runs/belay-X0234-seed0 --submit --target-cluster cw-us-east-02a
    --priority batch
