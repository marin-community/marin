experiment: X0014
track: speedrun
runs:
  seed0:
    seed: 0
    variant: gated value embeds on MLA, table LR 0.3x
    flags:
    - --opt-set
    - value_embed_lr_mult=0.3
    - --model-set
    - value_embeds=gated
  control:
    seed: 0
    variant: speedrun control
    control: true
launched:
  control: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --seed 0 --run-id
    belay-X0014-control --output-path tmp/ttl=30d/belay/runs/belay-X0014-control --submit --target-cluster cw-us-east-02a
    --priority batch
  seed0: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --opt-set value_embed_lr_mult=0.3
    --model-set value_embeds=gated --seed 0 --run-id belay-X0014-seed0 --output-path tmp/ttl=30d/belay/runs/belay-X0014-seed0
    --submit --target-cluster cw-us-east-02a --priority batch
