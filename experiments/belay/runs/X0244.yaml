experiment: X0244
track: speedrun
runs:
  seed0:
    seed: 0
    variant: MuonC, lambda = 25 * lr_max / 2
    flags:
    - --opt-set
    - muonc_decay_mult=12.5
  control:
    seed: 0
    variant: speedrun control
    control: true
  seed0-t:
    seed: 0
    variant: MuonC, lambda = 25 * lr_max / 2
    flags:
    - --opt-set
    - muonc_decay_mult=12.5
    - --num-steps
    - '3041'
    stage: time
launched:
  control: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --seed 0 --run-id
    belay-X0244-control --output-path tmp/ttl=30d/belay/runs/belay-X0244-control --submit --target-cluster cw-us-east-02a
    --priority interactive
  seed0: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --opt-set muonc_decay_mult=12.5
    --seed 0 --run-id belay-X0244-seed0 --output-path tmp/ttl=30d/belay/runs/belay-X0244-seed0 --submit --target-cluster cw-us-east-02a
    --priority interactive
