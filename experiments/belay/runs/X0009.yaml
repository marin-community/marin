experiment: X0009
track: speedrun
runs:
  seed0:
    seed: 0
    variant: 2M-row hashed bigram table as AttnRes source, LR x10
    flags:
    - --model-set
    - attn_res_bigram_rows=2097152
  control:
    seed: 0
    variant: speedrun control
    control: true
  probe:
    seed: 0
    variant: 2M-row hashed bigram table as AttnRes source, LR x10 (timing probe)
    flags:
    - --model-set
    - attn_res_bigram_rows=2097152
    - --num-steps
    - '150'
    stage: probe
launched:
  control: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --seed 0 --run-id
    belay-X0009-control --output-path tmp/ttl=30d/belay/runs/belay-X0009-control --submit --target-cluster cw-us-east-02a
    --priority batch
  seed0: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --model-set attn_res_bigram_rows=2097152
    --seed 0 --run-id belay-X0009-seed0 --output-path tmp/ttl=30d/belay/runs/belay-X0009-seed0 --submit --target-cluster cw-us-east-02a
    --priority batch
