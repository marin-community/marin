experiment: X0258
track: speedrun
runs:
  seed0:
    seed: 0
    variant: X0250 head/Adam decays + law-cap ball matrices (X0253)
    flags:
    - --opt-set
    - muonc_anneal_decay=0.2
    - --opt-set
    - muonc_anneal_adamc=12.5
    - --opt-set
    - adamc_adam_decay=0.3
    - --opt-set
    - muonc_anneal_law_cap_ball=true
  control:
    seed: 0
    variant: speedrun control
    control: true
  seed0-t:
    seed: 0
    variant: X0250 head/Adam decays + law-cap ball matrices (X0253)
    flags:
    - --opt-set
    - muonc_anneal_decay=0.2
    - --opt-set
    - muonc_anneal_adamc=12.5
    - --opt-set
    - adamc_adam_decay=0.3
    - --opt-set
    - muonc_anneal_law_cap_ball=true
    - --num-steps
    - '3040'
    stage: time
launched:
  control: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --seed 0 --run-id
    belay-X0258-control --output-path tmp/ttl=30d/belay/runs/belay-X0258-control --submit --target-cluster cw-us-east-02a
    --priority interactive
  seed0: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --opt-set muonc_anneal_decay=0.2
    --opt-set muonc_anneal_adamc=12.5 --opt-set adamc_adam_decay=0.3 --opt-set muonc_anneal_law_cap_ball=true --seed 0 --run-id
    belay-X0258-seed0 --output-path tmp/ttl=30d/belay/runs/belay-X0258-seed0 --submit --target-cluster cw-us-east-02a --priority
    interactive
  seed0-t: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --opt-set muonc_anneal_decay=0.2
    --opt-set muonc_anneal_adamc=12.5 --opt-set adamc_adam_decay=0.3 --opt-set muonc_anneal_law_cap_ball=true --num-steps
    3040 --seed 0 --run-id belay-X0258-seed0-t --output-path tmp/ttl=30d/belay/runs/belay-X0258-seed0-t --submit --target-cluster
    cw-us-east-02a --priority interactive
