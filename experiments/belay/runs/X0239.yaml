experiment: X0239
track: speedrun
runs:
  seed0:
    seed: 0
    variant: token_embed in its own Adam group at 4x adam_lr
    flags:
    - --opt-set
    - embed_lr_mult=4.0
  control:
    seed: 0
    variant: speedrun control
    control: true
launched:
  control: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --seed 0 --run-id
    belay-X0239-control --output-path tmp/ttl=30d/belay/runs/belay-X0239-control --submit --target-cluster cw-us-east-02a
    --priority batch
  seed0: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --opt-set embed_lr_mult=4.0
    --seed 0 --run-id belay-X0239-seed0 --output-path tmp/ttl=30d/belay/runs/belay-X0239-seed0 --submit --target-cluster cw-us-east-02a
    --priority batch
