    --priority batch
  seed0: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --model-set logit_soft_cap=10
    --seed 0 --run-id belay-X0073-seed0 --output-path tmp/ttl=30d/belay/runs/belay-X0073-seed0 --submit --target-cluster cw-us-east-02a
    --priority batch
