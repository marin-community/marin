experiment: X0226
track: speedrun
runs:
  seed0:
    seed: 0
    variant: space/case-normalised byte rows on input embeddings
    flags:
    - --model-set
    - spelling_byte_embeds=true
  control:
    seed: 0
    variant: speedrun control
    control: true
launched:
  control: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --seed 0 --run-id
    belay-X0226-control --output-path tmp/ttl=30d/belay/runs/belay-X0226-control --submit --target-cluster cw-us-east-02a
    --priority batch
  seed0: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --model-set spelling_byte_embeds=true
    --seed 0 --run-id belay-X0226-seed0 --output-path tmp/ttl=30d/belay/runs/belay-X0226-seed0 --submit --target-cluster cw-us-east-02a
    --priority batch
