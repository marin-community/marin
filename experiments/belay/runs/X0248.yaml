experiment: X0248
track: speedrun
runs:
  seed0:
    seed: 0
    variant: X0245 with router/embed AdamC decay 0.3
    flags:
    - --opt-set
    - muonc_decay_mult=12.5
    - --opt-set
    - adamc_head_router_embed=true
    - --opt-set
    - adamc_adam_decay=0.3
  control:
    seed: 0
    variant: speedrun control
    control: true
launched:
  control: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --seed 0 --run-id
    belay-X0248-control --output-path tmp/ttl=30d/belay/runs/belay-X0248-control --submit --target-cluster cw-us-east-02a
    --priority interactive
  seed0: uv run python -m experiments.grug.fast_track.belay_s7 --ladder s7n --size d512 --num-steps 3030 --opt-set muonc_decay_mult=12.5
    --opt-set adamc_head_router_embed=true --opt-set adamc_adam_decay=0.3 --seed 0 --run-id belay-X0248-seed0 --output-path
    tmp/ttl=30d/belay/runs/belay-X0248-seed0 --submit --target-cluster cw-us-east-02a --priority interactive
