tasks: [OlympiadBench]
task_options:
  OlympiadBench:
    num_fewshot: 0
    task_alias: olympiadbench
    generation: true
# No max_tokens: the generation budget comes from the served context (Evalchemy derives it for its own
# benchmarks; Marin sizes lm-eval-native tasks) or from the model config's generation.max_gen_toks.
runtime_extras: [olympiadbench]
seed: 42
gen_kwargs: do_sample=true,temperature=0.7
chat_template_kwargs:
  enable_thinking: true
judge:
  base_url: https://api.together.xyz/v1
  model: openai/gpt-oss-120b
  api_key:
    - env:TOGETHER_API_KEY
    - gcp-secret://projects/hai-gcp-models/secrets/TOGETHER_API_KEY/versions/latest
