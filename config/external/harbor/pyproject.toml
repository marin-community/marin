[project]
name = "marin-external-harbor"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "harbor[daytona]",
    # LiteLLM imports this at module initialization but does not declare it.
    "pydantic-settings",
]

[tool.uv]
package = false
prerelease = "allow"

[tool.uv.sources]
harbor = { git = "https://github.com/harbor-framework/harbor.git", branch = "main" }
