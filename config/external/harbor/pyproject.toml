[project]
name = "marin-external-harbor"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "daytona==0.200.2",
    "gcsfs",
    "harbor[archive,tau3]",
    # LiteLLM imports this at module initialization but does not declare it.
    "pydantic-settings",
    "s3fs",
]

[tool.uv]
package = false
prerelease = "allow"

[tool.uv.sources]
# The exact campaign revision is retained in uv.lock and advanced deliberately.
harbor = { git = "https://github.com/marin-community/harbor.git", rev = "2666d6526477ae3e46030a8dc4f3f2c68fd7a84f" }
