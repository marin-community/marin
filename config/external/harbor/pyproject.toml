[project]
name = "marin-external-harbor"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "daytona==0.200.2",
    "gcsfs",
    "harbor[archive]",
    "marin-rigging>=0.2.0",
    # LiteLLM imports this at module initialization but does not declare it.
    "pydantic-settings",
    "s3fs",
]

[tool.uv]
package = false
prerelease = "allow"

[tool.uv.sources]
# The isolated lock keeps the selected campaign revision immutable.
harbor = { git = "https://github.com/marin-community/harbor.git", branch = "bfcl-rl/campaign-20261003" }
