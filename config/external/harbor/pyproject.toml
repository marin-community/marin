[project]
name = "marin-external-harbor"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "daytona==0.200.2",
    "gcsfs",
    "harbor",
    # LiteLLM imports this at module initialization but does not declare it.
    "pydantic-settings",
    "s3fs",
]

[tool.uv]
package = false
prerelease = "allow"

[tool.uv.sources]
# The refresh PR returns this to main after an admin promotes the staged SHA.
harbor = { git = "https://github.com/marin-community/harbor.git", branch = "main-next" }
