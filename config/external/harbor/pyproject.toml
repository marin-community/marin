[project]
name = "marin-external-harbor"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "daytona==0.200.2",
    "gcsfs",
    "harbor-tau3-bench-adapter",
    "harbor[archive]",
    # LiteLLM imports this at module initialization but does not declare it.
    "pydantic-settings",
    "s3fs",
]

[tool.uv]
package = false
prerelease = "allow"

[tool.uv.sources]
# Keep this branch-based: uv.lock pins the runtime commit, and the external dependency updater advances it.
harbor = { git = "https://github.com/marin-community/harbor.git", branch = "main" }
harbor-tau3-bench-adapter = { git = "https://github.com/marin-community/harbor.git", subdirectory = "adapters/tau3-bench", rev = "1d5bcbf377b0c46a53bb7400f3b4143fc4f04b2c" }
