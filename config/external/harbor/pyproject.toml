[project]
name = "marin-external-harbor"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "daytona==0.200.2",
    "gcsfs",
    "harbor[archive,tau3]",
    "marin-rigging>=0.2.0",
    # LiteLLM imports this at module initialization but does not declare it.
    "pydantic-settings",
    "s3fs",
]

[tool.uv]
package = false
prerelease = "allow"

[tool.uv.sources]
# The exact campaign revision is retained in uv.lock and advanced deliberately.
harbor = { git = "https://github.com/marin-community/harbor.git", rev = "a2adfd7e60c41be528c93f3c4672f8e2a9a0e770" }
