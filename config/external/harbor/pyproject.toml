[project]
name = "marin-external-harbor"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "daytona==0.200.2",
    "gcsfs",
    "harbor[archive]",
    "marin-rigging>=0.2.0",
    # LiteLLM imports this at module initialization but does not declare it.
    "pydantic-settings",
    "s3fs",
]

[tool.uv]
package = false
prerelease = "allow"

[tool.uv.sources]
# Keep the artifact capture fix on the existing runtime baseline.
harbor = { git = "https://github.com/marin-community/harbor.git", rev = "ca32a7c0367b1f973cae80835ab497f495e580b5" }
