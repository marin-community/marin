[project]
name = "marin-external-harbor"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "daytona==0.200.2",
    "gcsfs",
    "harbor[archive]",
    # LiteLLM imports this at module initialization but does not declare it.
    "pydantic-settings",
    "s3fs",
]

[tool.uv]
package = false
prerelease = "allow"

[tool.uv.sources]
# Pin the trajectory-archive fix until marin-community/harbor#210 merges to main.
harbor = { git = "https://github.com/marin-community/harbor.git", rev = "e9b1fa58b2857a0619506a9bbffbd27b3dc5a730" }
