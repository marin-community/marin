[project]
name = "marin-external-harbor"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "daytona==0.200.2",
    "gcsfs",
    "harbor[archive]",
    # LiteLLM imports this at module initialization but does not declare it.
    "pydantic-settings",
    "s3fs",
]

[tool.uv]
package = false
prerelease = "allow"

[tool.uv.sources]
# Keep this branch-based: uv.lock pins the runtime commit, and the external dependency updater advances it.
# The catch-up stays on main-next until an administrator promotes the validated SHA to protected main.
harbor = { git = "https://github.com/marin-community/harbor.git", branch = "main-next" }
