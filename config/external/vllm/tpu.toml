# Marin's forked TPU vLLM stack (vllm + tpu-inference). These run from an isolated uvx env
# (marin.inference.vllm_server.IsolatedTpuVllm), not the workspace lock, and are surfaced as
# VLLM_FORK_REQUIREMENT / TPU_INFERENCE_FORK_REQUIREMENT in marin.external_dependencies by
# config/update-external.py. Refresh these SHAs via .agents/skills/refresh-fork/SKILL.md;
# `upstream_base` is the upstream commit each fork tip is compared against.

[vllm]
repository = "https://github.com/marin-community/vllm.git"
commit = "8e7e42aae3af8433e08012a2b6b0b141530e1e26"
upstream_base = "d626108b1841888ec90aced33367149a6bbc7e4b"

[tpu-inference]
