[project]
name = "marin-external-marinskyrl"
version = "0"
requires-python = "==3.12.*"
dependencies = ["marinskyrl"]

[tool.uv]
package = false
prerelease = "allow"
required-environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
# The isolated lock keeps the selected branch revision immutable.
marinskyrl = { git = "https://github.com/marin-community/MarinSkyRL.git", rev = "e2b235cbd66abd6a41b781794392507379df8f77" }
