[project]
name = "marin-external-marinskyrl"
version = "0"
requires-python = "==3.12.*"
dependencies = ["marinskyrl"]

[tool.uv]
package = false
prerelease = "allow"
required-environments = ["sys_platform == 'linux'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Select the published wheel. SkyRL metrics use Rigging's Prometheus extra.
override-dependencies = ["marin-rigging[secrets,prometheus]>=0.2.144.dev37540375919"]

[tool.uv.sources]
marinskyrl = { git = "https://github.com/marin-community/MarinSkyRL.git", rev = "b6326736d013b598dbfd8032d6d16824a5cac65f" }
