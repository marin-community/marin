[project]
name = "marin-external-marinskyrl"
version = "0"
requires-python = "==3.12.*"
dependencies = ["marinskyrl @ git+https://github.com/marin-community/MarinSkyRL.git@main"]

[tool.uv]
package = false
prerelease = "allow"
required-environments = ["sys_platform == 'linux'"]
# Only the CPU launcher is installed here. Ignore transitive workspace source
# mappings so the pinned Marin Git packages retain their published marin-* requirements.
no-sources = true
