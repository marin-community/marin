[project]
name = "marin-external-marinskyrl"
version = "0"
requires-python = "==3.12.*"
dependencies = ["marinskyrl"]

[tool.uv]
package = false
prerelease = "allow"
required-environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
# The isolated lock selects an immutable runtime revision.
marinskyrl = { git = "https://github.com/marin-community/MarinSkyRL.git", rev = "1f130218e56590075363d59cd94fb97c292d65e0" }
