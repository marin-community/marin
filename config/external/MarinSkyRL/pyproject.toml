[project]
name = "marin-external-marinskyrl"
version = "0"
requires-python = "==3.12.*"
dependencies = ["marinskyrl"]

[tool.uv]
package = false
prerelease = "allow"
required-environments = ["sys_platform == 'linux'"]
# Marin Git workspace rigging is 0.2.0; TaskCompendium needs a newer published release.
override-dependencies = ["marin-rigging[secrets]>=0.2.139.dev37117265303"]

[tool.uv.sources]
# Keep the artifact capture fix on the existing runtime baseline.
marinskyrl = { git = "https://github.com/marin-community/MarinSkyRL.git", rev = "eb37093eda9ee02e187c3ab26954bdb56f613446" }
