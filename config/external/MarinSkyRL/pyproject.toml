[project]
name = "marin-external-marinskyrl"
version = "0"
requires-python = "==3.12.*"
dependencies = ["marinskyrl"]

[tool.uv]
package = false
prerelease = "allow"
required-environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
# The isolated lock selects an immutable runtime revision.
marinskyrl = { git = "https://github.com/marin-community/MarinSkyRL.git", rev = "0604953c0cc2cd872997cce5453873728a85ccd0" }
