[project]
name = "marin-external-marinskyrl"
version = "0"
requires-python = "==3.12.*"
dependencies = ["marinskyrl"]

[tool.uv]
package = false
prerelease = "allow"
required-environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
# The isolated lock selects an immutable runtime revision.
marinskyrl = { git = "https://github.com/marin-community/MarinSkyRL.git", rev = "bf014cb8a41c0b3abeac20f20eab2908b78ae8fa" }
