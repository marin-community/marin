[project]
name = "marin-external-marinskyrl"
version = "0"
requires-python = "==3.12.*"
dependencies = ["marinskyrl"]

[tool.uv]
package = false
prerelease = "allow"
required-environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
# The isolated lock selects an immutable runtime revision.
marinskyrl = { git = "https://github.com/marin-community/MarinSkyRL.git", rev = "7c8e3bdbdd321b467eaca48988d9f55d3ef03673" }
