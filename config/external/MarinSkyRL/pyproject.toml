[project]
name = "marin-external-marinskyrl"
version = "0"
requires-python = "==3.12.*"
dependencies = ["marinskyrl"]

[tool.uv]
package = false
prerelease = "allow"
required-environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
# The isolated lock selects an immutable runtime revision.
marinskyrl = { git = "https://github.com/marin-community/MarinSkyRL.git", rev = "018f7f8475a4e34a05bf48156e79f5a5a5df3c80" }
