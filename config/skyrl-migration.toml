patches = ["skyrl-migration/local-changes.patch"]
# Source roots are separate from Marin's workspace and dependency resolution.
roots = [
    "cloud.iris.launch",
    "skyrl_train.entrypoints.main_base",
    "skyrl_train.entrypoints.main_generate",
    "skyrl_train.entrypoints.taskcompendium",
    "skyrl_train.entrypoints.terminal_bench",
    "skyrl_train.entrypoints.terminal_bench_generate",
    "skyrl_train.entrypoints.checkpoint_export",
    "skyrl_train.inline_harbor",
]
discard = ["skyrl-tx/**", "docs/**", "skyrl-train/docs/**", "skyrl-train/integrations/**"]

[[packages]]
directory = "marinskyrl"
import_root = "."
[[packages]]
directory = "cloud"
import_root = "."
[[packages]]
directory = "infra"
import_root = "."
[[packages]]
directory = "skyrl-train/skyrl_train"
import_root = "skyrl-train"
[[packages]]
directory = "skyrl-train/tests"
import_root = "skyrl-train"
[[packages]]
directory = "skyrl-train/ci"
import_root = "skyrl-train"
[[packages]]
directory = "skyrl-train/examples/cat_count"
import_root = "skyrl-train"
[[packages]]
directory = "skyrl-gym/skyrl_gym"
import_root = "skyrl-gym"

[[keep]]
glob = "LICENSE"
reason = "Apache-2.0 license for retained source"
[[keep]]
glob = "pyproject.toml"
reason = "independently built marinskyrl wheel and GPU dependency profiles"
[[keep]]
glob = "uv.lock"
reason = "independent frozen runtime; never merged into Marin's lock"
[[keep]]
glob = "open_mopd_versions.py"
reason = "Open-MOPD task and image preflights import this root-level helper"
[[keep]]
glob = "cloud/iris/configs/open_mopd_*.json"
reason = "default manifests loaded by the retained Open-MOPD fidelity and evaluation commands"
[[keep]]
glob = "cloud/iris/configs/qwen_megatron_smoke.yaml"
reason = "Megatron launch recipe exercised by the retained launch-config acceptance tests"
[[keep]]
glob = "cloud/iris/configs/snowball_mopd_ultra*_smoke.yaml"
reason = "inherited synchronous and asynchronous OPD launch acceptance recipes"
[[keep]]
glob = "cloud/iris/configs/snowball_mopd_ultra_32k.yaml"
reason = "base recipe for the retained asynchronous 32K OPD acceptance config"
[[keep]]
glob = "cloud/iris/runtime_bundle_files.txt"
reason = "launcher bundle inventory"
[[keep]]
glob = "cloud/iris/bootstrap_runtime.sh"
reason = "frozen GPU setup for the independently locked bundled source"
[[keep]]
glob = "chat_templates/**"
reason = "templates loaded by path and included in the wheel"
[[keep]]
glob = "skyrl-train/skyrl_train/config/**"
reason = "Hydra composition loads config assets without Python imports"
[[keep]]
glob = "skyrl-gym/skyrl_gym/envs/nemotron_ultra/abstention_prompt.txt"
reason = "Nemotron abstention graders read the packaged judge prompt"
[[keep]]
glob = "skyrl-gym/skyrl_gym/envs/nemotron_ultra/jailbreak_verifiers.yaml"
reason = "Nemotron policy graders load verifier prompts and reward combinations"
[[keep]]
glob = "skyrl-train/skyrl_train/models/**"
reason = "Grug and Qwen model registration for supported Megatron/vLLM runs"
[[keep]]
glob = "skyrl-train/examples/gsm8k/gsm8k_dataset.py"
reason = "GSM8K input preparation for the OPD nightly"
[[keep]]
glob = "skyrl-train/ci/marin_nightly/**"
reason = "current OPD, Grug/Megatron, CatCount runners and metric gates"
[[keep]]
glob = "skyrl-train/tests/gpu/test_grug_megatron.py"
reason = "nightly Grug training and serving gate"
[[keep]]
glob = "skyrl-train/tests/gpu/test_grug_levanter_parity.py"
reason = "nightly Grug numerical parity gate"
[[keep]]
glob = "skyrl-train/tests/gpu/test_megatron_worker.py"
reason = "nightly CP2 FlashAttention forward/backward gate"
[[keep]]
glob = "skyrl-train/tests/cpu/test_cat_count_cpu_canary.py"
reason = "CPU learning and resume acceptance"
[[keep]]
glob = "skyrl-train/tests/cpu/test_marin_nightly_gate.py"
reason = "nightly metric gate correctness"
[[keep]]
glob = "skyrl-train/tests/cpu/test_checkpoint_exporter.py"
reason = "retained checkpoint-export behavior"
[[keep]]
glob = "skyrl-train/tests/cpu/test_inline_harbor.py"
reason = "Harbor subprocess isolation and validation score accounting"
[[keep]]
glob = "skyrl-train/tests/cpu/test_prefill.py"
