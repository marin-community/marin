iris: coreweave
data:
  scheme: s3
  # S3-compatible storage for the CoreWeave clusters. `store` selects the backend
  # (endpoint/addressing/credentials); CoreWeave AI Object Storage buckets also
  # carry their `signing_region`. Consumed by rigging temp-path routing and the
  # shared infra/buckets Pulumi project.
  region_buckets:
    rno2a: { bucket: marin-rno2a, store: coreweave, signing_region: RNO2A }
    us-east-02a: { bucket: marin-us-east-02a, store: coreweave, signing_region: US-EAST-02A }
    us-east-08a: { bucket: hero-checkpoints, store: coreweave, signing_region: US-EAST-08A }
    us-west-04a: { bucket: marin-us-west-04a, store: coreweave, signing_region: US-WEST-04A }
  # How to reach each S3-compatible backend. `endpoint` is the account-level endpoint
  # reachable from outside the cluster; `*_env` name the environment variables that
  # override it and carry the keys. A CoreWeave pod's endpoint variable holds its
  # node-local LOTA endpoint instead, set by the Iris controller.
  stores:
    coreweave:
      endpoint: https://cwobject.com
      endpoint_env: CW_S3_ENDPOINT
      key_id_env: CW_KEY_ID
      key_secret_env: CW_KEY_SECRET
      temp_bucket: { bucket: marin-us-east-08a, store: coreweave, signing_region: US-EAST-08A }
      checkpoint_read_buckets: [hero-checkpoints]
  root: s3://marin-us-east-02a/marin
