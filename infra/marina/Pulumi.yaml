name: marin-marina
backend:
  url: gs://marin-iac-state/
runtime:
  name: python
  # Pin the shared repo venv (which has the `iac` helper package and the Pulumi providers
  # via marin-iac[deploy]). Without this, Pulumi's Auto toolchain would build an isolated
  # venv with no Pulumi SDK.
  options:
    virtualenv: ../../.venv
description: Marina, the IAP-gated Cloud Run service hosting Marin's small web apps.
# Pulumi.marin-marina.yaml records the production stack's shared GCP KMS provider.
