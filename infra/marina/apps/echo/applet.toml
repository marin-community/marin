applet_id = "7082d9d8-6c10-4a6f-b544-c8cb825034f2"
source_paths = ["infra/marina/web"]

name = "echo"
python_entrypoint = "app:create_api"
# Marin's shared agent-context store: GitHub and Discord activity, the indexed heads of
# the Marin-community repositories, and the durable wiki agents write to. The page talks
# only to its own API under /echo/api/, which searches Postgres and reranks on the CPU.
title = "Echo"
description = "Search Marin’s wiki, repository files, pull requests, issues, and Discord. Find prior decisions and follow the sources behind them."
connect_src = []
build_command = "cd web && npm ci && npm run build"

[[jobs]]
name = "sync"
runner = "hourly"
module = "sync.main"
timeout = 7200
secrets = ["MARINMIRROR_TOKEN"]
