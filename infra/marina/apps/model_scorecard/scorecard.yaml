# Source of truth for the Model Scorecard: rows, columns and the run behind every cell.
# Edit this file, regenerate scorecard.json with build_data.py, and release (see README.md).
#
# Each cell takes one of:
#   {run_id: <eval run ID>, label: official|unofficial}   score read from the run's record.json
#   {source: <s3:// URI>, score: <0-100>, label: ...}      a result that is not an eval run, e.g. a regrade
#   {missing: <reason>}                                    no score yet
# A scored cell may add `note: <text>` for context, or `suspect: <reason>` when a known grading or
# protocol problem means the score may not reflect the model. An agentic cell may add
# `trials: {attempted, scored, timeouts}` from its Harbor trials; agent timeouts score 0 and
# infrastructure failures are unscored. Evals without a cell render as missing with no reason.
#
# A model is a Hugging Face `hf_repo` with a `revision`, or an unreleased checkpoint's object-store
# `location`; every run in its row must evaluate exactly that.
# Unofficial: run outside the eval-policy pin (#10197), from Marin main or a branch ahead of it.

evals:
  - math500
  - humanevalplus
  - mbppplus
  - olympiadbench
  - gsm8k-0shot
  - piqa
  - winogrande
  - boolq
  - truthfulqa
  - triviaqa
  - aime24
  - mmlu-pro
  - gpqa-diamond
  - cruxeval
  - financebench
  - ifbench
  - mrcr
  - nupa
  - ds-1000-local
  - ot-tblite-recovery
  - tb2-recovery
  - swebench-verified

