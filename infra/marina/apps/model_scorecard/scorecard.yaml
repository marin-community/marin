# Source of truth for the Model Scorecard: rows, columns and the run behind every cell.
# Edit this file, regenerate scorecard.json with build_data.py, and release (see README.md).
#
# Each cell takes one of:
#   {run_id: <eval run ID>, label: official|unofficial}   score read from the run's record.json
#   {source: <s3:// URI>, score: <0-100>, label: ...}      a result that is not an eval run, e.g. a regrade
#   {missing: <reason>}                                    no score yet
# Any cell may add `note: <text>`. Evals without a cell render as missing with no reason.
# Unofficial: run from Marin main, outside the eval-policy pin (#10197).

evals:
  - math500
  - humanevalplus
  - mbppplus
  - olympiadbench
  - gsm8k-0shot
