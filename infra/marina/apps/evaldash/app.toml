# The eval-results dashboard: one row per model, one column per benchmark, and the run
# log behind every cell. Records are read from object storage into this app's own
# Postgres schema; the page fetches everything from /evaldash/api/.
title = "EvalDash"
description = "Every Marin eval run: the benchmark panel, the runs behind it, and the graded samples behind those."
connect_src = []
build_command = "cd web && npm ci && npm run build"

[[jobs]]
name = "ingest"
runner = "evaldash"
schedule = "*/10 * * * *"
command = ["python", "-m", "evaldash.ingest"]
timeout = 1800
cpu = 1
memory_gib = 1
secrets = ["CW_KEY_ID", "CW_KEY_SECRET"]
