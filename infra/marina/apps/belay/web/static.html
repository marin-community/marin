  <section id="gates">
    <div class="sec-head">
      <h2>Gates</h2>
      <p class="lede">Mental model for how ideas can get promoted to the next Marin Hero run. Each gate is a soft blocker; skip ahead as appropriate. Recommend externally validated ideas start on gate 2. In a field this empirical, a failed gate never proves an idea doesn't work, only that it didn't work in that context, so revisiting how a past idea was implemented can be worthwhile.</p>
    </div>
    <ol class="gates">
      <li class="gate"><span class="gn">1</span><h3>Beat vanilla transformer</h3>
        <p>Find signs of life by beating a vanilla transformer along one axis (memory, data efficiency, compute efficiency, kv_cache, long context). The intent here is to screen out dead-ends and give signal on how much persistence should be applied during gate 2. Evaluate ideas in their preferred context to give them their best shot. Most research papers don't evaluate beyond this gate.</p></li>
      <li class="gate"><span class="gn">2</span><h3>Integrate into 8-min speedrun</h3>
        <p>Integrate the idea into the competitive stack and test it in the 8-minute speedrun. In general, ideas should build on the latest accepted record that has cleared gates 3 and 4. Decide whether it replaces, adds to, or adapts existing features, and which optimizer and schedule its new parameters use. The goal is not to Goodhart the speedrun or necessarily set a record, but to show the idea integrates cleanly with the existing stack and holds promise in some area.</p></li>
      <li class="gate"><span class="gn">3</span><h3>Validate hero scale MFU</h3>
        <p>Measure MFU at hero scale on a single GB200 rack. This enables conversion from 300k GB200-hours (2.7e24 hardware FLOPs) to model FLOPs.</p></li>
      <li class="gate"><span class="gn">4</span><h3>Project hero-scale BPB</h3>
        <p>Predict the pretraining BPB at the achievable FLOP budget. Run a scaling ladder at equal tokens per active parameter from 1e17 to 1e20 FLOPs. The added feature should have a clean scaling rule (e.g. 10% of active parameters on engram, sized at hidden_dim/2, or only on the second half of layers).</p></li>
      <li class="gate wide"><span class="gn">5</span><h3>Assess results</h3>
        <p>In addition to the metrics above, loss curve stability, router balancing, long-context evals, SFT/RL compatibility, OOD evals, activation norms, quantization behavior, robustness to datamix shifts, inference prefill and decode speed at various context lengths, and compatibility with serving hardware all influence decisions on the hero run. Results at this stage will be assessed holistically.</p></li>
    </ol>
  </section>

  <section id="data">
    <div class="sec-head">
      <h2>Data and Tokenization</h2>
    </div>
    <p class="lede" style="margin-top:0">V1 of Marin Belay runs on our stage 1 datamix of the Marin Aug Hero Run. The data was retokenized with a 16k BPE tokenizer to enable faster small-scale iteration. Tokenizer and data tuning can heavily curve-fit a single eval, so before we open up this stage for hill climbing, we need a more comprehensive pretraining eval suite integrated into Belay. We observed that the 16k tokenizer achieved only 8% worse data compression than the 128k Llama 3 tokenizer. It also achieved equivalent bpb when trained on the same number of tokens (8% less data). As a result, Marin Belay will stick with the 16k tokenizer for now.</p>
  </section>

  <section id="kit">
    <div class="sec-head">
      <h2>Scaling starter kit</h2>
      <p class="lede">Everything needed to set up a run at any rung so it scales cleanly. Agents will use these by default unless specified otherwise. T = total training tokens, d = hidden dim, B = tokens per batch.</p>
    </div>
    <div class="kit">
      <div class="kit-card">
        <h3>Learning rate (MuonH + Adam)</h3>
<pre class="formula">adam_lr  = 0.0876 · T^−0.346 · d^−0.345 · √B
muonh_lr = (13/3) · adam_lr, capped at 0.05</pre>
        <p>Fit empirically over 122 runs (d512–d2048), R² = 0.978. Schedule: linear decay to 5% of peak.</p>
      </div>
      <div class="kit-card">
        <h3>beta2 scaling with batch size</h3>
<pre class="formula">beta2 = clip(0.999^(B / 131072), 0.95, 0.9999)</pre>
        <p>A constant per-token half-life. Worked values: d512/d768 (524k tokens per batch) → 0.996; d1024/d1280 (1.05M) → 0.992; hero (46.1M) → 0.95 (clipped). beta1 = 0.9 by default.</p>
        <p>The current competitive d512 stack overrides beta2 to 0.98 and beta1 to 0.8, so tuned recipe values can differ from the default formula.</p>
      </div>
      <div class="kit-card">
        <h3>Adam epsilon</h3>
<pre class="formula">ε = 9.676e-18 · √(T / B)</pre>
      </div>
      <div class="kit-card">
        <h3>Init</h3>
<pre class="formula">std = 0.5 / √d</pre>
      </div>
    </div>
    <div class="kit-table">
      <table class="rungs">
        <thead><tr><th>Rung</th><th class="r">Hidden</th><th class="r">Layers</th><th class="r">Heads</th><th class="r">Batch (seqs)</th><th class="r">Tokens / batch</th><th class="r">Hardware</th></tr></thead>

      <li><b>Discussion</b>: intake <a href="https://github.com/marin-community/marin/issues/9514" target="_blank" rel="noopener">marin#9514</a>; batch plans in <a href="https://github.com/marin-community/marin/issues/9451" target="_blank" rel="noopener">marin#9451</a>.</li>
    </ul>
  </section>

  <section id="results">
    <div class="sec-head">
      <h2>Results</h2>
      <div class="res-summary" id="res-summary"></div>
    </div>
    <div class="res-tools">
      <div class="search-row">
        <label class="search" for="q">
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--faint)"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="color:var(--faint)"/></svg>
          <input id="q" type="search" placeholder="Search ideas, settings, papers, arXiv ids, run names…" autocomplete="off" aria-label="Search results">
        </label>
        <select id="sort" class="sel" aria-label="Sort within categories">
          <option value="best">Biggest win first</option>
          <option value="recent">Most recently tested</option>
          <option value="trials">Most tested</option>
          <option value="name">A–Z</option>
        </select>
        <span class="count" id="res-count"></span>
      </div>
      <div class="facets">
        <div class="facet" id="f-status" role="group" aria-label="Filter by status"><span class="fl">Status</span></div>
        <div class="facet" id="f-cat" role="group" aria-label="Filter by category"><span class="fl">Category</span></div>
        <div class="facet" id="f-reach" role="group" aria-label="Filter by scale reached"><span class="fl">Scale</span></div>
      </div>
    </div>
    <div class="groups" id="groups"></div>
  </section>
</main>
<footer>
  <div class="wrap">
    <span>Marin Belay</span>
    <span>Results from <code>results.json</code>, built from the <a href="https://github.com/marin-community/marin/tree/marin_belay_v1_registry/experiments/belay" target="_blank" rel="noopener">Marin Belay experiment registry</a> (<a href="https://github.com/marin-community/marin/issues/9451" target="_blank" rel="noopener">marin-community/marin#9451</a>); GB200 throughput and the latest-best curve above d512 are estimates.</span>
  </div>
</footer>
</template>

  <section class="block"><h2>Ideas</h2><div class="list" id="ideas"></div></section>
  <section class="block"><h2>Activity</h2><ol class="feed" id="feed"></ol></section>
</main>
</template>
