<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marin Belay</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="parts.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-source="public.json">
    <template id="tpl-public">
    <header class="marina-bar">
      <div class="marina-title-row">
        <a class="marina-brand" href="/">Marina</a>
        <span class="marina-divider">/</span>
        <a class="marina-app-title" href="./">Marin Belay</a>
        <span class="marina-actions"><span class="chip" id="who"></span></span>
      </div>
      <nav class="marina-app-nav" aria-label="Sections">
        <a href="#overview">Overview</a>
        <a href="#suggestions">Suggestions</a>
        <a href="#ideas">Ideas</a>
        <a href="#runs">Runs</a>
      </nav>
    </header>
    <main class="page">
      <section id="overview" aria-labelledby="overview-h">
        <div class="intro">
          <h1 id="overview-h">Marin Belay</h1>
          <p class="note">
            Marin Belay tests research ideas for Marin's language models on 8×H100 nodes and records every result,
            good or bad. Anyone can suggest an idea on the intake issue
            <a href="https://github.com/marin-community/marin/issues/9514">#9514</a>. A maintainer reviews it, an
            agent plans and runs the experiment against a same-commit control, and the result goes into the
            experiment registry. Results are Paloma macro loss; lower is better.
          </p>
        </div>
        <div class="next" id="next" data-tone="idle">
          <span class="next-dot" aria-hidden="true"></span>
          <div>
            <div class="next-label">What happens next</div>
            <div class="next-text" id="next-text">Loading…</div>
          </div>
        </div>
        <ol class="pipeline" id="pipeline" aria-label="Pipeline"></ol>
      </section>

      <section id="suggestions" aria-labelledby="suggestions-h">
        <h2 id="suggestions-h">Suggestions from #9514</h2>
        <p class="note">Every intake suggestion and where it stands.</p>
        <div id="public-suggestions" class="cards"></div>
      </section>

      <section id="ideas" aria-labelledby="ideas-h">
        <h2 id="ideas-h">Ideas being tested</h2>
        <p class="note">Each approved idea follows five steps: approval, plan, runs, result, registry entry.</p>
        <div id="public-ideas" class="ideas"></div>
      </section>

      <section id="runs" aria-labelledby="runs-h">
        <h2 id="runs-h">Runs</h2>
        <div class="scroll"><table>
          <thead><tr><th>Run</th><th>State</th><th>Progress</th><th>Paloma macro</th><th>Submitted</th><th>Links</th></tr></thead>
          <tbody id="public-run-rows"></tbody>
        </table></div>
      </section>
      <p class="hint footer" id="public-updated"></p>
    </main>
    </template>
    <div id="view-root"></div>
    <script src="common.js"></script>
    <script src="public.js"></script>
  </body>
</html>
