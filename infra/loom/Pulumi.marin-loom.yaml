    - name: canary-datakit-tier1
      repositoryId: *marinRepositoryId
      workflowRef: marin-community/marin/.github/workflows/marin-canary-datakit-tier1.yaml@refs/heads/main
      profile: *githubAutomationProfile
      serviceTag: *githubAutomationProfile
      ref: refs/heads/main
    - name: canary-datakit-tier2
      repositoryId: *marinRepositoryId
      workflowRef: marin-community/marin/.github/workflows/marin-canary-datakit-tier2.yaml@refs/heads/main
