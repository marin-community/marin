config:
  gcp:project: hai-gcp-models
  marin-loom:region: us-central1
  marin-loom:zone: us-central1-a
  marin-loom:domain: loom.oa.dev
  marin-loom:operatorCidr: 51.81.155.107/32
  marin-loom:dnsZoneId: 169959d6aafcbfd77764b8efafa3a509
  marin-loom:network: default
  marin-loom:instanceName: loom
  marin-loom:vmServiceAccountName: loom-vm
  marin-loom:machineType: c4d-highmem-4
  marin-loom:bootDiskName: loom-hyperdisk
  marin-loom:bootDiskType: hyperdisk-balanced
  marin-loom:bootDiskGb: "1000"
  marin-loom:bootDiskIops: "3000"
  marin-loom:bootDiskThroughput: "140"
  marin-loom:bootDiskSnapshot: loom-pre-c4d-hyperdisk-20260816
  marin-loom:dotenvSecretVersion: "4"
  marin-loom:pruneDeployment: "true"
  marin-loom:settings:
    github.profile: github
    slack.effort: agent-default
    slack.profile: slack
  marin-loom:profiles:
    default:
      agent: codex
      description: Interactive Marin work with repository-owned workflow instructions
      model: gpt-5.6-sol
      effort: xhigh
      protocol: acp
      mode: auto
      class: interactive
      prelude: weaver
      instructionsFile: profiles/user/AGENTS.md
      env: &loomIrisUser
        IRIS_USER:
          value: loom
      githubRepositories: &interactiveGithubRepositories
        - Open-Athena/*
        - marin-community/*
      mcpAccess:
        mode: all
        groups: []
    github:
      agent: codex
      description: GitHub-triggered Marin issue and pull-request sessions
      model: gpt-5.6-sol
      effort: xhigh
      protocol: acp
      mode: auto
      class: interactive
      prelude: weaver
      instructionsFile: profiles/github/AGENTS.md
      env: *loomIrisUser
      githubRepositories: *interactiveGithubRepositories
      mcpAccess:
        mode: all
        groups: []
    agent-moe-report:
      agent: codex
      description: Refresh the Agent MoE experiment digest from reviewed evidence
      model: gpt-5.6-sol
      effort: xhigh
      protocol: acp
      mode: auto
      class: automation
      strict: true
      envClear: true
      ambientAllowlist: []
      idleArchiveSeconds: 3600
      maxConcurrent: 1
      turnBudget: 300
      prelude: weaver
      instructionsFile: profiles/agent-moe-report/AGENTS.md
      env: *loomIrisUser
      restricted: false
      githubRepositories:
        - marin-community/marin
      allowedTools: []
      mcpAccess:
        mode: all
        groups: []
    fork-ferry:
      agent: codex
      description: Refresh Marin forks and validate their pinned revisions
      model: gpt-5.6-sol
      effort: xhigh
      protocol: acp
      mode: auto
      class: automation
      strict: true
      envClear: true
      ambientAllowlist: []
      idleArchiveSeconds: 3600
      maxConcurrent: 4
      turnBudget: 100
      prelude: weaver
      instructionsFile: profiles/fork-ferry/AGENTS.md
      env: *loomIrisUser
      restricted: false
      githubRepositories:
        - marin-community/evalchemy
        - marin-community/harbor
        - marin-community/marin
        - marin-community/tpu-inference
        - marin-community/vllm
        - marin-community/xla
      allowedTools: []
      mcpAccess:
        mode: all
        groups: []
    pr-review:
      agent: codex
      description: Review trusted Marin pull requests from immutable head commits
      model: gpt-5.6-sol
      effort: xhigh
      protocol: acp
      mode: auto
      class: automation
      strict: true
      envClear: true
      ambientAllowlist: []
      idleArchiveSeconds: 900
      maxConcurrent: 4
      turnBudget: 200
      prelude: weaver
      instructionsFile: profiles/pr-review/AGENTS.md
      env: *loomIrisUser
      restricted: false
      githubRepositories:
        - marin-community/marin
      allowedTools: []
      mcpAccess:
        mode: all
        groups: []
    codehealth-refinement:
      agent: codex
      description: Refine agentic-lint from persisted review and lint activity
      model: gpt-5.6-sol
      effort: xhigh
      protocol: acp
      mode: auto
      class: automation
      strict: true
      envClear: true
      ambientAllowlist: []
      idleArchiveSeconds: 3600
      maxConcurrent: 1
      turnBudget: 400
      prelude: weaver
      instructionsFile: profiles/codehealth-refinement/AGENTS.md
      env:
        CLOUDSQL_CONNECTION:
          value: hai-gcp-models:us-central1:marin-metadata
        PGDATABASE:
          value: context
        PGUSER:
          value: loom-vm@hai-gcp-models.iam
      restricted: false
      githubRepositories:
        - marin-community/marin
      allowedTools: []
      mcpAccess:
        mode: all
        groups: []
    ops:
      agent: codex
      description: Coordinate Grafana alerts and delegate incident triage for Marin
      model: gpt-5.6-sol
      effort: xhigh
      protocol: acp
      mode: auto
      class: automation
      strict: true
      envClear: true
      ambientAllowlist: []
      idleArchiveSeconds: 3600
      maxConcurrent: 4
      turnBudget: 100
      prelude: weaver
      instructionsFile: profiles/ops/AGENTS.md
      env: *loomIrisUser
      restricted: false
      githubRepositories:
        - marin-community/marin
      allowedTools: []
      mcpAccess:
        mode: all
        groups: []
    slack:
      agent: codex
      description: Slack-triggered Marin conversations and repository work
      model: gpt-5.6-sol
      effort: medium
      protocol: acp
      mode: auto
      class: interactive
      prelude: weaver
      instructionsFile: profiles/slack/AGENTS.md
      env: *loomIrisUser
      githubRepositories: *interactiveGithubRepositories
      mcpAccess:
        mode: all
        groups: []
  marin-loom:workloads:
    - name: grafana-alerts
      profile: ops
      serviceTag: grafana
      serviceAccountId: marin-grafana
      createServiceAccount: false
  marin-loom:githubFederations:
    - name: agent-moe-report
      repositoryId: &marinRepositoryId "775839592"
      workflowRef: marin-community/marin/.github/workflows/ops-agent-moe-report.yaml@refs/heads/main
      profile: agent-moe-report
      serviceTag: agent-moe-report
      ref: refs/heads/main
    - name: fork-ferry
      repositoryId: *marinRepositoryId
      workflowRef: marin-community/marin/.github/workflows/ops-fork-ferry.yaml@refs/heads/main
      profile: fork-ferry
      serviceTag: fork-ferry
      ref: refs/heads/main
    - name: pr-review
      repositoryId: *marinRepositoryId
      workflowRef: marin-community/marin/.github/workflows/ops-loom-review.yaml@refs/heads/main
      profile: pr-review
      serviceTag: pr-review
      event: pull_request_target
      ref: refs/heads/main
    - name: codehealth-refinement
      repositoryId: *marinRepositoryId
      workflowRef: marin-community/marin/.github/workflows/ops-codehealth-refinement.yaml@refs/heads/main
      profile: codehealth-refinement
      serviceTag: codehealth-refinement
      ref: refs/heads/main
