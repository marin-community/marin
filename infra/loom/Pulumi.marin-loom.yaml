config:
  gcp:project: hai-gcp-models
  marin-loom:region: us-central1
  marin-loom:zone: us-central1-a
  marin-loom:domain: loom.oa.dev
  marin-loom:operatorCidr: 51.81.155.107/32
  marin-loom:dnsZoneId: 169959d6aafcbfd77764b8efafa3a509
  marin-loom:network: default
  marin-loom:instanceName: loom
  marin-loom:vmServiceAccountName: loom-vm
  marin-loom:vmProjectRoles: []
  marin-loom:vmPulumiKmsKeys:
    - projects/hai-gcp-models/locations/us-central1/keyRings/marin-iac-keyring/cryptoKeys/marin-iac-key
  marin-loom:machineType: e2-highmem-4
  marin-loom:bootDiskGb: "1000"
  marin-loom:dotenvSecretVersion: "4"
  marin-loom:pruneDeployment: "true"
  marin-loom:snapshotRetentionDays: "14"
  marin-loom:settings:
    github.profile: github
    slack.effort: agent-default
    slack.profile: slack
  marin-loom:profiles:
    default:
      agent: codex
      description: Interactive Marin work with repository-owned workflow instructions
      model: gpt-5.6-sol
      effort: xhigh
      protocol: acp
      mode: auto
      class: interactive
      prelude: weaver
      instructionsFile: profiles/user/AGENTS.md
      githubRepositories: &interactiveGithubRepositories
        - Open-Athena/marinmirror
        - Open-Athena/mumwelt
        - marin-community/MarinSkyRL
        - marin-community/evalchemy
        - marin-community/harbor
        - marin-community/loom
        - marin-community/marin
        - marin-community/marin-style
        - marin-community/vllm
      mcpAccess:
        mode: all
        groups: []
    github:
      agent: codex
      description: GitHub-triggered Marin issue and pull-request sessions
      model: gpt-5.6-sol
      effort: xhigh
      protocol: acp
      mode: auto
      class: interactive
      prelude: weaver
      instructionsFile: profiles/github/AGENTS.md
      githubRepositories: *interactiveGithubRepositories
      mcpAccess:
        mode: all
        groups: []
    fork-ferry:
      agent: codex
      description: Refresh Marin forks and validate their pinned revisions
      model: gpt-5.6-sol
      effort: xhigh
      protocol: acp
      mode: auto
      class: automation
      strict: true
      envClear: true
      ambientAllowlist: []
      idleArchiveSeconds: 3600
      maxConcurrent: 3
      turnBudget: 100
      prelude: weaver
      instructionsFile: profiles/fork-ferry/AGENTS.md
      restricted: false
      githubRepositories:
        - marin-community/evalchemy
        - marin-community/harbor
        - marin-community/marin
        - marin-community/tpu-inference
        - marin-community/vllm
      allowedTools: []
      mcpAccess:
        mode: all
        groups: []
    ops:
      agent: codex
      description: Coordinate Grafana alerts and delegate incident triage for Marin
      model: gpt-5.6-sol
      effort: xhigh
      protocol: acp
      mode: auto
      class: automation
      strict: true
      envClear: true
      ambientAllowlist: []
      idleArchiveSeconds: 3600
      maxConcurrent: 1
      turnBudget: 100
      prelude: weaver
      instructionsFile: profiles/ops/AGENTS.md
      restricted: false
      allowedTools: []
      mcpAccess:
        mode: all
        groups: []
    slack:
      agent: codex
      description: Slack-triggered Marin conversations and repository work
      model: gpt-5.6-sol
      effort: high
      protocol: acp
      mode: auto
      class: interactive
      prelude: weaver
      instructionsFile: profiles/slack/AGENTS.md
      githubRepositories: *interactiveGithubRepositories
      mcpAccess:
        mode: all
        groups: []
  marin-loom:workloads:
    - name: grafana-alerts
      profile: ops
      serviceTag: grafana
      serviceAccountId: marin-grafana
      createServiceAccount: false
  marin-loom:githubFederations:
    - name: fork-ferry
      repositoryId: "775839592"
      workflowRef: marin-community/marin/.github/workflows/ops-fork-ferry.yaml@refs/heads/main
      profile: fork-ferry
      serviceTag: fork-ferry
      ref: refs/heads/main
