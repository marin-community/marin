    - name: canary-grug-multislice
      repositoryId: *marinRepositoryId
      workflowRef: marin-community/marin/.github/workflows/marin-canary-grug-multislice.yaml@refs/heads/main
      profile: *githubAutomationProfile
      serviceTag: *githubAutomationProfile
      ref: refs/heads/main
    - name: pr-review
      repositoryId: *marinRepositoryId
      workflowRef: marin-community/marin/.github/workflows/ops-loom-review.yaml@refs/heads/main
      profile: pr-review
      serviceTag: pr-review
