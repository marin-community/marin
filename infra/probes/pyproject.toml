[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-infra-probes"
version = "0.1.0"
description = "Synthetic infra monitoring: continuously exercises Iris and Finelog, records latency and error samples."
requires-python = ">=3.12,<3.14"
# marin-* libs ship development releases to PyPI (the scheduled pure-library
# workflow for iris/rigging and source-triggered native workflow for finelog).
# Automated compatibility PRs lock the selected releases. (The
# old GH `*-latest` rolling releases are abandoned/frozen.)
dependencies = [
    "marin-iris    >= 0.2.62.dev30341111543",
    "marin-finelog >= 0.2.15.dev30321169593",
    "marin-rigging >= 0.2.62.dev30341111543",
    "click >= 8.0",
    # marin-iris pulls s3fs -> aiobotocore, which breaks at import under the
    # httpx 1.0 prereleases (no httpx.TimeoutException). Pin to the 0.28 stable
    # line; marin-iris only needs httpx >= 0.28.1.
    "httpx >= 0.28.1, < 1",
]

[project.scripts]
probes = "infra_probes:main"

[dependency-groups]
dev = ["pytest >= 8.4"]

[tool.uv]
# The direct marin-* requirements and the two constraints below opt into
# development releases. Global "allow" dragged in unrelated prereleases such
# as httpx 1.0.dev3, which broke aiobotocore at import.
prerelease = "explicit"
constraint-dependencies = [
    # Iris pulls these pre-release-only builds transitively. Declaring the
    # development floors here opts them into uv's explicit pre-release policy
    # without making server/native packages direct probe dependencies.
    "marin-finelog-server >= 0.2.14.dev30290140609",
    "marin-iris-native >= 0.1.5.dev30223685542",
]

[tool.hatch.build.targets.wheel]
# Ship the whole package; an explicit per-file list silently drops new modules
# from the wheel, so `python -m infra_probes` ImportErrors at container start.
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
timeout = 30
timeout_method = "thread"
addopts = "--durations=10 -v"
filterwarnings = ["ignore::DeprecationWarning"]
log_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
