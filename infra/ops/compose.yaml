services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ops
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: local-ops
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - ops-postgres:/var/lib/postgresql/data

volumes:
  ops-postgres:
