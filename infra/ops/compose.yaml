services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ops
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: local-ops
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - ops-postgres:/var/lib/postgresql/data

  grafana-api:
    image: python:3.12-slim
    working_dir: /fixtures
    command: ["python", "-m", "http.server", "8000", "--bind", "0.0.0.0"]
    ports:
      - "127.0.0.1:55433:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/alertmanager/grafana/api/v2/alerts')"
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - ./fixtures/grafana-api:/fixtures:ro

volumes:
  ops-postgres:
