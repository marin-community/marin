services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ops
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: local-ops
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - ops-postgres:/var/lib/postgresql/data

  grafana-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: grafana
      POSTGRES_USER: grafana_reader
      POSTGRES_PASSWORD: local-grafana-read
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana_reader -d grafana"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - grafana-postgres:/var/lib/postgresql/data
      - ./fixtures/grafana-polling.sql:/docker-entrypoint-initdb.d/001-grafana-polling.sql:ro

volumes:
  ops-postgres:
  grafana-postgres:
