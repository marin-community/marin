[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-infra-ops"
version = "0.1.0"
description = "Durable operational signal ingestion and agent workflow coordination."
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx >= 0.28",
  "marin-rigging",
  "psycopg[binary] >= 3.2",
  "sqlalchemy[asyncio] >= 2.0",
  "starlette >= 0.47",
  "uvicorn >= 0.35",
]

[tool.uv.sources]
marin-rigging = { path = "../../lib/rigging" }

[project.scripts]
ops-workflow = "ops_workflow.cli:main"

[dependency-groups]
dev = ["pytest >= 8.4"]

[tool.hatch.build.targets.wheel]
only-include = ["src/ops_workflow"]
sources = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--durations=10 -v"

[tool.pyrefly]
python-version = "3.12"
disable-project-excludes-heuristics = true
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = ["src"]
disable-search-path-heuristics = true
python-interpreter-path = ".venv/bin/python"
use-ignore-files = false
