#
# Dashboards are code: they ship in the image under /etc/grafana/dashboards and
# are reloaded from disk. UI edits are rejected, and the file set is authoritative
# in both directions — deleting a dashboard from git deletes it from Grafana. That
# matters because Grafana's state lives in the shared marin-metadata Postgres and
# survives redeploys, so `disableDeletion: true` would leave a removed dashboard on
# the site forever with no file left to explain it.
apiVersion: 1

providers:
  - name: marin
    orgId: 1
    folder: Marin
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true
