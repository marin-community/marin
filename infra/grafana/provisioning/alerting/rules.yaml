      # A hero run whose lowest loss over the last five minutes clears its own
      # trailing mean plus six standard deviations, or stops being finite. It
      # takes the same hero-run route as the stall alert: a hero run diverging
      # unwatched costs more than a false page, which a silence answers. Grouping
      # by root job excludes `reason`, so a spike that later goes non-finite
      # threads under the message it already sent.
