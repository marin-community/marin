        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.cluster }}: {{ $labels.server }} is {{ $labels.state }}"
          runbook_url: https://github.com/marin-community/marin/blob/main/lib/finelog/OPS.md
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: finelog-marin
            model:
              refId: A
              datasource: { type: yesoreyeram-infinity-datasource, uid: finelog-marin }
              type: json
              source: url
              parser: backend
              format: table
              url: /alerts/fleet_health
              url_options: { method: GET }
              columns:
                - { selector: cluster, text: cluster, type: string }
                - { selector: server, text: server, type: string }
                - { selector: role, text: role, type: string }
                - { selector: state, text: state, type: string }
                - { selector: error_class, text: error_class, type: string }
                - { selector: value, text: value, type: number }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

  # The hourly collector stores CoreWeave usage and zone quotas in Finelog.
  - orgId: 1
    name: coreweave-storage
    folder: Alerts
    interval: 5m
    rules:
      - uid: coreweave-storage-capacity
        title: CoreWeaveStorageCapacity
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.region }}: CoreWeave storage exceeds 80% of quota"
          runbook_url: https://github.com/marin-community/marin/blob/main/scripts/ops/storage/README.md
        data:
          - refId: A
            relativeTimeRange: { from: 129600, to: 0 }
            datasourceUid: finelog-marin
            model:
              refId: A
              datasource: { type: yesoreyeram-infinity-datasource, uid: finelog-marin }
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: GET
                params:
                  - key: sql
                    value: >-
                      WITH ranked AS (
                        SELECT metric, zone, bucket, storage_class, value_bytes, observed_at,
                               ROW_NUMBER() OVER (
                                 PARTITION BY provider, metric, zone, bucket, storage_class
                                 ORDER BY observed_at DESC, seq DESC
                               ) AS row_num
                        FROM "storage.usage"
                        WHERE provider = 'coreweave'
                          AND metric IN ('used_bytes', 'quota_bytes')
                      ), latest AS (
                        SELECT metric, zone, storage_class, value_bytes
                        FROM ranked
                        WHERE row_num = 1
                          AND observed_at >= CURRENT_TIMESTAMP - INTERVAL '3 hours'
                      ), usage AS (
                        SELECT zone, storage_class, SUM(value_bytes) AS usage_bytes
                        FROM latest
                        WHERE metric = 'used_bytes'
                        GROUP BY zone, storage_class
                      ), quota AS (
                        SELECT zone, storage_class, MAX(value_bytes) AS quota_bytes
                        FROM latest
                        WHERE metric = 'quota_bytes'
                        GROUP BY zone, storage_class
                      )
                      SELECT usage.zone AS region,
                             usage.usage_bytes / NULLIF(quota.quota_bytes, 0) AS value
                      FROM usage
                      JOIN quota
                        ON quota.zone = usage.zone
                       AND quota.storage_class = usage.storage_class
              columns:
                - { selector: region, text: region, type: string }
                - { selector: value, text: value, type: number }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.8] }

      - uid: coreweave-storage-telemetry-stale
        title: CoreWeaveStorageTelemetryStale
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
          notification: slack
        annotations:
          summary: "{{ $labels.region }}: CoreWeave {{ $labels.metric }} telemetry is stale for {{ $labels.detail }}"
          runbook_url: https://github.com/marin-community/marin/blob/main/scripts/ops/storage/README.md
        data:
          - refId: A
            relativeTimeRange: { from: 10800, to: 0 }
            datasourceUid: finelog-marin
            model:
              refId: A
              datasource: { type: yesoreyeram-infinity-datasource, uid: finelog-marin }
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: GET
                params:
                  - key: sql
                    value: >-
                      WITH ranked AS (
                        SELECT metric, zone, bucket, storage_class, observed_at,
                               ROW_NUMBER() OVER (
                                 PARTITION BY provider, metric, zone, bucket, storage_class
                                 ORDER BY observed_at DESC, seq DESC
                               ) AS row_num
                        FROM "storage.usage"
                        WHERE provider = 'coreweave'
                          AND metric IN ('used_bytes', 'quota_bytes')
                      )
                      SELECT zone AS region,
                             metric,
                             COALESCE(bucket, storage_class) AS detail,
                             1 AS value
                      FROM ranked
                      WHERE row_num = 1
                        AND observed_at < CURRENT_TIMESTAMP - INTERVAL '3 hours'
              columns:
                - { selector: region, text: region, type: string }
                - { selector: metric, text: metric, type: string }
                - { selector: detail, text: detail, type: string }
                - { selector: value, text: value, type: number }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

