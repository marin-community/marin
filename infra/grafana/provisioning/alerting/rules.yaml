#
# Critical rules notify operators immediately. Warning rules remain visible in
# Grafana without sending notifications. The k8s rules read the bridge's
# /k8s/alerts/* endpoints, which return string label columns plus exactly one
# numeric column. Most also always emit at least one row per cluster (explicit
# zeros when healthy), making their NoData state unreachable by construction;
# gpu_rack_trays is the exception. Every rule still sets noDataState/execErrState
# to Alerting so monitoring-path failures remain visible.
#
# Workload-tier signals (gated pods, kueue backlog, workload crashloops) are
# dashboard-only: they have expected benign causes (capacity pressure, user
# error), so paging on them would be noise.
apiVersion: 1

deleteRules:
  - orgId: 1
    uid: infra-probe-failed

groups:
  - orgId: 1
    name: k8s-control-plane
    folder: Alerts
    interval: 1m
    rules:
      - uid: k8s-cluster-unreachable
        title: K8sClusterUnreachable
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.cluster }}: k8s API server unreachable ({{ $labels.error_class }})"
          runbook_url: https://github.com/marin-community/marin/blob/main/lib/iris/OPS.md
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: k8s
            model:
              refId: A
              datasource: { type: yesoreyeram-infinity-datasource, uid: k8s }
              type: json
              source: url
              parser: backend
              format: table
              url: /alerts/unreachable
              url_options: { method: GET }
              columns:
                - { selector: cluster, text: cluster, type: string }
                - { selector: error_class, text: error_class, type: string }
                - { selector: value, text: value, type: number }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

