              datasource: { type: yesoreyeram-infinity-datasource, uid: k8s }
              type: json
              source: url
              parser: backend
              format: table
              url: /alerts/gpu_rack_trays
              url_options: { method: GET }
              columns:
                - { selector: cluster, text: cluster, type: string }
                - { selector: rack_name, text: rack_name, type: string }
                - { selector: value, text: value, type: number }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [16] }

  # The marin datasource combines a query-path probe of the GCE hub with the
  # HTTP-readiness state of each CoreWeave finelog Deployment. K8s marks a pod
  # NotReady when /health misses its fifteen-second deadline; the hub reports its
  # measured one-row log query latency. The alert projection returns an explicit zero for
  # every healthy server, so NoData means the monitoring path itself failed.
  - orgId: 1
    name: finelog-health
    folder: Alerts
    interval: 1m
    rules:
      - uid: finelog-fleet-unhealthy
        title: FinelogFleetUnhealthy
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.cluster }}: {{ $labels.server }} is {{ $labels.state }}"
          runbook_url: https://github.com/marin-community/marin/blob/main/lib/finelog/OPS.md
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: finelog-marin
            model:
              refId: A
              datasource: { type: yesoreyeram-infinity-datasource, uid: finelog-marin }
              type: json
              source: url
              parser: backend
              format: table
              url: /alerts/fleet_health
              url_options: { method: GET }
              columns:
                - { selector: cluster, text: cluster, type: string }
                - { selector: server, text: server, type: string }
                - { selector: role, text: role, type: string }
                - { selector: state, text: state, type: string }
                - { selector: error_class, text: error_class, type: string }
                - { selector: value, text: value, type: number }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

  # The canary writes one probe_up row per check and target. Read the newest row
  # from the last two cadences. NoData covers a stopped probe daemon or a broken
  # metrics path; a zero covers a completed check that failed.
  - orgId: 1
    name: infra-probes
    folder: Alerts
    interval: 1m
    rules:
      - uid: infra-probe-failed
        title: InfraProbeFailed
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.probe }}: infrastructure probe failing for {{ $labels.target }}"
          runbook_url: https://github.com/marin-community/marin/blob/main/infra/probes/README.md
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: finelog-marin
            model:
              refId: A
              datasource: { type: yesoreyeram-infinity-datasource, uid: finelog-marin }
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: GET
                params:
                  - key: sql
                    value: >-
                      WITH recent AS (
                        SELECT labels, value,
                               ROW_NUMBER() OVER (PARTITION BY labels ORDER BY collected_at DESC) AS row_num
                        FROM "infra.canary.metrics"
                        WHERE metric = 'probe_up'
                          AND collected_at >= CURRENT_TIMESTAMP - INTERVAL '10 minutes'
                      )
                      SELECT json_get(labels, 'probe') AS probe,
                             COALESCE(json_get(labels, 'cluster'), json_get(labels, 'zone'), 'global') AS target,
                             value
                      FROM recent
                      WHERE row_num = 1
              columns:
                - { selector: probe, text: probe, type: string }
                - { selector: target, text: target, type: string }
                - { selector: value, text: value, type: number }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

  # Warning-only stalled-training detection. A fresh running task-state row is
  # the liveness gate and levanter_phase enrolls the job; only progress absent
  # after enrollment is evidence, so this rule does not require task-to-node
  # GPU attribution.
  - orgId: 1
    name: training-progress
    folder: Alerts
    interval: 1m
    rules:
      - uid: training-progress-stalled
        title: TrainingProgressStalled
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.cluster }}: {{ $labels.job }} has {{ $labels.reason }}"
          runbook_url: https://github.com/marin-community/marin/blob/main/docs/ops/training-stall-alert-contract.md
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: finelog-marin
            model:
              refId: A
              datasource: { type: yesoreyeram-infinity-datasource, uid: finelog-marin }
              type: json
              source: url
              parser: backend
              format: table
              url: /alerts/training_stalls
              url_options: { method: GET }
              columns:
                - { selector: cluster, text: cluster, type: string }
                - { selector: job, text: job, type: string }
                - { selector: phase, text: phase, type: string }
                - { selector: reason, text: reason, type: string }
                - { selector: value, text: value, type: number }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

  # The GCE controllers are not in K8S_CLUSTERS; their liveness comes from the
  # existing per-cluster iris datasources. The health row always exists (the
  # bridge answers reachable=false rather than erroring), and `up` is its 0/1
  # numeric mirror. The rule carries the cluster label itself since the endpoint
  # is already cluster-scoped. marin-dev is warning: its controller matters to
  # dev work, not to production paging.
  - orgId: 1
    name: iris-control-plane
    folder: Alerts
    interval: 1m
    rules:
      - uid: iris-federation-peer-unreachable
        title: IrisFederationPeerUnreachable
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          cluster: marin
        annotations:
          summary: "marin federation cannot reach {{ $labels.peer }} through {{ $labels.controller_address }}"
          runbook_url: https://github.com/marin-community/marin/blob/main/lib/iris/OPS.md
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: iris-marin
            model:
              refId: A
              datasource: { type: yesoreyeram-infinity-datasource, uid: iris-marin }
              type: json
              source: url
              parser: backend
              format: table
              url: /peers
              url_options: { method: GET }
              columns:
                - { selector: peer, text: peer, type: string }
                - { selector: controller_address, text: controller_address, type: string }
                - { selector: state, text: state, type: string }
                - { selector: value, text: value, type: number }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: iris-controller-down-marin
        title: IrisControllerDown
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          cluster: marin
        annotations:
          summary: "marin: Iris controller /health is unreachable"
          runbook_url: https://github.com/marin-community/marin/blob/main/lib/iris/OPS.md
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: iris-marin
            model:
              refId: A
              datasource: { type: yesoreyeram-infinity-datasource, uid: iris-marin }
              type: json
              source: url
              parser: backend
              format: table
              url: /health
              url_options: { method: GET }
              columns:
                - { selector: up, text: up, type: number }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: iris-controller-down-marin-dev
        title: IrisControllerDown
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: warning
          cluster: marin-dev
        annotations:
          summary: "marin-dev: Iris controller /health is unreachable"
          runbook_url: https://github.com/marin-community/marin/blob/main/lib/iris/OPS.md
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: iris-marin-dev
            model:
              refId: A
              datasource: { type: yesoreyeram-infinity-datasource, uid: iris-marin-dev }
              type: json
              source: url
              parser: backend
              format: table
              url: /health
              url_options: { method: GET }
              columns:
                - { selector: up, text: up, type: number }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
