        annotations:
          summary: "{{ $labels.cluster }}: {{ $labels.job }} has {{ $labels.reason }}"
          runbook_url: https://github.com/marin-community/marin/blob/main/docs/ops/training-stall-alert-contract.md
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: finelog-marin
            model:
              refId: A
              datasource: { type: yesoreyeram-infinity-datasource, uid: finelog-marin }
              type: json
              source: url
              parser: backend
              format: table
              url: /alerts/training_stalls
              url_options: { method: GET }
              columns:
