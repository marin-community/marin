#
# The notification policy tree. Grafana is canonical for grouping, deduplication,
# repeat timing, and resolution. Warnings are muted for notifications but remain
# visible in alert_instance for the ops agent poller. Critical/error alerts reach
# email and Slack. Instances group by (alertname, cluster).
apiVersion: 1

policies:
  - orgId: 1
    receiver: ops-critical
    group_by: ["alertname", "cluster"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: ops-critical
        object_matchers:
          - ["severity", "=", "critical"]
      - receiver: ops-critical
        object_matchers:
          - ["severity", "=", "error"]
      - receiver: ops-critical
        object_matchers:
          - ["severity", "=", "warning"]
        mute_time_intervals: [ops-agent-only]

muteTimes:
  - orgId: 1
    name: ops-agent-only
    time_intervals:
      - times:
          - start_time: "00:00"
            end_time: "24:00"
