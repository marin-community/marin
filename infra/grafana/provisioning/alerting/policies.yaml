#
# The notification policy tree. Grafana is canonical for grouping, deduplication,
# repeat timing, and resolution. Warnings and unmatched alerts reach only the ops
# agent. Critical/error alerts reach email, Slack, and the agent through the
# compound ops-critical contact point. Instances group by (alertname, cluster).
apiVersion: 1

policies:
  - orgId: 1
    receiver: ops-agent
    group_by: ["alertname", "cluster"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: ops-critical
        object_matchers:
          - ["severity", "=", "critical"]
      - receiver: ops-critical
        object_matchers:
          - ["severity", "=", "error"]
      - receiver: ops-agent
        object_matchers:
          - ["severity", "=", "warning"]
