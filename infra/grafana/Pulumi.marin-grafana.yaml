config:
  # Extra people admitted through IAP beyond the shared CloudRunService baseline. Each entry is
  # a bare email, a domain wildcard (quote it — YAML reads a leading `*` as an alias), or an
  # already-qualified IAM member. Editing this and re-running `pulumi up` updates only the
  # grants, never the service:
  #
  #   marin-grafana:viewers:
  #     - alice@example.com
  #     - "*@example.com"
  #     - group:marin-eng@example.com
  marin-grafana:viewers: [russell.power@gmail.com, sf.office.shared.openathena@gmail.com]
  # Vanity host for the service. The DNS CNAME (grafana -> ghs.googlehosted.com) is created
  # in the oa.dev Cloudflare zone; unset custom_domain to serve only the run.app URL.
  marin-grafana:custom_domain: grafana.oa.dev
  marin-grafana:dns_zone_id: 169959d6aafcbfd77764b8efafa3a509
  # "Marin Ops Agent" GitHub App (id 3390088) client id — the token JWT's issuer,
  # not a secret. The private key is the hand-placed marin-grafana-github-app-private-key
  # secret; auth turns on once both are present. See README "Secrets and rotation".
  marin-grafana:github_app_client_id: Iv23lifJun4glkL9XbFJ
  # Set false only for the first deployment in a new project: that creates the
  # service account before the Loom stack binds it. Re-enable after Loom is up.
  marin-grafana:loom_alerts: "true"
  # The channel id (`C…`, from the channel's "Copy link") the bridge announces
  # every alert in, and where @russbot answers the critical ones. This is
  # #marin-alerts. Required whenever loom_alerts is true, so a deploy that has
  # not been told the channel fails in `pulumi up` rather than at container boot.
  # @russbot must be a member. See README "Alerting".
  marin-grafana:slack_alerts_channel: C0BN20081CH
