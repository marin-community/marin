name: marin-echo
runtime:
  name: python
  # Pin the shared repo venv (which has the `iac` helper package and the Pulumi providers
  # via marin-iac[deploy]). Without this, Pulumi's Auto toolchain would build an isolated
  # venv with no Pulumi SDK.
  options:
    virtualenv: ../../.venv
description: Echo shared activity/wiki search, browser dashboard, agent work log, and marinmirror sync.
# The state backend is selected by the operator/CI environment and shared with infra/pulumi
# (see README.md):
#   pulumi login gs://marin-iac-state
# Pulumi.marin-echo.yaml records the production stack's shared GCP KMS provider.
