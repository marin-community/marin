[project]
name = "marin-package-gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "packaging>=25",
    "uvicorn>=0.38.0",
]

[tool.uv]
package = false
constraint-dependencies = ["brotli>=1.2.1", "brotlicffi>=1.2.1.0"]
exclude-dependencies = ["litellm"]
