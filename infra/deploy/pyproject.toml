[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-deploy"
version = "0.0.0"
description = "Deployment commands for Marin-operated services."
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "marin-finelog",
]

[dependency-groups]
test = [
    "pytest>=8.4",
    "pytest-timeout",
    "pytest-xdist",
]

[project.scripts]
deploy = "marin_deploy.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/marin_deploy"]

[tool.pytest.ini_options]
timeout = 60
addopts = "--import-mode=importlib"
