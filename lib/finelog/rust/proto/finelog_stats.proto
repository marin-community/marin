edition = "2023";

package finelog.stats;

// Column type for a registered table schema. Maps 1:1 to a subset of
// pyarrow types and Postgres-flavored DuckDB types.
enum ColumnType {
  COLUMN_TYPE_UNKNOWN = 0;
  COLUMN_TYPE_STRING = 1;       // pa.string()
  COLUMN_TYPE_INT64 = 2;        // pa.int64()
  COLUMN_TYPE_FLOAT64 = 3;      // pa.float64()
  COLUMN_TYPE_BOOL = 4;         // pa.bool_()
  COLUMN_TYPE_TIMESTAMP_MS = 5; // pa.timestamp("ms")
  COLUMN_TYPE_BYTES = 6;        // pa.binary()
  COLUMN_TYPE_INT32 = 7;        // pa.int32()
  COLUMN_TYPE_MAP = 8;          // pa.map_(pa.string(), pa.string())
  COLUMN_TYPE_FLOAT64_LIST = 9; // list<float64>
  COLUMN_TYPE_INT64_LIST = 10;  // list<int64>
}

// User-facing column index policy. The server compiles these declarations and
// named projections into its closed planner-facing index-method family.
message ColumnIndex {
  // Span-granular trigram index stored in each segment's `.fidx` bundle, so
  // `contains(col, …)` and `col LIKE '%…%'` queries prune row spans
  // instead of full-scanning. Only meaningful for STRING columns.
  bool trigram = 1;

  // Exact string values stored as postings in each segment's `.fidx` bundle.
  repeated string exact_values = 2;

  // Persist exact per-value row counts in each segment's `.fidx` bundle.
  // Finelog can answer GROUP BY column + COUNT(*)/COUNT(column) from these
  // summaries when every visible segment is covered.
  bool value_counts = 3;
}

message Column {
  string name = 1;
  ColumnType type = 2;
  bool nullable = 3;
  ColumnIndex index = 4;
}

// A named, predicate-scoped Parquet projection maintained beside each segment.
// The projection contains complete rows matching `predicate_values`, but only
// the declared `columns`. The planner substitutes it only when both the query
// predicate and required columns are covered; otherwise it scans the source.
message CoveringProjection {
  string name = 1;
  string predicate_column = 2;
  repeated string predicate_values = 3;
  repeated string columns = 4;
}

// An exact, bounded per-segment rollup for a filtered JSON-derived dimension.
// The section is omitted when its group cardinality exceeds the server's
// adaptive budget; queries then scan only those uncovered segments.
message GroupedExtrema {
  string filter_column = 1;
  string group_json_column = 2;
  string group_json_key = 3;
  string extrema_column = 4;
}

message Schema {
  repeated Column columns = 1;

  // Column used for segment min/max metadata and, when sort_columns is empty,
  // compaction order. Must name an existing scalar column; MAP is unsupported.
  // If empty, the server requires and uses timestamp_ms.
  string key_column = 2;

  // Independent named projections. Adding one is monotonic on re-register.
  // Re-registering a name with a different definition supersedes it, unless the
  // registered definition already covers the requested one. Each segment keeps
  // the definition it was built with and stays queryable, so a redefinition
  // never fails a registration.
  repeated CoveringProjection projections = 3;

  // Independent grouped-extrema rollups. Adding one is monotonic on
  // re-register. Finelog interprets only the declared column roles; producers
  // own their semantic meaning.
  repeated GroupedExtrema grouped_extrema = 4;

  // Physical compaction order. When set, Finelog sorts by these columns and
  // appends the implicit seq column as a deterministic tie-breaker. Empty
  // retains a registered policy or uses key_column on first registration. The
  // key_column remains the event/range key used for retention metadata.
  repeated string sort_columns = 5;

  // Maximum rows per Parquet row group. Zero retains the registered policy or
  // uses the server default on first registration. Explicit values must be
  // 16,384 through 1,048,576. The encoded-byte target may close a group earlier.
  uint32 max_row_group_rows = 6;
}

// Write batches are Arrow IPC RecordBatches on the wire — columnar, with
// the batch's schema embedded in the IPC header. There is no proto-level
// Row or Value type; the column types in the table above (ColumnType)
// describe the Arrow types the server accepts.

// Per-namespace retention overrides. All fields are optional; a field
// left at zero is "inherit the server default" (a missing/unset field
// in proto3 semantics). Non-zero values override the corresponding
// CompactionConfig knob for this namespace only.
message StoragePolicy {
  // Per-namespace count cap on locally-tracked segments. 0 = inherit.
  int32 max_segments = 1;
  // Per-namespace byte cap on locally-tracked segments. 0 = inherit.
  int64 max_bytes = 2;
  // Drop any L>=1 BOTH segment older than ``now - max_age_seconds``.
  // 0 = disabled (no age-based eviction).
  int64 max_age_seconds = 3;
}

// Durability boundary for newly sealed L0 segments.
enum L0Mode {
  L0_MODE_UNSPECIFIED = 0;
  L0_MODE_LEGACY_LOCAL = 1;
  L0_MODE_OBJECT_STORE = 2;
  L0_MODE_LOCAL_EPHEMERAL = 3;
}

message IdentityTransform {}

message BucketTransform {
  uint32 buckets = 1;
}

message PartitionField {
  string source_column = 1;
  string name = 2;
  oneof transform {
    IdentityTransform identity = 3;
    BucketTransform bucket = 4;
  }
}

message PartitionSpec {
  uint64 spec_id = 1;
  repeated PartitionField fields = 2;
}

message SourceLayout {
  PartitionSpec partition = 1;
  repeated string sort_columns = 2;
  uint32 max_row_group_rows = 3;
  uint64 target_object_bytes = 4;
}

message ColumnArtifactPolicy {
  string column = 1;
  ColumnIndex index = 2;
}

message ArtifactPolicy {
  uint64 revision = 1;
  repeated ColumnArtifactPolicy indexes = 2;
  repeated CoveringProjection projections = 3;
  repeated GroupedExtrema grouped_extrema = 4;
}

message RemoteRetentionPolicy {
  // Version 1 permits retain-forever only.
  bool retain_forever = 1;
}

message OperatingPolicy {
  L0Mode l0_mode = 1;
  StoragePolicy local_cache = 2;
  RemoteRetentionPolicy remote_retention = 3;
  uint64 max_buffer_bytes = 4;
  uint64 max_flush_age_ms = 5;
  uint64 max_query_time_ms = 6;
}

// Complete immutable policy for one logical table version.
message TableSpec {
  uint64 version = 1;
  Schema logical_schema = 2;
  SourceLayout source_layout = 3;
  ArtifactPolicy artifact_policy = 4;
  OperatingPolicy operating_policy = 5;
}

message ObjectRef {
  string object_id = 1;
  string provider_version = 2;
  string etag = 3;
  uint64 byte_size = 4;
  bytes sha256 = 5;
}

message CatalogSegment {
  string segment_id = 1;
  ObjectRef source = 2;
  int32 level = 3;
  int64 min_seq = 4;
  int64 max_seq = 5;
  int64 row_count = 6;
  int64 created_at_ms = 7;
  string min_key_value = 8;
  string max_key_value = 9;
  string partition_json = 10;
  uint64 schema_revision = 11;
  int64 retired_at_ms = 12;
  int64 delete_after_ms = 13;
  // Set on backfill outputs so a source is checkpointed exactly once even
  // when a new partition layout rewrites it into multiple objects.
  string migration_source_id = 14;
  int64 migration_source_rows = 15;
  bool migration_backfill = 16;
}

message TableVersionSegments {
  uint64 table_spec_version = 1;
  repeated CatalogSegment live_segments = 2;
  repeated CatalogSegment retired_segments = 3;
}

enum MigrationPhase {
  MIGRATION_PHASE_UNSPECIFIED = 0;
  MIGRATION_PHASE_DUAL_WRITE = 1;
  MIGRATION_PHASE_BACKFILL = 2;
  MIGRATION_PHASE_VERIFY = 3;
  MIGRATION_PHASE_ACTIVATED = 4;
  MIGRATION_PHASE_OBSERVING = 5;
  MIGRATION_PHASE_RETIRED = 6;
}

message TableMigrationStatus {
  string migration_id = 1;
  uint64 from_version = 2;
  uint64 to_version = 3;
  MigrationPhase phase = 4;
  int64 fence_seq = 5;
  uint64 source_generation = 6;
  int64 rows_total = 7;
  int64 rows_completed = 8;
  int64 observation_deadline_ms = 9;
}

message ForwardCursor {
  string target = 1;
  int64 cursor = 2;
}

message NamespaceCatalog {
  uint64 format_version = 1;
  string namespace = 2;
  uint64 catalog_generation = 3;
  uint64 active_table_spec_version = 4;
  uint64 desired_table_spec_version = 5; // zero when no transition is active
  repeated TableSpec retained_table_specs = 6;
  int64 persisted_high_water = 7;
  repeated TableVersionSegments version_segments = 8;
  TableMigrationStatus migration = 9;
  uint64 max_query_time_ms = 10;
  repeated ForwardCursor forward_cursors = 11;
  // Stable L1+ projection exposed to clients that query the object store
  // directly. It covers rows through direct_query_high_water only.
  repeated CatalogSegment direct_query_segments = 12;
  int64 direct_query_high_water = 13;
}

message CatalogHead {
  uint64 format_version = 1;
  string namespace = 2;
  uint64 writer_epoch = 3;
  uint64 catalog_generation = 4;
  uint64 active_table_spec_version = 5;
  ObjectRef catalog = 6;
}

// ============================================================================
// STATS SERVICE
// ============================================================================

message RegisterTableRequest {
  string namespace = 1;
  Schema schema = 2;
  // Optional retention overrides. On fresh registration, an empty
  // policy inherits the server-wide defaults. On re-register, an empty
  // policy means "no opinion" and the namespace's existing policy is
  // preserved — so an older client that doesn't know about policies
  // can't wipe a tighter policy set by a newer client.
  StoragePolicy storage_policy = 3;
  // Complete immutable specification. Fields 1-3 remain the legacy
  // registration contract and are ignored when this field is present.
  TableSpec table_spec = 4;
}

message RegisterTableResponse {
  // The schema now in force. Differs from the requested one when the server
  // merged the request as an additive-nullable extension of a previously
  // registered schema, or when the request was a subset of the existing
  // registered schema.
  Schema effective_schema = 1;
  // Policy now in force for the namespace.
  StoragePolicy effective_policy = 2;
  uint64 active_table_spec_version = 3;
  uint64 desired_table_spec_version = 4; // zero when no transition is active
  MigrationPhase transition_phase = 5;
}

message WriteRowsRequest {
  string namespace = 1;
  // Arrow IPC stream containing exactly one RecordBatch. The batch's
  // Arrow schema must be a subset of (or equal to) the registered schema:
  // every column name must exist in the registry with a matching Arrow
  // type. Missing nullable columns are filled with NULL on append.
  // Unknown column names raise SchemaValidationError. The one federation
  // exception is JWT-forwarded telemetry_v1: its server-owned hub schema wins,
  // and candidate-only nullable columns are discarded while known columns are
  // appended. Required unknown columns and known-column type conflicts still fail.
  bytes arrow_ipc = 2;
}

message WriteRowsResponse {
  int64 rows_written = 1;
}

message QueryRequest {
  // Postgres-flavored SQL passed to DuckDB. Tables in the FROM clause must
  // be registered namespaces; the server registers a DuckDB view per
  // namespace before executing the query and never rewrites the user SQL.
  string sql = 1;
}

message QueryResponse {
  // Arrow IPC stream serialization of the query result table.
  bytes arrow_ipc = 1;
  int64 row_count = 2;
}

message DropTableRequest {
  string namespace = 1;
}

message DropTableResponse {
  // Empty. Server has removed the registry entry and deleted the local
  // segment directory. GCS-archived data for the namespace is left in
  // place; callers who want it deleted must clean the bucket themselves.
}

// Metadata for one registered namespace. Names are returned in registration
// order. The privileged "log" namespace is included so dashboards can see
// every queryable surface.
//
// Stats fields (3-7) are aggregated across all parquet segments and the
// in-RAM write buffer. They cover every row currently visible to queries,
// without scanning the data — clients can use them to render namespace
// summary tables without issuing per-namespace `count(*)` queries.
message NamespaceInfo {
  string namespace = 1;
  Schema schema = 2;
  int64 row_count = 3;        // total visible rows (sealed + RAM)
  int64 byte_size = 4;        // sealed parquet bytes + RAM buffer bytes
  int64 min_seq = 5;          // 0 if empty
  int64 max_seq = 6;          // 0 if empty
  int32 segment_count = 7;    // sealed (logs_*) + in-flight (tmp_*) parquet files
  StoragePolicy storage_policy = 8;  // retention overrides; empty if all defaults
}

message ListNamespacesRequest {}

message ListNamespacesResponse {
  repeated NamespaceInfo namespaces = 1;
}

message GetTableSchemaRequest {
  string namespace = 1;
}

message GetTableSchemaResponse {
  Schema schema = 1;
}

message GetTableStatusRequest {
  string namespace = 1;
}

message GetTableStatusResponse {
  TableSpec active_table_spec = 1;
  TableSpec desired_table_spec = 2;
  TableMigrationStatus migration = 3;
  uint64 catalog_generation = 4;
}

message AbortTableMigrationRequest {
  string namespace = 1;
}

message AbortTableMigrationResponse {
  uint64 catalog_generation = 1;
  uint64 active_table_spec_version = 2;
}

service StatsService {
  rpc RegisterTable(RegisterTableRequest) returns (RegisterTableResponse);
  rpc WriteRows(WriteRowsRequest) returns (WriteRowsResponse);
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc DropTable(DropTableRequest) returns (DropTableResponse);
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
  rpc GetTableSchema(GetTableSchemaRequest) returns (GetTableSchemaResponse);
  rpc GetTableStatus(GetTableStatusRequest) returns (GetTableStatusResponse);
  rpc AbortTableMigration(AbortTableMigrationRequest) returns (AbortTableMigrationResponse);
}
