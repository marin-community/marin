[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-harbor-qemu"
version = "0.1.0"
description = "External Harbor Bash agent with QEMU, Docker, and ShellSim machine backends"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
qemu = ["quicksand-qemu==0.5.12"]
shellsim = ["shellsim==0.1.10"]

[project.scripts]
harbor-qemu-stage = "harbor_qemu.backends.qemu.bundle:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_qemu"]

[tool.hatch.build]
artifacts = ["src/harbor_qemu/backends/qemu/guest/init", "src/harbor_qemu/backends/qemu/guest/disk-init", "src/harbor_qemu/backends/qemu/guest/pty-agent.c"]

[dependency-groups]
test = ["pytest>=8"]
