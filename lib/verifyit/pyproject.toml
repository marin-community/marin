[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-verifyit"
version = "0.1.0"
description = "One grader for TaskTrove Clean tasks: reads tests/verifier.toml, writes /logs/verifier/reward.json."
readme = "README.md"
requires-python = ">=3.11"
# Grading dependencies remain optional.
dependencies = ["tomli-w>=1.2"]

[project.scripts]
verifyit = "verifyit.grade:main"

[project.optional-dependencies]
math = ["math-verify>=0.9", "sympy>=1.12"]
schema = ["jsonschema>=4.20", "pyyaml>=6.0"]
judge = ["openai>=1.59.9"]
reasoning-gym = ["reasoning-gym>=0.1.25"]
all = ["marin-verifyit[math,schema,judge,reasoning-gym]"]

[dependency-groups]
test = [
    "pytest>=8.3.2",
    "pytest-timeout",
    "pytest-xdist",
    "pytest-json-report>=1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/verifyit"]

[tool.hatch.build.targets.sdist]
only-include = ["src/verifyit"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "."]
timeout = 120
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--import-mode=importlib -m 'not slow and not integration and not data_integration and not cluster and not requires_cluster and not docker and not manual'"
markers = [
    "slow: long-running test",
    "integration: external service",
    "data_integration: external data",
    "cluster: live cluster",
    "requires_cluster: live cluster",
    "docker: Docker daemon",
    "manual: explicit validation",
]
