<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>Zephyr coordinator</title>
<style>
  :root { color-scheme: light dark; font: 14px system-ui, sans-serif; --surface: #fff; --background: #f5f7f8; --ink: #17262d; --muted: #5d6c73; --line: #d9e0e3; --accent: #136d78; --good: #28765c; --active: #b46716; --bad: #b84343; --idle: #9eaeb5; }
  * { box-sizing: border-box; }
  body { max-width: 1500px; margin: auto; padding: 28px; background: var(--background); color: var(--ink); }
  h1 { font-size: 26px; letter-spacing: -.03em; margin: 0; }
  h2 { font-size: 17px; margin: 0 0 14px; }
  h3 { font-size: 15px; margin: 0; overflow-wrap: anywhere; }
  p { line-height: 1.45; }
  header { display: flex; align-items: start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  header p { margin: 4px 0 0; }
  .actions, nav, form, footer { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  button, select, input { font: inherit; padding: 7px 10px; }
  button, a { cursor: pointer; }
  button { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; color: inherit; }
  button:hover, button:focus-visible, .pipeline-card:hover, .pipeline-card:focus-visible { border-color: var(--accent); }
  a { color: var(--accent); }
  nav { border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  nav a { display: inline-block; padding: 10px 12px; text-decoration: none; }
  nav a[aria-current] { color: var(--ink); font-weight: 700; border-bottom: 3px solid var(--accent); }
  #error, #failure { color: var(--bad); white-space: pre-wrap; }
  .muted, dt { color: var(--muted); }
  .eyebrow { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
  .section-heading, .card-heading { display: flex; align-items: start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .section-heading { margin-bottom: 14px; }
  .section-heading p, .card-heading p { margin: 4px 0 0; }
  .pipeline-list { display: grid; gap: 14px; }
  .pipeline-card, .panel, .chart { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
  .pipeline-card { display: block; width: 100%; min-width: 0; padding: 18px; text-align: left; box-shadow: 0 2px 7px #152d3610; color: inherit; text-decoration: none; }
  .pipeline-card .pipeline-bar { margin-top: 16px; }
  .pipeline-bar { display: flex; gap: 6px; max-width: 100%; padding: 2px 0 5px; }
  .pipeline-step { flex: 1 1 0; min-width: 0; }
  .pipeline-step-label { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .pipeline-step-state { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; text-transform: capitalize; }
  .pipeline-progress { height: 6px; margin-top: 8px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .pipeline-progress span { display: block; height: 100%; background: var(--idle); }
  .pipeline-step.succeeded .pipeline-progress span { background: var(--good); }
  .pipeline-step.running .pipeline-progress span { background: var(--active); }
  .pipeline-step.failed .pipeline-progress span { background: var(--bad); }
  .panel { padding: 20px; margin-bottom: 18px; }
  .panel > h2:not(:first-child) { margin-top: 22px; }
  #content > button { margin-bottom: 12px; }
  .phase { display: inline-flex; align-items: center; gap: 7px; font-weight: 650; text-transform: capitalize; white-space: nowrap; }
  .phase::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--idle); }
  .phase.running::before { background: var(--active); }
  .phase.succeeded::before { background: var(--good); }
  .phase.failed::before { background: var(--bad); }
  .stage-flow { display: flex; gap: 8px; align-items: stretch; max-width: 100%; overflow-x: auto; padding-bottom: 4px; }
  .stage-card { flex: 1 0 150px; min-width: 150px; max-width: 270px; padding: 11px; border: 1px solid var(--line); border-top: 4px solid var(--idle); border-radius: 5px; background: var(--background); }
  .stage-card.running { border-top-color: var(--active); }
  .stage-card.succeeded { border-top-color: var(--good); }
  .stage-card.failed { border-top-color: var(--bad); }
  .stage-card.auxiliary { border-style: dashed; }
  .stage-card small { color: var(--muted); }
  .stage-card strong { display: block; margin: 4px 0; overflow-wrap: anywhere; }
  .stage-card .stage-state { color: var(--muted); text-transform: capitalize; }
  .stage-arrow { align-self: center; color: var(--muted); font-size: 20px; flex: none; }
  .heatmap { display: grid; grid-template-columns: repeat(32, minmax(0, 1fr)); gap: 2px; margin-top: 9px; }
  .heat-cell { height: 13px; border-radius: 2px; background: var(--idle); }
  .heat-cell.succeeded { background: var(--good); }
  .heat-cell.running { background: var(--active); }
  .heat-cell.failed { background: var(--bad); }
  .heatmap-key { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .heatmap-key span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 1px; margin-right: 5px; background: var(--idle); }
  .heatmap-key .done::before { background: var(--good); }
  .heatmap-key .work::before { background: var(--active); }
  .heatmap-key .stop::before { background: var(--bad); }
  .stage-sparkline { display: block; margin-top: 9px; }
  .stage-sparkline svg { display: block; height: 30px; }
  .stage-sparkline small { display: block; }
  .shard-grid { display: grid; grid-template-columns: repeat(32, minmax(0, 1fr)); gap: 4px; max-width: 720px; margin: 14px 0; }
  .shard-tile { height: 19px; min-width: 0; padding: 0; border: 0; border-radius: 2px; background: var(--idle); }
  .shard-tile.succeeded { background: var(--good); }
  .shard-tile.running { background: var(--active); }
  .shard-tile.stopped { background: var(--bad); }
  .shard-tile:focus-visible, .shard-tile.selected { outline: 2px solid var(--ink); outline-offset: 2px; }
  .shard-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
  .shard-controls input { width: 80px; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); gap: 18px; margin: 20px 0 0; }
  .summary div { min-width: 0; }
  dt { font-size: 12px; }
  dd { margin: 4px 0 0; font-size: 18px; font-weight: 650; overflow-wrap: anywhere; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .chart { margin: 0; padding: 16px; }
  svg { width: 100%; height: auto; overflow: visible; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; }
  .legend span { border-bottom: 3px solid; }
  #content { min-width: 0; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 16px; background: var(--surface); }
  th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  th { font-weight: 600; white-space: nowrap; }
  tbody tr:hover { background: var(--background); }
  #filters { margin-bottom: 16px; }
  #updated { margin-top: 20px; font-size: 12px; }
  [hidden] { display: none !important; }
  @media (max-width: 650px) { body { padding: 14px; } .pipeline-card, .panel { padding: 14px; } .stage-card { flex-basis: 140px; min-width: 140px; } .shard-grid { grid-template-columns: repeat(16, minmax(0, 1fr)); } th, td { padding: 8px 5px; } }
  @media (prefers-color-scheme: dark) { :root { --surface: #1c2a30; --background: #111e24; --ink: #e8eff1; --muted: #b4c0c5; --line: #35454c; --accent: #72c6d0; --good: #54ae85; --active: #e0a254; --bad: #e68181; --idle: #677a83; } }
</style>
</head>
<body>
<header>
  <div><h1>Zephyr coordinator</h1><p id="phase" class="muted">Loading pipelines</p></div>
  <div class="actions"><label><input id="live" type="checkbox" checked> Live</label><button id="refresh" type="button">Refresh</button><a id="coordinator" target="_top" hidden>Coordinator task</a></div>
</header>
<p id="error" role="alert" hidden></p>
<p id="failure" role="alert" hidden></p>
<nav aria-label="Views"><a href="#overview">Overview</a><a href="#counters" id="counters-link">Counters</a><a href="#workers">Workers</a></nav>
<form id="filters" hidden>
  <label>Search <input id="search" type="search"></label>
  <label id="stage-filter">Stage <select id="stage" aria-label="Stage"><option value="">All stages</option></select></label>
  <label>Sort <select id="sort" aria-label="Sort"></select></label>
  <label><input id="descending" type="checkbox"> Descending</label>
  <button type="submit">Apply</button>
</form>
<main id="content" aria-live="polite"></main>
<footer id="pager" hidden><span id="range"></span><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button></footer>
<p id="updated" class="muted"></p>
<script>
function startDashboard() {
  const byId = (id) => document.getElementById(id);
  const number = (value) => new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 }).format(value);
  const pageSize = 50;
  const shardPageSize = 256;
  const maxHeatCells = 32;
  const refreshDelay = 5000;
  const requestTimeout = 15000;
  const chartLeft = 65;
  const colors = ['#4079c9', '#be6a28', '#40956d', '#a46cc2', '#cf556c', '#718d26'];
  const sortFields = {
    counters: [['name', 'Name'], ['stage', 'Stage'], ['value', 'Value'], ['aggregation', 'Aggregation'], ['observations', 'Samples']],
    workers: [['worker_id', 'Worker'], ['state', 'State'], ['active_shards', 'Active shards'], ['cpu', 'CPU'], ['memory', 'Memory'], ['last_seen', 'Heartbeat age']],
  };
  let executionId = new URL(location.href).searchParams.get('execution_id') || '';
  let view;
  let offset = 0;
  let timer;
  let request;
  let metricCache;
  let shardOffset = 0;
  let shardStage = '';
  let selectedShardIndex = null;

  function bytes(value) {
    const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
    let unit = 0;
    while (Math.abs(value) >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
    return `${number(value)} ${units[unit]}`;
  }

  function element(tag, text) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function options(select, choices, selected) {
    select.replaceChildren(...choices.map(([value, label]) => new Option(label, value)));
    select.value = choices.some(([value]) => value === selected) ? selected : choices[0]?.[0] || '';
  }

  function taskLink(taskId, label) {
    const jobId = taskId.slice(0, taskId.lastIndexOf('/'));
    const link = element('a', label);
    link.href = `${location.origin}/#/job/${encodeURIComponent(jobId)}/task/${encodeURIComponent(taskId)}`;
    link.target = '_top';
    return link;
  }

  function table(headers, rows) {
    const result = element('table');
    const head = result.createTHead().insertRow();
    for (const label of headers) head.append(element('th', label));
    const body = result.createTBody();
    for (const values of rows) {
      const row = body.insertRow();
      for (const value of values) {
        const cell = row.insertCell();
        if (value instanceof Node) cell.append(value);
        else cell.textContent = value;
      }
    }
    if (!rows.length) {
      const cell = body.insertRow().insertCell();
      cell.colSpan = headers.length;
      cell.textContent = 'No data for this view.';
    }
    const scroll = element('div');
    scroll.className = 'table-scroll';
    scroll.append(result);
    return scroll;
  }

  function phaseLabel(phase) {
    return phase.replaceAll('_', ' ');
  }

  function badge(phase) {
    const label = element('span', phaseLabel(phase));
    label.className = `phase ${phase}`;
    return label;
  }

  function heatmap(node, state) {
    const cells = element('div');
    cells.className = 'heatmap';
    const buckets = state.shard_buckets.length ? state.shard_buckets : Array.from({ length: Math.min(node.output_shards || 1, maxHeatCells) }, () => ({ completed: state.state === 'succeeded' ? 1 : 0, running: 0, pending: state.state === 'succeeded' ? 0 : 1 }));
    for (const bucket of buckets) {
      const cell = element('span');
      cell.className = 'heat-cell';
      const kinds = [bucket.completed, bucket.running, bucket.pending].filter(Boolean).length;
      if (state.state === 'failed') cell.classList.add('failed');
      else if (kinds > 1) {
        const total = bucket.completed + bucket.running + bucket.pending;
        const done = 100 * bucket.completed / total;
        const work = 100 * (bucket.completed + bucket.running) / total;
        cell.style.background = `linear-gradient(90deg, var(--good) ${done}%, var(--active) ${done}% ${work}%, var(--idle) ${work}%)`;
      }
      else if (bucket.completed) cell.classList.add('succeeded');
      else if (bucket.running) cell.classList.add('running');
      cell.title = `${bucket.completed} complete · ${bucket.running} running · ${bucket.pending} pending`;
      cells.append(cell);
    }
    cells.setAttribute('aria-label', state.total_shards ? `${state.completed_shards} of ${state.total_shards} shards complete` : `${phaseLabel(state.state)} stage`);
    cells.setAttribute('role', 'img');
    return cells;
  }

  function stageFlow(plan, status) {
    const flow = element('div');
    flow.className = 'stage-flow';
    const states = new Map(status.node_statuses.map((item) => [item.node_id, item]));
    const appendStage = (node, index, target) => {
      if (index && !node.auxiliary) { const arrow = element('span', '→'); arrow.className = 'stage-arrow'; arrow.setAttribute('aria-hidden', 'true'); target.append(arrow); }
      const state = states.get(node.node_id) || { state: 'pending', shard_buckets: [], total_shards: 0, completed_shards: 0 };
      const card = element('div');
      card.className = `stage-card ${state.state}${node.auxiliary ? ' auxiliary' : ''}`;
      const type = node.stage_type.replaceAll('_', ' ').toLowerCase();
      card.append(element('small', node.auxiliary ? `Join input · ${type}` : type), element('strong', node.label), element('span', phaseLabel(state.state)));
      card.lastChild.className = 'stage-state';
      card.append(element('small', state.total_shards ? ` · ${state.completed_shards}/${state.total_shards} shards` : ` · ${node.output_shards} output shards`));
      card.append(heatmap(node, state));
      if (node.stage_name && node.stage_type !== 'RESHARD') {
        const sparkline = element('span');
        sparkline.className = 'stage-sparkline';
        sparkline.dataset.stageName = node.stage_name;
        card.append(sparkline);
      }
      target.append(card);
    };
    plan.nodes.filter((node) => !node.auxiliary).forEach((node, index) => appendStage(node, index, flow));
    const auxiliary = plan.nodes.filter((node) => node.auxiliary);
    if (!auxiliary.length) return flow;
    const group = element('div');
    const label = element('p', 'Join inputs');
    label.className = 'eyebrow';
    const branches = element('div');
    branches.className = 'stage-flow';
    auxiliary.forEach((node, index) => appendStage(node, index, branches));
    group.append(flow, label, branches);
    return group;
  }

  function pipelineBar(plan, status) {
    const bar = element('div');
    bar.className = 'pipeline-bar';
    bar.setAttribute('aria-label', 'Pipeline stage progress');
    const states = new Map(status.node_statuses.map((item) => [item.node_id, item]));
    for (const node of plan.nodes.filter((item) => !item.auxiliary)) {
      const state = states.get(node.node_id) || { state: 'pending', completed_shards: 0, total_shards: 0 };
      const current = node.stage_name && node.stage_name === status.current_stage;
      const complete = current ? status.completed_shards : state.completed_shards;
      const total = current ? status.total_shards : state.total_shards;
      const fraction = state.state === 'succeeded' ? 1 : total ? complete / total : 0;
      const step = element('div');
      step.className = `pipeline-step ${state.state}`;
      step.title = `${node.label}: ${phaseLabel(state.state)}${total ? ` · ${complete}/${total} shards` : ''}`;
      const label = element('span', node.label);
      label.className = 'pipeline-step-label';
      const detail = element('span', total ? `${complete}/${total} shards` : phaseLabel(state.state));
      detail.className = 'pipeline-step-state';
      const track = element('div');
      track.className = 'pipeline-progress';
      const fill = element('span');
      fill.style.width = `${Math.max(0, Math.min(100, fraction * 100))}%`;
      track.append(fill);
      step.append(label, detail, track);
      bar.append(step);
    }
    return bar;
  }

  function summary(status) {
    const active = status.worker_states.find((worker) => worker.state === 'active')?.count || 0;
    const elapsed = status.started_at_ms ? `${number(((status.finished_at_ms || Date.now()) - status.started_at_ms) / 1000)} s` : '—';
    const values = [
      ['Current stage', status.current_stage || '—'], ['Shards', `${status.completed_shards}/${status.total_shards}`],
      ['Workers', `${active}/${status.expected_workers}`], ['CPU', `${number(status.resources.cpu_cores)} cores`],
      ['Memory', bytes(status.resources.memory_bytes)], ['Elapsed', elapsed],
      ['In flight / queued', `${status.in_flight_shards} / ${status.queued_shards}`], ['Retries', status.retries],
    ];
    const list = element('dl');
    list.className = 'summary';
    list.append(...values.map(([label, value]) => {
      const item = element('div');
      item.append(element('dt', label), element('dd', value));
      return item;
    }));
    return list;
  }

  function selectPipeline(id) {
    executionId = id;
    offset = 0;
    shardOffset = 0;
    shardStage = '';
    selectedShardIndex = null;
    const url = new URL(location.href);
    if (id) url.searchParams.set('execution_id', id);
    else url.searchParams.delete('execution_id');
    url.hash = 'overview';
    history.pushState(null, '', url);
    selectView();
  }

  function renderFleet(pipelines) {
    const content = byId('content');
    const heading = element('div');
    heading.className = 'section-heading';
    const title = element('div');
    title.append(element('span', 'ALL PIPELINES'), element('h2', `${pipelines.length} pipeline${pipelines.length === 1 ? '' : 's'}`));
    title.firstChild.className = 'eyebrow';
    const counts = new Map();
    for (const item of pipelines) counts.set(item.status.phase, (counts.get(item.status.phase) || 0) + 1);
    heading.append(title, element('p', [...counts].map(([phase, count]) => `${count} ${phaseLabel(phase)}`).join(' · ')));
    const list = element('div');
    list.className = 'pipeline-list';
    for (const item of pipelines) {
      const card = element('a');
      card.className = 'pipeline-card';
      const url = new URL(location.href);
      url.searchParams.set('execution_id', item.status.execution_id);
      url.hash = 'overview';
      card.href = url.href;
      card.onclick = (event) => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        selectPipeline(item.status.execution_id);
      };
      const head = element('div');
      head.className = 'card-heading';
      const name = element('div');
      name.append(element('h3', item.status.execution_id));
      if (item.plan.pipeline_name) name.append(element('p', item.plan.pipeline_name));
      name.append(element('p', `${item.status.current_stage || 'No active stage'} · ${item.status.completed_shards}/${item.status.total_shards} current-stage shards`));
      name.lastChild.className = 'muted';
      head.append(name, badge(item.status.phase));
      card.append(head, pipelineBar(item.plan, item.status));
      const auxiliary = item.plan.nodes.filter((node) => node.auxiliary).length;
      if (auxiliary) {
        const note = element('small', `${auxiliary} join input stage${auxiliary === 1 ? '' : 's'} in detail`);
        note.className = 'muted';
        card.append(note);
      }
      list.append(card);
    }
    if (!pipelines.length) list.append(element('p', 'No pipelines are currently held by this coordinator. Completed executions disappear after the driver releases them.'));
    content.replaceChildren(heading, list);
  }

  function chart(points, field, title, format) {
    const figure = element('figure');
    figure.className = 'chart';
    figure.append(element('h2', title));
    if (!points.length) { figure.append(element('p', 'No samples yet.')); return figure; }
    const svgNode = (tag, attrs) => {
      const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      return node;
    };
    const svg = svgNode('svg', { viewBox: '0 0 500 200', role: 'img', 'aria-label': title });
    const times = points.map((point) => point.timestamp_ms);
    const start = Math.min(...times), end = Math.max(...times);
    const high = Math.max(1, ...points.map((point) => point[field]));
    const x = (time) => chartLeft + 425 * (time - start) / Math.max(1, end - start);
    const y = (value) => 165 - 145 * value / high;
    for (const value of [0, high / 2, high]) {
      svg.append(svgNode('line', { x1: chartLeft, x2: 490, y1: y(value), y2: y(value), stroke: '#8885' }));
      const label = svgNode('text', { x: 60, y: y(value) + 4, 'text-anchor': 'end', fill: 'currentColor', 'font-size': 11 });
      label.textContent = format(value);
      svg.append(label);
    }
    const legend = element('div');
    legend.className = 'legend';
    const stages = [...new Set(points.map((point) => point.stage))];
    stages.forEach((stage, index) => {
      const samples = points.filter((point) => point.stage === stage).sort((a, b) => a.timestamp_ms - b.timestamp_ms);
      const color = colors[index % colors.length];
      svg.append(svgNode('polyline', { points: samples.map((point) => `${x(point.timestamp_ms)},${y(point[field])}`).join(' '), fill: 'none', stroke: color, 'stroke-width': 2 }));
      for (const point of samples) {
        const dot = svgNode('circle', { cx: x(point.timestamp_ms), cy: y(point[field]), r: 3, fill: color });
        const tip = svgNode('title', {});
        tip.textContent = `${stage}: ${format(point[field])} at ${new Date(point.timestamp_ms).toLocaleTimeString()}`;
        dot.append(tip);
        svg.append(dot);
      }
      const label = element('span', stage || 'pipeline');
      label.style.borderColor = color;
      legend.append(label);
    });
    const timeRange = element('p', `${new Date(start).toLocaleTimeString()} – ${new Date(end).toLocaleTimeString()}`);
    timeRange.className = 'muted';
    figure.append(svg, timeRange, legend);
    return figure;
  }

  function renderStageSparklines(points) {
    for (const container of document.querySelectorAll('.stage-sparkline')) {
      const stage = container.dataset.stageName;
      const samples = points.filter((point) => point.stage === stage).sort((a, b) => a.timestamp_ms - b.timestamp_ms);
      container.replaceChildren();
      if (samples.length < 2 || !samples.some((point) => point.item_rate > 0)) continue;
      const rates = samples.map((point) => point.item_rate);
      const high = Math.max(...rates);
      const low = Math.min(...rates);
      const y = (rate) => high === low ? 15 : 26 - 22 * (rate - low) / (high - low);
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 120 30');
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', `${stage}: latest ${number(rates.at(-1))} items per second, peak ${number(high)}`);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      line.setAttribute('points', samples.map((point, index) => `${120 * index / (samples.length - 1)},${y(point.item_rate)}`).join(' '));
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', 'var(--accent)');
      line.setAttribute('stroke-width', '2');
      svg.append(line);
      container.append(svg, element('small', `${number(rates.at(-1))} items/s · peak ${number(high)}`));
    }
  }

  function renderFocused(item) {
    const status = item.status;
    const scrollPositions = [...byId('content').querySelectorAll('.stage-flow')].map((flow) => flow.scrollLeft);
    const back = element('button', '← All pipelines');
    back.type = 'button';
    back.onclick = () => selectPipeline('');
    const panel = element('section');
    panel.className = 'panel';
    const head = element('div');
    head.className = 'card-heading';
    const name = element('div');
    name.append(element('h2', item.plan.pipeline_name || status.execution_id), element('p', status.execution_id));
    name.lastChild.className = 'muted';
    head.append(name, badge(status.phase));
    panel.append(head, summary(status), element('h2', 'Pipeline stages'), stageFlow(item.plan, status));
    const key = element('p');
    key.className = 'heatmap-key';
    for (const [label, className] of [['Complete', 'done'], ['Running', 'work'], ['Pending', 'wait']]) {
      const part = element('span', label);
      part.className = className;
      key.append(part);
    }
    panel.append(key);
    const shardPanel = element('section');
    shardPanel.className = 'panel';
    shardPanel.append(element('h2', 'Current-stage shards'));
    const shardArea = element('div', 'Loading shard status…');
    shardArea.id = 'shard-area';
    shardPanel.append(shardArea);
    const metricTitle = element('h2', 'Metrics');
    metricTitle.style.marginTop = '24px';
    const metricsArea = element('div');
    metricsArea.id = 'metrics-area';
    byId('content').replaceChildren(back, panel, shardPanel, metricTitle, metricsArea);
    [...panel.querySelectorAll('.stage-flow')].forEach((flow, index) => { flow.scrollLeft = scrollPositions[index] || 0; });
    byId('failure').textContent = status.fatal_error;
    byId('failure').hidden = !status.fatal_error;
  }

  function renderMetrics(metrics) {
    const charts = element('div');
    charts.className = 'charts';
    charts.append(
      chart(metrics.points, 'item_rate', 'Items / second', number),
      chart(metrics.points, 'byte_rate', 'Bytes / second', bytes),
      chart(metrics.points, 'cpu_cores', 'CPU cores', number),
      chart(metrics.points, 'memory_bytes', 'Memory', bytes),
    );
    const context = element('p', '15-second averages, including work from failed attempts. Memory is estimated between samples.');
    byId('metrics-area').replaceChildren(...(metrics.warning ? [element('p', metrics.warning)] : []), context, charts);
    renderStageSparklines(metrics.points);
  }

  function renderShards(page) {
    const area = byId('shard-area');
    if (!page.total) {
      area.replaceChildren(element('p', 'No shards in the current stage.'));
      return;
    }
    const range = element('p', `${page.stage_name} · shards ${shardOffset + 1}–${shardOffset + page.shards.length} of ${page.total}`);
    range.className = 'muted';
    const grid = element('div');
    grid.className = 'shard-grid';
    const detail = element('p', 'Select a shard to see its status.');
    detail.className = 'muted';
    for (const shard of page.shards) {
      const tile = element('button');
      tile.type = 'button';
      tile.className = `shard-tile ${shard.state}`;
      tile.title = `Shard ${shard.index}: ${shard.state}`;
      tile.setAttribute('aria-label', tile.title);
      if (shard.index === selectedShardIndex) {
        detail.textContent = tile.title;
        tile.classList.add('selected');
      }
      tile.onclick = () => {
        selectedShardIndex = shard.index;
        grid.querySelector('.selected')?.classList.remove('selected');
        tile.classList.add('selected');
        detail.textContent = tile.title;
      };
      grid.append(tile);
    }
    const key = element('p');
    key.className = 'heatmap-key';
    for (const [label, className] of [['Complete', 'done'], ['Running', 'work'], ['Pending', 'wait'], ['Stopped', 'stop']]) {
      const part = element('span', label);
      part.className = className;
      key.append(part);
    }
    const controls = element('div');
    controls.className = 'shard-controls';
    if (page.total > shardPageSize) {
      const previous = element('button', 'Previous');
      previous.type = 'button';
      previous.disabled = shardOffset === 0;
      previous.onclick = () => { shardOffset = Math.max(0, shardOffset - shardPageSize); void refresh(); };
      const next = element('button', 'Next');
      next.type = 'button';
      next.disabled = shardOffset + page.shards.length >= page.total;
      next.onclick = () => { shardOffset += shardPageSize; void refresh(); };
      const jump = element('input');
      jump.type = 'number';
      jump.min = '0';
      jump.max = String(page.total - 1);
      jump.placeholder = 'Shard #';
      jump.setAttribute('aria-label', 'Shard number');
      const go = element('button', 'Go');
      go.type = 'button';
      go.onclick = () => {
        const index = Number(jump.value);
        if (!jump.value || !Number.isInteger(index) || index < 0 || index >= page.total) return;
        shardOffset = Math.floor(index / shardPageSize) * shardPageSize;
        void refresh();
      };
      controls.append(previous, next, jump, go);
    }
    area.replaceChildren(range, grid, detail, key, controls);
  }

  function renderPage(data) {
    let headers, rows;
    if (view === 'counters') {
      options(byId('stage'), [['', 'All stages'], ...data.stages.map((stage) => [stage, stage])], byId('stage').value);
      headers = ['Name', 'Stage', 'Value', 'Aggregation', 'Samples'];
      rows = data.counters.map((counter) => [counter.name, counter.stage || 'pipeline', number(counter.value), counter.aggregation, counter.observations]);
    } else {
      headers = ['Worker', 'State', 'Active shards', 'CPU', 'Memory', 'Heartbeat age', 'Task'];
      rows = data.workers.map((worker) => [
        worker.worker_id, worker.state, worker.assignments.map((item) => `${item.execution_id}:${item.shard}`).join(', ') || '—',
        `${number(worker.cpu_percent)}%`, bytes(worker.memory_bytes), `${number(worker.last_seen_age_seconds)} s`,
        worker.task_id ? taskLink(worker.task_id, 'Open task') : '—',
      ]);
    }
    byId('content').replaceChildren(table(headers, rows));
    const count = rows.length;
    byId('range').textContent = `${count ? offset + 1 : 0}–${offset + count} of ${data.total}`;
    byId('previous').disabled = offset === 0;
    byId('next').disabled = offset + count >= data.total;
  }

  async function refresh() {
    clearTimeout(timer);
    request?.abort();
    const current = request = new AbortController();
    const timeout = setTimeout(() => current.abort(), requestTimeout);
    async function get(path, query = {}) {
      const response = await fetch(`api/${path}?${new URLSearchParams(query)}`, { signal: current.signal });
      if (!response.ok) throw new Error(`${path}: ${response.status} ${response.statusText}`);
      return response.json();
    }
    try {
      const overview = await get('overview');
      if (current !== request) return;
      const selected = overview.pipelines.find((item) => item.status.execution_id === executionId);
      if (executionId && !selected) {
        executionId = '';
        const url = new URL(location.href);
        url.searchParams.delete('execution_id');
        history.replaceState(null, '', url);
      }
      byId('counters-link').hidden = !selected;
      byId('filters').hidden = byId('pager').hidden = !sortFields[view] || (view === 'counters' && !selected);
      byId('phase').textContent = selected ? `${selected.plan.pipeline_name || executionId} · ${phaseLabel(selected.status.phase)}` : `${overview.pipelines.length} pipelines held by this coordinator`;
      const coordinatorTask = selected?.status.coordinator_task_id || overview.pipelines[0]?.status.coordinator_task_id;
      byId('coordinator').hidden = !coordinatorTask;
      if (coordinatorTask) byId('coordinator').href = taskLink(coordinatorTask, '').href;
      byId('failure').hidden = true;
      if (view === 'overview') {
        if (selected) {
          if (selected.status.current_stage !== shardStage) {
            shardStage = selected.status.current_stage;
            shardOffset = 0;
            selectedShardIndex = null;
          }
          renderFocused(selected);
          renderMetrics(metricCache?.executionId === executionId ? metricCache.data : { points: [], warning: 'Loading metrics…' });
          const metricsRequest = get('metrics', { execution_id: executionId, max_points: 300 }).then(
            (metrics) => {
              if (current !== request) return;
              metricCache = { executionId, data: metrics };
              renderMetrics(metrics);
            },
            (error) => {
              if (current !== request) return;
              renderMetrics({ points: [], warning: current.signal.aborted ? 'Metrics request timed out.' : `Metrics unavailable: ${error.message}` });
            },
          );
          const shardsRequest = get('shards', { execution_id: executionId, offset: shardOffset, limit: shardPageSize }).then(
            (page) => { if (current === request) renderShards(page); },
            (error) => { if (current === request) byId('shard-area').textContent = `Shard status unavailable: ${error.message}`; },
          );
          await Promise.all([metricsRequest, shardsRequest]);
        }
        else renderFleet(overview.pipelines);
      } else if (view === 'counters' && !selected) {
        byId('content').replaceChildren(element('p', 'Choose a pipeline from Overview to inspect its counters.'));
      } else {
        const query = view === 'workers' ? {} : { execution_id: executionId };
        Object.assign(query, {
          search: byId('search').value, stage: byId('stage').value, sort_field: byId('sort').value,
          sort_descending: byId('descending').checked, offset, limit: pageSize,
        });
        const page = await get(view, query);
        if (current !== request) return;
        renderPage(page);
      }
      if (current !== request) return;
      byId('error').hidden = true;
      byId('updated').textContent = `Updated ${new Date().toLocaleTimeString()}`;
    } catch (error) {
      if (current !== request) return;
      byId('error').textContent = current.signal.aborted ? 'The request timed out. Select Refresh to try again.' : error.message;
      byId('error').hidden = false;
      byId('content').replaceChildren();
      byId('phase').textContent = 'Data unavailable';
      byId('failure').hidden = true;
    } finally {
      clearTimeout(timeout);
      if (current === request) {
        request = null;
        if (byId('live').checked) timer = setTimeout(refresh, refreshDelay);
      }
    }
  }

  function selectView() {
    view = ['overview', 'counters', 'workers'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'overview';
    offset = 0;
    byId('search').value = '';
    byId('stage').value = '';
    byId('descending').checked = false;
    byId('filters').hidden = byId('pager').hidden = !sortFields[view];
    byId('stage-filter').hidden = view !== 'counters';
    options(byId('sort'), sortFields[view] || [], '');
    for (const link of document.querySelectorAll('nav a')) {
      if (link.hash === `#${view}`) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    }
    byId('content').replaceChildren();
    void refresh();
  }

  byId('filters').onsubmit = (event) => { event.preventDefault(); offset = 0; void refresh(); };
  byId('stage').onchange = () => { offset = 0; void refresh(); };
  byId('previous').onclick = () => { offset = Math.max(0, offset - pageSize); void refresh(); };
  byId('next').onclick = () => { offset += pageSize; void refresh(); };
  byId('refresh').onclick = () => void refresh();
  byId('live').onchange = () => { clearTimeout(timer); if (byId('live').checked) void refresh(); };
  document.querySelector('nav').onclick = (event) => {
    const link = event.target.closest('a');
    if (!link) return;
    event.preventDefault();
    location.hash = link.hash;
  };
  window.addEventListener('hashchange', selectView);
  window.addEventListener('popstate', () => { executionId = new URL(location.href).searchParams.get('execution_id') || ''; selectView(); });
  selectView();
}
startDashboard();
</script>
</body>
</html>
