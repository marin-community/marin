edition = "2023";
package iris.exec_gateway;

// Grants travel only between the controller and the caller, never into task Pods.
message OpenRequest { string grant = 1; }
message OpenResponse { string session_id = 1; }
message SendRequest {
  string grant = 1;
  string session_id = 2;
  bytes stdin = 3;
  bool eof = 4;
}
message SendResponse {}
message ReceiveRequest {
  string grant = 1;
  string session_id = 2;
  uint32 max_bytes = 3;
  uint32 wait_ms = 4;
}
message ReceiveResponse {
  bytes stdout = 1;
  bytes stderr = 2;
  bool exited = 3;
  int32 exit_code = 4;
  string error = 5;
}
message CloseRequest { string grant = 1; string session_id = 2; }
message CloseResponse {}
service ExecGatewayService {
  rpc Open(OpenRequest) returns (OpenResponse);
  rpc Send(SendRequest) returns (SendResponse);
  rpc Receive(ReceiveRequest) returns (ReceiveResponse);
  rpc CloseSession(CloseRequest) returns (CloseResponse);
}
