edition = "2023";

package iris.resource;

import "google/protobuf/any.proto";

option features.field_presence = EXPLICIT;

message ResourceRequest {
  string resource_type = 1;
  google.protobuf.Any input = 2;
}

message Resource {
  google.protobuf.Any body = 1;
}

message PageInfo {
  int64 total_count = 1;
  bool has_more = 2;
}

message GetResponse {
  Resource resource = 1;
}

message ListResponse {
  repeated Resource resources = 1;
  PageInfo page = 2;
}

message BatchGetResponse {
  repeated Resource resources = 1;
}

service ResourceService {
  rpc Get(ResourceRequest) returns (GetResponse);
  rpc List(ResourceRequest) returns (ListResponse);
  rpc BatchGet(ResourceRequest) returns (BatchGetResponse);
}
