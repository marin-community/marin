edition = "2023";

package iris.resource;

import "google/protobuf/any.proto";

option features.field_presence = EXPLICIT;

message ResourceRequest {
  string resource_type = 1;
  google.protobuf.Any input = 2;
}

message ResourceResponse {
  google.protobuf.Any output = 1;
}

service ResourceService {
  rpc Get(ResourceRequest) returns (ResourceResponse);
  rpc List(ResourceRequest) returns (ResourceResponse);
  rpc BatchGet(ResourceRequest) returns (ResourceResponse);
}
