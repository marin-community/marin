edition = "2023";

package iris.resource;

import "resource.proto";
import "resource_identity.proto";
import "time.proto";

option features.field_presence = EXPLICIT;

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_PENDING = 1;
  TASK_STATE_BUILDING = 2;
  TASK_STATE_RUNNING = 3;
  TASK_STATE_SUCCEEDED = 4;
  TASK_STATE_FAILED = 5;
  TASK_STATE_KILLED = 6;
  TASK_STATE_WORKER_FAILED = 7;
  TASK_STATE_UNSCHEDULABLE = 8;
  TASK_STATE_ASSIGNED = 9;
  TASK_STATE_PREEMPTED = 10;
  TASK_STATE_COSCHED_FAILED = 11;
  TASK_STATE_MISSING = 12;
}

message TaskQuery {
  ResourceKey job = 1;
  string job_id_prefix = 2;
  repeated TaskState states = 3;
  string backend_id = 4;
  string authority_cluster_id = 5;
  string execution_cluster_id = 6;
  PageRequest page = 7;
}

message TaskSummary {
  TaskIdentity identity = 1;
  JobIdentity job = 2;
  int32 task_index = 3;
  TaskState state = 4;
  string execution_cluster_id = 5;
  string backend_id = 6;
  AttemptIdentity current_attempt = 7;
  NodeIdentity current_node = 8;
  int32 failure_count = 9;
  int32 preemption_count = 10;
  iris.time.Timestamp submitted_at = 11;
  iris.time.Timestamp started_at = 12;
  iris.time.Timestamp finished_at = 13;
  string status_message = 14;
  string error_message = 15;
}

message AttemptSummary {
  AttemptIdentity identity = 1;
  TaskState state = 2;
  string execution_cluster_id = 3;
  string backend_id = 4;
  NodeIdentity node = 5;
  iris.time.Timestamp created_at = 6;
  iris.time.Timestamp started_at = 7;
  iris.time.Timestamp finished_at = 8;
  int32 exit_code = 9;
  string error_message = 10;
  string terminal_reason = 11;
}

message AttemptRuntimeObject {
  string provider_kind = 1;
  string namespace = 2;
  string name = 3;
  string provider_uid = 4;
  string provider_node_id = 5;
  string provider_node_uid = 6;
  string container_id = 7;
  iris.time.Timestamp observed_at = 8;
}

message TaskDetail {
  TaskSummary summary = 1;
  repeated AttemptSummary attempts = 2;
  repeated ResourceSourceStatus source_statuses = 3;
  repeated string root_cause_highlights = 4;
}

message AttemptDetail {
  AttemptSummary summary = 1;
  AttemptRuntimeObject runtime = 2;
  repeated ResourceSourceStatus source_statuses = 3;
}

message PreemptTaskUpdate {}
message TerminateTaskUpdate {}
message FailTaskUpdate {}

message TaskUpdate {
  string expected_attempt_uid = 1;
  oneof intent {
    PreemptTaskUpdate preempt = 10;
    TerminateTaskUpdate terminate = 11;
    FailTaskUpdate fail = 12;
  }
}

message PreemptAttemptUpdate {}
message TerminateAttemptUpdate {}
message FailAttemptUpdate {}

message AttemptUpdate {
  oneof intent {
    PreemptAttemptUpdate preempt = 1;
    TerminateAttemptUpdate terminate = 2;
    FailAttemptUpdate fail = 3;
  }
}
