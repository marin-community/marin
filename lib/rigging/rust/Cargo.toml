[package]
name = "marin-grants"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Receiving-service verification of Marin's shared grant contract"

[workspace]

[dependencies]
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
