[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-finestore"
version = "0.1.0"
description = "finestore — an append-only columnar archive of Parquet shards on object storage."
requires-python = ">=3.12"
dependencies = [
    "marin-rigging",
    "pyarrow>=23.0.0",
]

[dependency-groups]
test = [
    "pytest>=8.3.2",
    "pytest-timeout",
]
dev = [{ include-group = "test" }]

[tool.hatch.build.targets.wheel]
packages = ["src/finestore"]

[tool.pytest.ini_options]
timeout = 60
timeout_method = "thread"
addopts = "--durations=10 -v"
log_level = "INFO"
