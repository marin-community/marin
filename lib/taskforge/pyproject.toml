[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-taskforge"
version = "0.1.0"
description = "Task generation with GLM-5.3: proposals, build programs, RolloutEngine validation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "marin-taskcompendium",
    "marin-rolloutengine",
    "marin-shellbox[shellsim]",
    "marin-verifyit",
    "marin-rigging",
    "marin-finelog",
    "marin-iris",
    "httpx>=0.27,<1",
    "openai",
    "pydantic>=2.7",
    # The capability experiment's driver, which runs in this package's environment on a pod, needs
    # click for its CLI and marin-iris to resolve the GLM relay inside an Iris task.
    "click",
    "marin-iris",
    "jsonschema>=4.20",
    # taskforge.llm.clef: Clef's tokenizer (fit_request sizes every decision read) and its download.
    "tokenizers>=0.22",
    "huggingface_hub>=1.0",
    # Its failed-run analysis is a Zephyr pipeline over the rollout records of rolloutengine.
    "marin-zephyr",
]

[dependency-groups]
test = ["pytest>=8.3", "pytest-asyncio", "pytest-timeout"]

[tool.hatch.build.targets.wheel]
packages = ["src/taskforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
addopts = "--import-mode=importlib -m 'not slow and not integration and not data_integration and not cluster and not requires_cluster and not docker and not manual and not live_glm'"
markers = [
    "slow: long-running test",
    "integration: external service",
    "data_integration: external data",
    "cluster: live cluster",
    "requires_cluster: live cluster",
    "docker: Docker daemon",
    "manual: explicit validation",
    "live_glm: calls the live GLM-5.3 endpoint; skips unless TASKFORGE_GLM_BASE_URL and GLM_HIGH_TOKEN are set",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["taskforge"]

[tool.pyrefly]
disable-project-excludes-heuristics = true
project-includes = ["src", "tests", "../../experiments/post_training/capability_driven_envs"]
search-path = [
    "src",
    ".",
    "../..",
    "../taskcompendium/src",
    "../rolloutengine/src",
    "../shellbox/src",
    "../verifyit/src",
    "../rigging/src",
    "../finelog/src",
    "../iris/src",
]
python-interpreter = "../../.venv/bin/python"
