[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-taskforge"
version = "0.1.0"
description = "Effect-driven task generation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "marin-taskcompendium",
    "marin-iris",
    "marin-rolloutengine",
    "marin-shellbox[shellsim]",
    "marin-verifyit",
    "marin-rigging",
    "pydantic>=2.7",
    "httpx>=0.27,<1",
    "openai",
    "typing_extensions>=4.10",
]

[dependency-groups]
test = ["pytest>=8.3", "pytest-asyncio", "pytest-timeout", "pytest-xdist", "pyrefly>=1.0.0,<1.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/taskforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Tests import shared fixtures as lib.taskforge.tests.* and the launcher as experiments.taskforge.
pythonpath = ["../.."]
timeout = 60
addopts = "--import-mode=importlib -m 'not slow and not integration and not data_integration and not cluster and not requires_cluster and not docker and not manual and not live_glm'"
markers = [
    "slow: long-running test",
    "integration: external service",
    "data_integration: external data",
    "cluster: live cluster",
    "requires_cluster: live cluster",
    "docker: Docker daemon",
    "manual: explicit validation",
    "live_glm: calls the live GLM-5.3 endpoint; skips unless TASKFORGE_GLM_BASE_URL and GLM_HIGH_TOKEN are set",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["taskforge"]

[tool.pyrefly]
disable-project-excludes-heuristics = true
use-ignore-files = false
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = [
    "src",
    ".",
    "../..",
    "../taskcompendium/src",
    "../rolloutengine/src",
    "../shellbox/src",
    "../verifyit/src",
    "../rigging/src",
]
python-interpreter = "../../.venv/bin/python"

[tool.pyrefly.errors]
unannotated-parameter = "error"
unannotated-return = "error"
