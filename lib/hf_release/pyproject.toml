[build-system]
requires = ["uv_build>=0.7.19,<0.10.0"]
build-backend = "uv_build"

[project]
name = "marin-hf-release"
version = "0.1.0"
description = "Framework-neutral Hugging Face inference release contracts"
requires-python = ">=3.12"

[tool.uv.build-backend]
module-name = "marin_hf_release"

[dependency-groups]
test = ["pytest", "pytest-xdist", "numpy", "ml-dtypes", "safetensors[numpy]>=0.4.2,<0.7.0"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -m 'not slow and not integration and not data_integration and not cluster and not requires_cluster and not docker and not manual'"
