[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-shellbox"
version = "0.1.0"
description = "Shell execution machines with local and remote backends"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
qemu = ["quicksand-qemu>=0.5.12,<0.6"]
shellsim = ["shellsim>=0.1.17,<0.2"]
gvisor = []
daytona = ["daytona==0.200.2"]
iris = [
    "marin-iris>=0.2.0",
]

[project.scripts]
shellbox-stage = "shellbox.backends.qemu.bundle:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shellbox"]

[tool.hatch.build]
artifacts = ["src/shellbox/backends/qemu/guest/init", "src/shellbox/backends/qemu/guest/disk-init", "src/shellbox/backends/qemu/guest/pty-agent.c"]

[dependency-groups]
test = ["pytest>=8"]
