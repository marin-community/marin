[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskcompendium"
version = "0.1.0"
description = "Task schemas, private grading, and Shellbox rollouts"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "tasktrove-verify",
    "marin-shellbox",
    "harbor-config",
    "pyarrow>=17",
    "marin-rigging>=0.2.123.dev35633925924",
]

[project.optional-dependencies]
harbor = ["harbor"]

[dependency-groups]
test = ["pytest>=8.3", "pytest-asyncio", "pytest-timeout", "marin-shellbox[shellsim]"]

[tool.uv.workspace]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
harbor-config = { url = "https://github.com/marin-community/harbor/releases/download/harbor-config-952a005353273590631b8f970f4664a121710b32/harbor_config-0.1.0-py3-none-any.whl" }
harbor = { git = "https://github.com/marin-community/harbor.git", rev = "ef1eaf207f41f84eb53d17f9c8bd84c073a9aba5" }
tasktrove-verify = { path = "../tasktrove-verify", editable = true }
marin-shellbox = { path = "../shellbox", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/taskcompendium"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
pythonpath = ["../.."]
addopts = "--import-mode=importlib -m 'not slow and not integration and not data_integration and not cluster and not requires_cluster and not docker and not manual'"
markers = [
    "slow: long-running test",
    "integration: external service",
    "data_integration: external data",
    "cluster: live cluster",
    "requires_cluster: live cluster",
    "docker: Docker daemon",
    "manual: explicit validation",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["taskcompendium"]

[tool.pyrefly]
disable-project-excludes-heuristics = true
project-includes = ["src"]
search-path = ["src"]
python-interpreter = ".venv/bin/python"
