[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskcompendium"
version = "0.1.0"
description = "Semantic answer tasks and Harbor direct-chat lowerings"
requires-python = ">=3.12"
dependencies = ["tasktrove-verify[answer]"]

[project.optional-dependencies]
harbor = ["harbor"]

[dependency-groups]
test = ["pytest>=8.3", "pytest-asyncio", "pytest-timeout"]

[tool.uv.workspace]

[tool.uv.sources]
tasktrove-verify = { git = "https://github.com/marin-community/marin.git", rev = "b76d03131cd88bd9fc711dba206659027edba3a8", subdirectory = "lib/tasktrove-verify" }
harbor = { git = "https://github.com/marin-community/harbor.git", rev = "ef1eaf207f41f84eb53d17f9c8bd84c073a9aba5" }

[tool.hatch.build.targets.wheel]
packages = ["src/taskcompendium"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
addopts = "--import-mode=importlib -m 'not integration and not docker and not manual'"
markers = ["integration: external service", "docker: Docker daemon", "manual: explicit validation"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["taskcompendium"]
