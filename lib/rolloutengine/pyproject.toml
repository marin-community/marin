[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-rolloutengine"
version = "0.1.0"
description = "Task execution and exact-token rollout records"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2",
    "marin-taskcompendium",
    "marin-shellbox",
]

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-asyncio",
    "pytest-timeout",
    "marin-shellbox[daytona,shellsim]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rolloutengine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
addopts = "--import-mode=importlib -m 'not slow and not integration and not data_integration and not cluster and not requires_cluster and not docker and not manual'"
markers = [
    "slow: long-running test",
    "integration: external service",
    "data_integration: external data",
    "cluster: live cluster",
    "requires_cluster: live cluster",
    "docker: Docker daemon",
    "manual: explicit validation",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["rolloutengine"]

[tool.pyrefly]
disable-project-excludes-heuristics = true
project-includes = ["src"]
search-path = ["src"]
python-interpreter = ".venv/bin/python"
