syntax = "proto3";

package levanter.inference.v1;

service Inference {
  rpc Generate(GenerateRequest) returns (GenerateResponse);
}

message GenerateRequest {
  repeated uint32 prompt_token_ids = 1;
  uint32 max_new_tokens = 2;
  optional float temperature = 3;
  optional float top_p = 4;
  optional uint32 seed = 5;
  repeated TokenSequence stop_sequences = 6;
  optional uint32 num_choices = 7;
}

message TokenSequence {
  repeated uint32 token_ids = 1;
}

message GenerateResponse {
  repeated uint32 prompt_token_ids = 1;
  repeated Choice choices = 2;
}

message Choice {
  repeated uint32 token_ids = 1;
  repeated float behavior_logprobs = 2;
  FinishReason finish_reason = 3;
}

enum FinishReason {
  FINISH_REASON_UNSPECIFIED = 0;
  FINISH_REASON_STOP = 1;
  FINISH_REASON_LENGTH = 2;
}
