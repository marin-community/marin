[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-fray"
version = "0.2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cloudpickle>=3.1.2",
    "humanfriendly>=10.0",
    "marin-rigging",
]

[project.optional-dependencies]
iris = ["marin-iris"]

[dependency-groups]
test = [
    "marin-iris",
    "pytest-timeout",
    "pytest>=8.3.2",
    "pytest-xdist",
]
fray_tpu_test = ["jax==0.11.1", "jaxlib==0.11.1", "libtpu==0.0.46.*", { include-group = "test" }]

dev = [{ include-group = "test" }]

[tool.pytest.ini_options]
addopts = "-m 'not slow and not docker' --import-mode=importlib"
pythonpath = ["src", "tests"]
markers = [
    "slow: mark tests as slow for CI - use -m 'not slow'",
    "docker: mark tests that require a Docker daemon",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fray"]
