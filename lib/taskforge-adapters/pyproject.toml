[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-taskforge-adapters"
version = "0.1.0"
description = "Taskforge's provider and cluster adapters: the GLM client, Parallel web, Iris image builds, Finelog"
requires-python = ">=3.12,<3.14"
dependencies = [
    "marin-taskforge",
    "marin-iris",
    "marin-finelog",
    "marin-rigging",
    "marin-shellbox[shellsim]",
    "httpx>=0.27,<1",
    "openai",
    "pydantic>=2.7",
    # The capability experiment's drivers, which run in this package's environment on a pod, need
    # click for their CLI; their failed-run analysis is a Zephyr pipeline over rolloutengine's records.
    "click",
    "marin-zephyr",
]

[dependency-groups]
test = ["pytest>=8.3", "pytest-asyncio", "pytest-timeout"]

[tool.hatch.build.targets.wheel]
packages = ["src/taskforge_adapters"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
addopts = "--import-mode=importlib -m 'not slow and not integration and not data_integration and not cluster and not requires_cluster and not docker and not manual and not live_glm'"
markers = [
    "slow: long-running test",
    "integration: external service",
    "data_integration: external data",
    "cluster: live cluster",
    "requires_cluster: live cluster",
    "docker: Docker daemon",
    "manual: explicit validation",
    "live_glm: calls the live GLM-5.3 endpoint; skips unless TASKFORGE_GLM_BASE_URL and GLM_HIGH_TOKEN are set",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["taskforge_adapters"]

[tool.pyrefly]
disable-project-excludes-heuristics = true
project-includes = ["src", "tests"]
search-path = [
    "src",
    ".",
    "../taskforge/src",
    "../taskcompendium/src",
    "../rolloutengine/src",
    "../shellbox/src",
    "../verifyit/src",
    "../rigging/src",
    "../finelog/src",
    "../iris/src",
]
python-interpreter = "../../.venv/bin/python"
