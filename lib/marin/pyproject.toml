[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
requires-python = ">=3.12,<3.14"

[project]
name = "marin-core"
version = "0.2.0"

requires-python = ">=3.12"
dependencies = [
    # Provides the compression.zstd module that fsspec imports to register its
    # zstd codec on Python < 3.14; required for reading/writing zstd via fsspec.
    "backports-zstd>=1.0.0; python_version < '3.14'",
    "braceexpand",
    "datasets<5.0.0",
    "draccus>=0.11.6",
    "fasttext-wheel>=0.9.2",
    "marin-fray",
    "marin-finestore",
    "marin-iris",
    "marin-rigging[prometheus]",
    "fsspec>=2025.3.0",
    "gcsfs",
    "google-api-python-client>=2.175.0",
    "google-cloud-storage",
    "huggingface-hub",
    "marin-haliax",
    "jax>=0.9.2,<0.12",
    "jaxopt>=0.8.3",
    "marin-levanter[serve]",
    "transformers>=5.5.3,<6.0",
    "markdownify>=0.14.1",
    "mcp>=1.28.1",
    "msgspec>=0.18.0",
    "numpy",
    "openai",
    "pandas>=2.0",
    "plotly",
    "pyarrow>=23.0.0",
    "regex",
    "requests>=2.33.0",
    "resiliparse>=0.17.2",
    "s3fs>=2024",
    "tqdm",
    "tqdm-loggable",
    "wandb>0.24.0",
    "marin-zephyr",
]

[project.license]
file = "../../LICENSE"

[project.scripts]
marin-mcp-babysitter = "marin.mcp.babysitter:main"
marin-serve = "marin.inference.serve_cli:main"

[dependency-groups]
test = [
    "pytest>=8.3.2",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-timeout",
    # for scaling law plotting tests
    "plotly",
]
lint = [
    "ruff==0.14.3",
    "black>=26.3.1",
    "pyrefly>=1.0.0,<1.1.0",
    "types-PyYAML",
    "types-requests",
    "click>=8.0",
    "pyyaml>=6.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings>=0.24.0",
    "mkdocstrings-python>=1.7.0",
    "pymdown-extensions>=10.0.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mkdocs-git-authors-plugin>=0.9.0",
    "mkdocs-minify-plugin>=0.7.0",
    "mkdocs-include-markdown-plugin>=7.1.5",
]

dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.uv]
conflicts = [
    [
        { extra = "gpu" },
        { extra = "tpu" },
    ],
    [
        { extra = "gpu" },
        { extra = "cpu" },
    ],
]


[project.optional-dependencies]

gpu = [
  "jax[cuda13]==0.11.1",
  # B200 emits a cuBLAS warning with older CUDA 13 cuBLAS builds.
  "nvidia-cublas>=13.2.0.9; sys_platform == 'linux'",
  # Preserve the CoreWeave H100 all-to-all guard under CUDA 13.
  # 2.29.3 carries the upstream aarch64 proxy freeOps CAS leak fix, which a Grace host needs.
  "nvidia-nccl-cu13>=2.29.3; sys_platform == 'linux'",
  # FA4 CuTe/THD attention backends.
  "nvidia-cutlass-dsl[cu13]==4.6.0; sys_platform == 'linux'",
  "flash-attn-4[cu13]>=4.0.0b16,<4.1; sys_platform == 'linux'",
  # Optional raw Sonic MoE gather/combine backend. Keep jax-triton exact:
  # 0.3.0 is missing the CUDA backend API needed by our current stack.
  "jax-triton==0.3.1; sys_platform == 'linux'",
  # This module imports Triton directly; stay on the tested minor without
  # forcing an exact patch version.
  "triton>=3.6.0,<3.7; sys_platform == 'linux'",
  "torch==2.11.0",
  "torchvision==0.26.0",
]
tpu = [
  "jax==0.11.1",
  "jaxlib==0.11.1",
  "libtpu==0.0.46.*",
  "torch==2.11.0",
  # Linux x86_64
  "torchvision==0.26.0+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # Windows x86_64 (AMD64)
  "torchvision==0.26.0+cpu; sys_platform == 'win32' and platform_machine == 'AMD64'",
  # Linux aarch64, macOS arm64: PyPI default wheel
  "torchvision==0.26.0; (sys_platform == 'linux' and platform_machine == 'aarch64') or (sys_platform == 'darwin' and platform_machine == 'arm64')",
]

cpu = [
  "jax==0.11.1",
  "torch==2.11.0",
  # Linux x86_64
  "torchvision==0.26.0+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # Windows x86_64 (AMD64)
  "torchvision==0.26.0+cpu; sys_platform == 'win32' and platform_machine == 'AMD64'",
  # Linux aarch64, macOS arm64: PyPI default wheel
  "torchvision==0.26.0; (sys_platform == 'linux' and platform_machine == 'aarch64') or (sys_platform == 'darwin' and platform_machine == 'arm64')",
]

# Evalchemy runs from a commit-pinned uvx environment against a served OpenAI URL, so lm-eval does
# not share Marin's project environment. See marin.evaluation.evalchemy.runtime.

vizier = [
    "google-vizier[jax]",
]

dedup = [
    # Pure-Python workspace member; it pulls the native marin-dupekit-native
    # kernels transitively (see lib/dupekit/pyproject.toml).
    "marin-dupekit",
]

datakit = [
    "luxical",
    "huggingface-hub",
    "faiss-cpu",
    "scikit-learn",
    "scipy",
    "duckdb>=1.0.0",
]

# PDF-only dependencies for experiments/datakit/build_pdf_source/*; kept out of `datakit` so plain
# datakit fleet jobs don't install the PDF toolchain.
pdf = [
    # Reads WARC response records out of Common Crawl byte ranges
    # (experiments/datakit/build_pdf_source/fetch.py).
    "warcio>=1.7.5",
    # Rasterises pages for the VLM feed and measures render geometry before the router decides
    # (experiments/datakit/build_pdf_source/ocr_extract/render.py). PDFium through its Python
    # bindings, replacing AGPL PyMuPDF, which this was the last runtime use of once the router's
    # feature pass and the Docling route were removed. BSD-3-Clause renderer, Apache-2.0 OR
    # BSD-3-Clause bindings.
    #
    # The swap is a licensing decision that had to clear a quality bar, and it did:
    # adjudicated blind and two-way over 715 pages in eight strata, the model's reading of a
    # PDFium-rendered page is preferred 0.481 to 0.498 of the time corpus-page-weighted, every one
    # of five arms containing the 0.500 null. It is also cheaper (rasterises 1.21x faster on x86,
    # 1.43x on aarch64) and operationally cleaner: zero native aborts in 3,577,944 renders against
    # MuPDF's one deterministic SIGSEGV over the same corpus
    # (pdfium-evaluation.md, on the mark/pdf_processing campaign branch).
    #
    # Pinned exactly. The vendored PDFium version moves independently of the binding's, and both
    # the router's `mean_render_dpi` feature and the page dimensions the feed sends the model are
    # this build's output. py3-none manylinux_2_17 wheels for x86_64 and aarch64, so it resolves on
    # the Emerald Rapids and Grace pools and on macOS, unlike pdf-inspector below.
    "pypdfium2==5.13.0",
    # Encodes the rendered page. PNG encoding is ~65% of the feed's cost, and Pillow at
    # compress_level=1 decodes byte-identical to both MuPDF's encoder and Pillow's own level 6 on
    # 3,014 of 3,014 measured pages while being 1.16x/1.46x faster, so it is the one lever that cut
    # feed cost with provably identical pixels. Previously arrived transitively through docling.
    "pillow>=12.2.0",
    # The CPU build. Plain `xgboost` depends on nvidia-nccl-cu12, which installs its library at the
    # same `nvidia/nccl/lib/libnccl.so.2` that torch's nvidia-nccl-cu13 owns, so whichever lands
    # last wins for the whole venv. datakit runs on the CPU fleet and only calls
    # `Booster.inplace_predict` (classify.py), so the GPU build buys nothing and costs a latent
    # library collision.
    "xgboost-cpu>=3.0.5",
    # The CPU extraction route: a Rust PDF classifier and Markdown extractor
    # (experiments/datakit/build_pdf_source/extract_inspector.py). It replaced Docling, which cost
    # 278 CPU core-hours per million pages against this library's 2.1 -- 132x -- for corpus-wide
    # quality parity on a CPU-constrained cluster; `docling`, `openvino` and `nncf` retired with it,
    # along with the INT8 layout graph that existed to make it affordable
    # (experiments/datakit/build_pdf_source/pdf-inspector-evaluation.md).
    #
    # Pinned exactly. It is a native extension whose parsing limits and timings move release to
    # release -- 1.17.0 extracts 1.77x slower than 1.14.1, with a p99 ratio of 10.5x -- and the
    # router's booster was fit on columns this build produced, so a different build shifts the
    # feature distribution its threshold was calibrated against. The extraction step checks the
    # installed version in its worker before reading a document. Ships abi3 manylinux wheels for
    # x86_64 and aarch64, so it resolves on both the Emerald Rapids and Grace pools, and on neither
    # macOS nor any other platform: local test runs must not depend on it.
    #
    # The published wheel compiles in an OCR engine: the crate's `python` feature implies `ocr`,
    # which implies `render-pdfium`, `ocr-oar` and `model-download`, so the binary carries PDFium
    # bindings, ONNX Runtime bindings and a ureq HTTP client that fetches model files over HTTPS.
    # It stays inert on the entry points this repository calls. `detect_pdf_bytes` and
    # `extract_pages_markdown_bytes` reach `detect_pdf_mem` and `extract_pages_markdown_mem`,
    # neither of which references `crate::vision`; the OCR pipeline, its model download and its
    # external runtimes are reachable only from `process_pdf_with_ocr` and
    # `process_pdf_with_ocr_bytes`, which nothing here calls, and no environment variable enables
    # any of it implicitly. Measured as well as read: over 1,000 crawl PDFs on each architecture the
    # worker held zero sockets between documents and wrote zero model-cache files.
    "pdf-inspector==1.17.0",
]

[[tool.uv.index]]
name = "marin-resiliparse"
url = "https://marin-community.github.io/chatnoir-resiliparse/simple"

[tool.uv.sources]
torchvision = [
    # Default to the CPU index for TPU/CPU builds
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cpu", extra = "tpu" },
    # PyTorch cu130 pins an older cuBLAS than the B200 guard above allows.
    { index = "pytorch-cu128", extra = "gpu", marker = "sys_platform == 'linux'" },
]
resiliparse = { index = "marin-resiliparse" }
torch = [
    # PyTorch cu130 pins an older cuBLAS than the B200 guard above allows.
    { index = "pytorch-cu128", extra = "gpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cpu", extra = "tpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/marin"]
# The serving dashboard's node project lives inside the package for colocation;
# only its build artifact (serve_dashboard.html) ships.
exclude = ["src/marin/inference/dashboard"]

[tool.hatch.build.targets.sdist]
packages = ["src/marin"]
exclude = [
  "src/marin/inference/dashboard/node_modules",
  "src/marin/inference/dashboard/dist",
  "src/marin/inference/dashboard/.rsbuild",
]
