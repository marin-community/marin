[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-mariner"
version = "0.1.0"
description = "MARINER, an epoch-aware surrogate for choosing a pretraining data mixture from a swarm of proxy runs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.3.5,<3",
    "pandas>=2.2.2,<3",
    "pyarrow>=17",
    "scikit-learn>=1.8,<2",
    "scipy>=1.17,<2",
    "threadpoolctl>=3.2",
]

[project.optional-dependencies]
# Exact pins: on the 2,048-block grid, the trained Olmix mixtures lie 0.020 block (Uncheatable) and 0.036 block
# (OlmoBaseEval Easy) from the nearest rounding boundary that a change of solver can reach, and the paper's solve and
# these releases put the continuous weights up to 0.025 block apart, so another release can round to another mixture.
olmix = ["cvxpy==1.9.2", "clarabel==0.11.1"]
download = ["huggingface-hub>=1.0"]

[project.scripts]
mariner = "mariner.cli:main"

[dependency-groups]
test = ["pytest>=8.3.2", "pytest-timeout", "pytest-xdist"]

[tool.hatch.build.targets.wheel]
packages = ["src/mariner"]

[tool.pytest.ini_options]
timeout = 60
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["data_integration: reads a local mariner-data snapshot (pass --mariner-data DIR); run by hand"]
addopts = "-m 'not data_integration' --import-mode=importlib"
